// ============================================================
// 영어 동사 활용형 생성기, "loop" → [loop, loops, looped, looping]
// 룰: 3인칭 단수 -s/-es/-ies, 과거 -ed/-d/-ied/-CVCed, 진행 -ing/-CVCing/-e+ing
// 완벽한 형태소 분석 아님, 흔한 활용형 다 잡기 위한 휴리스틱
// ============================================================
function _verbForms(v) {
  v = (v || "").toLowerCase();
  if (!v) return [];
  const forms = new Set([v]);
  const last = v.slice(-1);
  const last2 = v.slice(-2);
  // 3인칭 단수
  if (/(s|x|z|ch|sh)$/.test(v))      forms.add(v + "es");
  else if (/[^aeiou]y$/.test(v))     forms.add(v.slice(0, -1) + "ies");
  else                                forms.add(v + "s");
  // 과거형
  if (last === "e")                  forms.add(v + "d");
  else if (/[^aeiou]y$/.test(v))     forms.add(v.slice(0, -1) + "ied");
  else if (/[^aeiou][aeiou][^aeiouwxy]$/.test(v) && v.length >= 3) {
    forms.add(v + last + "ed");      // CVC: stop → stopped
    forms.add(v + "ed");
  } else                              forms.add(v + "ed");
  // 진행형 -ing
  if (last === "e" && last2 !== "ee" && v.length > 2) forms.add(v.slice(0, -1) + "ing");
  else if (/[^aeiou][aeiou][^aeiouwxy]$/.test(v) && v.length >= 3) {
    forms.add(v + last + "ing");     // stopping
    forms.add(v + "ing");
  } else                              forms.add(v + "ing");
  return [...forms];
}

function _escapeRegex(s) {
  return (s || "").replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
}

// 문장에 타깃 단어가 들어있는지 (활용형 포함) 검사.
// 1차: 그대로 substring 매치 (가장 빠름, 명사·약어·하이픈 단어에 강함)
// 2차: 첫 토큰을 동사로 보고 활용형 정규식, 다중어 구는 인접 매치 가정
//     예) target "loop in", sentence "looping in @design-lead" → 매치
function _hasTargetWord(sentence, targetWord) {
  if (!targetWord || !sentence) return false;
  const lower = sentence.toLowerCase();
  const target = (targetWord || "").toLowerCase().trim();
  if (!target) return false;
  if (lower.includes(target)) return true;
  const tokens = target.split(/\s+/).filter(Boolean);
  if (!tokens.length) return false;
  const head = "(?:" + _verbForms(tokens[0]).map(_escapeRegex).join("|") + ")";
  const tail = tokens.slice(1).map(_escapeRegex).join("\\s+");
  const pattern = tail
    ? "(^|[^a-z])" + head + "\\s+" + tail + "([^a-z]|$)"
    : "(^|[^a-z])" + head + "([^a-z]|$)";
  try { return new RegExp(pattern, "i").test(sentence); }
  catch (_) { return false; }
}

// ============================================================
// 사수 피드백, 룰 기반 (5체크 + 시나리오별 코멘트)
// ============================================================
function _classifyMentorFeedback(sentence, scenario) {
  const word = (scenario.word || "").toLowerCase();
  const lower = sentence.toLowerCase();
  const wordCount = sentence.trim().split(/\s+/).filter(Boolean).length;

  const hasWord    = _hasTargetWord(sentence, scenario.word);
  const tooFormal  = /\b(pursuant|kindly|hereby|aforementioned|herein|thereof|wherein)\b/i.test(sentence);
  const tooCasual  = /\byo\b|\bhey\b|\blol\b|\bomg\b|\bpls\b|\bthx\b/i.test(sentence);
  const hasAction  = /\bI'll\b|\bI will\b|\blet me\b|\bI'm\s+(?:going|gonna)\b|\bI can\b/i.test(sentence);
  const hasTiming  = /\b(eod|cob|asap|today|tonight|tomorrow|monday|tuesday|wednesday|thursday|friday|next week|this week|by \w+)\b|\d/i.test(sentence);
  const tooShort   = wordCount < 5;
  const tooLong    = wordCount > 30;
  const isExample  = sentence.trim() === (scenario.sampleAnswer || "").trim();

  // 체크 결과 배열
  const checks = [];
  checks.push(hasWord
    ? { ok: true,  label: "단어 사용",   note: `${scenario.word} 자연스럽게 들어감` }
    : { ok: false, label: "단어 사용",   note: `${scenario.word} 못 살림, 한 번 더 써보자` });

  if (tooFormal)      checks.push({ ok: false, label: "톤", note: "너무 격식, 사내 메시지엔 부담" });
  else if (tooCasual) checks.push({ ok: false, label: "톤", note: "사내 톤으로는 살짝 가벼움" });
  else                checks.push({ ok: true,  label: "톤", note: "사내 메시지로 적절" });

  if (hasAction)      checks.push({ ok: true,  label: "Action", note: "주체·행동 명확함" });
  if (hasTiming)      checks.push({ ok: true,  label: "구체성", note: "시점·숫자가 보여서 신뢰감 있음" });

  if (tooShort)       checks.push({ ok: false, label: "길이", note: "조금 더 풀어 써도 좋아" });
  else if (tooLong)   checks.push({ ok: false, label: "길이", note: "한 호흡 짧게, 슬랙은 짧을수록 좋아" });

  // ── 헤드라인 풀: 같은 케이스라도 매번 다른 멘트 (피드백 #10, 반복 멘트 다양화) ──
  // 같은 문장은 같은 멘트(저장·복원 일관성), 문장을 고치면 멘트도 바뀜.
  const _pickV = (pool) => pool[(scenario.day + wordCount + sentence.length) % pool.length];
  const W = scenario.word;
  let headline;
  if (isExample) {
    headline = _pickV([
      "예시 문장 그대로 제출하셨네요. 본인 표현으로 한 번 써보시면 더 늘어요.",
      "예문 참고는 좋아요. 한 단어라도 본인 상황으로 바꿔보시면 기억에 세 배 오래 남아요.",
      "모범 답안은 출발점이에요. 내일은 본인 문장으로 한 줄, 약속해요.",
    ]);
  } else if (!hasWord) {
    headline = _pickV([
      `${W}이(가) 빠졌어요. 오늘 단어를 꼭 써봐야 입에 붙어요.`,
      `문장은 자연스러운데 정작 ${W}이(가) 없네요. 오늘의 주인공을 살려주세요.`,
      `${W} 없이도 말은 되지만, 오늘 미션의 핵심은 그 단어를 입에 붙이는 거예요.`,
    ]);
  } else if (tooFormal) {
    headline = _pickV([
      "단어는 잘 살리셨는데 표현이 조금 무거워요. 슬랙 한 줄 정도의 가벼움이 좋아요.",
      "계약서 번역투에 가까워요. 동료에게 말하듯 푸시면 같은 내용도 훨씬 잘 통해요.",
      "격식은 충분해요. 이제 힘을 빼보세요. 비즈니스 영어의 고수는 쉬운 단어로 말해요.",
    ]);
  } else if (tooCasual) {
    headline = _pickV([
      `톤이 조금 가벼워요. ${W}을(를) 잘 살리셨으니 사내 채널용으로 무게만 살짝 더해보세요.`,
      `친구에게 보내는 톤이에요. ${W}은(는) 좋았으니 인사말만 사내용으로 바꿔보세요.`,
    ]);
  } else if (tooShort) {
    headline = _pickV([
      "한 줄로는 의도가 안 보일 수 있어요. 누가/언제/뭘 한다 정도까지 풀어보세요.",
      "짧은 건 좋은데 정보가 조금 부족해요. 받는 사람이 되묻지 않게 한 조각만 더해주세요.",
      "핵심은 있는데 살이 조금 부족해요. 누가/언제까지 중 하나만 더 얹어보세요.",
    ]);
  } else if (tooLong) {
    headline = _pickV([
      "내용은 좋은데 조금 길어요. 한 호흡으로 끊으시면 임팩트가 더 살아요.",
      "정성이 보여요. 다만 슬랙에선 긴 글부터 안 읽히니 절반으로 줄여볼까요?",
      "좋은 내용이 길이에 묻혔어요. 가장 중요한 문장 하나만 남겨보세요.",
    ]);
  } else if (hasAction && hasTiming) {
    headline = _pickV([
      `완벽에 가까워요. ${W} + 행동 + 시점까지, 사수가 더 볼 게 없는 문장이에요.`,
      "이 문장 그대로 보내셔도 돼요. 단어, 행동, 시점 세 박자가 다 잡혔어요.",
      `오늘 건 노트에 저장해두세요. ${W} 실전 활용의 교과서 같은 문장이에요.`,
    ]);
  } else if (hasAction) {
    headline = _pickV([
      "오늘 단어 자연스럽게 들어갔고, action까지 명확. 이대로면 회의에서도 통해요.",
      `${W} 활용도 정확하고 주체도 분명해요. 끝에 by Friday 같은 시점 하나만 넣으면 만점이에요.`,
      "사수 입장에서 반가운 답이에요. 뭘 하겠다는 게 보여요. 언제까지인지만 더해보세요.",
      `이 정도면 Daniel에게 바로 보내셔도 돼요. ${W} 감을 제대로 잡으셨어요.`,
    ]);
  } else {
    headline = _pickV([
      `${W} 잘 들어갔어요. 다음엔 "I'll …" 같은 액션 동사를 더해보시면 더 프로페셔널해져요.`,
      `${W} 자연스러워요. 여기에 '언제까지 뭘 하겠다'까지 붙으면 사수가 안심해요.`,
      `${W} 쓰임새가 정확해요. 욕심내자면 주어를 I로 세워서 다음 행동을 약속해보세요.`,
      `${W} 감을 잡으셨네요. 받은 공을 되돌려주는 한 마디(다음 행동)까지 붙이면 완성이에요.`,
      "깔끔하게 들어갔어요. 끝에 EOD나 tomorrow 같은 시점 하나만 넣어보세요. 신뢰도가 달라져요.",
    ]);
  }

  // 전체 통과 여부 (4개 이상 ok이면 우수)
  const okCount = checks.filter(c => c.ok).length;
  const overall = isExample ? "neutral" : okCount >= checks.length - 1 ? "good" : "needs-work";

  return { checks, headline, overall, isExample };
}

// 영작 첨삭 단어 단위 diff (모델 segments가 없을 때 프론트에서 취소선 생성)
function _odWordDiff(orig, corrected) {
  const tok = (s) => String(s || "").trim().split(/(\s+)/).filter(t => t.length);
  const a = tok(orig), b = tok(corrected);
  const n = a.length, m = b.length;
  if (!n || !m) return [];
  const eq = (x, y) => x === y || x.trim().toLowerCase() === y.trim().toLowerCase();
  const dp = Array.from({ length: n + 1 }, () => new Array(m + 1).fill(0));
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--)
    dp[i][j] = eq(a[i], b[j]) ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const out = [];
  const push = (type, text) => { if (!text) return; const last = out[out.length - 1]; if (last && last.type === type) last.text += text; else out.push({ type, text }); };
  let i = 0, j = 0;
  while (i < n && j < m) {
    if (eq(a[i], b[j])) { push("keep", b[j]); i++; j++; }
    else if (dp[i + 1][j] >= dp[i][j + 1]) { push("removed", a[i]); i++; }
    else { push("added", b[j]); j++; }
  }
  while (i < n) { push("removed", a[i]); i++; }
  while (j < m) { push("added", b[j]); j++; }
  return out;
}

// 내 시추에이션(JournalActivity) 저장/조회 헬퍼
// __OD_USER.dailyJournals[dayKey] = { text, day, savedAt }
function _loadDailyJournal(day) {
  try {
    const u = JSON.parse(localStorage.getItem("__OD_USER") || "null");
    return u?.dailyJournals?.[String(day)] || null;
  } catch (e) { return null; }
}
function _saveDailyJournal(day, text) {
  if (!text || !text.trim()) return false;
  try {
    const raw = localStorage.getItem("__OD_USER");
    const u = raw ? JSON.parse(raw) : {};
    u.dailyJournals = u.dailyJournals || {};
    const dayKey = String(day);
    u.dailyJournals[dayKey] = {
      text: text.trim(),
      day: day,
      savedAt: new Date().toISOString(),
    };
    localStorage.setItem("__OD_USER", JSON.stringify(u));
    // ★ 새 RPC 경로 (1row=1journal). 실패 시 outbox로 큐잉, 60초마다 자동 재시도.
    if (window.OD && window.OD.enabled && window.OD.saveJournalRow && u.email) {
      const t = text.trim();
      window.OD.saveJournalRow(u.email, day, t).then(r => {
        if (!r || !r.ok) {
          window.OD.pushOutbox && window.OD.pushOutbox({ type: 'journal', email: u.email, day: day, text: t });
        }
        window.OD.sendSlackMirror && window.OD.sendSlackMirror({ type: 'journal', email: u.email, day: day, text: t });
      }).catch(() => {
        window.OD.pushOutbox && window.OD.pushOutbox({ type: 'journal', email: u.email, day: day, text: t });
      });
    }
    return true;
  } catch (e) { console.warn("saveDailyJournal failed:", e); return false; }
}

// scenariosCompleted 저장/조회 헬퍼
function _loadCompletion(day) {
  try {
    const u = JSON.parse(localStorage.getItem("__OD_USER") || "null");
    return (u?.scenariosCompleted || []).find(s => s.day === day) || null;
  } catch (e) { return null; }
}
function _saveCompletion(entry) {
  try {
    const raw = localStorage.getItem("__OD_USER");
    const u = raw ? JSON.parse(raw) : {};
    u.scenariosCompleted = u.scenariosCompleted || [];
    const idx = u.scenariosCompleted.findIndex(s => s.day === entry.day);
    if (idx >= 0) u.scenariosCompleted[idx] = entry;
    else u.scenariosCompleted.push(entry);
    localStorage.setItem("__OD_USER", JSON.stringify(u));

    // ★ 새 정규화 경로 (submissions + submissions_history append-only).
    // write-through verify, 실패 시 outbox 큐잉, Slack 미러로 외부 보험.
    if (window.OD && window.OD.enabled && window.OD.saveSubmission && u.email) {
      // 영작 본문 필드, mainboard 코드 흐름은 entry.sentence (4416번 라인의 _saveCompletion 호출 기준).
      // 다른 호출자 호환 위해 sentence > userAnswer > answer > text 순서로.
      const answerText = entry.sentence || entry.userAnswer || entry.answer || entry.text || '';
      if (answerText.trim()) {
        const payload = {
          word: entry.word || null,
          scenario_id: entry.scenarioId || (String(entry.day) + ':' + (entry.word || '')),
          answer_text: answerText,
          mc_choice: entry.mcChoice || null,
          mentor_feedback: entry.feedback || entry.mentorFeedback || {},
          meta: { submittedAt: entry.submittedAt || new Date().toISOString(), raw: entry },
        };
        window.OD.saveSubmission(u.email, entry.day, payload).then(r => {
          if (!r || !r.ok || !r.verified) {
            window.OD.pushOutbox && window.OD.pushOutbox({ type: 'submission', email: u.email, day: entry.day, payload });
          }
          window.OD.sendSlackMirror && window.OD.sendSlackMirror({ type: 'submission', email: u.email, day: entry.day, payload });
        }).catch(() => {
          window.OD.pushOutbox && window.OD.pushOutbox({ type: 'submission', email: u.email, day: entry.day, payload });
        });
      }
    }
  } catch (e) { console.warn("saveCompletion failed:", e); }
}

  const [aiFb, setAiFb] = useState(saved?.feedback?.aiFb || null);

  // ★ 피드백 #23 (박은실): 버디 대화는 우하단 메신저 도크로 분리 (모달 속 스크롤 제거)

  const [buddyQ, setBuddyQ] = useState("");        // AI Q&A 자유 질문 입력

  const _dockLogRef = React.useRef(null);
  React.useEffect(() => {

  function handleSubmit() {
    const fb = _classifyMentorFeedback(draft, scenario);

    setSubmitted(true);
    setEditing(false);
    setAiFb(null);
    setNativeSaved(false);
    _saveCompletion({
      day: scenario.day,
      word: scenario.word,
      sentence: draft,

    // ★ AI 사수 코멘트 (실패/느리면 규칙 기반 피드백만 유지, 폴백)
    //    예시 그대로 낸 경우엔 AI 호출 생략 (본인 문장 아니라 코칭 의미 없음)

      // 직전 AI 추천 문장 전달: 추천을 그대로 반영해 재제출하면 또 딴 버전으로 안 되돌리게 (왔다갔다 버그 방지)
      const _prevAiCorrected = (() => {
        try { const c = _loadCompletion(scenario.day); return (c && c.feedback && c.feedback.aiFb && c.feedback.aiFb.corrected) || ""; } catch (e) { return ""; }
      })();
      window.OD.getMentorAiFeedback({

  function askBuddy(kind) {

    const customAnswer = scenario.buddyAnswers && scenario.buddyAnswers[kind];

      const pool = BUDDY_ANSWERS[kind] || BUDDY_ANSWERS.default;

    })();
    const userQ = kind === "nuance" ? "이거 뉘앙스가 좀 헷갈려요" : kind === "example" ? "예문 더 보고 싶어요" : "이 표현 어떻게 외우면 좋을까요?";
    setBuddyMsgs([...buddyMsgs, { from: "me", text: userQ }, { from: "buddy", text: reply, kind: kind }]);
  }

  // 자유 질문 AI Q&A: 표현에 대해 직접 물어보면 사수(AI)가 답한다 (mentor-feedback qa 모드)
  async function askBuddyFree() {
    const q = buddyQ.trim();
    if (!q || buddyAsking) return;
    setBuddyQ("");

        });

          if (r.qa.exampleEn) t += "\n\n📌 " + r.qa.exampleEn + (r.qa.exampleKo ? "\n" + r.qa.exampleKo : "");
          replyText = t;
        }

    } catch (e) {}
    if (!replyText) replyText = "지금은 답변을 불러오지 못했어요. 잠시 후 다시 물어봐 주세요. (또는 아래 버튼으로 뉘앙스·예문·암기 팁을 바로 받아보실 수 있어요.)";
    setBuddyMsgs(prev => {
      const copy = prev.slice();
      for (let i = copy.length - 1; i >= 0; i--) { if (copy[i].pending) { copy[i] = { from: "buddy", text: replyText, kind: "qa" }; break; } }
      return copy;

          window.OD.sendSlackMirror && window.OD.sendSlackMirror({ type: 'note', email: u.email, day: dayInt, text: noteEntry.text, kind: noteEntry.kind });
        }).catch(() => {

// 인터랙티브 투어, 타겟 사각형 기준 툴팁 위치 계산
function _computeTooltipPos(rect, placement) {
  const vw = window.innerWidth, vh = window.innerHeight;
  const PAD = 16;
  const isNarrow = vw < 600;
  // 모바일에선 width를 viewport에 맞춰서 줄임 (좌우 16px 마진)
  const TT_W = isNarrow ? Math.min(360, vw - 32) : 360;
  const TT_H = isNarrow ? 240 : 200;

  // ── 모바일: spotlight와 학습 영역 안 가리게, 화면 상/하단 고정 ──
  // target이 화면 상반부면 툴팁은 하단, 하반부면 상단. 절대 spotlight 옆에 안 붙음.
  if (isNarrow) {
    const left = Math.max(PAD, (vw - TT_W) / 2);
    const targetMidY = rect.top + rect.height / 2;
    const halfVh = vh / 2;
    let top;
    if (targetMidY < halfVh) {
      // target이 상반부 → 툴팁 하단 fixed
      top = vh - TT_H - PAD - 12;
    } else {
      // target이 하반부 → 툴팁 상단 fixed (safe-area 고려)
      top = PAD + 56;
    }
    top = Math.max(PAD, Math.min(vh - TT_H - PAD, top));
    return { left, top, placement: 'mobile' };
  }

  // ── 데스크탑: placement 기준 + 부족하면 fallback ──
  let p = placement || "auto";
  if (p === "auto") {
    if (rect.right + TT_W + PAD < vw) p = "right";
    else if (rect.left - TT_W - PAD > 0) p = "left";
    else if (rect.bottom + TT_H + PAD < vh) p = "bottom";
    else p = "top";
  }
  // 지정된 placement에 공간 없으면 자동 fallback
  if (p === "right" && rect.right + TT_W + PAD > vw) p = (rect.left - TT_W - PAD > 0) ? "left" : "bottom";
  if (p === "left"  && rect.left  - TT_W - PAD < 0)  p = (rect.right + TT_W + PAD < vw) ? "right" : "bottom";

  let left, top;
  switch (p) {
    case "right":  left = rect.right + PAD;          top = rect.top + rect.height/2 - TT_H/2; break;
    case "left":   left = rect.left - TT_W - PAD;    top = rect.top + rect.height/2 - TT_H/2; break;
    case "top":    left = rect.left + rect.width/2 - TT_W/2; top = rect.top - TT_H - PAD;     break;
    case "bottom":
    default:       left = rect.left + rect.width/2 - TT_W/2; top = rect.bottom + PAD;
  }
  left = Math.max(PAD, Math.min(vw - TT_W - PAD, left));
  top  = Math.max(PAD, Math.min(vh - TT_H - PAD, top));
  return { left, top, placement: p };
}

// 음성, 남/여 번갈아 (할아버지 보이스 회피)
window.__OD_VOICE_TURN = window.__OD_VOICE_TURN || 0;
const _VOICE_FEMALE = ["Samantha", "Karen", "Tessa", "Kate", "Allison", "Victoria", "Susan", "Ava", "Moira", "Isha", "Joanna", "Salli"];
const _VOICE_MALE   = ["Alex", "Daniel", "Aaron", "Tom", "Lee", "Oliver", "Arthur", "Reed", "Rocko", "Joey", "Matthew"];
function _pickVoice() {
  if (!("speechSynthesis" in window)) return null;
  const voices = window.speechSynthesis.getVoices();
  if (!voices.length) return null;
  const turn = window.__OD_VOICE_TURN++;
  const wantFemale = turn % 2 === 0;
  const tryList = (names) => {
    for (const name of names) {
      const v = voices.find(v => v.name.toLowerCase().includes(name.toLowerCase()) && v.lang.toLowerCase().startsWith("en"));
      if (v) return v;
    }
    return null;
  };
  return tryList(wantFemale ? _VOICE_FEMALE : _VOICE_MALE)
    || tryList(wantFemale ? _VOICE_MALE : _VOICE_FEMALE)
    || voices.find(v => v.lang === "en-US")
    || voices.find(v => v.lang.toLowerCase().startsWith("en"))
    || voices[0];
}
function _speakWord(word) {
  if (!("speechSynthesis" in window) || !word) return;
  const fire = () => {
    try { window.speechSynthesis.cancel(); } catch (e) {}
    const u = new SpeechSynthesisUtterance(word);
    u.lang = "en-US"; u.rate = 0.92; u.pitch = 1.0;
    const v = _pickVoice();
    if (v) u.voice = v;
    window.speechSynthesis.speak(u);
  };
  // 첫 호출 시 voices 비어있을 수 있음 → 짧게 기다렸다 재시도
  if (!window.speechSynthesis.getVoices().length) setTimeout(fire, 250);
  else fire();
}
// 페이지 로드 시 voices 미리 로드 트리거
if ("speechSynthesis" in window) {
  try { window.speechSynthesis.getVoices(); } catch(e) {}
  window.speechSynthesis.onvoiceschanged = () => { /* warm */ };
}

function _pickField(currentWord, count, key) {
  const { SCENARIOS, USER } = window.__SIM;
  const pool = SCENARIOS
    .filter(s => s.word !== currentWord && s.day <= Math.max(USER.wordsCollected + 5, 12))
    .map(s => s[key])
    .filter(Boolean);
  return _shuf([...new Set(pool)]).slice(0, count);
}
function _pickWordObjects(excludeWord, count) {
  const { SCENARIOS, USER } = window.__SIM;
  const pool = SCENARIOS.filter(s => s.word !== excludeWord && s.day <= Math.max(USER.wordsCollected, 12));
  return _shuf(pool).slice(0, count);
}

            </div>
            <textarea value={improvement} onChange={e => setImprovement(e.target.value)}
              placeholder="아직까진 괜찮아요 / 자유롭게"
              rows={2}
              style={{
                width: "100%", padding: "10px 12px", fontSize: 13, lineHeight: 1.6,
                border: "1px solid var(--line)", borderRadius: 6, fontFamily: "inherit",

              fontSize: 13, cursor: "pointer", fontFamily: "inherit", textDecoration: "underline",
            }}>건너뛰기</button>
            <button onClick={handleSubmit} disabled={submitting || !hasInput}
              className="btn btn-primary" style={{
                padding: "10px 22px", fontSize: 14, fontWeight: 700,
                opacity: (submitting || !hasInput) ? 0.45 : 1,
                cursor: (submitting || !hasInput) ? "not-allowed" : "pointer",

}

// 작은 정답/오답 피드백 박스
function FeedbackBox({ ok, correct, hint }) {
  return (
    <div style={{
      marginTop: 14, padding: 14,
      background: ok ? "rgba(74,124,89,0.10)" : "rgba(178,58,44,0.08)",
      border: "1px solid " + (ok ? "rgba(74,124,89,0.4)" : "rgba(178,58,44,0.35)"),
      borderRadius: 8,
    }}>
      <div style={{ fontSize: 13, fontWeight: 800, color: ok ? "var(--green)" : "var(--stamp-red)", marginBottom: 6 }}>
        {ok ? "✓ 정답!" : "✗ 다음 번엔 이거"}
      </div>
      {!ok && correct ? <div style={{ fontSize: 13, color: "var(--ink)", marginBottom: 6 }}>👉 <b>{correct}</b></div> : null}
      {hint ? <div style={{ fontSize: 12, color: "var(--ink-soft)", lineHeight: 1.55 }}>{hint}</div> : null}
    </div>
  );
}

// === 1. CHECKIN, 단어 첫 인사 (발음 → 4지선다 의미 매칭) ===
function CheckinActivity({ today, item, onClose, onComplete }) {
  const [step, setStep] = useState(0);
  const [pick, setPick] = useState(null);
  const distractors = useMemo(() => _pickField(today.word, 3, "meaning"), [today.word]);
  const opts = useMemo(() => _shuf([today.meaning, ...distractors]), [today.meaning, distractors]);

  const speak = () => _speakWord(today.word);

  return (
    <ActivityShell title={`MORNING CHECK-IN · DAY ${today.day}`} onClose={onClose}>
      {step === 0 && (
        <>
          <span className="label-doc label-orange">▶ 9시 · 오늘의 단어 도착</span>
          <div style={{ marginTop: 14, padding: 22, background: "#FFE9A6", border: "1px dashed var(--line)", borderRadius: 8, position: "relative" }}>
            <div style={{ fontSize: 11, fontWeight: 800, color: "var(--ink-mute)", letterSpacing: "0.12em", marginBottom: 8 }}>YOUR DESK · POST-IT</div>
            <div style={{ fontSize: 38, fontWeight: 900, letterSpacing: "-0.03em", lineHeight: 1.05 }}>{today.word}</div>
            <div style={{ fontSize: 12, color: "var(--ink-mute)", marginTop: 4 }}>{today.pos} · {today.phonetic}</div>
            <div style={{ fontSize: 14, color: "var(--ink)", marginTop: 8, fontWeight: 700 }}>{today.meaning}</div>
            <button className="btn btn-soft" style={{ marginTop: 14 }} onClick={speak}>🔊 한 번 들어보기</button>
          </div>
          <div style={{ fontSize: 12.5, color: "var(--ink-soft)", marginTop: 14, lineHeight: 1.6 }}>
            한 번 들어봤다면 다음, 진짜 외웠는지 가벼운 매칭 테스트 한 번.
          </div>
          <div className="row" style={{ marginTop: 14, justifyContent: "flex-end" }}>
            <button className="btn btn-primary" onClick={() => setStep(1)}>들어봤어요 → 다음</button>
          </div>
        </>
      )}
      {step === 1 && (
        <>
          <span className="label-doc label-orange">▶ 빠른 매칭</span>
          <div style={{ fontSize: 22, fontWeight: 900, marginTop: 12, letterSpacing: "-0.02em" }}>
            "{today.word}" 의 뜻은?
          </div>
          <div style={{ marginTop: 14, display: "grid", gap: 8 }}>
            {opts.map((o, i) => {
              const isCorrect = o === today.meaning;
              const isPicked = pick === o;
              const showResult = pick !== null;
              return (
                <button
                  key={i}
                  onClick={() => pick === null && setPick(o)}
                  style={{
                    textAlign: "left", padding: "14px 16px", borderRadius: 8,
                    border: "1.5px solid " + (showResult && isCorrect ? "var(--green)" : isPicked ? "var(--stamp-red)" : "var(--line)"),
                    background: showResult && isCorrect ? "rgba(74,124,89,0.10)" : isPicked ? "rgba(178,58,44,0.08)" : "var(--cream)",
                    cursor: pick === null ? "pointer" : "default",
                    fontSize: 14, lineHeight: 1.5, fontFamily: "inherit", color: "var(--ink)",
                    fontWeight: showResult && isCorrect ? 800 : 500,
                    transition: "all 0.15s",
                  }}
                >
                  {String.fromCharCode(65 + i)}. {o}
                  {showResult && isCorrect ? <span style={{ float: "right", color: "var(--green)" }}>✓</span> : null}
                </button>
              );
            })}
          </div>
          {pick !== null && (
            <>
              <FeedbackBox ok={pick === today.meaning} correct={today.meaning} hint={today.mentorTip} />
              <div className="row" style={{ marginTop: 14, justifyContent: "flex-end" }}>
                <button className="btn btn-primary" onClick={onComplete}>출근 도장 찍기 ✓</button>
              </div>
            </>
          )}
        </>
      )}
    </ActivityShell>
  );
}

// === 2. MINI_MISSION, 컨텍스트 한 줄 미션 (3중 가장 자연스러운 거 고르기) ===
// 🇰🇷 한국어 번역 토글 (피드백 #14 황혜민, #20 최은정: 영문 예문에 한국어 버전)
// 기본은 접힘(영어 먼저 읽기), 누르면 번역 공개. 함수 선언이라 어디서든 사용 가능.
function KoPeek({ ko, align }) {
  const [show, setShow] = useState(false);
  if (!ko) return null;
  return (
    <div style={{ marginTop: 5, textAlign: align || "left" }}>
      <button
        onClick={(e) => { e.stopPropagation(); setShow(v => !v); }}
        style={{
          background: "transparent", border: "none", padding: 0,
          fontSize: 11, fontWeight: 700, color: "var(--ink-mute)",
          cursor: "pointer", fontFamily: "inherit", textDecoration: "underline dotted",
        }}>
        {show ? "한국어 닫기 ▲" : "🇰🇷 한국어 보기"}
      </button>
      {show && (
        <div style={{ marginTop: 5, fontSize: 12.5, color: "var(--ink-soft)", lineHeight: 1.6, background: "var(--paper-warm)", borderRadius: 6, padding: "7px 10px" }}>
          {ko}
        </div>
      )}
    </div>
  );
}

// 보기 유형 뱃지 (정답 공개 후, 왜 정답/오답인지 한눈에 구분)
function _mcKindBadge(kind) {
  const map = {
    correct:  { label: "✓ 자연스러운 답", color: "#2D7A3D" },
    formal:   { label: "🎩 너무 격식",     color: "#8C6510" },
    weak:     { label: "💤 힘 빠진 답",    color: "#993C1D" },
    konglish: { label: "🗯 콩글리시",      color: "#993C1D" },
    missing:  { label: "🚫 오늘 단어 없음", color: "#993C1D" },
  };
  const m = map[kind] || { label: kind, color: "var(--ink-mute)" };
  return (
    <b style={{ color: m.color, marginRight: 6, whiteSpace: "nowrap" }}>{m.label} ·</b>
  );
}
// 고르기 전 보여줄 공통 기준 (피드백 #16 후속: '왜 정답인지' 기준을 사전에 명시)
function _mcCriteriaLine() {

    <div style={{ marginTop: 8, fontSize: 11.5, color: "var(--ink-mute)", lineHeight: 1.6 }}>
      고르는 기준: ① 오늘 단어가 들어갔나 ② 동료에게 말하는 자연스러운 사내 톤인가 ③ 행동·시점이 보이나
    </div>

}

// === TF 전용 미니미션 5단계 콤보: 뜻 확인 → 스펠링 → 문장 조립 → 상황 판단 → 빈칸 완성 ===
// 데이터는 트랙 시나리오에서 자동 파생 (별도 콘텐츠 작업 없이 굴러감). 전부 첫 시도 정답이면 PERFECT 도장.
function MissionComboActivity({ today, item, onClose, onComplete }) {
  const { CHARACTERS } = window.__SIM;
  const npc = CHARACTERS[today.npc] || CHARACTERS.manager;
  const tf = today._tfInfo || {};
  const [step, setStep] = useState(0);           // 0~4 = 문제, 5 = 완료 화면
  const [firstTryAll, setFirstTryAll] = useState(true);
  const missed = () => setFirstTryAll(false);

  const D = useMemo(() => {
    const _poolSrc = tf.id
      ? (((window.__TF_SCN || {})[tf.id] || {}).scenarios || [])
      : (((window.__SIM || {}).SCENARIOS) || []);
    const pool = _poolSrc.filter(x => x.word !== today.word);
    const pk = n => pool.length ? pool[(((tf.tfDay || today.day || 1) * 7 + n * 13) % pool.length)] : null;
    let o1 = pk(1), o2 = pk(2);
    if (o1 && o2 && o1.word === o2.word) o2 = pk(3);
    const sentence = ((today.sampleAnswers || [])[0] || today.sampleAnswer || "").trim().replace(/\s+/g, " ");
    const esc = (today.word || "").replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    let blankQuote = today.quote || "";
    try { blankQuote = blankQuote.replace(new RegExp(esc, "i"), " ______ "); } catch (e) {}
    return {
      meanings: _shuf([
        { t: today.meaning, ok: true },
        { t: (o1 && o1.meaning) || "회의를 짧게 끝내자는 신호", ok: false },
        { t: (o2 && o2.meaning) || "일정을 뒤로 미루자는 제안", ok: false },
      ]),
      words5: _shuf([today.word, (o1 && o1.word) || "sync up", (o2 && o2.word) || "circle back"]),
      tokens: _shuf(sentence.split(" ").map((w, i) => ({ w, i }))),
      sentence, blankQuote,
      slackOpts: tf.id ? _shuf([
        { text: (today.sampleAnswers || [])[1] || (today.sampleAnswers || [])[0] || today.sampleAnswer || "", kind: "correct", note: "오늘 단어 + 자연스러운 사내 톤. 이대로 전송." },
        { text: "Kindly be advised that the aforementioned " + (today.word || "") + " shall be duly noted and processed accordingly.", kind: "formal", note: "슬랙에서 이러면 채널이 조용해져... 격식 과다." },
        { text: (pk(4) && (pk(4).sampleAnswers || [])[0]) || "Noted, I will review and circle back sometime soon.", kind: "missing", note: "문장은 멀쩡한데 오늘 단어 " + (today.word || "") + " 를 못 살렸어. 미션 실패." },
      ]) : _shuf((today.mcOptions || []).map(o => ({ ...o }))),
    };
  }, [today.word]);

  // step별 상태
  const [pick1, setPick1] = useState(null);          // 뜻 고르기: 고른 index들
  const [wrong1, setWrong1] = useState([]);
  const [typed, setTyped] = useState("");            // 스펠링
  const [hint, setHint] = useState(0);
  const [spellOk, setSpellOk] = useState(false);
  const [spellTried, setSpellTried] = useState(false);
  const [built, setBuilt] = useState([]);            // 조립: token 객체 배열
  const [buildWrong, setBuildWrong] = useState(false);
  const [picks4, setPicks4] = useState([]);          // 상황 판단: 고른 text들
  const [pick5, setPick5] = useState(null);
  const [wrong5, setWrong5] = useState([]);
  const [pick6, setPick6] = useState(null);          // 슬랙 실전
  const [wrong6, setWrong6] = useState([]);

  const _norm = s => (s || "").toLowerCase().replace(/[^a-z0-9']/g, "");
  const word = today.word || "";
  // 스펠링 마스크: 각 어절 첫 글자 + 힌트만큼 앞에서 추가 공개, 나머지는 ·
  const masked = word.split("").map((ch, i) => {
    if (!/[a-zA-Z0-9']/.test(ch)) return ch;
    const chunkStart = i === 0 || !/[a-zA-Z0-9']/.test(word[i - 1]);
    return (chunkStart || i < hint + 1) ? ch : "·";
  }).join("");

  // TF: 뜻-스펠링-조립-상황-빈칸-슬랙 (6단계) / Day 1~90: 상황 스텝 제외 (5단계, 슬랙=기존 3지선다)
  const ORDER = tf.id ? ["mean", "spell", "build", "judge", "blank", "slack"] : ["mean", "spell", "build", "blank", "slack"];
  const KEY = ORDER[step] || "done";
  const _LB = { mean: "뜻", spell: "스펠링", build: "조립", judge: "상황", blank: "빈칸", slack: "슬랙" };
  const stepMeta = ORDER.map((k, i) => ({ icon: String(i + 1), label: _LB[k] }));
  const StepHead = () => (
    <div style={{ display: "flex", gap: 6, alignItems: "center", marginTop: 12, marginBottom: 14 }}>
      {stepMeta.map((m, i) => (
        <div key={i} style={{ flex: 1, textAlign: "center" }}>
          <div style={{ height: 4, borderRadius: 2, background: i < step ? "var(--orange)" : (i === step ? "var(--ink-soft)" : "var(--line)"), marginBottom: 4 }} />
          <span style={{ fontSize: 10, fontWeight: 800, color: i === step ? "var(--ink)" : "var(--ink-mute)" }}>{m.icon}. {m.label}</span>
        </div>
      ))}
    </div>
  );
  const NextBtn = ({ on }) => (
    <div className="row" style={{ marginTop: 14, justifyContent: "flex-end" }}>
      <button className="btn btn-primary" onClick={on}>다음 →</button>
    </div>
  );
  const optBtn = (state) => ({
    textAlign: "left", fontFamily: "inherit", cursor: "pointer", fontSize: 13, lineHeight: 1.55,
    padding: "11px 13px", borderRadius: 9, transition: "all 0.12s", width: "100%",
    border: state === "ok" ? "2px solid #2D7A3D" : state === "no" ? "2px solid #B23A2C" : "1px solid var(--line)",
    background: state === "ok" ? "#EEF6EE" : state === "no" ? "#FAEDEA" : "var(--paper)",
    color: "var(--ink)", opacity: state === "no" ? 0.75 : 1,
  });

  return (
    <ActivityShell title={`MINI MISSION · ${tf.name || "오늘 표현"} ${ORDER.length}단계`} onClose={onClose}>
      <span className="label-doc label-orange">▶ 14:00 · 오늘 표현 {ORDER.length}단계 훈련</span>
      <StepHead />

      {KEY === "mean" && (
        <>
          <div style={{ fontSize: 14, fontWeight: 800, color: "var(--ink)", marginBottom: 10 }}>
            ① 오늘 단어 <span style={{ background: "var(--highlight, #FBE9A9)", padding: "1px 6px", borderRadius: 4 }}>{word}</span>, 무슨 뜻일까?
          </div>
          <div style={{ display: "grid", gap: 8 }}>
            {D.meanings.map((m, i) => {
              const st = pick1 === i && m.ok ? "ok" : (wrong1.includes(i) ? "no" : null);
              return (
                <button key={i} style={optBtn(st)} disabled={pick1 !== null && D.meanings[pick1] && D.meanings[pick1].ok} onClick={() => {
                  if (m.ok) { setPick1(i); } else { if (!wrong1.includes(i)) { setWrong1([...wrong1, i]); missed(); } }
                }}>{String.fromCharCode(65 + i)}. {m.t}</button>
              );
            })}
          </div>
          {pick1 !== null && D.meanings[pick1] && D.meanings[pick1].ok && (
            <>
              <div style={{ marginTop: 10, fontSize: 12.5, color: "#2D7A3D", fontWeight: 700 }}>정확해요. 이 감각 그대로 다음 단계로.</div>
              <NextBtn on={() => setStep(step + 1)} />
            </>
          )}
        </>
      )}

      {KEY === "spell" && (
        <>
          <div style={{ fontSize: 14, fontWeight: 800, color: "var(--ink)", marginBottom: 6 }}>② 뜻 보고 스펠링 쓰기</div>
          <div style={{ fontSize: 13, color: "var(--ink-soft)", marginBottom: 10 }}>"{today.meaning}"</div>
          <div style={{ fontFamily: "monospace", fontSize: 20, letterSpacing: "0.12em", background: "var(--cream)", border: "1px dashed var(--line)", borderRadius: 8, padding: "10px 14px", marginBottom: 10, color: "var(--ink)" }}>{spellOk ? word : masked}</div>
          {!spellOk && (
            <>
              <input value={typed} onChange={e => setTyped(e.target.value)} placeholder="여기에 타이핑"
                onKeyDown={e => { if (e.key === "Enter") { setSpellTried(true); if (_norm(typed) === _norm(word)) setSpellOk(true); else missed(); } }}
                style={{ width: "100%", boxSizing: "border-box", fontFamily: "inherit", fontSize: 14, padding: "10px 12px", borderRadius: 8, border: spellTried && _norm(typed) !== _norm(word) ? "2px solid #B23A2C" : "1px solid var(--line)", background: "var(--paper)" }} />
              <div className="row" style={{ marginTop: 10, gap: 8, justifyContent: "space-between" }}>
                <button className="btn btn-ghost" disabled={hint >= 3} onClick={() => { setHint(h => h + 2); missed(); }}>힌트 (+2글자) {hint > 0 ? `· ${hint}` : ""}</button>
                <button className="btn btn-primary" onClick={() => { setSpellTried(true); if (_norm(typed) === _norm(word)) setSpellOk(true); else missed(); }}>확인</button>
              </div>
              {spellTried && _norm(typed) !== _norm(word) && <div style={{ marginTop: 8, fontSize: 12.5, color: "#B23A2C", fontWeight: 700 }}>아직! 다시 한번. (힌트 써도 돼요)</div>}
            </>
          )}
          {spellOk && (
            <>
              <div style={{ fontSize: 12.5, color: "#2D7A3D", fontWeight: 700 }}>손으로 쳐본 단어는 진짜 내 단어. ✓</div>

          <div style={{ fontSize: 14, fontWeight: 800, color: "var(--ink)", marginBottom: 6 }}>③ 단어 블록으로 문장 조립</div>
          <div style={{ fontSize: 13, color: "var(--ink-soft)", marginBottom: 10 }}>🇰🇷 {(today.task && today.task.koSentence) || "오늘 표현이 든 문장을 순서대로 조립하세요."}</div>

            {built.map((t, bi) => (
              <button key={t.i} onClick={() => setBuilt(built.filter((_, j) => j !== bi))}
                style={{ fontFamily: "inherit", fontSize: 13, fontWeight: 700, padding: "5px 9px", borderRadius: 7, border: "1px solid var(--orange)", background: "var(--paper)", color: "var(--ink)", cursor: "pointer" }}>{t.w}</button>
            ))}
          </div>
          <div style={{ display: "flex", flexWrap: "wrap", gap: 6, marginBottom: 4 }}>
            {D.tokens.filter(t => !built.some(b => b.i === t.i)).map(t => (
              <button key={t.i} onClick={() => { setBuildWrong(false); setBuilt([...built, t]); }}
                style={{ fontFamily: "inherit", fontSize: 13, fontWeight: 700, padding: "6px 10px", borderRadius: 7, border: "1px solid var(--line)", background: "var(--paper-warm)", color: "var(--ink)", cursor: "pointer" }}>{t.w}</button>
            ))}
          </div>
          {built.length < D.tokens.length && (
            <div className="row" style={{ marginTop: 10, gap: 8, alignItems: "center" }}>
              <button className="btn btn-ghost" onClick={() => {
                // 힌트: 지금까지 맞은 부분까지만 남기고, 다음 올 블록을 자동으로 놓아줌
                const words = D.sentence.split(" ");
                let k = 0;
                while (k < built.length && built[k].w === words[k]) k++;
                const prefix = built.slice(0, k);
                const cand = D.tokens.find(t => t.w === words[k] && !prefix.some(x => x.i === t.i));
                setBuilt(cand ? [...prefix, cand] : prefix);
                missed();
              }}>💡 힌트: 다음 블록 놓아줘</button>
              {built.length > 0 && <span style={{ fontSize: 11.5, color: "var(--ink-mute)" }}>놓은 블록을 누르면 뺄 수 있어요</span>}
            </div>

          {built.length === D.tokens.length && built.map(t => t.w).join(" ") === D.sentence && (
            <>
              <div style={{ marginTop: 8, fontSize: 12.5, color: "#2D7A3D", fontWeight: 700 }}>✓ "{D.sentence}"</div>

              <span style={{ fontSize: 12.5, color: "#B23A2C", fontWeight: 700 }}>어순이 조금 달라요.</span>
              <button className="btn btn-ghost" onClick={() => { setBuilt([]); missed(); }}>다시 조립</button>

      {KEY === "judge" && (

              return (
                <button key={i} style={optBtn(st)} disabled={pickedThis || solved} onClick={() => {
                  setPicks4([...picks4, o.text]);
                  if (o.kind !== "correct") missed();

                  {pickedThis && <div style={{ marginTop: 5, fontSize: 11.5, color: "var(--ink-mute)", lineHeight: 1.5 }}>{_mcKindBadge(o.kind)}{o.note}</div>}
                </button>
              );
            })}
          </div>
          {picks4.some(t => { const f = (today.mcOptions || []).find(x => x.text === t); return f && f.kind === "correct"; }) && <NextBtn on={() => setStep(step + 1)} />}
        </>

      {KEY === "blank" && (

            {D.words5.map((w, i) => {

            <>
              <div style={{ marginTop: 10, fontSize: 12.5, color: "#2D7A3D", fontWeight: 700 }}>✓ 통과! 마지막은 실전, 슬랙에 답장 보내기.</div>
              <NextBtn on={() => setStep(step + 1)} />
            </>
          )}
        </>
      )}

      {KEY === "slack" && (
        <>
          <div style={{ fontSize: 14, fontWeight: 800, color: "var(--ink)", marginBottom: 8 }}>⑥ 실전 · {npc.name} 슬랙에 답장</div>

            <div className="slack-head">

                  <div>
                    <span className="slack-msg-name">{npc.name}</span>
                    <span className="slack-msg-time">14:00</span>
                  </div>
                  <div className="slack-msg-text">{today.quote}</div>

                </div>

              {pick6 !== null && (
                <div className="slack-msg">
                  <div className="slack-msg-avatar" style={{ background: "var(--orange)" }}>나</div>
                  <div className="slack-msg-content">
                    <div>
                      <span className="slack-msg-name">{USER.name}</span>
                      <span className="slack-msg-time">14:01</span>
                    </div>
                    <div className="slack-msg-text">{pick6}</div>
                  </div>
                </div>
              )}
              {pick6 === null && (
                <div className="slack-replies-prompt">
                  💬 답할 차례. 오늘 단어 <b>{word}</b> 를(을) 살린 한 줄을 골라 전송하세요.
                  {_mcCriteriaLine()}
                </div>
              )}
            </div>
          </div>
          {pick6 === null && (
            <div style={{ marginTop: 12, display: "grid", gap: 8 }}>
              {D.slackOpts.map((o, i) => {
                const st = wrong6.includes(o.text) ? "no" : null;
                return (
                  <button key={i} style={optBtn(st)} onClick={() => {
                    if (o.kind === "correct") setPick6(o.text);
                    else { if (!wrong6.includes(o.text)) { setWrong6([...wrong6, o.text]); missed(); } }
                  }}>

                    {wrong6.includes(o.text) && <div style={{ marginTop: 5, fontSize: 11.5, color: "var(--ink-mute)", lineHeight: 1.5 }}>{_mcKindBadge(o.kind)}{o.note}</div>}
                  </button>

              <NextBtn on={() => setStep(step + 1)} />

      {KEY === "done" && (
        <div style={{ textAlign: "center", padding: "18px 0 6px" }}>
          <div style={{ fontSize: 40, marginBottom: 8 }}>{firstTryAll ? "💯" : "✅"}</div>
          <div style={{ fontSize: 17, fontWeight: 900, color: "var(--ink)", marginBottom: 6 }}>
            {firstTryAll ? "PERFECT · 전부 한 번에!" : "미션 클리어"}
          </div>
          <div style={{ fontSize: 12.5, color: "var(--ink-soft)", lineHeight: 1.7, marginBottom: 14 }}>
            <b>{word}</b> 를(을) {tf.id ? "뜻 → 스펠링 → 어순 → 상황 → 빈칸 → 슬랙 실전, 6가지" : "뜻 → 스펠링 → 어순 → 빈칸 → 슬랙 실전, 5가지"} 각도로 다뤘어요.<br/>
            {firstTryAll ? "이 단어는 이제 회의에서 튀어나올 준비 끝." : "한 번 헷갈린 단어가 더 오래 남는 법. 내일 복습에서 만나요."}

            try {

}

function MissionActivity({ today, item, onClose, onComplete }) {
  const ctx = item.context || { ctx: "팀 슬랙", prompt: "팀 슬랙에 한 줄 던진다고 생각하고." };
  const { CHARACTERS } = window.__SIM;
  const buddy = CHARACTERS.buddy;
  const npc = CHARACTERS[today.npc] || CHARACTERS.manager;
  const [pick, setPick] = useState(null);

  // 슬랙·DM 컨텍스트면 슬랙 모양 UI 적용
  const isSlack = (ctx.ctx || "").includes("슬랙") || (ctx.ctx || "").includes("DM");
  const slackChannel = (ctx.ctx || "").includes("DM") ? `@${(npc.name || "사수")}` : "#project-launch";

  // 옵션, scenario.mcOptions 우선, 없으면 일반 fallback
  const options = useMemo(() => {
    if (today.mcOptions && today.mcOptions.length >= 2) {
      return _shuf(today.mcOptions.map(o => ({ ...o })));
    }
    const correct = today.sampleAnswer || `Let's ${today.word} on this, quick win.`;
    const tooFormal = `Pursuant to my prior correspondence, kindly note ${today.word} accordingly.`;
    const noWord = `Yeah ok let me think and get back to you on this one.`;
    return _shuf([
      { text: correct, kind: "correct", note: "오늘 단어 자연스럽게 + 톤 정확. 이게 정답." },
      { text: tooFormal, kind: "formal", note: "단어는 들어갔지만 톤이 너무 무거워, 사내 슬랙엔 부담." },
      { text: noWord, kind: "missing", note: "톤은 OK인데 오늘 단어를 못 살렸어. 미션 실패." },
    ]);
  }, [today.word, today.sampleAnswer, today.mcOptions]);

  const picked = options.find(o => o.text === pick);

  // ─── SLACK 스타일 (슬랙·DM 컨텍스트) ───
  if (isSlack) {
    return (
      <ActivityShell title={`MINI MISSION · ${ctx.ctx.toUpperCase()}`} onClose={onClose}>
        <span className="label-doc label-orange">▶ 14:00 · 오늘 표현 써먹기</span>

        <div className="slack-frame" style={{ marginTop: 12 }}>
          <div className="slack-head">
            <span>{slackChannel.startsWith("@") ? "💬" : "#"}</span>
            <span className="slack-channel">{slackChannel}</span>
            <span className="slack-channel-meta">3 members · 14:00</span>
          </div>
          <div className="slack-body">
            <div className="slack-msg">
              <div className="slack-msg-avatar" style={{ background: npc.color }}>{npc.avatar}</div>
              <div className="slack-msg-content">
                <div>
                  <span className="slack-msg-name">{npc.name}</span>
                  <span className="slack-msg-time">14:00</span>
                </div>
                <div className="slack-msg-text">{today.quote}</div>
                <KoPeek ko={today.quoteKo} />
              </div>
            </div>
            <div className="slack-replies-prompt">
              💬 {npc.name} 슬랙에 답할 차례. 오늘 단어 <b>{today.word}</b> 를(을) 살린 한 줄을 골라보세요.
              {_mcCriteriaLine()}
            </div>
          </div>
        </div>

        <div style={{ marginTop: 14, display: "grid", gap: 8 }}>
          {options.map((o, i) => {
            const isPicked = pick === o.text;
            const showResult = pick !== null;
            const ok = o.kind === "correct";
            const cls = "slack-reply-option" + (showResult && ok ? " picked-correct" : isPicked && !ok ? " picked-wrong" : "");
            return (
              <button key={i} className={cls} onClick={() => {
                if (pick !== null) return;
                setPick(o.text);
                // ★ DB에 mc 선택 저장 (submissions.mc_choice)
                try {
                  if (window.OD?.enabled && window.OD.saveSubmission && USER.email) {
                    window.OD.saveSubmission(USER.email, today.day, {
                      word: today.word,
                      scenario_id: String(today.day) + ':' + (today.word || ''),
                      answer_text: '',
                      mc_choice: o.kind || null,
                      meta: { mcSelectedAt: new Date().toISOString(), mcText: o.text, isSlackStyle: true },
                      status: 'draft',
                    }).catch(() => {});
                  }
                } catch (e) {}
              }} disabled={pick !== null}>
                <span className="opt-letter">{String.fromCharCode(65 + i)}.</span>
                {o.text}
                {showResult ? <div className="opt-note">{_mcKindBadge(o.kind)}{o.note}</div> : null}
              </button>
            );
          })}
        </div>

        {picked && (
          <>
            <FeedbackBox ok={picked.kind === "correct"} correct={today.sampleAnswer} hint={today.mentorTip} />
            <div className="row" style={{ marginTop: 14, justifyContent: "flex-end", gap: 8 }}>
              <button className="btn btn-ghost" onClick={() => setPick(null)}>다시 풀기</button>
              <button className="btn btn-primary" onClick={onComplete}>미션 완료 ✓</button>
            </div>
          </>
        )}
      </ActivityShell>
    );
  }

  // ─── 일반 스타일 (이메일·회의·클라이언트) ───
  return (
    <ActivityShell title={`MINI MISSION · ${ctx.ctx.toUpperCase()}`} onClose={onClose}>
      <span className="label-doc label-orange">▶ 14:00 · 오늘 표현 써먹기</span>
      <div style={{ marginTop: 12, padding: 16, background: "var(--cream)", border: "1px dashed var(--line)", borderRadius: 8 }}>
        <div style={{ fontSize: 11, color: "var(--ink-mute)", fontWeight: 800, letterSpacing: "0.12em", marginBottom: 6 }}>📍 SITUATION</div>
        <div style={{ fontSize: 13, color: "var(--ink-soft)", lineHeight: 1.55 }}>{today.scene ? today.scene + " " : ""}{ctx.prompt}</div>
        {today.quote ? (
          <div style={{ display: "flex", gap: 10, marginTop: 12, alignItems: "flex-start" }}>
            <div style={{ width: 30, height: 30, borderRadius: "50%", flexShrink: 0, display: "flex", alignItems: "center", justifyContent: "center", background: npc.color, fontSize: 14 }}>{npc.avatar}</div>
            <div style={{ flex: 1 }}>
              <div style={{ fontSize: 12, fontWeight: 800, color: "var(--ink)", marginBottom: 3 }}>{npc.name}</div>
              <div style={{ fontSize: 14, color: "var(--ink)", lineHeight: 1.5, background: "var(--paper)", border: "1px solid var(--line)", borderRadius: "2px 12px 12px 12px", padding: "8px 12px" }}>{today.quote}</div>
              <KoPeek ko={today.quoteKo} />
            </div>
          </div>
        ) : null}
        <div style={{ marginTop: 12, fontSize: 13, color: "var(--ink)" }}>오늘 단어: <b style={{ background: "var(--highlight)", padding: "1px 6px" }}>{today.word}</b></div>
      </div>
      <div style={{ marginTop: 16, fontSize: 14, fontWeight: 700, color: "var(--ink)" }}>
        {npc.name}에게 답할 차례. 오늘 단어 <b>{today.word}</b>를(을) 살린 한 줄을 골라보세요.
        {_mcCriteriaLine()}
      </div>
      <div style={{ marginTop: 10, display: "grid", gap: 8 }}>
        {options.map((o, i) => {
          const isPicked = pick === o.text;
          const showResult = pick !== null;
          const ok = o.kind === "correct";
          return (
            <button
              key={i}
              onClick={() => {
                if (pick !== null) return;
                setPick(o.text);
                // ★ DB에 mc 선택 저장 (submissions.mc_choice)
                try {
                  if (window.OD?.enabled && window.OD.saveSubmission && USER.email) {
                    window.OD.saveSubmission(USER.email, today.day, {
                      word: today.word,
                      scenario_id: String(today.day) + ':' + (today.word || ''),
                      answer_text: '',
                      mc_choice: o.kind || null,
                      meta: { mcSelectedAt: new Date().toISOString(), mcText: o.text, isSlackStyle: false },
                      status: 'draft',
                    }).catch(() => {});
                  }
                } catch (e) {}
              }}
              style={{
                textAlign: "left", padding: "14px 16px", borderRadius: 8,
                border: "1.5px solid " + (showResult && ok ? "var(--green)" : isPicked ? "var(--stamp-red)" : "var(--line)"),
                background: showResult && ok ? "rgba(74,124,89,0.10)" : isPicked ? "rgba(178,58,44,0.06)" : "var(--cream)",
                cursor: pick === null ? "pointer" : "default",
                fontSize: 13.5, lineHeight: 1.55, fontFamily: "inherit", color: "var(--ink)",
                transition: "all 0.15s",
              }}
            >
              {String.fromCharCode(65 + i)}. "{o.text}"
              {showResult ? <div style={{ marginTop: 6, fontSize: 11.5, color: "var(--ink-mute)", lineHeight: 1.55 }}>{_mcKindBadge(o.kind)}{o.note}</div> : null}
            </button>
          );
        })}
      </div>
      {picked && (
        <>
          <FeedbackBox ok={picked.kind === "correct"} correct={today.sampleAnswer} hint={today.mentorTip} />
          <div className="row" style={{ marginTop: 14, justifyContent: "flex-end", gap: 8 }}>
            <button className="btn btn-ghost" onClick={() => setPick(null)}>다시 풀기</button>
            <button className="btn btn-primary" onClick={onComplete}>미션 완료 ✓</button>
          </div>
        </>
      )}
    </ActivityShell>
  );
}

  // Turn 2 옵션, day별 스크립트 우선, 없으면 기존 템플릿
  const turn2Opts = useMemo(() => script?.turn2 ? _shuf(script.turn2.map(o => ({ ...o }))) : _shuf([
    {

      note: "오늘 단어 두 번째 등장 + 점심 흐름 자연스럽게 받음. 진짜 익혀짐.",

    {

      kind: "stiff",
      note: "다시 너무 딱딱. small talk엔 안 어울려.",
      ko: `"논의에 따라 해당 사안을 검토하겠습니다." (변호사 메일 톤)`,
      vocab: [
        { w: "Per our discussion", m: "논의에 따라 (메일 첫 줄 격식 표현). small talk엔 부담" },
        { w: "the matter", m: "그 사안. 일상 대화엔 너무 무거움. 'it' 한 단어로 충분" },
      ],
    },
  ]), [today.word]);

  const opts = turn === 0 ? turn1Opts : turn2Opts;
  const picked = opts.find(o => o.text === pick);

  const onPick = (opt) => {
    if (pick) return;
    setPick(opt.text);
    setLog(l => [...l, { from: "me", text: opt.text }]);
    if (opt.kind === "correct" && turn === 0) {
      // turn 0 정답 → 상대 응답 + turn 1로
      setTimeout(() => {

  return (

// === 4. RECAP, 10초 퀴즈 (3문제 빠른 4지선다) ===
// ── 복습 빈칸 후보 풀: 기본 RECAP 문장 + 유버디 예문·모범답안에서 파생 ──
// (피드백: 같은 예문만 반복 출제 + 문장이 답을 노출. 후보를 늘려 랜덤 출제하면 둘 다 완화)
function _recapCandidates(sc, RD) {
  const out = [];
  if (sc && RD && RD[sc.day] && RD[sc.day].blank) out.push(RD[sc.day].blank);
  if (!sc) return out;
  const ex = (sc.buddyAnswers && sc.buddyAnswers.example) || "";
  (ex.match(/"[^"]{8,140}"/g) || []).forEach(q => {
    const s = q.slice(1, -1);
    if (/[A-Za-z]{3,}/.test(s)) {
      const b = _blankWordEx(s, sc.word);
      if (b && b.text !== s) out.push(b.text);   // 단어가 실제로 들어있어 빈칸이 뚫린 문장만
    }
  });
  if (sc.sampleAnswer) {
    const b = _blankWordEx(sc.sampleAnswer, sc.word);
    if (b && b.text !== sc.sampleAnswer) out.push(b.text);
  }
  return out;
}
function _recapPickTarget(sc, RD) {
  const cands = _recapCandidates(sc, RD);
  if (cands.length === 0) return (RD && sc && RD[sc.day] && RD[sc.day].blank) || "";
  return cands[Math.floor(Math.random() * cands.length)];
}
window._recapPickTarget = _recapPickTarget;

function RecapActivity({ today, item, onClose, onComplete }) {
  const [qIdx, setQIdx] = useState(0);
  const [picks, setPicks] = useState([]);
  const [pick, setPick] = useState(null);

  // 누적 복습: 오늘 + 최근 2개 day 단어로 빈칸 문제 (정답이 매번 달라 패턴 안 통함)
  // 문장은 기본+예문 파생 풀에서 랜덤 (같은 예문 반복 방지)
  const questions = useMemo(() => {
    const SCN = (window.__SIM && window.__SIM.SCENARIOS) || [];
    const RD = (window.__SIM && window.__SIM.RECAP_DATA) || {};
    const qDays = [];
    for (let d = today.day; d >= 1 && qDays.length < 3; d--) {
      if (RD[d]) qDays.push(d);
    }
    qDays.reverse();
    const allWords = SCN.map(s => s.word).filter(Boolean);
    return qDays.map(d => {
      const sc = SCN.find(s => s.day === d);
      const word = sc ? sc.word : "";
      const distractors = _shuf(allWords.filter(w => w !== word)).slice(0, 3);
      return {
        prompt: `빈 칸에 들어갈 표현은?`,
        target: _recapPickTarget(sc, RD) || RD[d].blank,
        options: _shuf([word, ...distractors]),
        correct: word,
        hint: RD[d].explain,
      };
    });
  }, [today.day]);

  const q = questions[qIdx];
  const lastQ = qIdx >= questions.length - 1;
  const score = picks.filter(p => p.ok).length;

  const onPick = (opt) => {
    if (pick) return;
    setPick(opt);
    setPicks(prev => [...prev, { ok: opt === q.correct, q: q.target, opt }]);
  };
  const goNext = () => {
    setQIdx(qIdx + 1);
    setPick(null);
  };

  if (qIdx >= questions.length) {
    const finalScore = picks.filter(p => p.ok).length;
    return (
      <ActivityShell title="RECAP · 10초 퀴즈 결과" onClose={onClose}>
        <div style={{ textAlign: "center", padding: "20px 0" }}>
          <div style={{ fontSize: 56, fontWeight: 900, color: "var(--orange)", lineHeight: 1, letterSpacing: "-0.04em" }}>
            {finalScore}<span style={{ fontSize: 22, color: "var(--ink-mute)" }}> / {questions.length}</span>
          </div>
          <div style={{ marginTop: 14, fontSize: 14, color: "var(--ink-soft)" }}>
            {finalScore === questions.length ? "전부 맞췄어요. 머릿속에 박혔네 🌟" :
             finalScore >= 2 ? "괜찮아요. 한 번 더 만나면 완전히 외워져요." :
             "오늘 단어 한 번만 더 입으로 굴려봐요, 내일 또 만나요."}
          </div>
        </div>
        <div style={{ marginTop: 8, display: "flex", flexDirection: "column", gap: 6 }}>
          {picks.map((p, i) => (
            <div key={i} style={{ display: "flex", justifyContent: "space-between", padding: "8px 12px", background: p.ok ? "rgba(74,124,89,0.06)" : "rgba(178,58,44,0.06)", border: "1px solid var(--line)", borderRadius: 6, fontSize: 12 }}>
              <span>Q{i+1}</span>
              <span style={{ fontWeight: 800, color: p.ok ? "var(--green)" : "var(--stamp-red)" }}>{p.ok ? "✓ 정답" : "✗ 오답"}</span>
            </div>
          ))}
        </div>
        <div className="row" style={{ marginTop: 18, justifyContent: "flex-end" }}>
          <button className="btn btn-primary" onClick={onComplete}>Recap 완료 ✓</button>
        </div>
      </ActivityShell>
    );
  }

  return (
    <ActivityShell title={`RECAP · 10초 퀴즈 · ${qIdx + 1} / ${questions.length}`} onClose={onClose}>
      <span className="label-doc label-orange">▶ 15:30 · 빠른 복습</span>
      <div style={{ marginTop: 10, fontSize: 13, color: "var(--ink-soft)", lineHeight: 1.6 }}>
        오늘 단어 + 최근에 배운 단어를 섞어서 복습해요. 빈 칸에 들어갈 표현을 골라보세요.
      </div>
      <div style={{ marginTop: 12, fontSize: 13, color: "var(--ink-mute)", letterSpacing: "0.04em", fontWeight: 700 }}>{q.prompt}</div>
      <div style={{ marginTop: 8, padding: 18, background: "var(--cream)", border: "1px dashed var(--line)", borderRadius: 8, fontSize: 18, fontWeight: 800, color: "var(--ink)", lineHeight: 1.45, letterSpacing: "-0.01em" }}>
        {q.target}
      </div>
      <div style={{ marginTop: 14, display: "grid", gap: 8 }}>
        {q.options.map((o, i) => {
          const isPicked = pick === o;
          const showResult = pick !== null;
          const ok = o === q.correct;
          return (
            <button
              key={i}
              onClick={() => onPick(o)}
              style={{
                textAlign: "left", padding: "12px 16px", borderRadius: 8,
                border: "1.5px solid " + (showResult && ok ? "var(--green)" : isPicked ? "var(--stamp-red)" : "var(--line)"),
                background: showResult && ok ? "rgba(74,124,89,0.10)" : isPicked ? "rgba(178,58,44,0.06)" : "#fff",
                cursor: pick === null ? "pointer" : "default",
                fontSize: 14, lineHeight: 1.4, fontFamily: "inherit", color: "var(--ink)",
                fontWeight: showResult && ok ? 800 : 500,
              }}
            >
              {String.fromCharCode(65 + i)}. {o}
            </button>
          );
        })}
      </div>
      {pick && q.hint ? (
        <div style={{ marginTop: 12, fontSize: 12, color: "var(--ink-soft)", lineHeight: 1.55, padding: "10px 12px", background: "rgba(216,90,42,0.06)", borderRadius: 6 }}>
          💡 {q.hint}
        </div>
      ) : null}
      {pick ? (
        <div className="row" style={{ marginTop: 16, justifyContent: "flex-end" }}>
          <button className="btn btn-primary" onClick={goNext}>
            {lastQ ? "결과 보기 →" : "다음 문제 →"}
          </button>
        </div>
      ) : null}
    </ActivityShell>
  );
}

// 문장에서 단어(활용형 포함)를 빈칸으로 치환. ramp up -> ramping up, align -> aligned 등.
// ★ 빈칸 + 매칭된 표면형(활용형) 반환. 보기 어형을 문장과 맞추기 위해 surface가 필요.
// (피드백 #8, #13: 정답이 ramping up/aligned인데 보기엔 ramp up/align만 보여 혼란)
function _blankWordEx(sentence, word) {
  if (!sentence || !word) return { text: sentence, surface: word };
  const esc = (t) => t.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  // 1) 단어 경계 기준 정확 매칭 (aligned 안의 align 부분 매칭 방지)
  let re = new RegExp("\\b" + esc(word) + "\\b", "i");
  let m = sentence.match(re);
  if (m) return { text: sentence.replace(re, "_____"), surface: m[0] };
  // 2) 활용형 허용 매칭 (ing/ed/s/es/d + 자음 중복)
  const toks = word.split(/\s+/);
  const pat = toks.map((t, i) => {
    const e = esc(t);
    if (i === 0) {
      const last = e.slice(-1);
      return e + "(?:" + last + ")?(?:ing|ed|es|s|d)?";
    }
    return e;
  }).join("\\s+");
  re = new RegExp(pat, "i");
  m = sentence.match(re);
  if (m) return { text: sentence.replace(re, "_____"), surface: m[0] };
  return { text: sentence, surface: word };
}
// 표면형의 어미 종류 판별 (원형 첫 토큰과 비교)
function _suffixKindOf(word, surface) {
  const b = word.split(/\s+/)[0].toLowerCase();
  const s = surface.split(/\s+/)[0].toLowerCase();
  if (s === b) return null;
  if (/ing$/.test(s)) return "ing";
  if (/(ed|d)$/.test(s)) return "ed";
  if (/(es|s)$/.test(s)) return "s";
  return null;
}
// 다른 단어(보기용)도 같은 어미로 활용해 보기 균형 맞추기
function _inflectFirstToken(word, kind) {
  if (!kind) return word;
  const toks = word.split(/\s+/);
  let t = toks[0];
  if (kind === "ing") {
    if (/e$/i.test(t) && !/(ee|ye|oe)$/i.test(t)) t = t.slice(0, -1) + "ing";
    else if (/[^aeiou][aeiou][bdgklmnprtv]$/i.test(t)) t = t + t.slice(-1) + "ing";
    else t = t + "ing";
  } else if (kind === "ed") {
    if (/e$/i.test(t)) t = t + "d";
    else if (/[^aeiou]y$/i.test(t)) t = t.slice(0, -1) + "ied";
    else if (/[^aeiou][aeiou][bdgklmnprtv]$/i.test(t)) t = t + t.slice(-1) + "ed";
    else t = t + "ed";
  } else if (kind === "s") {
    if (/(s|sh|ch|x|z)$/i.test(t)) t = t + "es";
    else if (/[^aeiou]y$/i.test(t)) t = t.slice(0, -1) + "ies";
    else t = t + "s";
  }
  return [t, ...toks.slice(1)].join(" ");
}

// === 5. OFFICE_TASK, 오후 업무 (메일 빈칸 채우기) ===
function OfficeTaskActivity({ today, item, onClose, onComplete }) {
  const { CHARACTERS } = window.__SIM;
  const npc = CHARACTERS[today.npc] || CHARACTERS.manager;
  const [pick, setPick] = useState(null);

  // 메일 초안, 오늘 단어(활용형 포함) 빈칸
  // ★ 정답 보기는 문장 속 표면형(ramping up, aligned 등) 그대로 사용 (피드백 #8, #13)
  const blanked = useMemo(() => {
    const s = today.sampleAnswer || `Let's ${today.word} on this and circle back.`;
    return _blankWordEx(s, today.word);
  }, [today.word, today.sampleAnswer]);
  const draft = blanked.text;
  const correctOpt = blanked.surface.toLowerCase();
  const suffixKind = _suffixKindOf(today.word, blanked.surface);

  const otherWords = useMemo(() => {
    const pool = _pickWordObjects(today.word, 8);
    // 활용형 빈칸이면 동사·구동사 위주로 골라 같은 어형으로 변형 (보기 균형)
    const usable = suffixKind
      ? pool.filter(o => /v\.|phr\./.test(o.pos || "")).map(o => _inflectFirstToken(o.word, suffixKind))
      : pool.map(o => o.word);
    const fallback = pool.map(o => suffixKind ? _inflectFirstToken(o.word, suffixKind) : o.word);
    const merged = [...new Set([...usable, ...fallback])].filter(w => w !== correctOpt);
    return merged.slice(0, 3);
  }, [today.word, suffixKind, correctOpt]);

// === 6. JOURNAL, 내 시추에이션 + 퇴근 (한 줄 회고 + 버디 응원) ===
// ============================================================
// 퇴근 화면 (2026-09-04, 개발 뷰). 하루의 마침표: 오늘 얻은 것 / 성장 한 줄 / 실전 사용 체크 / 내일 예고 / 다음 마일스톤
// 목적: "하루 해도 성취감 없음" + "내일 기대감 없음" 피드백. 단어는 가리고 상황만 예고한다.
// ============================================================
function _wrapCorrections(day) {
  // 그날 AI 사수 피드백에서 고친 곳 수 (segments type=removed). 없으면 null
  const c = _loadCompletion(day);
  const segs = c?.feedback?.aiFb?.segments;
  if (!Array.isArray(segs)) return null;
  return segs.filter(x => x && x.type === "removed").length;
}
function _wrapTrend() {
  // 최근 완주 7일 vs 그 전 7일 평균 고침 수. 양쪽 3일 이상 있을 때만
  let days = [];
  try { days = (JSON.parse(localStorage.getItem("__OD_USER") || "null")?.scenariosCompleted || []).map(x => x.day).filter(Boolean).sort((a, b) => a - b); } catch (e) {}
  const vals = days.map(d => _wrapCorrections(d)).map((v, i) => ({ d: days[i], v })).filter(x => x.v !== null);
  if (vals.length < 6) return null;
  const recent = vals.slice(-7), prev = vals.slice(-14, -7);
  if (recent.length < 3 || prev.length < 3) return null;
  const avg = a => a.reduce((s, x) => s + x.v, 0) / a.length;
  return { recent: avg(recent), prev: avg(prev) };
}
function _nextMilestone(day) {
  const ladder = day <= 30 ? [7, 15, 21, 30] : (day <= 60 ? [37, 44, 51, 60] : [90]);
  const labels = { 7: "1주 완주 배지", 15: "절반 돌파", 21: "3주 달성", 30: "사원 승진", 37: "사원 첫 주 완주", 44: "절반 돌파", 51: "50일 달성", 60: "특별 면담", 90: "대리 승진" };
  const nxt = ladder.find(m => m > day);
  return nxt ? { day: nxt, label: labels[nxt] || ("Day " + nxt), left: nxt - day } : null;
}
function WrapupScreen({ today, onDone }) {
  const { SCENARIOS, USER } = window.__SIM;
  const comp = _loadCompletion(today.day);
  const mySentence = comp?.sentence || "";
  const fixes = _wrapCorrections(today.day);
  const praise = comp?.feedback?.aiFb?.praise || "";
  const trend = _wrapTrend();
  const next = SCENARIOS.find(x => x.day === today.day + 1);
  const nextScene = next ? _sceneNoClock(next.scene) : "";
  const ms = _nextMilestone(today.day);
  const usedKey = "__OD_USED_DAY_" + today.day;
  const [used, setUsed] = useState(() => { try { return localStorage.getItem(usedKey); } catch (e) { return null; } });
  const mark = (v) => { setUsed(v); try { localStorage.setItem(usedKey, v); } catch (e) {} };
  const collected = Math.max(1, Number(USER.wordsCollected) || 1);

  const box = { marginTop: 12, padding: "12px 14px", background: "#fff", border: "1px solid var(--line)", borderRadius: 8 };
  const head = { fontSize: 11, fontWeight: 800, letterSpacing: "0.06em", color: "var(--ink-mute)", marginBottom: 6 };

  return (
    <div className="wrapup">
      <div style={{ textAlign: "center", padding: "6px 0 2px" }}>
        <div style={{ display: "inline-block", padding: "12px 24px", border: "3px solid var(--stamp-red)", color: "var(--stamp-red)", fontSize: 17, fontWeight: 900, letterSpacing: "0.16em", transform: "rotate(-5deg)" }}>
          퇴근 · DAY {today.day} 완주
        </div>
      </div>

      <div style={box}>
        <div style={head}>오늘 얻은 것</div>
        <div style={{ fontSize: 13.5, lineHeight: 1.7, color: "var(--ink)" }}>
          <div>표현 1개 · <b style={{ background: "var(--highlight)", padding: "1px 6px" }}>{today.word}</b> <span style={{ color: "var(--ink-mute)", fontSize: 12 }}>{today.meaning}</span></div>
          {mySentence && <div>내 문장 1줄 · <span style={{ fontStyle: "italic" }}>"{mySentence}"</span></div>}
          {fixes !== null && <div>사수가 고친 곳 · <b>{fixes}곳</b>{fixes === 0 ? " (원샷 통과예요)" : ""}</div>}
          {praise && <div style={{ color: "var(--ink-soft)", fontSize: 12.5 }}>사수 한 마디 · {praise}</div>}
        </div>
        <div style={{ marginTop: 10, fontSize: 12, color: "var(--ink-soft)" }}>
          지금까지 표현 <b style={{ color: "var(--ink)" }}>{collected}</b> / 90개를 모았어요.
          <span style={{ display: "block", marginTop: 5, height: 6, background: "var(--paper-warm)", borderRadius: 4, overflow: "hidden" }}>
            <span style={{ display: "block", width: Math.min(100, Math.round(collected / 90 * 100)) + "%", height: "100%", background: "var(--orange)" }} />
          </span>
        </div>
      </div>

      {trend && (
        <div style={box}>
          <div style={head}>나아지고 있어요</div>
          <div style={{ fontSize: 13, color: "var(--ink)", lineHeight: 1.6 }}>
            최근 7일은 문장당 사수가 <b>{trend.recent.toFixed(1)}곳</b> 고쳤어요. 그 전 7일은 {trend.prev.toFixed(1)}곳이었어요.
            {trend.recent < trend.prev ? " 고칠 데가 줄고 있어요." : " 어려운 표현 구간이라 그래요. 계속 가면 돼요."}
          </div>
        </div>
      )}

      <div style={box}>
        <div style={head}>실전 체크</div>
        <div style={{ fontSize: 13, color: "var(--ink)", marginBottom: 8 }}>오늘 표현 <b>{today.word}</b>, 회사에서 쓸 자리가 있었어요?</div>
        <div style={{ display: "flex", gap: 8 }}>
          <button className={"btn " + (used === "1" ? "btn-primary" : "btn-ghost")} style={{ fontSize: 12, padding: "6px 14px" }} onClick={() => mark("1")}>네, 써봤어요</button>
          <button className={"btn " + (used === "0" ? "btn-primary" : "btn-ghost")} style={{ fontSize: 12, padding: "6px 14px" }} onClick={() => mark("0")}>아직이요</button>
        </div>
        {used === "1" && <div style={{ marginTop: 8, fontSize: 12, color: "var(--green)" }}>실전에서 쓴 표현이 하나 늘었어요. 이게 진짜 실력이에요.</div>}
        {used === "0" && <div style={{ marginTop: 8, fontSize: 12, color: "var(--ink-mute)" }}>괜찮아요. 내일 회의에서 한 번 노려봐요.</div>}
      </div>

      <div style={{ ...box, background: "var(--cream)", borderColor: "var(--orange)" }}>
        <div style={head}>내일 예고</div>
        {nextScene ? (
          <div style={{ fontSize: 13.5, color: "var(--ink)", lineHeight: 1.6 }}>
            내일은 이런 일이 있어요. <b>{nextScene}</b>
            <div style={{ fontSize: 12, color: "var(--ink-mute)", marginTop: 4 }}>그때 쓰는 표현은 내일 아침 책상에 올려둘게요.</div>
          </div>
        ) : (
          <div style={{ fontSize: 13.5, color: "var(--ink)" }}>내일은 새 트랙이 열려요. 아침에 책상에서 확인해요.</div>
        )}
        {ms && <div style={{ marginTop: 8, fontSize: 12, color: "var(--ink-soft)" }}>{ms.label}까지 <b>{ms.left}일</b> 남았어요.</div>}
      </div>

      <div className="row" style={{ marginTop: 16, justifyContent: "flex-end" }}>
        <button className="btn btn-primary" onClick={onDone}>내일 봐요 ✓</button>
      </div>
    </div>
  );
}

function JournalActivity({ today, item, onClose, onComplete }) {
  const { CHARACTERS } = window.__SIM;
  const buddy = CHARACTERS.buddy;

  // ★ 이전에 저장한 일지가 있으면 로드 (재진입 시 사라지지 않게)
  const _existing = _loadDailyJournal(today.day);
  const [text, setText] = useState(_existing?.text || "");
  const [submitted, setSubmitted] = useState(!!_existing);
  const [savedToast, setSavedToast] = useState(false);
  // 📝 회고 피드백: 버디가 "그 상황에 단어가 맞는지" 판단 + 추천 영어 문장 + 저장 (사용자 요청)
  const [jFb, setJFb] = useState(null);
  const [jLoading, setJLoading] = useState(false);
  const [jSaved, setJSaved] = useState(false);

  const fetchJournalFeedback = (reflection) => {
    if (!reflection.trim() || !(window.OD?.enabled && window.OD.getMentorAiFeedback)) return;
    setJLoading(true); setJFb(null); setJSaved(false);
    window.OD.getMentorAiFeedback({
      mode: "journal", sentence: reflection, word: today.word, meaning: today.meaning || "",
    }).then(r => {
      setJLoading(false);
      if (r && r.ok && r.journal) setJFb(r.journal);
    }).catch(() => setJLoading(false));
  };

  const saveRecommended = () => {
    if (!jFb || !jFb.recommended) return;
    try {
      const raw = localStorage.getItem("__OD_USER"); const u = raw ? JSON.parse(raw) : {};
      u.savedNotes = u.savedNotes || {}; const dk = String(today.day);
      u.savedNotes[dk] = u.savedNotes[dk] || [];
      if (!u.savedNotes[dk].some(n => n.text === jFb.recommended)) {
        u.savedNotes[dk].push({ kind: "native", label: "네이티브 문장", text: jFb.recommended, savedAt: new Date().toISOString() });
        localStorage.setItem("__OD_USER", JSON.stringify(u));
        if (window.OD?.enabled && window.OD.saveNoteRow && u.email) window.OD.saveNoteRow(u.email, today.day, jFb.recommended, "네이티브 문장", "native").catch(() => {});
      }
      setJSaved(true);
    } catch (e) {}
  };

  const buddyReply = useMemo(() => {
    const pool = [
      `${today.word}, 한 번 직접 써보셨으니 진짜 외운 거예요. 내일 또 만나요.`,
      `오늘 ${today.word}를 한 번도 입으로 안 굴리셨다면 휘발돼요. 자기 전에 한 번만 더 해보세요.`,
      `30일 중 ${window.__SIM.USER.currentDay}일째. ${today.word} 같은 표현 30개 모이면 회의 분위기 자체가 달라져.`,
    ];
    return pool[(today.day - 1) % pool.length];
  }, [today.word, today.day]);

  // 퇴근 화면 (개발 뷰): "퇴근하기" 누르면 바로 닫지 않고 오늘 얻은 것/내일 예고를 먼저 보여준다
  const [wrapStage, setWrapStage] = useState(false);
  const handleLeave = () => { if (_isNextFeature()) setWrapStage(true); else onComplete(); };

  // 제출 = 저장 + submitted 표시
  const handleSubmit = () => {
    if (!text.trim()) return;
    const ok = _saveDailyJournal(today.day, text);
    setSubmitted(true);
    fetchJournalFeedback(text);
    if (ok) {
      setSavedToast(true);
      setTimeout(() => setSavedToast(false), 2500);
    }
  };

  if (wrapStage) {
    return (
      <ActivityShell title={"WRAP-UP · 퇴근 · DAY " + today.day} onClose={onComplete}>
        <WrapupScreen today={today} onDone={onComplete} />
      </ActivityShell>
    );
  }
  return (
    <ActivityShell title="MY SITUATION · 내 시추에이션 + 퇴근" onClose={onClose}>
      <span className="label-doc label-orange">▶ 17:00 · 오늘의 한 줄</span>
      <div style={{ marginTop: 10, fontSize: 13, color: "var(--ink-soft)", lineHeight: 1.6 }}>
        오늘 단어 <b style={{ background: "var(--highlight)", padding: "1px 6px" }}>{today.word}</b>, 진짜 어디서 쓸 수 있을 것 같아요? 한 줄만.
        <span style={{ display: "block", marginTop: 6, fontSize: 11.5, color: "var(--ink-mute)" }}>
          📒 작성한 내 시추에이션은 <b>업무노트 → 해당 날짜 카드</b>에서 다시 볼 수 있어요.
        </span>
      </div>
      <textarea
        className="scene-input"
        placeholder={`예: 다음 회의에서 ${today.word} 한 번 써봐야지. 박 대리한테 ${today.word} 들으면 이제 안 헷갈려.`}
        value={text}
        onChange={e => setText(e.target.value)}
        disabled={submitted}
        style={{ marginTop: 12 }}
      />
      {!submitted ? (
        <div className="row" style={{ marginTop: 12, justifyContent: "space-between" }}>
          <button className="btn btn-ghost" onClick={() => setText(`다음 ${item?.context?.ctx || "회의"}에서 ${today.word} 한 번 써먹어보기.`)}>예시로 채우기</button>
          <button className="btn btn-primary" onClick={handleSubmit} disabled={!text.trim()}>제출 →</button>
        </div>
      ) : (
        <>
          {savedToast && (
            <div style={{ marginTop: 10, padding: "8px 12px", background: "rgba(46,125,50,0.08)", border: "1px solid rgba(46,125,50,0.25)", borderRadius: 6, fontSize: 12, color: "var(--green, #2e7d32)", textAlign: "center", fontWeight: 700 }}>
              ✓ 내 시추에이션 저장됨 · 업무노트에서 다시 볼 수 있어요
            </div>
          )}
          <div style={{ marginTop: 16, padding: 16, background: "rgba(216,90,42,0.06)", border: "1px solid rgba(216,90,42,0.25)", borderRadius: 8 }}>
            <div style={{ display: "flex", gap: 10, alignItems: "center", marginBottom: 8 }}>
              <div className="buddy-avatar small" style={{ width: 32, height: 32, fontSize: 13 }}>{buddy.avatar}</div>
              <div>
                <div className="buddy-name" style={{ fontSize: 13 }}>{buddy.name}</div>
                <div className="buddy-role" style={{ fontSize: 11 }}>{jLoading ? "회고 보는 중…" : (jFb ? "회고 코칭" : "오늘의 응원 한 마디")}</div>
              </div>
            </div>
            {jLoading ? (
              <div style={{ fontSize: 13, color: "var(--ink-soft)", fontStyle: "italic" }}>✍️ 그 상황에 {today.word} 어울리는지 보는 중…</div>
            ) : jFb ? (
              <>
                {jFb.fitMsg && (
                  <div style={{ fontSize: 13.5, color: "var(--ink)", fontWeight: 700, lineHeight: 1.6 }}>
                    {jFb.fit === "good" ? "👍 " : jFb.fit === "bad" ? "⚠️ " : "🤔 "}{jFb.fitMsg}
                  </div>
                )}
                {jFb.reason && <div style={{ fontSize: 12.5, color: "var(--ink-soft)", lineHeight: 1.6, marginTop: 4 }}>{jFb.reason}</div>}
                {jFb.recommended && (
                  <div style={{ marginTop: 12, padding: "10px 12px", background: "#fff", borderLeft: "3px solid #2D7A3D", borderRadius: 4 }}>
                    <div style={{ fontSize: 11, fontWeight: 800, color: "#2D7A3D", marginBottom: 4 }}>💬 이렇게 써보세요</div>
                    <div style={{ fontSize: 14, color: "var(--ink)", fontWeight: 700, lineHeight: 1.55 }}>{jFb.recommended}</div>
                    {jFb.recommendedKo && <div style={{ fontSize: 12, color: "var(--ink-mute)", marginTop: 3 }}>{jFb.recommendedKo}</div>}
                    <button className="btn btn-ghost" style={{ marginTop: 10, fontSize: 12, padding: "6px 12px" }} disabled={jSaved} onClick={saveRecommended}>{jSaved ? "✓ 노트에 저장됨" : "💾 이 문장 저장하기"}</button>
                  </div>
                )}
              </>
            ) : (
              <div style={{ fontSize: 13.5, color: "var(--ink)", lineHeight: 1.6 }}>{buddyReply}</div>
            )}
          </div>
          <div style={{ marginTop: 16, textAlign: "center", padding: "20px 0", position: "relative" }}>
            <div style={{
              display: "inline-block",
              padding: "16px 28px",
              border: "3px solid var(--stamp-red)",
              color: "var(--stamp-red)",
              fontSize: 18, fontWeight: 900, letterSpacing: "0.18em",
              transform: "rotate(-6deg)",
              fontFamily: "'Noto Sans KR', sans-serif",
            }}>
              퇴근 · DAY {today.day} 완주
            </div>
          </div>
          <div className="row" style={{ marginTop: 14, justifyContent: "space-between" }}>
            <button className="btn btn-ghost" onClick={() => setSubmitted(false)}>✏️ 내 시추에이션 수정하기</button>
            <button className="btn btn-primary" onClick={handleLeave}>퇴근하기 ✓</button>
          </div>
        </>
      )}
    </ActivityShell>
  );
}

// === 8. WEEKEND_RECAP, 일요일 이번 주 표현 미니 회고 (3문제) ===
function WeekendRecapActivity({ item, onClose, onComplete }) {
  const { SCENARIOS, USER } = window.__SIM;
  const recent = useMemo(() => {
    return SCENARIOS.filter(s => s.day <= USER.wordsCollected && s.day >= Math.max(1, USER.wordsCollected - 5));
  }, []);

  const questions = useMemo(() => {
    if (recent.length === 0) return [];
    const picks = _shuf(recent).slice(0, Math.min(3, recent.length));
    return picks.map(s => {
      // KO 뜻 → EN 단어 4지선다
      const others = SCENARIOS.filter(o => o.word !== s.word).map(o => o.word);
      const distractors = _shuf(others).slice(0, 3);
      return {
        target: s.meaning,
        prompt: "이번 주 본 단어, 한국어 뜻으로 영어 단어 맞추기",
        options: _shuf([s.word, ...distractors]),
        correct: s.word,
        hint: s.mentorTip || s.tags?.map(t => "#"+t).join(" ") || "",
      };
    });
  }, [recent]);

  const [qIdx, setQIdx] = useState(0);
  const [pick, setPick] = useState(null);
  const [results, setResults] = useState([]);

  if (recent.length === 0) {
    return (
      <ActivityShell title="WEEKEND · 미니 회고" onClose={onClose}>
        <div style={{ textAlign: "center", padding: "30px 0" }}>
          <div style={{ fontSize: 36, marginBottom: 14 }}>☕️</div>
          <div style={{ fontSize: 15, color: "var(--ink)", fontWeight: 700, marginBottom: 8 }}>이번 주는 아직 단어 모은 게 없네요</div>
          <div style={{ fontSize: 13, color: "var(--ink-soft)", lineHeight: 1.7 }}>월요일에 첫 단어부터 차근차근, 다음 일요일에 만나요.</div>
        </div>
        <div className="row" style={{ marginTop: 14, justifyContent: "flex-end" }}>
          <button className="btn btn-primary" onClick={onComplete}>알겠어요 ✓</button>
        </div>
      </ActivityShell>
    );
  }

  const q = questions[qIdx];
  if (qIdx >= questions.length) {
    const correct = results.filter(r => r.ok).length;
    return (
      <ActivityShell title="WEEKEND · 회고 결과" onClose={onClose}>
        <div style={{ textAlign: "center", padding: "20px 0" }}>
          <div style={{ fontSize: 56, fontWeight: 900, color: "var(--orange)", lineHeight: 1, letterSpacing: "-0.04em" }}>
            {correct}<span style={{ fontSize: 22, color: "var(--ink-mute)" }}> / {questions.length}</span>
          </div>
          <div style={{ marginTop: 14, fontSize: 14, color: "var(--ink-soft)" }}>
            {correct === questions.length ? "이번 주 단어 다 잡았어요 🌟" :
             correct >= Math.ceil(questions.length / 2) ? "이번 주 단어 머릿속에 살아있어요." :
             "월요일에 다시 한 번 굴려봐요."}
          </div>
          <div style={{ marginTop: 10, fontSize: 12.5, color: "var(--ink-mute)" }}>
            ☕️ 주말도 챙겼으니 보너스 도장 +1
          </div>
        </div>
        <div className="row" style={{ marginTop: 14, justifyContent: "flex-end" }}>
          <button className="btn btn-primary" onClick={onComplete}>월요일에 봐요 ✓</button>
        </div>
      </ActivityShell>
    );
  }

  const onPick = (opt) => {
    if (pick) return;
    setPick(opt);
    const ok = opt === q.correct;
    setTimeout(() => {
      setResults(r => [...r, { ok, opt }]);
      setQIdx(qIdx + 1);
      setPick(null);
    }, 900);
  };

  return (
    <ActivityShell title={`WEEKEND · 회고 ${qIdx + 1} / ${questions.length}`} onClose={onClose}>
      <span className="label-doc label-orange">▶ 일요일 · 이번 주 표현</span>
      <div style={{ marginTop: 12, fontSize: 12, color: "var(--ink-mute)", letterSpacing: "0.04em", fontWeight: 700 }}>{q.prompt}</div>
      <div style={{ marginTop: 8, padding: 18, background: "var(--cream)", border: "1px dashed var(--line)", borderRadius: 8, fontSize: 18, fontWeight: 800, color: "var(--ink)", lineHeight: 1.45 }}>
        {q.target}
      </div>
      <div style={{ marginTop: 14, display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8 }}>
        {q.options.map((o, i) => {
          const isPicked = pick === o;
          const showResult = pick !== null;
          const ok = o === q.correct;
          return (
            <button
              key={i}
              onClick={() => onPick(o)}
              style={{
                padding: "12px 14px", borderRadius: 8,
                border: "1.5px solid " + (showResult && ok ? "var(--green)" : isPicked ? "var(--stamp-red)" : "var(--line)"),
                background: showResult && ok ? "rgba(74,124,89,0.10)" : isPicked ? "rgba(178,58,44,0.06)" : "#fff",
                cursor: pick === null ? "pointer" : "default",
                fontSize: 13.5, fontFamily: "inherit", color: "var(--ink)",
                fontWeight: showResult && ok ? 800 : 600, textAlign: "center",
              }}
            >
              {o}
            </button>
          );
        })}
      </div>
      {pick && q.hint ? (
        <div style={{ marginTop: 12, fontSize: 12, color: "var(--ink-soft)", padding: "10px 12px", background: "rgba(216,90,42,0.06)", borderRadius: 6 }}>
          💡 {q.hint}
        </div>
      ) : null}
    </ActivityShell>
  );
}

// 디스패처, type별 활동 라우팅
function ActivityModal({ item, today, onClose, onComplete }) {
  if (!item) return null;
  const props = { item, today, onClose, onComplete };
  // 주말 활동, today 없어도 동작
  if (item.type === "weekend_chat") return <WeekendChatActivity {...props} />;
  if (item.type === "weekend_recap") return <WeekendRecapActivity {...props} />;
  // 평일 활동, today 필요
  if (!today) return null;
  switch (item.type) {
    case "checkin": return <CheckinActivity {...props} />;
    case "mini_mission": return <MissionComboActivity {...props} />;
    case "english_lunch": return <LunchActivity {...props} />;
    case "recap": return <RecapActivity {...props} />;
    case "office_task": return <OfficeTaskActivity {...props} />;
    case "journal": return <JournalActivity {...props} />;
    default: return null;
  }
}

          day: USER.currentDay || null,
