function TestPage() {
  const { SCENARIOS, CHARACTERS, USER } = window.__SIM;
  const studied = SCENARIOS.filter(s => s.status === "studied");
  const [phase, setPhase] = useState("idle");
  const [count, setCount] = useState(5);
  const [queue, setQueue] = useState([]);
  const [idx, setIdx] = useState(0);
  const [picked, setPicked] = useState(null);
  const [results, setResults] = useState([]);

  // Hooks must be called unconditionally, keep at top
  const cur = queue[idx];
  const opts = useMemo(() => {
    if (!cur) return [];
    const others = studied.filter(o => o.day !== cur.day).sort(() => Math.random() - 0.5).slice(0, 3).map(o => o.word);
    return [...others, cur.word].sort(() => Math.random() - 0.5);
  }, [cur && cur.day, idx]);

  function start(n) {
    const shuffled = [...studied].sort(() => Math.random() - 0.5).slice(0, n);
    setQueue(shuffled); setIdx(0); setResults([]); setPicked(null); setPhase("playing");
  }

  if (phase === "idle") {
    return (
      <div>
        <div className="desk-header">
          <div>
            <div className="desk-eyebrow">EVALUATION · 분기 평가</div>
            <h1 className="desk-title"><em>롤플레이</em> 시험 응시</h1>
          </div>
          <div className="desk-meta"><b>총 {studied.length}개</b> 학습 완료<br/>5개 시추에이션 무작위</div>
        </div>
        <ApprovalLine doc="YB-EVAL-Q1" applicant={USER.name} status="응시 대기" />

        <div className="eval-wrap">
          <div className="eval-head">
            <div>
              <div className="eval-head-sub">QUARTERLY EVALUATION</div>
              <div className="eval-head-title">5개 시추에이션 · 객관식 4지선다</div>
            </div>
            <div className="stamp">평가</div>
          </div>
          <div className="eval-body">
            <div style={{ fontSize: 14, lineHeight: 1.7, color: "var(--ink-soft)", marginBottom: 18 }}>
              실제 회의/이메일 상황이 주어집니다. 빈 칸에 들어갈 가장 자연스러운 영어 표현을 4개 보기에서 선택하세요.<br/>
              <b style={{ color: "var(--ink)" }}>틀려도 정답을 보여드려요. 모르는 단어는 다시 학습 노트에서 복습 가능.</b>
            </div>
            <div className="row">
              {[3, 5, 10].filter(n => n <= studied.length).map(n => (
                <button key={n} className={"filter-chip " + (count === n ? "active" : "")} onClick={() => setCount(n)}>{n}문제</button>
              ))}
            </div>
            <div className="row" style={{ marginTop: 22 }}>
              <button className="btn btn-primary" onClick={() => start(count)} disabled={studied.length === 0}>
                평가 시작 · {count}문제 →
              </button>
              <span style={{ fontSize: 11, color: "var(--ink-mute)" }}>실제 평가는 Day 30 자동 응시</span>
            </div>
          </div>
        </div>
      </div>
    );
  }

  if (phase === "done") {
    const correct = results.filter(r => r.ok).length;
    return (
      <div>
        <div className="desk-header">
          <div>
            <div className="desk-eyebrow">RESULT · 평가 결과서</div>
            <h1 className="desk-title"><em>{correct === queue.length ? "전원 통과!" : "수고했어요"}</em></h1>
          </div>
        </div>
        <div className="eval-wrap">
          <div className="eval-head">
            <div className="eval-head-title">평가 결과서</div>
            <div className={"stamp " + (correct >= queue.length * 0.6 ? "" : "blue")}>
              {correct === queue.length ? "통과" : correct >= queue.length * 0.6 ? "재검토" : "보류"}
            </div>
          </div>
          <div className="eval-body">
            <div style={{ fontSize: 64, fontWeight: 900, letterSpacing: "-0.04em", color: "var(--orange)", lineHeight: 1 }}>
              {correct}<span style={{ fontSize: 24, color: "var(--ink-mute)", fontWeight: 600 }}> / {queue.length}</span>
            </div>
            <div style={{ marginTop: 12, fontSize: 14, color: "var(--ink-soft)" }}>
              {correct === queue.length ? "사수가 칭찬해요. 다음 평가도 이대로!" : "틀린 문제는 업무 노트에서 다시 만나요."}
            </div>
            <div className="row" style={{ marginTop: 22 }}>
              <button className="btn btn-primary" onClick={() => start(count)}>다시 풀기 →</button>
              <button className="btn btn-ghost" onClick={() => setPhase("idle")}>설정으로</button>
            </div>
            <hr className="divider" />
            <div className="label-doc" style={{ marginBottom: 10 }}>풀이 기록</div>
            <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
              {results.map((r, i) => (
                <div key={i} style={{ display: "flex", justifyContent: "space-between", padding: "10px 14px", background: r.ok ? "rgba(74,124,89,0.06)" : "rgba(178,58,44,0.06)", border: "1px solid var(--line)", fontSize: 13 }}>
                  <span style={{ fontWeight: 800, color: "var(--ink)" }}>{queue[i].word}</span>
                  <span style={{ fontWeight: 800, color: r.ok ? "var(--green)" : "var(--stamp-red)", letterSpacing: "0.04em", fontSize: 11 }}>
                    {r.ok ? "✓ 정답" : "✗ 오답"}
                  </span>
                </div>
              ))}
            </div>
          </div>
        </div>
      </div>
    );
  }

  // playing
  const npc = CHARACTERS[cur.npc];
  const cells = queue.map((_, i) => {
    if (i < results.length) return results[i].ok ? "done" : "wrong";
    if (i === idx) return "current";
    return "";
  });

  function pick(opt) {
    if (picked) return;
    const ok = opt === cur.word;
    setPicked(opt);
    setTimeout(() => {
      const next = [...results, { ok, picked: opt }];
      setResults(next);
      if (idx + 1 >= queue.length) { setPhase("done"); return; }
      setIdx(idx + 1); setPicked(null);
    }, 1200);
  }

  // 영어 답변 문장에서 타깃 단어를 빈 칸으로 (활용형 포함)
  // sampleAnswer에 정확한 단어가 없으면 활용형(ing/ed/s), 마지막엔 quote로 fallback
  const _blankedAnswer = (() => {
    const answer = (cur.sampleAnswer || "").trim();
    const word = (cur.word || "").trim();
    if (!answer || !word) return { text: cur.quote || "", source: "quote" };
    const esc = (s) => s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    // 1차: 단어 그대로 (case-insensitive)
    const reExact = new RegExp("(^|[^a-z])(" + esc(word) + ")([^a-z]|$)", "i");
    if (reExact.test(answer)) return { text: answer.replace(reExact, "$1___BLANK___$3"), source: "answer" };
    // 2차: 동사 활용형 (loop in → looping in 등)
    const tokens = word.split(/\s+/);
    const forms = window._verbForms ? window._verbForms(tokens[0]) : [tokens[0]];
    const tail = tokens.slice(1).map(esc).join("\\s+");
    for (const f of forms) {
      const head = esc(f);
      const pat = tail
        ? "(^|[^a-z])(" + head + "\\s+" + tail + ")([^a-z]|$)"
        : "(^|[^a-z])(" + head + ")([^a-z]|$)";
      const re = new RegExp(pat, "i");
      if (re.test(answer)) return { text: answer.replace(re, "$1___BLANK___$3"), source: "answer" };
    }
    // Fallback: 그대로 보여줌
    return { text: answer, source: "answer-nolimit" };
  })();

  return (
    <div>
      <div className="desk-header">
        <div>
          <div className="desk-eyebrow">EVALUATION · IN PROGRESS</div>
          <h1 className="desk-title">{idx + 1} / {queue.length} 문제</h1>
        </div>
      </div>
      <div className="eval-wrap">
        <div className="eval-head">
          <div className="eval-head-sub">Q. {idx + 1} / {queue.length}</div>
          <div className="eval-head-title">{cur.tags && cur.tags.map(t => "#" + t).join(" ")}</div>
        </div>
        <div className="eval-body">
          <div className="eval-progress">
            {cells.map((c, i) => <div key={i} className={"eval-progress-cell " + c}></div>)}
          </div>

          {/* 1) SITUATION, 한글로 상황 설명 */}
          <div className="eval-q-num">SITUATION · 상황</div>
          <div className="eval-q-scene">📍 {cur.scene}</div>
          <div className="scene-quote-row" style={{ marginTop: 14 }}>
            <div className="scene-avatar" style={{ background: npc.color }}>{npc.avatar}</div>
            <div style={{ flex: 1 }}>
              <div className="scene-npc-name">{npc.name}</div>
              <div className="scene-quote-bubble">"{cur.quote}"</div>
              <KoPeek ko={cur.quoteKo} />
            </div>
          </div>

          {/* 2) 한국어 가이드, 어떻게 답해야 하나 */}
          {cur.task && (cur.task.promptKo || cur.task.koSentence) && (
            <div style={{
              marginTop: 18, padding: "12px 14px",
              background: "var(--paper-warm)",
              borderLeft: "3px solid var(--accent)",
              borderRadius: 4,
            }}>
              <div style={{ fontSize: 11, fontWeight: 800, color: "var(--ink-mute)", letterSpacing: "0.1em", marginBottom: 6 }}>
                📝 한국어로 답한다면
              </div>
              <div style={{ fontSize: 14, color: "var(--ink)", lineHeight: 1.65, fontWeight: 600 }}>
                {cur.task.koSentence || cur.task.promptKo}
              </div>
            </div>
          )}

          {/* 3) 영어 답변 빈칸 채우기 */}
          <div style={{
            marginTop: 18, padding: "18px 20px",
            background: "#FFE9A6",
            border: "1px solid var(--line)",
            borderRadius: 6,
          }}>
            <div style={{ fontSize: 11, fontWeight: 800, color: "#8C6510", letterSpacing: "0.12em", marginBottom: 10 }}>
              ENGLISH · 영어로 한 줄
            </div>
            <div style={{ fontSize: 16, color: "var(--ink)", lineHeight: 1.65, fontWeight: 500 }}>
              "{_blankedAnswer.text.split("___BLANK___").map((p, i, arr) => (
                <React.Fragment key={i}>
                  {p}
                  {i < arr.length - 1 ? (
                    <span style={{
                      display: "inline-block",
                      background: "var(--ink)", color: "var(--paper)",
                      padding: "2px 18px", letterSpacing: "0.4em",
                      borderRadius: 3, fontWeight: 800,
                      verticalAlign: "baseline",
                    }}>____</span>
                  ) : null}
                </React.Fragment>
              ))}"
            </div>
          </div>

          <div className="label-doc" style={{ marginTop: 22 }}>빈 칸에 들어갈 영어 표현은?</div>
          <div className="eval-options">
            {opts.map((o, i) => {
              let cls = "";
              if (picked) {
                if (o === cur.word) cls = "correct";
                else if (o === picked) cls = "wrong";
              } else if (o === picked) cls = "selected";
              return (
                <button key={o} className={"eval-option " + cls} onClick={() => pick(o)}>
                  <span className="eval-option-letter">{String.fromCharCode(65 + i)}</span>
                  {o}
                </button>
              );
            })}
          </div>
        </div>
      </div>
    </div>
  );
}

// ============================================================
// 영어 동사 활용형 생성기, "loop" → [loop, loops, looped, looping]
// 룰: 3인칭 단수 -s/-es/-ies, 과거 -ed/-d/-ied/-CVCed, 진행 -ing/-CVCing/-e+ing
// 완벽한 형태소 분석 아님, 흔한 활용형 다 잡기 위한 휴리스틱
// ============================================================
function _verbForms(v) {
  v = (v || "").toLowerCase();
  if (!v) return [];
  const forms = new Set([v]);
  const last = v.slice(-1);
  const last2 = v.slice(-2);
  // 3인칭 단수
  if (/(s|x|z|ch|sh)$/.test(v))      forms.add(v + "es");
  else if (/[^aeiou]y$/.test(v))     forms.add(v.slice(0, -1) + "ies");
  else                                forms.add(v + "s");
  // 과거형
  if (last === "e")                  forms.add(v + "d");
  else if (/[^aeiou]y$/.test(v))     forms.add(v.slice(0, -1) + "ied");
  else if (/[^aeiou][aeiou][^aeiouwxy]$/.test(v) && v.length >= 3) {
    forms.add(v + last + "ed");      // CVC: stop → stopped
    forms.add(v + "ed");
  } else                              forms.add(v + "ed");
  // 진행형 -ing
  if (last === "e" && last2 !== "ee" && v.length > 2) forms.add(v.slice(0, -1) + "ing");
  else if (/[^aeiou][aeiou][^aeiouwxy]$/.test(v) && v.length >= 3) {
    forms.add(v + last + "ing");     // stopping
    forms.add(v + "ing");
  } else                              forms.add(v + "ing");
  return [...forms];
}

function _escapeRegex(s) {
  return (s || "").replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
}

// 문장에 타깃 단어가 들어있는지 (활용형 포함) 검사.
// 1차: 그대로 substring 매치 (가장 빠름, 명사·약어·하이픈 단어에 강함)
// 2차: 첫 토큰을 동사로 보고 활용형 정규식, 다중어 구는 인접 매치 가정
//     예) target "loop in", sentence "looping in @design-lead" → 매치
function _hasTargetWord(sentence, targetWord) {
  if (!targetWord || !sentence) return false;
  const lower = sentence.toLowerCase();
  const target = (targetWord || "").toLowerCase().trim();
  if (!target) return false;
  if (lower.includes(target)) return true;
  const tokens = target.split(/\s+/).filter(Boolean);
  if (!tokens.length) return false;
  const head = "(?:" + _verbForms(tokens[0]).map(_escapeRegex).join("|") + ")";
  const tail = tokens.slice(1).map(_escapeRegex).join("\\s+");
  const pattern = tail
    ? "(^|[^a-z])" + head + "\\s+" + tail + "([^a-z]|$)"
    : "(^|[^a-z])" + head + "([^a-z]|$)";
  try { return new RegExp(pattern, "i").test(sentence); }
  catch (_) { return false; }
}

// ============================================================
// 사수 피드백, 룰 기반 (5체크 + 시나리오별 코멘트)
// ============================================================
function _classifyMentorFeedback(sentence, scenario) {
  const word = (scenario.word || "").toLowerCase();
  const lower = sentence.toLowerCase();
  const wordCount = sentence.trim().split(/\s+/).filter(Boolean).length;

  const hasWord    = _hasTargetWord(sentence, scenario.word);
  const tooFormal  = /\b(pursuant|kindly|hereby|aforementioned|herein|thereof|wherein)\b/i.test(sentence);
  const tooCasual  = /\byo\b|\bhey\b|\blol\b|\bomg\b|\bpls\b|\bthx\b/i.test(sentence);
  const hasAction  = /\bI'll\b|\bI will\b|\blet me\b|\bI'm\s+(?:going|gonna)\b|\bI can\b/i.test(sentence);
  const hasTiming  = /\b(eod|cob|asap|today|tonight|tomorrow|monday|tuesday|wednesday|thursday|friday|next week|this week|by \w+)\b|\d/i.test(sentence);
  const tooShort   = wordCount < 5;
  const tooLong    = wordCount > 30;
  const isExample  = sentence.trim() === (scenario.sampleAnswer || "").trim();

  // 체크 결과 배열
  const checks = [];
  checks.push(hasWord
    ? { ok: true,  label: "단어 사용",   note: `${scenario.word} 자연스럽게 들어감` }
    : { ok: false, label: "단어 사용",   note: `${scenario.word} 못 살림, 한 번 더 써보자` });

  if (tooFormal)      checks.push({ ok: false, label: "톤", note: "너무 격식, 사내 메시지엔 부담" });
  else if (tooCasual) checks.push({ ok: false, label: "톤", note: "사내 톤으로는 살짝 가벼움" });
  else                checks.push({ ok: true,  label: "톤", note: "사내 메시지로 적절" });

  if (hasAction)      checks.push({ ok: true,  label: "Action", note: "주체·행동 명확함" });
  if (hasTiming)      checks.push({ ok: true,  label: "구체성", note: "시점·숫자가 보여서 신뢰감 있음" });

  if (tooShort)       checks.push({ ok: false, label: "길이", note: "조금 더 풀어 써도 좋아" });
  else if (tooLong)   checks.push({ ok: false, label: "길이", note: "한 호흡 짧게, 슬랙은 짧을수록 좋아" });

  // ── 헤드라인 풀: 같은 케이스라도 매번 다른 멘트 (피드백 #10, 반복 멘트 다양화) ──
  // 같은 문장은 같은 멘트(저장·복원 일관성), 문장을 고치면 멘트도 바뀜.
  const _pickV = (pool) => pool[(scenario.day + wordCount + sentence.length) % pool.length];
  const W = scenario.word;
  let headline;
  if (isExample) {
    headline = _pickV([
      "예시 문장 그대로 제출하셨네. 본인 표현으로 한 번 써보면 더 늘어요.",
      "예문 참고는 좋아. 근데 한 단어라도 본인 상황으로 바꿔보면 기억에 세 배 오래 남아요.",
      "모범 답안은 출발점이에요. 내일은 본인 문장으로 한 줄, 약속.",
    ]);
  } else if (!hasWord) {
    headline = _pickV([
      `${W}이(가) 빠졌어요. 오늘 단어를 꼭 써봐야 입에 붙어요.`,
      `문장은 자연스러운데 정작 ${W}이(가) 없네요. 오늘의 주인공을 살려주세요.`,
      `${W} 없이도 말은 되지만, 오늘 미션의 핵심은 그 단어를 입에 붙이는 거예요.`,
    ]);
  } else if (tooFormal) {
    headline = _pickV([
      "단어는 잘 살렸는데, 표현이 너무 무거워. 슬랙 한 줄 정도 가벼움이 좋아.",
      "계약서 번역투에 가까워. 동료한테 말하듯 풀면 같은 내용도 훨씬 잘 통해.",
      "격식은 충분하니, 이제 힘을 빼보자. 비즈니스 영어의 고수는 쉬운 단어로 말해.",
    ]);
  } else if (tooCasual) {
    headline = _pickV([
      `톤이 좀 가벼워. ${W}을(를) 잘 살렸으니, 사내 채널엔 무게 살짝만 더 줘.`,
      `친구한테 보내는 톤이야. ${W}은(는) 좋았으니 인사말만 사내용으로 바꿔보자.`,
    ]);
  } else if (tooShort) {
    headline = _pickV([
      "한 줄로는 의도가 안 보일 수 있어. 누가/언제/뭘 한다 정도까지 풀어보자.",
      "짧은 건 좋은데 정보가 부족해. 받은 사람이 되묻지 않게 한 조각만 더.",
      "핵심은 있는데 살이 없어. 누가/언제까지 중 하나만 더 얹어보자.",
    ]);
  } else if (tooLong) {
    headline = _pickV([
      "내용은 좋은데 길어. 한 호흡으로 끊으면 임팩트 더 살아.",
      "정성은 보이는데 슬랙에선 긴 글부터 안 읽혀. 절반으로 줄여볼까?",
      "좋은 내용이 길이에 묻혔어. 가장 중요한 문장 하나만 남겨보자.",
    ]);
  } else if (hasAction && hasTiming) {
    headline = _pickV([
      `완벽에 가까워. ${W} + 행동 + 시점까지, 사수가 더 볼 게 없는 문장이야.`,
      "이 문장 그대로 보내도 돼. 단어, 행동, 시점 세 박자가 다 잡혔어.",
      `오늘 건 노트에 저장해둬. ${W} 실전 활용의 교과서 같은 문장이야.`,
    ]);
  } else if (hasAction) {
    headline = _pickV([
      "오늘 단어 자연스럽게 들어갔고, action까지 명확. 이대로면 회의에서도 통해요.",
      `${W} 활용 정확하고 주체도 분명해. 끝에 by Friday 같은 시점 하나 박으면 만점.`,
      "사수 입장에서 반가운 답이야. 뭘 하겠다는 게 보여. 언제까지인지만 더해보자.",
      `이 정도면 Daniel한테 바로 보내도 부끄럽지 않아. ${W} 감 제대로 잡았네.`,
    ]);
  } else {
    headline = _pickV([
      `${W} 잘 들어갔어. 다음엔 "I'll …" 같은 액션 동사 더해보면 더 프로페셔널해져.`,
      `${W} 자연스러워. 여기에 '내가 언제까지 뭘 할게'까지 붙으면 사수가 안심해.`,
      `좋아, ${W} 쓰임새 정확해. 욕심내자면 주어를 I로 세워서 다음 행동을 약속해봐.`,
      `${W} 감 잡았네. 받은 공을 되돌려주는 한 마디(다음 행동)까지 붙이면 완성이야.`,
      "깔끔하게 들어갔어. 끝에 EOD나 tomorrow 같은 시점 하나 박아봐, 신뢰도가 달라져.",
    ]);
  }

  // 전체 통과 여부 (4개 이상 ok이면 우수)
  const okCount = checks.filter(c => c.ok).length;
  const overall = isExample ? "neutral" : okCount >= checks.length - 1 ? "good" : "needs-work";

  return { checks, headline, overall, isExample };
}

// 영작 첨삭 단어 단위 diff (모델 segments가 없을 때 프론트에서 취소선 생성)
function _odWordDiff(orig, corrected) {
  const tok = (s) => String(s || "").trim().split(/(\s+)/).filter(t => t.length);
  const a = tok(orig), b = tok(corrected);
  const n = a.length, m = b.length;
  if (!n || !m) return [];
  const eq = (x, y) => x === y || x.trim().toLowerCase() === y.trim().toLowerCase();
  const dp = Array.from({ length: n + 1 }, () => new Array(m + 1).fill(0));
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--)
    dp[i][j] = eq(a[i], b[j]) ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const out = [];
  const push = (type, text) => { if (!text) return; const last = out[out.length - 1]; if (last && last.type === type) last.text += text; else out.push({ type, text }); };
  let i = 0, j = 0;
  while (i < n && j < m) {
    if (eq(a[i], b[j])) { push("keep", b[j]); i++; j++; }
    else if (dp[i + 1][j] >= dp[i][j + 1]) { push("removed", a[i]); i++; }
    else { push("added", b[j]); j++; }
  }
  while (i < n) { push("removed", a[i]); i++; }
  while (j < m) { push("added", b[j]); j++; }
  return out;
}

// 업무일지(JournalActivity) 저장/조회 헬퍼
// __OD_USER.dailyJournals[dayKey] = { text, day, savedAt }
function _loadDailyJournal(day) {
  try {
    const u = JSON.parse(localStorage.getItem("__OD_USER") || "null");
    return u?.dailyJournals?.[String(day)] || null;
  } catch (e) { return null; }
}
function _saveDailyJournal(day, text) {
  if (!text || !text.trim()) return false;
  try {
    const raw = localStorage.getItem("__OD_USER");
    const u = raw ? JSON.parse(raw) : {};
    u.dailyJournals = u.dailyJournals || {};
    const dayKey = String(day);
    u.dailyJournals[dayKey] = {
      text: text.trim(),
      day: day,
      savedAt: new Date().toISOString(),
    };
    localStorage.setItem("__OD_USER", JSON.stringify(u));
    // ★ 새 RPC 경로 (1row=1journal). 실패 시 outbox로 큐잉, 60초마다 자동 재시도.
    if (window.OD && window.OD.enabled && window.OD.saveJournalRow && u.email) {
      const t = text.trim();
      window.OD.saveJournalRow(u.email, day, t).then(r => {
        if (!r || !r.ok) {
          window.OD.pushOutbox && window.OD.pushOutbox({ type: 'journal', email: u.email, day: day, text: t });
        }
        window.OD.sendSlackMirror && window.OD.sendSlackMirror({ type: 'journal', email: u.email, day: day, text: t });
      }).catch(() => {
        window.OD.pushOutbox && window.OD.pushOutbox({ type: 'journal', email: u.email, day: day, text: t });
      });
    }
    return true;
  } catch (e) { console.warn("saveDailyJournal failed:", e); return false; }
}

// scenariosCompleted 저장/조회 헬퍼
function _loadCompletion(day) {
  try {
    const u = JSON.parse(localStorage.getItem("__OD_USER") || "null");
    return (u?.scenariosCompleted || []).find(s => s.day === day) || null;
  } catch (e) { return null; }
}
function _saveCompletion(entry) {
  try {
    const raw = localStorage.getItem("__OD_USER");
    const u = raw ? JSON.parse(raw) : {};
    u.scenariosCompleted = u.scenariosCompleted || [];
    const idx = u.scenariosCompleted.findIndex(s => s.day === entry.day);
    if (idx >= 0) u.scenariosCompleted[idx] = entry;
    else u.scenariosCompleted.push(entry);
    localStorage.setItem("__OD_USER", JSON.stringify(u));

    // ★ 새 정규화 경로 (submissions + submissions_history append-only).
    // write-through verify, 실패 시 outbox 큐잉, Slack 미러로 외부 보험.
    if (window.OD && window.OD.enabled && window.OD.saveSubmission && u.email) {
      // 영작 본문 필드, mainboard 코드 흐름은 entry.sentence (4416번 라인의 _saveCompletion 호출 기준).
      // 다른 호출자 호환 위해 sentence > userAnswer > answer > text 순서로.
      const answerText = entry.sentence || entry.userAnswer || entry.answer || entry.text || '';
      if (answerText.trim()) {
        const payload = {
          word: entry.word || null,
          scenario_id: entry.scenarioId || (String(entry.day) + ':' + (entry.word || '')),
          answer_text: answerText,
          mc_choice: entry.mcChoice || null,
          mentor_feedback: entry.feedback || entry.mentorFeedback || {},
          meta: { submittedAt: entry.submittedAt || new Date().toISOString(), raw: entry },
        };
        window.OD.saveSubmission(u.email, entry.day, payload).then(r => {
          if (!r || !r.ok || !r.verified) {
            window.OD.pushOutbox && window.OD.pushOutbox({ type: 'submission', email: u.email, day: entry.day, payload });
          }
          window.OD.sendSlackMirror && window.OD.sendSlackMirror({ type: 'submission', email: u.email, day: entry.day, payload });
        }).catch(() => {
          window.OD.pushOutbox && window.OD.pushOutbox({ type: 'submission', email: u.email, day: entry.day, payload });
        });
      }
    }
  } catch (e) { console.warn("saveCompletion failed:", e); }
}

function JournalEditor({ day }) {
  const [journal, setJournal] = useState(() => _loadDailyJournal(day));
  const [editing, setEditing] = useState(false);
  const [draft, setDraft] = useState(journal?.text || "");
  const [savedFlash, setSavedFlash] = useState(false);

  const startEdit = () => { setDraft(journal?.text || ""); setEditing(true); };
  const cancelEdit = () => { setDraft(journal?.text || ""); setEditing(false); };
  const handleSave = () => {
    if (!draft.trim()) return;
    const ok = _saveDailyJournal(day, draft);
    if (ok) {
      const next = { text: draft.trim(), day, savedAt: new Date().toISOString() };
      setJournal(next);
      setEditing(false);
      setSavedFlash(true);
      setTimeout(() => setSavedFlash(false), 2500);

  // 빈 상태, 작성 안 한 날

          padding: "8px 16px", fontSize: 12, fontWeight: 700,
          background: "transparent", color: "var(--accent)",

  // 수정 모드 (textarea + 저장/취소)

    return (
      <div style={{
        marginTop: 22, padding: "16px 18px",
        background: "rgba(216,90,42,0.06)",
        border: "1px dashed var(--accent)",
        borderRadius: 8,
      }}>
        <div style={{ fontSize: 11, fontWeight: 800, letterSpacing: "0.12em", color: "var(--accent)", marginBottom: 10 }}>
          📝 내 업무일지 · DAY {day} {journal ? "(수정 중)" : "(새로 작성)"}

        <textarea
          value={draft}
          onChange={e => setDraft(e.target.value)}
          placeholder="오늘 단어, 어디서 쓸 수 있을 것 같아요? 한 줄로."
          style={{
            width: "100%", minHeight: 80, padding: "10px 12px",
            fontSize: 13, fontFamily: "inherit",
            background: "rgba(255,255,255,0.7)",
            border: "1px solid var(--line)", borderRadius: 6,
            color: "var(--ink)", lineHeight: 1.55, resize: "vertical",
          }}
        />
        <div style={{ display: "flex", gap: 8, marginTop: 10, justifyContent: "flex-end" }}>
          <button onClick={cancelEdit} style={{
            padding: "8px 14px", fontSize: 12, fontWeight: 600,
            background: "transparent", color: "var(--ink-soft)",
            border: "1px solid var(--line)", borderRadius: 6,
            cursor: "pointer", fontFamily: "inherit",
          }}>취소</button>
          <button onClick={handleSave} disabled={!draft.trim()} style={{
            padding: "8px 14px", fontSize: 12, fontWeight: 700,
            background: "var(--ink)", color: "var(--paper)",
            border: "none", borderRadius: 6,
            cursor: draft.trim() ? "pointer" : "not-allowed",
            opacity: draft.trim() ? 1 : 0.4,
            fontFamily: "inherit",
          }}>저장</button>
        </div>
      </div>
    );
  }

  // 읽기 모드 (수정 버튼 있음)
  return (
    <div style={{
      marginTop: 22, padding: "16px 18px",
      background: "rgba(216,90,42,0.06)",

    }}>

        </div>
        <button onClick={startEdit} style={{
          padding: "4px 10px", fontSize: 11, fontWeight: 700,

          ✓ 저장되었어요

      <div style={{

function SceneModal({ scenario, onClose }) {
  const { CHARACTERS, BUDDY_ANSWERS } = window.__SIM;
  const npc = CHARACTERS[scenario.npc];
  const buddy = CHARACTERS.buddy;
  // 이미 푼 day면 저장된 답변 + 피드백 복원
  const saved = useMemo(() => _loadCompletion(scenario.day), [scenario.day]);
  const [draft, setDraft] = useState(saved?.sentence || "");
  const [submitted, setSubmitted] = useState(!!saved);
  const [feedback, setFeedback] = useState(saved?.feedback || null);
  const [editing, setEditing] = useState(false);
  // ★ AI 사수 피드백 (4구획: fix/nuance/vocab/praise). 저장된 것 복원.
  const [aiFb, setAiFb] = useState(saved?.feedback?.aiFb || null);
  const [aiLoading, setAiLoading] = useState(false);
  const [nativeSaved, setNativeSaved] = useState(false);
  const [memoDraft, setMemoDraft] = useState("");
  const [notesVer, setNotesVer] = useState(0);
  const [buddyMsgs, setBuddyMsgs] = useState([]);
  // ★ 피드백 #23 (박은실): 버디 대화는 우하단 메신저 도크로 분리 (모달 속 스크롤 제거)
  const [buddyDockOpen, setBuddyDockOpen] = useState(false);
  const [buddyDockWide, setBuddyDockWide] = useState(false);  // 확장 모드 (늘였다 줄였다)
  const _dockLogRef = React.useRef(null);
  React.useEffect(() => {
    // 새 메시지마다 맨 아래로
    if (_dockLogRef.current) _dockLogRef.current.scrollTop = _dockLogRef.current.scrollHeight;
  }, [buddyMsgs, buddyDockOpen]);

  function handleSubmit() {
    const fb = _classifyMentorFeedback(draft, scenario);
    setFeedback(fb);
    setSubmitted(true);
    setEditing(false);
    setAiFb(null);
    setNativeSaved(false);
    _saveCompletion({
      day: scenario.day,
      word: scenario.word,
      sentence: draft,
      feedback: fb,
      submittedAt: new Date().toISOString(),
    });

    // ★ AI 사수 코멘트 (실패/느리면 규칙 기반 피드백만 유지, 폴백)
    //    예시 그대로 낸 경우엔 AI 호출 생략 (본인 문장 아니라 코칭 의미 없음)
    if (!fb.isExample && draft.trim() && window.OD?.enabled && window.OD.getMentorAiFeedback) {
      setAiLoading(true);
      const _submittedDraft = draft;
      window.OD.getMentorAiFeedback({
        sentence: draft,
        word: scenario.word,
        meaning: scenario.meaning,
        scene: scenario.scene,
        sampleAnswer: scenario.sampleAnswer,
        koSentence: (scenario.task && scenario.task.koSentence) || "",
        promptKo: (scenario.task && scenario.task.promptKo) || "",
        mentorName: CHARACTERS.mentor.name,
      }).then(r => {
        setAiLoading(false);
        if (r && r.ok && r.fb) {
          setAiFb(r.fb);
          // 저장된 피드백에도 AI 4구획 합쳐서 영속화 (재진입 시 복원)
          try {
            const cur = _loadCompletion(scenario.day);
            if (cur && cur.sentence === _submittedDraft) {
              cur.feedback = { ...(cur.feedback || {}), aiFb: r.fb };
              _saveCompletion(cur);
            }
          } catch (e) {}
        }
      }).catch(() => setAiLoading(false));
    }
    // ★ 피드백 #15: 홈 시추에이션 카드로 바로 들어와 제출한 경우에도
    //   일정의 '오늘의 시추에이션' 항목을 완료 처리 (재진입 없이 다음 순서 진행)
    try {
      const taskKey = "__OD_TASKS_DAY_" + scenario.day;
      const tasks = JSON.parse(localStorage.getItem(taskKey) || "{}");
      if (!tasks.scenario) {
        tasks.scenario = true;
        localStorage.setItem(taskKey, JSON.stringify(tasks));
        localStorage.setItem(taskKey + "_ts", new Date().toISOString());
        const u = JSON.parse(localStorage.getItem("__OD_USER") || "null");
        if (window.OD?.enabled && window.OD.saveTaskProgress && u?.email) {
          window.OD.saveTaskProgress(u.email, scenario.day, tasks).catch(() => {
            window.OD.pushOutbox?.({ type: 'task', email: u.email, day: scenario.day, tasks });
          });
        }
        // HomePage가 doneTasks를 다시 읽도록 알림
        window.dispatchEvent(new CustomEvent("od-tasks-changed", { detail: { day: scenario.day } }));
      }
    } catch (e) {}
  }

  function askBuddy(kind) {
    // 시나리오별 buddy 답변 우선, 없으면 기본 풀에서 랜덤
    const customAnswer = scenario.buddyAnswers && scenario.buddyAnswers[kind];
    const reply = customAnswer || (function() {
      const pool = BUDDY_ANSWERS[kind] || BUDDY_ANSWERS.default;
      return pool[Math.floor(Math.random() * pool.length)];
    })();
    const userQ = kind === "nuance" ? "이거 뉘앙스가 좀 헷갈려요" : kind === "example" ? "예문 더 보고 싶어요" : "이 표현 어떻게 외우면 좋을까요?";
    setBuddyMsgs([...buddyMsgs, { from: "me", text: userQ }, { from: "buddy", text: reply, kind: kind }]);
  }

  // 노트 저장 헬퍼, __OD_USER.savedNotes[day] 배열에 추가
  function saveBuddyNote(text, kind) {
    try {
      const raw = localStorage.getItem("__OD_USER");
      const u = raw ? JSON.parse(raw) : {};
      u.savedNotes = u.savedNotes || {};
      const dayKey = String(scenario.day);
      u.savedNotes[dayKey] = u.savedNotes[dayKey] || [];
      // 중복 방지
      if (u.savedNotes[dayKey].some(n => n.text === text)) return false;
      const labelMap = { nuance: "뉘앙스", example: "예문", default: "외우는 팁", native: "네이티브 문장", memo: "메모" };
      u.savedNotes[dayKey].push({
        kind, label: labelMap[kind] || "메모",
        text, savedAt: new Date().toISOString(),
      });
      localStorage.setItem("__OD_USER", JSON.stringify(u));

      // ★ 새 정규화 경로 (notes 테이블, 1row=1note). 실패 시 outbox 큐잉.
      const noteEntry = u.savedNotes[dayKey][u.savedNotes[dayKey].length - 1];
      if (window.OD && window.OD.enabled && window.OD.saveNoteRow && u.email) {
        const dayInt = Number(dayKey);
        window.OD.saveNoteRow(u.email, dayInt, noteEntry.text, noteEntry.label || null, noteEntry.kind || null).then(r => {
          if (!r || !r.ok) {
            window.OD.pushOutbox && window.OD.pushOutbox({ type: 'note', email: u.email, day: dayInt, text: noteEntry.text, label: noteEntry.label, kind: noteEntry.kind });
          }
          window.OD.sendSlackMirror && window.OD.sendSlackMirror({ type: 'note', email: u.email, day: dayInt, text: noteEntry.text, kind: noteEntry.kind });
        }).catch(() => {
          window.OD.pushOutbox && window.OD.pushOutbox({ type: 'note', email: u.email, day: dayInt, text: noteEntry.text, label: noteEntry.label, kind: noteEntry.kind });
        });
      }
      return true;
    } catch (e) { return false; }
  }

  // 이미 저장된 메시지 텍스트 추적 (한 세션 내)
  const [savedTexts, setSavedTexts] = React.useState(() => {
    try {
      const u = JSON.parse(localStorage.getItem("__OD_USER") || "null");
      const arr = (u?.savedNotes && u.savedNotes[String(scenario.day)]) || [];
      return new Set(arr.map(n => n.text));

  function addMemo() {
    const t = memoDraft.trim();
    if (!t) return;
    const ok = saveBuddyNote(t, "memo");
    if (ok !== false) {
      setSavedTexts(prev => new Set(prev).add(t));
      setMemoDraft("");
      setNotesVer(v => v + 1);
    }
  }

        u.savedNotes[dayKey] = u.savedNotes[dayKey].filter(n => n.text !== text);
        localStorage.setItem("__OD_USER", JSON.stringify(u));
      }
      setSavedTexts(prev => { const s = new Set(prev); s.delete(text); return s; });
      if (window.OD && window.OD.enabled && window.OD.deleteNoteRow && u.email) {
        window.OD.deleteNoteRow(u.email, Number(dayKey), text).catch(() => {});
      }
      setNotesVer(v => v + 1);
    } catch (e) {}
  }

// 인터랙티브 투어, 타겟 사각형 기준 툴팁 위치 계산
function _computeTooltipPos(rect, placement) {
  const vw = window.innerWidth, vh = window.innerHeight;
  const PAD = 16;
  const isNarrow = vw < 600;
  // 모바일에선 width를 viewport에 맞춰서 줄임 (좌우 16px 마진)
  const TT_W = isNarrow ? Math.min(360, vw - 32) : 360;
  const TT_H = isNarrow ? 240 : 200;

  // ── 모바일: spotlight와 학습 영역 안 가리게, 화면 상/하단 고정 ──
  // target이 화면 상반부면 툴팁은 하단, 하반부면 상단. 절대 spotlight 옆에 안 붙음.
  if (isNarrow) {
    const left = Math.max(PAD, (vw - TT_W) / 2);
    const targetMidY = rect.top + rect.height / 2;
    const halfVh = vh / 2;
    let top;
    if (targetMidY < halfVh) {
      // target이 상반부 → 툴팁 하단 fixed
      top = vh - TT_H - PAD - 12;
    } else {
      // target이 하반부 → 툴팁 상단 fixed (safe-area 고려)
      top = PAD + 56;
    }
    top = Math.max(PAD, Math.min(vh - TT_H - PAD, top));
    return { left, top, placement: 'mobile' };
  }

  // ── 데스크탑: placement 기준 + 부족하면 fallback ──
  let p = placement || "auto";
  if (p === "auto") {
    if (rect.right + TT_W + PAD < vw) p = "right";
    else if (rect.left - TT_W - PAD > 0) p = "left";
    else if (rect.bottom + TT_H + PAD < vh) p = "bottom";
    else p = "top";
  }
  // 지정된 placement에 공간 없으면 자동 fallback
  if (p === "right" && rect.right + TT_W + PAD > vw) p = (rect.left - TT_W - PAD > 0) ? "left" : "bottom";
  if (p === "left"  && rect.left  - TT_W - PAD < 0)  p = (rect.right + TT_W + PAD < vw) ? "right" : "bottom";

  let left, top;
  switch (p) {
    case "right":  left = rect.right + PAD;          top = rect.top + rect.height/2 - TT_H/2; break;
    case "left":   left = rect.left - TT_W - PAD;    top = rect.top + rect.height/2 - TT_H/2; break;
    case "top":    left = rect.left + rect.width/2 - TT_W/2; top = rect.top - TT_H - PAD;     break;
    case "bottom":
    default:       left = rect.left + rect.width/2 - TT_W/2; top = rect.bottom + PAD;
  }
  left = Math.max(PAD, Math.min(vw - TT_W - PAD, left));
  top  = Math.max(PAD, Math.min(vh - TT_H - PAD, top));
  return { left, top, placement: p };
}

// 음성, 남/여 번갈아 (할아버지 보이스 회피)
window.__OD_VOICE_TURN = window.__OD_VOICE_TURN || 0;
const _VOICE_FEMALE = ["Samantha", "Karen", "Tessa", "Kate", "Allison", "Victoria", "Susan", "Ava", "Moira", "Isha", "Joanna", "Salli"];
const _VOICE_MALE   = ["Alex", "Daniel", "Aaron", "Tom", "Lee", "Oliver", "Arthur", "Reed", "Rocko", "Joey", "Matthew"];
function _pickVoice() {
  if (!("speechSynthesis" in window)) return null;
  const voices = window.speechSynthesis.getVoices();
  if (!voices.length) return null;
  const turn = window.__OD_VOICE_TURN++;
  const wantFemale = turn % 2 === 0;
  const tryList = (names) => {
    for (const name of names) {
      const v = voices.find(v => v.name.toLowerCase().includes(name.toLowerCase()) && v.lang.toLowerCase().startsWith("en"));
      if (v) return v;
    }
    return null;
  };
  return tryList(wantFemale ? _VOICE_FEMALE : _VOICE_MALE)
    || tryList(wantFemale ? _VOICE_MALE : _VOICE_FEMALE)
    || voices.find(v => v.lang === "en-US")
    || voices.find(v => v.lang.toLowerCase().startsWith("en"))
    || voices[0];
}
function _speakWord(word) {
  if (!("speechSynthesis" in window) || !word) return;
  const fire = () => {
    try { window.speechSynthesis.cancel(); } catch (e) {}
    const u = new SpeechSynthesisUtterance(word);
    u.lang = "en-US"; u.rate = 0.92; u.pitch = 1.0;
    const v = _pickVoice();
    if (v) u.voice = v;
    window.speechSynthesis.speak(u);
  };
  // 첫 호출 시 voices 비어있을 수 있음 → 짧게 기다렸다 재시도
  if (!window.speechSynthesis.getVoices().length) setTimeout(fire, 250);
  else fire();
}
// 페이지 로드 시 voices 미리 로드 트리거
if ("speechSynthesis" in window) {
  try { window.speechSynthesis.getVoices(); } catch(e) {}
  window.speechSynthesis.onvoiceschanged = () => { /* warm */ };
}

function _pickField(currentWord, count, key) {
  const { SCENARIOS, USER } = window.__SIM;
  const pool = SCENARIOS
    .filter(s => s.word !== currentWord && s.day <= Math.max(USER.wordsCollected + 5, 12))
    .map(s => s[key])
    .filter(Boolean);
  return _shuf([...new Set(pool)]).slice(0, count);
}
function _pickWordObjects(excludeWord, count) {
  const { SCENARIOS, USER } = window.__SIM;
  const pool = SCENARIOS.filter(s => s.word !== excludeWord && s.day <= Math.max(USER.wordsCollected, 12));
  return _shuf(pool).slice(0, count);
}

                padding: "10px 22px", fontSize: 14, fontWeight: 700,

// 작은 정답/오답 피드백 박스

// 🇰🇷 한국어 번역 토글 (피드백 #14 황혜민, #20 최은정: 영문 예문에 한국어 버전)
// 기본은 접힘(영어 먼저 읽기), 누르면 번역 공개. 함수 선언이라 어디서든 사용 가능.
function KoPeek({ ko, align }) {
  const [show, setShow] = useState(false);
  if (!ko) return null;
  return (
    <div style={{ marginTop: 5, textAlign: align || "left" }}>
      <button
        onClick={(e) => { e.stopPropagation(); setShow(v => !v); }}
        style={{
          background: "transparent", border: "none", padding: 0,
          fontSize: 11, fontWeight: 700, color: "var(--ink-mute)",
          cursor: "pointer", fontFamily: "inherit", textDecoration: "underline dotted",
        }}>

      </button>
      {show && (
        <div style={{ marginTop: 5, fontSize: 12.5, color: "var(--ink-soft)", lineHeight: 1.6, background: "var(--paper-warm)", borderRadius: 6, padding: "7px 10px" }}>
          {ko}
        </div>
      )}
    </div>
  );
}

// 보기 유형 뱃지 (정답 공개 후, 왜 정답/오답인지 한눈에 구분)
function _mcKindBadge(kind) {
  const map = {
    correct:  { label: "✓ 자연스러운 답", color: "#2D7A3D" },
    formal:   { label: "🎩 너무 격식",     color: "#8C6510" },
    weak:     { label: "💤 힘 빠진 답",    color: "#993C1D" },
    konglish: { label: "🗯 콩글리시",      color: "#993C1D" },
    missing:  { label: "🚫 오늘 단어 없음", color: "#993C1D" },
  };
  const m = map[kind] || { label: kind, color: "var(--ink-mute)" };
  return (
    <b style={{ color: m.color, marginRight: 6, whiteSpace: "nowrap" }}>{m.label} ·</b>
  );
}
// 고르기 전 보여줄 공통 기준 (피드백 #16 후속: '왜 정답인지' 기준을 사전에 명시)
function _mcCriteriaLine() {
  return (
    <div style={{ marginTop: 8, fontSize: 11.5, color: "var(--ink-mute)", lineHeight: 1.6 }}>

    </div>
  );
}

      { text: noWord, kind: "missing", note: "톤은 OK인데 오늘 단어를 못 살렸어. 미션 실패." },
    ]);
  }, [today.word, today.sampleAnswer, today.mcOptions]);

  const picked = options.find(o => o.text === pick);

                <div>

                </div>

            <div className="slack-replies-prompt">

            return (

        {_mcCriteriaLine()}
      </div>
      <div style={{ marginTop: 10, display: "grid", gap: 8 }}>
        {options.map((o, i) => {
          const isPicked = pick === o.text;
          const showResult = pick !== null;
          const ok = o.kind === "correct";
          return (
            <button

        { w: "Sounds great", m: "좋아, 괜찮네 (가볍게 동의)" },

      kind: "shallow",

      ko: `"뭐, 아무거나 좋아." (별 관심 없다는 톤)`,

// === 4. RECAP, 10초 퀴즈 (3문제 빠른 4지선다) ===
function RecapActivity({ today, item, onClose, onComplete }) {
  const [qIdx, setQIdx] = useState(0);
  const [picks, setPicks] = useState([]);
  const [pick, setPick] = useState(null);

  // 누적 복습: 오늘 + 최근 2개 day 단어로 빈칸 문제 (정답이 매번 달라 패턴 안 통함)
  const questions = useMemo(() => {
    const SCN = (window.__SIM && window.__SIM.SCENARIOS) || [];
    const RD = (window.__SIM && window.__SIM.RECAP_DATA) || {};
    const qDays = [];
    for (let d = today.day; d >= 1 && qDays.length < 3; d--) {
      if (RD[d]) qDays.push(d);
    }
    qDays.reverse();
    const allWords = SCN.map(s => s.word).filter(Boolean);
    return qDays.map(d => {
      const sc = SCN.find(s => s.day === d);
      const word = sc ? sc.word : "";
      const distractors = _shuf(allWords.filter(w => w !== word)).slice(0, 3);
      return {
        prompt: `빈 칸에 들어갈 표현은?`,
        target: RD[d].blank,
        options: _shuf([word, ...distractors]),
        correct: word,
        hint: RD[d].explain,
      };
    });
  }, [today.day]);

  const q = questions[qIdx];
  const lastQ = qIdx >= questions.length - 1;
  const score = picks.filter(p => p.ok).length;

  const onPick = (opt) => {
    if (pick) return;
    setPick(opt);
    setPicks(prev => [...prev, { ok: opt === q.correct, q: q.target, opt }]);
  };
  const goNext = () => {
    setQIdx(qIdx + 1);
    setPick(null);
  };

  if (qIdx >= questions.length) {
    const finalScore = picks.filter(p => p.ok).length;
    return (
      <ActivityShell title="RECAP · 10초 퀴즈 결과" onClose={onClose}>
        <div style={{ textAlign: "center", padding: "20px 0" }}>
          <div style={{ fontSize: 56, fontWeight: 900, color: "var(--orange)", lineHeight: 1, letterSpacing: "-0.04em" }}>
            {finalScore}<span style={{ fontSize: 22, color: "var(--ink-mute)" }}> / {questions.length}</span>
          </div>
          <div style={{ marginTop: 14, fontSize: 14, color: "var(--ink-soft)" }}>
            {finalScore === questions.length ? "전부 맞췄어요. 머릿속에 박혔네 🌟" :
             finalScore >= 2 ? "괜찮아요. 한 번 더 만나면 완전히 외워져요." :
             "오늘 단어 한 번만 더 입으로 굴려봐요, 내일 또 만나요."}
          </div>
        </div>
        <div style={{ marginTop: 8, display: "flex", flexDirection: "column", gap: 6 }}>
          {picks.map((p, i) => (
            <div key={i} style={{ display: "flex", justifyContent: "space-between", padding: "8px 12px", background: p.ok ? "rgba(74,124,89,0.06)" : "rgba(178,58,44,0.06)", border: "1px solid var(--line)", borderRadius: 6, fontSize: 12 }}>
              <span>Q{i+1}</span>
              <span style={{ fontWeight: 800, color: p.ok ? "var(--green)" : "var(--stamp-red)" }}>{p.ok ? "✓ 정답" : "✗ 오답"}</span>
            </div>
          ))}
        </div>
        <div className="row" style={{ marginTop: 18, justifyContent: "flex-end" }}>
          <button className="btn btn-primary" onClick={onComplete}>Recap 완료 ✓</button>
        </div>
      </ActivityShell>
    );
  }

  return (
    <ActivityShell title={`RECAP · 10초 퀴즈 · ${qIdx + 1} / ${questions.length}`} onClose={onClose}>
      <span className="label-doc label-orange">▶ 15:30 · 빠른 복습</span>
      <div style={{ marginTop: 10, fontSize: 13, color: "var(--ink-soft)", lineHeight: 1.6 }}>
        오늘 단어 + 최근에 배운 단어를 섞어서 복습해요. 빈 칸에 들어갈 표현을 골라보세요.
      </div>
      <div style={{ marginTop: 12, fontSize: 13, color: "var(--ink-mute)", letterSpacing: "0.04em", fontWeight: 700 }}>{q.prompt}</div>
      <div style={{ marginTop: 8, padding: 18, background: "var(--cream)", border: "1px dashed var(--line)", borderRadius: 8, fontSize: 18, fontWeight: 800, color: "var(--ink)", lineHeight: 1.45, letterSpacing: "-0.01em" }}>
        {q.target}
      </div>
      <div style={{ marginTop: 14, display: "grid", gap: 8 }}>
        {q.options.map((o, i) => {
          const isPicked = pick === o;
          const showResult = pick !== null;
          const ok = o === q.correct;
          return (
            <button
              key={i}
              onClick={() => onPick(o)}
              style={{
                textAlign: "left", padding: "12px 16px", borderRadius: 8,
                border: "1.5px solid " + (showResult && ok ? "var(--green)" : isPicked ? "var(--stamp-red)" : "var(--line)"),
                background: showResult && ok ? "rgba(74,124,89,0.10)" : isPicked ? "rgba(178,58,44,0.06)" : "#fff",
                cursor: pick === null ? "pointer" : "default",
                fontSize: 14, lineHeight: 1.4, fontFamily: "inherit", color: "var(--ink)",
                fontWeight: showResult && ok ? 800 : 500,
              }}
            >
              {String.fromCharCode(65 + i)}. {o}
            </button>
          );
        })}
      </div>
      {pick && q.hint ? (
        <div style={{ marginTop: 12, fontSize: 12, color: "var(--ink-soft)", lineHeight: 1.55, padding: "10px 12px", background: "rgba(216,90,42,0.06)", borderRadius: 6 }}>
          💡 {q.hint}
        </div>
      ) : null}
      {pick ? (
        <div className="row" style={{ marginTop: 16, justifyContent: "flex-end" }}>
          <button className="btn btn-primary" onClick={goNext}>
            {lastQ ? "결과 보기 →" : "다음 문제 →"}
          </button>
        </div>
      ) : null}
    </ActivityShell>
  );
}

// 문장에서 단어(활용형 포함)를 빈칸으로 치환. ramp up -> ramping up, align -> aligned 등.
// ★ 빈칸 + 매칭된 표면형(활용형) 반환. 보기 어형을 문장과 맞추기 위해 surface가 필요.
// (피드백 #8, #13: 정답이 ramping up/aligned인데 보기엔 ramp up/align만 보여 혼란)
function _blankWordEx(sentence, word) {
  if (!sentence || !word) return { text: sentence, surface: word };
  const esc = (t) => t.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  // 1) 단어 경계 기준 정확 매칭 (aligned 안의 align 부분 매칭 방지)
  let re = new RegExp("\\b" + esc(word) + "\\b", "i");
  let m = sentence.match(re);
  if (m) return { text: sentence.replace(re, "_____"), surface: m[0] };
  // 2) 활용형 허용 매칭 (ing/ed/s/es/d + 자음 중복)
  const toks = word.split(/\s+/);
  const pat = toks.map((t, i) => {
    const e = esc(t);
    if (i === 0) {
      const last = e.slice(-1);
      return e + "(?:" + last + ")?(?:ing|ed|es|s|d)?";
    }
    return e;
  }).join("\\s+");
  re = new RegExp(pat, "i");
  m = sentence.match(re);
  if (m) return { text: sentence.replace(re, "_____"), surface: m[0] };
  return { text: sentence, surface: word };
}
// 표면형의 어미 종류 판별 (원형 첫 토큰과 비교)
function _suffixKindOf(word, surface) {
  const b = word.split(/\s+/)[0].toLowerCase();
  const s = surface.split(/\s+/)[0].toLowerCase();
  if (s === b) return null;
  if (/ing$/.test(s)) return "ing";
  if (/(ed|d)$/.test(s)) return "ed";
  if (/(es|s)$/.test(s)) return "s";
  return null;
}
// 다른 단어(보기용)도 같은 어미로 활용해 보기 균형 맞추기
function _inflectFirstToken(word, kind) {
  if (!kind) return word;
  const toks = word.split(/\s+/);
  let t = toks[0];
  if (kind === "ing") {
    if (/e$/i.test(t) && !/(ee|ye|oe)$/i.test(t)) t = t.slice(0, -1) + "ing";
    else if (/[^aeiou][aeiou][bdgklmnprtv]$/i.test(t)) t = t + t.slice(-1) + "ing";
    else t = t + "ing";
  } else if (kind === "ed") {
    if (/e$/i.test(t)) t = t + "d";
    else if (/[^aeiou]y$/i.test(t)) t = t.slice(0, -1) + "ied";
    else if (/[^aeiou][aeiou][bdgklmnprtv]$/i.test(t)) t = t + t.slice(-1) + "ed";
    else t = t + "ed";
  } else if (kind === "s") {
    if (/(s|sh|ch|x|z)$/i.test(t)) t = t + "es";
    else if (/[^aeiou]y$/i.test(t)) t = t.slice(0, -1) + "ies";
    else t = t + "s";
  }
  return [t, ...toks.slice(1)].join(" ");
}

// === 5. OFFICE_TASK, 오후 업무 (메일 빈칸 채우기) ===
function OfficeTaskActivity({ today, item, onClose, onComplete }) {
  const { CHARACTERS } = window.__SIM;
  const npc = CHARACTERS[today.npc] || CHARACTERS.manager;
  const [pick, setPick] = useState(null);

  // 메일 초안, 오늘 단어(활용형 포함) 빈칸
  // ★ 정답 보기는 문장 속 표면형(ramping up, aligned 등) 그대로 사용 (피드백 #8, #13)
  const blanked = useMemo(() => {
    const s = today.sampleAnswer || `Let's ${today.word} on this and circle back.`;
    return _blankWordEx(s, today.word);
  }, [today.word, today.sampleAnswer]);
  const draft = blanked.text;
  const correctOpt = blanked.surface.toLowerCase();
  const suffixKind = _suffixKindOf(today.word, blanked.surface);

  const otherWords = useMemo(() => {
    const pool = _pickWordObjects(today.word, 8);
    // 활용형 빈칸이면 동사·구동사 위주로 골라 같은 어형으로 변형 (보기 균형)
    const usable = suffixKind
      ? pool.filter(o => /v\.|phr\./.test(o.pos || "")).map(o => _inflectFirstToken(o.word, suffixKind))
      : pool.map(o => o.word);
    const fallback = pool.map(o => suffixKind ? _inflectFirstToken(o.word, suffixKind) : o.word);
    const merged = [...new Set([...usable, ...fallback])].filter(w => w !== correctOpt);
    return merged.slice(0, 3);
  }, [today.word, suffixKind, correctOpt]);
  const opts = useMemo(() => _shuf([correctOpt, ...otherWords]), [correctOpt, otherWords]);

  return (
    <ActivityShell title="AFTERNOON TASK · 회신 초안" onClose={onClose}>
      <span className="label-doc label-orange">▶ 14:00 · 오후 업무</span>
      <div style={{ marginTop: 10, fontSize: 13, color: "var(--ink-soft)", lineHeight: 1.6 }}>
        방금 받은 메시지에 회신 초안을 쓰는 중이에요. <b>빈 칸(_____)</b> 자리에 오늘 단어가 들어갑니다. 가장 자연스러운 표현을 고르세요.
      </div>

      {today.quote ? (
        <div style={{ display: "flex", gap: 10, marginTop: 14, alignItems: "flex-start" }}>
          <div style={{ width: 30, height: 30, borderRadius: "50%", flexShrink: 0, display: "flex", alignItems: "center", justifyContent: "center", background: npc.color, fontSize: 14 }}>{npc.avatar}</div>
          <div style={{ flex: 1 }}>
            <div style={{ fontSize: 12, fontWeight: 800, color: "var(--ink)", marginBottom: 3 }}>{npc.name}</div>
            <div style={{ fontSize: 13.5, color: "var(--ink)", lineHeight: 1.5, background: "var(--paper)", border: "1px solid var(--line)", borderRadius: "2px 12px 12px 12px", padding: "8px 12px" }}>{today.quote}</div>
            <KoPeek ko={today.quoteKo} />
          </div>
        </div>
      ) : null}

      <div style={{ marginTop: 16, padding: 18, background: "#fff", border: "1px solid var(--line)", borderRadius: 8, boxShadow: "2px 2px 0 var(--line)" }}>
        <div style={{ fontSize: 11, fontWeight: 800, color: "var(--ink-mute)", letterSpacing: "0.12em", marginBottom: 10 }}>📝 내 회신 초안</div>
        <div style={{ fontSize: 13.5, color: "var(--ink)", lineHeight: 1.7 }}>
          Hi,<br/><br/>
          <span style={{ background: "var(--highlight)", padding: "1px 4px", fontWeight: 800 }}>{draft}</span><br/><br/>
          Best,<br/>
          {window.__SIM.USER.name}
        </div>
      </div>

      <div style={{ marginTop: 16, fontSize: 13, fontWeight: 700, color: "var(--ink)" }}>
        빈 칸에 들어갈 가장 자연스러운 단어는?
      </div>
      <div style={{ marginTop: 10, display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8 }}>
        {opts.map((o, i) => {
          const isPicked = pick === o;
          const showResult = pick !== null;
          const ok = o === correctOpt;
          return (
            <button
              key={i}
              onClick={() => pick === null && setPick(o)}
              style={{
                padding: "12px 14px", borderRadius: 8,
                border: "1.5px solid " + (showResult && ok ? "var(--green)" : isPicked ? "var(--stamp-red)" : "var(--line)"),
                background: showResult && ok ? "rgba(74,124,89,0.10)" : isPicked ? "rgba(178,58,44,0.06)" : "var(--cream)",
                cursor: pick === null ? "pointer" : "default",
                fontSize: 13.5, fontFamily: "inherit", color: "var(--ink)", textAlign: "center",
                fontWeight: 700,
              }}
            >
              {o}
            </button>
          );
        })}
      </div>
      {pick !== null && (
        <>
          <FeedbackBox ok={pick === correctOpt} correct={correctOpt} hint={`사수: "이 자리엔 ${correctOpt} 가 톤 잡기 딱 좋아." · ${today.mentorTip || ""}`} />
          <div className="row" style={{ marginTop: 14, justifyContent: "flex-end" }}>

    </ActivityShell>
  );
}

// === 6. JOURNAL, 업무일지 + 퇴근 (한 줄 회고 + 버디 응원) ===
function JournalActivity({ today, item, onClose, onComplete }) {
  const { CHARACTERS } = window.__SIM;
  const buddy = CHARACTERS.buddy;

  // ★ 이전에 저장한 일지가 있으면 로드 (재진입 시 사라지지 않게)
  const _existing = _loadDailyJournal(today.day);
  const [text, setText] = useState(_existing?.text || "");
  const [submitted, setSubmitted] = useState(!!_existing);
  const [savedToast, setSavedToast] = useState(false);

  const buddyReply = useMemo(() => {
    const pool = [
      `좋아, ${today.word} 한 번 자기 입으로 써본 거, 진짜 외운 거야. 내일 또 만나자.`,
      `오늘 ${today.word} 한 번도 입으로 안 굴렸으면 휘발돼. 자기 전에 한 번만 더, 그러면 진짜 머리에 박혀.`,
      `30일 중 ${window.__SIM.USER.currentDay}일째. ${today.word} 같은 표현 30개 모이면 회의 분위기 자체가 달라져.`,
    ];
    return pool[(today.day - 1) % pool.length];
  }, [today.word, today.day]);

  // 제출 = 저장 + submitted 표시
  const handleSubmit = () => {
    if (!text.trim()) return;
    const ok = _saveDailyJournal(today.day, text);
    setSubmitted(true);
    if (ok) {
      setSavedToast(true);
      setTimeout(() => setSavedToast(false), 2500);
    }
  };

  return (
    <ActivityShell title="WORK JOURNAL · 업무일지 + 퇴근" onClose={onClose}>
      <span className="label-doc label-orange">▶ 17:00 · 오늘의 한 줄</span>
      <div style={{ marginTop: 10, fontSize: 13, color: "var(--ink-soft)", lineHeight: 1.6 }}>
        오늘 단어 <b style={{ background: "var(--highlight)", padding: "1px 6px" }}>{today.word}</b>, 진짜 어디서 쓸 수 있을 것 같아요? 한 줄만.
        <span style={{ display: "block", marginTop: 6, fontSize: 11.5, color: "var(--ink-mute)" }}>
          📒 작성한 일지는 <b>업무노트 → 해당 날짜 카드</b>에서 다시 볼 수 있어요.
        </span>
      </div>
      <textarea
        className="scene-input"
        placeholder={`예: 다음 회의에서 ${today.word} 한 번 써봐야지. 박 대리한테 ${today.word} 들으면 이제 안 헷갈려.`}
        value={text}
        onChange={e => setText(e.target.value)}
        disabled={submitted}
        style={{ marginTop: 12 }}
      />
      {!submitted ? (
        <div className="row" style={{ marginTop: 12, justifyContent: "space-between" }}>
          <button className="btn btn-ghost" onClick={() => setText(`다음 ${item?.context?.ctx || "회의"}에서 ${today.word} 한 번 써먹어보기.`)}>예시로 채우기</button>
          <button className="btn btn-primary" onClick={handleSubmit} disabled={!text.trim()}>일지 제출 →</button>
        </div>
      ) : (
        <>
          {savedToast && (
            <div style={{ marginTop: 10, padding: "8px 12px", background: "rgba(46,125,50,0.08)", border: "1px solid rgba(46,125,50,0.25)", borderRadius: 6, fontSize: 12, color: "var(--green, #2e7d32)", textAlign: "center", fontWeight: 700 }}>
              ✓ 일지 저장됨 · 업무노트에서 다시 볼 수 있어요
            </div>
          )}
          <div style={{ marginTop: 16, padding: 16, background: "rgba(216,90,42,0.06)", border: "1px solid rgba(216,90,42,0.25)", borderRadius: 8 }}>
            <div style={{ display: "flex", gap: 10, alignItems: "center", marginBottom: 8 }}>
              <div className="buddy-avatar small" style={{ width: 32, height: 32, fontSize: 13 }}>{buddy.avatar}</div>
              <div>
                <div className="buddy-name" style={{ fontSize: 13 }}>{buddy.name}</div>
                <div className="buddy-role" style={{ fontSize: 11 }}>오늘의 응원 한 마디</div>
              </div>
            </div>
            <div style={{ fontSize: 13.5, color: "var(--ink)", lineHeight: 1.6 }}>{buddyReply}</div>
          </div>
          <div style={{ marginTop: 16, textAlign: "center", padding: "20px 0", position: "relative" }}>
            <div style={{
              display: "inline-block",
              padding: "16px 28px",
              border: "3px solid var(--stamp-red)",
              color: "var(--stamp-red)",
              fontSize: 18, fontWeight: 900, letterSpacing: "0.18em",
              transform: "rotate(-6deg)",
              fontFamily: "'Noto Sans KR', sans-serif",
            }}>
              퇴근 · DAY {today.day} 완주
            </div>
          </div>
          <div className="row" style={{ marginTop: 14, justifyContent: "space-between" }}>
            <button className="btn btn-ghost" onClick={() => setSubmitted(false)}>✏️ 일지 수정하기</button>
            <button className="btn btn-primary" onClick={onComplete}>퇴근하기 ✓</button>

// === 8. WEEKEND_RECAP, 일요일 이번 주 표현 미니 회고 (3문제) ===
function WeekendRecapActivity({ item, onClose, onComplete }) {
  const { SCENARIOS, USER } = window.__SIM;
  const recent = useMemo(() => {
    return SCENARIOS.filter(s => s.day <= USER.wordsCollected && s.day >= Math.max(1, USER.wordsCollected - 5));
  }, []);

  const questions = useMemo(() => {
    if (recent.length === 0) return [];
    const picks = _shuf(recent).slice(0, Math.min(3, recent.length));
    return picks.map(s => {
      // KO 뜻 → EN 단어 4지선다
      const others = SCENARIOS.filter(o => o.word !== s.word).map(o => o.word);
      const distractors = _shuf(others).slice(0, 3);
      return {
        target: s.meaning,
        prompt: "이번 주 본 단어, 한국어 뜻으로 영어 단어 맞추기",
        options: _shuf([s.word, ...distractors]),
        correct: s.word,
        hint: s.mentorTip || s.tags?.map(t => "#"+t).join(" ") || "",
      };
    });
  }, [recent]);

  const [qIdx, setQIdx] = useState(0);
  const [pick, setPick] = useState(null);
  const [results, setResults] = useState([]);

  if (recent.length === 0) {
    return (
      <ActivityShell title="WEEKEND · 미니 회고" onClose={onClose}>
        <div style={{ textAlign: "center", padding: "30px 0" }}>
          <div style={{ fontSize: 36, marginBottom: 14 }}>☕️</div>
          <div style={{ fontSize: 15, color: "var(--ink)", fontWeight: 700, marginBottom: 8 }}>이번 주는 아직 단어 모은 게 없네요</div>
          <div style={{ fontSize: 13, color: "var(--ink-soft)", lineHeight: 1.7 }}>월요일에 첫 단어부터 차근차근, 다음 일요일에 만나요.</div>
        </div>
        <div className="row" style={{ marginTop: 14, justifyContent: "flex-end" }}>
          <button className="btn btn-primary" onClick={onComplete}>알겠어요 ✓</button>
        </div>
      </ActivityShell>
    );
  }

  const q = questions[qIdx];
  if (qIdx >= questions.length) {
    const correct = results.filter(r => r.ok).length;
    return (
      <ActivityShell title="WEEKEND · 회고 결과" onClose={onClose}>
        <div style={{ textAlign: "center", padding: "20px 0" }}>
          <div style={{ fontSize: 56, fontWeight: 900, color: "var(--orange)", lineHeight: 1, letterSpacing: "-0.04em" }}>
            {correct}<span style={{ fontSize: 22, color: "var(--ink-mute)" }}> / {questions.length}</span>
          </div>
          <div style={{ marginTop: 14, fontSize: 14, color: "var(--ink-soft)" }}>
            {correct === questions.length ? "이번 주 단어 다 잡았어요 🌟" :
             correct >= Math.ceil(questions.length / 2) ? "이번 주 단어 머릿속에 살아있어요." :
             "월요일에 다시 한 번 굴려봐요."}
          </div>
          <div style={{ marginTop: 10, fontSize: 12.5, color: "var(--ink-mute)" }}>
            ☕️ 주말도 챙겼으니 보너스 도장 +1
          </div>
        </div>
        <div className="row" style={{ marginTop: 14, justifyContent: "flex-end" }}>
          <button className="btn btn-primary" onClick={onComplete}>월요일에 봐요 ✓</button>
        </div>
      </ActivityShell>
    );
  }

  const onPick = (opt) => {
    if (pick) return;
    setPick(opt);
    const ok = opt === q.correct;
    setTimeout(() => {
      setResults(r => [...r, { ok, opt }]);
      setQIdx(qIdx + 1);
      setPick(null);
    }, 900);
  };

  return (
    <ActivityShell title={`WEEKEND · 회고 ${qIdx + 1} / ${questions.length}`} onClose={onClose}>
      <span className="label-doc label-orange">▶ 일요일 · 이번 주 표현</span>
      <div style={{ marginTop: 12, fontSize: 12, color: "var(--ink-mute)", letterSpacing: "0.04em", fontWeight: 700 }}>{q.prompt}</div>
      <div style={{ marginTop: 8, padding: 18, background: "var(--cream)", border: "1px dashed var(--line)", borderRadius: 8, fontSize: 18, fontWeight: 800, color: "var(--ink)", lineHeight: 1.45 }}>
        {q.target}
      </div>
      <div style={{ marginTop: 14, display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8 }}>
        {q.options.map((o, i) => {
          const isPicked = pick === o;
          const showResult = pick !== null;
          const ok = o === q.correct;
          return (
            <button
              key={i}
              onClick={() => onPick(o)}
              style={{
                padding: "12px 14px", borderRadius: 8,
                border: "1.5px solid " + (showResult && ok ? "var(--green)" : isPicked ? "var(--stamp-red)" : "var(--line)"),
                background: showResult && ok ? "rgba(74,124,89,0.10)" : isPicked ? "rgba(178,58,44,0.06)" : "#fff",
                cursor: pick === null ? "pointer" : "default",
                fontSize: 13.5, fontFamily: "inherit", color: "var(--ink)",
                fontWeight: showResult && ok ? 800 : 600, textAlign: "center",
              }}
            >
              {o}
            </button>
          );
        })}
      </div>
      {pick && q.hint ? (
        <div style={{ marginTop: 12, fontSize: 12, color: "var(--ink-soft)", padding: "10px 12px", background: "rgba(216,90,42,0.06)", borderRadius: 6 }}>
          💡 {q.hint}
        </div>
      ) : null}
    </ActivityShell>
  );
}

// 디스패처, type별 활동 라우팅
function ActivityModal({ item, today, onClose, onComplete }) {
  if (!item) return null;
  const props = { item, today, onClose, onComplete };
  // 주말 활동, today 없어도 동작
  if (item.type === "weekend_chat") return <WeekendChatActivity {...props} />;
  if (item.type === "weekend_recap") return <WeekendRecapActivity {...props} />;
  // 평일 활동, today 필요
  if (!today) return null;
  switch (item.type) {
    case "checkin": return <CheckinActivity {...props} />;
    case "mini_mission": return <MissionActivity {...props} />;
    case "english_lunch": return <LunchActivity {...props} />;
    case "recap": return <RecapActivity {...props} />;
    case "office_task": return <OfficeTaskActivity {...props} />;
    case "journal": return <JournalActivity {...props} />;
    default: return null;
  }
}

function FeedbackModal({ onClose }) {
  const { USER } = window.__SIM;

  const [message, setMessage] = useState("");
  const [sending, setSending] = useState(false);
  const [sentOk, setSentOk] = useState(false);

    setSending(true);

          email: USER.email || null,

          day: USER.currentDay || null,
          category,
          message: text,

// ── 통계 계산 헬퍼 (Day 60 면담에서도 재활용) ──
function _statMasteredWords(u) {
  return new Set((u.scenariosCompleted || []).map(s => s && s.word).filter(Boolean)).size;
}
function _statNotes(u) {
  return Object.values(u.savedNotes || {}).reduce((a, arr) => a + (Array.isArray(arr) ? arr.length : 0), 0);
}
function _statJournals(u) {
  return Object.keys(u.dailyJournals || {}).length;
}
function _statBestStreak(u) {
  const days = new Set();
  (u.scenariosCompleted || []).forEach(s => { if (s && s.day) days.add(Number(s.day)); });
  Object.keys(u.dailyJournals || {}).forEach(k => { const n = Number(k); if (n) days.add(n); });
  try {
    Object.keys(localStorage).filter(k => k.startsWith("__OD_TASKS_DAY_")).forEach(k => {
      const t = JSON.parse(localStorage.getItem(k) || "{}");
      if (Object.values(t).filter(Boolean).length >= 3) {
        const n = Number(k.replace("__OD_TASKS_DAY_", ""));
        if (n) days.add(n);
      }
    });
  } catch (e) {}
  const arr = [...days].filter(d => d >= 1).sort((a, b) => a - b);
  let best = 0, cur = 0, prev = null;
  arr.forEach(d => {
    cur = (prev !== null && d === prev + 1) ? cur + 1 : 1;
    if (cur > best) best = cur;
    prev = d;
  });
  return best;
}

// ── 실제 완주한 날 수 (달력 day가 아니라 진짜 출석한 일수). 마일스톤 트리거용. ──
function _completedDayCount(u) {
  const days = new Set();
  (u.scenariosCompleted || []).forEach(s => { if (s && s.day) days.add(Number(s.day)); });
  Object.keys(u.dailyJournals || {}).forEach(k => { const n = Number(k); if (n) days.add(n); });
  try {
    Object.keys(localStorage).filter(k => k.startsWith("__OD_TASKS_DAY_") && !k.endsWith("_ts")).forEach(k => {
      const t = JSON.parse(localStorage.getItem(k) || "{}");
      if (Object.values(t).filter(Boolean).length >= 3) {
        const n = Number(k.replace("__OD_TASKS_DAY_", ""));
        if (n) days.add(n);
      }
    });
  } catch (e) {}
  return [...days].filter(d => d >= 1).length;
}

// ── 승급 영어 테스트 문제 생성 (Day 1-30 단어 풀, RECAP_DATA 재활용) ──
function _buildLevelupQuestions(maxDay, count) {
  const SCN = ((window.__SIM && window.__SIM.SCENARIOS) || []).filter(s => s.day <= maxDay);
  const RD = (window.__SIM && window.__SIM.RECAP_DATA) || {};
  const pool = Object.keys(RD).map(Number).filter(d => d <= maxDay && SCN.find(s => s.day === d));
  const qDays = _shuf(pool).slice(0, count);
  const allWords = SCN.map(s => s.word).filter(Boolean);
  return qDays.map(d => {
    const sc = SCN.find(s => s.day === d);
    const word = sc ? sc.word : "";
    const distractors = _shuf(allWords.filter(w => w !== word)).slice(0, 3);
    return {
      target: RD[d].blank,
      options: _shuf([word, ...distractors]),
      correct: word,
      hint: RD[d].explain,
      meaning: sc ? sc.meaning : "",
    };
  });
}

// ── 레벨업 영속화: localStorage 먼저 (데이터 안전) → DB. DB 실패 시 pending 큐. ──
async function _persistLevelUp(score) {
  const now = new Date().toISOString();
  let local = null;
  try { local = JSON.parse(localStorage.getItem("__OD_USER") || "null"); } catch (e) {}
  if (local) {
    local.level = window.__OD_LEVEL_FULLTIME;
    local.levelupCompletedAt = now;
    local.levelup_completed_at = now;
    local.levelupTestScore = score;
    local.levelup_test_score = score;
    try { localStorage.setItem("__OD_USER", JSON.stringify(local)); } catch (e) {}
  }
  const email = local && local.email;
  if (!email) return { ok: true, localOnly: true };
  const patch = { level: window.__OD_LEVEL_FULLTIME, levelup_completed_at: now, levelup_test_score: score };
  try {
    if (window.OD && window.OD.enabled && window.OD.updateProgress) {
      const r = await window.OD.updateProgress(email, patch);
      if (r && r.ok) {
        try { localStorage.removeItem("__OD_PENDING_LEVELUP"); } catch (e) {}
        return { ok: true };
      }
    }
  } catch (e) {}
  // DB 실패: 다음 부팅 때 재시도하도록 큐잉 (mountAfterHydrate에서 flush)
  try { localStorage.setItem("__OD_PENDING_LEVELUP", JSON.stringify({ email, patch })); } catch (e) {}
  return { ok: false, queued: true };
}

// ── Day 30: 인사팀 상담 (회고 → 통계 → 영어 테스트 → 승급) ──
function PromotionCeremony({ realDay }) {
  const [step, setStep] = useState(0);           // 0 인트로 / 1 회고·통계 / 2 테스트 / 3 소감 / 4 결과
  const [qIdx, setQIdx] = useState(0);
  const [picks, setPicks] = useState([]);
  const [pick, setPick] = useState(null);
  const [saved, setSaved] = useState(false);
  // 회고 소감 (인사팀에 전달, 운영자 피드백함으로 수집)
  const [reflectRating, setReflectRating] = useState(0);   // 1-5 만족도
  const [reflectText, setReflectText] = useState("");
  const [reflectSent, setReflectSent] = useState(false);

  const local = (() => { try { return JSON.parse(localStorage.getItem("__OD_USER") || "null") || {}; } catch (e) { return {}; } })();
  const name = local.name || (window.__SIM && window.__SIM.USER && window.__SIM.USER.name) || "사원";
  const isLate = realDay > 30;  // Day 31+에 뒤늦게 의례 진행하는 케이스

  const stats = useMemo(() => ({
    streak: _statBestStreak(local),
    words: _statMasteredWords(local),
    notes: _statNotes(local),
    journals: _statJournals(local),
  }), []);

  const questions = useMemo(() => _buildLevelupQuestions(30, 10), []);
  const q = questions[qIdx];
  const score = questions.length ? Math.round(picks.filter(p => p.ok).length / questions.length * 100) : 100;

  // 결과 화면(step 4) 진입 즉시 승급 저장 (사용자가 창 닫아도 승급은 유지)
  React.useEffect(() => {
    if (step === 4 && !saved) {
      setSaved(true);
      _persistLevelUp(score);
    }
  }, [step]);

  const onPick = (opt) => {
    if (pick) return;
    setPick(opt);
    setPicks(prev => [...prev, { ok: opt === q.correct, correct: q.correct, opt, hint: q.hint }]);
  };
  const goNext = () => {
    if (qIdx >= questions.length - 1) { setStep(3); return; }  // 테스트 끝 → 소감
    setQIdx(qIdx + 1);
    setPick(null);
  };

  // 회고 소감 제출 → 운영자 피드백함으로 전송 후 결과 화면
  const submitReflection = () => {
    if (reflectSent) { setStep(4); return; }
    setReflectSent(true);
    const email = local.email;
    if (email && (reflectText.trim() || reflectRating) && window.OD?.submitFeedback) {
      const stars = reflectRating ? "★".repeat(reflectRating) + "☆".repeat(5 - reflectRating) : "(미선택)";
      window.OD.submitFeedback({
        email,
        name,
        day: realDay,
        category: "graduation",
        message: `[수습 30일 회고] 만족도 ${stars} (${reflectRating}/5)\n테스트 ${score}점\n\n${reflectText.trim() || "(소감 없음)"}`,
        context: { type: "graduation_reflection", rating: reflectRating, score, streak: stats.streak, words: stats.words },
      }).catch(() => {});
    }
    setStep(4);
  };

  const scoreMent = score >= 90 ? "탁월하게 통과!"
    : score >= 70 ? "여유롭게 통과!"
    : score >= 50 ? "통과! 다시 한번 챙겨보면 좋은 단어들이 보이네요."
    : "통과! 가끔 사원증 페이지의 단어 사전으로 복습해주세요.";
  const wrongs = picks.filter(p => !p.ok);

  const statCards = [
    { icon: "🔥", label: "최장 연속 출근", value: stats.streak + "일" },

function App() {
  const [active, setActive] = useState("home");

  const [viewingDay, setViewingDay] = useState(null);

  const { USER, SCENARIOS } = window.__SIM;

  const _realDay = USER.realCurrentDay || USER.currentDay;
  const _effectiveDay = (viewingDay && viewingDay < _realDay) ? viewingDay : _realDay;

  // 매 렌더마다 window.__SIM 동기 갱신. 자식 컴포넌트가 다음 render 에서 새 값 읽음.
  USER.currentDay = _effectiveDay;
  USER.realCurrentDay = _realDay;
  USER.isViewingPast = _effectiveDay !== _realDay;
  USER.workingDay = window._workingDayIndex ? window._workingDayIndex(_effectiveDay) : _effectiveDay;
  USER.wordsCollected = window._wordsCollected ? window._wordsCollected(_effectiveDay) : _effectiveDay;

  // SCENARIOS statuses 재계산 (위/안 본 단어 표시 + 출근부 셀 일관성)
  SCENARIOS.forEach(s => {
    if (s.day === USER.workingDay) s.status = "today";
    else if (s.day < USER.wordsCollected) s.status = "studied";
    else if (USER.workingDay === null && s.day === USER.wordsCollected) s.status = "studied";
    else s.status = "locked";
  });
  USER.studiedDays = SCENARIOS.filter(s => s.status === "studied").length;

  // TODAY_SCHEDULE 도 effective day 기준 재계산
  if (window.__SIM.getScheduleForDay && USER.workingDay !== null) {
    window.__SIM.TODAY_SCHEDULE = window.__SIM.getScheduleForDay(USER.workingDay);
  }


  // 사내 메모 읽음 상태, localStorage에 사용자 단위로 저장
  const READ_KEY = "__OD_NOTICE_READS_" + (USER.email || "guest");
  const HARDCODED_NOTICES = React.useMemo(() => window.__SIM.NOTICES, []);
  const [dbNotices, setDbNotices] = useState([]);
  const [readIds, setReadIds] = useState(() => {
    try {
      const saved = localStorage.getItem(READ_KEY);
      return new Set(saved ? JSON.parse(saved) : []);
    } catch { return new Set(); }
  });

  // Supabase notices 테이블에서 운영자 발송 공지 가져오기
  // ★ window.OD 로딩 타이밍 문제 회피, 준비될 때까지 폴링
  React.useEffect(() => {
    let cancelled = false;
    let tries = 0;
    const tick = () => {
      if (cancelled) return;
      if (!window.OD || !window.OD.enabled || !window.OD.fetchNotices) {
        if (tries++ < 40) { setTimeout(tick, 200); }
        else { console.warn("[notices] window.OD 준비 안 됨, 공지 fetch 포기"); }
        return;
      }
      window.OD.fetchNotices(50, USER.email || null).then(r => {
        if (cancelled) return;
        if (!r.ok || !r.notices) {
          console.warn("[notices] fetch 실패:", r.error || "결과 없음");
          return;
        }
        console.log("[notices] DB 공지", r.notices.length, "건 로드");
        const fromMap = {
          "유버디 (Buddy)": "buddy", "유버디": "buddy", "Buddy": "buddy",
          "인사팀": "hr", "HR": "hr",
          "사수": "mentor", "차윤아": "mentor",
          "팀장": "manager", "김 팀장": "manager",
        };
        const tagMap = {
          "announcement": "공지", "event": "이벤트", "broadcast": "전사",
          "ceo": "회장", "hr": "인사", "notice": "공지",
        };
        const converted = r.notices.filter(n => {
          // ★ 방어: 1:1 공지는 수신자 본인에게만 노출.
          // (이메일 없는 세션이면 fetchNotices가 필터 없이 전체를 반환하는 구멍 차단)
          if (Array.isArray(n.target_emails) && n.target_emails.length > 0) {
            const me = (USER.email || "").toLowerCase().trim();
            return !!me && n.target_emails.map(e => String(e).toLowerCase().trim()).includes(me);
          }
          // ★ 전체 공지는 가입일 이후 발송분만 (신규 가입자에게 과거 공지 노이즈 차단)
          // signupDate 없으면 안전하게 전부 표시.
          try {
            const lu = JSON.parse(localStorage.getItem("__OD_USER") || "null");
            const su = lu && lu.signupDate ? Date.parse(lu.signupDate) : null;
            if (su && n.sent_at && Date.parse(n.sent_at) < su) return false;
          } catch (e) {}
          return true;
        }).map(n => {
          const fromId = fromMap[n.from_name] || "buddy";
          const dateStr = n.sent_at
            ? new Date(n.sent_at).toLocaleDateString("ko-KR", { month: "long", day: "numeric" })

          const body = n.body || "";
          // target_emails 있으면 1:1 답장. 받는 사람을 본인 이름으로 표시.
          const isTargeted = Array.isArray(n.target_emails) && n.target_emails.length > 0;
          const recipient = isTargeted
            ? `${USER.name || "본인"}님 (1:1)`
            : "전 직원";
          return {
            id: "db-" + n.id,
            from: fromId,
            fromName: n.from_name || "유버디",
            to: recipient,
            date: dateStr,
            subject: n.title || "(제목 없음)",
            preview: body.slice(0, 80),
            body: body,
            unread: true,
            tag: isTargeted ? "1:1 답장" : (tagMap[n.type] || "공지"),
            showFromDay: 0,
            isDb: true,
            popup: !!n.popup,
            isDirect: isTargeted,
          };
        });
        setDbNotices(converted);
      }).catch(e => {
        console.warn("[notices] fetch 에러:", e.message);
      });
    };
    tick();
    return () => { cancelled = true; };
  }, []);

  // DB 공지 + 하드코딩된 공지 병합 (DB 공지가 위로)
  const ALL_NOTICES = React.useMemo(
    () => [...dbNotices, ...HARDCODED_NOTICES],
    [dbNotices, HARDCODED_NOTICES]
  );

  // 원본 unread 플래그에 readIds 적용
  const NOTICES = ALL_NOTICES.map(n => ({ ...n, unread: n.unread && !readIds.has(n.id) }));
  window.__SIM.NOTICES = NOTICES; // 자식 페이지가 window.__SIM에서 읽으므로 갱신
  const unread = NOTICES.filter(n => n.unread).length;

  const handleOpenMemo = (n) => {
    setMemo(n);
    if (!readIds.has(n.id)) {
      setReadIds(prev => {
        const next = new Set(prev); next.add(n.id);
        try { localStorage.setItem(READ_KEY, JSON.stringify([...next])); } catch {}
        return next;
      });
      // ★ DB 영속화 (notice_reads_v2). 실패 시 outbox 큐잉.
      if (window.OD && window.OD.enabled && window.OD.markNoticeRead && USER.email) {
        window.OD.markNoticeRead(USER.email, n.id).then(r => {
          if (!r || !r.ok) {
            window.OD.pushOutbox && window.OD.pushOutbox({ type: 'notice', email: USER.email, noticeKey: n.id });
          }
        }).catch(() => {
          window.OD.pushOutbox && window.OD.pushOutbox({ type: 'notice', email: USER.email, noticeKey: n.id });
        });
      }
    }
  };

  // ★ 입장 시 자동 팝업: popup=true 인 미확인 공지 중 가장 최근 1건을 모달로 띄움.
  // 기기당 1회만 (localStorage __OD_AUTOPOP). 운영자가 공지 작성 시 팝업 옵션 켰을 때만.
  const _autoPoppedRef = React.useRef(false);
  React.useEffect(() => {
    if (_autoPoppedRef.current) return;
    if (!dbNotices || dbNotices.length === 0) return;
    const target = dbNotices.find(n => n.popup && !readIds.has(n.id));
    if (!target) return;
    let shown = [];

    if (shown.includes(target.id)) return;
    _autoPoppedRef.current = true;
    try { shown.push(target.id); localStorage.setItem("__OD_AUTOPOP", JSON.stringify(shown)); } catch (e) {}
    handleOpenMemo(target);
  }, [dbNotices, readIds]);

  // 주말 분기는 여기서 결정 (HomePage 안에서 early-return 하면 hooks 순서 깨짐)
  const weekend = _weekendKind();
