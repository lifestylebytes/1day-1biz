// 인터랙티브 투어, 타겟 사각형 기준 툴팁 위치 계산
function _computeTooltipPos(rect, placement) {
  const vw = window.innerWidth, vh = window.innerHeight;
  const PAD = 16;
  const isNarrow = vw < 600;
  // 모바일에선 width를 viewport에 맞춰서 줄임 (좌우 16px 마진)
  const TT_W = isNarrow ? Math.min(360, vw - 32) : 360;
  const TT_H = isNarrow ? 240 : 200;

  // ── 모바일: placement 무시하고 가운데 정렬, 위/아래 중 공간 더 큰 쪽 ──
  if (isNarrow) {
    const left = Math.max(PAD, (vw - TT_W) / 2);
    const spaceBelow = vh - rect.bottom - PAD;
    const spaceAbove = rect.top - PAD;
    let top;
    if (spaceBelow >= TT_H) {
      top = rect.bottom + PAD;
    } else if (spaceAbove >= TT_H) {
      top = rect.top - TT_H - PAD;
    } else {
      top = (vh - TT_H) / 2;  // 공간 부족 → 중앙
    }
    top = Math.max(PAD, Math.min(vh - TT_H - PAD, top));
    return { left, top, placement: 'mobile' };
  }

  // ── 데스크탑: placement 기준 + 부족하면 fallback ──
  let p = placement || "auto";
  if (p === "auto") {
    if (rect.right + TT_W + PAD < vw) p = "right";
    else if (rect.left - TT_W - PAD > 0) p = "left";
    else if (rect.bottom + TT_H + PAD < vh) p = "bottom";
    else p = "top";
  }
  // 지정된 placement에 공간 없으면 자동 fallback
  if (p === "right" && rect.right + TT_W + PAD > vw) p = (rect.left - TT_W - PAD > 0) ? "left" : "bottom";
  if (p === "left"  && rect.left  - TT_W - PAD < 0)  p = (rect.right + TT_W + PAD < vw) ? "right" : "bottom";

  let left, top;
  switch (p) {
    case "right":  left = rect.right + PAD;          top = rect.top + rect.height/2 - TT_H/2; break;
    case "left":   left = rect.left - TT_W - PAD;    top = rect.top + rect.height/2 - TT_H/2; break;
    case "top":    left = rect.left + rect.width/2 - TT_W/2; top = rect.top - TT_H - PAD;     break;
    case "bottom":
    default:       left = rect.left + rect.width/2 - TT_W/2; top = rect.bottom + PAD;
  }
  left = Math.max(PAD, Math.min(vw - TT_W - PAD, left));
  top  = Math.max(PAD, Math.min(vh - TT_H - PAD, top));
  return { left, top, placement: p };
}

// 음성, 남/여 번갈아 (할아버지 보이스 회피)
window.__OD_VOICE_TURN = window.__OD_VOICE_TURN || 0;
const _VOICE_FEMALE = ["Samantha", "Karen", "Tessa", "Kate", "Allison", "Victoria", "Susan", "Ava", "Moira", "Isha", "Joanna", "Salli"];
const _VOICE_MALE   = ["Alex", "Daniel", "Aaron", "Tom", "Lee", "Oliver", "Arthur", "Reed", "Rocko", "Joey", "Matthew"];
function _pickVoice() {
  if (!("speechSynthesis" in window)) return null;
  const voices = window.speechSynthesis.getVoices();
  if (!voices.length) return null;
  const turn = window.__OD_VOICE_TURN++;
  const wantFemale = turn % 2 === 0;
  const tryList = (names) => {
    for (const name of names) {
      const v = voices.find(v => v.name.toLowerCase().includes(name.toLowerCase()) && v.lang.toLowerCase().startsWith("en"));
      if (v) return v;
    }
    return null;
  };
  return tryList(wantFemale ? _VOICE_FEMALE : _VOICE_MALE)
    || tryList(wantFemale ? _VOICE_MALE : _VOICE_FEMALE)
    || voices.find(v => v.lang === "en-US")
    || voices.find(v => v.lang.toLowerCase().startsWith("en"))
    || voices[0];
}
function _speakWord(word) {
  if (!("speechSynthesis" in window) || !word) return;
  const fire = () => {
    try { window.speechSynthesis.cancel(); } catch (e) {}
    const u = new SpeechSynthesisUtterance(word);
    u.lang = "en-US"; u.rate = 0.92; u.pitch = 1.0;
    const v = _pickVoice();
    if (v) u.voice = v;
    window.speechSynthesis.speak(u);
  };
  // 첫 호출 시 voices 비어있을 수 있음 → 짧게 기다렸다 재시도
  if (!window.speechSynthesis.getVoices().length) setTimeout(fire, 250);
  else fire();
}
// 페이지 로드 시 voices 미리 로드 트리거
if ("speechSynthesis" in window) {
  try { window.speechSynthesis.getVoices(); } catch(e) {}
  window.speechSynthesis.onvoiceschanged = () => { /* warm */ };
}

function _pickField(currentWord, count, key) {
  const { SCENARIOS, USER } = window.__SIM;
  const pool = SCENARIOS
    .filter(s => s.word !== currentWord && s.day <= Math.max(USER.wordsCollected + 5, 12))
    .map(s => s[key])
    .filter(Boolean);
  return _shuf([...new Set(pool)]).slice(0, count);
}
function _pickWordObjects(excludeWord, count) {
  const { SCENARIOS, USER } = window.__SIM;
  const pool = SCENARIOS.filter(s => s.word !== excludeWord && s.day <= Math.max(USER.wordsCollected, 12));
  return _shuf(pool).slice(0, count);
}

    ]);

        <div style={{ marginTop: 14, display: "grid", gap: 8 }}>

                      {o.ko && (

                          marginTop: 8, padding: "8px 10px",
                          background: "rgba(216,90,42,0.07)", borderRadius: 5,
                          fontSize: 12, color: "var(--ink)", lineHeight: 1.55, fontWeight: 500,
                        }}>
                          🇰🇷 {o.ko}
                        </div>
                      )}
                      {o.vocab && o.vocab.length > 0 && (
                        <div style={{
                          marginTop: 8, padding: "8px 10px",
                          background: "rgba(255,233,166,0.4)", borderRadius: 5,
                          fontSize: 11.5, color: "var(--ink)", lineHeight: 1.65,
                        }}>
                          <div style={{ fontSize: 10, fontWeight: 800, letterSpacing: "0.08em", color: "#8C6510", marginBottom: 4 }}>
                            📌 알아두면 좋은 단어
                          </div>
                          {o.vocab.map((v, vi) => (
                            <div key={vi} style={{ marginTop: vi === 0 ? 0 : 4 }}>
                              <b style={{ color: "var(--ink)" }}>{v.w}</b>
                              <span style={{ color: "var(--ink-soft)" }}> {v.m}</span>
                            </div>
                          ))}
                        </div>
                      )}
                    </>
                  )}
                  {showResult && !isPicked && (
                    <div style={{ marginTop: 4, fontSize: 11, color: "var(--ink-mute)" }}>{o.note}</div>
                  )}
                </button>
              );
            })}
          </div>
        </>
      )}

      {picked && picked.kind !== "correct" && (
        <div className="row" style={{ marginTop: 14, justifyContent: "flex-end" }}>
          <button className="btn btn-ghost" onClick={() => setPick(null)}>다시 골라보기</button>
        </div>
      )}

      {turn === 1 && picked?.kind === "correct" && (
        <div className="row" style={{ marginTop: 14, justifyContent: "flex-end" }}>
          <button className="btn btn-primary" onClick={onComplete}>점심 잘 먹었어요 ✓</button>
        </div>
      )}
    </ActivityShell>
  );
}

// === 4. RECAP, 10초 퀴즈 (3문제 빠른 4지선다) ===
function RecapActivity({ today, item, onClose, onComplete }) {
  const [qIdx, setQIdx] = useState(0);
  const [picks, setPicks] = useState([]);
  const [pick, setPick] = useState(null);

  // Q1: KO 뜻 → EN 단어
  // Q2: 빈칸 채우기 (예문에서 단어 빠진 거)
  // Q3: 동의어 매칭
  const questions = useMemo(() => {
    const otherWords = _pickWordObjects(today.word, 3);
    const otherWordSyn = otherWords.map(o => (o.synonyms && o.synonyms[0]) || o.word).filter(Boolean);
    return [
      {
        prompt: `한국어 뜻을 영어 단어로`,
        target: today.meaning,
        options: _shuf([today.word, ...otherWords.map(o => o.word)]),
        correct: today.word,
        hint: today.mentorTip,
      },
      {
        prompt: `빈 칸에 들어갈 단어`,
        target: (today.quote || today.sampleAnswer || "").replace(new RegExp(today.word, "gi"), "_____"),
        options: _shuf([today.word, ...otherWords.map(o => o.word).slice(0, 3)]),
        correct: today.word,
        hint: `원문: "${today.quote || today.sampleAnswer}"`,
      },
      {
        prompt: `비슷한 표현은?`,
        target: today.word,
        options: _shuf([
          (today.synonyms && today.synonyms[0]) || today.meaning,
          ...otherWordSyn.slice(0, 3),
        ]).slice(0, 4),
        correct: (today.synonyms && today.synonyms[0]) || today.meaning,
        hint: today.synonyms ? `유사: ${(today.synonyms || []).join(" · ")}` : "",
      },
    ];
  }, [today.word]);

  const q = questions[qIdx];
  const lastQ = qIdx >= questions.length - 1;
  const score = picks.filter(p => p.ok).length;

  const onPick = (opt) => {
    if (pick) return;
    setPick(opt);
    const ok = opt === q.correct;
    setTimeout(() => {
      setPicks([...picks, { ok, q: q.target, opt }]);
      if (lastQ) {
        setQIdx(qIdx + 1);
      } else {
        setQIdx(qIdx + 1);
        setPick(null);
      }
    }, 900);
  };

  if (qIdx >= questions.length) {
    const finalScore = picks.filter(p => p.ok).length;
    return (
      <ActivityShell title="RECAP · 10초 퀴즈 결과" onClose={onClose}>
        <div style={{ textAlign: "center", padding: "20px 0" }}>
          <div style={{ fontSize: 56, fontWeight: 900, color: "var(--orange)", lineHeight: 1, letterSpacing: "-0.04em" }}>
            {finalScore}<span style={{ fontSize: 22, color: "var(--ink-mute)" }}> / {questions.length}</span>
          </div>
          <div style={{ marginTop: 14, fontSize: 14, color: "var(--ink-soft)" }}>
            {finalScore === questions.length ? "전부 맞췄어요. 머릿속에 박혔네 🌟" :
             finalScore >= 2 ? "괜찮아요. 한 번 더 만나면 완전히 외워져요." :
             "오늘 단어 한 번만 더 입으로 굴려봐요, 내일 또 만나요."}
          </div>
        </div>
        <div style={{ marginTop: 8, display: "flex", flexDirection: "column", gap: 6 }}>
          {picks.map((p, i) => (
            <div key={i} style={{ display: "flex", justifyContent: "space-between", padding: "8px 12px", background: p.ok ? "rgba(74,124,89,0.06)" : "rgba(178,58,44,0.06)", border: "1px solid var(--line)", borderRadius: 6, fontSize: 12 }}>
              <span>Q{i+1}</span>
              <span style={{ fontWeight: 800, color: p.ok ? "var(--green)" : "var(--stamp-red)" }}>{p.ok ? "✓ 정답" : "✗ 오답"}</span>
            </div>
          ))}
        </div>
        <div className="row" style={{ marginTop: 18, justifyContent: "flex-end" }}>
          <button className="btn btn-primary" onClick={onComplete}>Recap 완료 ✓</button>
        </div>
      </ActivityShell>
    );
  }

  return (
    <ActivityShell title={`RECAP · 10초 퀴즈 · ${qIdx + 1} / ${questions.length}`} onClose={onClose}>
      <span className="label-doc label-orange">▶ 15:30 · 빠른 복습</span>
      <div style={{ marginTop: 12, fontSize: 13, color: "var(--ink-mute)", letterSpacing: "0.04em", fontWeight: 700 }}>{q.prompt}</div>
      <div style={{ marginTop: 8, padding: 18, background: "var(--cream)", border: "1px dashed var(--line)", borderRadius: 8, fontSize: 18, fontWeight: 800, color: "var(--ink)", lineHeight: 1.45, letterSpacing: "-0.01em" }}>
        {q.target}
      </div>
      <div style={{ marginTop: 14, display: "grid", gap: 8 }}>
        {q.options.map((o, i) => {
          const isPicked = pick === o;
          const showResult = pick !== null;
          const ok = o === q.correct;
          return (
            <button
              key={i}
              onClick={() => onPick(o)}
              style={{
                textAlign: "left", padding: "12px 16px", borderRadius: 8,
                border: "1.5px solid " + (showResult && ok ? "var(--green)" : isPicked ? "var(--stamp-red)" : "var(--line)"),
                background: showResult && ok ? "rgba(74,124,89,0.10)" : isPicked ? "rgba(178,58,44,0.06)" : "#fff",
                cursor: pick === null ? "pointer" : "default",
                fontSize: 14, lineHeight: 1.4, fontFamily: "inherit", color: "var(--ink)",
                fontWeight: showResult && ok ? 800 : 500,
              }}
            >
              {String.fromCharCode(65 + i)}. {o}
            </button>
          );
        })}
      </div>
      {pick && q.hint ? (
        <div style={{ marginTop: 12, fontSize: 12, color: "var(--ink-soft)", lineHeight: 1.55, padding: "10px 12px", background: "rgba(216,90,42,0.06)", borderRadius: 6 }}>
          💡 {q.hint}
        </div>
      ) : null}
    </ActivityShell>
  );
}

// === 6. JOURNAL, 업무일지 + 퇴근 (한 줄 회고 + 버디 응원) ===
function JournalActivity({ today, item, onClose, onComplete }) {
  const { CHARACTERS } = window.__SIM;
  const buddy = CHARACTERS.buddy;

  // ★ 이전에 저장한 일지가 있으면 로드 (재진입 시 사라지지 않게)
  const _existing = _loadDailyJournal(today.day);
  const [text, setText] = useState(_existing?.text || "");
  const [submitted, setSubmitted] = useState(!!_existing);
  const [savedToast, setSavedToast] = useState(false);

  const buddyReply = useMemo(() => {
    const pool = [
      `좋아, ${today.word} 한 번 자기 입으로 써본 거, 진짜 외운 거야. 내일 또 만나자.`,
      `오늘 ${today.word} 한 번도 입으로 안 굴렸으면 휘발돼. 자기 전에 한 번만 더, 그러면 진짜 머리에 박혀.`,
      `30일 중 ${window.__SIM.USER.currentDay}일째. ${today.word} 같은 표현 30개 모이면 회의 분위기 자체가 달라져.`,
    ];
    return pool[(today.day - 1) % pool.length];
  }, [today.word, today.day]);

  // 제출 = 저장 + submitted 표시
  const handleSubmit = () => {
    if (!text.trim()) return;
    const ok = _saveDailyJournal(today.day, text);
    setSubmitted(true);
    if (ok) {
      setSavedToast(true);
      setTimeout(() => setSavedToast(false), 2500);
    }
  };

  return (
    <ActivityShell title="WORK JOURNAL · 업무일지 + 퇴근" onClose={onClose}>
      <span className="label-doc label-orange">▶ 17:00 · 오늘의 한 줄</span>
      <div style={{ marginTop: 10, fontSize: 13, color: "var(--ink-soft)", lineHeight: 1.6 }}>
        오늘 단어 <b style={{ background: "var(--highlight)", padding: "1px 6px" }}>{today.word}</b>, 진짜 어디서 쓸 수 있을 것 같아요? 한 줄만.
        <span style={{ display: "block", marginTop: 6, fontSize: 11.5, color: "var(--ink-mute)" }}>
          📒 작성한 일지는 <b>업무노트 → 해당 날짜 카드</b>에서 다시 볼 수 있어요.
        </span>
      </div>
      <textarea
        className="scene-input"
        placeholder={`예: 다음 회의에서 ${today.word} 한 번 써봐야지. 박 대리한테 ${today.word} 들으면 이제 안 헷갈려.`}
        value={text}
        onChange={e => setText(e.target.value)}
        disabled={submitted}
        style={{ marginTop: 12 }}
      />
      {!submitted ? (
        <div className="row" style={{ marginTop: 12, justifyContent: "space-between" }}>
          <button className="btn btn-ghost" onClick={() => setText(`다음 ${item?.context?.ctx || "회의"}에서 ${today.word} 한 번 써먹어보기.`)}>예시로 채우기</button>
          <button className="btn btn-primary" onClick={handleSubmit} disabled={!text.trim()}>일지 제출 →</button>
        </div>
      ) : (
        <>
          {savedToast && (
            <div style={{ marginTop: 10, padding: "8px 12px", background: "rgba(46,125,50,0.08)", border: "1px solid rgba(46,125,50,0.25)", borderRadius: 6, fontSize: 12, color: "var(--green, #2e7d32)", textAlign: "center", fontWeight: 700 }}>
              ✓ 일지 저장됨 · 업무노트에서 다시 볼 수 있어요
            </div>
          )}
          <div style={{ marginTop: 16, padding: 16, background: "rgba(216,90,42,0.06)", border: "1px solid rgba(216,90,42,0.25)", borderRadius: 8 }}>
            <div style={{ display: "flex", gap: 10, alignItems: "center", marginBottom: 8 }}>
              <div className="buddy-avatar small" style={{ width: 32, height: 32, fontSize: 13 }}>{buddy.avatar}</div>
              <div>
                <div className="buddy-name" style={{ fontSize: 13 }}>{buddy.name}</div>
                <div className="buddy-role" style={{ fontSize: 11 }}>오늘의 응원 한 마디</div>
              </div>
            </div>
            <div style={{ fontSize: 13.5, color: "var(--ink)", lineHeight: 1.6 }}>{buddyReply}</div>
          </div>
          <div style={{ marginTop: 16, textAlign: "center", padding: "20px 0", position: "relative" }}>
            <div style={{
              display: "inline-block",
              padding: "16px 28px",
              border: "3px solid var(--stamp-red)",
              color: "var(--stamp-red)",
              fontSize: 18, fontWeight: 900, letterSpacing: "0.18em",
              transform: "rotate(-6deg)",
              fontFamily: "'Noto Sans KR', sans-serif",
            }}>
              퇴근 · DAY {today.day} 완주
            </div>
          </div>
          <div className="row" style={{ marginTop: 14, justifyContent: "space-between" }}>
            <button className="btn btn-ghost" onClick={() => setSubmitted(false)}>✏️ 일지 수정하기</button>
            <button className="btn btn-primary" onClick={onComplete}>퇴근하기 ✓</button>
          </div>
        </>
      )}
    </ActivityShell>
  );
}

// === 8. WEEKEND_RECAP, 일요일 이번 주 표현 미니 회고 (3문제) ===
function WeekendRecapActivity({ item, onClose, onComplete }) {
  const { SCENARIOS, USER } = window.__SIM;
  const recent = useMemo(() => {
    return SCENARIOS.filter(s => s.day <= USER.wordsCollected && s.day >= Math.max(1, USER.wordsCollected - 5));
  }, []);

  const questions = useMemo(() => {
    if (recent.length === 0) return [];
    const picks = _shuf(recent).slice(0, Math.min(3, recent.length));
    return picks.map(s => {
      // KO 뜻 → EN 단어 4지선다
      const others = SCENARIOS.filter(o => o.word !== s.word).map(o => o.word);
      const distractors = _shuf(others).slice(0, 3);
      return {
        target: s.meaning,
        prompt: "이번 주 본 단어, 한국어 뜻으로 영어 단어 맞추기",
        options: _shuf([s.word, ...distractors]),
        correct: s.word,
        hint: s.mentorTip || s.tags?.map(t => "#"+t).join(" ") || "",
      };
    });
  }, [recent]);

  const [qIdx, setQIdx] = useState(0);
  const [pick, setPick] = useState(null);
  const [results, setResults] = useState([]);

  if (recent.length === 0) {
    return (
      <ActivityShell title="WEEKEND · 미니 회고" onClose={onClose}>
        <div style={{ textAlign: "center", padding: "30px 0" }}>
          <div style={{ fontSize: 36, marginBottom: 14 }}>☕️</div>
          <div style={{ fontSize: 15, color: "var(--ink)", fontWeight: 700, marginBottom: 8 }}>이번 주는 아직 단어 모은 게 없네요</div>
          <div style={{ fontSize: 13, color: "var(--ink-soft)", lineHeight: 1.7 }}>월요일에 첫 단어부터 차근차근, 다음 일요일에 만나요.</div>
        </div>
        <div className="row" style={{ marginTop: 14, justifyContent: "flex-end" }}>
          <button className="btn btn-primary" onClick={onComplete}>알겠어요 ✓</button>
        </div>
      </ActivityShell>
    );
  }

  const q = questions[qIdx];
  if (qIdx >= questions.length) {
    const correct = results.filter(r => r.ok).length;
    return (
      <ActivityShell title="WEEKEND · 회고 결과" onClose={onClose}>
        <div style={{ textAlign: "center", padding: "20px 0" }}>
          <div style={{ fontSize: 56, fontWeight: 900, color: "var(--orange)", lineHeight: 1, letterSpacing: "-0.04em" }}>
            {correct}<span style={{ fontSize: 22, color: "var(--ink-mute)" }}> / {questions.length}</span>
          </div>
          <div style={{ marginTop: 14, fontSize: 14, color: "var(--ink-soft)" }}>
            {correct === questions.length ? "이번 주 단어 다 잡았어요 🌟" :
             correct >= Math.ceil(questions.length / 2) ? "이번 주 단어 머릿속에 살아있어요." :
             "월요일에 다시 한 번 굴려봐요."}
          </div>
          <div style={{ marginTop: 10, fontSize: 12.5, color: "var(--ink-mute)" }}>
            ☕️ 주말도 챙겼으니 보너스 도장 +1
          </div>
        </div>
        <div className="row" style={{ marginTop: 14, justifyContent: "flex-end" }}>
          <button className="btn btn-primary" onClick={onComplete}>월요일에 봐요 ✓</button>
        </div>
      </ActivityShell>
    );
  }

  const onPick = (opt) => {
    if (pick) return;
    setPick(opt);
    const ok = opt === q.correct;
    setTimeout(() => {
      setResults(r => [...r, { ok, opt }]);
      setQIdx(qIdx + 1);
      setPick(null);
    }, 900);
  };

  return (
    <ActivityShell title={`WEEKEND · 회고 ${qIdx + 1} / ${questions.length}`} onClose={onClose}>
      <span className="label-doc label-orange">▶ 일요일 · 이번 주 표현</span>
      <div style={{ marginTop: 12, fontSize: 12, color: "var(--ink-mute)", letterSpacing: "0.04em", fontWeight: 700 }}>{q.prompt}</div>
      <div style={{ marginTop: 8, padding: 18, background: "var(--cream)", border: "1px dashed var(--line)", borderRadius: 8, fontSize: 18, fontWeight: 800, color: "var(--ink)", lineHeight: 1.45 }}>
        {q.target}
      </div>
      <div style={{ marginTop: 14, display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8 }}>
        {q.options.map((o, i) => {
          const isPicked = pick === o;
          const showResult = pick !== null;
          const ok = o === q.correct;
          return (
            <button
              key={i}
              onClick={() => onPick(o)}
              style={{
                padding: "12px 14px", borderRadius: 8,
                border: "1.5px solid " + (showResult && ok ? "var(--green)" : isPicked ? "var(--stamp-red)" : "var(--line)"),
                background: showResult && ok ? "rgba(74,124,89,0.10)" : isPicked ? "rgba(178,58,44,0.06)" : "#fff",
                cursor: pick === null ? "pointer" : "default",
                fontSize: 13.5, fontFamily: "inherit", color: "var(--ink)",
                fontWeight: showResult && ok ? 800 : 600, textAlign: "center",
              }}

      </div>
      {pick && q.hint ? (
        <div style={{ marginTop: 12, fontSize: 12, color: "var(--ink-soft)", padding: "10px 12px", background: "rgba(216,90,42,0.06)", borderRadius: 6 }}>
          💡 {q.hint}
        </div>

    </ActivityShell>
  );
}

(function syncDayToSupabase() {
  const pending = window.__OD_PENDING_DAY_SYNC;
  if (!pending) return;
  let tries = 0;
  const tick = () => {
    if (window.OD && window.OD.enabled && window.OD.updateProgress) {
      window.OD.updateProgress(pending.email, { day_in_company: pending.day }).catch(() => {});
      window.__OD_PENDING_DAY_SYNC = null;
    } else if (tries++ < 20) {
      setTimeout(tick, 250);
    }
  };
  setTimeout(tick, 500);
})();

/* --- ★ 데이터 손실 방지: mainboard 진입 시 DB → localStorage 동기화 ---
 * cross-device 사용 시 localStorage가 stale 상태에서 새 학습 저장하면 DB 덮어쓰는 버그 방지.
 * DB의 scenariosCompleted, savedNotes를 localStorage와 union merge.
 * 본인 답변·노트는 day별로 보존, 최신 submittedAt 우선.
 */
(function hydrateFromDb() {
  let tries = 0;
  const tick = async () => {
    if (!window.OD || !window.OD.enabled || !window.OD.client) {
      if (tries++ < 20) setTimeout(tick, 250);
      return;
    }
    try {
      const raw = localStorage.getItem("__OD_USER");
      const local = raw ? JSON.parse(raw) : null;
      if (!local || !local.email) return;

      const { data: dbUser, error } = await window.OD.client
        .from("users")
        .select("scenarios_completed, saved_notes, daily_journals")
        .eq("email", local.email)
        .maybeSingle();
      if (error || !dbUser) return;

      // scenarios_completed merge (union by day, 최신 submittedAt 우선)
      const localCompleted = local.scenariosCompleted || [];
      const dbCompleted = dbUser.scenarios_completed || [];
      const byDay = new Map();
      [...dbCompleted, ...localCompleted].forEach(s => {
        if (!s || !s.day) return;
        const prev = byDay.get(s.day);
        if (!prev || new Date(s.submittedAt || 0) > new Date(prev.submittedAt || 0)) {
          byDay.set(s.day, s);
        }
      });
      const mergedCompleted = [...byDay.values()].sort((a, b) => a.day - b.day);

      // saved_notes merge (day별 배열 union, 텍스트 중복 제거)
      const localNotes = local.savedNotes || {};
      const dbNotes = dbUser.saved_notes || {};
      const mergedNotes = {};
      const allDayKeys = new Set([...Object.keys(localNotes), ...Object.keys(dbNotes)]);
      for (const d of allDayKeys) {
        const a = localNotes[d] || [];
        const b = dbNotes[d] || [];
        const seen = new Set();
        const out = [];
        [...b, ...a].forEach(n => {
          if (n && n.text && !seen.has(n.text)) {
            seen.add(n.text); out.push(n);
          }
        });
        if (out.length) mergedNotes[d] = out;
      }

      // daily_journals merge (day별 단일 객체, 최신 savedAt 우선)
      const localJournals = local.dailyJournals || {};
      const dbJournals = dbUser.daily_journals || {};
      const mergedJournals = {};
      const allJournalKeys = new Set([...Object.keys(localJournals), ...Object.keys(dbJournals)]);
      for (const d of allJournalKeys) {
        const a = localJournals[d];
        const b = dbJournals[d];
        if (!a) mergedJournals[d] = b;
        else if (!b) mergedJournals[d] = a;
        else {
          // 둘 다 있으면 최신 savedAt
          mergedJournals[d] = new Date(a.savedAt || 0) >= new Date(b.savedAt || 0) ? a : b;
        }
      }

      // 변화가 있을 때만 localStorage 갱신 + DB 동기화
      const changed =
        mergedCompleted.length !== localCompleted.length ||
        JSON.stringify(mergedNotes) !== JSON.stringify(localNotes) ||
        JSON.stringify(mergedJournals) !== JSON.stringify(localJournals);

      local.scenariosCompleted = mergedCompleted;
      local.savedNotes = mergedNotes;
      local.dailyJournals = mergedJournals;
      localStorage.setItem("__OD_USER", JSON.stringify(local));

      if (changed && window.OD.updateProgress) {
        window.OD.updateProgress(local.email, {
          scenarios_completed: mergedCompleted,
          saved_notes: mergedNotes,
          daily_journals: mergedJournals,
        }).catch(() => {});
        console.log("[hydrate] DB와 localStorage 병합 완료. 다음 새로고침 시 반영.");
      } else {
        console.log("[hydrate] DB·localStorage 일치, 추가 동기화 없음.");
      }
    } catch (e) {
      console.warn("[hydrate] DB sync failed:", e.message);
    }
  };
  setTimeout(tick, 600);
})();

    }
    #dev-panel.collapsed .dp-head { margin-bottom: 0; }
    #dev-panel .dp-title { font-weight: 800; font-size: 11px; letter-spacing: 0.1em; color: #F38A5C; }
    #dev-panel .dp-toggle {
      background: rgba(255,255,255,0.1); border: none; color: #F4EFE3;
      padding: 2px 8px; border-radius: 4px; cursor: pointer;
      font-size: 11px; font-family: inherit;
    }
    #dev-panel .dp-info {
      background: rgba(255,255,255,0.06); padding: 8px 10px; border-radius: 6px;
      margin-bottom: 10px; line-height: 1.55;
    }
    #dev-panel .dp-info .muted { color: #DBCFB4; opacity: 0.7; font-size: 11px; }
    #dev-panel .dp-info .day { font-size: 18px; font-weight: 900; color: #F38A5C; }
    #dev-panel .dp-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 4px; margin-bottom: 4px; }
    #dev-panel button.dp-btn {
      background: rgba(255,255,255,0.08); color: #F4EFE3;
      border: 1px solid rgba(255,255,255,0.12);
      padding: 7px 6px; border-radius: 5px; cursor: pointer;
      font-size: 11px; font-weight: 600; font-family: inherit;
    }
    #dev-panel button.dp-btn:hover { background: rgba(255,255,255,0.15); }
    #dev-panel button.dp-btn.danger { background: rgba(216,90,42,0.5); border-color: rgba(216,90,42,0.7); }
    #dev-panel button.dp-btn.danger:hover { background: rgba(216,90,42,0.8); }
    #dev-panel a.dp-link { color: #F38A5C; text-decoration: none; font-size: 11px; }
    #dev-panel a.dp-link:hover { text-decoration: underline; }
    #dev-panel .dp-badges { display: flex; flex-wrap: wrap; gap: 3px; margin-top: 6px; }
    #dev-panel .dp-badge {
      font-size: 9.5px; font-weight: 800; letter-spacing: 0.06em;
      padding: 2px 6px; border-radius: 3px; text-transform: uppercase;
    }
    #dev-panel .dp-badge.role-operator { background: #4ade80; color: #064e1c; }
    #dev-panel .dp-badge.role-dev      { background: #60a5fa; color: #082c5a; }
    #dev-panel .dp-badge.role-tester   { background: #a78bfa; color: #2e1065; }
    #dev-panel .dp-badge.role-pilot    { background: #fbbf24; color: #5b3a00; }
    #dev-panel .dp-badge.role-unlocked { background: #34d399; color: #064e3b; }
    #dev-panel .dp-badge.role-pending  { background: #6b7280; color: #fff; }
    #dev-panel .dp-cohort {
      display: inline-block; margin-top: 4px;
      background: rgba(216,90,42,0.2); color: #F38A5C;
      padding: 2px 6px; border-radius: 3px;
      font-size: 10px; font-weight: 700; letter-spacing: 0.04em;
    }
  `;
  document.head.appendChild(style);

  const panel = document.createElement('div');
  panel.id = 'dev-panel';

  function render() {
    const u = load();
    if (panel.classList.contains('collapsed')) {
      panel.innerHTML = `
        <div class="dp-head">
          <div class="dp-title">🛠 DEV ${u ? '· Day ' + u.dayInCompany : ''}</div>
          <button class="dp-toggle" id="dp-expand">펼치기</button>
        </div>
      `;
      panel.querySelector('#dp-expand').onclick = () => { panel.classList.remove('collapsed'); render(); };
      return;
    }
    if (!u) {
      panel.innerHTML = `
        <div class="dp-head">
          <div class="dp-title">🛠 DEV PANEL</div>
          <button class="dp-toggle" id="dp-collapse">접기</button>
        </div>
        <div class="dp-info">
          <div class="muted">등록된 사용자 없음</div>
          <a href="onboarding.html" class="dp-link">→ 온보딩 시작</a>
        </div>
      `;
      panel.querySelector('#dp-collapse').onclick = () => { panel.classList.add('collapsed'); render(); };
      return;
    }
    // 권한·역할 배지 계산
    const badges = [];
    if (u.isOperator)   badges.push({ label: 'OPERATOR', cls: 'role-operator' });
    if (u.isDevMode)    badges.push({ label: 'DEV',      cls: 'role-dev' });
    if (u.isTester)     badges.push({ label: 'TESTER',   cls: 'role-tester' });
    if (u.isPilotHire)  badges.push({ label: 'PILOT',    cls: 'role-pilot' });
    if (u.unlocked)     badges.push({ label: 'UNLOCKED', cls: 'role-unlocked' });
    if (badges.length === 0) badges.push({ label: 'PENDING', cls: 'role-pending' });
    const badgesHtml = badges.map(b => `<span class="dp-badge ${b.cls}">${b.label}</span>`).join('');

    // URL ?expired=1 상태 확인
    const _expiredOn = new URLSearchParams(location.search).get('expired') === '1';

    panel.innerHTML = `
      <div class="dp-head">
        <div class="dp-title">🛠 DEV PANEL</div>
        <button class="dp-toggle" id="dp-collapse">접기</button>
      </div>
      <div class="dp-info">
        <div><strong>${u.name || ''}</strong> <span class="muted">· ${u.email || ''}</span></div>
        <div class="muted">${u.empNumber || ''} · ${(u.department && u.department.short) || ''}</div>
        <div class="dp-badges">${badgesHtml}</div>
        ${u.cohort ? '<div class="dp-cohort">🎫 ' + u.cohort + '</div>' : ''}
        ${u.inviteCode ? '<div class="muted" style="margin-top:4px">코드: <strong>' + u.inviteCode + '</strong></div>' : ''}
        <div style="margin-top:8px;">현재 <span class="day">Day ${u.dayInCompany}</span></div>
      </div>
      <div class="dp-row">
        <button class="dp-btn" data-act="d-1">← Day -1</button>
        <button class="dp-btn" data-act="d+1">Day +1 →</button>
        <button class="dp-btn" data-act="d+7">+7일</button>
      </div>
      <div class="dp-row">
        <button class="dp-btn" data-act="d-7">-7일</button>
        <button class="dp-btn" data-act="set" style="grid-column: span 2">Day로 점프</button>
      </div>

      <div style="margin-top:10px; padding-top:8px; border-top:1px solid rgba(255,255,255,0.1)">
        <div class="muted" style="margin-bottom:4px;">베타 만료 미리보기 (Day 8+ PILOT)</div>
        <div class="dp-row" style="grid-template-columns: 1fr 1fr">
          <button class="dp-btn" data-act="preview-expired" style="background:${_expiredOn ? 'rgba(243,138,92,0.4)' : 'rgba(255,255,255,0.08)'}">${_expiredOn ? '✓ 만료 화면 ON' : '🔒 만료 화면 보기'}</button>
          <button class="dp-btn" data-act="exit-expired" ${!_expiredOn ? 'disabled style="opacity:0.4;cursor:not-allowed"' : ''}>↩ 정상 복귀</button>
        </div>
      </div>

      <div style="margin-top:10px; padding-top:8px; border-top:1px solid rgba(255,255,255,0.1)">
        <div class="muted" style="margin-bottom:4px;">시뮬레이션</div>
        <div class="dp-row" style="grid-template-columns: 1fr 1fr">
          <button class="dp-btn" data-act="fill-learning" title="현재 Day까지의 단어를 예시 답안으로 자동 채움, 단어 사전 미리보기">📚 학습 채우기</button>
          <button class="dp-btn" data-act="clear-learning" title="저장된 본인 답변 모두 삭제">🧹 학습 비우기</button>
        </div>
      </div>

      <div class="dp-row" style="grid-template-columns: 1fr 1fr; margin-top:8px">
        <button class="dp-btn" data-act="reload">새로고침</button>
        <button class="dp-btn" data-act="reset-day" title="오늘 일정 진행만 초기화 (다른 날은 그대로)">↻ 오늘 학습 리셋</button>
      </div>
      <div class="dp-row" style="grid-template-columns: 1fr; margin-top:4px">
        <button class="dp-btn danger" data-act="reset">사용자 리셋 (전체)</button>
      </div>
      ${u.isOperator ? '<div style="margin-top:10px; padding-top:8px; border-top:1px solid rgba(255,255,255,0.1)"><a href="operator.html" class="dp-link">↗ 운영자 뷰</a> · <a href="dev.html" class="dp-link">↗ Dev 런처</a></div>' : ''}
    `;
    panel.querySelector('#dp-collapse').onclick = () => { panel.classList.add('collapsed'); render(); };
    panel.querySelectorAll('[data-act]').forEach(btn => {
      btn.onclick = () => handle(btn.dataset.act);
    });
  }

  function reloadCleanUrl() {
    // 옛날 ?weekend= 같은 sticky 파라미터 청소하고 reload
    const url = new URL(location.href);
    if (url.searchParams.has('weekend')) {
      url.searchParams.delete('weekend');
      location.href = url.toString();
    } else {
      location.reload();
    }
  }
  function handle(act) {
    let u = load();
    if (!u && act !== 'reload') return;
    switch (act) {
      case 'd+1': u.dayInCompany = Math.min(365, (u.dayInCompany || 1) + 1); save(u); reloadCleanUrl(); break;
      case 'd-1': u.dayInCompany = Math.max(1, (u.dayInCompany || 1) - 1); save(u); reloadCleanUrl(); break;
      case 'd+7': u.dayInCompany = Math.min(365, (u.dayInCompany || 1) + 7); save(u); reloadCleanUrl(); break;
      case 'd-7': u.dayInCompany = Math.max(1, (u.dayInCompany || 1) - 7); save(u); reloadCleanUrl(); break;
      case 'set': {
        const v = prompt('이동할 Day (1-365):', String(u.dayInCompany || 1));
        if (!v) return;
        const n = Math.max(1, Math.min(365, parseInt(v, 10) || 1));
        u.dayInCompany = n; save(u); reloadCleanUrl();
        break;
      }
      case 'reset':
        if (confirm('사용자 데이터를 모두 지울까요? 온보딩부터 다시 시작됨.')) {
          localStorage.removeItem(KEY_USER);
          location.href = 'onboarding.html';
        }
        break;
      case 'reset-day': {
        // 오늘(currentDay)의 학습 진행만 초기화, 다른 날은 그대로
        const day = u.dayInCompany || 1;
        const taskKey = '__OD_TASKS_DAY_' + day;
        const tourKey = '__OD_TOUR_DONE_DAY_' + day;
        if (confirm('Day ' + day + ' 의 일정 진행 + 투어를 초기화할까요? 다른 날 진행은 그대로 유지돼요.')) {
          try {
            localStorage.removeItem(taskKey);
            localStorage.removeItem(tourKey);
          } catch (e) {}
          location.reload();
        }
        break;
      }
      case 'preview-expired': {
        // 베타 만료 화면 강제 표시, Day 8로 점프 + ?expired=1 추가
        u.dayInCompany = Math.max(8, u.dayInCompany || 8);
        save(u);
        const url = new URL(location.href);
        url.searchParams.set('expired', '1');
        location.href = url.toString();
        break;
      }
      case 'exit-expired': {
        // 만료 화면 끄고 Day 1로 복귀
        const url = new URL(location.href);
        url.searchParams.delete('expired');
        location.href = url.toString();
        break;
      }
      case 'fill-learning': {
        // 현재 Day까지 시나리오를 예시 답안으로 자동 채움, 단어 사전 미리보기용
        const day = u.dayInCompany || 1;
        const SCENARIOS = (window.__SIM && window.__SIM.SCENARIOS) || [];
        const completed = [];
        for (let d = 1; d <= day && d <= 30; d++) {
          const s = SCENARIOS.find(x => x.day === d);
          if (!s) continue;
          completed.push({
            day: d,
            word: s.word,
            sentence: s.sampleAnswer || `Sample sentence using ${s.word}.`,
            feedback: {
              headline: '예시 답안 기반, 단어 자연스럽게 들어갔고, 톤도 적절.',
              overall: 'good',
              checks: [
                { ok: true, label: '단어 사용', note: `${s.word} 자연스럽게 들어감` },
                { ok: true, label: '톤', note: '사내 메시지로 적절' },
              ],
            },
            submittedAt: new Date(Date.now() - (day - d) * 86400000).toISOString(),
          });
        }
        u.scenariosCompleted = completed;
        save(u);
        // Supabase 동기화 (있으면)
        if (window.OD && window.OD.enabled && window.OD.updateProgress && u.email) {
          window.OD.updateProgress(u.email, { scenarios_completed: completed }).catch(() => {});
        }
        alert(`📚 Day 1-${day} 학습 데이터를 예시 답안으로 채웠어요. 단어 사전(노트)에서 확인.`);
        location.reload();
        break;
      }
      case 'clear-learning': {
        if (!confirm('저장된 본인 답변을 모두 삭제할까요?')) return;
        u.scenariosCompleted = [];
        save(u);
        if (window.OD && window.OD.enabled && window.OD.updateProgress && u.email) {
          window.OD.updateProgress(u.email, { scenarios_completed: [] }).catch(() => {});
        }
        location.reload();
        break;
      }
      case 'reload': location.reload(); break;
    }
  }

  document.body.appendChild(panel);
  render();
})();
</script>
</body>
</html>
