  if (!today) {
    return (
      <div style={{ padding: 60, textAlign: "center", color: "var(--ink-mute)", fontSize: 14, lineHeight: 1.7 }}>
        <div style={{ fontSize: 32, marginBottom: 16 }}>🌅</div>
        <div style={{ fontSize: 16, fontWeight: 700, color: "var(--ink)", marginBottom: 8 }}>
          오늘은 새 단어가 없는 날이에요
        </div>
        Day {USER.currentDay}, 단어 카드는 Day 1-30번까지에요.<br/>
        Dev panel에서 다른 Day로 점프해보세요.
      </div>
    );
  }

  // 출근부 그리드. 기본 14일, "전체 보기" 토글하면 코스 전체 (30일).
  // ★ 실제로 학습 완료한 날만 done. 안 한 날은 missed (결근). 무조건 done 처리 금지.
  // 완료 판단 기준 (셋 중 하나라도 만족하면 출근 인정):
  //   1. scenariosCompleted 에 그날 entry 있음 (시추에이션 문장 제출)
  //   2. dailyJournals 에 그날 entry 있음 (내 시추에이션 제출)
  //   3. __OD_TASKS_DAY_<day> 에 일정 4개 전부 체크됨
  // 과거일 클릭하면 ?day=N URL로 이동해서 그날 학습 가능 (저장은 그날 기준 정확히)
  const [showFullAttend, setShowFullAttend] = useState(false);
  // ★ 시즌 2: 정직원 마일스톤 카드 (닫기가 아니라 접기, 수시로 펼쳐볼 수 있음)
  const _S2_CARD_KEY = "__OD_S2_WELCOME_DISMISSED_" + (USER.email || "guest");
  // 접힘은 '그날 하루'만 유지. 새 day엔 다시 펼쳐서 로드맵(마일스톤)이 자주 보이게.
  const _s2Today = String(USER.realCurrentDay || USER.currentDay || 1);
  const [s2CardCollapsed, setS2CardCollapsed] = useState(() => {
    try { return localStorage.getItem(_S2_CARD_KEY) === _s2Today; } catch (e) { return false; }
  });
  const toggleS2Card = () => {
    setS2CardCollapsed(v => {
      const nv = !v;
      try { localStorage.setItem(_S2_CARD_KEY, nv ? _s2Today : "0"); } catch (e) {}
      return nv;
    });
  };
  // ★ 기본은 "최근 14일" 슬라이딩 창. Day가 늘어나도(시즌 2, 60일) 출근부 높이 고정.
  //   전체 보기 토글 시 코스 전체 (수습 30 / 정직원 60).
  const _realCurrentDay = USER.realCurrentDay || USER.currentDay || 1;
  const _attendEnd = showFullAttend
    ? USER.totalDays
    : Math.min(USER.totalDays, Math.max(14, _realCurrentDay));
  const _attendStart = showFullAttend ? 1 : Math.max(1, _attendEnd - 13);
  const allTodayDone = TODAY_SCHEDULE.length > 0 && TODAY_SCHEDULE.every(t => doneTasks[t.id]);
  // ★ 출근 완성 = 그날 4개 일정 모두 완료. 늦은 인증 = 완료했지만 해당일 이후.
  const _signupDate = _localUser?.signupDate ? new Date(_localUser.signupDate) : null;
  const _dayDeadline = (day) => {
    if (!_signupDate || isNaN(_signupDate.getTime())) return null;
    const d = new Date(_signupDate); d.setHours(0, 0, 0, 0);
    d.setDate(d.getDate() + day); // day N 다음날 자정 = 그날 마감
    return d.getTime();
  };
  // day별 가장 늦은 완료 시각 (영작·일지 기준, 늦은 인증 판정용)
  const _lastAt = {};
  (USER.scenariosCompleted || []).forEach(s => {
    if (s && s.day && s.submittedAt) {
      const t = new Date(s.submittedAt).getTime();
      if (!_lastAt[s.day] || t > _lastAt[s.day]) _lastAt[s.day] = t;
    }
  });
  Object.entries(USER.dailyJournals || {}).forEach(([k, j]) => {
    const day = parseInt(k, 10);
    if (day && j && j.savedAt) {
      const t = new Date(j.savedAt).getTime();
      if (!_lastAt[day] || t > _lastAt[day]) _lastAt[day] = t;
    }
  });
  // 그날 4개 일정 모두 완료했는지
  const _dayComplete = (day) => {
    try {
      const tasks = JSON.parse(localStorage.getItem("__OD_TASKS_DAY_" + day) || "{}");
      return Object.values(tasks).filter(Boolean).length >= 4;
    } catch (e) { return false; }
  };
  // 일정(task) 완료 시각 (영작·일지 외에 일정만 늦게 채운 경우도 잡음)
  const _taskTs = (day) => {
    try {
      const v = localStorage.getItem("__OD_TASKS_DAY_" + day + "_ts");
      return v ? new Date(v).getTime() : null;
    } catch (e) { return null; }
  };
  const _isLate = (day) => {
    const dl = _dayDeadline(day);
    if (!dl) return false;
    const at = Math.max(_lastAt[day] || 0, _taskTs(day) || 0);
    return !!(at && at > dl);
  };
  // ★ 실제 오늘 기준으로 today 판정 (과거 보는 중에도 진짜 오늘만 "오늘" 표시)
  const _realDay = USER.realCurrentDay || USER.currentDay;
  const _realDayDone = (_realDay === USER.currentDay) ? allTodayDone : _dayComplete(_realDay);
  // 시추에이션 카드/모달 도장: 그날 일정 다 끝냈으면 DONE
  const _sceneDone = (today && today.day === USER.currentDay) ? allTodayDone : _dayComplete(today ? today.day : 0);
  const cells = Array.from({ length: _attendEnd - _attendStart + 1 }, (_, i) => {
    const day = _attendStart + i;
    const isWk = _isWeekendDay(day);
    if (day === _realDay) return { day, state: _realDayDone ? "stamped" : "today", weekend: isWk };
    if (day < _realDay) {
      if (_dayComplete(day)) return { day, state: _isLate(day) ? "late" : "done", weekend: isWk };
      return { day, state: "missed", weekend: isWk };
    }
    return { day, state: "future", weekend: isWk };
  });

  // 마지막 항목 완료 토스트
  const _maybeFinaleToast = (idx) => {
    // ★ 활동 하나 끝날 때마다 발사. 학습 게이트가 움직였는지 다시 계산하는 신호.
    //   (od-day-finale은 Day 1 세팅 안내 전용이라 Day 1에만 나간다. 그걸 재사용하면
    //    Day 2 이후 회원에겐 영영 안 온다.)
    try { window.dispatchEvent(new Event('od-day-complete')); } catch (e) {}
    if (idx === TODAY_SCHEDULE.length - 1) {
      setTimeout(() => showToast("🎊 Day " + USER.currentDay + " 완주! 내일 또 봐요.", 4000), 200);
      // Day 1을 다 끝낸 직후 = 계속할 마음이 가장 큰 순간. 출근 환경 세팅 안내.
      if ((USER.realCurrentDay || USER.currentDay) === 1 && !USER.isViewingPast) {
        try { window.dispatchEvent(new Event('od-day-finale')); } catch (e) {}
      }
    }
  };

  // 항목별 클릭 처리, scenario는 SceneModal로 (즉시 done), 나머지는 ActivityModal로 (활동 완료해야 done)
  const handleScheduleClick = (item, idx) => {
    if (doneTasks[item.id]) {
      // 이미 끝낸 활동도 한 번 더 풀어볼 수 있게 모달은 열어줌 (done 상태 유지)
      if (item.id !== "scenario" && item.type !== "scenario") {
        setActiveItem({ item, idx, replay: true });
      } else {
        openScene(today);
      }
      return;
    }
    const prevDone = idx === 0 || doneTasks[TODAY_SCHEDULE[idx-1].id];
    if (!prevDone) {
      showToast("⏳ 이전 항목 먼저 끝내주세요");
      return;
    }

    if (item.id === "scenario") {
      // 시추에이션, 기존 SceneModal 유지. 클릭 즉시 done 처리.
      const next = { ...doneTasks, [item.id]: true };
      setDoneTasks(next);
      try { localStorage.setItem(taskKey, JSON.stringify(next)); localStorage.setItem(taskKey + "_ts", new Date().toISOString()); } catch(e) {}
      // ★ cross-device 동기화
      if (window.OD?.enabled && window.OD.saveTaskProgress && USER.email) {
        window.OD.saveTaskProgress(USER.email, USER.currentDay, next).catch(() => {
          window.OD.pushOutbox?.({ type: 'task', email: USER.email, day: USER.currentDay, tasks: next });
        });
      }
      openScene(today);
      _maybeFinaleToast(idx);
      return;
    }

    // 그 외 활동은 ActivityModal, 활동 끝나야 done
    setActiveItem({ item, idx, replay: false });
  };

  // ActivityModal 완료 핸들러, 처음 완료할 때만 doneTasks에 기록
  const completeActivity = () => {
    if (!activeItem) return;
    const { item, idx, replay } = activeItem;
    if (!replay && !doneTasks[item.id]) {
      const next = { ...doneTasks, [item.id]: true };
      setDoneTasks(next);
      try { localStorage.setItem(taskKey, JSON.stringify(next)); localStorage.setItem(taskKey + "_ts", new Date().toISOString()); } catch(e) {}
      // ★ cross-device 동기화
      if (window.OD?.enabled && window.OD.saveTaskProgress && USER.email) {
        window.OD.saveTaskProgress(USER.email, USER.currentDay, next).catch(() => {
          window.OD.pushOutbox?.({ type: 'task', email: USER.email, day: USER.currentDay, tasks: next });
        });
      }
      _maybeFinaleToast(idx);
    } else {
      showToast("👍 다시 풀어봤어요, 표현이 더 자연스러워질 거예요");
    }
    setActiveItem(null);
  };

  // 각 항목의 computed status
  const scheduleWithStatus = TODAY_SCHEDULE.map((item, i) => {
    if (doneTasks[item.id]) return { ...item, computed: "done" };
    const prevDone = i === 0 || doneTasks[TODAY_SCHEDULE[i-1].id];
    return { ...item, computed: prevDone ? "now" : "locked" };
  });

  return (
    <div>
      <div className="desk-header">
        <div>
          <div className="desk-eyebrow">
            {todayLabel} · DAY {USER.currentDay} / {USER.totalDays} · <span style={{ color: "var(--orange)" }}>수집 표현 {USER.wordsCollected}</span>
          </div>
          <h1 className="desk-title"><em>오늘의</em> 책상 위</h1>
        </div>
        <div className="desk-meta">
          <b>{USER.name}</b> · {USER.position}{_isNextFeature() ? " " + _tyHobong() + "호봉" : ""}<br/>
          {USER.team}
        </div>
      </div>

      <div className={"home-appline" + (_isNextFeature() ? " next" : "")}><ApplicationLine /></div>

      {/* ★ 오랜만에 온 회원 안내: 달력은 흘렀지만 진도는 그대로일 때, 뭐부터 할지 한 줄로. */}
      {(() => {
        const _cal = Number(window.__odAutoDay) || 0;
        const _cur = USER.realCurrentDay || USER.currentDay || 1;
        if (USER.isViewingPast || !_cal || _cal <= _cur) return null;
        const _wait = _cal - _cur;
        return (
          <div className="catchup" style={{ marginBottom: 14 }}>
            <div className="catchup-txt">
              📌 오늘은 <b>Day {_cur}</b>부터 이어서. 더 학습할 수 있는 Day가 <b>{_wait}일치</b> 기다리고 있어요.
              하루를 마치면 다음 Day가 바로 열려서, 원하시면 오늘 몰아서 하셔도 돼요.
            </div>
          </div>
        );
      })()}

      {_isNextFeature() && <AwayReport user={USER} />}
      {_isNextFeature() && <TycoonBoot toast={showToast} />}

      <div className={"desk-grid" + (_isNextFeature() ? " next-home" : "")}>
        <div className="col">
          {_isNextFeature() && (
            <div className="today-accum">
              <div className="today-accum-big">지금까지 표현 <b>{USER.wordsCollected}개</b> 모았어요</div>
              <div className="today-accum-sub">🔥 출근 {USER.streak}일 · {USER.isFulltime ? "" : ("사원 승진까지 " + Math.max(0, 30 - (USER.realCurrentDay || USER.currentDay)) + "일")}</div>
            </div>
          )}
          <SceneCard
            scenario={today}
            npc={npc}
            onOpen={() => openScene(today)}
            checkinDone={!!doneTasks.checkin}
            onStartDay={() => handleScheduleClick(scheduleWithStatus[0], 0)}
            done={_sceneDone}
          />

          <div className="schedule">
            <div className="schedule-head">
              <span>오늘 일정 · DAY {USER.currentDay}</span>
              <span style={{ color: "var(--orange)" }}>● 진행 중</span>
            </div>
            {scheduleWithStatus.map((row, i) => (
              <div
                key={row.id}
                className={"schedule-row " + row.computed}
                onClick={() => row.computed !== "locked" && handleScheduleClick(row, i)}
                style={{
                  cursor: row.computed === "locked" ? "not-allowed" : "pointer",
                  opacity: row.computed === "locked" ? 0.4 : 1,
                  transition: "all 0.15s",
                }}
              >
                <span className="schedule-time">{row.time}</span>
                <span>
                  <span className="schedule-title" style={{ textDecoration: row.computed === "done" ? "line-through" : "none" }}>{row.title}</span>
                  {row.note ? <div className="schedule-note">{row.note}</div> : null}
                </span>
                <span className={"schedule-status " + row.computed}>
                  {row.computed === "done" ? "✓ 완료" : row.computed === "now" ? "👉 지금" : "🔒 잠금"}
                </span>
              </div>
            ))}
          </div>
        </div>

        <div className="col">
          {/* ★ 수습 마일스톤 카드: 사원 전환 기대감 + 보상 미리보기 (접기/펼치기) */}
          {!USER.isFulltime && !USER.isViewingPast && (() => {
            const _rd = USER.realCurrentDay || USER.currentDay;
            const _pct = Math.max(3, Math.min(100, Math.round(_rd / 30 * 100)));
            const _dLeft = Math.max(0, 30 - _rd);
            const MILESTONES = [
              { d: 7,  icon: "🌱", label: "1주 완주" },
              { d: 15, icon: "⚡", label: "절반 돌파" },
              { d: 21, icon: "🔥", label: "3주 달성" },
              { d: 30, icon: "🎓", label: "정직원 전환" },
            ];
            // 접힌 상태: 슬림 바
            if (s2CardCollapsed) {
              return (
                <button className="s2-welcome" onClick={toggleS2Card} title="펼치기" style={{
                  display: "flex", alignItems: "center", gap: 10, width: "100%",
                  background: "var(--cream)", border: "1px solid var(--orange)",
                  borderRadius: 8, padding: "10px 14px", cursor: "pointer",
                  fontFamily: "inherit", textAlign: "left",
                }}>
                  <span style={{ fontSize: 14 }}>🎓</span>
                  <span style={{ fontSize: 12, fontWeight: 800, color: "var(--ink)", whiteSpace: "nowrap" }}>수습 마일스톤</span>
                  <span style={{ flex: 1, height: 5, background: "var(--paper-warm)", border: "1px solid var(--line)", borderRadius: 4, overflow: "hidden", minWidth: 40 }}>
                    <span style={{ display: "block", width: _pct + "%", height: "100%", background: "var(--orange)" }} />
                  </span>
                  <span style={{ fontSize: 10.5, fontWeight: 800, color: "var(--orange)", whiteSpace: "nowrap" }}>
                    {_dLeft > 0 ? `사원 전환 D-${_dLeft}` : "전환 D-day 🎓"}
                  </span>
                  <span style={{ fontSize: 10, color: "var(--ink-mute)" }}>▼ 펼치기</span>
                </button>
              );
            }
            // 펼친 상태: 풀 카드
            return (
              <div className="s2-welcome" style={{
                background: "var(--cream)", border: "2px solid var(--orange)",
                borderRadius: 10, padding: "16px 16px 14px", position: "relative",
                boxShadow: "3px 3px 0 rgba(216,90,42,0.22)",
              }}>
                <button onClick={toggleS2Card} title="접기" style={{
                  position: "absolute", top: 8, right: 10, background: "transparent",
                  border: "none", fontSize: 11, fontWeight: 700, color: "var(--ink-mute)",
                  cursor: "pointer", fontFamily: "inherit", padding: 4,
                }}>▲ 접기</button>
                <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 10, flexWrap: "wrap" }}>
                  <span style={{
                    fontSize: 10, letterSpacing: "0.16em", fontWeight: 900,
                    color: "var(--orange)", border: "2px solid var(--orange)",
                    padding: "3px 9px", transform: "rotate(-3deg)", whiteSpace: "nowrap",
                  }}>수습 기간</span>
                  <b style={{ fontSize: 14.5, color: "var(--ink)" }}>30일 채우면 사원으로 승진해요 🎓</b>
                </div>
                <div style={{ fontSize: 12, color: "var(--ink-soft)", lineHeight: 1.65, marginBottom: 12 }}>
                  수습 30일을 완주하면 <b style={{ color: "var(--ink)" }}>정직원 전환</b>, 사원(Associate) 발령이에요.
                  네이비 새 사원증과 <b style={{ color: "var(--ink)" }}>📒 나만의 노트 보관함</b>이 보상으로 열려요.
                  단, <b style={{ color: "var(--ink)" }}>그날 학습을 마쳐야 다음 Day가 열려요.</b> 하루 하나씩 채우는 게 규칙이에요.
                </div>
                <div style={{ display: "grid", gridTemplateColumns: "repeat(4, 1fr)", gap: 6, marginBottom: 12 }}>
                  {MILESTONES.map(m => {
                    const passed = _rd >= m.d;
                    return (
                      <div key={m.d} style={{
                        textAlign: "center", borderRadius: 8, padding: "8px 2px 6px",
                        background: passed ? "rgba(216,90,42,0.10)" : "var(--paper-warm)",
                        border: passed ? "1px solid var(--orange)" : "1px dashed var(--line)",
                      }}>
                        <div style={{ fontSize: 15, filter: passed ? "none" : "grayscale(1) opacity(0.6)" }}>{m.icon}</div>
                        <div style={{ fontSize: 9.5, fontWeight: 800, marginTop: 2, color: passed ? "var(--orange)" : "var(--ink-mute)" }}>DAY {m.d}</div>
                        <div style={{ fontSize: 9, color: "var(--ink-mute)" }}>{m.label}</div>
                      </div>
                    );
                  })}
                </div>
                <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                  <div style={{ flex: 1, height: 6, background: "var(--paper-warm)", border: "1px solid var(--line)", borderRadius: 4, overflow: "hidden" }}>
                    <div style={{ width: _pct + "%", height: "100%", background: "var(--orange)", transition: "width 0.4s" }} />
                  </div>
                  <span style={{ fontSize: 10.5, fontWeight: 800, color: "var(--ink-soft)", whiteSpace: "nowrap" }}>
                    {_dLeft > 0 ? `사원 전환까지 D-${_dLeft}` : "오늘 사원 전환! 🎓"}
                  </span>
                </div>
              </div>
            );
          })()}

          {/* ★ 시즌 2/3: 사원 마일스톤 카드 (접기/펼치기). Day 31-60 면담 티저 / Day 61-90 대리 승진 로드맵 */}
          {USER.isFulltime && !USER.isViewingPast && (() => {
            const _rd = USER.realCurrentDay || USER.currentDay;
            // ── 대리 + TF 배정: 과장 승진 트랙 카드로 교체 ──
            const _tfNow = _tfState();
            if (_rd >= 90 && _tfNow.track) {
              const _curId = _tfNow.track.id || _tfNow.track;
              const _doneN = (_tfNow.done || []).length;
              const _tfPct = Math.max(6, Math.round((_doneN / 4) * 100));
              if (s2CardCollapsed) {
                return (
                  <button className="s2-welcome" onClick={toggleS2Card} title="펼치기" style={{
                    display: "flex", alignItems: "center", gap: 10, width: "100%",
                    background: "var(--cream)", border: "1px solid var(--orange)",
                    borderRadius: 8, padding: "10px 14px", cursor: "pointer", fontFamily: "inherit", textAlign: "left",
                  }}>
                    <span style={{ fontSize: 14 }}>🗂</span>
                    <span style={{ fontSize: 12, fontWeight: 800, color: "var(--ink)", whiteSpace: "nowrap" }}>과장 승진 트랙</span>
                    <span style={{ flex: 1, height: 5, background: "var(--paper-warm)", border: "1px solid var(--line)", borderRadius: 4, overflow: "hidden", minWidth: 40 }}>
                      <span style={{ display: "block", width: _tfPct + "%", height: "100%", background: "var(--orange)" }} />
                    </span>
                    <span style={{ fontSize: 10.5, fontWeight: 800, color: "var(--orange)", whiteSpace: "nowrap" }}>TF {_doneN}/4 수료</span>
                    <span style={{ fontSize: 10, color: "var(--ink-mute)" }}>▼ 펼치기</span>
                  </button>
                );
              }
              return (
                <div className="s2-welcome" style={{
                  background: "var(--cream)", border: "2px solid var(--orange)",

// ============================================================
// 글로우 타이쿤 이식 (로컬 전용: __OD_NEXT 플래그, 가격 인상 뒤 공개 예정)
//   출석 반응 · 부재중 리포트 · 오늘의 심부름 · 호봉 · 승진 심사 카드
//   · 공채 1기 뱃지 · 업무 위장 모드
// ============================================================
const _tyUser = () => { try { return JSON.parse(localStorage.getItem("__OD_USER") || "null") || _localUser; } catch (e) { return _localUser; } };
const _tyDone = () => { try { return _odCompletedDaySet(_tyUser()); } catch (e) { return new Set(); } };
const _TY_DAY = 86400000;
const _tySignup0 = () => { try { const sd = _localUser && _localUser.signupDate ? new Date(_localUser.signupDate) : null; if (!sd || isNaN(sd.getTime())) return null; return Date.UTC(sd.getUTCFullYear(), sd.getUTCMonth(), sd.getUTCDate()); } catch (e) { return null; } };
const _tyToday0 = () => { const n = new Date(Date.now() + 9 * 3600000); return Date.UTC(n.getUTCFullYear(), n.getUTCMonth(), n.getUTCDate()); };
const _tyTodayISO = () => new Date(_tyToday0()).toISOString().slice(0, 10);
// 이번 주(월~오늘) 출근 통계. offsetWeeks=1 이면 지난주(월~일).
function _tyWeek(offsetWeeks) {
  const s0 = _tySignup0(); if (s0 === null) return null;
  const t0 = _tyToday0();
  const dowM = (Math.round(t0 / _TY_DAY) + 3) % 7; // 0=월요일
  const mon = t0 - (dowM + (offsetWeeks || 0) * 7) * _TY_DAY;
  const end = offsetWeeks ? mon + 6 * _TY_DAY : t0;
  const done = _tyDone();
  let due = 0, att = 0;
  for (let ts = Math.max(mon, s0); ts <= end; ts += _TY_DAY) {
    const d = Math.round((ts - s0) / _TY_DAY) + 1;
    if (d < 1 || d > 240) continue;
    due++; if (done.has(d)) att++;
  }
  return { due, att, perfect: due > 0 && att === due, monKey: new Date(mon).toISOString().slice(0, 10) };
}
// 성실왕 (개근 주) 통산 기록
function _tyPerfect() { try { return JSON.parse(localStorage.getItem("__OD_PW_" + ((_localUser && _localUser.email) || "")) || "null") || { n: 0, weeks: [] }; } catch (e) { return { n: 0, weeks: [] }; } }
function _tyAwardCheck(toast) {
  try {
    if (!_localUser || !_localUser.email) return;
    const lw = _tyWeek(1);
    if (!lw || lw.due < 5 || !lw.perfect) return;
    const st = _tyPerfect();
    if (st.weeks.indexOf(lw.monKey) >= 0) return;
    st.n += 1; st.weeks.push(lw.monKey);
    localStorage.setItem("__OD_PW_" + _localUser.email, JSON.stringify(st));
    if (toast) setTimeout(() => toast("🏅 지난주 개근! 성실왕 배지 획득 (통산 " + st.n + "회)", 4500), 1200);
  } catch (e) {}
}
// 호봉: 현 직급 구간에서 완주 5일마다 1호봉 (최대 6호봉)
function _tyHobong() {
  try {
    const rank = (window.__SIM && window.__SIM.USER) ? window.__SIM.USER.rankId : "probation";
    const st = rank === "senior" ? 61 : (rank === "fulltime" ? 31 : 1);
    const en = rank === "senior" ? 90 : (rank === "fulltime" ? 60 : 30);
    const cnt = [..._tyDone()].filter(d => d >= st && d <= en).length;
    return Math.min(6, Math.floor(cnt / 5) + 1);
  } catch (e) { return 1; }
}
// 공채 1기: 가격 인상 전 가입자 (인상일 확정 시 날짜만 조정)
const _TY_FOUNDING_CUTOFF = "2026-10-01";
function _tyFounding() { try { const sd = (_localUser && _localUser.signupDate) || ""; return !!sd && String(sd).slice(0, 10) < _TY_FOUNDING_CUTOFF; } catch (e) { return false; } }
// 업무 위장 모드: 탭 제목·파비콘을 스프레드시트처럼
function _tyStealthOn() { try { return localStorage.getItem("__OD_STEALTH") === "1"; } catch (e) { return false; } }
function _tyApplyStealth(on) {
  try {
    let link = document.querySelector('link[rel="icon"]');
    if (on) {
      if (!window.__TY_REAL) window.__TY_REAL = { t: document.title, f: link ? link.href : "" };
      if (!link) { link = document.createElement("link"); link.rel = "icon"; document.head.appendChild(link); }
      document.title = "주간 보고_v3.xlsx - 스프레드시트";
      link.href = "data:image/svg+xml," + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16"><rect width="16" height="16" rx="3" fill="#217346"/><text x="8" y="12" font-size="10" fill="#fff" text-anchor="middle" font-family="Arial" font-weight="bold">X</text></svg>');
    } else if (window.__TY_REAL) {
      document.title = window.__TY_REAL.t;
      if (link) { if (window.__TY_REAL.f) link.href = window.__TY_REAL.f; else link.remove(); }
    }
  } catch (e) {}
}
if (_isNextFeature() && _tyStealthOn()) _tyApplyStealth(true);

// 부재중 리포트: 3일 이상 만에 돌아오면 벌 대신 정산 카드
function AwayReport({ user }) {
  const [gap, setGap] = React.useState(0);
  React.useEffect(() => {
    try {
      if (!user.email) return;
      const q = new URLSearchParams(location.search).get("away");
      const K = "__OD_LAST_SEEN_" + user.email;
      const today = _tyTodayISO();
      const prev = localStorage.getItem(K);
      localStorage.setItem(K, today);
      if (q) { setGap(Math.max(1, Number(q) || 0)); return; }
      if (!prev || prev === today) return;
      const g = Math.round((new Date(today).getTime() - new Date(prev).getTime()) / _TY_DAY);
      const DK = "__OD_AWAY_SEEN_" + today + "_" + user.email;
      if (g >= 3 && !localStorage.getItem(DK)) { localStorage.setItem(DK, "1"); setGap(g); }
    } catch (e) {}
  }, [user.email]);
  if (!gap || user.isViewingPast) return null;
  const memos = [
    "천천히 와도 괜찮아요. 자리는 그대로예요.",
    "복습부터 하실 필요 없어요. 오늘 몫 하나면 충분해요.",
    "다들 그렇게 쉬었다 와요. 돌아온 게 실력이에요.",
    "밀린 건 도망 안 가요. 오늘 하루만 저랑 해요.",
    "커피 한 잔 내려놨어요. 가볍게 시작해요.",
  ];
  const memo = memos[gap % memos.length];
  return (
    <div className="ty-away">
      <div className="ty-away-head">📬 부재중 리포트 <span>{gap}일 만의 출근</span></div>
      <div className="ty-away-body">
        자리 비우신 동안 회사는 잘 돌아갔어요. 책상 위에 유버디가 남긴 메모가 한 장 있네요.
        <div className="ty-away-memo">"{memo}"</div>
        그동안 쌓인 Day는 사라지지 않고 기다리고 있어요. 오늘 몫부터 하나씩, 원하시면 몰아서도 OK.
      </div>
      <button className="ty-away-x" onClick={() => setGap(0)}>확인했어요 ✓</button>
    </div>
  );
}

// 오늘의 심부름: 날짜+계정 시드로 매일 2개 고정. 안 해도 불이익 없음 (도장 맛 전용).
const _TY_ERRANDS = [
  { id: "library", icon: "📓", t: "업무 노트 1개 다시 읽기", nav: "library" },
  { id: "mypage", icon: "🪪", t: "사원증 한번 확인하기", nav: "mypage" },
  { id: "inbox", icon: "✉️", t: "사내 메모함 열어보기", nav: "inbox" },
  { id: "attend", icon: "📅", t: "출근부 구경하기", nav: null },
  { id: "recall", icon: "💭", t: "어제 표현 하나 소리 내서 말해보기", nav: null },
];
function ErrandsCard({ setActive, toast }) {
  const email = ((window.__SIM && window.__SIM.USER) ? window.__SIM.USER.email : "") || "";
  const today = _tyTodayISO();
  const K = "__OD_ERRAND_" + today + "_" + email;
  const seed = [...(today + email)].reduce((a, c) => ((a * 31 + c.charCodeAt(0)) >>> 0), 7);
  const picked = React.useMemo(() => {
    // ★ 2026-09-04 핫픽스: seed 가 2^31 이상이면 `seed >> 3` 이 음수가 돼 인덱스가 음수 → undefined 심부름 → 홈 전체가 하얀 화면.
    //   부호 없는 시프트(>>>)로 바꾸고, 혹시 모를 undefined 는 걸러낸다.
    const n = _TY_ERRANDS.length;
    const i1 = seed % n;
    const i2 = (i1 + 1 + ((seed >>> 3) % Math.max(1, n - 1))) % n;
    return [_TY_ERRANDS[i1], _TY_ERRANDS[i2]].filter(Boolean);
  }, [seed]);
  const [done, setDone] = React.useState(() => { try { return JSON.parse(localStorage.getItem(K) || "{}"); } catch (e) { return {}; } });
  const go = (er) => {
    if (er.nav) setActive(er.nav);
    else if (er.id === "attend") { try { document.querySelector(".attendance").scrollIntoView({ behavior: "smooth", block: "center" }); } catch (e) {} }
  };
  const stamp = (er) => {
    if (done[er.id]) { go(er); return; }
    const next = { ...done, [er.id]: true };
    setDone(next);
    try { localStorage.setItem(K, JSON.stringify(next)); } catch (e) {}
    go(er);
    const left = picked.filter(x => !next[x.id]).length;
    if (toast) toast(left === 0 ? "🎖️ 오늘 심부름 완료! 가벼운 것도 챙기는 게 프로예요" : "✅ 심부름 하나 완료!", 2600);
  };
  return (
    <div className="ty-errand">
      <div className="ty-errand-head">🧺 오늘의 심부름 <small>보너스 · 안 해도 불이익 없어요, 도장 맛으로만</small></div>
      {picked.map(er => (
        <div key={er.id} className={"ty-errand-row" + (done[er.id] ? " done" : "")} onClick={() => stamp(er)}>
          <span>{er.icon}</span>
          <span className="ty-errand-t">{er.t}</span>
          <span className="ty-errand-stamp">{done[er.id] ? "✓ 도장" : "하러 가기"}</span>
        </div>
      ))}
    </div>
  );
}

// 밀린 Day 이어하기
//   학습 게이트는 "달력 경과일"까지는 이어서 할 수 있게 열어준다.
//   다만 게이트 값이 페이지 로드 때 한 번만 계산돼서, 한 Day를 끝내도
//   새로고침 전에는 다음 Day가 안 열려 보였다. 완료 직후 다시 계산해 알려준다.
// ============================================================
function CatchUpBanner({ user }) {
  const [next, setNext] = React.useState(0);
  const cur = user.realCurrentDay || user.currentDay || 1;

  const check = React.useCallback(() => {
    try {
      const fresh = window.__odGateNow ? window.__odGateNow() : 0;
      setNext(fresh > cur ? fresh : 0);
    } catch (e) { setNext(0); }
  }, [cur]);

  React.useEffect(() => {
    const onDone = () => setTimeout(check, 400);
    window.addEventListener("od-day-complete", onDone);
    window.addEventListener("od-day-finale", onDone);
    check();
    return () => {
      window.removeEventListener("od-day-complete", onDone);
      window.removeEventListener("od-day-finale", onDone);
    };
  }, [check]);

  if (!next || user.isViewingPast) return null;
  const _cal = Number(window.__odAutoDay) || next;
  const backlog = Math.max(0, _cal - next + 1);
  return (
    <div className="catchup">
      <div className="catchup-txt">
        오늘 몫을 다 끝내셨어요. 이어서 <b>Day {next}</b>도 지금 하실 수 있어요.
        {backlog > 1 ? <> 아직 안 푼 분량이 <b>{backlog}일</b> 남아 있어요.</> : null}
      </div>
      <button className="catchup-btn" onClick={() => { try { window.scrollTo(0, 0); } catch (e) {} location.reload(); }}>
        Day {next} 이어서 하기 →
      </button>
    </div>
  );
}

// ============================================================
// 역량 스탯 그리드
//   "며칠 빠짐없이 했나"가 아니라 "무엇을 얼마나 모았나"를 보여준다.
//   Day 1~90 = 5개 역량 영역 / Day 91+ = TF 트랙 4종
//   채움 조건은 오직 학습 완료 (전사 헌법 4조).
// ============================================================
function SkillGrid({ user, onGoDay }) {
  const rd = user.realCurrentDay || user.currentDay || 1;
  const tf = React.useMemo(() => { try { return _tfState(); } catch (e) { return { track: null, done: [] }; } }, [rd]);
  const doneSet = React.useMemo(() => _odCompletedDaySet(_localUser), [rd, user.streak]);
  const isTf = rd > 90;

  // 저장한 표현 수 (나만의 노트)
  const savedCount = React.useMemo(() => {
    try {
      return Object.values(_localUser?.savedNotes || {}).reduce((n, arr) => n + (Array.isArray(arr) ? arr.length : 0), 0);
    } catch (e) { return 0; }
  }, [rd]);

  // ── 영역별 집계 ──
  const rows = React.useMemo(() => {
    if (isTf) {
      const doneIds = (tf && tf.done) || [];
      const curId = tf && tf.track ? (tf.track.id || tf.track) : null;
      return TF_TRACKS.map(t => {
        const finished = doneIds.indexOf(t.id) >= 0;
        const current = !finished && curId === t.id;
        return {
          key: t.id, emoji: t.emoji, name: t.name, desc: t.tagline,
          got: finished ? 30 : (current ? Math.max(0, Math.min(30, rd - (91 + 30 * doneIds.length) + 1)) : 0),
          total: 30,
          state: finished ? "done" : (current ? "doing" : "locked"),
          hint: finished ? "수료" : (current ? "진행 중" : "아직 안 맡은 TF"),
        };
      });
    }
    const cap = Math.min(90, user.totalDays > 90 ? 90 : user.totalDays);
    return AREA_META.map(a => {
      let total = 0, got = 0, firstDay = null, nextDay = null;
      for (let d = 1; d <= 90; d++) {
        if (_areaOf(d) !== a.id) continue;
        total++;
        if (firstDay === null) firstDay = d;
        if (doneSet.has(d)) got++;
        else if (nextDay === null && d <= rd) nextDay = d;
      }
      const state = got >= total ? "done" : (got > 0 ? "doing" : (firstDay > rd ? "locked" : "open"));
      return {
        key: a.id, emoji: a.emoji, name: a.name, desc: a.desc, got, total, state,
        nextDay,
        hint: state === "done" ? "전부 수집"
          : state === "locked" ? ("Day " + firstDay + "부터 열려요")
          : state === "open" ? "아직 시작 전"
          : "진행 중",
      };
    });
  }, [rd, isTf, doneSet, tf && tf.track, tf && tf.done && tf.done.length]);

  const gotAll = rows.reduce((n, r) => n + r.got, 0);
  const totalAll = rows.reduce((n, r) => n + r.total, 0);
  const clearedAreas = rows.filter(r => r.state === "done").length;

  // ── 다음 예고 (스포일러 없이 영역만) ──
  const nextDayNum = Math.min(isTf ? 240 : 90, rd + 1);
  const nextArea = !isTf && nextDayNum <= 90 ? AREA_META.find(a => a.id === _areaOf(nextDayNum)) : null;

  return (
    <div className="skillgrid">
      <div className="skillgrid-head">
        <span className="skillgrid-title">{isTf ? "내 TF 이력" : "내 역량 스탯"}</span>
        <span className="skillgrid-num">{gotAll}<small> / {totalAll} 수집</small></span>
      </div>

      <div className="skillgrid-lead">
        {isTf
          ? <>지금까지 <b>{clearedAreas}개 TF</b>를 수료했어요. 4개를 다 마치면 과장 승진 심사가 열려요.</>
          : gotAll === 0
            ? <>오늘 학습을 마치면 첫 표현이 여기 쌓여요.</>
            : <>표현 <b>{gotAll}개</b>를 모았어요{savedCount > 0 ? <>, 그중 <b>{savedCount}개</b>는 노트에 따로 담아뒀고요</> : null}. 5개 영역 중 <b>{rows.filter(r => r.got > 0).length}개</b>를 열었어요.</>}
      </div>

      <div className="skillgrid-cells">
        {rows.map(r => (
          <div key={r.key} className={"skill-cell " + r.state}>
            <div className="skill-cell-top">
              <span className="skill-emoji">{r.emoji}</span>
              <span className="skill-name">{r.name}</span>
            </div>
            <div className="skill-count">
              <b>{r.got}</b><span>/{r.total}</span>
              <em>{r.hint}</em>
            </div>
            <div className="skill-bar"><i style={{ width: Math.round((r.got / r.total) * 100) + "%" }} /></div>
            <div className="skill-desc">{r.desc}</div>
          </div>
        ))}

        <div className="skill-cell meta locked">
          <div className="skill-cell-top">
            <span className="skill-emoji">🔒</span>
            <span className="skill-name">{isTf ? "과장 승진 종합 리포트" : "수습·사원 성장 리포트"}</span>
          </div>
          <div className="skill-count"><em>{isTf ? "TF 4개 전부 수료하면 해제" : "5개 영역을 다 열면 해제"}</em></div>
          <div className="skill-desc">{isTf
            ? "4개 TF에서 쓴 표현과 문장을 한 번에 정리해줘요."
            : "내가 모은 표현이 실제로 살아남았는지 정리해서 보여줘요."}</div>
        </div>
      </div>

      {nextArea && (
        <button
          type="button"
          className="skill-next"
          onClick={() => { if (onGoDay && nextDayNum <= rd) onGoDay(nextDayNum); }}
          style={{ cursor: onGoDay && nextDayNum <= rd ? "pointer" : "default" }}
        >
          <span className="skill-next-lock">🔒</span>
          <span>내일 · <b>{nextArea.emoji} {nextArea.name}</b> 표현이 하나 더 도착해요</span>
        </button>
      )}
    </div>
  );
}

// ============================================================
// 어휘 하이라이트: 표기 변형까지 매칭
//   follow up <-> follow-up, stepped up, raised the bar (동사 변형),
//   loop ... in / hash it out (분리형 구동사, 사이 단어 3개까지),
//   pull one's weight -> pulling her weight (대명사 치환)
// ============================================================
function _wordHlRegex(word) {
  if (!word) return null;
  const PLACEHOLDER = { "one's": 1, "someone": 1, "someone's": 1, "something": 1, "somebody": 1 };
  const toks = String(word).trim().split(/\s+/).map(t => {
    const low = t.toLowerCase();
    if (PLACEHOLDER[low]) return "[\\w']+";
    if (low === "go") return "(?:go|goes|going|went|gone)";
    const esc = low.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    if (/e$/.test(low)) return esc.slice(0, -1) + "(?:e|es|ed|ing)";
    return esc + "(?:" + low.slice(-1) + ")?(?:s|es|d|ed|ing)?";
  });
  try { return new RegExp("(\\b" + toks.join("[\\s-]+(?:[\\w']+[\\s-]+){0,3}?") + "\\b)", "gi"); }
  catch (e) { return null; }
}
function _hlQuote(quote, word) {
  const re = _wordHlRegex(word);
  if (!re || !quote) return quote;
  const parts = String(quote).split(re);
  if (parts.length < 2) return quote;
  return parts.map((part, i) => (i % 2 === 1)
    ? <span key={i} className="scene-target-word">{part}</span>
    : <React.Fragment key={i}>{part}</React.Fragment>);
}

// ── 사수 메모 = 뉘앙스, 유버디 한 마디 = 외우는 팁 (2026-09-04, 두 메모 내용이 겹친다는 피드백) ──
// 사수: buddyAnswers.nuance 첫 문단(짧은 뉘앙스 한 줄). 없으면 mentorTip.
// 버디: buddyAnswers.default(외우는 팁) 앞 두 문단. 없으면 day별 nudge.
function _firstParas(t, n) { return String(t || "").split(/\n\s*\n/).map(x => x.trim()).filter(Boolean).slice(0, n).join("\n"); }
function _mentorNuanceLine(scn) {
  // 손으로 쓴 뉘앙스 한 줄이 있으면 최우선 (어원·이미지가 외우는 팁과 겹치는 날들)
  if (scn?.mentorNuance) return scn.mentorNuance;
  let nu = _firstParas(scn?.buddyAnswers?.nuance, 1);
  if (nu && scn?.word) {
    // "오늘 단어 X 야." 뒤에 붙으니 "X = ..." / "X는 ..." 로 시작하면 앞머리 단어는 뗀다
    const esc = String(scn.word).replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    nu = nu.replace(new RegExp("^" + esc + "\\s*(=|는|은|이|가|이란|란|,)\\s*", "i"), "");
  }
  // 뉘앙스 첫 문단이 어원 설명("~에서 온 말", "A + B(...)")이거나 너무 짧은 정의뿐이면
  // 외우는 팁(유버디)과 겹치니 사수 원래 메모(mentorTip, 쓰임새 조언)로 대체 (Day 38·50·51·68 등)
  const looksEtymology = /에서 온 말|어원|유래|\+\s*[a-zA-Z]+\s*\(/.test(nu);
  if (nu && (looksEtymology || nu.length < 28) && scn?.mentorTip) return scn.mentorTip;
  return nu || scn?.mentorTip || "";
}
function _buddyTipText(scn) {
  return _firstParas(scn?.buddyAnswers?.default, 2);
}

    setTick(x => x + 1);
  };

  // ★ 인쇄 / PDF 저장: 깨끗한 새 창을 열어 노트만 출력 (한글 폰트 안전)
  const printNotes = (notes) => {
    const KIND = { nuance: "뉘앙스", example: "예문", default: "외우는 팁" };
    const esc = (s) => String(s || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    const rows = notes.map(n => `
      <div class="note">
        <div class="head"><span class="word">${esc(n.word)}</span> <span class="mean">${esc(n.meaning)}</span> <span class="tag">${KIND[n.kind] || esc(n.label)} · DAY ${n.day}</span></div>
        <div class="body">${esc(n.text).replace(/\n/g, "<br/>")}</div>
      </div>`).join("");
    const w = window.open("", "_blank");
    if (!w) { alert("팝업이 차단됐어요. 팝업을 허용하면 PDF로 저장할 수 있어요."); return; }
    w.document.write(`<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>나만의 노트 · ${esc(USER.name)}</title>
      <style>
        body { font-family: -apple-system, 'Noto Sans KR', sans-serif; color: #2A1F14; padding: 32px; line-height: 1.6; }
        h1 { font-size: 20px; margin: 0 0 4px; }
        .sub { color: #8A7A66; font-size: 12px; margin-bottom: 20px; }
        .note { border: 1px solid #E2D8C4; border-left: 3px solid #D85A2A; border-radius: 8px; padding: 12px 14px; margin-bottom: 10px; page-break-inside: avoid; }
        .head { font-size: 13px; margin-bottom: 6px; }
        .word { font-weight: 800; font-size: 15px; }
        .mean { color: #8A7A66; }
        .tag { float: right; font-size: 10px; color: #D85A2A; font-weight: 700; }
        .body { font-size: 12.5px; color: #4A3C2E; white-space: pre-wrap; }
        @media print { body { padding: 0; } }
      </style></head><body>
      <h1>📒 ${esc(USER.name)}님의 나만의 노트</h1>
      <div class="sub">1일1비 · 저장한 표현 ${notes.length}개 · ${new Date().toLocaleDateString("ko-KR")}</div>
      ${rows}
      <script>window.onload = function(){ setTimeout(function(){ window.print(); }, 300); };<\/script>
      </body></html>`);
    w.document.close();
  };

  // 정직원 잠금 화면 (수습은 미리보기 + 동기부여)
  if (!USER.isFulltime) {
    return (
      <div>
        <div className="desk-header">
          <div>
            <div className="desk-eyebrow">RECORDS · 나만의 노트 (잠김)</div>
            <h1 className="desk-title"><em>사원</em> 전용 보관함</h1>
          </div>
        </div>
        <div style={{
          marginTop: 24, padding: "40px 28px", textAlign: "center",
          background: "var(--cream)", border: "1.5px dashed var(--line)", borderRadius: 12,
        }}>
          <div style={{ fontSize: 42, marginBottom: 14, filter: "grayscale(0.3)" }}>🔒</div>
          <h2 style={{ fontSize: 19, fontWeight: 900, color: "var(--ink)", marginBottom: 12, lineHeight: 1.4 }}>
            저장한 노트를 한곳에 모아보는 기능,<br/>사원으로 승급하면 열려요
          </h2>
          <p style={{ fontSize: 13.5, color: "var(--ink-soft)", lineHeight: 1.75, marginBottom: 18, maxWidth: 420, margin: "0 auto 18px" }}>
            유버디한테 물어보고 "📒 노트에 저장" 한 답변들을, 단어별로 묶어 검색하고 복습할 수 있는 나만의 보관함이에요.
            수습 30일을 완주하고 정직원 전환(사원)하면 보상으로 열립니다.
          </p>
          <div style={{
            display: "inline-block", background: "var(--paper-warm)", border: "1px solid var(--line)",
            borderRadius: 8, padding: "10px 16px", fontSize: 12.5, color: "var(--ink-soft)",
          }}>
            지금까지 저장한 노트는 <b style={{ color: "var(--ink)" }}>안전하게 보관 중</b>이에요. 승급하면 전부 여기 모여요.
          </div>
        </div>
      </div>
    );
  }

  // 전체 노트 평탄화 (tick 바뀌면 재계산)
  let allNotes = [];
  void tick;
  try {
    const u = JSON.parse(localStorage.getItem("__OD_USER") || "null");
    const byDay = (u && u.savedNotes) || {};
    Object.keys(byDay).forEach(dayKey => {
      const sc = SCENARIOS.find(s => s.day === Number(dayKey));
      (byDay[dayKey] || []).forEach(n => {
        allNotes.push({
          day: Number(dayKey),
          word: sc ? sc.word : "",
          meaning: sc ? sc.meaning : "",
          npc: sc ? sc.npc : null,
          kind: n.kind || "default",
          label: n.label || "메모",
          text: n.text || "",
          savedAt: n.savedAt || null,
        });
      });
    });
  } catch (e) {}
  allNotes.sort((a, b) => b.day - a.day);

  const KIND_LABEL = { nuance: "뉘앙스", example: "예문", default: "외우는 팁" };
  const kinds = [...new Set(allNotes.map(n => n.kind))];
  const filtered = allNotes.filter(n => {
    if (kindFilter !== "all" && n.kind !== kindFilter) return false;
    if (search) {
      const q = search.toLowerCase();
      if (!n.text.toLowerCase().includes(q) && !n.word.toLowerCase().includes(q) && !(n.meaning || "").includes(search)) return false;
    }
    return true;
  });

  return (
    <div>
      <div className="desk-header">
        <div>
          <div className="desk-eyebrow">RECORDS · 나만의 노트 (My Notes)</div>
          <h1 className="desk-title"><em>내가 저장한</em> 표현 모음</h1>
        </div>
        <div className="desk-meta"><b>{allNotes.length}</b>개 저장 · {new Set(allNotes.map(n => n.day)).size}개 단어</div>
      </div>

      <ApprovalLine doc="YB-MYNOTE-2026" applicant={USER.name} status={`${allNotes.length}개 보관`} />

      {allNotes.length > 0 && (
        <div style={{ display: "flex", justifyContent: "flex-end", marginBottom: 4 }}>
          <button onClick={() => printNotes(filtered)}
            style={{ background: "transparent", border: "1px solid var(--line)", borderRadius: 6, padding: "6px 14px", fontSize: 12, fontWeight: 700, cursor: "pointer", fontFamily: "inherit", color: "var(--ink-soft)" }}>
            🖨 인쇄 / PDF 저장 ({filtered.length}개)
          </button>
        </div>
      )}

      {allNotes.length === 0 ? (
        <div style={{ marginTop: 24, padding: "36px 24px", textAlign: "center", background: "var(--cream)", border: "1.5px dashed var(--line)", borderRadius: 12 }}>
          <div style={{ fontSize: 36, marginBottom: 12 }}>📭</div>
          <p style={{ fontSize: 14, color: "var(--ink-soft)", lineHeight: 1.7 }}>
            아직 저장한 노트가 없어요.<br/>
            시추에이션에서 유버디한테 물어보고 <b style={{ color: "var(--ink)" }}>"📒 노트에 저장"</b>을 누르면 여기 모여요.
          </p>
        </div>
      ) : (
        <>
          <div className="filter-row">
            <button className={"filter-chip " + (kindFilter === "all" ? "active" : "")} onClick={() => setKindFilter("all")}>전체 {allNotes.length}</button>
            {kinds.map(k => (
              <button key={k} className={"filter-chip " + (kindFilter === k ? "active" : "")} onClick={() => setKindFilter(k)}>
                {KIND_LABEL[k] || k} {allNotes.filter(n => n.kind === k).length}
              </button>
            ))}
            <input className="filter-search" placeholder="노트 / 단어 검색…" value={search} onChange={e => setSearch(e.target.value)} />
          </div>

          <div style={{ marginTop: 16, display: "grid", gap: 12 }}>
            {filtered.map((n, i) => (
              <div key={i} style={{
                background: "var(--paper)", border: "1px solid var(--line)",
                borderRadius: 10, padding: "14px 16px",
                borderLeft: "3px solid var(--accent)",
              }}>
                <div style={{ display: "flex", alignItems: "baseline", gap: 8, marginBottom: 8, flexWrap: "wrap" }}>
                  <button
                    onClick={() => { const sc = SCENARIOS.find(s => s.day === n.day); if (sc && openScene) openScene(sc); }}
                    style={{ background: "transparent", border: "none", padding: 0, cursor: "pointer", fontFamily: "inherit" }}
                    title="이 단어 시추에이션 다시 보기"
                  >
                    <b style={{ fontSize: 15, color: "var(--ink)" }}>{n.word}</b>
                  </button>
                  <span style={{ fontSize: 11.5, color: "var(--ink-mute)" }}>{n.meaning}</span>
                  <span style={{ marginLeft: "auto", fontSize: 10, fontWeight: 800, letterSpacing: "0.08em", color: "var(--accent)", background: "rgba(216,90,42,0.08)", padding: "2px 8px", borderRadius: 10 }}>
                    {KIND_LABEL[n.kind] || n.label} · DAY {n.day}
                  </span>
                </div>
                {editKey === (n.day + ":" + n.text) ? (
                  <div>
                    <textarea value={editText} onChange={e => setEditText(e.target.value)}
                      style={{ width: "100%", minHeight: 90, padding: "10px 12px", border: "1px solid var(--orange)", borderRadius: 8, fontSize: 12.5, lineHeight: 1.6, fontFamily: "inherit", color: "var(--ink)", background: "var(--paper)", resize: "vertical", boxSizing: "border-box" }} />
                    <div style={{ display: "flex", gap: 8, justifyContent: "flex-end", marginTop: 8 }}>
                      <button onClick={() => setEditKey(null)} style={{ background: "transparent", border: "1px solid var(--line)", borderRadius: 6, padding: "5px 12px", fontSize: 12, cursor: "pointer", fontFamily: "inherit", color: "var(--ink-soft)" }}>취소</button>
                      <button onClick={() => updateNote(n.day, n.text, editText)} disabled={!editText.trim()} style={{ background: "var(--orange)", border: "none", borderRadius: 6, padding: "5px 14px", fontSize: 12, fontWeight: 700, cursor: "pointer", fontFamily: "inherit", color: "#fff", opacity: editText.trim() ? 1 : 0.5 }}>저장</button>
                    </div>

                  <div style={{ position: "relative" }}>

                      style={{ marginTop: 6, background: "transparent", border: "none", padding: 0, fontSize: 11, color: "var(--ink-mute)", cursor: "pointer", fontFamily: "inherit", fontWeight: 600 }}>

            {filtered.length === 0 && (
              <div style={{ textAlign: "center", padding: 24, color: "var(--ink-mute)", fontSize: 13 }}>검색 결과가 없어요.</div>

      )}

      {/* ── ✍️ 내 시추에이션 일지 아카이브: "어떤 상황에 쓸까?"에 적은 예문 전체 다시보기 (피드백 반영) ── */}
      {(() => {
        const journals = Object.entries(USER.dailyJournals || {})
          .map(([k, j]) => ({ day: Number(k), text: (j && (j.text || j.reflection || j.note)) || (typeof j === "string" ? j : ""), savedAt: j && j.savedAt }))
          .filter(j => j.day && j.text)
          .sort((a, b) => b.day - a.day);

              <span style={{ fontSize: 11.5, color: "var(--ink-mute)" }}>"어떤 상황에 쓸까?"에 남긴 기록 {journals.length}일치, 전체 보기</span>
            </div>
            <div style={{ display: "grid", gap: 8 }}>
              {journals.map(j => {
                const sc = SCENARIOS.find(s => s.day === j.day);

                  <div key={j.day} style={{ background: "var(--paper)", border: "1px solid var(--line)", borderLeft: "3px solid var(--green, #4A7C59)", borderRadius: 8, padding: "10px 14px" }}>
                    <div style={{ fontSize: 11.5, marginBottom: 4 }}>
                      <b style={{ color: "var(--orange)" }}>DAY {j.day}</b>
                      {sc && <span style={{ fontWeight: 800, color: "var(--ink)", marginLeft: 6 }}>{sc.word}</span>}
                      {sc && <span style={{ color: "var(--ink-mute)", marginLeft: 6 }}>{sc.meaning}</span>}
                    </div>
                    <div style={{ fontSize: 12.5, color: "var(--ink-soft)", lineHeight: 1.7, whiteSpace: "pre-wrap" }}>{j.text}</div>
                  </div>
                );
              })}
            </div>
          </div>
        );
      })()}
    </div>
  );
}

function LibraryPage({ openScene }) {
  const { SCENARIOS, CHARACTERS, USER } = window.__SIM;
  const [filter, setFilter] = useState("all");
  const [search, setSearch] = useState("");
  const [npcFilter, setNpcFilter] = useState("all");

  const accessible = SCENARIOS.filter(s => s.day <= USER.wordsCollected);
  const filtered = accessible.filter(s => {
    if (filter === "studied" && s.status !== "studied") return false;
    if (filter === "today" && s.status !== "today") return false;
    if (npcFilter !== "all" && s.npc !== npcFilter) return false;
    if (search && !s.word.toLowerCase().includes(search.toLowerCase()) && !(s.meaning || "").includes(search)) return false;
    return true;
  });
  const locked = SCENARIOS.filter(s => s.day > USER.wordsCollected);

  return (
    <div>
      <div className="desk-header">
        <div>
          <div className="desk-eyebrow">RECORDS · 업무 노트 (Vocabulary Notebook)</div>
          <h1 className="desk-title"><em>지금까지</em> 만난 비즈니스 단어</h1>
        </div>
        <div className="desk-meta"><b>{accessible.length}</b>개 수집 · 30개 중 {30 - USER.wordsCollected}개 남음</div>
      </div>

      <ApprovalLine doc="YB-NOTE-2026" applicant={USER.name} status={`${accessible.length} / ${USER.totalDays} 수집`} />

      <div className="filter-row">
        <button className={"filter-chip " + (filter === "all" ? "active" : "")} onClick={() => setFilter("all")}>전체 {accessible.length}</button>
        <button className={"filter-chip " + (filter === "studied" ? "active" : "")} onClick={() => setFilter("studied")}>학습완료</button>
        <button className={"filter-chip " + (filter === "today" ? "active" : "")} onClick={() => setFilter("today")}>오늘</button>
        <input className="filter-search" placeholder="단어 / 뜻 검색…" value={search} onChange={e => setSearch(e.target.value)} />
      </div>
      <div className="filter-row" style={{ marginTop: -8 }}>
        <span style={{ fontSize: 10.5, color: "var(--ink-mute)", letterSpacing: "0.16em", fontWeight: 800 }}>NPC ·</span>
        <button className={"filter-chip " + (npcFilter === "all" ? "active" : "")} onClick={() => setNpcFilter("all")}>전체</button>
        {Object.values(CHARACTERS).filter(c => c.id !== "hr").map(c => (
          <button key={c.id} className={"filter-chip " + (npcFilter === c.id ? "active" : "")} onClick={() => setNpcFilter(c.id)} style={npcFilter === c.id ? { background: c.color, borderColor: c.color, color: "#fff" } : {}}>
            {c.name}
          </button>
        ))}
      </div>

      {/* 저장된 노트 + 내 시추에이션 로드 (전체 사용자 한 번에) */}
      {(() => {
        try {
          const u = JSON.parse(localStorage.getItem("__OD_USER") || "null");
          window.__savedNotesByDay = (u && u.savedNotes) || {};
          window.__dailyJournalsByDay = (u && u.dailyJournals) || {};
        } catch(e) {
          window.__savedNotesByDay = {};
          window.__dailyJournalsByDay = {};
        }
        return null;
      })()}

      <div className="word-rolodex">
        {filtered.map(s => {
          const c = CHARACTERS[s.npc];
          const myAnswer = _loadCompletion(s.day);  // 본인이 쓴 문장 (있으면)
          const myPreview = myAnswer?.sentence
            ? (myAnswer.sentence.length > 70 ? myAnswer.sentence.slice(0, 70) + "…" : myAnswer.sentence)
            : null;
          const savedNotes = (window.__savedNotesByDay && window.__savedNotesByDay[String(s.day)]) || [];
          const myJournal = (window.__dailyJournalsByDay && window.__dailyJournalsByDay[String(s.day)]) || null;
          return (
            <button key={s.day} className={"biz-card " + (s.status === "today" ? "today" : "")} onClick={() => openScene(s)}>
              <div className="biz-card-head">
                <span className="biz-card-day">DAY {String(s.day).padStart(2, "0")}</span>
                <span>{myAnswer ? "✏️ 작성 완료" : s.status === "today" ? "● 오늘" : "✓ 완료"}</span>
              </div>
              <div className="biz-card-word">{s.word}</div>
              <div style={{ fontSize: 10.5, color: "var(--ink-mute)", fontWeight: 600 }}>{s.pos} · {s.phonetic}</div>
              <div className="biz-card-meaning">{s.meaning}</div>
              {myPreview && (
                <div style={{
                  marginTop: 8,
                  padding: "8px 10px",
                  background: "var(--paper-warm)",
                  borderLeft: "2px solid var(--accent)",
                  borderRadius: 3,
                  fontSize: 11.5,
                  color: "var(--ink)",
                  lineHeight: 1.45,
                  fontStyle: "italic",
                  fontWeight: 500,
                  textAlign: "left",
                }}>
                  ✏️ "{myPreview}"
                </div>
              )}
              {savedNotes.length > 0 && (
                <div style={{
                  marginTop: 6,
                  padding: "6px 10px",
                  background: "rgba(255,233,166,0.4)",
                  borderLeft: "2px solid #C28A1C",
                  borderRadius: 3,
                  fontSize: 11,
                  color: "var(--ink-soft)",
                  fontWeight: 600,
                  textAlign: "left",
                }}>
                  📒 저장된 노트 {savedNotes.length}개
                  <span style={{ marginLeft: 6, color: "var(--ink-mute)", fontWeight: 500 }}>
                    ({savedNotes.map(n => n.label).join(", ")})
                  </span>
                </div>
              )}
              {myJournal && myJournal.text && (
                <div style={{
                  marginTop: 6,
                  padding: "8px 10px",
                  background: "rgba(216,90,42,0.06)",
                  borderLeft: "2px solid var(--accent)",
                  borderRadius: 3,
                  fontSize: 11.5,
                  color: "var(--ink-soft)",
                  fontWeight: 500,
                  textAlign: "left",
                  lineHeight: 1.5,
                }}>
                  📝 <b style={{ color: "var(--ink)" }}>내 시추에이션:</b> "{myJournal.text.length > 80 ? myJournal.text.slice(0, 80) + "…" : myJournal.text}"
                </div>
              )}
              <div className="biz-card-foot">
                <span className="biz-card-npc">
                  <span className="biz-card-npc-dot" style={{ background: c.color }}></span>
                  {c.name}
                </span>
                <span>{(s.tags || []).map(t => "#" + t).join(" ")}</span>
              </div>
            </button>
          );
        })}
        {locked.slice(0, 4).map(s => {
          // 잠긴 단어는 길이만 흉내내고 글자는 마스킹 (CSS blur 풀어도 못 봄)
          const masked = "▒".repeat(Math.max(5, Math.min(12, (s.word || "").length)));
          return (
            <div key={s.day} className="biz-card locked">
              <div className="biz-card-head"><span className="biz-card-day">DAY {String(s.day).padStart(2, "0")}</span><span>🔒 잠금</span></div>
              <div className="biz-card-word" aria-label="잠긴 단어">{masked}</div>
              <div className="biz-card-meaning" style={{ color: "var(--ink-mute)" }}>Day {s.day}에 만나요</div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

function TestPage() {
  const { SCENARIOS, CHARACTERS, USER } = window.__SIM;
  const studied = SCENARIOS.filter(s => s.status === "studied");
  const [phase, setPhase] = useState("idle");
  const [count, setCount] = useState(5);
  const [queue, setQueue] = useState([]);
  const [idx, setIdx] = useState(0);
  const [picked, setPicked] = useState(null);
  const [results, setResults] = useState([]);

  // Hooks must be called unconditionally, keep at top
  const cur = queue[idx];
  const opts = useMemo(() => {
    if (!cur) return [];
    const others = studied.filter(o => o.day !== cur.day).sort(() => Math.random() - 0.5).slice(0, 3).map(o => o.word);
    return [...others, cur.word].sort(() => Math.random() - 0.5);
  }, [cur && cur.day, idx]);

  function start(n) {
    const shuffled = [...studied].sort(() => Math.random() - 0.5).slice(0, n);
    setQueue(shuffled); setIdx(0); setResults([]); setPicked(null); setPhase("playing");
  }

  if (phase === "idle") {
    return (
      <div>
        <div className="desk-header">
          <div>
            <div className="desk-eyebrow">EVALUATION · 분기 평가</div>
            <h1 className="desk-title"><em>롤플레이</em> 시험 응시</h1>
          </div>
          <div className="desk-meta"><b>총 {studied.length}개</b> 학습 완료<br/>5개 시추에이션 무작위</div>
        </div>
        <ApprovalLine doc="YB-EVAL-Q1" applicant={USER.name} status="응시 대기" />

        <div className="eval-wrap">
          <div className="eval-head">
            <div>
              <div className="eval-head-sub">QUARTERLY EVALUATION</div>
              <div className="eval-head-title">5개 시추에이션 · 객관식 4지선다</div>
            </div>
            <div className="stamp">평가</div>
          </div>
          <div className="eval-body">
            <div style={{ fontSize: 14, lineHeight: 1.7, color: "var(--ink-soft)", marginBottom: 18 }}>
              실제 회의/이메일 상황이 주어집니다. 빈 칸에 들어갈 가장 자연스러운 영어 표현을 4개 보기에서 선택하세요.<br/>
              <b style={{ color: "var(--ink)" }}>틀려도 정답을 보여드려요. 모르는 단어는 다시 학습 노트에서 복습 가능.</b>
            </div>
            <div className="row">
              {[3, 5, 10].filter(n => n <= studied.length).map(n => (
                <button key={n} className={"filter-chip " + (count === n ? "active" : "")} onClick={() => setCount(n)}>{n}문제</button>
              ))}
            </div>
            <div className="row" style={{ marginTop: 22 }}>
              <button className="btn btn-primary" onClick={() => start(count)} disabled={studied.length === 0}>
                평가 시작 · {count}문제 →
              </button>
              <span style={{ fontSize: 11, color: "var(--ink-mute)" }}>실제 평가는 Day 30 자동 응시</span>
            </div>
          </div>
        </div>
      </div>
    );
  }

  if (phase === "done") {
    const correct = results.filter(r => r.ok).length;
    return (
      <div>
        <div className="desk-header">
          <div>
            <div className="desk-eyebrow">RESULT · 평가 결과서</div>
            <h1 className="desk-title"><em>{correct === queue.length ? "전원 통과!" : "수고했어요"}</em></h1>
          </div>
        </div>
        <div className="eval-wrap">
          <div className="eval-head">
            <div className="eval-head-title">평가 결과서</div>
            <div className={"stamp " + (correct >= queue.length * 0.6 ? "" : "blue")}>
              {correct === queue.length ? "통과" : correct >= queue.length * 0.6 ? "재검토" : "보류"}
            </div>
          </div>
          <div className="eval-body">
            <div style={{ fontSize: 64, fontWeight: 900, letterSpacing: "-0.04em", color: "var(--orange)", lineHeight: 1 }}>
              {correct}<span style={{ fontSize: 24, color: "var(--ink-mute)", fontWeight: 600 }}> / {queue.length}</span>
            </div>
            <div style={{ marginTop: 12, fontSize: 14, color: "var(--ink-soft)" }}>
              {correct === queue.length ? "사수가 칭찬해요. 다음 평가도 이대로!" : "틀린 문제는 업무 노트에서 다시 만나요."}
            </div>
            <div className="row" style={{ marginTop: 22 }}>
              <button className="btn btn-primary" onClick={() => start(count)}>다시 풀기 →</button>
              <button className="btn btn-ghost" onClick={() => setPhase("idle")}>설정으로</button>
            </div>
            <hr className="divider" />
            <div className="label-doc" style={{ marginBottom: 10 }}>풀이 기록</div>
            <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
              {results.map((r, i) => (
                <div key={i} style={{ display: "flex", justifyContent: "space-between", padding: "10px 14px", background: r.ok ? "rgba(74,124,89,0.06)" : "rgba(178,58,44,0.06)", border: "1px solid var(--line)", fontSize: 13 }}>
                  <span style={{ fontWeight: 800, color: "var(--ink)" }}>{queue[i].word}</span>
                  <span style={{ fontWeight: 800, color: r.ok ? "var(--green)" : "var(--stamp-red)", letterSpacing: "0.04em", fontSize: 11 }}>
                    {r.ok ? "✓ 정답" : "✗ 오답"}
                  </span>
                </div>
              ))}
            </div>
          </div>
        </div>
      </div>
    );
  }

  // playing
  const npc = CHARACTERS[cur.npc];
  const cells = queue.map((_, i) => {
    if (i < results.length) return results[i].ok ? "done" : "wrong";
    if (i === idx) return "current";
    return "";
  });

  function pick(opt) {
    if (picked) return;
    const ok = opt === cur.word;
    setPicked(opt);
    setTimeout(() => {
      const next = [...results, { ok, picked: opt }];
      setResults(next);
      if (idx + 1 >= queue.length) { setPhase("done"); return; }
      setIdx(idx + 1); setPicked(null);
    }, 1200);
  }

  // 영어 답변 문장에서 타깃 단어를 빈 칸으로 (활용형 포함)
  // sampleAnswer에 정확한 단어가 없으면 활용형(ing/ed/s), 마지막엔 quote로 fallback
  const _blankedAnswer = (() => {
    const answer = (cur.sampleAnswer || "").trim();
    const word = (cur.word || "").trim();
    if (!answer || !word) return { text: cur.quote || "", source: "quote" };
    const esc = (s) => s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    // 1차: 단어 그대로 (case-insensitive)
    const reExact = new RegExp("(^|[^a-z])(" + esc(word) + ")([^a-z]|$)", "i");
    if (reExact.test(answer)) return { text: answer.replace(reExact, "$1___BLANK___$3"), source: "answer" };
    // 2차: 동사 활용형 (loop in → looping in 등)
    const tokens = word.split(/\s+/);
    const forms = window._verbForms ? window._verbForms(tokens[0]) : [tokens[0]];
    const tail = tokens.slice(1).map(esc).join("\\s+");
    for (const f of forms) {
      const head = esc(f);
      const pat = tail
        ? "(^|[^a-z])(" + head + "\\s+" + tail + ")([^a-z]|$)"
        : "(^|[^a-z])(" + head + ")([^a-z]|$)";
      const re = new RegExp(pat, "i");
      if (re.test(answer)) return { text: answer.replace(re, "$1___BLANK___$3"), source: "answer" };
    }
    // Fallback: 그대로 보여줌
    return { text: answer, source: "answer-nolimit" };
  })();

  return (
    <div>
      <div className="desk-header">
        <div>
          <div className="desk-eyebrow">EVALUATION · IN PROGRESS</div>
          <h1 className="desk-title">{idx + 1} / {queue.length} 문제</h1>
        </div>
      </div>
      <div className="eval-wrap">
        <div className="eval-head">
          <div className="eval-head-sub">Q. {idx + 1} / {queue.length}</div>
          <div className="eval-head-title">{cur.tags && cur.tags.map(t => "#" + t).join(" ")}</div>
        </div>
        <div className="eval-body">
          <div className="eval-progress">
            {cells.map((c, i) => <div key={i} className={"eval-progress-cell " + c}></div>)}
          </div>

          {/* 1) SITUATION, 한글로 상황 설명 */}
          <div className="eval-q-num">SITUATION · 상황</div>
          <div className="eval-q-scene">📍 {_sceneNoClock(cur.scene)}</div>
          <div className="scene-quote-row" style={{ marginTop: 14 }}>
            <div className="scene-avatar" style={{ background: npc.color }}>{npc.avatar}</div>
            <div style={{ flex: 1 }}>
              <div className="scene-npc-name">{npc.name}</div>
              <div className="scene-quote-bubble">"{cur.quote}"</div>
              <KoPeek ko={cur.quoteKo} />
            </div>
          </div>

          {/* 2) 한국어 가이드, 어떻게 답해야 하나 */}
          {cur.task && (cur.task.promptKo || cur.task.koSentence) && (
            <div style={{
              marginTop: 18, padding: "12px 14px",
              background: "var(--paper-warm)",
              borderLeft: "3px solid var(--accent)",
              borderRadius: 4,
            }}>
              <div style={{ fontSize: 11, fontWeight: 800, color: "var(--ink-mute)", letterSpacing: "0.1em", marginBottom: 6 }}>
                📝 한국어로 답한다면
              </div>
              <div style={{ fontSize: 14, color: "var(--ink)", lineHeight: 1.65, fontWeight: 600 }}>
                {cur.task.koSentence || cur.task.promptKo}
              </div>
            </div>
          )}

          {/* 3) 영어 답변 빈칸 채우기 */}
          <div style={{
            marginTop: 18, padding: "18px 20px",
            background: "#FFE9A6",
            border: "1px solid var(--line)",
            borderRadius: 6,
          }}>
            <div style={{ fontSize: 11, fontWeight: 800, color: "#8C6510", letterSpacing: "0.12em", marginBottom: 10 }}>
              ENGLISH · 영어로 한 줄
            </div>
            <div style={{ fontSize: 16, color: "var(--ink)", lineHeight: 1.65, fontWeight: 500 }}>
              "{_blankedAnswer.text.split("___BLANK___").map((p, i, arr) => (
                <React.Fragment key={i}>
                  {p}
                  {i < arr.length - 1 ? (
                    <span style={{
                      display: "inline-block",
                      background: "var(--ink)", color: "var(--paper)",
                      padding: "2px 18px", letterSpacing: "0.4em",
                      borderRadius: 3, fontWeight: 800,
                      verticalAlign: "baseline",
                    }}>____</span>
                  ) : null}
                </React.Fragment>
              ))}"
            </div>
          </div>

          <div className="label-doc" style={{ marginTop: 22 }}>빈 칸에 들어갈 영어 표현은?</div>
          <div className="eval-options">
            {opts.map((o, i) => {
              let cls = "";
              if (picked) {
                if (o === cur.word) cls = "correct";
                else if (o === picked) cls = "wrong";
              } else if (o === picked) cls = "selected";
              return (
                <button key={o} className={"eval-option " + cls} onClick={() => pick(o)}>
                  <span className="eval-option-letter">{String.fromCharCode(65 + i)}</span>
                  {o}
                </button>
              );
            })}
          </div>
        </div>
      </div>
    </div>
  );
}

function MyPage() {
  const { USER, CHARACTERS } = window.__SIM;
  const [notif, setNotif] = useState(true);
  const [notifTime, setNotifTime] = useState("09:00");
  const [paused, setPaused] = useState(false);
  const [showSettings, setShowSettings] = useState(false);
  const [showPause, setShowPause] = useState(false);
  const [tyStealth, setTyStealth] = useState(() => _tyStealthOn());
  const _tyGlow = _isNextFeature() && (() => { try { const w = _tyWeek(0); return !!(w && w.due >= 3 && w.perfect); } catch (e) { return false; } })();

  const handleLogout = () => {
    if (!confirm("로그아웃 하시겠어요?\n\n진도는 서버에 저장돼있어서 다음에 같은 이메일로 다시 들어오면 그대로 이어져요.")) return;
    // 사용자 + 일정·투어 진행상태 정리
    const keysToRemove = [];
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k === "__OD_USER" || k.startsWith("__OD_TASKS_") || k.startsWith("__OD_TOUR_") || k.startsWith("__OD_NOTICE_READS_")) {
        keysToRemove.push(k);
      }
    }
    keysToRemove.forEach(k => localStorage.removeItem(k));
    window.location.href = "onboarding.html";
  };

  // 회원 탈퇴 기능은 데이터 보호를 위해 제거됨 (탈퇴 요청은 유버디 문의로 안내)

  // ★ 사원증 덱: 승급한 직급들을 카드로 넘겨보기 (승급의 재미)
  // 항상 보유: 수습. 사원이면 사원 카드까지. 기본은 현재 직급 카드.
  const _cardDeck = [{ id: "probation", ko: "수습", en: "Probation", cap: 30 }];
  if (USER.isFulltime) _cardDeck.push({ id: "fulltime", ko: "사원", en: "Associate", cap: 60 });
  if (USER.rankId === "senior") _cardDeck.push({ id: "senior", ko: "대리", en: "Senior Associate", cap: 90 });
  const [cardIdx, setCardIdx] = useState(_cardDeck.length - 1); // 현재(가장 높은) 직급부터
  const _cardSafeIdx = Math.min(cardIdx, _cardDeck.length - 1);
  const card = _cardDeck[_cardSafeIdx];
  const _cardIsFull = card.id !== "probation";
  // ★ 현재 재직 카드는 day 기반 랭크(rankId)로 판정. 분모: 현재 카드 = 코스 총일(phaseCap 30/60/90), 지난 카드 = 그 직급 종료일.
  const _cardEarned = card.id === USER.rankId;
  const _cardDays = _cardEarned ? USER.totalDays : card.cap;
  // ★ 지난 직급 카드도 '실제 완주'만 인정 (2026-08-25). 그 구간을 다 채우지 않았으면
  //   수료 도장 대신 실제 완주 일수를 보여준다 (허위 '수료' 표시 방지).
  const _cardPhaseStart = card.id === "fulltime" ? 31 : (card.id === "senior" ? 61 : 1);
  const _cardPhaseTotal = card.cap - _cardPhaseStart + 1;
  const _cardPhaseDone = (() => {
    try { return [..._odCompletedDaySet(_localUser)].filter(d => d >= _cardPhaseStart && d <= card.cap).length; } catch (e) { return 0; }
  })();
  const _cardGraduated = !_cardEarned && _cardPhaseDone >= _cardPhaseTotal;
  // 카드별 색: 수습=기본, 사원=네이비, 대리=레드
  const _cardStripStyle = card.id === "senior" ? { background: "#A6402E", color: "#F7EDE4" }
    : card.id === "fulltime" ? { background: "#3A4A5C", color: "#F2EBDD" } : null;
  // 사번 통일: 카드·직급 무관 동일. 날짜는 입사일(signupDate) 기준, 4자리는 기존 사번 접미사(없으면 이메일 해시).
  const _empSuffix = (USER.empNumber && String(USER.empNumber).includes("-")) ? String(USER.empNumber).split("-").pop()
    : String(Math.abs([...(USER.email || "guest")].reduce((a, c) => (a * 31 + c.charCodeAt(0)) | 0, 7)) % 10000).padStart(4, "0");
  const _empJoinYmd = (() => { try { const sd = _localUser && _localUser.signupDate ? new Date(_localUser.signupDate) : null; if (sd && !isNaN(sd.getTime())) return sd.getFullYear() + String(sd.getMonth() + 1).padStart(2, "0") + String(sd.getDate()).padStart(2, "0"); } catch (e) {} return "20260416"; })();
  const _empNo = _empJoinYmd + "-" + _empSuffix;

  return (
    <div>
      <div className="desk-header">
        <div>
          <div className="desk-eyebrow">HR FILE · 사원증 / 인사 기록</div>
          <h1 className="desk-title"><em>{USER.name}</em>님의 사원 기록부</h1>
        </div>
        <div className="desk-meta"><b>입사일</b><br/>{USER.joinDate}</div>
      </div>
      <ApprovalLine doc="YB-HR-001" applicant={USER.name} status={USER.rankId === "probation" ? "수습 진행 중" : USER.position + " 재직 중"} />

      {/* 덱 네비게이션 (사원 이상이면 노출) */}
      {_cardDeck.length > 1 && (
        <div style={{ display: "flex", alignItems: "center", justifyContent: "center", gap: 12, marginBottom: 12 }}>
          <button onClick={() => setCardIdx(Math.max(0, _cardSafeIdx - 1))} disabled={_cardSafeIdx === 0}
            style={{ background: "transparent", border: "1px solid var(--line)", borderRadius: 6, padding: "4px 10px", cursor: _cardSafeIdx === 0 ? "default" : "pointer", opacity: _cardSafeIdx === 0 ? 0.3 : 1, fontFamily: "inherit", fontSize: 13 }}>◀</button>
          <div style={{ display: "flex", gap: 6 }}>
            {_cardDeck.map((c, i) => (
              <button key={c.id} onClick={() => setCardIdx(i)}
                style={{
                  fontSize: 11, fontWeight: 800, padding: "4px 12px", borderRadius: 14, cursor: "pointer", fontFamily: "inherit",
                  border: "1px solid " + (i === _cardSafeIdx ? "var(--orange)" : "var(--line)"),
                  background: i === _cardSafeIdx ? "var(--orange)" : "transparent",
                  color: i === _cardSafeIdx ? "#fff" : "var(--ink-mute)",
                }}>{c.ko}</button>
            ))}
          </div>
          <button onClick={() => setCardIdx(Math.min(_cardDeck.length - 1, _cardSafeIdx + 1))} disabled={_cardSafeIdx === _cardDeck.length - 1}
            style={{ background: "transparent", border: "1px solid var(--line)", borderRadius: 6, padding: "4px 10px", cursor: _cardSafeIdx === _cardDeck.length - 1 ? "default" : "pointer", opacity: _cardSafeIdx === _cardDeck.length - 1 ? 0.3 : 1, fontFamily: "inherit", fontSize: 13 }}>▶</button>
        </div>
      )}

      <div className={"id-card" + (_tyGlow ? " id-glow" : "")}>
        <div className="id-card-clip"></div>
        <div className="id-card-strip" style={_cardStripStyle}>
          <span>YOUBUDDY KOREA · {_cardIsFull ? card.en.toUpperCase() : "EMPLOYEE ID"}{_isNextFeature() && _tyFounding() ? <span className="ty-founding">공채 1기</span> : null}</span>
          <b>NO. {_empNo}</b>
        </div>
        <div className="id-card-body">
          <div className="id-card-photo" style={_cardStripStyle}>{_cardIsFull ? "👔" : USER.name[0]}</div>
          <div className="id-card-fields" style={{ flex: 1 }}>
            <div className="id-field"><span className="id-field-label">성명</span><span className="id-field-value">{USER.name}</span></div>
            <div className="id-field"><span className="id-field-label">직급</span><span className="id-field-value">{card.ko} · {card.en}{!_cardEarned ? " (이전 직급)" : (_isNextFeature() ? " · " + _tyHobong() + "호봉" : "")}</span></div>
            {USER.email && (
              <div className="id-field">
                <span className="id-field-label">로그인</span>
                <span className="id-field-value" style={{ fontFamily: "JetBrains Mono, monospace", fontSize: 12 }}>{USER.email}</span>
              </div>
            )}
            {/* TEMP DISABLED, 정식 출시 시 false → true 로 복원 */}
            {false && (
              <div className="id-field"><span className="id-field-label">소속</span><span className="id-field-value">{USER.team}</span></div>
            )}
            <div className="id-field"><span className="id-field-label">입사일</span><span className="id-field-value">{USER.joinDate}</span></div>
            <div className="id-field"><span className="id-field-label">{_cardIsFull ? "근속" : "수습"}</span><span className="id-field-value">{_cardEarned ? `DAY ${USER.currentDay} / ${_cardDays} · 표현 ${USER.wordsCollected}개 · 🔥 ${USER.streak}` : (_cardGraduated ? `DAY ${_cardDays} / ${_cardDays} · 수료 ✓` : `완주 ${_cardPhaseDone} / ${_cardPhaseTotal}일 · 진행 중`)}</span></div>
            {(() => { // 소속 TF (대리 카드에만)
              const tf = _tfState(); if (!tf.track) return null;
              const meta = TF_TRACKS.find(t => t.id === (tf.track.id || tf.track)); if (!meta) return null;
              const doneCnt = (tf.done || []).length;
              return (
                <div className="id-field"><span className="id-field-label">소속</span>
                  <span className="id-field-value" style={{ color: meta.color, fontWeight: 800 }}>
                    {meta.emoji} {meta.name}
                    <span style={{ color: "var(--ink-mute)", fontWeight: 600, fontSize: "0.85em" }}> · 수료 {doneCnt}/4 · 과장까지 {4 - doneCnt}개</span>
                  </span>
                </div>
              );
            })()}
          </div>
        </div>
        <div className="id-card-foot">
          <span>{(() => {
            // 유효기간 = 입사일 ~ 코스 종료일 (수습 30일 / 사원 60일)
            try {
              const sd = _localUser && _localUser.signupDate ? new Date(_localUser.signupDate) : null;
              if (sd && !isNaN(sd.getTime())) {
