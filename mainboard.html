<style>
/* ============================================================
   1일1비, 신입 출근 시뮬레이터 스타일
   종이 사무 서류 비주얼 시스템
   ============================================================ */

@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&display=swap');

:root {
  --paper: #F4EFE3;
  --paper-warm: #ECE3CF;
  --paper-shadow: rgba(58,40,18,0.08);
  --ink: #2A1F14;
  --ink-soft: #5C4A36;
  --ink-mute: #8A7964;
  --line: #C9BBA0;
  --line-soft: rgba(58,40,18,0.12);
  --orange: #D85A2A;
  --orange-soft: #F5DCC8;
  --stamp-red: #B23A2C;
  --stamp-blue: #2B4A6E;
  --grid-blue: #B8C7D6;
  --green: #4A7C59;
  --highlight: #F5E6A3;
  --cream: #FAF6EB;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: #E8DFCB;
  color: var(--ink);
  font-family: 'Noto Sans KR', sans-serif;
  -webkit-font-smoothing: antialiased;
  font-size: 14px;
  line-height: 1.5;
}
button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; padding: 0; }
input, textarea, select { font-family: inherit; }

/* ===== 종이 텍스처 (전체 배경, 약간의 노이즈) ===== */
body::before {
  content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
  background-image:
    radial-gradient(rgba(58,40,18,0.04) 1px, transparent 1px),
    radial-gradient(rgba(58,40,18,0.025) 1px, transparent 1px);
  background-size: 32px 32px, 8px 8px;
  background-position: 0 0, 4px 4px;
}

/* ===== 앱 셸, 사무실 책상 메타포 ===== */
.office {
  display: grid;
  grid-template-columns: 256px 1fr;
  min-height: 100vh;
  max-width: 1380px;
  margin: 0 auto;
  background: var(--paper);
  box-shadow: 0 0 0 1px var(--line), 0 30px 60px rgba(58,40,18,0.18);
}

/* ===== 사이드바 = 사물함 ===== */
.locker {
  background: var(--paper-warm);
  border-right: 1px solid var(--line);
  padding: 24px 18px;
  position: sticky; top: 0;
  height: 100vh; overflow-y: auto;
}
.locker-brand {
  display: flex; gap: 10px; align-items: center;
  padding-bottom: 18px; border-bottom: 1px dashed var(--line);
  cursor: pointer;
  width: 100%; text-align: left;
}
.locker-brand:hover .locker-brand-mark { transform: rotate(-3deg); }
.locker-brand-mark {
  width: 38px; height: 38px; border-radius: 6px;
  background: var(--ink); color: var(--paper);
  display: grid; place-items: center;
  font-weight: 900; font-size: 17px; letter-spacing: -0.04em;
  transition: transform 0.2s;
  box-shadow: 2px 2px 0 var(--line);
}
.locker-brand-text { line-height: 1.2; }
.locker-brand-text b { font-size: 15px; font-weight: 800; letter-spacing: -0.02em; display: block; }
.locker-brand-text small { font-size: 9.5px; letter-spacing: 0.18em; color: var(--ink-mute); font-weight: 700; }

.locker-section { margin-top: 22px; }
.locker-label {
  font-size: 9.5px; letter-spacing: 0.2em; font-weight: 800;
  color: var(--ink-mute); margin-bottom: 8px; text-transform: uppercase;
}
.locker-link {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 12px; border-radius: 6px;
  font-size: 13.5px; font-weight: 600; color: var(--ink-soft);
  width: 100%; text-align: left;
  transition: background 0.15s;
  margin-bottom: 2px;
  border-left: 3px solid transparent;
}
.locker-link:hover { background: rgba(216,90,42,0.06); color: var(--ink); }
.locker-link.active {
  background: var(--paper);
  color: var(--ink); font-weight: 800;
  border-left-color: var(--orange);
  box-shadow: inset -1px 0 0 var(--line);
}
.locker-link-l { display: flex; align-items: center; gap: 10px; }
.locker-link-icon { font-size: 14px; width: 18px; text-align: center; }
.locker-badge {
  background: var(--stamp-red); color: var(--cream);
  font-size: 10px; font-weight: 800; padding: 1px 7px;
  border-radius: 999px; letter-spacing: 0.04em;
}

/* 사물함 하단 = 사원증 미니 */
.locker-card {
  margin-top: 28px;
  background: var(--cream);
  border: 1px solid var(--line);
  border-radius: 4px;
  padding: 14px;
  position: relative;
  box-shadow: 1px 1px 0 var(--line-soft);
}
.locker-card::before {
  content: ""; position: absolute; top: -6px; left: 50%; transform: translateX(-50%);
  width: 24px; height: 8px; background: var(--ink-mute); border-radius: 2px 2px 0 0;
}
.locker-card-row { display: flex; gap: 10px; align-items: center; }
.locker-card-photo {
  width: 38px; height: 46px; background: var(--paper-warm);
  border: 1px solid var(--line); display: grid; place-items: center;
  font-size: 18px; font-weight: 800; color: var(--ink);
}
.locker-card-info { flex: 1; line-height: 1.3; }
.locker-card-name { font-size: 13px; font-weight: 800; }
.locker-card-pos { font-size: 10.5px; color: var(--ink-mute); }
.locker-card-day {
  margin-top: 10px; padding-top: 8px; border-top: 1px dashed var(--line);
  font-size: 10px; color: var(--ink-mute); letter-spacing: 0.05em; font-weight: 600;
}
.locker-card-day b { color: var(--orange); font-size: 13px; font-weight: 900; letter-spacing: -0.02em; }

/* ===== 데스크 (메인 영역) ===== */
.desk {
  padding: 36px 44px 80px;
  position: relative;
  min-height: 100vh;
}

/* 페이지 상단 = 결재 라인 */
.desk-header {
  display: flex; justify-content: space-between; align-items: flex-end;
  padding-bottom: 18px;
  border-bottom: 2px solid var(--ink);
  margin-bottom: 28px;
}
.desk-eyebrow {
  font-size: 10px; letter-spacing: 0.24em; font-weight: 800;
  color: var(--ink-mute); text-transform: uppercase; margin-bottom: 6px;
}
.desk-title {
  font-size: 26px; font-weight: 900; letter-spacing: -0.03em; line-height: 1.15;
  margin: 0; color: var(--ink);
}
.desk-title em { font-style: normal; color: var(--orange); }
.desk-meta {
  text-align: right; font-size: 11px; color: var(--ink-mute); line-height: 1.5;
}
.desk-meta b { color: var(--ink); font-weight: 800; font-size: 12px; }

/* 결재판 그리드 (3열 결재 라인) */
.approval-line {
  display: grid; grid-template-columns: repeat(3, 1fr);
  border: 1px solid var(--ink);
  background: var(--cream);
  margin-bottom: 24px;
  font-size: 10.5px;
}
.approval-cell {
  padding: 6px 10px;
  border-right: 1px solid var(--ink);
  display: flex; flex-direction: column; gap: 4px;
  min-height: 60px;
}
.approval-cell:last-child { border-right: none; }
.approval-cell-label {
  font-size: 9px; letter-spacing: 0.18em; font-weight: 800;
  color: var(--ink-mute); border-bottom: 1px solid var(--line); padding-bottom: 3px;
  text-transform: uppercase;
}
.approval-cell-value { font-size: 12px; font-weight: 700; color: var(--ink); flex: 1; display: flex; align-items: center; }

/* 도장 */
.stamp {
  display: inline-grid; place-items: center;
  width: 52px; height: 52px;
  border: 2.5px solid var(--stamp-red);
  border-radius: 50%;
  color: var(--stamp-red);
  font-weight: 900; font-size: 13px; letter-spacing: -0.02em;
  transform: rotate(-12deg);
  font-family: 'Noto Sans KR', sans-serif;
  background: rgba(178,58,44,0.04);
  text-align: center; line-height: 1.05;
}
.stamp.blue { border-color: var(--stamp-blue); color: var(--stamp-blue); background: rgba(43,74,110,0.04); }
.stamp.small { width: 36px; height: 36px; font-size: 9px; border-width: 1.8px; }

/* ===== 카드 (종이 시트) ===== */
.sheet {
  background: var(--cream);
  border: 1px solid var(--line);
  position: relative;
  box-shadow: 1px 1px 0 var(--paper-shadow), 4px 4px 0 var(--paper-shadow);
}
.sheet-header {
  background: var(--ink); color: var(--paper);
  padding: 8px 16px;
  display: flex; justify-content: space-between; align-items: center;
  font-size: 10.5px; letter-spacing: 0.18em; font-weight: 800;
  text-transform: uppercase;
}
.sheet-header b { color: var(--orange-soft); }
.sheet-body { padding: 22px 24px; }

/* 모눈 종이 */
.grid-paper {
  background-image:
    linear-gradient(var(--grid-blue) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid-blue) 1px, transparent 1px);
  background-size: 24px 24px;
  background-color: #FBF9EF;
  background-position: -1px -1px;
}

/* ===== 홈, 책상 위 ===== */
.desk-grid {
  display: grid;
  grid-template-columns: 1.6fr 1fr;
  gap: 22px;
}

/* 시추에이션 카드 = 결재판 */
.scene-card {
  background: var(--cream);
  border: 1.5px solid var(--ink);
  position: relative;
  box-shadow: 4px 4px 0 var(--ink);
}
.scene-card::before {
  content: ""; position: absolute; top: 14px; right: 14px;
  width: 8px; height: 8px; border-radius: 50%; background: var(--stamp-red);
  box-shadow: 0 0 0 3px rgba(178,58,44,0.15);
}
.scene-stamp-area {
  position: absolute; top: 12px; right: 36px;
}
.scene-card-tag {
  background: var(--ink); color: var(--paper);
  display: inline-block;
  padding: 4px 12px;
  font-size: 10px; letter-spacing: 0.2em; font-weight: 800;
  text-transform: uppercase;
}
.scene-card-body { padding: 24px 28px 28px; }
.scene-card-time {
  font-size: 11px; letter-spacing: 0.16em; font-weight: 700;
  color: var(--ink-mute); margin-top: 16px;
}
.scene-card-scene {
  margin-top: 8px; font-size: 14px; line-height: 1.65;
  color: var(--ink-soft); padding-bottom: 16px;
  border-bottom: 1px dashed var(--line);
}
.scene-quote-row {
  margin-top: 18px;
  display: flex; gap: 14px; align-items: flex-start;
}
.scene-avatar {
  width: 44px; height: 44px; border-radius: 50%;
  display: grid; place-items: center;
  font-weight: 900; font-size: 16px; color: #fff;
  flex-shrink: 0;
  border: 2px solid var(--ink);
}
.scene-quote-bubble {
  flex: 1; position: relative;
  background: var(--paper-warm);
  padding: 14px 18px;
  border: 1px solid var(--line);
  border-radius: 0 12px 12px 12px;
  font-size: 16px; font-weight: 600; line-height: 1.55;
  color: var(--ink);
}
.scene-quote-bubble::before {
  content: ""; position: absolute; top: 10px; left: -8px;
  width: 0; height: 0;
  border-top: 8px solid transparent;
  border-bottom: 8px solid transparent;
  border-right: 8px solid var(--paper-warm);
}
.scene-npc-name { font-size: 11px; color: var(--ink-mute); margin-bottom: 4px; font-weight: 700; }
.scene-target-word {
  display: inline-block;
  background: var(--highlight);
  padding: 1px 6px;
  font-weight: 800;
  border-radius: 2px;
  box-shadow: inset 0 -2px 0 rgba(0,0,0,0.08);
}

/* 영어 답변 작성 영역 */
.scene-task {
  margin-top: 22px; padding-top: 20px;
  border-top: 1.5px solid var(--ink);
}
.scene-task-label {
  font-size: 10px; letter-spacing: 0.2em; font-weight: 800;
  color: var(--orange); margin-bottom: 8px;
}
.scene-task-prompt {
  font-size: 14px; font-weight: 700; color: var(--ink); margin-bottom: 14px;
}
.scene-task-prompt b { background: var(--highlight); padding: 1px 6px; }
.scene-input {
  width: 100%; min-height: 90px; resize: vertical;
  padding: 14px 16px;
  border: 1.5px solid var(--line);
  background: #FBF9EF;
  background-image:
    linear-gradient(transparent 27px, var(--line-soft) 27px, var(--line-soft) 28px, transparent 28px);
  background-size: 100% 28px;
  font-size: 14.5px; line-height: 28px;
  color: var(--ink);
  font-weight: 500;
  outline: none;
  transition: border-color 0.15s;
}
.scene-input:focus { border-color: var(--orange); }
.scene-actions { margin-top: 14px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

/* 사수 포스트잇 */
.postit {
  background: #FFE9A6;
  padding: 18px 18px 22px;
  font-size: 13px; line-height: 1.6;
  color: var(--ink);
  box-shadow: 2px 4px 8px rgba(58,40,18,0.18);
  transform: rotate(-1.2deg);
  position: relative;
  font-weight: 500;
}
.postit::before {
  content: ""; position: absolute; top: -8px; left: 50%; transform: translateX(-50%) rotate(-2deg);
  width: 60px; height: 18px;
  background: rgba(255,255,255,0.4);
  border: 1px dashed rgba(58,40,18,0.2);
}
.postit-from {
  font-size: 10px; letter-spacing: 0.16em; font-weight: 800;
  color: var(--orange); margin-bottom: 8px;
}
.postit-sig { margin-top: 10px; font-size: 12px; color: var(--ink-mute); font-weight: 700; }

/* 일정표 = 다이어리 */
.schedule {
  background: var(--cream);
  border: 1px solid var(--line);
  padding: 0;
}
.schedule-head {
  background: var(--paper-warm);
  border-bottom: 1px solid var(--line);
  padding: 10px 16px;
  font-size: 11px; letter-spacing: 0.18em; font-weight: 800; text-transform: uppercase;
  color: var(--ink-soft);
  display: flex; justify-content: space-between;
}
.schedule-row {
  display: grid; grid-template-columns: 60px 1fr auto;
  gap: 14px; align-items: center;
  padding: 11px 16px;
  border-bottom: 1px dashed var(--line);
  font-size: 13px;
}
.schedule-row:last-child { border-bottom: none; }
.schedule-row.now { background: rgba(216,90,42,0.06); position: relative; }
.schedule-row.now::before {
  content: ""; position: absolute; left: 0; top: 0; bottom: 0;
  width: 3px; background: var(--orange);
}
.schedule-time {
  font-weight: 800; font-size: 12.5px; letter-spacing: -0.02em;
  color: var(--ink); font-variant-numeric: tabular-nums;
}
.schedule-row.done .schedule-time { color: var(--ink-mute); text-decoration: line-through; }
.schedule-title { color: var(--ink); }
.schedule-row.done .schedule-title { color: var(--ink-mute); }
.schedule-note { font-size: 10.5px; color: var(--orange); font-weight: 700; letter-spacing: 0.04em; }
.schedule-status {
  font-size: 9.5px; letter-spacing: 0.14em; font-weight: 800;
  padding: 2px 8px; border-radius: 999px;
  background: var(--paper-warm); color: var(--ink-mute);
}
.schedule-status.now { background: var(--orange); color: #fff; }
.schedule-status.done { background: transparent; color: var(--ink-mute); }

/* 출근부 = 14일 카드 */
.attendance {
  background: var(--cream);
  border: 1px solid var(--line);
  padding: 16px 18px;
}
.attendance-head {
  display: flex; justify-content: space-between; align-items: baseline;
  margin-bottom: 12px;
}
.attendance-title {
  font-size: 11px; letter-spacing: 0.18em; font-weight: 800; color: var(--ink-soft);
  text-transform: uppercase;
}
.attendance-num {
  font-size: 22px; font-weight: 900; letter-spacing: -0.03em; color: var(--orange);
}
.attendance-num small { font-size: 11px; color: var(--ink-mute); margin-left: 4px; font-weight: 700; }
.attendance {
  min-width: 0; /* grid 자식이 부모 폭 넘지 않게 */
  overflow: hidden;
}
.attendance-cells {
  display: grid; grid-template-columns: repeat(14, 1fr); gap: 4px;
  min-width: 0;
}
/* 30일 전체 보기, 데스크탑은 10열 */
.attendance-cells.full {
  grid-template-columns: repeat(10, 1fr);
}
.att-cell {
  aspect-ratio: 1;
  border: 1px solid var(--line);
  border-radius: 5px;
  display: grid; place-items: center;
  font-size: 10px; font-weight: 700; color: var(--ink-mute);
  background: var(--paper);
  position: relative;
}
/* 완료, 4개 일정 다 + 당일: 주황 채움 + 흰 체크 */
.att-cell.done {
  background: var(--orange, #D85A2A);
  border-color: var(--orange, #D85A2A);
  color: #fff;
}
.att-cell.done::after {
  content: "✓"; position: absolute;
  font-size: 13px; font-weight: 900; color: #fff;
}
/* 늦은 인증, 4개 다 했지만 해당일 이후: 황토색 채움 + 체크 */
.att-cell.late {
  background: #E0A93D;
  border-color: #E0A93D;
  color: #fff;
}
.att-cell.late::after {
  content: "✓"; position: absolute;
  font-size: 13px; font-weight: 900; color: #fff;
}
/* 놓침, 출근일 지났지만 미완성: 점선 빈칸 (채우고 싶게) */
.att-cell.missed {
  background: transparent;
  color: var(--ink-mute);
  border-style: dashed;
  border-color: var(--line);
  opacity: 0.7;
}
/* 미래, 아직 안 온 날: 연회색 빈칸 */
.att-cell.future {
  background: var(--paper-warm);
  color: var(--ink-mute);
  opacity: 0.5;
}
/* 오늘: 주황 굵은 테두리 강조 */
.att-cell.today {
  border: 2px solid var(--orange);
  background: var(--highlight);
  color: var(--orange);
  font-weight: 900;
}
.att-cell.today::after { content: "오늘"; font-size: 8px; color: var(--orange); font-weight: 800; }

/* 주말 칸, 가벼운 톤. 도장 찍히면 ☕ */
.att-cell.weekend {
  background: rgba(216,90,42,0.04);
  color: var(--ink-mute);
  opacity: 0.85;
  font-style: italic;
}
.att-cell.weekend.done { background: rgba(216,90,42,0.06); color: var(--ink-mute); }
.att-cell.weekend.done::after { content: "☕"; font-size: 10px; color: var(--ink-mute); }
.att-cell.weekend.today { border-color: var(--ink-mute); background: var(--paper-warm); }
.att-cell.weekend.today::after { content: "주말"; color: var(--ink-mute); }

/* 사내 메모 박스 (홈 우측) */
.memo-box {
  background: var(--cream);
  border: 1px solid var(--line);
  padding: 0;
}
.memo-box-head {
  background: var(--ink); color: var(--paper);
  padding: 8px 14px;
  font-size: 10.5px; letter-spacing: 0.18em; font-weight: 800;
  display: flex; justify-content: space-between; align-items: center;
}
.memo-box-head b { color: var(--orange-soft); }
.memo-row {
  padding: 11px 14px;
  border-bottom: 1px dashed var(--line);
  display: grid; grid-template-columns: 36px 1fr auto;
  gap: 10px; align-items: center;
  font-size: 12.5px; cursor: pointer;
  transition: background 0.15s;
  width: 100%; text-align: left;
}
.memo-row:hover { background: var(--paper); }
.memo-row:last-child { border-bottom: none; }
.memo-row.unread .memo-subject { font-weight: 800; }
.memo-row.unread::before {
  content: ""; display: block;
  width: 6px; height: 6px; border-radius: 50%; background: var(--orange);
  position: absolute; margin-left: -10px; margin-top: 6px;
}
.memo-from-avatar {
  width: 28px; height: 28px; border-radius: 4px;
  display: grid; place-items: center;
  font-size: 11px; font-weight: 800; color: #fff;
}
.memo-subject { font-size: 12.5px; color: var(--ink); line-height: 1.4; }
.memo-meta { font-size: 10px; color: var(--ink-mute); font-weight: 600; letter-spacing: 0.04em; }
.memo-tag {
  display: inline-block; font-size: 9.5px; padding: 1px 6px;
  background: var(--paper-warm); color: var(--ink-soft);
  border: 1px solid var(--line);
  font-weight: 800; letter-spacing: 0.06em; margin-right: 6px;
}
.memo-tag.req { background: var(--stamp-red); color: #fff; border-color: var(--stamp-red); }

/* ===== 버튼 ===== */
.btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 10px 18px;
  font-size: 12.5px; font-weight: 800; letter-spacing: -0.01em;
  border: 1.5px solid var(--ink);
  background: var(--cream);
  color: var(--ink);
  transition: all 0.12s;
  position: relative;
}
.btn:hover { background: var(--paper-warm); transform: translate(-1px, -1px); box-shadow: 2px 2px 0 var(--ink); }
.btn:active { transform: translate(0, 0); box-shadow: none; }
.btn-primary { background: var(--orange); color: #fff; border-color: var(--orange); }
.btn-primary:hover { background: #C04E22; }
.btn-ghost { background: transparent; border-color: var(--line); color: var(--ink-soft); }
.btn-ghost:hover { background: var(--paper-warm); }
.btn-ink { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.btn-ink:hover { background: #1A130B; }
.btn-sm { padding: 7px 12px; font-size: 11.5px; }

/* ===== 슬랙 컨텍스트, Mini Mission 슬랙 모양 ===== */
.slack-frame {
  background: #fff;
  border: 1px solid #DDDDE3;
  border-radius: 8px;
  margin-top: 12px;
  overflow: hidden;
  box-shadow: 0 4px 14px -6px rgba(0,0,0,0.08);
  font-family: 'Noto Sans KR', 'Helvetica Neue', system-ui, sans-serif;
}
.slack-head {
  background: #350D36;
  color: #fff;
  padding: 9px 14px;
  font-size: 12.5px;
  display: flex; align-items: center; gap: 6px;
  border-bottom: 1px solid #481349;
}
.slack-channel { font-weight: 800; }
.slack-channel-meta { color: #BCABBC; font-size: 10.5px; margin-left: auto; }
.slack-body { padding: 14px 14px 4px; background: #fff; }
.slack-msg { display: flex; gap: 10px; align-items: flex-start; padding: 6px 0; }
.slack-msg-avatar {
  width: 36px; height: 36px;
  border-radius: 4px;
  display: flex; align-items: center; justify-content: center;
  color: #fff; font-weight: 800; font-size: 13px; flex-shrink: 0;
}
.slack-msg-content { flex: 1; min-width: 0; }
.slack-msg-name { font-weight: 800; font-size: 13.5px; color: #1D1C1D; }
.slack-msg-time { color: #616061; font-size: 11px; margin-left: 6px; font-weight: 500; }
.slack-msg-text {
  margin-top: 2px; font-size: 14px; line-height: 1.5; color: #1D1C1D;
  white-space: pre-wrap; word-break: keep-all;
}
.slack-msg-text b, .slack-msg-text mark {
  background: #FFE066; padding: 1px 4px; border-radius: 2px; font-weight: 700;
  font-family: 'JetBrains Mono', monospace; font-size: 13px;
}
.slack-replies-prompt {
  margin-top: 10px;
  padding: 10px 12px;
  background: #F8F8F8;
  border-radius: 4px;
  font-size: 12px;
  color: #616061;
}
.slack-replies-prompt b { color: #1D1C1D; }
.slack-reply-option {
  display: block;
  width: 100%;
  text-align: left;
  border: 1px solid #DDDDE3;
  background: #fff;
  border-radius: 6px;
  padding: 11px 14px;
  margin-top: 8px;
  font-size: 13.5px;
  line-height: 1.5;
  color: #1D1C1D;
  cursor: pointer;
  transition: border-color 0.12s, background 0.12s;
  font-family: inherit;
}
.slack-reply-option:hover { border-color: #1264A3; background: #F8F8F8; }
.slack-reply-option.picked-correct { border-color: #2BAC76; background: #ECFDF1; }
.slack-reply-option.picked-wrong { border-color: #E01E5A; background: #FCEBEF; }
.slack-reply-option .opt-letter { font-weight: 800; color: #616061; margin-right: 6px; }
.slack-reply-option .opt-note {
  margin-top: 7px; padding-top: 7px;
  border-top: 1px dashed #DDDDE3;
  font-size: 11.5px;
  color: #616061;
  line-height: 1.5;
  font-style: italic;
}

/* ===== 공통 라벨 ===== */
.label-doc {
  display: inline-block;
  font-size: 9.5px; letter-spacing: 0.2em; font-weight: 800;
  color: var(--ink-mute); text-transform: uppercase;
}
.label-orange { color: var(--orange); }
.label-red { color: var(--stamp-red); }

/* ===== 모달, 결재 서류 ===== */
.modal-bg {
  position: fixed; inset: 0; z-index: 100;
  background: rgba(42,31,20,0.55);
  display: grid; place-items: center;
  padding: 24px;
  padding-top: max(24px, env(safe-area-inset-top));
  padding-bottom: max(24px, env(safe-area-inset-bottom));
}
.modal-doc {
  background: var(--cream);
  border: 1px solid var(--ink);
  width: 100%; max-width: 640px;
  max-height: 88vh; overflow-y: auto;
  box-shadow: 8px 8px 0 rgba(42,31,20,0.4);
}
.modal-doc-head {
  background: var(--ink); color: var(--paper);
  padding: 12px 18px;
  display: flex; justify-content: space-between; align-items: center;
  font-size: 11px; letter-spacing: 0.18em; font-weight: 800; text-transform: uppercase;
  position: sticky; top: 0; z-index: 10;
}
.modal-doc-body { padding: 24px 28px; }

/* ===== 누적 단어 = 명함첩/업무 노트 ===== */
.note-tabs {
  display: flex; gap: 0;
  border-bottom: 1.5px solid var(--ink);
  margin-bottom: 22px;
}
.note-tab {
  padding: 10px 18px; font-size: 12px; font-weight: 800;
  color: var(--ink-mute); letter-spacing: 0.04em;
  border: 1px solid transparent;
  border-bottom: none;
  background: transparent;
}
.note-tab.active {
  background: var(--cream); color: var(--ink);
  border-color: var(--ink); margin-bottom: -1.5px;
}

.word-rolodex {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px;
}
.biz-card {
  background: var(--cream);
  border: 1px solid var(--line);
  padding: 16px 18px;
  position: relative;
  text-align: left;
  width: 100%;
  cursor: pointer;
  transition: all 0.15s;
  box-shadow: 1px 1px 0 var(--paper-shadow);
  min-height: 130px;
  display: flex; flex-direction: column; gap: 6px;
}
.biz-card:hover { transform: translate(-2px, -2px); box-shadow: 4px 4px 0 var(--paper-shadow), 1px 1px 0 var(--paper-shadow); border-color: var(--ink); }
.biz-card-head {
  display: flex; justify-content: space-between; align-items: flex-start;
  font-size: 9.5px; letter-spacing: 0.16em; font-weight: 800; color: var(--ink-mute);
}
.biz-card-day { font-weight: 900; }
.biz-card-word {
  font-size: 22px; font-weight: 900; letter-spacing: -0.03em;
  color: var(--ink); line-height: 1.1; margin-top: 4px;
}
.biz-card-meaning { font-size: 12.5px; color: var(--ink-soft); line-height: 1.5; }
.biz-card-foot {
  margin-top: auto; padding-top: 8px;
  border-top: 1px dashed var(--line);
  display: flex; justify-content: space-between; align-items: center;
  font-size: 10px; color: var(--ink-mute); font-weight: 700;
}
.biz-card-npc {
  display: inline-flex; align-items: center; gap: 5px;
}
.biz-card-npc-dot { width: 8px; height: 8px; border-radius: 50%; }
.biz-card.locked {
  background: repeating-linear-gradient(45deg, var(--paper-warm), var(--paper-warm) 8px, var(--paper) 8px, var(--paper) 16px);
  color: var(--ink-mute); cursor: not-allowed;
}
.biz-card.locked:hover { transform: none; box-shadow: 1px 1px 0 var(--paper-shadow); border-color: var(--line); }
.biz-card.locked .biz-card-word { color: var(--ink-mute); filter: blur(9px); user-select: none; letter-spacing: 0.05em; }
.biz-card.today {
  border: 2px solid var(--orange);
  background: linear-gradient(135deg, var(--cream) 0%, #FFF6E6 100%);
}

/* 필터 칩 */
.filter-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 18px; align-items: center; }
.filter-chip {
  padding: 7px 14px;
  border: 1px solid var(--line);
  background: var(--cream);
  font-size: 11.5px; font-weight: 700; color: var(--ink-soft);
  letter-spacing: -0.01em;
  transition: all 0.12s;
}
.filter-chip:hover { border-color: var(--ink); }
.filter-chip.active { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.filter-search {
  flex: 1; min-width: 180px;
  padding: 7px 12px;
  border: 1px solid var(--line);
  background: var(--cream);
  font-size: 12px; outline: none; color: var(--ink);
}
.filter-search:focus { border-color: var(--ink); }

/* ===== 시험 = 분기 평가 ===== */
.eval-wrap {
  background: var(--cream);
  border: 1.5px solid var(--ink);
  padding: 0;
  position: relative;
  box-shadow: 6px 6px 0 var(--ink);
}
.eval-head {
  background: var(--ink); color: var(--paper);
  padding: 14px 22px;
  display: flex; justify-content: space-between; align-items: center;
}
.eval-head-title { font-size: 13px; font-weight: 800; letter-spacing: 0.04em; }
.eval-head-sub { font-size: 10.5px; letter-spacing: 0.16em; color: var(--orange-soft); font-weight: 700; }
.eval-body { padding: 28px 32px; }
.eval-progress {
  display: grid; grid-auto-flow: column; grid-auto-columns: 1fr;
  gap: 4px; margin-bottom: 24px;
}
.eval-progress-cell {
  height: 6px; background: var(--paper-warm); border: 1px solid var(--line);
}
.eval-progress-cell.done { background: var(--green); border-color: var(--green); }
.eval-progress-cell.wrong { background: var(--stamp-red); border-color: var(--stamp-red); }
.eval-progress-cell.current { background: var(--orange); border-color: var(--orange); }

.eval-q-num {
  font-size: 11px; letter-spacing: 0.2em; font-weight: 800; color: var(--orange);
}
.eval-q-scene {
  margin-top: 8px; font-size: 14px; line-height: 1.65; color: var(--ink-soft);
  padding-bottom: 14px; border-bottom: 1px dashed var(--line);
}
.eval-options {
  display: flex; flex-direction: column; gap: 10px;
  margin-top: 18px;
}
.eval-option {
  text-align: left;
  padding: 14px 18px;
  border: 1.5px solid var(--line);
  background: #FBF9EF;
  font-size: 14px; line-height: 1.55; color: var(--ink);
  font-weight: 500;
  transition: all 0.12s;
}
.eval-option:hover { border-color: var(--ink); }
.eval-option.selected { border-color: var(--orange); background: #FFF6E6; }
.eval-option.correct { border-color: var(--green); background: rgba(74,124,89,0.08); }
.eval-option.wrong { border-color: var(--stamp-red); background: rgba(178,58,44,0.06); }
.eval-option-letter {
  display: inline-grid; place-items: center;
  width: 22px; height: 22px;
  background: var(--ink); color: var(--paper);
  font-weight: 800; font-size: 11px;
  margin-right: 12px; border-radius: 2px;
}

/* ===== 마이페이지 = 사원증 ===== */
.id-card {
  background: var(--cream);
  border: 1.5px solid var(--ink);
  width: 100%; max-width: 460px;
  margin: 0 auto;
  position: relative;
  box-shadow: 6px 6px 0 var(--ink);
}
.id-card-clip {
  width: 70px; height: 22px;
  background: var(--ink-mute);
  margin: -22px auto 0;
  border-radius: 4px 4px 0 0;
  position: relative;
}
.id-card-clip::after {
  content: ""; position: absolute; top: 6px; left: 50%; transform: translateX(-50%);
  width: 14px; height: 14px; background: var(--paper-warm); border-radius: 50%;
}
.id-card-strip {
  background: var(--ink); color: var(--paper);
  padding: 10px 22px;
  display: flex; justify-content: space-between; align-items: center;
  font-size: 10px; letter-spacing: 0.2em; font-weight: 800;
}
.id-card-strip b { color: var(--orange-soft); font-size: 12px; }
.id-card-body { padding: 28px 32px; display: grid; grid-template-columns: auto 1fr; gap: 24px; align-items: flex-start; }
.id-card-photo {
  width: 110px; height: 134px; background: var(--paper-warm);
  border: 1.5px solid var(--ink);
  display: grid; place-items: center;
  font-size: 56px; font-weight: 800; color: var(--ink);
  position: relative;
}
.id-card-photo::after {
  content: "PHOTO"; position: absolute; top: 6px; right: 6px;
  font-size: 8px; letter-spacing: 0.18em; font-weight: 800; color: var(--ink-mute);
}
.id-card-fields { font-size: 13px; }
.id-field { display: grid; grid-template-columns: 70px 1fr; gap: 10px; padding: 6px 0; border-bottom: 1px dashed var(--line); }
.id-field:last-child { border-bottom: none; }
.id-field-label { font-size: 10px; color: var(--ink-mute); letter-spacing: 0.16em; font-weight: 800; text-transform: uppercase; padding-top: 3px; }
.id-field-value { font-size: 13.5px; font-weight: 700; color: var(--ink); letter-spacing: -0.01em; }
.id-card-foot {
  border-top: 1px solid var(--ink);
  padding: 14px 22px;
  display: flex; justify-content: space-between; align-items: center;
  font-size: 11px; color: var(--ink-mute); font-weight: 700;
  background: var(--paper-warm);
}
.id-card-foot b { color: var(--orange); font-weight: 900; font-size: 13px; }

.badge-row {
  display: flex; gap: 8px; flex-wrap: wrap; margin-top: 18px;
}
.badge {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 6px 11px;
  border: 1px solid var(--orange);
  background: var(--orange-soft);
  color: var(--ink);
  font-size: 11px; font-weight: 800;
}
.badge::before {
  content: "★"; color: var(--orange); font-weight: 900;
}

/* HR 정보 시트 */
.hr-section {
  margin-top: 28px;
  background: var(--cream); border: 1px solid var(--line);
}
.hr-section-head {
  background: var(--paper-warm);
  padding: 10px 18px;
  font-size: 11px; letter-spacing: 0.18em; font-weight: 800; color: var(--ink-soft);
  text-transform: uppercase;
  border-bottom: 1px solid var(--line);
}
.hr-row {
  display: flex; justify-content: space-between; align-items: center;
  padding: 14px 18px;
  border-bottom: 1px dashed var(--line);
  font-size: 13px;
}
.hr-row:last-child { border-bottom: none; }
.hr-row-label { color: var(--ink-soft); font-weight: 600; }
.hr-row-value { font-weight: 800; color: var(--ink); }
.hr-row-value b { color: var(--orange); }

/* ============================================================
   유버디 = 버디 · 친근한 글로벌 코치 (1:1)
   ============================================================ */
.buddy-card {
  background: linear-gradient(180deg, #FFF7E8 0%, #FFEFD0 100%);
  border: 1.5px solid var(--ink);
  border-radius: 4px;
  padding: 14px 14px 12px;
  margin-bottom: 14px;
  position: relative;
  box-shadow: 3px 3px 0 var(--ink);
}
.buddy-card::before {
  content: "BUDDY · 1:1";
  position: absolute; top: -9px; left: 12px;
  background: var(--ink); color: var(--paper);
  font-size: 9.5px; font-weight: 800; letter-spacing: 0.18em;
  padding: 2px 7px;
}
.buddy-card-head {
  display: flex; gap: 10px; align-items: center; margin-bottom: 10px;
}
.buddy-avatar {
  width: 36px; height: 36px; border-radius: 50%;
  background: var(--ink); color: var(--paper);
  display: grid; place-items: center;
  font-size: 18px;
  flex-shrink: 0;
  border: 1.5px solid var(--ink);
}
.buddy-avatar.small { width: 28px; height: 28px; font-size: 14px; }
.buddy-meta { flex: 1; min-width: 0; }
.buddy-name { font-size: 13px; font-weight: 800; color: var(--ink); }
.buddy-online { font-size: 9.5px; color: var(--green); font-weight: 700; margin-left: 6px; letter-spacing: 0.05em; }
.buddy-role { font-size: 11px; color: var(--ink-mute); margin-top: 1px; }
.buddy-bubble {
  background: var(--paper);
  border: 1.2px solid var(--ink);
  padding: 11px 12px;
  font-size: 12.5px; line-height: 1.6;
  color: var(--ink-soft);
  border-radius: 12px 12px 12px 3px;
  position: relative;
}
.buddy-time {
  font-size: 10px; color: var(--ink-mute);
  margin-top: 6px; padding-left: 4px;
  letter-spacing: 0.04em;
}

/* MyPage 안의 버디 row */
.buddy-row {
  display: flex; gap: 12px; align-items: flex-start;
  padding: 14px 18px;
  border-bottom: 1px dashed var(--line);
}

/* SceneModal 안의 버디 채팅 */
.buddy-chat {
  margin-top: 16px;
  padding: 14px;
  background: #FFF7E8;
  border: 1.5px dashed var(--ink);
  border-radius: 4px;
}
.buddy-chat-head {
  display: flex; gap: 10px; align-items: center; margin-bottom: 10px;
}
.buddy-chat-log {
  display: flex; flex-direction: column; gap: 6px;
  margin-bottom: 10px; padding: 8px;
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: 4px;
  max-height: 180px; overflow-y: auto;
}
.buddy-msg {
  font-size: 12.5px; line-height: 1.65;
  padding: 10px 13px; border-radius: 10px;
  max-width: 88%;
  white-space: pre-wrap;       /* \n → 줄바꿈으로 렌더 */
  word-break: keep-all;
  overflow-wrap: anywhere;
}
.buddy-msg.me {
  align-self: flex-end;
  background: var(--ink); color: var(--paper);
  border-radius: 10px 10px 3px 10px;
  max-width: 75%;
}
.buddy-msg.buddy {
  align-self: flex-start;
  background: #FFE9A6; color: var(--ink);
  border-radius: 10px 10px 10px 3px;
}
.buddy-msg-row {
  display: flex; flex-direction: column; gap: 4px; max-width: 88%;
  align-self: flex-start;
}
.buddy-msg-row.me { align-self: flex-end; max-width: 75%; }
.buddy-msg-actions {
  display: flex; gap: 4px; align-self: flex-start; padding-left: 4px;
}
.buddy-msg-actions button {
  background: transparent; border: none;
  color: var(--ink-mute); font-size: 10.5px;
  cursor: pointer; font-family: inherit;
  padding: 2px 6px; border-radius: 4px;
  font-weight: 600;
}
.buddy-msg-actions button:hover { background: rgba(58,40,18,0.06); color: var(--ink); }
.buddy-msg-actions button.saved { color: #2D7A3D; font-weight: 800; }
.buddy-chat-quick {
  display: flex; flex-wrap: wrap; gap: 6px;
}
.quick-q {
  font-family: var(--font-sans);
  font-size: 11.5px; font-weight: 600;
  padding: 6px 10px;
  background: var(--paper);
  border: 1px solid var(--ink);
  border-radius: 14px;
  color: var(--ink);
  cursor: pointer;
  transition: all 0.15s;
}
.quick-q:hover {
  background: var(--ink); color: var(--paper);
}

/* MyPage 설정 디스클로저 */
.settings-toggle {
  font-family: inherit;
  background: var(--paper-warm);
  border: none;
  font-size: inherit;
  color: inherit;
}
.settings-toggle:hover { background: #F0E8D5; }
.settings-select {
  font-family: var(--font-sans);
  font-size: 12px; font-weight: 700;
  padding: 5px 10px;
  background: var(--paper);
  border: 1.2px solid var(--ink);
  border-radius: 3px;
  color: var(--ink);
  cursor: pointer;
}
.danger-zone-toggle {
  background: var(--paper-warm);
  font-family: inherit;
  font-size: inherit;
}
.danger-zone-toggle:hover { background: rgba(178,58,44,0.06); }

.toggle {
  width: 38px; height: 20px;
  border: 1.5px solid var(--ink);
  background: var(--paper-warm);
  position: relative;
  cursor: pointer;
}
.toggle::after {
  content: ""; position: absolute;
  top: 1px; left: 1px;
  width: 14px; height: 14px;
  background: var(--ink);
  transition: left 0.15s;
}
.toggle.on { background: var(--orange); border-color: var(--orange); }
.toggle.on::after { left: 19px; background: #fff; }

/* ===== 미니 인박스 ===== */
.inbox-list {
  background: var(--cream); border: 1px solid var(--line);
}
.inbox-row {
  display: grid; grid-template-columns: 36px 110px 1fr auto;
  gap: 12px; align-items: center;
  padding: 12px 18px;
  border-bottom: 1px dashed var(--line);
  font-size: 13px; cursor: pointer; text-align: left;
  width: 100%;
  background: transparent;
  transition: background 0.12s;
}
.inbox-row:hover { background: var(--paper); }
.inbox-row:last-child { border-bottom: none; }
.inbox-row.unread .inbox-subject { font-weight: 800; }
.inbox-from { font-size: 11.5px; color: var(--ink-soft); font-weight: 700; }
.inbox-subject { font-size: 13px; color: var(--ink); line-height: 1.4; }
.inbox-subject small { color: var(--ink-mute); font-weight: 500; margin-left: 8px; font-size: 11.5px; }

function _afternoonForDay(day) {
  if (_AFTERNOON_TASKS[day]) return _AFTERNOON_TASKS[day];

  const days = Object.keys(_AFTERNOON_TASKS).map(Number).sort((a,b) => b-a);
  const match = days.find(d => d <= day);
  return _AFTERNOON_TASKS[match] || _AFTERNOON_TASKS[1];
}

function getScheduleForDay(day) {
  // ★ 시즌 2: Day 30 = 수습 평가, Day 60 = 특별 면담. 그 사이(31-59)는 일반 학습일.
  const isLastDay = day === 30 || day >= 60;
  const isDay60 = day >= 60;
  const lunch = _lunchForDay(day);
  const afternoonTask = _afternoonForDay(day);
  const morningTone = _MORNING_TONES[(day - 1) % _MORNING_TONES.length];
  const missionCtx = _MISSION_CONTEXTS[(day - 1) % _MISSION_CONTEXTS.length];

  // Day별 변동 활동: mini_mission → english_lunch → recap → office_task 순환
  // (P5 contextual variability, 매일 다른 맥락으로 표현 만남)
  const VARIANT_ROTATION = ["mini_mission", "english_lunch", "recap", "office_task"];
  const variantType = VARIANT_ROTATION[(day - 1) % VARIANT_ROTATION.length];

  const variantItem = (() => {
    switch (variantType) {
      case "mini_mission":
        return {
          id: "mission", time: "14:00", type: "mini_mission",
          title: "미니 미션, 오늘 표현 써먹기",
          note: missionCtx.ctx + "에 한 줄",
          context: missionCtx,
        };
      case "english_lunch":
        return {
          id: "lunch", time: "12:30", type: "english_lunch",
          title: lunch.who + "와 점심",
          note: "한영 믹스 small talk",
          context: lunch,
        };
      case "recap":
        return {
          id: "recap", time: "15:30", type: "recap",
          title: "오늘 표현 Recap (10초 퀴즈)",
          note: "4지선다 빠른 복습",
        };
      case "office_task":
      default:
        return {
          id: "afternoon", time: "14:00", type: "office_task",
          title: "오후 업무",
          action: afternoonTask,
        };
    }
  })();

  // 4개 고정 슬롯, 출근+단어 / 시추에이션 / Day별 변동 / 일지+퇴근
  return [
    {
      id: "checkin", time: "09:00", type: "checkin",
      title: day === 1 ? "출근 + 사번 받기 + 오늘의 단어" : "출근 + 오늘의 단어 도착",
      note: morningTone,
      action: day === 1
        ? "사옥 도착 ✓ · 사번 발급 ✓ · 사수가 노란 포스트잇 줬어 ↗"
        : "출근 도장 ✓ · 사수가 오늘의 단어 줬어 ↗",
    },
    {
      id: "scenario", time: "10:00", type: "scenario",
      title: "오늘의 시추에이션",
      note: "← 클릭해서 시작",
      action: null,
    },
    variantItem,
    {
      id: "wrapup", time: "17:00", type: "journal",
      title: isDay60 ? "특별 면담 + 업무일지 + 퇴근" : (isLastDay ? "수습 평가 + 업무일지 + 퇴근" : "업무일지 작성 + 퇴근"),
      note: "오늘 한 줄 + 유버디 응원",
      action: null,
      isLastDay,
    },
  ];
}

    try { return JSON.parse(localStorage.getItem(taskKey) || "{}"); } catch(e) { return {}; }
  });

  // ★ Day 2 진입 시 1일차 후기 설문 모달 표시 (한 사용자당 1회)
  const [showSurvey, setShowSurvey] = useState(false);
  React.useEffect(() => {
    if (!USER.email) return;
    if (USER.currentDay !== 2) return;
    const SURVEY_KEY = "__OD_SURVEY_DAY1_DONE_" + USER.email;
    try { if (localStorage.getItem(SURVEY_KEY) === "1") return; } catch(e) { return; }
    // 페이지 로드 후 2.5초 정도 뒤에 표시 (화면 한번 본 후)
    const t = setTimeout(() => setShowSurvey(true), 2500);
    return () => clearTimeout(t);
  }, [USER.email, USER.currentDay]);

  const closeSurvey = () => {
    setShowSurvey(false);
    try {
      const SURVEY_KEY = "__OD_SURVEY_DAY1_DONE_" + (USER.email || "");
      localStorage.setItem(SURVEY_KEY, "1");
    } catch(e) {}
  };
  // ★ 날짜 바뀌면 (viewingDay 변경) doneTasks 도 그날 키 기준으로 다시 로드.
  // 이전 날짜의 state 가 다음 날짜 키에 잘못 저장되는 버그 방지.
  React.useEffect(() => {
    try {
      setDoneTasks(JSON.parse(localStorage.getItem(taskKey) || "{}"));
    } catch(e) { setDoneTasks({}); }
    // 열려있던 활동 모달도 닫음 (이전 day 활동 잔재 방지)
    setActiveItem(null);
  }, [taskKey]);
  // ★ 피드백 #15: SceneModal 등 외부에서 일정 완료가 바뀌면 즉시 다시 읽기 (재진입 불필요)
  React.useEffect(() => {
    const onChanged = () => {
      try { setDoneTasks(JSON.parse(localStorage.getItem(taskKey) || "{}")); } catch(e) {}
    };
    window.addEventListener("od-tasks-changed", onChanged);
    return () => window.removeEventListener("od-tasks-changed", onChanged);
  }, [taskKey]);
  const [toast, setToast] = useState(null);
  const [activeItem, setActiveItem] = useState(null); // todo 클릭 → 어휘 활동 모달
  const showToast = (msg, ms) => {
    setToast(msg);
    setTimeout(() => setToast(null), ms || 2400);
  };

  // 투어 (spotlight 엔진 공유): Day 1 첫 출근 가이드 + 시즌 2 정직원 모드 가이드
  const TOUR_KEY = "__OD_TOUR_DONE_DAY_" + USER.currentDay;
  const S2_TOUR_KEY = "__OD_S2_TOUR_DONE_" + (USER.email || "guest");
  // ★ 어떤 투어를 돌릴지: 승급 직후(또는 정직원인데 아직 못 봄) → s2, Day 1 첫 방문 → day1
  const [tourKind] = useState(() => {
    try {
      if (USER.isFulltime && !USER.isViewingPast && !localStorage.getItem(S2_TOUR_KEY)) return "s2";
      if (USER.currentDay === 1 && !localStorage.getItem(TOUR_KEY)) return "day1";
    } catch(e) {}
    return null;
  });
  const [tourStep, setTourStep] = useState(() => (tourKind ? 0 : -1));
  const TOUR_STEPS_S2 = [
    {
      selector: null,
      title: "정직원 전환, 사원이 됐어요 👔",
      body: "승진 축하해요! 수습 떼고 사원(Associate) 됐어요. 30초만 같이 둘러봐요, 책상이 어떻게 달라졌는지.",
    },
    {
      selector: ".s2-welcome",
      placement: "left",
      title: "사원 마일스톤 카드",
      body: "Day 60 특별 면담까지의 여정이 여기 담겨요. 🌱37 → ⚡44 → 🔥51 → 🌟60. 접어두면 슬림 바로 D-day만 보여요.",
    },
    {
      selector: ".attendance",
      placement: "left",
      title: "출근부가 60일로 늘었어요",
      body: "기본은 최근 14일 창, '전체 보기'를 누르면 60일 전체가 펼쳐져요. 놓친 날은 점선 칸을 눌러 따라잡을 수 있어요.",
    },
    {
      selector: ".scene-card",
      placement: "right",
      title: "시즌 2 단어는 더 묵직해요",
      body: "지금까지가 '알아듣는' 단어였다면, 이제는 회의를 주도하고 의사결정에 쓰는 표현이에요. escalate, own the room 같은.",
    },
    {
      selector: ".locker-link, .m-tab",
      placement: "right",
      title: "🎁 보상: 나만의 노트 모아보기",
      body: "사원이 되면 '나만의 노트' 탭이 열려요. 그동안 유버디한테 물어보고 저장한 답변들을 단어별로 모아서 검색하고 복습할 수 있어요. 수습 때 저장한 것도 전부 여기 모입니다.",
    },
    {
      selector: null,
      title: "사원증도 새로 나왔어요 🪪",
      body: "사원증 탭에 가면 네이비 사원(Associate) 사원증과 '정직원 전환 🎉' 뱃지가 기다려요. 그럼, 오늘 단어부터 시작할까요?",
      cta: "사원 첫 학습 시작 →",
    },
  ];
  const TOUR_STEPS_DAY1 = [
    {
      selector: null,
      title: "오늘부터 첫 출근이에요 🎉",
      body: "5초만 둘러볼게요. 어디서 뭘 누르면 되는지, 그러고 나서 출근 도장 찍으러 가요.",
    },
    {
      selector: ".scene-card",
      placement: "right",
      title: "오늘의 시추에이션",
      body: "왼쪽 큰 카드 = 단어 + NPC가 던진 상황 + 한 줄 미션. 클릭하면 영작 활동이 열려요. 사수 피드백까지 들어와요.",
    },
    {
      selector: ".schedule",
      placement: "right",
      title: "오늘 일정, 9시부터 차례대로",
      body: "9시 출근 → 10시 시추에이션 → 14시 미션 → 17시 퇴근. 각 항목 클릭하면 어휘 연습 활동이 열려요. 위에서부터 한 칸씩 풀어가세요. 잠금된 건 이전 항목 끝나면 풀려요.",
    },
    {
      selector: ".empty-postit, .postit",
      placement: "left",
      title: "여긴 처음엔 비어있어요",
      body: "출근 도장 찍으면 사수가 노란 메모를, 시추에이션 풀면 유버디가 한 마디를 여기에 떨어뜨려요. 활동 풀수록 책상이 채워져요.",
    },
    {
      selector: ".attendance",
      placement: "left",
      title: "출근부 · 14일",
      body: "오늘 일정 다 끝내면 '오늘' 칸에 빨간 출근 도장이 찍혀요. 30일 되면 정규직 승진이 기다리고 있을지도 ✨",
    },
    {
      selector: ".schedule-row.now",
      placement: "right",
      title: "자, 시작! 👇",
      body: "09:00 '출근 + 단어 받기' 가 첫 활동이에요. 누르면 오늘 단어가 도착해요.",
      cta: "출근 도장 찍으러 가자 →",
    },
  ];
  const TOUR_STEPS = tourKind === "s2" ? TOUR_STEPS_S2 : TOUR_STEPS_DAY1;
  const closeTour = () => {
    setTourStep(-1);
    try {
      if (tourKind === "s2") localStorage.setItem(S2_TOUR_KEY, "1");
      else localStorage.setItem(TOUR_KEY, "1");
    } catch(e) {}
  };

  // 타겟 요소 위치 추적, tourStep 바뀔 때마다 측정 + scroll into view
  const [targetRect, setTargetRect] = useState(null);
  useEffect(() => {
    if (tourStep < 0 || tourStep >= TOUR_STEPS.length) {
      setTargetRect(null);
      return;
    }
    const step = TOUR_STEPS[tourStep];
    if (!step.selector) {
      setTargetRect(null);
      return;
    }
    let raf, cancelled = false;
    const measure = () => {
      if (cancelled) return;
      const el = document.querySelector(step.selector);
      if (!el) { setTargetRect(null); return; }
      const r = el.getBoundingClientRect();
      setTargetRect({ left: r.left, top: r.top, width: r.width, height: r.height });
    };
    const el0 = document.querySelector(step.selector);
    if (el0) {
      try { el0.scrollIntoView({ behavior: "smooth", block: "center" }); } catch(e) {}
    }
    let count = 0;
    const tick = () => {
      measure();
      count++;
      if (count < 40 && !cancelled) raf = requestAnimationFrame(tick);
    };
    tick();
    const onResize = () => measure();
    window.addEventListener("resize", onResize);
    window.addEventListener("scroll", onResize, true);
    return () => {
      cancelled = true;
      if (raf) cancelAnimationFrame(raf);
      window.removeEventListener("resize", onResize);
      window.removeEventListener("scroll", onResize, true);
    };
  }, [tourStep]);

  // === 모든 hooks 끝난 후, 데이터 lookup + 안전장치 early return ===
  const today = SCENARIOS.find(s => s.day === USER.workingDay);
  const npc = today ? CHARACTERS[today.npc] : null;

  if (!today) {
    return (
      <div style={{ padding: 60, textAlign: "center", color: "var(--ink-mute)", fontSize: 14, lineHeight: 1.7 }}>
        <div style={{ fontSize: 32, marginBottom: 16 }}>🌅</div>
        <div style={{ fontSize: 16, fontWeight: 700, color: "var(--ink)", marginBottom: 8 }}>
          오늘은 새 단어가 없는 날이에요
        </div>
        Day {USER.currentDay}, 단어 카드는 Day 1-30번까지에요.<br/>
        Dev panel에서 다른 Day로 점프해보세요.
      </div>
    );
  }

  // 출근부 그리드. 기본 14일, "전체 보기" 토글하면 코스 전체 (30일).
  // ★ 실제로 학습 완료한 날만 done. 안 한 날은 missed (결근). 무조건 done 처리 금지.
  // 완료 판단 기준 (셋 중 하나라도 만족하면 출근 인정):
  //   1. scenariosCompleted 에 그날 entry 있음 (시추에이션 문장 제출)
  //   2. dailyJournals 에 그날 entry 있음 (업무일지 제출)
  //   3. __OD_TASKS_DAY_<day> 에 활동 3개 이상 체크됨 (대부분 일정 완료)
  // 과거일 클릭하면 ?day=N URL로 이동해서 그날 학습 가능 (저장은 그날 기준 정확히)
  const [showFullAttend, setShowFullAttend] = useState(false);
  // ★ 시즌 2: 정직원 마일스톤 카드 (닫기가 아니라 접기, 수시로 펼쳐볼 수 있음)
  const _S2_CARD_KEY = "__OD_S2_WELCOME_DISMISSED_" + (USER.email || "guest");
  const [s2CardCollapsed, setS2CardCollapsed] = useState(() => {
    try { return localStorage.getItem(_S2_CARD_KEY) === "1"; } catch (e) { return false; }
  });
  const toggleS2Card = () => {
    setS2CardCollapsed(v => {
      try { localStorage.setItem(_S2_CARD_KEY, v ? "0" : "1"); } catch (e) {}
      return !v;
    });
  };
  // ★ 기본은 "최근 14일" 슬라이딩 창. Day가 늘어나도(시즌 2, 60일) 출근부 높이 고정.
  //   전체 보기 토글 시 코스 전체 (수습 30 / 정직원 60).
  const _realCurrentDay = USER.realCurrentDay || USER.currentDay || 1;
  const _attendEnd = showFullAttend
    ? USER.totalDays
    : Math.min(USER.totalDays, Math.max(14, _realCurrentDay));
  const _attendStart = showFullAttend ? 1 : Math.max(1, _attendEnd - 13);
  const allTodayDone = TODAY_SCHEDULE.length > 0 && TODAY_SCHEDULE.every(t => doneTasks[t.id]);
  // ★ 출근 완성 = 그날 4개 일정 모두 완료. 늦은 인증 = 완료했지만 해당일 이후.
  const _signupDate = _localUser?.signupDate ? new Date(_localUser.signupDate) : null;
  const _dayDeadline = (day) => {
    if (!_signupDate || isNaN(_signupDate.getTime())) return null;
    const d = new Date(_signupDate); d.setHours(0, 0, 0, 0);
    d.setDate(d.getDate() + day); // day N 다음날 자정 = 그날 마감
    return d.getTime();
  };
  // day별 가장 늦은 완료 시각 (영작·일지 기준, 늦은 인증 판정용)
  const _lastAt = {};
  (USER.scenariosCompleted || []).forEach(s => {
    if (s && s.day && s.submittedAt) {
      const t = new Date(s.submittedAt).getTime();
      if (!_lastAt[s.day] || t > _lastAt[s.day]) _lastAt[s.day] = t;
    }
  });
  Object.entries(USER.dailyJournals || {}).forEach(([k, j]) => {
    const day = parseInt(k, 10);
    if (day && j && j.savedAt) {
      const t = new Date(j.savedAt).getTime();
      if (!_lastAt[day] || t > _lastAt[day]) _lastAt[day] = t;
    }
  });
  // 그날 4개 일정 모두 완료했는지
  const _dayComplete = (day) => {
    try {
      const tasks = JSON.parse(localStorage.getItem("__OD_TASKS_DAY_" + day) || "{}");
      return Object.values(tasks).filter(Boolean).length >= 4;
    } catch (e) { return false; }
  };
  // 일정(task) 완료 시각 (영작·일지 외에 일정만 늦게 채운 경우도 잡음)
  const _taskTs = (day) => {
    try {
      const v = localStorage.getItem("__OD_TASKS_DAY_" + day + "_ts");
      return v ? new Date(v).getTime() : null;
    } catch (e) { return null; }
  };
  const _isLate = (day) => {
    const dl = _dayDeadline(day);
    if (!dl) return false;
    const at = Math.max(_lastAt[day] || 0, _taskTs(day) || 0);
    return !!(at && at > dl);
  };
  // ★ 실제 오늘 기준으로 today 판정 (과거 보는 중에도 진짜 오늘만 "오늘" 표시)
  const _realDay = USER.realCurrentDay || USER.currentDay;
  const _realDayDone = (_realDay === USER.currentDay) ? allTodayDone : _dayComplete(_realDay);
  const cells = Array.from({ length: _attendEnd - _attendStart + 1 }, (_, i) => {
    const day = _attendStart + i;
    const isWk = _isWeekendDay(day);
    if (day === _realDay) return { day, state: _realDayDone ? "stamped" : "today", weekend: isWk };
    if (day < _realDay) {
      if (_dayComplete(day)) return { day, state: _isLate(day) ? "late" : "done", weekend: isWk };
      return { day, state: "missed", weekend: isWk };
    }
    return { day, state: "future", weekend: isWk };
  });

  // 마지막 항목 완료 토스트
  const _maybeFinaleToast = (idx) => {
    if (idx === TODAY_SCHEDULE.length - 1) {
      setTimeout(() => showToast("🎊 Day " + USER.currentDay + " 완주! 내일 또 봐요.", 4000), 200);
    }
  };

  // 항목별 클릭 처리, scenario는 SceneModal로 (즉시 done), 나머지는 ActivityModal로 (활동 완료해야 done)
  const handleScheduleClick = (item, idx) => {
    if (doneTasks[item.id]) {
      // 이미 끝낸 활동도 한 번 더 풀어볼 수 있게 모달은 열어줌 (done 상태 유지)
      if (item.id !== "scenario" && item.type !== "scenario") {
        setActiveItem({ item, idx, replay: true });
      } else {
        openScene(today);
      }
      return;
    }
    const prevDone = idx === 0 || doneTasks[TODAY_SCHEDULE[idx-1].id];
    if (!prevDone) {
      showToast("⏳ 이전 항목 먼저 끝내주세요");
      return;
    }

    if (item.id === "scenario") {
      // 시추에이션, 기존 SceneModal 유지. 클릭 즉시 done 처리.
      const next = { ...doneTasks, [item.id]: true };
      setDoneTasks(next);
      try { localStorage.setItem(taskKey, JSON.stringify(next)); localStorage.setItem(taskKey + "_ts", new Date().toISOString()); } catch(e) {}
      // ★ cross-device 동기화
      if (window.OD?.enabled && window.OD.saveTaskProgress && USER.email) {
        window.OD.saveTaskProgress(USER.email, USER.currentDay, next).catch(() => {
          window.OD.pushOutbox?.({ type: 'task', email: USER.email, day: USER.currentDay, tasks: next });
        });
      }
      openScene(today);
      _maybeFinaleToast(idx);
      return;
    }

    // 그 외 활동은 ActivityModal, 활동 끝나야 done
    setActiveItem({ item, idx, replay: false });
  };

  // ActivityModal 완료 핸들러, 처음 완료할 때만 doneTasks에 기록
  const completeActivity = () => {
    if (!activeItem) return;
    const { item, idx, replay } = activeItem;
    if (!replay && !doneTasks[item.id]) {
      const next = { ...doneTasks, [item.id]: true };
      setDoneTasks(next);
      try { localStorage.setItem(taskKey, JSON.stringify(next)); localStorage.setItem(taskKey + "_ts", new Date().toISOString()); } catch(e) {}
      // ★ cross-device 동기화
      if (window.OD?.enabled && window.OD.saveTaskProgress && USER.email) {
        window.OD.saveTaskProgress(USER.email, USER.currentDay, next).catch(() => {
          window.OD.pushOutbox?.({ type: 'task', email: USER.email, day: USER.currentDay, tasks: next });
        });
      }
      _maybeFinaleToast(idx);
    } else {
      showToast("👍 다시 풀어봤어요, 표현이 더 자연스러워질 거예요");
    }
    setActiveItem(null);
  };

  // 각 항목의 computed status
  const scheduleWithStatus = TODAY_SCHEDULE.map((item, i) => {
    if (doneTasks[item.id]) return { ...item, computed: "done" };
    const prevDone = i === 0 || doneTasks[TODAY_SCHEDULE[i-1].id];
    return { ...item, computed: prevDone ? "now" : "locked" };
  });

  return (
    <div>
      <div className="desk-header">
        <div>
          <div className="desk-eyebrow">
            {todayLabel} · DAY {USER.currentDay} / {USER.totalDays} · <span style={{ color: "var(--orange)" }}>수집 표현 {USER.wordsCollected}</span>
          </div>
          <h1 className="desk-title"><em>오늘의</em> 책상 위</h1>
        </div>
        <div className="desk-meta">
          <b>{USER.name}</b> · {USER.position}<br/>
          {USER.team}
        </div>
      </div>

      <ApplicationLine />

      <div className="desk-grid">
        <div className="col">
          <SceneCard
            scenario={today}
            npc={npc}
            onOpen={() => openScene(today)}
            checkinDone={!!doneTasks.checkin}
            onStartDay={() => handleScheduleClick(scheduleWithStatus[0], 0)}
          />

          <div className="schedule">
            <div className="schedule-head">
              <span>오늘 일정 · DAY {USER.currentDay}</span>
              <span style={{ color: "var(--orange)" }}>● 진행 중</span>
            </div>
            {scheduleWithStatus.map((row, i) => (
              <div
                key={row.id}
                className={"schedule-row " + row.computed}
                onClick={() => row.computed !== "locked" && handleScheduleClick(row, i)}
                style={{
                  cursor: row.computed === "locked" ? "not-allowed" : "pointer",
                  opacity: row.computed === "locked" ? 0.4 : 1,
                  transition: "all 0.15s",
                }}
              >
                <span className="schedule-time">{row.time}</span>
                <span>
                  <span className="schedule-title" style={{ textDecoration: row.computed === "done" ? "line-through" : "none" }}>{row.title}</span>
                  {row.note ? <div className="schedule-note">{row.note}</div> : null}

                      onClick={() => setTourStep(tourStep - 1)}
                      style={{
                        background: "transparent", border: "none", color: "var(--ink-mute)",
                        fontSize: 12, cursor: "pointer", fontFamily: "inherit",
                      }}
                    >← 이전</button>
                  )}
                </div>
                <button
                  onClick={() => isLast ? closeTour() : setTourStep(tourStep + 1)}
                  style={{
                    background: "#D85A2A", color: "#FFFFFF", border: "none",
                    padding: "12px 22px", borderRadius: 8,
                    fontSize: 13, fontWeight: 800, cursor: "pointer", fontFamily: "inherit",
                    boxShadow: "0 4px 12px rgba(216,90,42,0.35)",
                    letterSpacing: "0.01em",
                  }}
                >
                  {isLast ? (step.cta || "시작하기 ✓") : "다음 →"}
                </button>
              </div>
            </div>
          </>
        );
      })()}

      <style>{`
        @keyframes fadeUp { from { opacity: 0; transform: translate(-50%, 12px); } to { opacity: 1; transform: translate(-50%, 0); } }
        .schedule-row.now { background: rgba(216,90,42,0.08); border-left: 3px solid var(--accent); }
        .schedule-row.now:hover { background: rgba(216,90,42,0.14); }
        .schedule-row.done { background: rgba(45,138,62,0.04); }
        .schedule-row.locked { background: transparent; }
        .schedule-status.done { color: #2D8A3E; font-weight: 700; }
        .schedule-status.now { color: var(--accent); font-weight: 800; animation: blink 1.5s ease-in-out infinite; }
        .schedule-status.locked { color: var(--ink-mute); opacity: 0.6; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.55; } }

        /* === 인터랙티브 투어, spotlight + 펄스 === */
        .tour-dim {
          position: fixed; background: rgba(42,31,20,0.55);
          z-index: 9100; transition: all 0.35s cubic-bezier(.4,.6,.3,1);
        }
        .tour-spotlight {
          border-radius: 12px;
          border: 2.5px solid var(--orange);
          z-index: 9150;
          transition: all 0.35s cubic-bezier(.4,.6,.3,1);
          animation: tourPulse 1.6s ease-in-out infinite;
        }
        @keyframes tourPulse {
          0%, 100% { box-shadow: 0 0 0 4px rgba(216,90,42,0.25), 0 0 24px rgba(216,90,42,0.4); }
          50%      { box-shadow: 0 0 0 12px rgba(216,90,42,0.08), 0 0 32px rgba(216,90,42,0.55); }
        }

        /* === 출근 인증 도장, 오늘 일정 다 끝내면 빨간 도장 === */
        .att-cell.stamped {
          background: rgba(178,58,44,0.06);
          border-color: var(--stamp-red);
          color: var(--stamp-red);
          font-weight: 900;
          position: relative;
          animation: stampPlace 0.65s cubic-bezier(.3,1.6,.4,1) both;
        }
        .att-cell.stamped {
          overflow: visible;  /* 도장 회전 시 글자 잘림 방지 */
        }
        .att-cell.stamped::after {
          content: "출근";
          position: absolute; inset: 1px;
          display: flex; align-items: center; justify-content: center;
          font-size: 9px; font-weight: 900; letter-spacing: 0;
          color: var(--stamp-red);
          border: 2px solid var(--stamp-red);
          border-radius: 5px;
          transform: rotate(-6deg);
          background: rgba(178,58,44,0.06);
          white-space: nowrap;
          padding: 0 2px;
          line-height: 1;
          box-sizing: border-box;
          animation: stampInk 0.45s cubic-bezier(.4,1.6,.36,1) 0.2s both;
        }
        /* 모바일 좁은 화면에선 더 작게 */
        @media (max-width: 600px) {
          .att-cell.stamped::after { font-size: 8px; padding: 0 1px; }
        }
        @keyframes stampPlace {
          from { transform: scale(1.18); }
          to   { transform: scale(1); }
        }
        @keyframes stampInk {
          0%   { opacity: 0; transform: rotate(-25deg) scale(1.8); }
          60%  { opacity: 1; transform: rotate(-4deg) scale(0.94); }
          100% { opacity: 1; transform: rotate(-8deg) scale(1); }
        }

        /* todo 완료 시 등장 애니메이션 */
        @keyframes postitDrop {
          0%   { opacity: 0; transform: translateY(-32px) rotate(-12deg) scale(0.86); }
          55%  { opacity: 1; transform: translateY(6px)   rotate(-1deg)  scale(1.03); }
          75%  { transform: translateY(-2px) rotate(0deg) scale(0.99); }
          100% { opacity: 1; transform: translateY(0)    rotate(-1deg)  scale(1); }
        }
        @keyframes buddySlide {
          0%   { opacity: 0; transform: translateX(36px) scale(0.96); }
          100% { opacity: 1; transform: translateX(0)    scale(1); }
        }
        .appear-postit { animation: postitDrop 0.75s cubic-bezier(.22,1.4,.36,1) both; transform-origin: top center; }
        .appear-buddy  { animation: buddySlide  0.55s ease-out both; }

        /* 비어있는 슬롯, todo 완료 전 placeholder */
        .empty-slot {
          padding: 18px 18px;
          margin-bottom: 14px;
          border: 1.5px dashed var(--line);
          border-radius: 8px;
          background: rgba(255,255,255,0.25);
          color: var(--ink-mute);
          font-size: 12px;
          line-height: 1.55;
          text-align: center;
          letter-spacing: 0.01em;
          transition: opacity 0.2s;
        }
        .empty-slot:hover { opacity: 0.75; }
        .empty-postit { background: rgba(255,233,166,0.18); border-color: rgba(216,180,90,0.35); }
        .empty-buddy  { background: rgba(216,90,42,0.04); border-color: rgba(216,90,42,0.22); }
      `}</style>
    </div>
  );
}

/* global React */

// ============================================================
// 업무 노트 = 라이브러리
// ============================================================
// ============================================================
// 📒 나만의 노트 모아보기 (정직원 승급 보상, 피드백 #6 김원미)
// 저장한 버디 답변(savedNotes)을 한 페이지에서 검색·필터·모아보기
// ============================================================
function MyNotesPage({ openScene }) {
  const { SCENARIOS, USER } = window.__SIM;
  const [kindFilter, setKindFilter] = useState("all");
  const [search, setSearch] = useState("");
  const [editKey, setEditKey] = useState(null);   // "day:origText" 편집 중인 노트
  const [editText, setEditText] = useState("");
  const [tick, setTick] = useState(0);             // 편집 후 리렌더 트리거

  // ★ 노트 수정 (학습·복습용): localStorage 즉시 반영 + DB best-effort 업서트
  const updateNote = (day, origText, newText) => {
    const t = (newText || "").trim();
    if (!t) return;
    try {
      const u = JSON.parse(localStorage.getItem("__OD_USER") || "null") || {};
      u.savedNotes = u.savedNotes || {};
      const arr = u.savedNotes[String(day)] || [];
      const idx = arr.findIndex(n => n.text === origText);
      if (idx >= 0) {
        arr[idx] = { ...arr[idx], text: t, editedAt: new Date().toISOString() };
        u.savedNotes[String(day)] = arr;
        localStorage.setItem("__OD_USER", JSON.stringify(u));
        // DB에도 수정본 저장 (1row=1note, 텍스트 변경분 반영)
        if (window.OD?.enabled && window.OD.saveNoteRow && u.email) {
          window.OD.saveNoteRow(u.email, Number(day), t, arr[idx].label || null, arr[idx].kind || null).catch(() => {});
        }
      }
    } catch (e) {}
    setEditKey(null);
    setTick(x => x + 1);
  };

  // ★ 인쇄 / PDF 저장: 깨끗한 새 창을 열어 노트만 출력 (한글 폰트 안전)
  const printNotes = (notes) => {
    const KIND = { nuance: "뉘앙스", example: "예문", default: "외우는 팁" };
    const esc = (s) => String(s || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    const rows = notes.map(n => `
      <div class="note">
        <div class="head"><span class="word">${esc(n.word)}</span> <span class="mean">${esc(n.meaning)}</span> <span class="tag">${KIND[n.kind] || esc(n.label)} · DAY ${n.day}</span></div>
        <div class="body">${esc(n.text).replace(/\n/g, "<br/>")}</div>
      </div>`).join("");
    const w = window.open("", "_blank");
    if (!w) { alert("팝업이 차단됐어요. 팝업을 허용하면 PDF로 저장할 수 있어요."); return; }
    w.document.write(`<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>나만의 노트 · ${esc(USER.name)}</title>
      <style>
        body { font-family: -apple-system, 'Noto Sans KR', sans-serif; color: #2A1F14; padding: 32px; line-height: 1.6; }
        h1 { font-size: 20px; margin: 0 0 4px; }
        .sub { color: #8A7A66; font-size: 12px; margin-bottom: 20px; }
        .note { border: 1px solid #E2D8C4; border-left: 3px solid #D85A2A; border-radius: 8px; padding: 12px 14px; margin-bottom: 10px; page-break-inside: avoid; }
        .head { font-size: 13px; margin-bottom: 6px; }
        .word { font-weight: 800; font-size: 15px; }
        .mean { color: #8A7A66; }
        .tag { float: right; font-size: 10px; color: #D85A2A; font-weight: 700; }
        .body { font-size: 12.5px; color: #4A3C2E; white-space: pre-wrap; }
        @media print { body { padding: 0; } }
      </style></head><body>
      <h1>📒 ${esc(USER.name)}님의 나만의 노트</h1>
      <div class="sub">1일1비 · 저장한 표현 ${notes.length}개 · ${new Date().toLocaleDateString("ko-KR")}</div>
      ${rows}
      <script>window.onload = function(){ setTimeout(function(){ window.print(); }, 300); };<\/script>
      </body></html>`);
    w.document.close();
  };

  // 정직원 잠금 화면 (수습은 미리보기 + 동기부여)
  if (!USER.isFulltime) {
    return (
      <div>
        <div className="desk-header">
          <div>
            <div className="desk-eyebrow">RECORDS · 나만의 노트 (잠김)</div>
            <h1 className="desk-title"><em>사원</em> 전용 보관함</h1>
          </div>
        </div>
        <div style={{
          marginTop: 24, padding: "40px 28px", textAlign: "center",
          background: "var(--cream)", border: "1.5px dashed var(--line)", borderRadius: 12,
        }}>
          <div style={{ fontSize: 42, marginBottom: 14, filter: "grayscale(0.3)" }}>🔒</div>
          <h2 style={{ fontSize: 19, fontWeight: 900, color: "var(--ink)", marginBottom: 12, lineHeight: 1.4 }}>
            저장한 노트를 한곳에 모아보는 기능,<br/>사원으로 승급하면 열려요
          </h2>
          <p style={{ fontSize: 13.5, color: "var(--ink-soft)", lineHeight: 1.75, marginBottom: 18, maxWidth: 420, margin: "0 auto 18px" }}>
            유버디한테 물어보고 "📒 노트에 저장" 한 답변들을, 단어별로 묶어 검색하고 복습할 수 있는 나만의 보관함이에요.
            수습 30일을 완주하고 정직원 전환(사원)하면 보상으로 열립니다.
          </p>
          <div style={{
            display: "inline-block", background: "var(--paper-warm)", border: "1px solid var(--line)",
            borderRadius: 8, padding: "10px 16px", fontSize: 12.5, color: "var(--ink-soft)",
          }}>
            지금까지 저장한 노트는 <b style={{ color: "var(--ink)" }}>안전하게 보관 중</b>이에요. 승급하면 전부 여기 모여요.
          </div>
        </div>
      </div>
    );
  }

  // 전체 노트 평탄화 (tick 바뀌면 재계산)
  let allNotes = [];
  void tick;
  try {
    const u = JSON.parse(localStorage.getItem("__OD_USER") || "null");
    const byDay = (u && u.savedNotes) || {};
    Object.keys(byDay).forEach(dayKey => {
      const sc = SCENARIOS.find(s => s.day === Number(dayKey));
      (byDay[dayKey] || []).forEach(n => {
        allNotes.push({
          day: Number(dayKey),
          word: sc ? sc.word : "",
          meaning: sc ? sc.meaning : "",
          npc: sc ? sc.npc : null,
          kind: n.kind || "default",
          label: n.label || "메모",
          text: n.text || "",
          savedAt: n.savedAt || null,
        });
      });
    });
  } catch (e) {}
  allNotes.sort((a, b) => b.day - a.day);

  const KIND_LABEL = { nuance: "뉘앙스", example: "예문", default: "외우는 팁" };
  const kinds = [...new Set(allNotes.map(n => n.kind))];
  const filtered = allNotes.filter(n => {
    if (kindFilter !== "all" && n.kind !== kindFilter) return false;
    if (search) {
      const q = search.toLowerCase();
      if (!n.text.toLowerCase().includes(q) && !n.word.toLowerCase().includes(q) && !(n.meaning || "").includes(search)) return false;
    }
    return true;
  });

  return (
    <div>
      <div className="desk-header">
        <div>
          <div className="desk-eyebrow">RECORDS · 나만의 노트 (My Notes)</div>
          <h1 className="desk-title"><em>내가 저장한</em> 표현 모음</h1>
        </div>
        <div className="desk-meta"><b>{allNotes.length}</b>개 저장 · {new Set(allNotes.map(n => n.day)).size}개 단어</div>
      </div>

      <ApprovalLine doc="YB-MYNOTE-2026" applicant={USER.name} status={`${allNotes.length}개 보관`} />

      {allNotes.length > 0 && (
        <div style={{ display: "flex", justifyContent: "flex-end", marginBottom: 4 }}>
          <button onClick={() => printNotes(filtered)}
            style={{ background: "transparent", border: "1px solid var(--line)", borderRadius: 6, padding: "6px 14px", fontSize: 12, fontWeight: 700, cursor: "pointer", fontFamily: "inherit", color: "var(--ink-soft)" }}>
            🖨 인쇄 / PDF 저장 ({filtered.length}개)
          </button>
        </div>
      )}

      {allNotes.length === 0 ? (
        <div style={{ marginTop: 24, padding: "36px 24px", textAlign: "center", background: "var(--cream)", border: "1.5px dashed var(--line)", borderRadius: 12 }}>
          <div style={{ fontSize: 36, marginBottom: 12 }}>📭</div>
          <p style={{ fontSize: 14, color: "var(--ink-soft)", lineHeight: 1.7 }}>
            아직 저장한 노트가 없어요.<br/>
            시추에이션에서 유버디한테 물어보고 <b style={{ color: "var(--ink)" }}>"📒 노트에 저장"</b>을 누르면 여기 모여요.
          </p>
        </div>
      ) : (
        <>
          <div className="filter-row">
            <button className={"filter-chip " + (kindFilter === "all" ? "active" : "")} onClick={() => setKindFilter("all")}>전체 {allNotes.length}</button>
            {kinds.map(k => (
              <button key={k} className={"filter-chip " + (kindFilter === k ? "active" : "")} onClick={() => setKindFilter(k)}>
                {KIND_LABEL[k] || k} {allNotes.filter(n => n.kind === k).length}
              </button>
            ))}
            <input className="filter-search" placeholder="노트 / 단어 검색…" value={search} onChange={e => setSearch(e.target.value)} />
          </div>

          <div style={{ marginTop: 16, display: "grid", gap: 12 }}>
            {filtered.map((n, i) => (
              <div key={i} style={{
                background: "var(--paper)", border: "1px solid var(--line)",
                borderRadius: 10, padding: "14px 16px",
                borderLeft: "3px solid var(--accent)",
              }}>
                <div style={{ display: "flex", alignItems: "baseline", gap: 8, marginBottom: 8, flexWrap: "wrap" }}>
                  <button
                    onClick={() => { const sc = SCENARIOS.find(s => s.day === n.day); if (sc && openScene) openScene(sc); }}
                    style={{ background: "transparent", border: "none", padding: 0, cursor: "pointer", fontFamily: "inherit" }}
                    title="이 단어 시추에이션 다시 보기"
                  >
                    <b style={{ fontSize: 15, color: "var(--ink)" }}>{n.word}</b>
                  </button>
                  <span style={{ fontSize: 11.5, color: "var(--ink-mute)" }}>{n.meaning}</span>
                  <span style={{ marginLeft: "auto", fontSize: 10, fontWeight: 800, letterSpacing: "0.08em", color: "var(--accent)", background: "rgba(216,90,42,0.08)", padding: "2px 8px", borderRadius: 10 }}>
                    {KIND_LABEL[n.kind] || n.label} · DAY {n.day}
                  </span>
                </div>
                {editKey === (n.day + ":" + n.text) ? (
                  <div>
                    <textarea value={editText} onChange={e => setEditText(e.target.value)}

                      <button onClick={() => updateNote(n.day, n.text, editText)} disabled={!editText.trim()} style={{ background: "var(--orange)", border: "none", borderRadius: 6, padding: "5px 14px", fontSize: 12, fontWeight: 700, cursor: "pointer", fontFamily: "inherit", color: "#fff", opacity: editText.trim() ? 1 : 0.5 }}>저장</button>

                    <button onClick={() => { setEditKey(n.day + ":" + n.text); setEditText(n.text); }}
                      title="노트 수정"
                      style={{ marginTop: 6, background: "transparent", border: "none", padding: 0, fontSize: 11, color: "var(--ink-mute)", cursor: "pointer", fontFamily: "inherit", fontWeight: 600 }}>
                      ✏️ 수정

            )}
          </div>
        </>
      )}
    </div>
  );
}
