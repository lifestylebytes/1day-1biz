<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>1일1비 · 신입 출근 시뮬레이터</title>
<script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>
<style>
/* ============================================================
   1일1비 — 신입 출근 시뮬레이터 스타일
   종이 사무 서류 비주얼 시스템
   ============================================================ */

@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&display=swap');

:root {
  --paper: #F4EFE3;
  --paper-warm: #ECE3CF;
  --paper-shadow: rgba(58,40,18,0.08);
  --ink: #2A1F14;
  --ink-soft: #5C4A36;
  --ink-mute: #8A7964;
  --line: #C9BBA0;
  --line-soft: rgba(58,40,18,0.12);
  --orange: #D85A2A;
  --orange-soft: #F5DCC8;
  --stamp-red: #B23A2C;
  --stamp-blue: #2B4A6E;
  --grid-blue: #B8C7D6;
  --green: #4A7C59;
  --highlight: #F5E6A3;
  --cream: #FAF6EB;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: #E8DFCB;
  color: var(--ink);
  font-family: 'Noto Sans KR', sans-serif;
  -webkit-font-smoothing: antialiased;
  font-size: 14px;
  line-height: 1.5;
}
button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; padding: 0; }
input, textarea, select { font-family: inherit; }

/* ===== 종이 텍스처 (전체 배경 — 약간의 노이즈) ===== */
body::before {
  content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
  background-image:
    radial-gradient(rgba(58,40,18,0.04) 1px, transparent 1px),
    radial-gradient(rgba(58,40,18,0.025) 1px, transparent 1px);
  background-size: 32px 32px, 8px 8px;
  background-position: 0 0, 4px 4px;
}

/* ===== 앱 셸 — 사무실 책상 메타포 ===== */
.office {
  display: grid;
  grid-template-columns: 256px 1fr;
  min-height: 100vh;
  max-width: 1380px;
  margin: 0 auto;
  background: var(--paper);
  box-shadow: 0 0 0 1px var(--line), 0 30px 60px rgba(58,40,18,0.18);
}

/* ===== 사이드바 = 사물함 ===== */
.locker {
  background: var(--paper-warm);
  border-right: 1px solid var(--line);
  padding: 24px 18px;
  position: sticky; top: 0;
  height: 100vh; overflow-y: auto;
}
.locker-brand {
  display: flex; gap: 10px; align-items: center;
  padding-bottom: 18px; border-bottom: 1px dashed var(--line);
  cursor: pointer;
  width: 100%; text-align: left;
}
.locker-brand:hover .locker-brand-mark { transform: rotate(-3deg); }
.locker-brand-mark {
  width: 38px; height: 38px; border-radius: 6px;
  background: var(--ink); color: var(--paper);
  display: grid; place-items: center;
  font-weight: 900; font-size: 17px; letter-spacing: -0.04em;
  transition: transform 0.2s;
  box-shadow: 2px 2px 0 var(--line);
}
.locker-brand-text { line-height: 1.2; }
.locker-brand-text b { font-size: 15px; font-weight: 800; letter-spacing: -0.02em; display: block; }
.locker-brand-text small { font-size: 9.5px; letter-spacing: 0.18em; color: var(--ink-mute); font-weight: 700; }

.locker-section { margin-top: 22px; }
.locker-label {
  font-size: 9.5px; letter-spacing: 0.2em; font-weight: 800;
  color: var(--ink-mute); margin-bottom: 8px; text-transform: uppercase;
}
.locker-link {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 12px; border-radius: 6px;
  font-size: 13.5px; font-weight: 600; color: var(--ink-soft);
  width: 100%; text-align: left;
  transition: background 0.15s;
  margin-bottom: 2px;
  border-left: 3px solid transparent;
}
.locker-link:hover { background: rgba(216,90,42,0.06); color: var(--ink); }
.locker-link.active {
  background: var(--paper);
  color: var(--ink); font-weight: 800;
  border-left-color: var(--orange);
  box-shadow: inset -1px 0 0 var(--line);
}
.locker-link-l { display: flex; align-items: center; gap: 10px; }
.locker-link-icon { font-size: 14px; width: 18px; text-align: center; }
.locker-badge {
  background: var(--stamp-red); color: var(--cream);
  font-size: 10px; font-weight: 800; padding: 1px 7px;
  border-radius: 999px; letter-spacing: 0.04em;
}

/* 사물함 하단 = 사원증 미니 */
.locker-card {
  margin-top: 28px;
  background: var(--cream);
  border: 1px solid var(--line);
  border-radius: 4px;
  padding: 14px;
  position: relative;
  box-shadow: 1px 1px 0 var(--line-soft);
}
.locker-card::before {
  content: ""; position: absolute; top: -6px; left: 50%; transform: translateX(-50%);
  width: 24px; height: 8px; background: var(--ink-mute); border-radius: 2px 2px 0 0;
}
.locker-card-row { display: flex; gap: 10px; align-items: center; }
.locker-card-photo {
  width: 38px; height: 46px; background: var(--paper-warm);
  border: 1px solid var(--line); display: grid; place-items: center;
  font-size: 18px; font-weight: 800; color: var(--ink);
}
.locker-card-info { flex: 1; line-height: 1.3; }
.locker-card-name { font-size: 13px; font-weight: 800; }
.locker-card-pos { font-size: 10.5px; color: var(--ink-mute); }
.locker-card-day {
  margin-top: 10px; padding-top: 8px; border-top: 1px dashed var(--line);
  font-size: 10px; color: var(--ink-mute); letter-spacing: 0.05em; font-weight: 600;
}
.locker-card-day b { color: var(--orange); font-size: 13px; font-weight: 900; letter-spacing: -0.02em; }

/* ===== 데스크 (메인 영역) ===== */
.desk {
  padding: 36px 44px 80px;
  position: relative;
  min-height: 100vh;
}

/* 페이지 상단 = 결재 라인 */
.desk-header {
  display: flex; justify-content: space-between; align-items: flex-end;
  padding-bottom: 18px;
  border-bottom: 2px solid var(--ink);
  margin-bottom: 28px;
}
.desk-eyebrow {
  font-size: 10px; letter-spacing: 0.24em; font-weight: 800;
  color: var(--ink-mute); text-transform: uppercase; margin-bottom: 6px;
}
.desk-title {
  font-size: 26px; font-weight: 900; letter-spacing: -0.03em; line-height: 1.15;
  margin: 0; color: var(--ink);
}
.desk-title em { font-style: normal; color: var(--orange); }
.desk-meta {
  text-align: right; font-size: 11px; color: var(--ink-mute); line-height: 1.5;
}
.desk-meta b { color: var(--ink); font-weight: 800; font-size: 12px; }

/* 결재판 그리드 (3열 결재 라인) */
.approval-line {
  display: grid; grid-template-columns: repeat(3, 1fr);
  border: 1px solid var(--ink);
  background: var(--cream);
  margin-bottom: 24px;
  font-size: 10.5px;
}
.approval-cell {
  padding: 6px 10px;
  border-right: 1px solid var(--ink);
  display: flex; flex-direction: column; gap: 4px;
  min-height: 60px;
}
.approval-cell:last-child { border-right: none; }
.approval-cell-label {
  font-size: 9px; letter-spacing: 0.18em; font-weight: 800;
  color: var(--ink-mute); border-bottom: 1px solid var(--line); padding-bottom: 3px;
  text-transform: uppercase;
}
.approval-cell-value { font-size: 12px; font-weight: 700; color: var(--ink); flex: 1; display: flex; align-items: center; }

/* 도장 */
.stamp {
  display: inline-grid; place-items: center;
  width: 52px; height: 52px;
  border: 2.5px solid var(--stamp-red);
  border-radius: 50%;
  color: var(--stamp-red);
  font-weight: 900; font-size: 13px; letter-spacing: -0.02em;
  transform: rotate(-12deg);
  font-family: 'Noto Sans KR', sans-serif;
  background: rgba(178,58,44,0.04);
  text-align: center; line-height: 1.05;
}
.stamp.blue { border-color: var(--stamp-blue); color: var(--stamp-blue); background: rgba(43,74,110,0.04); }
.stamp.small { width: 36px; height: 36px; font-size: 9px; border-width: 1.8px; }

/* ===== 카드 (종이 시트) ===== */
.sheet {
  background: var(--cream);
  border: 1px solid var(--line);
  position: relative;
  box-shadow: 1px 1px 0 var(--paper-shadow), 4px 4px 0 var(--paper-shadow);
}
.sheet-header {
  background: var(--ink); color: var(--paper);
  padding: 8px 16px;
  display: flex; justify-content: space-between; align-items: center;
  font-size: 10.5px; letter-spacing: 0.18em; font-weight: 800;
  text-transform: uppercase;
}
.sheet-header b { color: var(--orange-soft); }
.sheet-body { padding: 22px 24px; }

/* 모눈 종이 */
.grid-paper {
  background-image:
    linear-gradient(var(--grid-blue) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid-blue) 1px, transparent 1px);
  background-size: 24px 24px;
  background-color: #FBF9EF;
  background-position: -1px -1px;
}

/* ===== 홈 — 책상 위 ===== */
.desk-grid {
  display: grid;
  grid-template-columns: 1.6fr 1fr;
  gap: 22px;
}

/* 시추에이션 카드 = 결재판 */
.scene-card {
  background: var(--cream);
  border: 1.5px solid var(--ink);
  position: relative;
  box-shadow: 4px 4px 0 var(--ink);
}
.scene-card::before {
  content: ""; position: absolute; top: 14px; right: 14px;
  width: 8px; height: 8px; border-radius: 50%; background: var(--stamp-red);
  box-shadow: 0 0 0 3px rgba(178,58,44,0.15);
}
.scene-stamp-area {
  position: absolute; top: 12px; right: 36px;
}
.scene-card-tag {
  background: var(--ink); color: var(--paper);
  display: inline-block;
  padding: 4px 12px;
  font-size: 10px; letter-spacing: 0.2em; font-weight: 800;
  text-transform: uppercase;
}
.scene-card-body { padding: 24px 28px 28px; }
.scene-card-time {
  font-size: 11px; letter-spacing: 0.16em; font-weight: 700;
  color: var(--ink-mute); margin-top: 16px;
}
.scene-card-scene {
  margin-top: 8px; font-size: 14px; line-height: 1.65;
  color: var(--ink-soft); padding-bottom: 16px;
  border-bottom: 1px dashed var(--line);
}
.scene-quote-row {
  margin-top: 18px;
  display: flex; gap: 14px; align-items: flex-start;
}
.scene-avatar {
  width: 44px; height: 44px; border-radius: 50%;
  display: grid; place-items: center;
  font-weight: 900; font-size: 16px; color: #fff;
  flex-shrink: 0;
  border: 2px solid var(--ink);
}
.scene-quote-bubble {
  flex: 1; position: relative;
  background: var(--paper-warm);
  padding: 14px 18px;
  border: 1px solid var(--line);
  border-radius: 0 12px 12px 12px;
  font-size: 16px; font-weight: 600; line-height: 1.55;
  color: var(--ink);
}
.scene-quote-bubble::before {
  content: ""; position: absolute; top: 10px; left: -8px;
  width: 0; height: 0;
  border-top: 8px solid transparent;
  border-bottom: 8px solid transparent;
  border-right: 8px solid var(--paper-warm);
}
.scene-npc-name { font-size: 11px; color: var(--ink-mute); margin-bottom: 4px; font-weight: 700; }
.scene-target-word {
  display: inline-block;
  background: var(--highlight);
  padding: 1px 6px;
  font-weight: 800;
  border-radius: 2px;
  box-shadow: inset 0 -2px 0 rgba(0,0,0,0.08);
}

/* 영어 답변 작성 영역 */
.scene-task {
  margin-top: 22px; padding-top: 20px;
  border-top: 1.5px solid var(--ink);
}
.scene-task-label {
  font-size: 10px; letter-spacing: 0.2em; font-weight: 800;
  color: var(--orange); margin-bottom: 8px;
}
.scene-task-prompt {
  font-size: 14px; font-weight: 700; color: var(--ink); margin-bottom: 14px;
}
.scene-task-prompt b { background: var(--highlight); padding: 1px 6px; }
.scene-input {
  width: 100%; min-height: 90px; resize: vertical;
  padding: 14px 16px;
  border: 1.5px solid var(--line);
  background: #FBF9EF;
  background-image:
    linear-gradient(transparent 27px, var(--line-soft) 27px, var(--line-soft) 28px, transparent 28px);
  background-size: 100% 28px;
  font-size: 14.5px; line-height: 28px;
  color: var(--ink);
  font-weight: 500;
  outline: none;
  transition: border-color 0.15s;
}
.scene-input:focus { border-color: var(--orange); }
.scene-actions { margin-top: 14px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

/* 사수 포스트잇 */
.postit {
  background: #FFE9A6;
  padding: 18px 18px 22px;
  font-size: 13px; line-height: 1.6;
  color: var(--ink);
  box-shadow: 2px 4px 8px rgba(58,40,18,0.18);
  transform: rotate(-1.2deg);
  position: relative;
  font-weight: 500;
}
.postit::before {
  content: ""; position: absolute; top: -8px; left: 50%; transform: translateX(-50%) rotate(-2deg);
  width: 60px; height: 18px;
  background: rgba(255,255,255,0.4);
  border: 1px dashed rgba(58,40,18,0.2);
}
.postit-from {
  font-size: 10px; letter-spacing: 0.16em; font-weight: 800;
  color: var(--orange); margin-bottom: 8px;
}
.postit-sig { margin-top: 10px; font-size: 12px; color: var(--ink-mute); font-weight: 700; }

/* 일정표 = 다이어리 */
.schedule {
  background: var(--cream);
  border: 1px solid var(--line);
  padding: 0;
}
.schedule-head {
  background: var(--paper-warm);
  border-bottom: 1px solid var(--line);
  padding: 10px 16px;
  font-size: 11px; letter-spacing: 0.18em; font-weight: 800; text-transform: uppercase;
  color: var(--ink-soft);
  display: flex; justify-content: space-between;
}
.schedule-row {
  display: grid; grid-template-columns: 60px 1fr auto;
  gap: 14px; align-items: center;
  padding: 11px 16px;
  border-bottom: 1px dashed var(--line);
  font-size: 13px;
}
.schedule-row:last-child { border-bottom: none; }
.schedule-row.now { background: rgba(216,90,42,0.06); position: relative; }
.schedule-row.now::before {
  content: ""; position: absolute; left: 0; top: 0; bottom: 0;
  width: 3px; background: var(--orange);
}
.schedule-time {
  font-weight: 800; font-size: 12.5px; letter-spacing: -0.02em;
  color: var(--ink); font-variant-numeric: tabular-nums;
}
.schedule-row.done .schedule-time { color: var(--ink-mute); text-decoration: line-through; }
.schedule-title { color: var(--ink); }
.schedule-row.done .schedule-title { color: var(--ink-mute); }
.schedule-note { font-size: 10.5px; color: var(--orange); font-weight: 700; letter-spacing: 0.04em; }
.schedule-status {
  font-size: 9.5px; letter-spacing: 0.14em; font-weight: 800;
  padding: 2px 8px; border-radius: 999px;
  background: var(--paper-warm); color: var(--ink-mute);
}
.schedule-status.now { background: var(--orange); color: #fff; }
.schedule-status.done { background: transparent; color: var(--ink-mute); }

/* 출근부 = 14일 카드 */
.attendance {
  background: var(--cream);
  border: 1px solid var(--line);
  padding: 16px 18px;
}
.attendance-head {
  display: flex; justify-content: space-between; align-items: baseline;
  margin-bottom: 12px;
}
.attendance-title {
  font-size: 11px; letter-spacing: 0.18em; font-weight: 800; color: var(--ink-soft);
  text-transform: uppercase;
}
.attendance-num {
  font-size: 22px; font-weight: 900; letter-spacing: -0.03em; color: var(--orange);
}
.attendance-num small { font-size: 11px; color: var(--ink-mute); margin-left: 4px; font-weight: 700; }
.attendance-cells {
  display: grid; grid-template-columns: repeat(14, 1fr); gap: 4px;
}
.att-cell {
  aspect-ratio: 1;
  border: 1px solid var(--line);
  display: grid; place-items: center;
  font-size: 9px; font-weight: 700; color: var(--ink-mute);
  background: var(--paper-warm);
  position: relative;
}
.att-cell.done {
  background: var(--cream);
  color: var(--stamp-red);
}
.att-cell.done::after {
  content: "✓"; position: absolute;
  font-size: 11px; font-weight: 900; color: var(--stamp-red);
}
.att-cell.today {
  border: 2px solid var(--orange);
  background: var(--highlight);
  color: var(--ink);
}
.att-cell.today::after { content: "오늘"; font-size: 8px; color: var(--orange); font-weight: 800; }

/* 주말 칸 — 가벼운 톤. 도장 찍히면 ☕ */
.att-cell.weekend {
  background: rgba(216,90,42,0.04);
  color: var(--ink-mute);
  opacity: 0.85;
  font-style: italic;
}
.att-cell.weekend.done { background: rgba(216,90,42,0.06); color: var(--ink-mute); }
.att-cell.weekend.done::after { content: "☕"; font-size: 10px; color: var(--ink-mute); }
.att-cell.weekend.today { border-color: var(--ink-mute); background: var(--paper-warm); }
.att-cell.weekend.today::after { content: "주말"; color: var(--ink-mute); }

/* 사내 메모 박스 (홈 우측) */
.memo-box {
  background: var(--cream);
  border: 1px solid var(--line);
  padding: 0;
}
.memo-box-head {
  background: var(--ink); color: var(--paper);
  padding: 8px 14px;
  font-size: 10.5px; letter-spacing: 0.18em; font-weight: 800;
  display: flex; justify-content: space-between; align-items: center;
}
.memo-box-head b { color: var(--orange-soft); }
.memo-row {
  padding: 11px 14px;
  border-bottom: 1px dashed var(--line);
  display: grid; grid-template-columns: 36px 1fr auto;
  gap: 10px; align-items: center;
  font-size: 12.5px; cursor: pointer;
  transition: background 0.15s;
  width: 100%; text-align: left;
}
.memo-row:hover { background: var(--paper); }
.memo-row:last-child { border-bottom: none; }
.memo-row.unread .memo-subject { font-weight: 800; }
.memo-row.unread::before {
  content: ""; display: block;
  width: 6px; height: 6px; border-radius: 50%; background: var(--orange);
  position: absolute; margin-left: -10px; margin-top: 6px;
}
.memo-from-avatar {
  width: 28px; height: 28px; border-radius: 4px;
  display: grid; place-items: center;
  font-size: 11px; font-weight: 800; color: #fff;
}
.memo-subject { font-size: 12.5px; color: var(--ink); line-height: 1.4; }
.memo-meta { font-size: 10px; color: var(--ink-mute); font-weight: 600; letter-spacing: 0.04em; }
.memo-tag {
  display: inline-block; font-size: 9.5px; padding: 1px 6px;
  background: var(--paper-warm); color: var(--ink-soft);
  border: 1px solid var(--line);
  font-weight: 800; letter-spacing: 0.06em; margin-right: 6px;
}
.memo-tag.req { background: var(--stamp-red); color: #fff; border-color: var(--stamp-red); }

/* ===== 버튼 ===== */
.btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 10px 18px;
  font-size: 12.5px; font-weight: 800; letter-spacing: -0.01em;
  border: 1.5px solid var(--ink);
  background: var(--cream);
  color: var(--ink);
  transition: all 0.12s;
  position: relative;
}
.btn:hover { background: var(--paper-warm); transform: translate(-1px, -1px); box-shadow: 2px 2px 0 var(--ink); }
.btn:active { transform: translate(0, 0); box-shadow: none; }
.btn-primary { background: var(--orange); color: #fff; border-color: var(--orange); }
.btn-primary:hover { background: #C04E22; }
.btn-ghost { background: transparent; border-color: var(--line); color: var(--ink-soft); }
.btn-ghost:hover { background: var(--paper-warm); }
.btn-ink { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.btn-ink:hover { background: #1A130B; }
.btn-sm { padding: 7px 12px; font-size: 11.5px; }

/* ===== 공통 라벨 ===== */
.label-doc {
  display: inline-block;
  font-size: 9.5px; letter-spacing: 0.2em; font-weight: 800;
  color: var(--ink-mute); text-transform: uppercase;
}
.label-orange { color: var(--orange); }
.label-red { color: var(--stamp-red); }

/* ===== 모달 — 결재 서류 ===== */
.modal-bg {
  position: fixed; inset: 0; z-index: 100;
  background: rgba(42,31,20,0.55);
  display: grid; place-items: center;
  padding: 24px;
}
.modal-doc {
  background: var(--cream);
  border: 1px solid var(--ink);
  width: 100%; max-width: 640px;
  max-height: 88vh; overflow-y: auto;
  box-shadow: 8px 8px 0 rgba(42,31,20,0.4);
}
.modal-doc-head {
  background: var(--ink); color: var(--paper);
  padding: 12px 18px;
  display: flex; justify-content: space-between; align-items: center;
  font-size: 11px; letter-spacing: 0.18em; font-weight: 800; text-transform: uppercase;
}
.modal-doc-body { padding: 24px 28px; }

/* ===== 누적 단어 = 명함첩/업무 노트 ===== */
.note-tabs {
  display: flex; gap: 0;
  border-bottom: 1.5px solid var(--ink);
  margin-bottom: 22px;
}
.note-tab {
  padding: 10px 18px; font-size: 12px; font-weight: 800;
  color: var(--ink-mute); letter-spacing: 0.04em;
  border: 1px solid transparent;
  border-bottom: none;
  background: transparent;
}
.note-tab.active {
  background: var(--cream); color: var(--ink);
  border-color: var(--ink); margin-bottom: -1.5px;
}

.word-rolodex {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px;
}
.biz-card {
  background: var(--cream);
  border: 1px solid var(--line);
  padding: 16px 18px;
  position: relative;
  text-align: left;
  width: 100%;
  cursor: pointer;
  transition: all 0.15s;
  box-shadow: 1px 1px 0 var(--paper-shadow);
  min-height: 130px;
  display: flex; flex-direction: column; gap: 6px;
}
.biz-card:hover { transform: translate(-2px, -2px); box-shadow: 4px 4px 0 var(--paper-shadow), 1px 1px 0 var(--paper-shadow); border-color: var(--ink); }
.biz-card-head {
  display: flex; justify-content: space-between; align-items: flex-start;
  font-size: 9.5px; letter-spacing: 0.16em; font-weight: 800; color: var(--ink-mute);
}
.biz-card-day { font-weight: 900; }
.biz-card-word {
  font-size: 22px; font-weight: 900; letter-spacing: -0.03em;
  color: var(--ink); line-height: 1.1; margin-top: 4px;
}
.biz-card-meaning { font-size: 12.5px; color: var(--ink-soft); line-height: 1.5; }
.biz-card-foot {
  margin-top: auto; padding-top: 8px;
  border-top: 1px dashed var(--line);
  display: flex; justify-content: space-between; align-items: center;
  font-size: 10px; color: var(--ink-mute); font-weight: 700;
}
.biz-card-npc {
  display: inline-flex; align-items: center; gap: 5px;
}
.biz-card-npc-dot { width: 8px; height: 8px; border-radius: 50%; }
.biz-card.locked {
  background: repeating-linear-gradient(45deg, var(--paper-warm), var(--paper-warm) 8px, var(--paper) 8px, var(--paper) 16px);
  color: var(--ink-mute); cursor: not-allowed;
}
.biz-card.locked:hover { transform: none; box-shadow: 1px 1px 0 var(--paper-shadow); border-color: var(--line); }
.biz-card.locked .biz-card-word { color: var(--ink-mute); filter: blur(9px); user-select: none; letter-spacing: 0.05em; }
.biz-card.today {
  border: 2px solid var(--orange);
  background: linear-gradient(135deg, var(--cream) 0%, #FFF6E6 100%);
}

/* 필터 칩 */
.filter-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 18px; align-items: center; }
.filter-chip {
  padding: 7px 14px;
  border: 1px solid var(--line);
  background: var(--cream);
  font-size: 11.5px; font-weight: 700; color: var(--ink-soft);
  letter-spacing: -0.01em;
  transition: all 0.12s;
}
.filter-chip:hover { border-color: var(--ink); }
.filter-chip.active { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.filter-search {
  flex: 1; min-width: 180px;
  padding: 7px 12px;
  border: 1px solid var(--line);
  background: var(--cream);
  font-size: 12px; outline: none; color: var(--ink);
}
.filter-search:focus { border-color: var(--ink); }

/* ===== 시험 = 분기 평가 ===== */
.eval-wrap {
  background: var(--cream);
  border: 1.5px solid var(--ink);
  padding: 0;
  position: relative;
  box-shadow: 6px 6px 0 var(--ink);
}
.eval-head {
  background: var(--ink); color: var(--paper);
  padding: 14px 22px;
  display: flex; justify-content: space-between; align-items: center;
}
.eval-head-title { font-size: 13px; font-weight: 800; letter-spacing: 0.04em; }
.eval-head-sub { font-size: 10.5px; letter-spacing: 0.16em; color: var(--orange-soft); font-weight: 700; }
.eval-body { padding: 28px 32px; }
.eval-progress {
  display: grid; grid-auto-flow: column; grid-auto-columns: 1fr;
  gap: 4px; margin-bottom: 24px;
}
.eval-progress-cell {
  height: 6px; background: var(--paper-warm); border: 1px solid var(--line);
}
.eval-progress-cell.done { background: var(--green); border-color: var(--green); }
.eval-progress-cell.wrong { background: var(--stamp-red); border-color: var(--stamp-red); }
.eval-progress-cell.current { background: var(--orange); border-color: var(--orange); }

.eval-q-num {
  font-size: 11px; letter-spacing: 0.2em; font-weight: 800; color: var(--orange);
}
.eval-q-scene {
  margin-top: 8px; font-size: 14px; line-height: 1.65; color: var(--ink-soft);
  padding-bottom: 14px; border-bottom: 1px dashed var(--line);
}
.eval-options {
  display: flex; flex-direction: column; gap: 10px;
  margin-top: 18px;
}
.eval-option {
  text-align: left;
  padding: 14px 18px;
  border: 1.5px solid var(--line);
  background: #FBF9EF;
  font-size: 14px; line-height: 1.55; color: var(--ink);
  font-weight: 500;
  transition: all 0.12s;
}
.eval-option:hover { border-color: var(--ink); }
.eval-option.selected { border-color: var(--orange); background: #FFF6E6; }
.eval-option.correct { border-color: var(--green); background: rgba(74,124,89,0.08); }
.eval-option.wrong { border-color: var(--stamp-red); background: rgba(178,58,44,0.06); }
.eval-option-letter {
  display: inline-grid; place-items: center;
  width: 22px; height: 22px;
  background: var(--ink); color: var(--paper);
  font-weight: 800; font-size: 11px;
  margin-right: 12px; border-radius: 2px;
}

/* ===== 마이페이지 = 사원증 ===== */
.id-card {
  background: var(--cream);
  border: 1.5px solid var(--ink);
  width: 100%; max-width: 460px;
  margin: 0 auto;
  position: relative;
  box-shadow: 6px 6px 0 var(--ink);
}
.id-card-clip {
  width: 70px; height: 22px;
  background: var(--ink-mute);
  margin: -22px auto 0;
  border-radius: 4px 4px 0 0;
  position: relative;
}
.id-card-clip::after {
  content: ""; position: absolute; top: 6px; left: 50%; transform: translateX(-50%);
  width: 14px; height: 14px; background: var(--paper-warm); border-radius: 50%;
}
.id-card-strip {
  background: var(--ink); color: var(--paper);
  padding: 10px 22px;
  display: flex; justify-content: space-between; align-items: center;
  font-size: 10px; letter-spacing: 0.2em; font-weight: 800;
}
.id-card-strip b { color: var(--orange-soft); font-size: 12px; }
.id-card-body { padding: 28px 32px; display: grid; grid-template-columns: auto 1fr; gap: 24px; align-items: flex-start; }
.id-card-photo {
  width: 110px; height: 134px; background: var(--paper-warm);
  border: 1.5px solid var(--ink);
  display: grid; place-items: center;
  font-size: 56px; font-weight: 800; color: var(--ink);
  position: relative;
}
.id-card-photo::after {
  content: "PHOTO"; position: absolute; top: 6px; right: 6px;
  font-size: 8px; letter-spacing: 0.18em; font-weight: 800; color: var(--ink-mute);
}
.id-card-fields { font-size: 13px; }
.id-field { display: grid; grid-template-columns: 70px 1fr; gap: 10px; padding: 6px 0; border-bottom: 1px dashed var(--line); }
.id-field:last-child { border-bottom: none; }
.id-field-label { font-size: 10px; color: var(--ink-mute); letter-spacing: 0.16em; font-weight: 800; text-transform: uppercase; padding-top: 3px; }
.id-field-value { font-size: 13.5px; font-weight: 700; color: var(--ink); letter-spacing: -0.01em; }
.id-card-foot {
  border-top: 1px solid var(--ink);
  padding: 14px 22px;
  display: flex; justify-content: space-between; align-items: center;
  font-size: 11px; color: var(--ink-mute); font-weight: 700;
  background: var(--paper-warm);
}
.id-card-foot b { color: var(--orange); font-weight: 900; font-size: 13px; }

.badge-row {
  display: flex; gap: 8px; flex-wrap: wrap; margin-top: 18px;
}
.badge {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 6px 11px;
  border: 1px solid var(--orange);
  background: var(--orange-soft);
  color: var(--ink);
  font-size: 11px; font-weight: 800;
}
.badge::before {
  content: "★"; color: var(--orange); font-weight: 900;
}

/* HR 정보 시트 */
.hr-section {
  margin-top: 28px;
  background: var(--cream); border: 1px solid var(--line);
}
.hr-section-head {
  background: var(--paper-warm);
  padding: 10px 18px;
  font-size: 11px; letter-spacing: 0.18em; font-weight: 800; color: var(--ink-soft);
  text-transform: uppercase;
  border-bottom: 1px solid var(--line);
}
.hr-row {
  display: flex; justify-content: space-between; align-items: center;
  padding: 14px 18px;
  border-bottom: 1px dashed var(--line);
  font-size: 13px;
}
.hr-row:last-child { border-bottom: none; }
.hr-row-label { color: var(--ink-soft); font-weight: 600; }
.hr-row-value { font-weight: 800; color: var(--ink); }
.hr-row-value b { color: var(--orange); }

/* ============================================================
   유버디 = 버디 · 친근한 글로벌 코치 (1:1)
   ============================================================ */
.buddy-card {
  background: linear-gradient(180deg, #FFF7E8 0%, #FFEFD0 100%);
  border: 1.5px solid var(--ink);
  border-radius: 4px;
  padding: 14px 14px 12px;
  margin-bottom: 14px;
  position: relative;
  box-shadow: 3px 3px 0 var(--ink);
}
.buddy-card::before {
  content: "BUDDY · 1:1";
  position: absolute; top: -9px; left: 12px;
  background: var(--ink); color: var(--paper);
  font-size: 9.5px; font-weight: 800; letter-spacing: 0.18em;
  padding: 2px 7px;
}
.buddy-card-head {
  display: flex; gap: 10px; align-items: center; margin-bottom: 10px;
}
.buddy-avatar {
  width: 36px; height: 36px; border-radius: 50%;
  background: var(--ink); color: var(--paper);
  display: grid; place-items: center;
  font-size: 18px;
  flex-shrink: 0;
  border: 1.5px solid var(--ink);
}
.buddy-avatar.small { width: 28px; height: 28px; font-size: 14px; }
.buddy-meta { flex: 1; min-width: 0; }
.buddy-name { font-size: 13px; font-weight: 800; color: var(--ink); }
.buddy-online { font-size: 9.5px; color: var(--green); font-weight: 700; margin-left: 6px; letter-spacing: 0.05em; }
.buddy-role { font-size: 11px; color: var(--ink-mute); margin-top: 1px; }
.buddy-bubble {
  background: var(--paper);
  border: 1.2px solid var(--ink);
  padding: 11px 12px;
  font-size: 12.5px; line-height: 1.6;
  color: var(--ink-soft);
  border-radius: 12px 12px 12px 3px;
  position: relative;
}
.buddy-time {
  font-size: 10px; color: var(--ink-mute);
  margin-top: 6px; padding-left: 4px;
  letter-spacing: 0.04em;
}

/* MyPage 안의 버디 row */
.buddy-row {
  display: flex; gap: 12px; align-items: flex-start;
  padding: 14px 18px;
  border-bottom: 1px dashed var(--line);
}

/* SceneModal 안의 버디 채팅 */
.buddy-chat {
  margin-top: 16px;
  padding: 14px;
  background: #FFF7E8;
  border: 1.5px dashed var(--ink);
  border-radius: 4px;
}
.buddy-chat-head {
  display: flex; gap: 10px; align-items: center; margin-bottom: 10px;
}
.buddy-chat-log {
  display: flex; flex-direction: column; gap: 6px;
  margin-bottom: 10px; padding: 8px;
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: 4px;
  max-height: 180px; overflow-y: auto;
}
.buddy-msg {
  font-size: 12px; line-height: 1.5;
  padding: 7px 10px; border-radius: 10px;
  max-width: 85%;
}
.buddy-msg.me {
  align-self: flex-end;
  background: var(--ink); color: var(--paper);
  border-radius: 10px 10px 3px 10px;
}
.buddy-msg.buddy {
  align-self: flex-start;
  background: #FFE9A6; color: var(--ink);
  border-radius: 10px 10px 10px 3px;
}
.buddy-chat-quick {
  display: flex; flex-wrap: wrap; gap: 6px;
}
.quick-q {
  font-family: var(--font-sans);
  font-size: 11.5px; font-weight: 600;
  padding: 6px 10px;
  background: var(--paper);
  border: 1px solid var(--ink);
  border-radius: 14px;
  color: var(--ink);
  cursor: pointer;
  transition: all 0.15s;
}
.quick-q:hover {
  background: var(--ink); color: var(--paper);
}

/* MyPage 설정 디스클로저 */
.settings-toggle {
  font-family: inherit;
  background: var(--paper-warm);
  border: none;
  font-size: inherit;
  color: inherit;
}
.settings-toggle:hover { background: #F0E8D5; }
.settings-select {
  font-family: var(--font-sans);
  font-size: 12px; font-weight: 700;
  padding: 5px 10px;
  background: var(--paper);
  border: 1.2px solid var(--ink);
  border-radius: 3px;
  color: var(--ink);
  cursor: pointer;
}
.danger-zone-toggle {
  background: var(--paper-warm);
  font-family: inherit;
  font-size: inherit;
}
.danger-zone-toggle:hover { background: rgba(178,58,44,0.06); }

.toggle {
  width: 38px; height: 20px;
  border: 1.5px solid var(--ink);
  background: var(--paper-warm);
  position: relative;
  cursor: pointer;
}
.toggle::after {
  content: ""; position: absolute;
  top: 1px; left: 1px;
  width: 14px; height: 14px;
  background: var(--ink);
  transition: left 0.15s;
}
.toggle.on { background: var(--orange); border-color: var(--orange); }
.toggle.on::after { left: 19px; background: #fff; }

/* ===== 미니 인박스 ===== */
.inbox-list {
  background: var(--cream); border: 1px solid var(--line);
}
.inbox-row {
  display: grid; grid-template-columns: 36px 110px 1fr auto;
  gap: 12px; align-items: center;
  padding: 12px 18px;
  border-bottom: 1px dashed var(--line);
  font-size: 13px; cursor: pointer; text-align: left;
  width: 100%;
  background: transparent;
  transition: background 0.12s;
}
.inbox-row:hover { background: var(--paper); }
.inbox-row:last-child { border-bottom: none; }
.inbox-row.unread .inbox-subject { font-weight: 800; }
.inbox-from { font-size: 11.5px; color: var(--ink-soft); font-weight: 700; }
.inbox-subject { font-size: 13px; color: var(--ink); line-height: 1.4; }
.inbox-subject small { color: var(--ink-mute); font-weight: 500; margin-left: 8px; font-size: 11.5px; }
.inbox-date { font-size: 11px; color: var(--ink-mute); font-variant-numeric: tabular-nums; }

/* ===== 유틸 ===== */
.row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.col { display: flex; flex-direction: column; gap: 14px; }
.spacer { height: 24px; }
.divider {
  border: none; border-top: 1.5px dashed var(--line);
  margin: 22px 0;
}

/* ===== 모바일 하단 탭바 (기본 숨김) ===== */
.m-tabbar { display: none; }

/* ===== 모바일 ===== */
@media (max-width: 880px) {
  body { font-size: 13px; }
  .office {
    grid-template-columns: 1fr;
    box-shadow: none;
    min-height: 100vh;
  }
  .locker { display: none; }

  /* 데스크 영역 — 상단 dynamic island/notch + 하단 탭바/home indicator safe area */
  .desk {
    padding: calc(80px + env(safe-area-inset-top, 0px)) 14px calc(110px + env(safe-area-inset-bottom, 0px));
    min-height: auto;
  }
  .desk-header {
    flex-direction: column; align-items: flex-start; gap: 8px;
    padding-bottom: 12px; margin-bottom: 18px;
  }
  .desk-eyebrow { font-size: 9px; letter-spacing: 0.18em; }
  .desk-title { font-size: 19px; line-height: 1.2; }
  .desk-meta { text-align: left; font-size: 10.5px; }

  /* 결재 라인 — 2열, 4번째 셀 풀폭 */
  .approval-line { grid-template-columns: 1fr 1fr; }
  .approval-cell { min-height: 50px; padding: 5px 8px; }
  .approval-cell-label { font-size: 8px; letter-spacing: 0.14em; }
  .approval-cell-value { font-size: 11px; }
  .approval-cell:nth-child(2) { border-right: none; }
  .approval-cell:nth-child(-n+2) { border-bottom: 1px solid var(--ink); }

  /* 홈 그리드 — 1열로 */
  .desk-grid { grid-template-columns: 1fr; gap: 14px; }

  /* 시추에이션 카드 */
  .scene-card { box-shadow: 3px 3px 0 var(--ink); }
  .scene-card-body { padding: 18px 18px 22px; }
  .scene-card-tag { font-size: 9px; padding: 3px 9px; }
  .scene-card-time { font-size: 10px; margin-top: 12px; }
  .scene-card-scene { font-size: 12.5px; }
  .scene-quote-row { gap: 10px; }
  .scene-avatar { width: 36px; height: 36px; font-size: 13px; }
  .scene-quote-bubble { font-size: 14px; padding: 10px 14px; }
  .scene-task { padding-top: 14px; margin-top: 16px; }
  .scene-task-prompt { font-size: 13px; }
  .scene-input { min-height: 76px; font-size: 13px; padding: 10px 12px; }

  /* 포스트잇 — 더 작게 */
  .postit { padding: 14px 14px 18px; font-size: 12px; }

  /* 일정표 */
  .schedule-row { padding: 9px 12px; gap: 10px; grid-template-columns: 50px 1fr auto; font-size: 12px; }
  .schedule-time { font-size: 11px; }
  .schedule-status { font-size: 8.5px; padding: 2px 6px; }
  .schedule-head { padding: 9px 12px; font-size: 10px; }

  /* 출근부 */
  .attendance { padding: 12px 14px; }
  .attendance-cells { grid-template-columns: repeat(7, 1fr); gap: 3px; }
  .attendance-num { font-size: 18px; }

  /* 메모 박스 (홈) */
  .memo-row { grid-template-columns: 28px 1fr auto; padding: 9px 12px; font-size: 11.5px; gap: 8px; }
  .memo-row.unread::before { width: 5px; height: 5px; margin-left: -8px; }
  .memo-from-avatar { width: 24px; height: 24px; font-size: 10px; }
  .memo-subject { font-size: 11.5px; }
  .memo-tag { font-size: 8.5px; padding: 1px 5px; margin-right: 4px; }

  /* 단어 카드 라이브러리 — 1열, 카드 작게 */
  .word-rolodex { grid-template-columns: 1fr; gap: 10px; }
  .biz-card { padding: 13px 14px; min-height: auto; }
  .biz-card-word { font-size: 19px; }
  .biz-card-meaning { font-size: 11.5px; }
  .biz-card-foot { font-size: 9.5px; }

  /* 필터 */
  .filter-row { gap: 6px; margin-bottom: 14px; }
  .filter-chip { padding: 6px 10px; font-size: 10.5px; }
  .filter-search { font-size: 11px; min-width: 140px; }

  /* 시험 */
  .eval-wrap { box-shadow: 4px 4px 0 var(--ink); }
  .eval-head { padding: 11px 16px; }
  .eval-head-title { font-size: 11px; }
  .eval-head-sub { font-size: 9px; }
  .eval-body { padding: 18px 16px; }
  .eval-q-scene { font-size: 12.5px; }
  .eval-option { padding: 11px 14px; font-size: 12.5px; }
  .eval-option-letter { width: 19px; height: 19px; font-size: 10px; margin-right: 9px; }

  /* 사원증 */
  .id-card { box-shadow: 4px 4px 0 var(--ink); }
  .id-card-strip { padding: 8px 16px; font-size: 9px; }
  .id-card-strip b { font-size: 10.5px; }
  .id-card-body { grid-template-columns: 1fr; gap: 16px; padding: 22px 18px; }
  .id-card-photo { margin: 0 auto; width: 96px; height: 116px; font-size: 44px; }
  .id-card-fields { font-size: 12px; }
  .id-field { grid-template-columns: 56px 1fr; gap: 8px; padding: 5px 0; }
  .id-field-label { font-size: 9px; }
  .id-field-value { font-size: 12px; }
  .id-card-foot { padding: 10px 16px; font-size: 10px; }

  /* HR 섹션 */
  .hr-section-head { padding: 8px 14px; font-size: 10px; }
  .hr-row { padding: 11px 14px; font-size: 12px; }
  .badge { font-size: 10px; padding: 5px 9px; }

  /* 인박스 — 4열을 2열로 (보낸이 + 제목 / 날짜는 우측 끝) */
  .inbox-row {
    grid-template-columns: 28px 1fr;
    grid-template-rows: auto auto;
    column-gap: 10px; row-gap: 4px;
    padding: 11px 14px;
    align-items: flex-start;
  }
  .inbox-row .memo-from-avatar { grid-row: 1 / 3; align-self: center; width: 28px; height: 28px; font-size: 11px; }

  return _AFTERNOON_TASKS[match] || _AFTERNOON_TASKS[1];
}

  "사수가 노란 포스트잇 줬어. 오른쪽 메모 확인 ↗",

  "사수 빠른 슬랙 한 줄 + 포스트잇 — 오늘의 단어 ↗",
];

const _MISSION_CONTEXTS = [
  { ctx: "팀 슬랙",     prompt: "팀 슬랙 채널에 한 줄 던진다고 생각하고." },
  { ctx: "메일 답장",   prompt: "방금 받은 메일에 한 줄 답장한다고 생각하고." },

];

function getScheduleForDay(day) {
  const isLastDay = day >= 30;
  const lunch = _lunchForDay(day);
  const afternoonTask = _afternoonForDay(day);
  const morningTone = _MORNING_TONES[(day - 1) % _MORNING_TONES.length];
  const missionCtx = _MISSION_CONTEXTS[(day - 1) % _MISSION_CONTEXTS.length];

  // Day별 변동 활동: mini_mission → english_lunch → recap → office_task 순환
  // (P5 contextual variability — 매일 다른 맥락으로 표현 만남)
  const VARIANT_ROTATION = ["mini_mission", "english_lunch", "recap", "office_task"];
  const variantType = VARIANT_ROTATION[(day - 1) % VARIANT_ROTATION.length];

  const variantItem = (() => {
    switch (variantType) {
      case "mini_mission":
        return {
          id: "mission", time: "14:00", type: "mini_mission",
          title: "미니 미션 — 오늘 표현 써먹기",
          note: missionCtx.ctx + "에 한 줄",
          context: missionCtx,
        };
      case "english_lunch":
        return {
          id: "lunch", time: "12:30", type: "english_lunch",
          title: lunch.who + "와 점심",
          note: "한영 믹스 small talk",
          context: lunch,
        };
      case "recap":
        return {
          id: "recap", time: "15:30", type: "recap",
          title: "오늘 표현 Recap (10초 퀴즈)",
          note: "4지선다 빠른 복습",
        };
      case "office_task":
      default:
        return {
          id: "afternoon", time: "14:00", type: "office_task",
          title: "오후 업무",
          action: afternoonTask,
        };
    }
  })();

  // 4개 고정 슬롯 — 출근+단어 / 시추에이션 / Day별 변동 / 일지+퇴근
  return [
    {
      id: "checkin", time: "09:00", type: "checkin",
      title: day === 1 ? "출근 + 사번 받기 + 오늘의 단어" : "출근 + 오늘의 단어 도착",
      note: morningTone,
      action: day === 1
        ? "사옥 도착 ✓ · 사번 발급 ✓ · 사수가 노란 포스트잇 줬어 ↗"
        : "출근 도장 ✓ · 사수가 오늘의 단어 줬어 ↗",
    },
    {
      id: "scenario", time: "10:00", type: "scenario",
      title: "오늘의 시추에이션",
      note: "← 클릭해서 시작",
      action: null,
    },
    variantItem,
    {
      id: "wrapup", time: "17:00", type: "journal",
      title: isLastDay ? "수습 평가 + 업무일지 + 퇴근" : "업무일지 작성 + 퇴근",
      note: "오늘 한 줄 + 유버디 응원",
      action: null,
      isLastDay,
    },
  ];
}

  const [toast, setToast] = useState(null);
  const [activeItem, setActiveItem] = useState(null); // todo 클릭 → 어휘 활동 모달
  const showToast = (msg, ms) => {
    setToast(msg);
    setTimeout(() => setToast(null), ms || 2400);
  };

  // Day 1 투어 (첫 방문 시만) — 인터랙티브 spotlight
  const TOUR_KEY = "__OD_TOUR_DONE_DAY_" + USER.currentDay;
  const [tourStep, setTourStep] = useState(() => {
    if (USER.currentDay !== 1) return -1;
    try { return localStorage.getItem(TOUR_KEY) ? -1 : 0; } catch(e) { return -1; }
  });
  const TOUR_STEPS = [
    {
      selector: null,
      title: "오늘부터 첫 출근이에요 🎉",
      body: "5초만 둘러볼게요. 어디서 뭘 누르면 되는지 — 그러고 나서 출근 도장 찍으러 가요.",
    },
    {
      selector: ".scene-card",
      placement: "right",
      title: "오늘의 시추에이션",
      body: "왼쪽 큰 카드 = 단어 + NPC가 던진 상황 + 한 줄 미션. 클릭하면 영작 활동이 열려요. 사수 피드백까지 들어와요.",
    },
    {
      selector: ".schedule",
      placement: "right",
      title: "오늘 일정 — 9시부터 차례대로",
      body: "9시 출근 → 10시 시추에이션 → 14시 미션 → 17시 퇴근. 각 항목 클릭하면 어휘 연습 활동이 열려요. 위에서부터 한 칸씩 풀어가세요. 잠금된 건 이전 항목 끝나면 풀려요.",
    },
    {
      selector: ".empty-postit, .postit",
      placement: "left",
      title: "여긴 처음엔 비어있어요",
      body: "출근 도장 찍으면 사수가 노란 메모를, 시추에이션 풀면 유버디가 한 마디를 여기에 떨어뜨려요. 활동 풀수록 책상이 채워져요.",
    },
    {
      selector: ".attendance",
      placement: "left",
      title: "출근부 · 14일",
      body: "오늘 일정 다 끝내면 '오늘' 칸에 빨간 출근 도장이 찍혀요. 14일 모이면 30일차에 완주 도장 ✨",
    },
    {
      selector: ".schedule-row.now",
      placement: "right",
      title: "자, 시작! 👇",
      body: "09:00 '출근 + 단어 받기' 가 첫 활동이에요. 누르면 오늘 단어가 도착해요.",
      cta: "출근 도장 찍으러 가자 →",
    },
  ];
  const closeTour = () => {
    setTourStep(-1);
    try { localStorage.setItem(TOUR_KEY, "1"); } catch(e) {}
  };

  // 타겟 요소 위치 추적 — tourStep 바뀔 때마다 측정 + scroll into view
  const [targetRect, setTargetRect] = useState(null);
  useEffect(() => {
    if (tourStep < 0 || tourStep >= TOUR_STEPS.length) {
      setTargetRect(null);
      return;
    }
    const step = TOUR_STEPS[tourStep];
    if (!step.selector) {
      setTargetRect(null);
      return;
    }
    let raf, cancelled = false;
    const measure = () => {
      if (cancelled) return;
      const el = document.querySelector(step.selector);
      if (!el) { setTargetRect(null); return; }
      const r = el.getBoundingClientRect();
      setTargetRect({ left: r.left, top: r.top, width: r.width, height: r.height });
    };
    const el0 = document.querySelector(step.selector);
    if (el0) {
      try { el0.scrollIntoView({ behavior: "smooth", block: "center" }); } catch(e) {}
    }
    let count = 0;
    const tick = () => {
      measure();
      count++;
      if (count < 40 && !cancelled) raf = requestAnimationFrame(tick);
    };
    tick();
    const onResize = () => measure();
    window.addEventListener("resize", onResize);
    window.addEventListener("scroll", onResize, true);
    return () => {
      cancelled = true;
      if (raf) cancelAnimationFrame(raf);
      window.removeEventListener("resize", onResize);
      window.removeEventListener("scroll", onResize, true);
    };
  }, [tourStep]);

  // === 모든 hooks 끝난 후 — 데이터 lookup + 안전장치 early return ===
  const today = SCENARIOS.find(s => s.day === USER.workingDay);
  const npc = today ? CHARACTERS[today.npc] : null;

  if (!today) {
    return (
      <div style={{ padding: 60, textAlign: "center", color: "var(--ink-mute)", fontSize: 14, lineHeight: 1.7 }}>
        <div style={{ fontSize: 32, marginBottom: 16 }}>🌅</div>
        <div style={{ fontSize: 16, fontWeight: 700, color: "var(--ink)", marginBottom: 8 }}>
          오늘은 새 단어가 없는 날이에요
        </div>
        Day {USER.currentDay} ({USER.dayOfWeekKo}요일) — 평일이지만 단어 카드는 1-30번까지에요.<br/>
        Dev panel에서 다른 Day로 점프해보세요.
      </div>
    );
  }

  // 출근부 — 14일 그리드 (오늘 일정 다 끝내면 'stamped'). 주말 칸은 시각적 구분.
  const ATTEND_DAYS = 14;
  const allTodayDone = TODAY_SCHEDULE.length > 0 && TODAY_SCHEDULE.every(t => doneTasks[t.id]);
  const cells = Array.from({ length: ATTEND_DAYS }, (_, i) => {
    const day = i + 1;
    const isWk = _isWeekendDay(day);
    if (day < USER.currentDay) return { day, state: "done", weekend: isWk };
    if (day === USER.currentDay) return { day, state: allTodayDone ? "stamped" : "today", weekend: isWk };
    return { day, state: "", weekend: isWk };
  });

  // 마지막 항목 완료 토스트
  const _maybeFinaleToast = (idx) => {
    if (idx === TODAY_SCHEDULE.length - 1) {
      setTimeout(() => showToast("🎊 Day " + USER.currentDay + " 완주! 내일 또 봐요.", 4000), 200);
    }
  };

  // 항목별 클릭 처리 — scenario는 SceneModal로 (즉시 done), 나머지는 ActivityModal로 (활동 완료해야 done)
  const handleScheduleClick = (item, idx) => {
    if (doneTasks[item.id]) {
      // 이미 끝낸 활동도 한 번 더 풀어볼 수 있게 모달은 열어줌 (done 상태 유지)
      if (item.id !== "scenario" && item.type !== "scenario") {
        setActiveItem({ item, idx, replay: true });
      } else {
        openScene(today);
      }
      return;
    }
    const prevDone = idx === 0 || doneTasks[TODAY_SCHEDULE[idx-1].id];
    if (!prevDone) {
      showToast("⏳ 이전 항목 먼저 끝내주세요");
      return;
    }

    if (item.id === "scenario") {
      // 시추에이션 — 기존 SceneModal 유지. 클릭 즉시 done 처리.
      const next = { ...doneTasks, [item.id]: true };
      setDoneTasks(next);
      try { localStorage.setItem(taskKey, JSON.stringify(next)); } catch(e) {}
      openScene(today);
      _maybeFinaleToast(idx);
      return;
    }

    // 그 외 활동은 ActivityModal — 활동 끝나야 done
    setActiveItem({ item, idx, replay: false });
  };

  // ActivityModal 완료 핸들러 — 처음 완료할 때만 doneTasks에 기록
  const completeActivity = () => {
    if (!activeItem) return;
    const { item, idx, replay } = activeItem;
    if (!replay && !doneTasks[item.id]) {
      const next = { ...doneTasks, [item.id]: true };
      setDoneTasks(next);
      try { localStorage.setItem(taskKey, JSON.stringify(next)); } catch(e) {}
      _maybeFinaleToast(idx);
    } else {
      showToast("👍 다시 풀어봤어요 — 표현이 더 자연스러워질 거예요");
    }
    setActiveItem(null);
  };

  // 각 항목의 computed status
  const scheduleWithStatus = TODAY_SCHEDULE.map((item, i) => {
    if (doneTasks[item.id]) return { ...item, computed: "done" };
    const prevDone = i === 0 || doneTasks[TODAY_SCHEDULE[i-1].id];
    return { ...item, computed: prevDone ? "now" : "locked" };
  });

  return (
    <div>
      <div className="desk-header">
        <div>
          <div className="desk-eyebrow">
            {todayLabel} · DAY {USER.currentDay} / {USER.totalDays} · <span style={{ color: "var(--orange)" }}>수집 표현 {USER.wordsCollected}</span>
          </div>
          <h1 className="desk-title"><em>오늘의</em> 책상 위</h1>
        </div>
        <div className="desk-meta">
          <b>{USER.name}</b> · {USER.position}<br/>
          {USER.team}
        </div>
      </div>

      <ApplicationLine />

      <div className="desk-grid">
        <div className="col">
          <SceneCard scenario={today} npc={npc} onOpen={() => openScene(today)} />

          <div className="schedule">
            <div className="schedule-head">
              <span>오늘 일정 · DAY {USER.currentDay}</span>
              <span style={{ color: "var(--orange)" }}>● 진행 중</span>
            </div>
            {scheduleWithStatus.map((row, i) => (
              <div
                key={row.id}
                className={"schedule-row " + row.computed}
                onClick={() => row.computed !== "locked" && handleScheduleClick(row, i)}
                style={{
                  cursor: row.computed === "locked" ? "not-allowed" : "pointer",
                  opacity: row.computed === "locked" ? 0.4 : 1,
                  transition: "all 0.15s",
                }}
              >
                <span className="schedule-time">{row.time}</span>
                <span>
                  <span className="schedule-title" style={{ textDecoration: row.computed === "done" ? "line-through" : "none" }}>{row.title}</span>
                  {row.note ? <div className="schedule-note">{row.note}</div> : null}
                </span>
                <span className={"schedule-status " + row.computed}>
                  {row.computed === "done" ? "✓ 완료" : row.computed === "now" ? "👉 지금" : "🔒 잠금"}
                </span>
              </div>
            ))}
          </div>
        </div>

        <div className="col">
          {/* 사수 포스트잇 — 첫 todo (출근/단어 받기) 끝나면 책상에 떨어짐 */}
          {Object.keys(doneTasks).length >= 1 ? (
            <div key={"postit-" + USER.currentDay} className="appear-postit">
              <Postit mentor={CHARACTERS.mentor} text={today.mentorTip} word={today.word} />
            </div>
          ) : (
            <div className="empty-slot empty-postit">
              <span>📝 출근 도장 찍으면 사수가 노란 메모를 줘요</span>
            </div>
          )}

          {/* 유버디 1:1 — 시추에이션(2번째 todo) 끝나면 등장 */}
          {Object.keys(doneTasks).length >= 2 ? (
            <div key={"buddy-" + USER.currentDay} className="appear-buddy">
              <BuddyCard buddy={CHARACTERS.buddy} day={USER.currentDay} />
            </div>
          ) : (
            <div className="empty-slot empty-buddy">
              <span>💬 오늘 시추에이션 풀고 나면 유버디가 한 마디 줘요</span>
            </div>
          )}

          <div className="attendance">
            <div className="attendance-head">
              <span className="attendance-title">출근부 · 14일</span>
              <span className="attendance-num">{USER.streak}<small>일 연속</small></span>
            </div>
            <div className="attendance-cells">
              {cells.map(c => (
                <div
                  key={c.day}
                  className={"att-cell " + c.state + (c.weekend ? " weekend" : "")}
                  title={`Day ${c.day} · ${_DOW_KO[_dayOfWeek(c.day)]}요일${c.weekend ? " (주말)" : ""}`}
                >
                  {c.state === "" ? c.day : ""}
                </div>
              ))}
            </div>
            <div style={{ fontSize: 11, color: "var(--ink-mute)", marginTop: 10, lineHeight: 1.5 }}>
              하루도 빠지지 않으면 30일차에 <b style={{ color: "var(--stamp-red)" }}>완주 도장</b> 찍혀요.
            </div>
          </div>

          <div className="memo-box">
            <div className="memo-box-head">
              <span>사내 메모 · INTRANET</span>
              <b>{NOTICES.filter(n => n.unread).length}건</b>
            </div>
            {NOTICES.slice(0, 3).map(n => {
              const c = CHARACTERS[n.from];
              return (
                <button key={n.id} className={"memo-row " + (n.unread ? "unread" : "")} onClick={() => openMemo(n)}>
                  <div className="memo-from-avatar" style={{ background: c.color }}>{c.avatar}</div>
                  <div>
                    <div className="memo-subject">
                      <span className={"memo-tag " + (n.tag === "필수" ? "req" : "")}>{n.tag}</span>
                      {n.subject}
                    </div>
                  </div>
                  <div className="memo-meta">{n.date}</div>
                </button>
              );
            })}
          </div>

          <button className="btn btn-ink" style={{ width: "100%", justifyContent: "center" }} onClick={() => setActive("test")}>
            ✍️ 분기 평가 응시하기 (Day 30 예정) →
          </button>
        </div>
      </div>

      {/* 토스트 — 일정 항목 클릭 시 안내 */}
      {toast && (
        <div style={{
          position: "fixed", bottom: 28, left: "50%", transform: "translateX(-50%)",
          background: "#2A1F14", color: "#F4EFE3",
          padding: "12px 20px", borderRadius: 10,
          fontSize: 13, fontWeight: 600, lineHeight: 1.5,
          boxShadow: "0 16px 40px rgba(0,0,0,0.35)",
          maxWidth: 420, zIndex: 9000,
          animation: "fadeUp 0.25s ease-out",
        }}>
          {toast}
        </div>
      )}

      {/* 어휘 연습 활동 모달 — checkin / mission / lunch / recap / office_task / journal */}
      {activeItem ? (
        <ActivityModal
          item={activeItem.item}
          today={today}
          onClose={() => setActiveItem(null)}
          onComplete={completeActivity}
        />
      ) : null}

      {/* Day 1 투어 — 인터랙티브 spotlight (실제 UI 요소를 가리키며 안내) */}
      {tourStep >= 0 && tourStep < TOUR_STEPS.length && (() => {
        const step = TOUR_STEPS[tourStep];
        const tt = targetRect ? _computeTooltipPos(targetRect, step.placement) : null;
        const isLast = tourStep === TOUR_STEPS.length - 1;
        const hasTarget = !!targetRect;
        return (
          <>
            {/* 백드롭 — 타겟 있으면 spotlight, 없으면 단순 dim */}
            {hasTarget ? (
              <>
                {/* 외곽 4개 박스로 spotlight 효과 (클릭 차단 + dim) */}
                <div className="tour-dim" style={{ left: 0, top: 0, right: 0, height: Math.max(0, targetRect.top - 8) }} onClick={closeTour} />
                <div className="tour-dim" style={{ left: 0, top: targetRect.top + targetRect.height + 8, right: 0, bottom: 0 }} onClick={closeTour} />
                <div className="tour-dim" style={{ left: 0, top: Math.max(0, targetRect.top - 8), width: Math.max(0, targetRect.left - 8), height: targetRect.height + 16 }} onClick={closeTour} />
                <div className="tour-dim" style={{ left: targetRect.left + targetRect.width + 8, top: Math.max(0, targetRect.top - 8), right: 0, height: targetRect.height + 16 }} onClick={closeTour} />
                {/* spotlight 테두리 (펄스) */}
                <div className="tour-spotlight" style={{
                  position: "fixed",
                  left: targetRect.left - 8, top: targetRect.top - 8,
                  width: targetRect.width + 16, height: targetRect.height + 16,
                  pointerEvents: "none",
                }} />
              </>
            ) : (
              <div className="tour-dim" style={{ inset: 0 }} onClick={closeTour} />
            )}

            {/* 툴팁 — 타겟 옆에 anchor, 없으면 화면 중앙 */}
            <div style={{
              position: "fixed",
              ...(tt ? { left: tt.left, top: tt.top } : { left: "50%", top: "50%", transform: "translate(-50%, -50%)" }),
              width: window.innerWidth < 600 ? Math.min(360, window.innerWidth - 32) : 360,
              maxWidth: "calc(100vw - 32px)",
              background: "var(--paper)", border: "2px solid var(--accent)",
              borderRadius: 14,
              padding: window.innerWidth < 600 ? "18px 18px" : "22px 24px",
              boxShadow: "0 30px 60px -10px rgba(58,40,18,0.5)",
              zIndex: 9200,
              transition: "left 0.35s cubic-bezier(.4,.6,.3,1), top 0.35s cubic-bezier(.4,.6,.3,1)",
              boxSizing: "border-box",
            }}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", marginBottom: 10 }}>
                <div style={{ fontSize: 11, fontWeight: 800, letterSpacing: "0.12em", color: "var(--accent)" }}>
                  📍 첫 출근 가이드 · {tourStep + 1} / {TOUR_STEPS.length}
                </div>
                <div style={{ display: "flex", gap: 3 }}>
                  {TOUR_STEPS.map((_, i) => (
                    <span key={i} style={{
                      width: 6, height: 6, borderRadius: 3,
                      background: i === tourStep ? "var(--accent)" : i < tourStep ? "var(--accent-soft, rgba(216,90,42,0.3))" : "rgba(58,40,18,0.18)",
                    }} />
                  ))}
                </div>
              </div>
              <h3 style={{ fontSize: 19, fontWeight: 900, marginBottom: 10, lineHeight: 1.3, color: "var(--ink)" }}>
                {step.title}
              </h3>
              <p style={{ fontSize: 13.5, color: "var(--ink-soft)", lineHeight: 1.7, marginBottom: 18, wordBreak: "keep-all" }}>
                {step.body}
              </p>
              <div style={{ display: "flex", gap: 8, justifyContent: "space-between", alignItems: "center" }}>
                <div style={{ display: "flex", gap: 12 }}>
                  <button
                    onClick={closeTour}
                    style={{
                      background: "transparent", border: "none", color: "var(--ink-mute)",
                      fontSize: 12, cursor: "pointer", textDecoration: "underline", fontFamily: "inherit",
                    }}
                  >건너뛰기</button>
                  {tourStep > 0 && (
                    <button
                      onClick={() => setTourStep(tourStep - 1)}
                      style={{
                        background: "transparent", border: "none", color: "var(--ink-mute)",
                        fontSize: 12, cursor: "pointer", fontFamily: "inherit",
                      }}
                    >← 이전</button>
                  )}
                </div>
                <button
                  onClick={() => isLast ? closeTour() : setTourStep(tourStep + 1)}
                  style={{
                    background: "var(--accent)", color: "white", border: "none",
                    padding: "10px 18px", borderRadius: 8,
                    fontSize: 13, fontWeight: 700, cursor: "pointer", fontFamily: "inherit",
                    boxShadow: "0 4px 12px rgba(216,90,42,0.3)",
                  }}
                >
                  {isLast ? (step.cta || "시작하기 ✓") : "다음 →"}
                </button>
              </div>
            </div>
          </>
        );
      })()}

      <style>{`
        @keyframes fadeUp { from { opacity: 0; transform: translate(-50%, 12px); } to { opacity: 1; transform: translate(-50%, 0); } }
        .schedule-row.now { background: rgba(216,90,42,0.08); border-left: 3px solid var(--accent); }
        .schedule-row.now:hover { background: rgba(216,90,42,0.14); }
        .schedule-row.done { background: rgba(45,138,62,0.04); }
        .schedule-row.locked { background: transparent; }
        .schedule-status.done { color: #2D8A3E; font-weight: 700; }
        .schedule-status.now { color: var(--accent); font-weight: 800; animation: blink 1.5s ease-in-out infinite; }
        .schedule-status.locked { color: var(--ink-mute); opacity: 0.6; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.55; } }

        /* === 인터랙티브 투어 — spotlight + 펄스 === */
        .tour-dim {
          position: fixed; background: rgba(42,31,20,0.55);
          z-index: 9100; transition: all 0.35s cubic-bezier(.4,.6,.3,1);
        }
        .tour-spotlight {
          border-radius: 12px;
          border: 2.5px solid var(--orange);
          z-index: 9150;
          transition: all 0.35s cubic-bezier(.4,.6,.3,1);
          animation: tourPulse 1.6s ease-in-out infinite;
        }
        @keyframes tourPulse {
          0%, 100% { box-shadow: 0 0 0 4px rgba(216,90,42,0.25), 0 0 24px rgba(216,90,42,0.4); }
          50%      { box-shadow: 0 0 0 12px rgba(216,90,42,0.08), 0 0 32px rgba(216,90,42,0.55); }
        }

        /* === 출근 인증 도장 — 오늘 일정 다 끝내면 빨간 도장 === */
        .att-cell.stamped {
          background: rgba(178,58,44,0.06);
          border-color: var(--stamp-red);
          color: var(--stamp-red);
          font-weight: 900;
          position: relative;
          animation: stampPlace 0.65s cubic-bezier(.3,1.6,.4,1) both;
        }
        .att-cell.stamped::after {
          content: "출근";
          position: absolute; inset: -2px;
          display: grid; place-items: center;
          font-size: 11px; font-weight: 900; letter-spacing: 0.06em;
          color: var(--stamp-red);
          border: 2.5px solid var(--stamp-red);
          border-radius: 6px;
          transform: rotate(-8deg);
          background: rgba(178,58,44,0.05);
          animation: stampInk 0.45s cubic-bezier(.4,1.6,.36,1) 0.2s both;
        }
        @keyframes stampPlace {
          from { transform: scale(1.18); }

function TestPage() {
  const { SCENARIOS, CHARACTERS, USER } = window.__SIM;
  const studied = SCENARIOS.filter(s => s.status === "studied");
  const [phase, setPhase] = useState("idle");
  const [count, setCount] = useState(5);
  const [queue, setQueue] = useState([]);
  const [idx, setIdx] = useState(0);
  const [picked, setPicked] = useState(null);
  const [results, setResults] = useState([]);

  // Hooks must be called unconditionally — keep at top
  const cur = queue[idx];
  const opts = useMemo(() => {
    if (!cur) return [];
    const others = studied.filter(o => o.day !== cur.day).sort(() => Math.random() - 0.5).slice(0, 3).map(o => o.word);
    return [...others, cur.word].sort(() => Math.random() - 0.5);
  }, [cur && cur.day, idx]);

  function start(n) {
    const shuffled = [...studied].sort(() => Math.random() - 0.5).slice(0, n);
    setQueue(shuffled); setIdx(0); setResults([]); setPicked(null); setPhase("playing");
  }

  if (phase === "idle") {
    return (
      <div>
        <div className="desk-header">
          <div>
            <div className="desk-eyebrow">EVALUATION · 분기 평가</div>
            <h1 className="desk-title"><em>롤플레이</em> 시험 응시</h1>
          </div>
          <div className="desk-meta"><b>총 {studied.length}개</b> 학습 완료<br/>5개 시추에이션 무작위</div>
        </div>
        <ApprovalLine doc="YB-EVAL-Q1" applicant={USER.name} status="응시 대기" />

        <div className="eval-wrap">
          <div className="eval-head">
            <div>
              <div className="eval-head-sub">QUARTERLY EVALUATION</div>
              <div className="eval-head-title">5개 시추에이션 · 객관식 4지선다</div>
            </div>
            <div className="stamp">평가</div>
          </div>
          <div className="eval-body">
            <div style={{ fontSize: 14, lineHeight: 1.7, color: "var(--ink-soft)", marginBottom: 18 }}>
              실제 회의/이메일 상황이 주어집니다. 빈 칸에 들어갈 가장 자연스러운 영어 표현을 4개 보기에서 선택하세요.<br/>
              <b style={{ color: "var(--ink)" }}>틀려도 정답을 보여드려요. 모르는 단어는 다시 학습 노트에서 복습 가능.</b>
            </div>
            <div className="row">
              {[3, 5, 10].filter(n => n <= studied.length).map(n => (
                <button key={n} className={"filter-chip " + (count === n ? "active" : "")} onClick={() => setCount(n)}>{n}문제</button>
              ))}
            </div>
            <div className="row" style={{ marginTop: 22 }}>
              <button className="btn btn-primary" onClick={() => start(count)} disabled={studied.length === 0}>
                평가 시작 · {count}문제 →
              </button>
              <span style={{ fontSize: 11, color: "var(--ink-mute)" }}>실제 평가는 Day 30 자동 응시</span>
            </div>
          </div>
        </div>
      </div>
    );
  }

  if (phase === "done") {
    const correct = results.filter(r => r.ok).length;
    return (
      <div>
        <div className="desk-header">
          <div>
            <div className="desk-eyebrow">RESULT · 평가 결과서</div>
            <h1 className="desk-title"><em>{correct === queue.length ? "전원 통과!" : "수고했어요"}</em></h1>
          </div>
        </div>
        <div className="eval-wrap">
          <div className="eval-head">
            <div className="eval-head-title">평가 결과서</div>
            <div className={"stamp " + (correct >= queue.length * 0.6 ? "" : "blue")}>
              {correct === queue.length ? "통과" : correct >= queue.length * 0.6 ? "재검토" : "보류"}
            </div>
          </div>
          <div className="eval-body">
            <div style={{ fontSize: 64, fontWeight: 900, letterSpacing: "-0.04em", color: "var(--orange)", lineHeight: 1 }}>
              {correct}<span style={{ fontSize: 24, color: "var(--ink-mute)", fontWeight: 600 }}> / {queue.length}</span>
            </div>
            <div style={{ marginTop: 12, fontSize: 14, color: "var(--ink-soft)" }}>
              {correct === queue.length ? "사수가 칭찬해요. 다음 평가도 이대로!" : "틀린 문제는 업무 노트에서 다시 만나요."}
            </div>
            <div className="row" style={{ marginTop: 22 }}>
              <button className="btn btn-primary" onClick={() => start(count)}>다시 풀기 →</button>
              <button className="btn btn-ghost" onClick={() => setPhase("idle")}>설정으로</button>
            </div>
            <hr className="divider" />
            <div className="label-doc" style={{ marginBottom: 10 }}>풀이 기록</div>
            <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
              {results.map((r, i) => (
                <div key={i} style={{ display: "flex", justifyContent: "space-between", padding: "10px 14px", background: r.ok ? "rgba(74,124,89,0.06)" : "rgba(178,58,44,0.06)", border: "1px solid var(--line)", fontSize: 13 }}>
                  <span style={{ fontWeight: 800, color: "var(--ink)" }}>{queue[i].word}</span>
                  <span style={{ fontWeight: 800, color: r.ok ? "var(--green)" : "var(--stamp-red)", letterSpacing: "0.04em", fontSize: 11 }}>
                    {r.ok ? "✓ 정답" : "✗ 오답"}
                  </span>
                </div>
              ))}
            </div>
          </div>
        </div>
      </div>
    );
  }

  // playing
  const npc = CHARACTERS[cur.npc];
  const cells = queue.map((_, i) => {
    if (i < results.length) return results[i].ok ? "done" : "wrong";
    if (i === idx) return "current";
    return "";
  });

  function pick(opt) {
    if (picked) return;
    const ok = opt === cur.word;
    setPicked(opt);
    setTimeout(() => {
      const next = [...results, { ok, picked: opt }];
      setResults(next);
      if (idx + 1 >= queue.length) { setPhase("done"); return; }
      setIdx(idx + 1); setPicked(null);
    }, 1200);
  }

  return (
    <div>
      <div className="desk-header">
        <div>
          <div className="desk-eyebrow">EVALUATION · IN PROGRESS</div>
          <h1 className="desk-title">{idx + 1} / {queue.length} 문제</h1>
        </div>
      </div>
      <div className="eval-wrap">
        <div className="eval-head">
          <div className="eval-head-sub">Q. {idx + 1} / {queue.length}</div>
          <div className="eval-head-title">{cur.tags && cur.tags.map(t => "#" + t).join(" ")}</div>
        </div>
        <div className="eval-body">
          <div className="eval-progress">
            {cells.map((c, i) => <div key={i} className={"eval-progress-cell " + c}></div>)}
          </div>
          <div className="eval-q-num">SITUATION</div>
          <div className="eval-q-scene">📍 {cur.scene}</div>
          <div className="scene-quote-row" style={{ marginTop: 14 }}>
            <div className="scene-avatar" style={{ background: npc.color }}>{npc.avatar}</div>
            <div style={{ flex: 1 }}>
              <div className="scene-npc-name">{npc.name}</div>
              <div className="scene-quote-bubble">
                "{cur.quote.split(cur.word).map((p, i, arr) => (
                  <React.Fragment key={i}>
                    {p}
                    {i < arr.length - 1 ? <span style={{ background: "var(--ink)", color: "var(--paper)", padding: "1px 16px", letterSpacing: "0.5em" }}>____</span> : null}
                  </React.Fragment>
                ))}"
              </div>
            </div>
          </div>
          <div className="label-doc" style={{ marginTop: 22 }}>빈 칸에 들어갈 표현은?</div>
          <div className="eval-options">
            {opts.map((o, i) => {
              let cls = "";
              if (picked) {
                if (o === cur.word) cls = "correct";
                else if (o === picked) cls = "wrong";
              } else if (o === picked) cls = "selected";
              return (
                <button key={o} className={"eval-option " + cls} onClick={() => pick(o)}>
                  <span className="eval-option-letter">{String.fromCharCode(65 + i)}</span>
                  {o}
                </button>
              );
            })}
          </div>
        </div>
      </div>
    </div>
  );
}

// 인터랙티브 투어 — 타겟 사각형 기준 툴팁 위치 계산
function _computeTooltipPos(rect, placement) {
  const vw = window.innerWidth, vh = window.innerHeight;
  const PAD = 16;
  const isNarrow = vw < 600;
  // 모바일에선 width를 viewport에 맞춰서 줄임 (좌우 16px 마진)
  const TT_W = isNarrow ? Math.min(360, vw - 32) : 360;
  const TT_H = isNarrow ? 240 : 200;

  // ── 모바일: placement 무시하고 가운데 정렬, 위/아래 중 공간 더 큰 쪽 ──
  if (isNarrow) {
    const left = Math.max(PAD, (vw - TT_W) / 2);
    const spaceBelow = vh - rect.bottom - PAD;
    const spaceAbove = rect.top - PAD;
    let top;
    if (spaceBelow >= TT_H) {
      top = rect.bottom + PAD;
    } else if (spaceAbove >= TT_H) {
      top = rect.top - TT_H - PAD;
    } else {
      top = (vh - TT_H) / 2;  // 공간 부족 → 중앙
    }
    top = Math.max(PAD, Math.min(vh - TT_H - PAD, top));
    return { left, top, placement: 'mobile' };
  }

  // ── 데스크탑: placement 기준 + 부족하면 fallback ──
  let p = placement || "auto";
  if (p === "auto") {
    if (rect.right + TT_W + PAD < vw) p = "right";
    else if (rect.left - TT_W - PAD > 0) p = "left";
    else if (rect.bottom + TT_H + PAD < vh) p = "bottom";
    else p = "top";
  }
  // 지정된 placement에 공간 없으면 자동 fallback
  if (p === "right" && rect.right + TT_W + PAD > vw) p = (rect.left - TT_W - PAD > 0) ? "left" : "bottom";
  if (p === "left"  && rect.left  - TT_W - PAD < 0)  p = (rect.right + TT_W + PAD < vw) ? "right" : "bottom";

  let left, top;
  switch (p) {
    case "right":  left = rect.right + PAD;          top = rect.top + rect.height/2 - TT_H/2; break;
    case "left":   left = rect.left - TT_W - PAD;    top = rect.top + rect.height/2 - TT_H/2; break;
    case "top":    left = rect.left + rect.width/2 - TT_W/2; top = rect.top - TT_H - PAD;     break;
    case "bottom":
    default:       left = rect.left + rect.width/2 - TT_W/2; top = rect.bottom + PAD;
  }
  left = Math.max(PAD, Math.min(vw - TT_W - PAD, left));
  top  = Math.max(PAD, Math.min(vh - TT_H - PAD, top));
  return { left, top, placement: p };
}

// 음성 — 남/여 번갈아 (할아버지 보이스 회피)
window.__OD_VOICE_TURN = window.__OD_VOICE_TURN || 0;
const _VOICE_FEMALE = ["Samantha", "Karen", "Tessa", "Kate", "Allison", "Victoria", "Susan", "Ava", "Moira", "Isha", "Joanna", "Salli"];
const _VOICE_MALE   = ["Alex", "Daniel", "Aaron", "Tom", "Lee", "Oliver", "Arthur", "Reed", "Rocko", "Joey", "Matthew"];
function _pickVoice() {
  if (!("speechSynthesis" in window)) return null;
  const voices = window.speechSynthesis.getVoices();
  if (!voices.length) return null;
  const turn = window.__OD_VOICE_TURN++;
  const wantFemale = turn % 2 === 0;
  const tryList = (names) => {
    for (const name of names) {
      const v = voices.find(v => v.name.toLowerCase().includes(name.toLowerCase()) && v.lang.toLowerCase().startsWith("en"));
      if (v) return v;
    }
    return null;
  };
  return tryList(wantFemale ? _VOICE_FEMALE : _VOICE_MALE)
    || tryList(wantFemale ? _VOICE_MALE : _VOICE_FEMALE)
    || voices.find(v => v.lang === "en-US")
    || voices.find(v => v.lang.toLowerCase().startsWith("en"))
    || voices[0];
}
function _speakWord(word) {
  if (!("speechSynthesis" in window) || !word) return;
  const fire = () => {
    try { window.speechSynthesis.cancel(); } catch (e) {}
    const u = new SpeechSynthesisUtterance(word);
    u.lang = "en-US"; u.rate = 0.92; u.pitch = 1.0;
    const v = _pickVoice();
    if (v) u.voice = v;
    window.speechSynthesis.speak(u);
  };
  // 첫 호출 시 voices 비어있을 수 있음 → 짧게 기다렸다 재시도
  if (!window.speechSynthesis.getVoices().length) setTimeout(fire, 250);
  else fire();
}
// 페이지 로드 시 voices 미리 로드 트리거
if ("speechSynthesis" in window) {
  try { window.speechSynthesis.getVoices(); } catch(e) {}
  window.speechSynthesis.onvoiceschanged = () => { /* warm */ };
}

function _pickField(currentWord, count, key) {
  const { SCENARIOS, USER } = window.__SIM;
  const pool = SCENARIOS
    .filter(s => s.word !== currentWord && s.day <= Math.max(USER.wordsCollected + 5, 12))
    .map(s => s[key])
    .filter(Boolean);
  return _shuf([...new Set(pool)]).slice(0, count);
}
function _pickWordObjects(excludeWord, count) {
  const { SCENARIOS, USER } = window.__SIM;
  const pool = SCENARIOS.filter(s => s.word !== excludeWord && s.day <= Math.max(USER.wordsCollected, 12));
  return _shuf(pool).slice(0, count);
}

// === 2. MINI_MISSION — 컨텍스트 한 줄 미션 (3중 가장 자연스러운 거 고르기) ===

  const { CHARACTERS } = window.__SIM;

  // 3 옵션: 정답(sampleAnswer) + 너무 격식 + 단어 안 쓴 어색한 표현
  const options = useMemo(() => {
    const correct = today.sampleAnswer || `Let's ${today.word} on this — quick win.`;
    const tooFormal = `Pursuant to my prior correspondence, kindly note ${today.word} accordingly.`;
    const noWord = `Yeah ok let me think and get back to you on this one.`;

      { text: correct, kind: "correct", note: "오늘 단어 자연스럽게 + 톤 정확. 이게 정답." },

      </div>
      <div style={{ marginTop: 16, fontSize: 14, fontWeight: 700, color: "var(--ink)" }}>

      </div>
      <div style={{ marginTop: 10, display: "grid", gap: 8 }}>
        {options.map((o, i) => {
          const isPicked = pick === o.text;
          const showResult = pick !== null;
          const ok = o.kind === "correct";
          return (
            <button

                background: showResult && ok ? "rgba(74,124,89,0.10)" : isPicked ? "rgba(178,58,44,0.06)" : "var(--cream)",

                transition: "all 0.15s",
              }}

              {String.fromCharCode(65 + i)}. "{o.text}"

            </button>
          );
        })}
      </div>
      {picked && (
        <>
          <FeedbackBox ok={picked.kind === "correct"} correct={today.sampleAnswer} hint={today.mentorTip} />
          <div className="row" style={{ marginTop: 14, justifyContent: "flex-end", gap: 8 }}>
            <button className="btn btn-ghost" onClick={() => setPick(null)}>다시 풀기</button>
