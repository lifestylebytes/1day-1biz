// ── 통계 계산 헬퍼 (Day 60 면담에서도 재활용) ──
function _statMasteredWords(u) {
  return new Set((u.scenariosCompleted || []).map(s => s && s.word).filter(Boolean)).size;
}
function _statNotes(u) {
  return Object.values(u.savedNotes || {}).reduce((a, arr) => a + (Array.isArray(arr) ? arr.length : 0), 0);
}
function _statJournals(u) {
  return Object.keys(u.dailyJournals || {}).length;
}
function _statBestStreak(u) {
  const days = new Set();
  (u.scenariosCompleted || []).forEach(s => { if (s && s.day) days.add(Number(s.day)); });
  Object.keys(u.dailyJournals || {}).forEach(k => { const n = Number(k); if (n) days.add(n); });
  try {
    Object.keys(localStorage).filter(k => k.startsWith("__OD_TASKS_DAY_") && !k.endsWith("_ts")).forEach(k => {
      const t = JSON.parse(localStorage.getItem(k) || "{}");
      if (Object.values(t).filter(Boolean).length >= 4) {
        const n = Number(k.replace("__OD_TASKS_DAY_", ""));
        if (n) days.add(n);
      }
    });
  } catch (e) {}
  const arr = [...days].filter(d => d >= 1).sort((a, b) => a - b);
  let best = 0, cur = 0, prev = null;
  arr.forEach(d => {
    cur = (prev !== null && d === prev + 1) ? cur + 1 : 1;
    if (cur > best) best = cur;
    prev = d;
  });
  return best;
}

// ── 실제 완주한 날 수 (달력 day가 아니라 진짜 출석한 일수). 마일스톤 트리거용. ──
function _completedDayCount(u) {
  const days = new Set();
  (u.scenariosCompleted || []).forEach(s => { if (s && s.day) days.add(Number(s.day)); });
  Object.keys(u.dailyJournals || {}).forEach(k => { const n = Number(k); if (n) days.add(n); });
  try {
    Object.keys(localStorage).filter(k => k.startsWith("__OD_TASKS_DAY_") && !k.endsWith("_ts")).forEach(k => {
      const t = JSON.parse(localStorage.getItem(k) || "{}");
      if (Object.values(t).filter(Boolean).length >= 4) {
        const n = Number(k.replace("__OD_TASKS_DAY_", ""));
        if (n) days.add(n);
      }
    });
  } catch (e) {}
  return [...days].filter(d => d >= 1).length;
}

function _tfState() {
  // 전용 키 사용: __OD_USER는 앱이 통째로 재저장하는 객체라 커스텀 필드가 증발한다.
  try {
    const u = JSON.parse(localStorage.getItem("__OD_USER") || "null") || {};
    const em = u.email || "guest";
    let track = JSON.parse(localStorage.getItem("__OD_TF_TRACK_" + em) || "null");
    const done0 = JSON.parse(localStorage.getItem("__OD_TF_DONE_" + em) || "[]");
    const done = Array.isArray(done0) ? done0 : [];
    // ── 30일 수료 자동 처리: startedDay부터 30일이 다 지나면 (예: 91 시작 → Day 121)
    //    수료 목록으로 옮기고 트랙을 비워서 다음 TF 신청서가 뜨게 한다 ──
    const _rd = (typeof USER !== "undefined" && (USER.realCurrentDay || USER.currentDay)) || 0;
    if (track && _rd > 90) {
      const _first = 91 + 30 * done.length;  // 트랙 시작 Day (Day 91 절대 기준, 2026-08-26)
      if (_rd >= _first + 30) {
        const _gid = track.id || track;
        if (_gid && !done.includes(_gid)) done.push(_gid);
        localStorage.setItem("__OD_TF_DONE_" + em, JSON.stringify(done));
        localStorage.removeItem("__OD_TF_TRACK_" + em);
        localStorage.setItem("__OD_TF_GRAD_" + em, JSON.stringify({ id: _gid, day: _rd, at: new Date().toISOString() }));
        if (u.email && window.OD) {
          const _emp2 = u.empNumber || u.emp_number || null;
          if (window.OD.saveTfState) {
            window.OD.saveTfState(u.email, _emp2, null, null, done).then(r => {
              if (!r || !r.ok) window.OD.updateProgress?.(u.email, { tf_track: null, tf_done: done }).catch(() => {});
            }).catch(() => {});
          } else if (window.OD.updateProgress) {
            window.OD.updateProgress(u.email, { tf_track: null, tf_done: done }).catch(() => {});
          }
        }
        track = null;
      }
    }
    return { track: track || null, done };
  } catch (e) { return { track: null, done: [] }; }
}

// 팁 3종을 나만의 노트(savedNotes[day])에 저장 + DB(notes) 동기화
function _saveFwpTips(day) {
  try {
    const raw = localStorage.getItem("__OD_USER");
    const u = raw ? JSON.parse(raw) : {};
    u.savedNotes = u.savedNotes || {};
    const dayKey = String(day);
    u.savedNotes[dayKey] = u.savedNotes[dayKey] || [];
    const cfg = FWP_TIPS[day];
    if (!cfg) return false;
    const added = [];
    cfg.tips.forEach(t => {
      const text = t[0] + " · " + t[1];
      if (u.savedNotes[dayKey].some(n => n.text === text)) return;
      const entry = { kind: "memo", label: "첫 주 꿀팁", text, savedAt: new Date().toISOString() };
      u.savedNotes[dayKey].push(entry);
      added.push(entry);
    });
    localStorage.setItem("__OD_USER", JSON.stringify(u));
    if (added.length && window.OD && window.OD.enabled && window.OD.saveNoteRow && u.email) {
      added.forEach(entry => {
        window.OD.saveNoteRow(u.email, day, entry.text, entry.label, entry.kind).then(r => {
          if (!r || !r.ok) window.OD.pushOutbox && window.OD.pushOutbox({ type: 'note', email: u.email, day, text: entry.text, label: entry.label, kind: entry.kind });
        }).catch(() => {
          window.OD.pushOutbox && window.OD.pushOutbox({ type: 'note', email: u.email, day, text: entry.text, label: entry.label, kind: entry.kind });
        });
      });
    }
    return true;
  } catch (e) { return false; }
}

    <div style={{ position: "fixed", inset: 0, zIndex: 9500, background: "rgba(42,31,20,0.8)", backdropFilter: "blur(5px)", display: "flex", alignItems: "center", justifyContent: "center", padding: 20 }}>
      <div style={{ position: "relative", background: "var(--paper)", border: "1px solid var(--line)", borderRadius: 14, maxWidth: 380, width: "100%", padding: "24px 22px 20px", boxShadow: "0 30px 70px -10px rgba(0,0,0,0.45)", animation: "fadeUp 0.3s ease-out", maxHeight: "88vh", overflowY: "auto" }}>
        <button onClick={onClose} aria-label="닫기"
          style={{ position: "absolute", top: 10, right: 10, width: 28, height: 28, borderRadius: "50%", border: "none", background: "transparent", color: "var(--ink-mute)", fontSize: 17, lineHeight: 1, cursor: "pointer", fontFamily: "inherit", zIndex: 2 }}>✕</button>
        {inner}
        {footer}
      </div>
    </div>
  );
  const cta = (label, on) => (
    <button className="btn btn-primary" style={{ width: "100%", marginTop: 10 }} onClick={on || onClose}>{label}</button>
  );
  const eyebrow = (t) => (
    <div style={{ fontSize: 10.5, letterSpacing: "0.18em", fontWeight: 800, color: "var(--orange)", textTransform: "uppercase", marginBottom: 10 }}>{t}</div>
  );
  // 공통 팁 카드 (반듯한 노란 카드): FWP_TIPS[day] 렌더
  const tipCard = () => {
    const cfg = FWP_TIPS[day];
    if (!cfg) return null;
    return (
      <div style={{ background: "#FBF3C9", border: "1px solid #E8D48A", borderRadius: 10, padding: "14px 15px", boxShadow: "0 6px 14px -8px rgba(58,40,18,0.35)", marginBottom: 10 }}>
        <div style={{ fontSize: 12.5, fontWeight: 900, color: "#5C4A36", marginBottom: 9 }}>{cfg.title}</div>
        {cfg.tips.map((t, i) => (
          <div key={i} style={{ padding: "7px 0", borderTop: i ? "1px dashed #E0CF96" : "none" }}>
            <div style={{ fontSize: 13, fontWeight: 800, color: "#3D3222" }}>{t[0]}</div>
            <div style={{ fontSize: 11.5, color: "#7A6844", lineHeight: 1.55, marginTop: 2 }}>{t[1]}</div>
          </div>
        ))}
      </div>
    );
  };
  // 노트 저장 버튼 (저장하면 나만의 노트 Day N에 3줄로 들어감)
  const saveBtn = () => (
    <button
      onClick={() => { if (!tipsSaved && _saveFwpTips(day)) setTipsSaved(true); }}
      disabled={tipsSaved}
      style={{ width: "100%", fontFamily: "inherit", fontSize: 12.5, fontWeight: 800, padding: "10px 12px", borderRadius: 9, cursor: tipsSaved ? "default" : "pointer",
        border: tipsSaved ? "1px solid #2D7A3D" : "1px dashed var(--orange)",
        background: tipsSaved ? "#EEF6EE" : "var(--paper-warm)",
        color: tipsSaved ? "#2D7A3D" : "var(--orange)" }}>
      {tipsSaved ? "✓ 나만의 노트에 저장됐어요 (Day " + day + ")" : "📓 이 3개, 내 표현 노트에 저장하기"}
    </button>
  );

  if (day === 1) {
    return shell(
      <>
        {eyebrow("총무팀 · 웰컴 키트 도착")}
        {step === 0 ? (
          <div style={{ textAlign: "center", padding: "8px 0" }}>
            <div style={{ fontSize: 54, marginBottom: 10 }}>📦</div>
            <div style={{ fontSize: 17, fontWeight: 900, color: "var(--ink)", marginBottom: 6 }}>{name}님 앞으로 상자가 하나 와 있어요</div>
            <div style={{ fontSize: 12.5, color: "var(--ink-soft)", lineHeight: 1.6 }}>사원증과 회사 노트, 그리고 사수가 넣어둔 카드 한 장.</div>
          </div>
        ) : (
          <div>
            <div style={{ fontSize: 12.5, color: "var(--ink-soft)", lineHeight: 1.6, marginBottom: 10 }}>
              🪪 사원증과 📓 회사 노트는 책상에 뒀어요.<br/>제일 중요한 건 이 카드예요. 사수가 손글씨로 써뒀네요.
            </div>
            {tipCard()}
            {saveBtn()}
          </div>
        )}
      </>,
      step === 0 ? cta("포장 뜯기 ✂️", () => setStep(1)) : cta("카드 챙기기 →")
    );
  }

  if (day === 2) {
    return shell(
      <>
        {eyebrow("12F 탕비실 · 오전 10:40")}
        <div style={{ display: "flex", gap: 11, alignItems: "flex-start", marginBottom: 11 }}>
          <div style={{ width: 38, height: 38, borderRadius: "50%", background: "#B89968", color: "#fff", fontWeight: 800, fontSize: 15, display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}>박</div>
          <div>
            <div style={{ fontSize: 12, fontWeight: 800, color: "var(--ink)", marginBottom: 4 }}>박 대리 <span style={{ fontWeight: 600, color: "var(--ink-mute)" }}>· 동기 · 옆자리</span></div>
            <div style={{ background: "var(--paper-warm)", border: "1px solid var(--line)", borderRadius: "3px 12px 12px 12px", padding: "10px 13px", fontSize: 13, color: "var(--ink)", lineHeight: 1.6 }}>
              ☕ 이거 하나는 {name}님 거예요. 외국인 동료랑 커피 마실 때 어색하게 웃던 시절에 저 살려준 세 마디 알려드릴게요.
            </div>
          </div>
        </div>
        {tipCard()}
        {saveBtn()}
        <div style={{ fontSize: 11.5, color: "var(--ink-mute)", textAlign: "center", lineHeight: 1.6, marginTop: 8 }}>
          🤫 그리고 하나 더: 우리 회사는 그날 학습을 끝내야 다음 Day가 열려요. 진도는 도망 안 가요.
        </div>
      </>,
      cta("☕ 잘 마실게요")
    );
  }

  if (day === 3) {
    return shell(
      <>
        {eyebrow("사수의 포스트잇 · 3일차 보너스 팁")}
        <div style={{ display: "flex", gap: 10, alignItems: "center", marginBottom: 12 }}>
          <div style={{ width: 34, height: 34, borderRadius: "50%", background: "#E8743C", color: "#fff", fontWeight: 800, fontSize: 14, display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}>차</div>
          <div style={{ fontSize: 13, color: "var(--ink)", lineHeight: 1.55 }}>
            <b>차윤아 사수</b>가 모니터에 포스트잇을 붙여뒀어요.<br/>
            <span style={{ fontSize: 12, color: "var(--ink-mute)" }}>"3일이나 버텼으니, 실전용 하나 알려드릴게요."</span>
          </div>
        </div>
        {tipCard()}
        {saveBtn()}
        <div style={{ fontSize: 11.5, color: "var(--ink-mute)", textAlign: "center", lineHeight: 1.6, marginTop: 8 }}>셋 다 내일 아침 메일에 그대로 복붙해도 돼요.</div>
      </>,
      cta("📌 잘 보이는 데 붙여두기")
    );
  }

  if (day === 4) {
    return shell(
      <>
        {eyebrow("퇴근길 · 슬랙 DM")}
        <div className="slack-frame" style={{ marginBottom: 10 }}>
          <div className="slack-head"><span>💬</span><span className="slack-channel">김 팀장</span><span className="slack-channel-meta">18:47</span></div>
          <div className="slack-body">
            <div className="slack-msg">
              <div className="slack-msg-avatar" style={{ background: "#3A4A5C" }}>김</div>
              <div className="slack-msg-content">
                <div><span className="slack-msg-name">김 팀장</span><span className="slack-msg-time">18:47</span></div>
                <div className="slack-msg-text">Still here? 4일 버텼으면 이제 마감 얘기할 때 쓰는 말은 알아야지.</div>
              </div>
            </div>
          </div>
        </div>
        {tipCard()}
        {saveBtn()}
        <div style={{ fontSize: 12, color: "var(--ink-soft)", lineHeight: 1.6, textAlign: "center", marginTop: 8 }}>
          그리고 내일 회의에서 내가 쓸 단어 하나 미리 흘려주지.{" "}
          {spoil
            ? <><b style={{ background: "var(--highlight, #FBE9A9)", padding: "1px 6px", borderRadius: 4 }}>{(nextScn && nextScn.word) || ""}</b> <span style={{ fontSize: 11.5, color: "var(--ink-mute)" }}>({(nextScn && nextScn.meaning) || ""})</span></>
            : <button onClick={() => setSpoil(true)} style={{ fontFamily: "inherit", border: "1px dashed var(--line)", background: "var(--paper-warm)", borderRadius: 6, padding: "2px 10px", fontSize: 12, fontWeight: 800, color: "var(--ink-mute)", cursor: "pointer" }}>🔒 탭해서 미리 보기</button>}
        </div>
      </>,
      cta(spoil ? "내일 아는 척하러 가기 →" : "퇴근하기")
    );
  }

  // day 5: 첫 주 급여명세서 + 보너스 팁
  const rows = [
    ["수집한 표현", (USER.wordsCollected || 5) + "개"],
    ["출근 도장", (USER.streak || 5) + "일"],
    ["사수의 첨삭", "매일 1회"],
  ];
  return shell(
    <>
      {eyebrow("경리팀 · 첫 주 급여명세서")}
      <div style={{ textAlign: "center", marginBottom: 10 }}>
        <div style={{ fontSize: 34, marginBottom: 4 }}>💌</div>
        <div style={{ fontSize: 16, fontWeight: 900, color: "var(--ink)" }}>{name}님의 첫 주 급여가 입금됐어요</div>
      </div>
      <div style={{ border: "1px solid var(--line)", borderRadius: 10, overflow: "hidden", marginBottom: 10 }}>
        {rows.map((r, i) => (
          <div key={i} style={{ display: "flex", justifyContent: "space-between", padding: "8px 13px", fontSize: 12.5, background: i % 2 ? "var(--paper-warm)" : "var(--paper)", color: "var(--ink)" }}>
            <span style={{ color: "var(--ink-soft)" }}>{r[0]}</span><b>{r[1]}</b>
          </div>
        ))}
        <div style={{ display: "flex", justifyContent: "space-between", padding: "9px 13px", fontSize: 12.5, background: "var(--ink)", color: "var(--paper)", fontWeight: 800 }}>
          <span>실수령액</span><span>영어 앞에서 안 작아지는 5일 🏅</span>
        </div>
      </div>
      {tipCard()}
      {saveBtn()}
    </>,
    cta("다음 주도 다니기 💪")
  );
}

function TrackSelectModal({ done, onClose }) {
  const [pick, setPick] = useState(null);
  const [saved, setSaved] = useState(false);
  const local = (() => { try { return JSON.parse(localStorage.getItem("__OD_USER") || "null") || {}; } catch (e) { return {}; } })();
  const name = local.name || "대리";
  const remaining = TF_TRACKS.filter(t => !(done || []).includes(t.id));
  const nth = (done || []).length + 1;

  const confirm = () => {
    if (!pick || saved) return;
    setSaved(true);
    const startedAt = new Date().toISOString();
    // TF Day 1이 표시되는 회사 Day. 보통 Day 90 심사 직후 선택 → Day 91부터 1/30.
    const startedDay = Math.max(91, Number(local.dayInCompany) || 90);
    try {
      const em = local.email || "guest";
      localStorage.setItem("__OD_TF_TRACK_" + em, JSON.stringify({ id: pick, startedAt, startedDay }));
      localStorage.setItem("__OD_TF_DONE_" + em, JSON.stringify(done || []));
    } catch (e) {}
    if (local.email && window.OD) {
      // RPC 우선 (RLS 무관), 구버전 배포 대비 updateProgress 백업
      const _emp = local.empNumber || local.emp_number || null;
      if (window.OD.saveTfState) {
        window.OD.saveTfState(local.email, _emp, pick, startedAt, done || []).then(r => {
          if (!r || !r.ok) window.OD.updateProgress?.(local.email, { tf_track: pick, tf_started_at: startedAt }).catch(() => {});
        }).catch(() => {});
      } else if (window.OD.updateProgress) {
        window.OD.updateProgress(local.email, { tf_track: pick, tf_started_at: startedAt }).catch(() => {});
      }
    }
    try { if (window.gtag) window.gtag("event", "tf_select", { track: pick, nth }); } catch (e) {}
  };
  const picked = TF_TRACKS.find(t => t.id === pick);

  return (
    <div style={{ position: "fixed", inset: 0, zIndex: 9210, background: "rgba(42,31,20,0.82)", backdropFilter: "blur(5px)", display: "flex", alignItems: "center", justifyContent: "center", padding: 20, overflowY: "auto" }}>
      <div style={{ background: "var(--paper)", border: "1px solid var(--line)", borderRadius: 14, maxWidth: 680, width: "100%", padding: "28px 26px 24px", margin: "auto", boxShadow: "0 30px 70px -10px rgba(0,0,0,0.45)" }}>
        {saved ? (
          <div style={{ textAlign: "center", padding: "14px 0" }}>
            <div style={{ fontSize: 44, marginBottom: 10 }}>{picked.emoji}</div>
            <h2 style={{ fontSize: 20, fontWeight: 900, color: "var(--ink)", marginBottom: 8 }}>{picked.name} 발령 완료</h2>
            <p style={{ fontSize: 13, color: "var(--ink-soft)", lineHeight: 1.7, marginBottom: 16 }}>
              {name}님, 오늘부터 {picked.name} 소속이에요.<br/>
              첫 임무가 책상에 도착하는 대로 시작됩니다.<br/>
              <span style={{ color: "var(--ink-mute)", fontSize: 12 }}>30일 완주하면 다음 TF를 고를 수 있어요. ({nth}/4)</span>
            </p>
            <button className="btn btn-primary" style={{ width: "100%" }} onClick={onClose}>출근하기 →</button>
          </div>
        ) : (
          <>
            <div style={{ fontSize: 11, letterSpacing: "0.2em", fontWeight: 800, color: "var(--orange)", textTransform: "uppercase", marginBottom: 10 }}>인사 발령 · TF 신청서</div>
            {nth > 1 && (() => {
              const lastId = (done || [])[(done || []).length - 1];
              const lastMeta = TF_TRACKS.find(t => t.id === lastId);
              return lastMeta ? (
                <div style={{ background: "var(--paper-warm)", border: "1px solid var(--line)", borderRadius: 9, padding: "9px 12px", marginBottom: 12, fontSize: 12.5, color: "var(--ink-soft)", lineHeight: 1.5 }}>
                  🎉 <b style={{ color: lastMeta.color }}>{lastMeta.emoji} {lastMeta.name}</b> 30일 수료! 인사팀에 수료 기록이 등록됐어요.
                </div>
              ) : null;
            })()}
            <h2 style={{ fontSize: 19, fontWeight: 900, color: "var(--ink)", lineHeight: 1.4, marginBottom: 6 }}>
              {nth === 1 ? `${name} 대리님, 첫 TF를 선택하세요` : `다음 TF를 선택하세요 (${nth}번째)`}
            </h2>
            <p style={{ fontSize: 12.5, color: "var(--ink-soft)", lineHeight: 1.65, marginBottom: 16 }}>
              트랙마다 30일. 순서는 자유. 4개를 모두 완주하면 <b>과장 승진 심사</b>가 열려요.
            </p>
            <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(140px, 1fr))", gap: 8, marginBottom: 16 }}>
              {TF_TRACKS.map(t => {
                const isDone = (done || []).includes(t.id);
                const isPick = pick === t.id;
                return (
                  <button key={t.id} disabled={isDone} onClick={() => setPick(t.id)}
                    style={{ textAlign: "center", fontFamily: "inherit", cursor: isDone ? "default" : "pointer", opacity: isDone ? 0.45 : 1,
                      display: "flex", flexDirection: "column", alignItems: "center", gap: 6, padding: "16px 10px 13px", borderRadius: 11, position: "relative",
                      border: isPick ? `2px solid ${t.color}` : "1px solid var(--line)",
                      background: isPick ? "var(--paper-warm)" : "var(--paper)", transition: "all 0.12s" }}>
                    <span style={{ fontSize: 26 }}>{t.emoji}</span>
                    <span style={{ fontSize: 13.5, fontWeight: 900, color: t.color, lineHeight: 1.3 }}>{t.name}{isDone && <><br/>수료 ✓</>}</span>
                    <span style={{ fontSize: 11, color: "var(--ink-soft)", lineHeight: 1.45, wordBreak: "keep-all" }}>{t.tagline}</span>
                    {isPick && <span style={{ position: "absolute", top: 7, right: 9, fontSize: 14, color: t.color, fontWeight: 900 }}>✓</span>}
                  </button>
                );
              })}
            </div>
            <button className="btn btn-primary" style={{ width: "100%", opacity: pick ? 1 : 0.5 }} disabled={!pick} onClick={confirm}>
              {picked ? `${picked.name}로 발령 요청 →` : "트랙을 골라주세요"}
            </button>
          </>
        )}
      </div>
    </div>
  );
}

// ── Day 90 대리 승진 시험: 사원 90일 완주 → 미니 시험(Day 61-90 풀) → 대리 승진 축하 ──
function Season3Checkpoint({ onClose }) {
  const [step, setStep] = useState(0);   // 0 인트로 / 1 시험 / 2 결과·승진
  const [qIdx, setQIdx] = useState(0);
  const [pick, setPick] = useState(null);
  const [picks, setPicks] = useState([]);
  const local = (() => { try { return JSON.parse(localStorage.getItem("__OD_USER") || "null") || {}; } catch (e) { return {}; } })();
  const name = local.name || "사원";
  const questions = useMemo(() => _buildLevelupQuestions(90, 10, 61), []);
  const q = questions[qIdx];
  const score = questions.length ? Math.round(picks.filter(p => p.ok).length / questions.length * 100) : 100;
  const scoreMent = score >= 90 ? "탁월하게 통과!" : score >= 70 ? "여유롭게 통과!" : score >= 50 ? "통과!" : "통과! 복습이 필요한 단어가 보여요.";
  const onPick = (opt) => { if (pick) return; setPick(opt); setPicks(prev => [...prev, { ok: opt === q.correct }]); };
  const goNext = () => { if (qIdx >= questions.length - 1) { setStep(2); return; } setQIdx(qIdx + 1); setPick(null); };
  return (
    <div style={{ position: "fixed", inset: 0, zIndex: 9200, background: "rgba(42,31,20,0.82)", backdropFilter: "blur(5px)", display: "flex", alignItems: "center", justifyContent: "center", padding: 20, overflowY: "auto" }}>
      <div style={{ background: "var(--paper)", border: "1px solid var(--line)", borderRadius: 14, maxWidth: 480, width: "100%", padding: "30px 26px 26px", margin: "auto", boxShadow: "0 30px 70px -10px rgba(0,0,0,0.45)" }}>
        <div style={{ fontSize: 11, letterSpacing: "0.2em", fontWeight: 800, color: "var(--orange)", textTransform: "uppercase", marginBottom: 14 }}>
          대리 승진 심사 {step === 1 ? `· 시험 ${qIdx + 1}/${questions.length}` : ""}
        </div>
        {step === 0 && (
          <div>
            <div style={{ fontSize: 46, marginBottom: 10 }}>🎖️</div>
            <h2 style={{ fontSize: 21, fontWeight: 900, lineHeight: 1.4, color: "var(--ink)", marginBottom: 12 }}>{name}님, 사원 90일 완주!</h2>
            <p style={{ fontSize: 13.5, color: "var(--ink-soft)", lineHeight: 1.75, marginBottom: 16 }}>
              마지막 관문이에요. Day 61-90에서 쌓은 표현으로 대리 승진 시험(10문항)을 보고, 통과하면 <b>대리 (Senior Associate)</b>로 승진해요.
            </p>
            <button className="btn btn-primary" style={{ width: "100%" }} onClick={() => setStep(1)}>승진 시험 시작 →</button>
          </div>
        )}
        {step === 1 && q && (
          <div>
            <div style={{ background: "var(--paper-warm)", border: "1px solid var(--line)", borderRadius: 10, padding: "16px", marginBottom: 14, fontSize: 14.5, lineHeight: 1.6, color: "var(--ink)", fontWeight: 600 }}>{q.target}</div>
            <div style={{ display: "grid", gap: 8, marginBottom: 14 }}>
              {q.options.map(opt => { const show = !!pick, isC = opt === q.correct, isP = pick === opt; return (
                <button key={opt} onClick={() => onPick(opt)} style={{ textAlign: "left", padding: "11px 14px", borderRadius: 8, border: "1px solid " + (show && isC ? "var(--orange)" : isP ? "#993C1D" : "var(--line)"), background: show && isC ? "rgba(216,90,42,0.10)" : "var(--paper)", fontSize: 13.5, fontWeight: 600, color: "var(--ink)", cursor: pick ? "default" : "pointer", fontFamily: "inherit" }}>
                  {opt} {show && isC ? "✓" : (show && isP ? "✕" : "")}
                </button> ); })}
            </div>
            {pick && <div style={{ fontSize: 12, color: "var(--ink-soft)", lineHeight: 1.65, background: "var(--paper-warm)", borderRadius: 8, padding: "10px 12px", marginBottom: 14 }}>{q.hint}</div>}
            {pick && <button className="btn btn-primary" style={{ width: "100%" }} onClick={goNext}>{qIdx >= questions.length - 1 ? "결과 보기 →" : "다음 문제 →"}</button>}
          </div>
        )}
        {step === 2 && (
          <div style={{ textAlign: "center" }}>
            <div style={{ fontSize: 52, marginBottom: 10 }}>🎖️</div>

// ── 승급 영어 테스트 문제 생성 (Day 1-30 단어 풀, RECAP_DATA 재활용) ──
function _buildLevelupQuestions(maxDay, count, minDay) {
  minDay = minDay || 1;
  const ALL = ((window.__SIM && window.__SIM.SCENARIOS) || []);
  const SCN = ALL.filter(s => s.day >= minDay && s.day <= maxDay);
  const RD = (window.__SIM && window.__SIM.RECAP_DATA) || {};
  const pool = Object.keys(RD).map(Number).filter(d => d >= minDay && d <= maxDay && SCN.find(s => s.day === d));
  const qDays = _shuf(pool).slice(0, count);
  const allWords = ALL.map(s => s.word).filter(Boolean);
  return qDays.map(d => {
    const sc = SCN.find(s => s.day === d);
    const word = sc ? sc.word : "";
    const distractors = _shuf(allWords.filter(w => w !== word)).slice(0, 3);
    // 시험 문장도 기본+예문 파생 풀에서 랜덤 (매번 같은 예문 안 나오게, 피드백 반영)
    const target = (window._recapPickTarget && sc) ? (window._recapPickTarget(sc, RD) || RD[d].blank) : RD[d].blank;
    return {
      target,
      options: _shuf([word, ...distractors]),
      correct: word,
      hint: RD[d].explain,
      meaning: sc ? sc.meaning : "",
    };
  });
}

// ── 레벨업 영속화: localStorage 먼저 (데이터 안전) → DB. DB 실패 시 pending 큐. ──
async function _persistLevelUp(score) {
  const now = new Date().toISOString();
  let local = null;
  try { local = JSON.parse(localStorage.getItem("__OD_USER") || "null"); } catch (e) {}
  if (local) {
    local.level = window.__OD_LEVEL_FULLTIME;
    local.levelupCompletedAt = now;
    local.levelup_completed_at = now;
    local.levelupTestScore = score;
    local.levelup_test_score = score;
    try { localStorage.setItem("__OD_USER", JSON.stringify(local)); } catch (e) {}
  }
  const email = local && local.email;
  if (!email) return { ok: true, localOnly: true };
  try {
    // ★ SECURITY DEFINER RPC로 저장 (세션/RLS 무관하게 확실히 기록). select-back 의존 제거.
    if (window.OD && window.OD.enabled && window.OD.completeLevelup) {
      const r = await window.OD.completeLevelup(email, score);
      if (r && r.ok) {
        try { localStorage.removeItem("__OD_PENDING_LEVELUP"); } catch (e) {}
        return { ok: true };
      }
    } else if (window.OD && window.OD.enabled && window.OD.updateProgress) {
      // 폴백 (구버전): 직접 UPDATE
      const patch = { level: window.__OD_LEVEL_FULLTIME, levelup_completed_at: now, levelup_test_score: score };
      const r = await window.OD.updateProgress(email, patch);
      if (r && r.ok) {
        try { localStorage.removeItem("__OD_PENDING_LEVELUP"); } catch (e) {}
        return { ok: true };
      }
    }
  } catch (e) {}
  // DB 실패: 다음 부팅 때 재시도하도록 큐잉 (mountAfterHydrate에서 flush)
  try { localStorage.setItem("__OD_PENDING_LEVELUP", JSON.stringify({ email, score })); } catch (e) {}
  return { ok: false, queued: true };
}

  const [step, setStep] = useState(0);           // 0 인트로 / 1 회고·통계 / 2 테스트 / 3 소감 / 4 결과
  const [qIdx, setQIdx] = useState(0);
  const [picks, setPicks] = useState([]);
  const [pick, setPick] = useState(null);
  const [saved, setSaved] = useState(false);
  // 회고 소감 (인사팀에 전달, 운영자 피드백함으로 수집)
  const [reflectRating, setReflectRating] = useState(0);   // 1-5 만족도
  const [reflectText, setReflectText] = useState("");
  const [reflectSent, setReflectSent] = useState(false);

  const local = (() => { try { return JSON.parse(localStorage.getItem("__OD_USER") || "null") || {}; } catch (e) { return {}; } })();
  const name = local.name || (window.__SIM && window.__SIM.USER && window.__SIM.USER.name) || "사원";
  const isLate = realDay > 30;  // Day 31+에 뒤늦게 의례 진행하는 케이스

  const stats = useMemo(() => ({
    streak: _statBestStreak(local),
    words: _statMasteredWords(local),
    notes: _statNotes(local),
    journals: _statJournals(local),
  }), []);

  const questions = useMemo(() => _buildLevelupQuestions(30, 10), []);
  const q = questions[qIdx];
  const score = questions.length ? Math.round(picks.filter(p => p.ok).length / questions.length * 100) : 100;

  // 결과 화면(step 4) 진입 즉시 승급 저장 (사용자가 창 닫아도 승급은 유지)

      _persistLevelUp(score);

              </div>
              <div style={{ display: "flex", gap: 6, justifyContent: "center" }}>
                {[1, 2, 3, 4, 5].map(n => (
                  <button key={n} onClick={() => setReflectRating(n)}
                    style={{
                      background: "transparent", border: "none", cursor: "pointer",
                      fontSize: 30, lineHeight: 1, padding: 2,

                      transition: "filter 0.12s, transform 0.12s",

                    title={["", "아쉬워요", "그저 그래요", "괜찮아요", "좋아요", "최고예요"][n]}
                  >⭐</button>

              </div>
              {reflectRating > 0 && (

              어떤 점이 좋았고, 뭐가 더 있으면 좋을까요? <span style={{ color: "var(--ink-mute)", fontWeight: 500 }}>(선택)</span>

        {step === 4 && (

              marginBottom: 18,

            </div>
            <div style={{ fontSize: 46, fontWeight: 900, color: "var(--orange)", lineHeight: 1, letterSpacing: "-0.04em", marginBottom: 8 }}>
              {score}<span style={{ fontSize: 18, color: "var(--ink-mute)" }}>점</span>
            </div>
            <div style={{ fontSize: 14.5, fontWeight: 800, color: "var(--ink)", marginBottom: 14 }}>{scoreMent}</div>
            {wrongs.length > 0 && (
              <div style={{ textAlign: "left", background: "var(--paper-warm)", borderRadius: 8, padding: "12px 14px", marginBottom: 16 }}>
                <div style={{ fontSize: 11.5, fontWeight: 800, color: "var(--ink-mute)", marginBottom: 6 }}>다시 챙겨볼 단어</div>
                {wrongs.map((w, i) => (
                  <div key={i} style={{ fontSize: 12.5, color: "var(--ink-soft)", lineHeight: 1.7 }}>· <b style={{ color: "var(--ink)" }}>{w.correct}</b></div>
                ))}

            )}
            <p style={{ fontSize: 13, color: "var(--ink-soft)", lineHeight: 1.75, marginBottom: 14 }}>
              {name}님은 오늘부로 정직원 전환, <b style={{ color: "var(--ink)" }}>사원(Associate)</b>이에요.<br/>
              Day 60까지, 이제 회의를 주도하는 표현들을 만나요.
            </p>
            <div style={{
              background: "var(--paper-warm)", border: "1px dashed var(--line)",
              borderRadius: 8, padding: "12px 14px", fontSize: 12,
              color: "var(--ink-soft)", lineHeight: 1.7, marginBottom: 20, textAlign: "left",
            }}>
              <b style={{ color: "var(--ink)" }}>앞으로 30일, 이런 게 기다려요</b><br/>
              📒 <b style={{ color: "var(--ink)" }}>나만의 노트 모아보기</b> 지금 열림<br/>
              🌱 Day 37 정직원 첫 주 완주 · ⚡ Day 44 절반 돌파<br/>
              🔥 Day 51 50일 달성 · 🌟 Day 60 <b style={{ color: "var(--orange)" }}>특별 면담</b> (60일 누적 통계 + 다음 레벨 부서 평가)
            </div>
            {reflectSent && (reflectText.trim() || reflectRating > 0) && (
              <div style={{ fontSize: 12, color: "var(--orange)", fontWeight: 700, marginBottom: 14 }}>
                💌 회고 잘 받았어요. 다음 학습에 꼭 반영할게요.
              </div>
            )}
            <button className="btn btn-primary" style={{ width: "100%" }} onClick={() => location.reload()}>
              👔 정직원으로 첫 출근하기 →
            </button>
          </div>
        )}
      </div>
    </div>
  );
}

function App() {
  const [active, setActive] = useState("home");
  const [scene, setScene] = useState(null);
  const [memo, setMemo] = useState(null);
  const [feedbackOpen, setFeedbackOpen] = useState(false);
  // ★ 과거일 임시 보기. URL 안 건드림. React state 만 바꾸고 USER 등 mutate → 자식 자동 갱신.
  const [viewingDay, setViewingDay] = useState(null);

  const { USER, SCENARIOS } = window.__SIM;
  // realCurrentDay = 자동 계산된 진짜 오늘. USER.currentDay 는 viewingDay 로 덮어쓸 수 있음.
  const _realDay = USER.realCurrentDay || USER.currentDay;
  const _effectiveDay = (viewingDay && viewingDay < _realDay) ? viewingDay : _realDay;

  // 매 렌더마다 window.__SIM 동기 갱신. 자식 컴포넌트가 다음 render 에서 새 값 읽음.
  USER.currentDay = _effectiveDay;
  USER.realCurrentDay = _realDay;
  USER.isViewingPast = _effectiveDay !== _realDay;
  USER.workingDay = window._workingDayIndex ? window._workingDayIndex(_effectiveDay) : _effectiveDay;
  USER.wordsCollected = window._wordsCollected ? window._wordsCollected(_effectiveDay) : _effectiveDay;

  // SCENARIOS statuses 재계산 (위/안 본 단어 표시 + 출근부 셀 일관성)
  SCENARIOS.forEach(s => {
    if (s.day === USER.workingDay) s.status = "today";
    else if (s.day < USER.wordsCollected) s.status = "studied";
    else if (USER.workingDay === null && s.day === USER.wordsCollected) s.status = "studied";
    else s.status = "locked";
  });
  USER.studiedDays = SCENARIOS.filter(s => s.status === "studied").length;

  // TODAY_SCHEDULE 도 effective day 기준 재계산
  if (window.__SIM.getScheduleForDay && USER.workingDay !== null) {
    window.__SIM.TODAY_SCHEDULE = window.__SIM.getScheduleForDay(USER.workingDay);
  }


  // 사내 메모 읽음 상태, localStorage에 사용자 단위로 저장
  const READ_KEY = "__OD_NOTICE_READS_" + (USER.email || "guest");
  const HARDCODED_NOTICES = React.useMemo(() => window.__SIM.NOTICES, []);
  const [dbNotices, setDbNotices] = useState([]);
  const [readIds, setReadIds] = useState(() => {
    try {
      const saved = localStorage.getItem(READ_KEY);
      return new Set(saved ? JSON.parse(saved) : []);
    } catch { return new Set(); }
  });

  // Supabase notices 테이블에서 운영자 발송 공지 가져오기
  // ★ window.OD 로딩 타이밍 문제 회피, 준비될 때까지 폴링
  React.useEffect(() => {
    let cancelled = false;
    let tries = 0;
    const tick = () => {
      if (cancelled) return;
      if (!window.OD || !window.OD.enabled || !window.OD.fetchNotices) {
        if (tries++ < 40) { setTimeout(tick, 200); }
        else { console.warn("[notices] window.OD 준비 안 됨, 공지 fetch 포기"); }
        return;
      }
      window.OD.fetchNotices(50, USER.email || null).then(r => {
        if (cancelled) return;
        if (!r.ok || !r.notices) {
          console.warn("[notices] fetch 실패:", r.error || "결과 없음");
          return;
        }
        console.log("[notices] DB 공지", r.notices.length, "건 로드");
        const fromMap = {
          "유버디 (Buddy)": "buddy", "유버디": "buddy", "Buddy": "buddy",
          "인사팀": "hr", "HR": "hr",
          "사수": "mentor", "차윤아": "mentor",
          "팀장": "manager", "김 팀장": "manager",
        };
        const tagMap = {
          "announcement": "공지", "event": "이벤트", "broadcast": "전사",
          "ceo": "회장", "hr": "인사", "notice": "공지",
        };
        const converted = r.notices.filter(n => {
          // ★ 방어: 1:1 공지는 수신자 본인에게만 노출.
          // (이메일 없는 세션이면 fetchNotices가 필터 없이 전체를 반환하는 구멍 차단)
          if (Array.isArray(n.target_emails) && n.target_emails.length > 0) {
            const me = (USER.email || "").toLowerCase().trim();
            return !!me && n.target_emails.map(e => String(e).toLowerCase().trim()).includes(me);
          }
          // ★ 전체 공지는 가입일 이후 발송분만 (신규 가입자에게 과거 공지 노이즈 차단)
          // signupDate 없으면 안전하게 전부 표시.
          try {
            const lu = JSON.parse(localStorage.getItem("__OD_USER") || "null");
            const su = lu && lu.signupDate ? Date.parse(lu.signupDate) : null;
            if (su && n.sent_at && Date.parse(n.sent_at) < su) return false;
          } catch (e) {}
          return true;
        }).map(n => {
          const fromId = fromMap[n.from_name] || "buddy";
          const dateStr = n.sent_at
            ? new Date(n.sent_at).toLocaleDateString("ko-KR", { month: "long", day: "numeric" })
            : "";
          const body = n.body || "";
          // target_emails 있으면 1:1 답장. 받는 사람을 본인 이름으로 표시.
          const isTargeted = Array.isArray(n.target_emails) && n.target_emails.length > 0;
          const recipient = isTargeted
            ? `${USER.name || "본인"}님 (1:1)`
            : "전 직원";
          return {
            id: "db-" + n.id,
            from: fromId,
            fromName: n.from_name || "유버디",
            to: recipient,
            date: dateStr,
            subject: n.title || "(제목 없음)",
            preview: body.slice(0, 80),
            body: body,
            unread: true,
            tag: isTargeted ? "1:1 답장" : (tagMap[n.type] || "공지"),
            showFromDay: 0,
            isDb: true,
            popup: !!n.popup,
            isDirect: isTargeted,
          };
        });
        setDbNotices(converted);
      }).catch(e => {
        console.warn("[notices] fetch 에러:", e.message);
      });
    };
    tick();
    return () => { cancelled = true; };
  }, []);

  // DB 공지 + 하드코딩된 공지 병합 (DB 공지가 위로)
  const ALL_NOTICES = React.useMemo(
    () => [...dbNotices, ...HARDCODED_NOTICES],
    [dbNotices, HARDCODED_NOTICES]
  );

  // 원본 unread 플래그에 readIds 적용
  const NOTICES = ALL_NOTICES.map(n => ({ ...n, unread: n.unread && !readIds.has(n.id) }));
  window.__SIM.NOTICES = NOTICES; // 자식 페이지가 window.__SIM에서 읽으므로 갱신
  const unread = NOTICES.filter(n => n.unread).length;

  const handleOpenMemo = (n) => {
    setMemo(n);
    if (!readIds.has(n.id)) {
      setReadIds(prev => {
        const next = new Set(prev); next.add(n.id);
        try { localStorage.setItem(READ_KEY, JSON.stringify([...next])); } catch {}
        return next;
      });
      // ★ DB 영속화 (notice_reads_v2). 실패 시 outbox 큐잉.
      if (window.OD && window.OD.enabled && window.OD.markNoticeRead && USER.email) {
        window.OD.markNoticeRead(USER.email, n.id).then(r => {
          if (!r || !r.ok) {
            window.OD.pushOutbox && window.OD.pushOutbox({ type: 'notice', email: USER.email, noticeKey: n.id });
          }
        }).catch(() => {
          window.OD.pushOutbox && window.OD.pushOutbox({ type: 'notice', email: USER.email, noticeKey: n.id });
        });
      }
    }
  };

  // ★ 입장 시 자동 팝업: popup=true 인 미확인 공지 중 가장 최근 1건을 모달로 띄움.
  // 기기당 1회만 (localStorage __OD_AUTOPOP). 운영자가 공지 작성 시 팝업 옵션 켰을 때만.
  const _autoPoppedRef = React.useRef(false);
  // ★ 투어(첫 출근 가이드 / 정직원 모드 가이드)가 아직 안 끝났으면 공지 팝업을 미룬다.
  //   예전엔 둘이 서로를 몰라서 같이 떠버렸고, 투어 스포트라이트가 공지 모달에 가려졌다.
  const _tourPending = React.useCallback(() => {
    try {
      const rd = USER.realCurrentDay || USER.currentDay || 1;
      if (USER.isFulltime && !USER.isViewingPast && rd <= 60
          && !localStorage.getItem("__OD_S2_TOUR_DONE_" + (USER.email || "guest"))) return true;
      if ((USER.currentDay === 1) && !localStorage.getItem("__OD_TOUR_DONE_DAY_1")) return true;
    } catch (e) {}
    return false;
  }, []);
  const [_tourCleared, _setTourCleared] = React.useState(false);
  React.useEffect(() => {
    const done = () => _setTourCleared(true);
    window.addEventListener("od-tour-done", done);
    return () => window.removeEventListener("od-tour-done", done);
  }, []);
  React.useEffect(() => {
    if (_autoPoppedRef.current) return;
    if (!dbNotices || dbNotices.length === 0) return;
    if (!_tourCleared && _tourPending()) return;   // 투어 먼저, 공지는 그다음
    const target = dbNotices.find(n => n.popup && !readIds.has(n.id));
    if (!target) return;
    let shown = [];
    try { shown = JSON.parse(localStorage.getItem("__OD_AUTOPOP") || "[]"); } catch (e) {}
    if (shown.includes(target.id)) return;
    _autoPoppedRef.current = true;
    try { shown.push(target.id); localStorage.setItem("__OD_AUTOPOP", JSON.stringify(shown)); } catch (e) {}
    handleOpenMemo(target);
  }, [dbNotices, readIds, _tourCleared, _tourPending]);

  // ★ 하드코딩 공지(예: 유비챌 9기 오픈)도 한 번은 자동으로 띄운다.
  //   DB 공지 자동팝업은 dbNotices만 봐서, _NOTICES_ALL의 이벤트 공지는 안 떴음.
  const _promoPoppedRef = React.useRef(false);
  React.useEffect(() => {
    if (_promoPoppedRef.current) return;
    if (!_tourCleared && _tourPending()) return;   // 투어 먼저
    const list = (window.__SIM && window.__SIM.NOTICES) || [];
    const promo = list.find(n => n.id === "n-ubchall-9");
    if (!promo) return;
    let shown = [];
    try { shown = JSON.parse(localStorage.getItem("__OD_AUTOPOP") || "[]"); } catch (e) {}
    if (shown.includes(promo.id)) return;
    _promoPoppedRef.current = true;
    try { shown.push(promo.id); localStorage.setItem("__OD_AUTOPOP", JSON.stringify(shown)); } catch (e) {}
    setTimeout(() => handleOpenMemo(promo), 900);
  }, [_tourCleared, _tourPending]);

  // 주말 분기는 여기서 결정 (HomePage 안에서 early-return 하면 hooks 순서 깨짐)
  const weekend = _weekendKind();

  // ── 만료/퇴직 체크 ──
  // 운영자/Dev는 통과. URL ?expired=1 로 강제 미리보기 가능 (운영자 디버깅용)
  // 1) 베타 만료: PILOT 사용자가 14일 지나면 (정식 런칭 전까지 연장)
  // 2) 멤버십 만료: 정식 멤버가 membership_ends_at 지나면 (퇴직 완료)
  // 3) D-7 알림: 인수인계 기간 중 마지막 출근일 7일 이내
  const LATPEED_MEMBERSHIP_URL = "https://www.latpeed.com/memberships/69535224c4fa5959f488270f";
  const _localUserNow = (() => { try { return JSON.parse(localStorage.getItem('__OD_USER') || 'null'); } catch(e) { return null; } })();
  // ★ _isPilot 은 진짜 PILOT 코드로 가입한 베타 테스터만. 정식 결제 회원(cohort='member')은 unlocked=true여도 PILOT 아님.
  //    이걸 'unlocked' 만으로 판단하면 정식 회원도 베타 만료로 잘못 튕김 (Day 15+).
  const _isPaidMember = _localUserNow?.cohort === 'member';
  const _isPilot = !!_localUserNow?.isPilotHire && !_isPaidMember;
  const _isInternalUser = !!(_localUserNow?.isOperator || _localUserNow?.isDevMode);
  const _forceExpired = (() => { try { return new URLSearchParams(location.search).get('expired') === '1'; } catch(e){ return false; } })();

  // membership_ends_at은 cancelMembership() 호출 시 박힘. DB 컬럼 = membership_ends_at, localStorage snake/camel 혼재 가능성 모두 체크.
  const _endsAtRaw = _localUserNow?.membershipEndsAt || _localUserNow?.membership_ends_at || null;
  const _endsAt = _endsAtRaw ? new Date(_endsAtRaw) : null;

/* --- 마운트, hydrate 완료 후에만. cross-device 동기화 보장 --- */
(async function mountAfterHydrate() {
  const MAX_WAIT_MS = 2500; // hydrate 최대 대기, 안 끝나도 그대로 마운트
  const start = Date.now();

  // 1) Supabase 헬퍼 준비 대기
  while (!(window.OD && window.OD.enabled && window.OD.fetchUserFullData)) {
    if (Date.now() - start > MAX_WAIT_MS) break;
    await new Promise(r => setTimeout(r, 50));
  }

  // 1.5) ★ 시즌 2: 승급 DB 반영이 실패해 큐잉돼있으면 재시도 (localStorage가 진실, DB 따라잡기)
  try {
    const _pendingLv = JSON.parse(localStorage.getItem("__OD_PENDING_LEVELUP") || "null");
    if (_pendingLv && _pendingLv.email) {
      let r = null;
      // 신규 방식: RPC. 구버전 큐({email,patch})도 score만 뽑아 RPC로 처리.
      const _pScore = (_pendingLv.score != null) ? _pendingLv.score
        : (_pendingLv.patch && _pendingLv.patch.levelup_test_score) != null ? _pendingLv.patch.levelup_test_score
        : null;
      if (window.OD?.completeLevelup) {
        r = await window.OD.completeLevelup(_pendingLv.email, _pScore);
      } else if (_pendingLv.patch && window.OD?.updateProgress) {
        r = await window.OD.updateProgress(_pendingLv.email, _pendingLv.patch);
      }
      if (r && r.ok) {
        localStorage.removeItem("__OD_PENDING_LEVELUP");
        console.log("[levelup] 보류된 승급 DB 반영 완료");
      }
    }
  } catch (e) {}

  // 2) localStorage가 비어있거나 stale이면 DB에서 동기로 가져와 채움.
  // 변화 있으면 reload. _localUser/USER 객체가 이미 컴파일 시점에 만들어져있어 reload 없이는 화면 갱신 안 됨.
  let beforeSnapshot = "";
  try {
    const raw = localStorage.getItem("__OD_USER");
    const local = raw ? JSON.parse(raw) : null;
    beforeSnapshot = raw || "";
    if (local && local.email && window.OD?.fetchUserFullData) {
      const r = await Promise.race([
        window.OD.fetchUserFullData(local.email),
        new Promise(res => setTimeout(() => res({ ok: false, timeout: true }), MAX_WAIT_MS - (Date.now() - start))),
      ]);
      if (r && r.ok && r.data) {
        const { submissions = [], notes = [], journals = [], notice_reads = [], task_progress = {} } = r.data;

        // submissions → scenariosCompleted
        // ★ submittedAt에는 updated_at 사용. DB의 submitted_at은 첫 제출 시점이라
        //   merge 비교에서 옛 거로 잘못 판단하는 버그가 있었음.
        const dbCompleted = submissions.map(s => ({
          day: s.day, word: s.word, scenarioId: s.scenario_id,
          sentence: s.answer_text, mcChoice: s.mc_choice,
          feedback: s.mentor_feedback || {},
          submittedAt: s.updated_at || s.submitted_at,
          status: s.status,
        }));
        const localCompleted = local.scenariosCompleted || [];
        const byDay = new Map();
        [...dbCompleted, ...localCompleted].forEach(s => {
          if (!s || !s.day) return;
          const prev = byDay.get(s.day);
          if (!prev || new Date(s.submittedAt || 0) >= new Date(prev.submittedAt || 0)) {
            byDay.set(s.day, s);
          }
        });
        local.scenariosCompleted = [...byDay.values()].sort((a, b) => a.day - b.day);

        // notes
        const dbNotes = {};
        notes.forEach(n => {
          const k = String(n.day);
          dbNotes[k] = dbNotes[k] || [];
          dbNotes[k].push({ text: n.text, label: n.label, kind: n.kind, savedAt: n.created_at });
        });
        const localNotes = local.savedNotes || {};
        const mergedNotes = {};
        const allDayKeys = new Set([...Object.keys(localNotes), ...Object.keys(dbNotes)]);
        for (const d of allDayKeys) {
          const a = localNotes[d] || [];
          const b = dbNotes[d] || [];
          const seen = new Set();
          const out = [];
          [...b, ...a].forEach(n => {
            if (n && n.text && !seen.has(n.text)) { seen.add(n.text); out.push(n); }
          });
          if (out.length) mergedNotes[d] = out;
        }
        local.savedNotes = mergedNotes;

        // journals
        const dbJournals = {};
        journals.forEach(j => {
          const k = String(j.day);
          dbJournals[k] = { day: j.day, text: j.text, savedAt: j.saved_at };
        });
        const localJournals = local.dailyJournals || {};
        const mergedJournals = {};
        const allJournalKeys = new Set([...Object.keys(localJournals), ...Object.keys(dbJournals)]);
        for (const d of allJournalKeys) {
          const a = localJournals[d];
          const b = dbJournals[d];
          if (!a) mergedJournals[d] = b;
          else if (!b) mergedJournals[d] = a;
          else mergedJournals[d] = new Date(a.savedAt || 0) >= new Date(b.savedAt || 0) ? a : b;
        }
        local.dailyJournals = mergedJournals;

        // ★ 사용자 프로필 동기화 (membership_ends_at, cohort, 권한 플래그 등)
        // 이걸 안 하면 운영자가 SQL로 ends_at 박아도 사용자 브라우저 localStorage엔
        // 반영이 안 돼서 베타 연장 등이 안 보임. 베타 만료 화면 잘못 노출 사고 방지.
        try {
          if (window.OD?.fetchByEmail) {
            let ur = await window.OD.fetchByEmail(local.email);
            // ★ RLS 폴백 (2026-08-18): 로그인 세션이 없으면 users 직접 조회가 빈 결과로 조용히
            //   실패한다 (maybeSingle → user:null). 그러면 membership_ends_at이 로컬로 안 내려와서
            //   구독 종료자가 만료 잠금 없이 계속 이용하는 구멍이 생김. 이메일+사번 RPC로 재시도.
            if ((!ur || !ur.ok || !ur.user) && window.OD.fetchMembershipStatus) {
              ur = await window.OD.fetchMembershipStatus(local.email, local.empNumber || local.emp_number || null);
            }
            if (ur && ur.ok && ur.user) {
              const u = ur.user;
              // snake/camel 둘 다 채워서 어느 쪽 읽어도 OK
              local.membership_ends_at = u.membership_ends_at;
              local.membershipEndsAt = u.membership_ends_at;
              local.membership_cancel_reason = u.membership_cancel_reason;
              local.membershipCancelReason = u.membership_cancel_reason;
              local.membership_cancel_at = u.membership_cancel_at || null;
              local.membershipCancelAt = u.membership_cancel_at || null;
              local.cohort = u.cohort;
              local.isPilotHire = u.is_pilot_hire;
              local.is_pilot_hire = u.is_pilot_hire;
              local.unlocked = u.unlocked;
              local.isOperator = u.is_operator;
              local.is_operator = u.is_operator;
              local.isDevMode = u.is_dev_mode;
              local.is_dev_mode = u.is_dev_mode;
              if (u.signup_date) { local.signupDate = u.signup_date; local.signup_date = u.signup_date; }
              if (u.name) local.name = u.name;
              // ★ 시즌 2: 레벨·승급 기록 동기화 (다른 기기에서 승급한 경우 반영)
              // 단, 승급 DB 반영이 아직 큐잉 중이면 stale한 DB level(수습)로 되돌리지 않음
              // 운영자/Dev는 dayInCompany처럼 level도 로컬 우선 (dev 패널로 수습↔정직원 자유 테스트)
              const _lvPending = (() => { try { return !!localStorage.getItem("__OD_PENDING_LEVELUP"); } catch(e) { return false; } })();
              const _lvInternal = !!(u.is_operator || u.is_dev_mode);
              if (u.level && !_lvPending && !(_lvInternal && local.level)) local.level = u.level;
              if (u.levelup_completed_at) { local.levelupCompletedAt = u.levelup_completed_at; local.levelup_completed_at = u.levelup_completed_at; }
              if (u.levelup_test_score != null) { local.levelupTestScore = u.levelup_test_score; local.levelup_test_score = u.levelup_test_score; }
              if (u.day60_completed_at) { local.day60CompletedAt = u.day60_completed_at; local.day60_completed_at = u.day60_completed_at; }
              // ★ TF 트랙 로컬 ↔ DB 복구 동기화 (2026-08-18):
              //   과거 RLS로 tf_track DB 기록이 실패한 사용자를 다음 접속 때 자동 백필.
              try {
                const _tfEm = local.email || 'guest';
                const _locT = JSON.parse(localStorage.getItem('__OD_TF_TRACK_' + _tfEm) || 'null');
                const _locD = (() => { try { const d = JSON.parse(localStorage.getItem('__OD_TF_DONE_' + _tfEm) || '[]'); return Array.isArray(d) ? d : []; } catch (e2) { return []; } })();
                const _dbT = u.tf_track || null;
                const _dbD = Array.isArray(u.tf_done) ? u.tf_done : [];
                const _locId = _locT ? (_locT.id || _locT) : null;
                if (_locId || _locD.length) {
                  // 로컬이 진실: DB와 다르면 RPC로 밀어올림
                  if ((_dbT !== _locId || JSON.stringify(_dbD) !== JSON.stringify(_locD)) && window.OD.saveTfState) {
                    window.OD.saveTfState(local.email, local.empNumber || local.emp_number || null,
                      _locId, (_locT && _locT.startedAt) || null, _locD).catch(() => {});
                  }
                } else if (_dbT || _dbD.length) {
                  // 로컬이 빈 새 기기(또는 운영자가 직접 지정): DB에서 내려받기.
                  // startedDay는 tf_started_at 이후 경과일로 복원 (지금 지정됐으면 오늘부터 1/30).
                  if (_dbT) {
                    let _sd = null;
                    try {
                      const _kstD = d => new Date(d).toLocaleDateString('en-CA', { timeZone: 'Asia/Seoul' });
                      const _elapsed = u.tf_started_at
                        ? Math.max(0, Math.floor((Date.parse(_kstD(new Date())) - Date.parse(_kstD(u.tf_started_at))) / 86400000))
                        : 0;
                      _sd = Math.max(91, (local.dayInCompany || 91) - _elapsed);
                    } catch (e3) {}
                    localStorage.setItem('__OD_TF_TRACK_' + _tfEm, JSON.stringify({ id: _dbT, startedAt: u.tf_started_at || null, startedDay: _sd }));
                  }
                  if (_dbD.length) localStorage.setItem('__OD_TF_DONE_' + _tfEm, JSON.stringify(_dbD));
                }
              } catch (e2) {}
              // dayInCompany 동기화: 운영자/Dev는 dev 패널로 자유롭게 day 점프하니까 DB로 덮어쓰면 안 됨.
              // 일반 사용자는 DB와 localStorage 중 큰 값(자연 진행 또는 운영자 수동 연장 반영) 사용.
              if (u.day_in_company) {
                const isInternal = !!(u.is_operator || u.is_dev_mode);
                if (!isInternal) {
                  local.dayInCompany = Math.max(local.dayInCompany || 1, u.day_in_company);
                }
                // 운영자/Dev: local 값 유지. dev panel +1/+7/jump 자유롭게 동작.
              }
            }
          }
        } catch (e) {
          console.warn("[boot-hydrate] user profile sync failed:", e.message);
        }

        localStorage.setItem("__OD_USER", JSON.stringify(local));

        // ★ 동기화로 방금 내려온 만료 정보 즉시 반영 (2026-08-18):
        //   만료 판정은 앱 부팅 시 localStorage 기준으로 이미 끝났으므로, 이번 동기화로
        //   만료가 확정됐다면 한 번만 새로고침해서 휴직 화면으로 보낸다. (무한 리로드 방지 가드)
        try {
          const _isInt = !!(local.isOperator || local.isDevMode);
          const _isMem = local.cohort === 'member';
          const _endsRaw2 = local.membershipEndsAt || local.membership_ends_at || null;
          const _ends2 = _endsRaw2 ? new Date(_endsRaw2).getTime() : null;
          const _cancel2 = !!(local.membershipCancelAt || local.membership_cancel_at);
          const _msLeft2 = _ends2 ? (_ends2 - Date.now()) : null;
          const _expiredNow = !_isInt && (
            _isMem
              ? (local.unlocked === false
                 || (_ends2 && _msLeft2 <= -(2 * 86400000))
                 || (_cancel2 && _ends2 && _msLeft2 <= 0))
              : (_ends2 && _msLeft2 <= 0));
          if (_expiredNow && !sessionStorage.getItem('__OD_EXP_RELOADED')) {
            sessionStorage.setItem('__OD_EXP_RELOADED', '1');
            location.reload();
            return;
          }
        } catch (e) {}

        // 공지 읽음 ID
        try {
          const READ_KEY = "__OD_NOTICE_READS_" + local.email;
          const existing = JSON.parse(localStorage.getItem(READ_KEY) || "[]");
          const union = Array.from(new Set([...existing, ...(notice_reads || [])]));
          localStorage.setItem(READ_KEY, JSON.stringify(union));
        } catch (e) {}

        // 일정 체크 상태 (localStorage ↔ DB 양방향 sync)
        try {
          // DB → localStorage (DB에 있는데 local에 없는 거 채움)
          Object.keys(task_progress || {}).forEach(dayKey => {
            const k = "__OD_TASKS_DAY_" + dayKey;
            const existingT = JSON.parse(localStorage.getItem(k) || "{}");
            const merged = { ...existingT };
            Object.entries(task_progress[dayKey] || {}).forEach(([id, v]) => {
              merged[id] = !!(merged[id] || v);
            });
            localStorage.setItem(k, JSON.stringify(merged));
          });

          // ★ localStorage → DB (localStorage에 있는데 DB에 없는 거 push, 누락 복구)
          const allTaskKeys = Object.keys(localStorage).filter(k => k.startsWith("__OD_TASKS_DAY_"));
          for (const k of allTaskKeys) {
            const dayKey = k.replace("__OD_TASKS_DAY_", "");
            const localTasks = JSON.parse(localStorage.getItem(k) || "{}");
            const dbTasks = (task_progress && task_progress[dayKey]) || {};
            const hasMore = Object.keys(localTasks).some(id => localTasks[id] && !dbTasks[id]);
            if (hasMore && window.OD?.saveTaskProgress) {
              try {
                await window.OD.saveTaskProgress(local.email, Number(dayKey), localTasks);
                console.log("[boot-hydrate] task sync up: day " + dayKey, localTasks);
              } catch (e) {}
            }
          }
        } catch (e) {}

        // ★ scenariosCompleted도 localStorage → DB sync up (누락 복구)
        try {
          for (const s of local.scenariosCompleted || []) {
            const inDb = dbCompleted.find(d => d.day === s.day && d.submittedAt >= s.submittedAt);
            if (!inDb && s.sentence && s.sentence.trim() && window.OD?.saveSubmission) {
              const payload = {
                word: s.word || null,
                scenario_id: s.scenarioId || (String(s.day) + ':' + (s.word || '')),
                answer_text: s.sentence,
                mc_choice: s.mcChoice || null,
                mentor_feedback: s.feedback || {},
                meta: { submittedAt: s.submittedAt, raw: s, syncUp: true },
                status: 'submitted',
              };
              try {
                await window.OD.saveSubmission(local.email, s.day, payload);
                console.log("[boot-hydrate] submission sync up: day " + s.day);
              } catch (e) {}
            }
          }
        } catch (e) {}

        console.log("[boot-hydrate] 동기 hydrate 완료. submissions:", dbCompleted.length,
          "notes:", notes.length, "journals:", journals.length);
      }
    }
  } catch (e) {
    console.warn("[boot-hydrate] failed:", e.message);
  }

  // 3) 변화 감지 (모든 OD 관련 localStorage 키 비교), 변화 있으면 reload.
  // cooldown 3초로 무한 reload 방지.
  function _odSnapshot() {
    const parts = [];
    try {
      parts.push("U=" + (localStorage.getItem("__OD_USER") || ""));
      const keys = Object.keys(localStorage)
        .filter(k => k.startsWith("__OD_TASKS_DAY_") || k.startsWith("__OD_NOTICE_READS_"))
        .sort();
      keys.forEach(k => parts.push(k + "=" + localStorage.getItem(k)));
    } catch (e) {}
    return parts.join("||");
  }
  try {
    const after = _odSnapshot();
    // beforeSnapshot은 __OD_USER만 캡쳐했으므로, 부분 비교
    const beforeUser = beforeSnapshot || "";
    const afterUser = localStorage.getItem("__OD_USER") || "";
    if (beforeUser !== afterUser) {
      const KEY = "__OD_MOUNT_RELOAD_AT";
      const lastReload = parseInt(sessionStorage.getItem(KEY) || "0", 10);
      if (Date.now() - lastReload > 3000) {
        sessionStorage.setItem(KEY, String(Date.now()));
        console.log("[boot-hydrate] localStorage 갱신, reload로 화면 동기화");
        location.reload();
        return;
      }
    }
  } catch (e) {}

  // 3.5) 콘텐츠 자동수정: 승인된 편집을 SCENARIOS에 덮어쓰기 (코드배포 없이 라이브 반영)
  try {
    if (window.OD && window.OD.getApprovedContentEdits) {
      const _ce = await window.OD.getApprovedContentEdits();
      const _scn = (window.__SIM && window.__SIM.SCENARIOS) || [];
      if (_ce && _ce.ok && _ce.edits && _ce.edits.length) {
        _ce.edits.forEach(function (e) {
          try {
            const sc = _scn.find(function (s) { return s.day === e.day; });
            if (!sc) return;
            const parts = String(e.field).split(".");
            let obj = sc;
            for (let i = 0; i < parts.length - 1; i++) { obj = obj[parts[i]]; if (!obj) return; }
            const key = parts[parts.length - 1];
            const cur = obj[key];
            if (e.old_value) {
              // 부분 치환: 필드 안에서 old_value만 new_value로. 없으면 건드리지 않음(이미 수정됨/불일치 보호).
              if (cur != null && String(cur).indexOf(e.old_value) >= 0) {
                obj[key] = String(cur).split(e.old_value).join(e.new_value);
              }
            } else {
              // old_value 없으면 필드 전체 교체 (의도된 전체 편집)
              obj[key] = e.new_value;
            }
          } catch (_) {}
        });
        console.log("[content-edits] 적용:", _ce.edits.length, "건");
      }
    }
  } catch (e) {}

  // 4) 이제 마운트. USER 객체가 최신 localStorage 기반으로 만들어짐.
  ReactDOM.createRoot(document.getElementById("root")).render(<window.SimApp />);
})();

/* --- auto-day Supabase 동기화 (외부 사용자만), 새 RPC 경로 --- */
(function syncDayToSupabase() {
  const pending = window.__OD_PENDING_DAY_SYNC;
  if (!pending) return;
  let tries = 0;
  const tick = () => {
    if (window.OD && window.OD.enabled && window.OD.saveDayProgress) {
      window.OD.saveDayProgress(pending.email, pending.day).then(r => {
        if (!r || !r.ok) {
          window.OD.pushOutbox && window.OD.pushOutbox({ type: 'day', email: pending.email, day: pending.day });
        }
        window.OD.sendSlackMirror && window.OD.sendSlackMirror({ type: 'day', email: pending.email, day: pending.day });
      }).catch(() => {
        window.OD.pushOutbox && window.OD.pushOutbox({ type: 'day', email: pending.email, day: pending.day });
      });
      window.__OD_PENDING_DAY_SYNC = null;
    } else if (tries++ < 20) {
      setTimeout(tick, 250);
    }
  };
  setTimeout(tick, 500);
})();

/* --- ★ 데이터 손실 방지: mainboard 진입 시 DB → localStorage 동기화 (2026-05-19 새 경로) ---
 * 정규화 테이블 (submissions / notes / journals / notice_reads_v2)에서 RPC 한 번으로 가져옴.
 * cross-device, 시크릿 모드, 캐시 클린, 신규 디바이스 모두 같은 경로로 복원.
 * 다른 기기에서 학습한 내역이 즉시 화면에 보임.
 */
(function hydrateFromDb() {
  let tries = 0;
  const tick = async () => {
    if (!window.OD || !window.OD.enabled || !window.OD.fetchUserFullData) {
      if (tries++ < 20) setTimeout(tick, 250);
      return;
    }
    try {
      const raw = localStorage.getItem("__OD_USER");
      const local = raw ? JSON.parse(raw) : null;
      if (!local || !local.email) return;

      const r = await window.OD.fetchUserFullData(local.email);
      if (!r.ok || !r.data) return;
      const { submissions = [], notes = [], journals = [], notice_reads = [], task_progress = {} } = r.data;

      // submissions → scenariosCompleted (localStorage 옛 형식)
      const dbCompleted = submissions.map(s => ({
        day: s.day,
        word: s.word,
        scenarioId: s.scenario_id,
        sentence: s.answer_text,
        mcChoice: s.mc_choice,
        feedback: s.mentor_feedback || {},
        submittedAt: s.updated_at || s.submitted_at,
        status: s.status,
      }));

      // notes (DB rows) → savedNotes (day별 배열 객체)
      const dbNotes = {};
      notes.forEach(n => {
        const k = String(n.day);
        dbNotes[k] = dbNotes[k] || [];
        dbNotes[k].push({
          text: n.text,
          label: n.label,
          kind: n.kind,
          savedAt: n.created_at,
        });
      });

      // journals (DB rows) → dailyJournals (day별 단일 객체)
      const dbJournals = {};
      journals.forEach(j => {
        const k = String(j.day);
        dbJournals[k] = { day: j.day, text: j.text, savedAt: j.saved_at };
      });

      // local과 union merge (cross-device 안전, day별 최신 submittedAt 우선)
      const localCompleted = local.scenariosCompleted || [];
      const byDay = new Map();
      [...dbCompleted, ...localCompleted].forEach(s => {
        if (!s || !s.day) return;
        const prev = byDay.get(s.day);
        if (!prev || new Date(s.submittedAt || 0) >= new Date(prev.submittedAt || 0)) {
          byDay.set(s.day, s);
        }
      });
      const mergedCompleted = [...byDay.values()].sort((a, b) => a.day - b.day);

      const localNotes = local.savedNotes || {};
      const mergedNotes = {};
      const allDayKeys = new Set([...Object.keys(localNotes), ...Object.keys(dbNotes)]);
      for (const d of allDayKeys) {
        const a = localNotes[d] || [];
        const b = dbNotes[d] || [];
        const seen = new Set();
        const out = [];
        [...b, ...a].forEach(n => {
          if (n && n.text && !seen.has(n.text)) { seen.add(n.text); out.push(n); }
        });
        if (out.length) mergedNotes[d] = out;
      }

      const localJournals = local.dailyJournals || {};
      const mergedJournals = {};
      const allJournalKeys = new Set([...Object.keys(localJournals), ...Object.keys(dbJournals)]);
      for (const d of allJournalKeys) {
        const a = localJournals[d];
        const b = dbJournals[d];
        if (!a) mergedJournals[d] = b;
        else if (!b) mergedJournals[d] = a;
        else {
          mergedJournals[d] = new Date(a.savedAt || 0) >= new Date(b.savedAt || 0) ? a : b;
        }
      }

      local.scenariosCompleted = mergedCompleted;
      local.savedNotes = mergedNotes;
      local.dailyJournals = mergedJournals;
      localStorage.setItem("__OD_USER", JSON.stringify(local));

      // 공지 읽음 ID도 localStorage에 hydrate (READ_KEY는 컴포넌트에서 사용)
      try {
        const READ_KEY = "__OD_NOTICE_READS_" + local.email;
        const existing = JSON.parse(localStorage.getItem(READ_KEY) || "[]");
        const union = Array.from(new Set([...existing, ...(notice_reads || [])]));
        localStorage.setItem(READ_KEY, JSON.stringify(union));
      } catch (e) {}

      // ★ 일정 체크 상태 (__OD_TASKS_DAY_*) cross-device 복원
      try {
        Object.keys(task_progress || {}).forEach(dayKey => {
          const k = "__OD_TASKS_DAY_" + dayKey;
          const existing = JSON.parse(localStorage.getItem(k) || "{}");
          // true는 false로 다운그레이드 안 됨 (양쪽 union, true 우선)
          const merged = { ...existing };
          Object.entries(task_progress[dayKey] || {}).forEach(([id, v]) => {
            merged[id] = !!(merged[id] || v);
          });
          localStorage.setItem(k, JSON.stringify(merged));
        });
      } catch (e) {}

      console.log("[hydrate] DB → localStorage 복원 완료.",
        "submissions:", dbCompleted.length,
        "notes:", notes.length,
        "journals:", journals.length,
        "notice_reads:", (notice_reads || []).length);

      // ★ 화면 갱신 가드. 3초 cooldown 으로 무한 reload 방지하되,
      // 새로고침/다른 기기 갱신 즉시 반영 가능하게.
      const HYDRATE_KEY = "__OD_HYDRATED_AT";
      const now = Date.now();
      const lastReloadAt = parseInt(sessionStorage.getItem(HYDRATE_KEY) || "0", 10);
      const cooldownOk = (now - lastReloadAt) > 3000;

      const beforeKey = JSON.stringify({ c: localCompleted, n: localNotes, j: localJournals });
      const afterKey  = JSON.stringify({ c: mergedCompleted, n: mergedNotes, j: mergedJournals });
      const dataChanged = beforeKey !== afterKey;

      // task_progress가 localStorage __OD_TASKS_DAY_* 와 다르면도 reload
      let taskChanged = false;
      try {
        Object.keys(task_progress || {}).forEach(dayKey => {
          const k = "__OD_TASKS_DAY_" + dayKey;
          const existing = JSON.parse(localStorage.getItem(k) || "{}");
          const incoming = task_progress[dayKey] || {};
          for (const id of Object.keys(incoming)) {
            if (incoming[id] && !existing[id]) { taskChanged = true; break; }
          }
        });
      } catch (e) {}

      if (cooldownOk && (dataChanged || taskChanged)) {
        sessionStorage.setItem(HYDRATE_KEY, String(now));
        console.log("[hydrate] DB와 차이 발견, 화면 갱신 위해 새로고침");
        setTimeout(() => location.reload(), 200);
      }
    } catch (e) {
      console.warn("[hydrate] DB sync failed:", e.message);
    }
  };
  setTimeout(tick, 600);
})();
</script>

      <div class="dp-info">
        <div><strong>${u.name || ''}</strong> <span class="muted">· ${u.email || ''}</span></div>
        <div class="muted">${u.empNumber || ''} · ${(u.department && u.department.short) || ''}</div>
        <div class="dp-badges">${badgesHtml}</div>
        ${u.cohort ? '<div class="dp-cohort">🎫 ' + u.cohort + '</div>' : ''}
        ${u.inviteCode ? '<div class="muted" style="margin-top:4px">코드: <strong>' + u.inviteCode + '</strong></div>' : ''}
        <div style="margin-top:8px;">현재 <span class="day">Day ${u.dayInCompany}</span></div>
      </div>
      <div class="dp-row">
        <button class="dp-btn" data-act="d-1">← Day -1</button>
        <button class="dp-btn" data-act="d+1">Day +1 →</button>
        <button class="dp-btn" data-act="d+7">+7일</button>
      </div>
      <div class="dp-row">
        <button class="dp-btn" data-act="d-7">-7일</button>
        <button class="dp-btn" data-act="set" style="grid-column: span 2">Day로 점프</button>
      </div>

      <div style="margin-top:10px; padding-top:8px; border-top:1px solid rgba(255,255,255,0.1)">
        <div class="muted" style="margin-bottom:4px;">베타 만료 미리보기 (Day 15+ PILOT)</div>
        <div class="dp-row" style="grid-template-columns: 1fr 1fr">
          <button class="dp-btn" data-act="preview-expired" style="background:${_expiredOn ? 'rgba(243,138,92,0.4)' : 'rgba(255,255,255,0.08)'}">${_expiredOn ? '✓ 만료 화면 ON' : '🔒 만료 화면 보기'}</button>
          <button class="dp-btn" data-act="exit-expired" ${!_expiredOn ? 'disabled style="opacity:0.4;cursor:not-allowed"' : ''}>↩ 정상 복귀</button>
        </div>
      </div>

      <div style="margin-top:10px; padding-top:8px; border-top:1px solid rgba(255,255,255,0.1)">
        <div class="muted" style="margin-bottom:4px;">레벨 (현재: ${u.level && u.level.id === 'fulltime' ? '👔 사원' : '👤 수습'})</div>
        <div class="dp-row" style="grid-template-columns: 1fr 1fr">
          <button class="dp-btn" data-act="level-probation" style="${(!u.level || u.level.id !== 'fulltime') ? 'background:rgba(243,138,92,0.4)' : ''}" title="수습으로 전환 (신입사원 화면 미리보기)">👤 수습</button>
          <button class="dp-btn" data-act="level-fulltime" style="${(u.level && u.level.id === 'fulltime') ? 'background:rgba(243,138,92,0.4)' : ''}" title="사원으로 전환">👔 사원</button>
        </div>
      </div>

      <div style="margin-top:10px; padding-top:8px; border-top:1px solid rgba(255,255,255,0.1)">
        <div class="muted" style="margin-bottom:4px;">TF 트랙 (현재: ${(function(){ try { var t = JSON.parse(localStorage.getItem('__OD_TF_TRACK_' + (u.email || 'guest')) || 'null'); return t ? t.id : '없음'; } catch(e){ return '없음'; } })()})</div>
        <div class="dp-row" style="grid-template-columns: 1fr 1fr">
          <button class="dp-btn" data-act="tf-nego" style="${(localStorage.getItem('__OD_TF_TRACK_' + (u.email||'guest'))||'').includes('nego') ? 'background:rgba(243,138,92,0.4)' : ''}">🤝 협상</button>
          <button class="dp-btn" data-act="tf-people" style="${(localStorage.getItem('__OD_TF_TRACK_' + (u.email||'guest'))||'').includes('people') ? 'background:rgba(243,138,92,0.4)' : ''}">👥 피플</button>
        </div>
        <div class="dp-row" style="grid-template-columns: 1fr 1fr; margin-top:6px">
          <button class="dp-btn" data-act="tf-docs" style="${(localStorage.getItem('__OD_TF_TRACK_' + (u.email||'guest'))||'').includes('docs') ? 'background:rgba(243,138,92,0.4)' : ''}">✉️ 문서</button>
          <button class="dp-btn" data-act="tf-meeting" style="${(localStorage.getItem('__OD_TF_TRACK_' + (u.email||'guest'))||'').includes('meeting') ? 'background:rgba(243,138,92,0.4)' : ''}">🎤 미팅</button>
        </div>
        <div class="dp-row" style="grid-template-columns: 1fr; margin-top:6px">
          <button class="dp-btn" data-act="tf-clear" title="TF 선택 해제 (신청서 다시 보기)">↩ TF 해제</button>
        </div>
      </div>

      <div style="margin-top:10px; padding-top:8px; border-top:1px solid rgba(255,255,255,0.1)">
        <div class="muted" style="margin-bottom:4px;">시뮬레이션</div>
        <div class="dp-row" style="grid-template-columns: 1fr 1fr">
          <button class="dp-btn" data-act="fill-learning" title="현재 Day까지의 단어를 예시 답안으로 자동 채움, 단어 사전 미리보기">📚 학습 채우기</button>
          <button class="dp-btn" data-act="clear-learning" title="답변·일정체크·저널·팝업기록 전부 비우기">🧹 학습 비우기</button>
          <button class="dp-btn" data-act="reset-popups" style="grid-column: span 2" title="첫 주 팝업/투어/설문 1회 노출 기록만 초기화">🎁 팝업 기록만 리셋 (다시 보기)</button>
        </div>
      </div>

      <div class="dp-row" style="grid-template-columns: 1fr 1fr; margin-top:8px">
        <button class="dp-btn" data-act="reload">새로고침</button>
        <button class="dp-btn" data-act="reset-day" title="오늘 일정 진행만 초기화 (다른 날은 그대로)">↻ 오늘 학습 리셋</button>
      </div>
      <div class="dp-row" style="grid-template-columns: 1fr; margin-top:4px">
        <button class="dp-btn danger" data-act="reset">사용자 리셋 (전체)</button>
      </div>
      ${u.isOperator ? '<div style="margin-top:10px; padding-top:8px; border-top:1px solid rgba(255,255,255,0.1)"><a href="operator.html" class="dp-link">↗ 운영자 뷰</a> · <a href="dev.html" class="dp-link">↗ Dev 런처</a></div>' : ''}
    `;
    panel.querySelector('#dp-collapse').onclick = () => { panel.classList.add('collapsed'); render(); };
    panel.querySelectorAll('[data-act]').forEach(btn => {
      btn.onclick = () => handle(btn.dataset.act);
    });
  }

  function reloadCleanUrl() {
    // 옛날 ?weekend= 같은 sticky 파라미터 청소하고 reload
    const url = new URL(location.href);
    if (url.searchParams.has('weekend')) {
      url.searchParams.delete('weekend');
      location.href = url.toString();
    } else {
      location.reload();
    }
  }
  function handle(act) {
    let u = load();
    if (!u && act !== 'reload') return;
    switch (act) {
      case 'd+1': u.dayInCompany = Math.min(365, (u.dayInCompany || 1) + 1); u.devDayOverride = true; save(u); reloadCleanUrl(); break;
      case 'd-1': u.dayInCompany = Math.max(1, (u.dayInCompany || 1) - 1); u.devDayOverride = true; save(u); reloadCleanUrl(); break;
      case 'd+7': u.dayInCompany = Math.min(365, (u.dayInCompany || 1) + 7); u.devDayOverride = true; save(u); reloadCleanUrl(); break;
      case 'd-7': u.dayInCompany = Math.max(1, (u.dayInCompany || 1) - 7); u.devDayOverride = true; save(u); reloadCleanUrl(); break;
      case 'set': {
        const v = prompt('이동할 Day (1-365):', String(u.dayInCompany || 1));
        if (!v) return;
        const n = Math.max(1, Math.min(365, parseInt(v, 10) || 1));
        u.dayInCompany = n; u.devDayOverride = true; save(u); reloadCleanUrl();
        break;
      }
      case 'level-probation':
        u.level = { id: 'probation', ko: '수습', en: 'Probation' };
        // 수습 미리보기를 위해 승급 기록도 제거 (안 그러면 정직원 뱃지·잔재 남음)
        delete u.levelupCompletedAt; delete u.levelup_completed_at;
        delete u.levelupTestScore; delete u.levelup_test_score;
        save(u);
        try {
          localStorage.removeItem('__OD_PENDING_LEVELUP');
          // 투어·마일스톤 카드 플래그 리셋 (다음 승급 때 다시 보이게, dev 테스트용)
          localStorage.removeItem('__OD_S2_TOUR_DONE_' + (u.email || 'guest'));
          localStorage.removeItem('__OD_S2_WELCOME_DISMISSED_' + (u.email || 'guest'));
          localStorage.removeItem('__OD_MILESTONES_SEEN');  // 수습 마일스톤 팝업 다시 보이게
        } catch(e) {}
        reloadCleanUrl();
        break;
      case 'tf-nego': case 'tf-people': case 'tf-docs': case 'tf-meeting': {
        const tid = act.replace('tf-', '');
        localStorage.setItem('__OD_TF_TRACK_' + (u.email || 'guest'), JSON.stringify({ id: tid, startedAt: new Date().toISOString(), startedDay: Math.max(91, Number(u.dayInCompany) || 90) }));
        reloadCleanUrl(); break;
      }
      case 'tf-clear':
        localStorage.removeItem('__OD_TF_TRACK_' + (u.email || 'guest'));
        localStorage.removeItem('__OD_TF_DONE_' + (u.email || 'guest'));
        reloadCleanUrl(); break;
      case 'level-fulltime':
        u.level = { id: 'fulltime', ko: '사원', en: 'Associate' };
        u.levelupCompletedAt = u.levelupCompletedAt || new Date().toISOString();
        u.levelup_completed_at = u.levelupCompletedAt;
        save(u);
        try {
          // 사원 전환 시 온보딩 투어가 다시 뜨도록 완료 플래그 제거 (dev 테스트용)
          localStorage.removeItem('__OD_S2_TOUR_DONE_' + (u.email || 'guest'));
          localStorage.removeItem('__OD_S2_WELCOME_DISMISSED_' + (u.email || 'guest'));
        } catch(e) {}
        reloadCleanUrl();
        break;
      case 'reset':
        if (confirm('사용자 데이터를 모두 지울까요? 온보딩부터 다시 시작됨.')) {
          localStorage.removeItem(KEY_USER);
          location.href = 'onboarding.html';
        }
        break;
      case 'reset-day': {
        // 오늘(currentDay)의 학습 진행만 초기화, 다른 날은 그대로
        const day = u.dayInCompany || 1;
        const taskKey = '__OD_TASKS_DAY_' + day;
        const tourKey = '__OD_TOUR_DONE_DAY_' + day;
        if (confirm('Day ' + day + ' 의 일정 진행 + 투어를 초기화할까요? 다른 날 진행은 그대로 유지돼요.')) {
          try {
            localStorage.removeItem(taskKey);
            localStorage.removeItem(tourKey);
            // 설문 팝업도 다시 뜨게 (dev 테스트용)
            localStorage.removeItem('__OD_SURVEY_2026_06W2');
          } catch (e) {}
          location.reload();
        }
        break;
      }
      case 'preview-expired': {
        // 베타 만료 화면 강제 표시, Day 15로 점프 + ?expired=1 추가
        u.dayInCompany = Math.max(15, u.dayInCompany || 15);
        save(u);
        const url = new URL(location.href);
        url.searchParams.set('expired', '1');
        location.href = url.toString();
        break;
      }
      case 'exit-expired': {
        // 만료 화면 끄고 Day 1로 복귀
        const url = new URL(location.href);
        url.searchParams.delete('expired');
        location.href = url.toString();
        break;
      }
      case 'fill-learning': {
        // 현재 Day까지 시나리오를 예시 답안으로 자동 채움, 단어 사전 미리보기용
        const day = u.dayInCompany || 1;
        const SCENARIOS = (window.__SIM && window.__SIM.SCENARIOS) || [];
        const completed = [];
        for (let d = 1; d <= day && d <= 30; d++) {
          const s = SCENARIOS.find(x => x.day === d);
          if (!s) continue;
          completed.push({
            day: d,
            word: s.word,
            sentence: s.sampleAnswer || `Sample sentence using ${s.word}.`,
            feedback: {
              headline: '예시 답안 기반, 단어 자연스럽게 들어갔고, 톤도 적절.',
              overall: 'good',
              checks: [
                { ok: true, label: '단어 사용', note: `${s.word} 자연스럽게 들어감` },
                { ok: true, label: '톤', note: '사내 메시지로 적절' },
              ],
            },
            submittedAt: new Date(Date.now() - (day - d) * 86400000).toISOString(),
          });
        }
        u.scenariosCompleted = completed;
        save(u);
        // Supabase 동기화 (있으면)
        if (window.OD && window.OD.enabled && window.OD.updateProgress && u.email) {
          window.OD.updateProgress(u.email, { scenarios_completed: completed }).catch(() => {});
        }
        alert(`📚 Day 1-${day} 학습 데이터를 예시 답안으로 채웠어요. 단어 사전(노트)에서 확인.`);
        location.reload();
        break;
      }
      case 'clear-learning': {
        if (!confirm('저장된 답변 + 일정 체크 + 저널 + 첫 주 팝업 기록을 비울까요?\n(운영자 재테스트용. 출근 도장 0이 되고, 투어/설문 기록은 유지돼요)')) return;
        u.scenariosCompleted = [];
        u.dailyJournals = {};
        save(u);
        try {
          // 일정 체크(출근 도장 계산에 쓰임) + 팝업 1회 노출 기록 제거
          const em = u.email || 'guest';
          Object.keys(localStorage).filter(k =>
            k.startsWith('__OD_TASKS_DAY_') ||
            k.startsWith('__OD_FWP_') ||
            k.startsWith('__OD_MILESTONES_SEEN')
          ).forEach(k => localStorage.removeItem(k));
        } catch (e) {}
        if (window.OD && window.OD.enabled && window.OD.updateProgress && u.email) {
          window.OD.updateProgress(u.email, { scenarios_completed: [] }).catch(() => {});
        }
        location.reload();
        break;
      }
      case 'reset-popups': {
        // 첫 주 팝업(Day 1~5) 기록만 초기화. 투어/설문 기록은 유지해야
        // 리셋 직후 투어가 다시 떠서 팝업을 가리는 일이 없다.
        try {
          Object.keys(localStorage).filter(k => k.startsWith('__OD_FWP_')).forEach(k => localStorage.removeItem(k));
        } catch (e) {}
        location.reload();
        break;
      }
      case 'reload': location.reload(); break;
    }
  }

  document.body.appendChild(panel);
  render();
})();
</script>
</body>
</html>
