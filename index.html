<!-- 세션 복원용 Supabase (로그인 유지). __OD_USER 있으면 안 기다리고 바로 분기 -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="lib/supabase-config.js"></script>
<style>
  body { font-family: -apple-system, sans-serif; background: linear-gradient(180deg, #E8DFCB 0%, #DBCFB4 100%); margin: 0; height: 100vh; display: flex; align-items: center; justify-content: center; color: #2A1F14; }
  .loading { text-align: center; }
  .spinner { width: 32px; height: 32px; border: 3px solid #C9BBA0; border-top-color: #D85A2A; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 16px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .msg { font-size: 13px; color: #5C4A36; }
</style>
</head>
<body>
<div class="loading">
  <div class="spinner"></div>
  <div class="msg">로딩 중…</div>
</div>
<script>
  // ============================================================
  // 라우터, localStorage 보고 자동 분기
  // ?mode=dev      → 개발 런처 (dev.html)
  // ?mode=operator → 운영자 뷰 (operator.html)
  // ?mode=reset    → 사용자 데이터 초기화 후 온보딩
  // 사용자 있음    → mainboard.html
  // 사용자 없음 + 세션 살아있음 → DB에서 복원 후 mainboard (로그인 유지)
  // 사용자 없음 + 세션 없음 → onboarding.html
  // ============================================================
  (function() {
    const params = new URLSearchParams(location.search);
    const mode = params.get('mode');

    // UTM 등 유입 파라미터를 다음 페이지로 넘겨줌 (mode는 라우팅용이라 제외).
    function _odKeepQuery() {
      try {
        const q = new URLSearchParams(location.search);
        q.delete('mode');
        const s = q.toString();
        return s ? ('?' + s) : '';
      } catch (e) { return ''; }
    }

    if (mode === 'dev') { location.replace('dev.html'); return; }
    if (mode === 'operator') { location.replace('operator.html'); return; }
    if (mode === 'reset') {
      localStorage.removeItem('__OD_USER');
      location.replace('onboarding.html' + _odKeepQuery());
      return;
    }

    // ── 로그인 유지 보강: 최소 신원을 쿠키에도 저장 ──
    // iOS 홈 화면 앱은 강제 종료 시 localStorage를 비우지만 쿠키는 더 잘 살아남음.
    // 토큰·비밀번호 등 민감정보는 절대 안 넣고, 게이트 통과용 최소 정보만.
    function _odIdMin(u) {
      return {
        email: u.email, name: u.name,
        unlocked: u.unlocked, isOperator: u.isOperator, isDevMode: u.isDevMode,
        isPilotHire: u.isPilotHire, isTester: u.isTester,
        level: u.level, dayInCompany: u.dayInCompany, cohort: u.cohort,
      };
    }
    function _odSetIdCookie(u) {
      try {
        document.cookie = '__od_id=' + encodeURIComponent(JSON.stringify(_odIdMin(u)))
          + '; Path=/; Max-Age=34560000; Secure; SameSite=Lax';
      } catch (e) {}
    }
    function _odGetIdCookie() {
      try {
        var m = document.cookie.match(/(?:^|; )__od_id=([^;]*)/);
        return m ? JSON.parse(decodeURIComponent(m[1])) : null;
      } catch (e) { return null; }
    }

    function routeUser(user) {
      _odSetIdCookie(user);
      if (user.isOperator) {
        location.replace('operator.html');
      } else if (user.isDevMode) {
        location.replace('mainboard.html?dev=1');
      } else {
        location.replace('mainboard.html');
      }
    }

    // 1) localStorage에 사용자 있으면 즉시 분기 (빠른 경로, 세션 안 기다림)
    let user = null;
    try { user = JSON.parse(localStorage.getItem('__OD_USER') || 'null'); } catch (e) {}
    if (user && user.email) { routeUser(user); return; }

    // 1.5) localStorage는 비었지만 쿠키에 신원 있으면 즉시 복원 (iOS 강제종료 대비)
    var _ck = _odGetIdCookie();
    if (_ck && _ck.email) {
      try {
        localStorage.setItem('__OD_USER', JSON.stringify(Object.assign({}, _ck, {
          lastActive: new Date().toISOString(),
          scenariosCompleted: [], savedNotes: {}, dailyJournals: {}, wordsStudied: [],
        })));
      } catch (e) {}
      routeUser(_ck);
      return;
    }

    // 2) __OD_USER 없음 → Supabase 세션이 살아있으면 DB에서 복원해 로그인 유지
    (async function() {
      try {
        const cfg = window.__SUPABASE_CONFIG;
        if (cfg && cfg.url && cfg.anonKey && !cfg.url.includes('xxxxxxxx')
            && window.supabase && window.supabase.createClient) {
          const client = window.supabase.createClient(cfg.url, cfg.anonKey);
          const sess = await client.auth.getSession();
          const email = sess && sess.data && sess.data.session
            && sess.data.session.user && sess.data.session.user.email;
          if (email) {
            const { data: u } = await client
              .from('users').select('*')
              .eq('email', String(email).toLowerCase().trim())
              .maybeSingle();
            if (u && u.email) {
              const restored = {
                email: u.email, name: u.name,
                empNumber: u.emp_number, department: u.department, mentor: u.mentor,
                level: u.level, signupDate: u.signup_date, signup_date: u.signup_date,
                agreedAt: u.agreed_at, dayInCompany: u.day_in_company || 1, cohort: u.cohort,
                unlocked: !!u.unlocked, isOperator: !!u.is_operator, isDevMode: !!u.is_dev_mode,
                isPilotHire: !!u.is_pilot_hire, isTester: !!u.is_tester,
                membership_ends_at: u.membership_ends_at, membershipEndsAt: u.membership_ends_at,
                membership_cancel_reason: u.membership_cancel_reason, membershipCancelReason: u.membership_cancel_reason,
                levelupCompletedAt: u.levelup_completed_at, levelup_completed_at: u.levelup_completed_at,
                lastActive: new Date().toISOString(),
                scenariosCompleted: [], savedNotes: {}, dailyJournals: {}, wordsStudied: [],
              };
              try { localStorage.setItem('__OD_USER', JSON.stringify(restored)); } catch (e) {}
              routeUser(restored);
              return;
            }
          }
        }
      } catch (e) {
        console.warn('[router] 세션 복원 실패:', e && e.message);
      }
      // 3) 세션도 없음 → 온보딩
      location.replace('onboarding.html' + _odKeepQuery());
    })();
  })();
</script>
</body>
