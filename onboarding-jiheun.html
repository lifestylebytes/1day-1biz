/* 한글은 기본값이 글자 단위 줄바꿈이라 "가져왔어/요" 처럼 끝 글자가 떨어진다.
   어절 단위로 끊고, 긴 영문/URL 만 예외적으로 강제 개행. */
body { word-break: keep-all; overflow-wrap: break-word; text-wrap: pretty; }
/* ★ 2026-09-13: keep-all 만으로는 "말을 안 / 해." 처럼 짧은 어절 하나가 마지막 줄에 혼자
   떨어지는 걸 못 막는다. 본문은 pretty(고아 줄 방지), 제목은 balance(줄 길이 고르게). */
h1, h2, h3, .lead, .eyebrow, summary, .btn { text-wrap: balance; }

</style>
<script>
/* ★ 2026-09-13: 고아 줄 방지(widont).
   keep-all 은 어절 중간 분리를, text-wrap:pretty 는 일부 브라우저만 막아준다.
   마지막 어절이 짧으면 앞 어절과 줄바꿈 불가 공백(\u00A0)으로 묶어, 어떤 화면 폭에서도
   "말을 안 / 해." 처럼 한 조각만 떨어지지 않게 한다. React 재렌더에도 다시 적용된다. */
(function () {
  var NB = "\u00A0", busy = false, queued = 0;
  var SKIP = "code,pre,input,textarea,select,script,style,option,[data-nowidont]";
  function fix(root) {
    if (busy) return;
    busy = true;
    try {
      var w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null);
      var n, list = [];
      while ((n = w.nextNode())) list.push(n);
      for (var i = 0; i < list.length; i++) {
        var node = list[i], t = node.textContent;
        if (!t || t.length < 14 || t.indexOf(NB) >= 0) continue;
        var el = node.parentElement;
        if (!el || (el.closest && el.closest(SKIP))) continue;
        var m = t.match(/^([\s\S]*\S)[ \t]+(\S{1,7})(\s*)$/);
        if (!m) continue;
        if (m[1].replace(/\s+/g, "").length < 8) continue;
        node.textContent = m[1] + NB + m[2] + m[3];
      }
    } catch (e) {}
    busy = false;
  }
  function schedule() {
    if (queued) return;
    queued = requestAnimationFrame(function () { queued = 0; fix(document.body); });
  }
  function start() {
    fix(document.body);
    try { new MutationObserver(schedule).observe(document.body, { childList: true, subtree: true, characterData: true }); } catch (e) {}
    window.addEventListener("resize", schedule);
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", start);
  else start();
})();
</script>

<div id="__devbar" style="position:fixed;left:0;right:0;top:0;z-index:99999;background:#2A1F14;color:#F0A67E;font:700 12px/1.4 -apple-system,BlinkMacSystemFont,'Pretendard',sans-serif;padding:7px 14px;text-align:center;letter-spacing:-.01em">
개인 작업본이에요. 여기서 가입하면 진짜 계정이 만들어져요. 테스트용 이메일로 해주세요.

<!-- ★ 모바일로 보기 (개인 작업본 전용): PC에서 이 페이지를 휴대폰 화면 너비(390px)로 띄워 본다.
     같은 페이지를 ?mobile=1 로 작은 창(iframe)에 열기 때문에, 폰에서 보는 모양 그대로 나온다.
     작은 창 안과 실제 폰(768px 미만)에서는 버튼을 숨긴다. -->
<style>
  #__mobprev-btn{position:fixed;right:16px;bottom:96px;z-index:99998;background:#2A1F14;color:#F5EEDD;border:none;border-radius:999px;padding:11px 16px;font:800 13px/1 -apple-system,BlinkMacSystemFont,'Pretendard',sans-serif;cursor:pointer;box-shadow:0 8px 20px -8px rgba(0,0,0,.55)}
  #__mobprev{position:fixed;inset:0;z-index:100000;background:rgba(42,31,20,.72);display:none;align-items:center;justify-content:center;gap:16px;padding:20px;box-sizing:border-box}
  #__mobprev.on{display:flex}
  #__mobprev .phone{width:390px;height:min(844px,calc(100vh - 40px));background:#1C150E;border-radius:44px;padding:12px;box-sizing:border-box;box-shadow:0 30px 60px -20px rgba(0,0,0,.7);flex-shrink:0}
  #__mobprev iframe{width:100%;height:100%;border:0;border-radius:34px;background:#F5EEDD;display:block}
  #__mobprev .side{display:flex;flex-direction:column;gap:8px}
  #__mobprev .side button{background:#F5EEDD;color:#2A1F14;border:none;border-radius:10px;padding:10px 14px;font:800 13px/1.2 -apple-system,BlinkMacSystemFont,'Pretendard',sans-serif;cursor:pointer;white-space:nowrap}
  @media (max-width:767px){#__mobprev-btn{display:none}}
</style>
<script>
(function () {
  var inFrame = false;
  try { inFrame = window.self !== window.top || new URLSearchParams(location.search).get("mobile") === "1"; } catch (e) { inFrame = true; }
  if (inFrame) return;
  function build() {
    var btn = document.createElement("button");
    btn.id = "__mobprev-btn";
    btn.type = "button";
    btn.textContent = "📱 모바일로 보기";
    var wrap = document.createElement("div");
    wrap.id = "__mobprev";
    wrap.setAttribute("role", "dialog");
    wrap.setAttribute("aria-label", "모바일 화면 미리보기");
    wrap.innerHTML = '<div class="phone"><iframe title="모바일 화면 미리보기"></iframe></div>' +
      '<div class="side"><button type="button" data-act="reload">새로고침</button><button type="button" data-act="close">닫기 ✕</button></div>';
    var frame = wrap.querySelector("iframe");
    function src() { var u = new URL(location.href); u.searchParams.set("mobile", "1"); u.hash = ""; return u.toString(); }
    function open() { if (!frame.getAttribute("src")) frame.setAttribute("src", src()); wrap.classList.add("on"); document.documentElement.style.overflow = "hidden"; }
    function close() { wrap.classList.remove("on"); document.documentElement.style.overflow = ""; }
    btn.addEventListener("click", open);
    wrap.addEventListener("click", function (e) {
      var act = e.target && e.target.getAttribute && e.target.getAttribute("data-act");
      if (act === "close" || e.target === wrap) close();
      if (act === "reload") frame.setAttribute("src", src());
    });
    document.addEventListener("keydown", function (e) { if (e.key === "Escape") close(); });
    document.body.appendChild(btn);
    document.body.appendChild(wrap);
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", build); else build();
})();
</script>

  </div>
  <button id="mb-toast-x" class="mb-toast-x" aria-label="닫기">✕</button>

<script>
  // 모바일이면 내용 먼저 보여준 뒤(1.4초) 유버디 토스트를 부드럽게 노출. 닫으면 세션 동안 다시 안 뜸.
  (function() {
    var toast = document.getElementById('mb-toast');
    if (!toast) return;
    var dismissed = false;
    try { dismissed = sessionStorage.getItem('__OD_MB_TOAST') === '1'; } catch (e) {}
    if (!dismissed && window.matchMedia('(max-width: 768px)').matches) {
      setTimeout(function(){ toast.classList.add('show'); }, 1400);
      // 8초 뒤엔 스스로 내려간다 (입사 버튼 근처에 오래 머물지 않게)
      setTimeout(function(){ toast.classList.remove('show'); }, 9400);
      // 내려간 뒤엔 아예 치운다 (예전엔 아랫부분이 화면에 남아 보였다)
      setTimeout(function(){ toast.classList.add('dismissed'); }, 10200);
    }
    var x = document.getElementById('mb-toast-x');
    if (x) x.addEventListener('click', function(){
      toast.classList.remove('show');
      toast.classList.add('dismissed');
      try { sessionStorage.setItem('__OD_MB_TOAST', '1'); } catch (e) {}
    });
  })();
</script>

// 유틸, 사번 / 입사일 / 추정값 생성

function generateEmpNumber(date, seed) {
  const yyyymmdd = date.toISOString().slice(0,10).replace(/-/g, "");
  const last4 = String(1000 + (seed % 9000)).padStart(4, "0");
  return `${yyyymmdd}-${last4}`;
}
function pickRandom(arr, seed) { return arr[seed % arr.length]; }
function hashString(s) { let h = 0; for (let i = 0; i < s.length; i++) { h = ((h << 5) - h) + s.charCodeAt(i); h |= 0; } return Math.abs(h); }

// 새 계정 가입/로그인 시 이전 계정의 브라우저 단위 잔여 데이터 정리
// (오늘의 태스크 체크, 투어 완료, 공지 읽음, 주말 이벤트 등, 계정과 분리되어 누수되던 값들)
function clearStaleLocalData() {
  try {
    const PREFIXES = ["__OD_TASKS_", "__OD_TOUR_", "__OD_NOTICE_READS_", "__OD_WEEKEND_"];
    for (let i = localStorage.length - 1; i >= 0; i--) {
      const k = localStorage.key(i);
      if (!k) continue;
      if (k === "__OD_USER" || PREFIXES.some(p => k.startsWith(p))) {
        localStorage.removeItem(k);
      }
    }
  } catch (e) { console.warn("clearStaleLocalData 실패:", e); }
}

    };
    // 내부 테스터 코드: 일반 유저처럼(dev 패널 X) 입장하되, 베타 만료 X + Latpeed 미간섭.
    if (STAFF_CODES[(inviteCode || "").trim().toUpperCase()]) {
      profile.isPilotHire = false;   // 베타 만료(_isPilot) 대상에서 제외 → 안 튕김
      profile.isTester = true;        // 통계 분리 (UI엔 영향 없음, dev 패널과 무관)
      profile.isDevMode = false;      // dev 패널 안 뜸
      profile.isOperator = false;
      profile.cohort = 'staff';       // Latpeed 동기화는 'member'만 건드려서 안전
    }
    // 유료 회원 코드: 진짜 멤버로 입장 (통계 포함, 베타 만료 X). 결제 갱신/취소는 LS 웹훅이 동기화.
    if (MEMBER_CODES[(inviteCode || "").trim().toUpperCase()]) {
      profile.isPilotHire = false;
      profile.isTester = false;
      profile.isDevMode = false;
      profile.isOperator = false;
      profile.cohort = 'member';
      profile.unlocked = true;
      // 멤버십 티어 구분 (part1 = 9,900 / part2 = 13,900). cohort는 게이트 때문에 'member' 유지, 구분은 preferences.plan
      const _mplan = MEMBER_CODES[(inviteCode || "").trim().toUpperCase()].plan;
      if (_mplan) profile.preferences = { ...(profile.preferences || {}), plan: _mplan };
    }
    // 체험 코드: N일 뒤 만료일을 박아서 자동 종료 (비유료 게이트가 만료일 기준으로 차단 → 휴직 화면 → 결제 유도)
    const _trialDef = TRIAL_CODES[(inviteCode || "").trim().toUpperCase()];
    if (_trialDef) {
      profile.isPilotHire = false;
      profile.isTester = false;
      profile.isDevMode = false;
      profile.isOperator = false;
      profile.cohort = _trialDef.cohort || 'trial';
      profile.unlocked = true;
      const _tEnd = new Date(Date.now() + ((_trialDef.days || 7) - 1) * 86400000);
      _tEnd.setHours(23, 59, 59, 0);
      profile.membershipEndsAt = _tEnd.toISOString();
      profile.membership_ends_at = _tEnd.toISOString();
    }
    // ★ Supabase 동기화 먼저, 실패 시 가입 전체 차단 (silent fail 방지)
    if (window.OD && window.OD.enabled) {
      try {
        const result = await window.OD.signup(profile);
        if (result && result.duplicate) {
          alert("이미 가입된 이메일이에요. 처음 화면에서 \"다시 출근하기\"로 진입해주세요.");
          window.location.href = "onboarding-jiheun.html";
          return;
        }
        if (!result || !result.ok) {
          // ★ 서버 저장 실패 → 가입 진행 금지 (localStorage 진입 차단)
          console.error("[Supabase] 가입 동기화 실패:", result?.error);
          alert("가입 저장에 실패했어요. 잠시 후 다시 시도해주세요.\n\n오류: " + (result?.error || "알 수 없음"));
          return;  // localStorage 도 안 건드림
        }
        console.log("[Supabase] 가입 동기화 완료");
        // ★ 번호를 적고 동의하셨으면 매일 09:00 카톡 알림을 바로 켠다 (실패해도 가입은 계속)
        try {
          const _ph = (phone || "").trim();
          if (_ph && kakaoOptIn && window.OD.setKakaoNotify) {
            await window.OD.setKakaoNotify(email.trim().toLowerCase(), _ph, 9);
          }
        } catch (_) {}
        if (verifiedCode && window.OD.incrementCodeUsage) {
          try { await window.OD.incrementCodeUsage(verifiedCode); } catch (_) {}
        }
        // 비밀번호는 verify 단계(SignupVerifyScreen)에서 이미 저장됨 (이메일 인증 세션으로).
      } catch (err) {
        console.error("[Supabase] 가입 동기화 예외:", err);
        alert("가입 중 네트워크 오류가 발생했어요. 새로고침 후 다시 시도해주세요.");
        return;
      }
    }

    // 서버 저장 성공한 뒤에야 localStorage + 이동
    try {
      clearStaleLocalData();
      localStorage.setItem("__OD_USER", JSON.stringify(profile));
      if (matchedInvite) {
        const list = JSON.parse(localStorage.getItem('__OD_INVITES') || '[]');
        const updated = list.map(i => i.code === matchedInvite.code
          ? { ...i, usedAt: new Date().toISOString(), usedBy: email.trim().toLowerCase(), currentDay: 1, lastActive: new Date().toISOString() }
          : i);
        localStorage.setItem('__OD_INVITES', JSON.stringify(updated));
      }
    } catch (e) { console.warn("localStorage 저장 실패 (사파리 프라이빗 모드?)", e); }

    // 가입 후 이동, 코드 검증을 이미 ApplicationScreen에서 통과했으므로 바로 사옥으로
    // - DEV-BUDDY / DEV-OPS (운영자) → operator.html 직행
    // - DEV-TEST / DEV-2026 (테스터) → mainboard.html?dev=1
    // - 일반 사용자 (unlocked) → mainboard.html 직행
    if (matchedDevCode && matchedDevCode.operator) {
      window.location.href = "operator.html";
    } else if (matchedDevCode && matchedDevCode.dev) {
      window.location.href = "mainboard.html?dev=1";
    } else {
      window.location.href = (opt && opt.gift48) ? "mainboard-jiheun.html?b48=in" : "mainboard.html";
    }
  };

  // ★ 개인 작업본 DEV: "체험 Day 1로 바로" 버튼. 지원서를 채운 뒤 심사·합격 화면을 건너뛰고
  //   바로 가입 저장 → 체험 회원 Day 1 (48시간 사은품 배너 미리보기 ?gift48=1) 로 보낸다.
  const [devAuto, setDevAuto] = useState(false);
  const [devPreview, setDevPreview] = useState(false);  // 빈 지원서로 다음 화면 미리보기 → 끝나면 체험 Day 1 (복사본)
  useEffect(() => {
    if (devAuto && _isDevSite() && _isDevTestEmail(email)) { setDevAuto(false); finishOnboarding({ gift48: true }); }
  }, [devAuto, email]);
  useEffect(() => {
    if (devPreview === "go" && _isDevSite() && _isDevTestEmail(email)) { setDevPreview(true); setStage("reviewing"); }
  }, [devPreview, email]);

  return (
    <div className="stage">
      {stage === "welcome" && (
        <WelcomeScreen onNext={() => setStage("application")} initialLogin={_goParam === "login"} />
      )}
      {stage === "application" && (
        <ApplicationScreen
          name={name} setName={setName}
          email={email} setEmail={setEmail}
          signupPw={signupPw} setSignupPw={setSignupPw}
          phone={phone} setPhone={setPhone}
          kakaoOptIn={kakaoOptIn} setKakaoOptIn={setKakaoOptIn}
          motivation={motivation} setMotivation={setMotivation}
          inviteCode={inviteCode} setInviteCode={setInviteCode}
          devMode={devMode} setDevMode={setDevMode}
          devCode={devCode} setDevCode={setDevCode}
          isDevValid={isDevValid}
          submitting={submitting} submitError={submitError}
          stageIdx={stageIdx} totalStages={stageOrder.length}
          onSubmit={handleApplicationSubmit}
          onDevStart={() => setDevAuto(true)}
          onDevPreview={() => setDevPreview("go")}
          onBack={() => setStage("welcome")}
        />
      )}
      {stage === "verify" && (
        <SignupVerifyScreen
          email={email} password={signupPw}
          stageIdx={stageIdx} totalStages={stageOrder.length}
          onVerified={() => setStage("reviewing")}
          onBack={() => setStage("application")}
        />
      )}
      {stage === "reviewing" && <ReviewingScreen name={name} stageIdx={stageIdx} totalStages={stageOrder.length} />}
      {stage === "offer" && (
        <OfferScreen name={name} dept={dept} empNumber={empNumber} stageIdx={stageIdx} totalStages={stageOrder.length}
          onNext={() => setStage("assignment")} />
      )}
      {stage === "assignment" && (
        <AssignmentScreen empNumber={empNumber} dept={dept} mentor={mentor} stageIdx={stageIdx} totalStages={stageOrder.length}
          onNext={() => setStage("ceo")} />
      )}
      {stage === "ceo" && (
        <CEOScreen name={name} dept={dept} stageIdx={stageIdx} totalStages={stageOrder.length}
          onNext={() => setStage("ready")} />
      )}
      {stage === "ready" && (
        <ReadyScreen name={name} mentor={mentor} stageIdx={stageIdx} totalStages={stageOrder.length}
          onStart={() => finishOnboarding(devPreview ? { gift48: true } : undefined)} />
      )}
    </div>
  );
}

function StepBar({ idx, total }) {
  return (
    <div className="steps">
      {Array.from({ length: total }).map((_, i) => (
        <div key={i} className={"step-pip " + (i <= idx ? "done" : "")} />
      ))}
    </div>
  );
}

        <a onClick={() => setShowLogin(true)} style={{ fontSize: 12, color: "var(--ink-soft)", cursor: "pointer", textDecoration: "underline" }}>이미 입사하셨어요? <strong>다시 출근하기 →</strong></a>
        <div style={{ height: 74 }} />
      </div>
      <div className="fine-print" style={{ marginTop: 12 }}>
        결제 기간이 끝나도 기록은 2개월 보관 · 다시 결제하면 하던 Day 그대로 이어져요
      </div>
    </div>
    </>
  );
}

// ============================================================
// 0b. Login, 다른 기기에서 다시 출근
// ============================================================
function LoginScreen({ onBack }) {
  // step: 'email' (이메일/비번 입력) → 'code' (6자리 코드) → 'setpw' (비번 설정)
  // 비밀번호가 있으면 email 화면에서 바로 로그인. 비번 잊으면 코드 인증 후 setpw로 재설정.
  const [step, setStep] = useState("email");
  const [email, setEmail] = useState("");
  const [code, setCode] = useState("");
  const [pw, setPw] = useState("");            // 비밀번호 (로그인 또는 설정)
  const [pw2, setPw2] = useState("");          // 비밀번호 확인 (설정 시)
  const [pwIntent, setPwIntent] = useState(false);  // true면 코드 인증 후 비번 설정 화면으로
  const [error, setError] = useState("");
  const [loading, setLoading] = useState(false);

  // ★ rate limit cooldown (60초)
  const [cooldownUntil, setCooldownUntil] = useState(() => {
    try {
      const v = parseInt(localStorage.getItem("__OD_MAGIC_COOLDOWN") || "0", 10);
      return v > Date.now() ? v : 0;
    } catch (e) { return 0; }
  });
  const [now, setNow] = useState(Date.now());
  React.useEffect(() => {
    if (!cooldownUntil) return;
    const t = setInterval(() => setNow(Date.now()), 500);
    return () => clearInterval(t);
  }, [cooldownUntil]);
  const cooldownLeft = Math.max(0, Math.ceil((cooldownUntil - now) / 1000));

  // 코드 input ref (자동 포커스용)
  const codeInputRef = React.useRef(null);

  // === 인증 성공(코드/비번) 후 공통: DB 사용자 → __OD_USER 채우고 mainboard 이동 ===
  const finishLogin = async (emailLower) => {
    try {
      if (window.OD?.fetchByEmail) {
        const userRes = await window.OD.fetchByEmail(emailLower);
        if (userRes.ok && userRes.user) {
          const u = userRes.user;
          let existing = {};
          try { existing = JSON.parse(localStorage.getItem("__OD_USER") || "{}") || {}; } catch (e) {}
          const merged = {
            ...existing,
            email: u.email,
            name: u.name || existing.name,
            empNumber: u.emp_number || existing.empNumber,
            department: u.department || existing.department,
            mentor: u.mentor || existing.mentor,
            level: u.level || existing.level,
            signupDate: u.signup_date || existing.signupDate,
            signup_date: u.signup_date,
            agreedAt: u.agreed_at || existing.agreedAt,
            dayInCompany: u.day_in_company || existing.dayInCompany || 1,
            cohort: u.cohort,
            unlocked: !!u.unlocked,
            isOperator: !!u.is_operator,
            isDevMode: !!u.is_dev_mode,
            isPilotHire: !!u.is_pilot_hire,
            isTester: !!u.is_tester,
            membership_ends_at: u.membership_ends_at,
            membershipEndsAt: u.membership_ends_at,
            membership_cancel_reason: u.membership_cancel_reason,
            membershipCancelReason: u.membership_cancel_reason,
            lastActive: new Date().toISOString(),
            scenariosCompleted: existing.scenariosCompleted || [],
            savedNotes: existing.savedNotes || {},
            dailyJournals: existing.dailyJournals || {},
            wordsStudied: existing.wordsStudied || [],
          };
          localStorage.setItem("__OD_USER", JSON.stringify(merged));
        } else {
          return { ok: false, error: "가입 기록을 찾을 수 없어요. 운영자에게 문의해주세요." };
        }
      }
    } catch (e) {
      console.warn("[login] finishLogin populate 실패:", e);
    }
    window.location.href = "mainboard.html";
    return { ok: true };
  };

  // === 비밀번호로 로그인 ===
  const handlePasswordLogin = async () => {
    const emailLower = email.trim().toLowerCase();
    if (!emailLower || !/\S+@\S+\.\S+/.test(emailLower)) { setError("이메일을 정확히 입력해주세요."); return; }
    if (!pw) { setError("비밀번호를 입력해주세요."); return; }
    if (!window.OD?.signInWithPassword) { setError("서버 연결이 필요해요. 운영자에게 문의해주세요."); return; }
    setLoading(true); setError("");
    const res = await window.OD.signInWithPassword(emailLower, pw);
    if (!res.ok) { setLoading(false); setError(res.error || "로그인 실패"); return; }
    const fin = await finishLogin(emailLower);
    if (!fin.ok) { setLoading(false); setError(fin.error); }
  };

  // === 비밀번호 설정/변경/찾기 시작: 코드 발송 후 setpw 화면으로 유도 ===
  const startPasswordSetup = async () => {
    setPwIntent(true);
    setPw(""); setPw2("");
    await handleSendCode();  // 코드 발송 → step 'code'. 인증되면 pwIntent라서 setpw로.
  };

  // === 비밀번호 저장 (코드 인증으로 세션 만든 직후) ===
  const handleSetPassword = async () => {
    if (!pw || pw.length < 8) { setError("비밀번호는 8자 이상으로 정해주세요."); return; }
    if (pw !== pw2) { setError("두 비밀번호가 일치하지 않아요."); return; }
    if (!window.OD?.setPassword) { setError("서버 연결이 필요해요."); return; }
    setLoading(true); setError("");
    const res = await window.OD.setPassword(pw);
    if (!res.ok) { setLoading(false); setError(res.error || "비밀번호 설정 실패"); return; }
    const emailLower = email.trim().toLowerCase();
    const fin = await finishLogin(emailLower);
    if (!fin.ok) { setLoading(false); setError(fin.error); }
  };

  // === STEP 1: 이메일 입력 → 코드 발송 ===
  const handleSendCode = async () => {
    const trimmed = email.trim().toLowerCase();
    if (!trimmed || !/\S+@\S+\.\S+/.test(trimmed)) {
      setError("이메일을 정확히 입력해주세요.");
      return;
    }

    if (!window.OD || !window.OD.enabled) {
      setError("서버 연결이 필요한 기능입니다. 운영자에게 문의해주세요.");
      return;
    }

    if (cooldownLeft > 0) {
      setError(cooldownLeft + "초 후 다시 시도해주세요.");
      return;
    }

    setLoading(true);
    setError("");

    // 가입 기록 확인 (코드 발송 전)
    const check = await window.OD.emailExists(trimmed);
    if (!check.ok) {
      setLoading(false);
      setError("연결 실패. 잠시 후 다시 시도해주세요.");
      return;
    }
    if (!check.exists) {
      setLoading(false);
      setError("가입 기록이 없어요. 처음이신 분은 지원서 작성하기로 이동해주세요.");
      return;
    }

    // 코드 발송 (Supabase signInWithOtp가 매직링크 + 6자리 토큰 둘 다 보냄. 템플릿에서 토큰만 노출.)
    const result = await window.OD.sendMagicLink(trimmed);
    setLoading(false);

    if (!result.ok) {
      const msg = String(result.error || "");
      const m = msg.match(/after\s+(\d+)\s+seconds/i);
      if (m) {
        const secs = parseInt(m[1], 10);
        const until = Date.now() + secs * 1000;
        setCooldownUntil(until);
        try { localStorage.setItem("__OD_MAGIC_COOLDOWN", String(until)); } catch (e) {}
        setError("아직 " + secs + "초 더 기다려주세요. 이미 보낸 메일이 곧 도착할 거예요.");
      } else {
        setError("코드 발송 실패: " + (result.error || "잠시 후 다시"));
      }
      return;
    }

    // 발송 성공, 60초 cooldown + 코드 입력 화면으로 이동
    const until = Date.now() + 60 * 1000;
    setCooldownUntil(until);
    try { localStorage.setItem("__OD_MAGIC_COOLDOWN", String(until)); } catch (e) {}
    setStep("code");
    setCode("");
    // 코드 입력 칸에 자동 포커스
    setTimeout(() => { try { codeInputRef.current?.focus(); } catch (e) {} }, 100);
  };

  // === STEP 2: 코드 검증 → 세션 생성 → mainboard 이동 ===
  const handleVerifyCode = async (codeOverride) => {
    const codeToVerify = (codeOverride || code).replace(/\D/g, "").trim();
    if (codeToVerify.length !== 6) {
      setError("6자리 숫자 코드를 입력해주세요.");
      return;
    }

    if (!window.OD?.verifyOtpCode) {
      setError("서버 연결 필요. 운영자에게 문의해주세요.");
      return;
    }

    setLoading(true);
    setError("");

    const emailLower = email.trim().toLowerCase();
    const result = await window.OD.verifyOtpCode(emailLower, codeToVerify);

    if (!result.ok) {
      setLoading(false);
      setError(result.error || "코드 확인 실패. 다시 시도해주세요.");
      setCode("");
      setTimeout(() => { try { codeInputRef.current?.focus(); } catch (e) {} }, 50);
      return;
    }

    // 코드 인증 성공. 비밀번호 설정/찾기 흐름이면 비번 정하는 화면으로 (세션은 이미 생김).
    if (pwIntent) {
      setLoading(false);
      setStep("setpw");
      setCode("");
      setError("");
      return;
    }

    // 일반 로그인: DB 사용자 채우고 mainboard 이동 (finishLogin 안에서 redirect).
    const fin = await finishLogin(emailLower);
    if (!fin.ok) {
      setLoading(false);
      setError(fin.error);
      setCode("");
      return;
    }
  };

  // 코드 입력 변화 처리 (숫자만 + 6자리 자동 제출)
  const onCodeChange = (e) => {
    const v = e.target.value.replace(/\D/g, "").slice(0, 6);
    setCode(v);
    if (v.length === 6 && !loading) {
      handleVerifyCode(v);
    }
  };

  // === STEP 2 화면: 코드 입력 ===
  if (step === "code") {
    return (
      <div className="card">
        <div className="eyebrow">YOUBUDDY KOREA · 출근 코드 입력</div>
        <h1>✉️ 메일로 코드를<br/><em>보내드렸어요</em></h1>
        <p className="lead">
          <strong>{email}</strong> 메일함을 확인하고 6자리 숫자 코드를 입력해주세요.<br/>
          <strong>어느 기기에서든 OK!</strong> 모바일에서 코드 받고 PC에서 입력하셔도 됩니다.
        </p>

        <div className="form-row" style={{ marginTop: 18 }}>
          <label>출근 코드 (6자리 숫자)</label>
          <input
            ref={codeInputRef}
            type="text"
            inputMode="numeric"
            autoComplete="one-time-code"
            value={code}
            onChange={onCodeChange}
            placeholder="123456"
            maxLength={6}
            autoFocus
            onKeyDown={e => e.key === "Enter" && code.length === 6 && !loading && handleVerifyCode()}
            style={{
              fontSize: 28,
              letterSpacing: 10,
              textAlign: "center",
              fontFamily: "JetBrains Mono, monospace",
              fontWeight: 800,
              padding: "16px 12px",
            }}
          />
        </div>

        {error && (
          <div style={{ fontSize: 12, color: "#B8431A", marginTop: -4, marginBottom: 10, fontWeight: 600 }}>
            ⚠ {error}
          </div>
        )}

        <div className="btn-row" style={{ flexDirection: "column", alignItems: "stretch", gap: 10, marginTop: 8 }}>
          <button
            className="btn"
            onClick={() => handleVerifyCode()}
            disabled={loading || code.length !== 6}
            style={{ justifyContent: "center" }}
          >
            {loading ? "확인 중..." : pwIntent ? "✓ 코드 확인 후 비밀번호 설정" : "✓ 코드 확인 후 출근"}
          </button>

          <div style={{ background: "var(--paper-warm)", border: "1px dashed var(--line)", padding: "12px 14px", borderRadius: 6, fontSize: 12.5, color: "var(--ink-soft)", lineHeight: 1.7 }}>
            💡 메일이 안 보이시면:<br/>
            · <strong>스팸함</strong>도 확인해보세요<br/>
            · 코드는 1시간 동안 유효해요<br/>
            · 6자리 모두 입력하면 자동으로 확인됩니다
          </div>

          <div className="btn-row" style={{ gap: 8 }}>
            <button
              className="btn btn-ghost"
              onClick={() => { setStep("email"); setCode(""); setError(""); setPwIntent(false); }}
              style={{ flex: 1, justifyContent: "center", fontSize: 13 }}
            >
              ← 이메일 다시 입력
            </button>
            <button
              className="btn btn-ghost"
              onClick={handleSendCode}
              disabled={cooldownLeft > 0 || loading}
              style={{ flex: 1, justifyContent: "center", fontSize: 13 }}
            >
              {cooldownLeft > 0 ? `재발송 (${cooldownLeft}초)` : "코드 재발송"}
            </button>
          </div>

          <a onClick={onBack} style={{ fontSize: 13, color: "var(--ink-soft)", cursor: "pointer", textAlign: "center", padding: "8px 0" }}>
            ← 처음 화면으로
          </a>
        </div>
      </div>
    );
  }

  // === STEP 3 화면: 비밀번호 설정 (코드 인증 후) ===
  if (step === "setpw") {
    return (
      <div className="card">
        <div className="eyebrow">YOUBUDDY KOREA · 비밀번호 설정</div>
        <h1>🔑 비밀번호를<br/><em>정해주세요</em></h1>
        <p className="lead">
          <strong>{email}</strong> 인증 완료!<br/>
          이제 비밀번호를 정하면 다음부턴 코드 안 기다리고 바로 로그인할 수 있어요.
        </p>

        <div className="form-row" style={{ marginTop: 18 }}>
          <label>새 비밀번호 (8자 이상)</label>
          <input
            type="password"
            value={pw}
            onChange={e => setPw(e.target.value)}
            placeholder="비밀번호 입력"
            autoComplete="new-password"
            autoFocus

// 가입 이메일 인증 (코드 6자리) + 비밀번호 저장
// 가입 폼 제출 직후 단계. 진짜 메일인지 확인 + 그 세션으로 비번 저장.

function SignupVerifyScreen({ email, password, onVerified, onBack, stageIdx, totalStages }) {
  const [code, setCode] = useState("");
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState("");
  const [cooldownUntil, setCooldownUntil] = useState(Date.now() + 60000);
  const [now, setNow] = useState(Date.now());
  const codeRef = React.useRef(null);

  useEffect(() => {
    const t = setInterval(() => setNow(Date.now()), 500);
    setTimeout(() => { try { codeRef.current?.focus(); } catch (e) {} }, 100);
    return () => clearInterval(t);
  }, []);
  const cooldownLeft = Math.max(0, Math.ceil((cooldownUntil - now) / 1000));

  const verify = async (codeOverride) => {
    const c = (codeOverride || code).replace(/\D/g, "").trim();
    if (c.length !== 6) { setError("6자리 숫자 코드를 입력해주세요."); return; }
    if (!window.OD?.verifyOtpCode) { setError("서버 연결이 필요해요."); return; }
    setLoading(true); setError("");
    const emailLower = (email || "").trim().toLowerCase();
    const res = await window.OD.verifyOtpCode(emailLower, c);
    if (!res.ok) {
      setLoading(false);
      setError(res.error || "코드가 일치하지 않아요. 메일을 다시 확인해주세요.");
      setCode("");
      setTimeout(() => { try { codeRef.current?.focus(); } catch (e) {} }, 50);
      return;
    }
    // 인증 성공 → 이 세션으로 비밀번호 저장
    if (password && window.OD?.setPassword) {
      const pwRes = await window.OD.setPassword(password);
      if (!pwRes.ok) console.warn("[가입] 비밀번호 저장 실패:", pwRes.error);
    }
    // 세션 정리 (가입 진행은 localStorage 게이트로, 기존 동작 유지)
    try { if (window.OD?.signOut) await window.OD.signOut(); } catch (e) {}
    setLoading(false);
    onVerified();
  };

  const onCodeChange = (e) => {
    const v = e.target.value.replace(/\D/g, "").slice(0, 6);
    setCode(v);
    if (v.length === 6 && !loading) verify(v);
  };

  const resend = async () => {
    if (cooldownLeft > 0 || loading || !window.OD?.sendMagicLink) return;
    setLoading(true); setError("");
    const r = await window.OD.sendMagicLink((email || "").trim().toLowerCase());
    setLoading(false);
    if (!r || !r.ok) { setError("재발송 실패: " + (r && r.error || "잠시 후 다시")); return; }
    setCooldownUntil(Date.now() + 60000);
  };

  return (
    <div className="card">
      <StepBar idx={stageIdx} total={totalStages} />
      <div className="eyebrow">STEP 2 · 이메일 인증</div>
      <h1>메일로 <em>코드</em>를 보냈어요.</h1>
      <p className="lead">
        <strong>{email}</strong> 로 6자리 코드를 보냈어요.<br/>
        진짜 메일인지 확인하는 단계예요. 코드를 입력하면 비밀번호까지 저장돼요.
      </p>

      <div className="form-row" style={{ marginTop: 18 }}>
        <label>인증 코드 (6자리 숫자)</label>
        <input
          ref={codeRef}
          type="text" inputMode="numeric" autoComplete="one-time-code"
          value={code} onChange={onCodeChange} placeholder="123456" maxLength={6} autoFocus
          onKeyDown={e => e.key === "Enter" && code.length === 6 && !loading && verify()}
          style={{ fontSize: 28, letterSpacing: 10, textAlign: "center", fontFamily: "JetBrains Mono, monospace", fontWeight: 800, padding: "16px 12px" }}
        />
      </div>

      {error && (
        <div style={{ fontSize: 12, color: "#B8431A", marginTop: -4, marginBottom: 10, fontWeight: 600 }}>⚠ {error}</div>
      )}

      <div className="btn-row" style={{ flexDirection: "column", alignItems: "stretch", gap: 10, marginTop: 8 }}>
        <button className="btn" onClick={() => verify()} disabled={loading || code.length !== 6} style={{ justifyContent: "center" }}>
          {loading ? "확인 중..." : "✓ 인증하고 계속"}
        </button>
        <div style={{ background: "var(--paper-warm)", border: "1px dashed var(--line)", padding: "12px 14px", borderRadius: 6, fontSize: 12.5, color: "var(--ink-soft)", lineHeight: 1.7 }}>
          💡 메일이 안 보이면 <strong>스팸함</strong>도 확인해주세요. 6자리 모두 입력하면 자동으로 확인돼요.
        </div>
        <div className="btn-row" style={{ gap: 8 }}>
          <button className="btn btn-ghost" onClick={onBack} disabled={loading} style={{ flex: 1, justifyContent: "center", fontSize: 13 }}>
            ← 정보 다시 입력
          </button>
          <button className="btn btn-ghost" onClick={resend} disabled={cooldownLeft > 0 || loading} style={{ flex: 1, justifyContent: "center", fontSize: 13 }}>
            {cooldownLeft > 0 ? "재발송 (" + cooldownLeft + "초)" : "코드 재발송"}
          </button>
        </div>
      </div>
    </div>
  );
}

        <input type="email" value={email} onChange={e => setEmail(e.target.value)} placeholder={_trialDefOf(inviteCode) ? "자주 쓰는 이메일 (예: you@gmail.com)" : "구매하신 이메일 입력 (예: you@gmail.com)"} />
      </div>
      <div className="form-row">
        <label>비밀번호 <span style={{ fontSize: 11, fontWeight: 500, color: "var(--ink-mute)", letterSpacing: 0 }}>· 8자 이상</span></label>
        <input type="password" value={signupPw} onChange={e => setSignupPw(e.target.value)} placeholder="비밀번호 (8자 이상)" autoComplete="new-password" />
        {signupPw && signupPw.length < 8 && (
          <div style={{ fontSize: 11, color: "#B8431A", marginTop: 4, fontWeight: 600 }}>비밀번호는 8자 이상으로 정해주세요.</div>
        )}
      </div>
      {/* ★ 카톡 출근 알림: 번호는 선택, 동의는 기본 체크 */}
      <div className="form-row">
        <label>휴대폰 번호 <span style={{ fontSize: 11, fontWeight: 500, color: "var(--ink-mute)", letterSpacing: 0 }}>· 선택</span></label>
        <input type="tel" inputMode="tel" value={phone} onChange={e => setPhone(e.target.value)} placeholder="010-0000-0000" />
        <label
          onClick={() => setKakaoOptIn(v => !v)}
          style={{ display: "flex", alignItems: "flex-start", gap: 8, cursor: "pointer", marginTop: 9,
                   fontSize: 12.5, fontWeight: 700, color: "var(--ink)", textTransform: "none", letterSpacing: "normal", lineHeight: 1.55 }}>
          <span style={{ display: "inline-flex", alignItems: "center", justifyContent: "center", flexShrink: 0,
                         width: 18, height: 18, marginTop: 1, borderRadius: 5,
                         border: "1.6px solid " + (kakaoOptIn ? "var(--accent)" : "var(--line)"),
                         background: kakaoOptIn ? "var(--accent)" : "transparent", color: "#fff", fontSize: 12, fontWeight: 900 }}>
            {kakaoOptIn ? "✓" : ""}
          </span>
          <span>
            이 번호로 <strong>매일 아침 9시</strong> 오늘의 표현 받기
            <span style={{ display: "block", fontSize: 11, fontWeight: 500, color: "var(--ink-mute)", marginTop: 2 }}>
              앱을 안 열어도 카톡으로 와요. 시간 변경·해제는 사원증 → 설정에서 언제든.
            </span>
          </span>
        </label>
      </div>
      <div className="form-row">
        <label>지원 동기 (한 줄)</label>
        <textarea value={motivation} onChange={e => setMotivation(e.target.value)} placeholder="왜 이 회사에 오고 싶은지 솔직하게…" />
        <span className="fine-print" style={{ marginTop: 6 }}>한 줄이면 충분해요. 첫 출근 때 사수가 읽고 인사해요.</span>
      </div>

      {/* ── 법적 동의 (필수) ── */}
      <div style={{
        marginTop: 18, padding: "14px 16px",
        background: "var(--paper-warm)",
        border: "1px solid var(--line)",
        borderRadius: 8,
      }}>
        <label
          onClick={toggleAll}
          style={{
            display: "flex", alignItems: "center", gap: 8,
            cursor: "pointer", marginBottom: 10,
            fontSize: 13, fontWeight: 800, color: "var(--ink)",
            textTransform: "none", letterSpacing: "normal",
            paddingBottom: 8, borderBottom: "1px dashed var(--line)",
          }}
        >
          <span style={{
            display: "inline-flex", alignItems: "center", justifyContent: "center",
            width: 18, height: 18, borderRadius: 4,
            border: "1.5px solid " + (allAgreed ? "var(--accent)" : "var(--line)"),
            background: allAgreed ? "var(--accent)" : "transparent",
            color: "#fff", fontSize: 11, fontWeight: 900,
          }}>{allAgreed ? "✓" : ""}</span>
          전체 동의 (필수)
        </label>

        {[
          { v: agreeAge,     set: setAgreeAge,     text: "만 14세 이상입니다.", req: true, link: null },
          { v: agreeTerms,   set: setAgreeTerms,   text: "이용약관에 동의합니다.", req: true, link: "terms.html" },
          { v: agreePrivacy, set: setAgreePrivacy, text: "개인정보처리방침에 동의합니다 (Supabase 미국 서버 국외 이전 포함).", req: true, link: "privacy.html" },
        ].map((it, i) => (
          <label key={i} onClick={() => it.set(!it.v)} style={{
            display: "flex", alignItems: "flex-start", gap: 8,
            cursor: "pointer", marginBottom: 6,
            fontSize: 12.5, color: "var(--ink-soft)",
            textTransform: "none", letterSpacing: "normal", fontWeight: 500,
            lineHeight: 1.55,
          }}>
            <span style={{
              flexShrink: 0,
              display: "inline-flex", alignItems: "center", justifyContent: "center",
              width: 16, height: 16, borderRadius: 3,
              border: "1.5px solid " + (it.v ? "var(--accent)" : "var(--line)"),
              background: it.v ? "var(--accent)" : "transparent",
              color: "#fff", fontSize: 10, fontWeight: 900,
              marginTop: 1,
            }}>{it.v ? "✓" : ""}</span>
            <span style={{ flex: 1 }}>
              <span style={{ color: "var(--accent)", fontWeight: 700 }}>[필수]</span> {it.text}
              {it.link && (
                <a href={it.link} target="_blank" rel="noopener" onClick={e => e.stopPropagation()}
                   style={{ marginLeft: 6, fontSize: 11.5, color: "var(--ink-mute)", textDecoration: "underline" }}>
                  전문 보기
                </a>
              )}
            </span>
          </label>
        ))}
      </div>

      {submitError && (
        <div style={{
          marginTop: 12, padding: "10px 12px",
          background: "#fdecea", border: "1px solid #f5c2c0",
          borderRadius: 6, fontSize: 12.5, color: "#B8431A", fontWeight: 600,
        }}>
          ⚠ {submitError}
        </div>
      )}
      <div className="btn-row">
        <button className="btn" disabled={(!valid && !_isDevSite()) || submitting} onClick={() => {
          // ★ 개인 작업본: 빈칸이어도 눌리게. 테스트 정보로 채우고 심사 → 합격 → … 화면을 순서대로 보여준다.
          if (!valid && _isDevSite()) { _devFill(true); if (onDevPreview) onDevPreview(); return; }
          onSubmit();
        }}>
          {submitting ? "코드 확인 중…" : "지원서 제출 →"}
        </button>
        <span className="fine-print" style={{ marginLeft: "auto", marginTop: 0 }}>
          {submitting ? "" : "✓ 진도·기록 자동 저장"}
        </span>
      </div>

      <div style={{ marginTop: 18, paddingTop: 14, borderTop: "1px dashed var(--line)", textAlign: "center" }}>
        <a
          onClick={onBack}
          style={{ fontSize: 13, color: "var(--ink-soft)", cursor: "pointer", textDecoration: "underline" }}
        >
          ← 1일1비 메인으로 돌아가기
        </a>
      </div>
    </div>
  );
}

// ============================================================
// 2. Reviewing (자동 진행)
// ============================================================
function ReviewingScreen({ name, stageIdx, totalStages }) {
  const [phase, setPhase] = useState(0);
  const phases = [
    "지원서 접수 확인 중…",
    "인사팀이 검토하고 있어요…",
    "임원진 면접 결과 회신 대기…",
    "결과 확정. 잠시만요!",
  ];
  useEffect(() => {
    const t = setInterval(() => setPhase(p => Math.min(p + 1, phases.length - 1)), 700);
    return () => clearInterval(t);
  }, []);
  return (
    <div className="card">
      <StepBar idx={stageIdx} total={totalStages} />
      <div className="eyebrow">STEP 3 · 심사 중</div>
      <h1>{name}님,<br/>지원서를 <em>검토하고 있어요</em>.</h1>
      <div className="loading">
        <div className="spinner"></div>
        <div className="loading-text">{phases[phase]}</div>
      </div>
      <p className="fine-print">실제 회사보다 100배 빠릅니다.</p>
    </div>
  );
}

// ============================================================

      <div className="email-body">
        <p><strong>{name}님께,</strong></p>
        <p>
          유버디 컴퍼니에 지원해주셔서 감사합니다. 임원진 회의에서 만장일치로 <strong>최종 합격</strong>이 결정되었습니다.
        </p>

          {name}님께 부여된 사번은 <strong style={{ fontFamily: "JetBrains Mono, monospace" }}>{empNumber}</strong> 입니다.

        <p>
          첫 출근일은 <strong>오늘</strong>입니다. 다음 화면에서 사수와 첫 업무를 안내드릴게요.
          처음 30일은 수습 기간이고, 매일 짧은 시나리오로 회사에 적응하시면 됩니다.

          <strong>오신 걸 환영합니다. 1일1비 컴퍼니에서 새로운 시작을!</strong>

        <div className="signature">
          <b>유버디 컴퍼니 인사팀</b>
          <small>YouBuddy Korea · People & Culture</small>

      </div>
      <div style={{ padding: "16px 30px", background: "var(--paper-warm)", borderTop: "1px solid var(--line)", display: "flex", justifyContent: "flex-end" }}>

      </div>

// ============================================================
// 4. Assignment (사번/부서/사수)
// ============================================================
function AssignmentScreen({ empNumber, dept, mentor, stageIdx, totalStages, onNext }) {
  return (
    <div className="card">
      <StepBar idx={stageIdx} total={totalStages} />
      <div className="eyebrow">STEP 4 · 배정 안내</div>
      <h1>당신의 <em>자리</em>가 준비됐어요.</h1>
      <p className="lead">전담 사수가 배정됐어요. 첫 30일 수습 기간 동안 가장 많이 대화하게 될 거예요.</p>

      <div className="assign-grid">

          <div className="lab">사번</div>

        <div style={{ width: 56, height: 56, borderRadius: "50%", background: "linear-gradient(135deg, #D85A2A, #8B3A18)", display: "flex", alignItems: "center", justifyContent: "center", color: "white", fontWeight: 900, fontSize: 22, flexShrink: 0 }}>🤝</div>
        <div>
          <div style={{ fontWeight: 800, fontSize: 14 }}>유버디 (YouBuddy)</div>

// ============================================================
function ReadyScreen({ name, mentor, stageIdx, totalStages, onStart }) {

      <StepBar idx={stageIdx} total={totalStages} />
      <div className="eyebrow">STEP 6 · 첫 출근</div>
      <h1>{name}님, 9시예요.<br/><em>출근하세요.</em></h1>
      <p className="lead">
        {mentor.name}님이 사옥 로비에서 기다리고 있어요. 첫날은 자기소개와 자리 안내, 그리고 아주 짧은 첫 미팅으로 끝나요.
        <br/><br/>
        부담 갖지 않으셔도 돼요. 오늘은 딱 5분이면 충분해요.
      </p>
      <div style={{
        background: "rgba(216,90,42,0.06)", border: "1px dashed rgba(216,90,42,0.4)",
        borderRadius: 10, padding: "16px 18px", margin: "8px 0 20px", textAlign: "left",
      }}>
        <div style={{ fontSize: 12, fontWeight: 800, letterSpacing: "0.06em", color: "#C2410C", marginBottom: 10 }}>
          🎁 승진하면 기능이 점차 열려요
        </div>
        <div style={{ display: "grid", gap: 8, fontSize: 13, lineHeight: 1.5, color: "#4A3C2E" }}>
          <div><b>👤 수습 (Day 1-30)</b> · 매일 시추에이션, 미니 미션, 점심 대화</div>
          <div><b>🎓 사원 전환 (Day 30)</b> · 30일 완주하면 정직원 발령</div>
          <div><b>📒 사원 보상</b> · 저장한 표현을 모아보는 <b>나만의 노트</b>, 회의 주도 표현(Day 31-60), 네이비 새 사원증</div>
        </div>
        <div style={{ fontSize: 11.5, color: "#8A7A66", marginTop: 10, lineHeight: 1.5 }}>
          그날 학습을 마쳐야 다음 Day가 열려요. 꾸준히 출근할수록 직급이 오르고, 새로운 기능과 콘텐츠가 하나씩 해제됩니다.
        </div>
      </div>
      <div className="btn-row">
        <button className="btn" onClick={onStart} style={{ fontSize: 15, padding: "14px 28px" }}>
          🏢 사옥으로 출근하기
        </button>
      </div>
      <div className="fine-print">출근 후엔 매일 새로운 시나리오가 기다리고 있어요.</div>
    </div>
  );
}
