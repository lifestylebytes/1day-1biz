<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>1일1비 · 출근 대기실</title>
<!-- ★ 정식 오픈 후, simulator는 deprecated. onboarding으로 자동 라우팅.
     단 ?keep=1 파라미터 있으면 옛 베타 코드 입력 흐름 유지 (운영자 디버깅용). -->
<script>
(function() {
  try {
    var params = new URLSearchParams(location.search);
    if (params.has('keep')) return;
    location.replace('onboarding.html');
  } catch (e) {
    location.replace('onboarding.html');
  }
})();
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="lib/supabase-config.js"></script>
<script src="lib/supabase-client.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800;900&display=swap');
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap');

:root {
  --paper: #F4EFE3;
  --paper-warm: #ECE3CF;
  --ink: #2A1F14;
  --ink-soft: #5C4A36;
  --ink-mute: #8A7964;
  --line: #C9BBA0;
  --accent: #D85A2A;
  --green: #2D8A3E;
  --danger: #B8431A;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { min-height: 100%; }
body {
  font-family: 'Noto Sans KR', sans-serif;
  background: linear-gradient(180deg, #E8DFCB 0%, #DBCFB4 100%);
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 32px 20px;
}
body::before {
  content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
  background-image:
    radial-gradient(rgba(58,40,18,0.05) 1px, transparent 1px),
    radial-gradient(rgba(58,40,18,0.03) 1px, transparent 1px);
  background-size: 32px 32px, 8px 8px;
}

.card {
  position: relative;
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 48px 40px 32px;
  width: 100%;
  max-width: 540px;
  box-shadow: 0 30px 60px -20px rgba(58,40,18,0.25), 0 8px 24px rgba(58,40,18,0.08);
  animation: cardIn 0.5s cubic-bezier(0.2, 0.9, 0.3, 1.1);
}
@keyframes cardIn { from { opacity: 0; transform: translateY(20px) scale(0.97); } to { opacity: 1; transform: translateY(0) scale(1); } }

.stamp {
  position: absolute; top: 22px; right: 22px;
  font-size: 11px; letter-spacing: 0.22em; font-weight: 800;
  color: var(--accent); border: 2px solid var(--accent);
  padding: 5px 12px; border-radius: 4px; transform: rotate(-6deg);
}

.eyebrow { font-size: 11px; letter-spacing: 0.24em; font-weight: 800; color: var(--accent); text-transform: uppercase; margin-bottom: 14px; }
h1 { font-size: 28px; font-weight: 900; letter-spacing: -0.02em; line-height: 1.3; margin-bottom: 16px; }
h1 em { font-style: normal; color: var(--accent); }

.lead { font-size: 14px; color: var(--ink-soft); line-height: 1.75; margin-bottom: 22px; }
.lead strong { color: var(--ink); }

.notice {
  background: var(--paper-warm);
  border: 1px dashed var(--line);
  border-radius: 8px;
  padding: 14px 16px;
  font-size: 13px;
  color: var(--ink);
  line-height: 1.7;
  margin-bottom: 24px;
}
.notice b { color: var(--accent); }

/* 코드 입력 disclosure */
.gate {
  border-top: 1px dashed var(--line);
  padding-top: 22px;
  margin-top: 6px;
}
.gate-toggle {
  display: flex; align-items: center; gap: 8px;
  font-size: 13px; font-weight: 700; color: var(--ink);
  cursor: pointer; user-select: none;
  padding: 6px 0;
}
.gate-toggle .arrow { transition: transform 0.2s; font-size: 11px; color: var(--ink-mute); }
.gate.open .gate-toggle .arrow { transform: rotate(90deg); }
.gate-body { display: none; margin-top: 14px; }
.gate.open .gate-body { display: block; }

label { display: block; font-size: 11px; font-weight: 700; color: var(--ink-mute); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 6px; }
input {
  width: 100%; padding: 12px 14px; font-size: 14px; font-family: 'JetBrains Mono', monospace;
  background: var(--paper-warm); border: 1px solid var(--line); border-radius: 6px; color: var(--ink);
  letter-spacing: 0.05em; text-transform: uppercase;
  transition: border-color 0.15s ease;
}
input:focus { outline: none; border-color: var(--accent); }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: 13px 24px; font-size: 14px; font-weight: 700; font-family: inherit;
  background: var(--ink); color: var(--paper); border: none; border-radius: 8px;
  cursor: pointer; text-decoration: none;
  transition: transform 0.1s, background 0.15s;
  width: 100%;
}
.btn:hover:not(:disabled) { background: #1a120a; transform: translateY(-1px); }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }

.msg-ok { font-size: 12px; color: var(--green); font-weight: 700; margin-top: 8px; }
.msg-err { font-size: 12px; color: var(--danger); font-weight: 700; margin-top: 8px; }

.footer-links {
  margin-top: 22px; padding-top: 14px; border-top: 1px dashed var(--line);
  display: flex; gap: 10px; justify-content: center; flex-wrap: wrap;
  font-size: 12px;
}
.footer-links a { color: var(--ink-soft); text-decoration: underline; }
.footer-links a:hover { color: var(--ink); }

/* ── 세션 인디케이터 (현재 로그인 계정 표시) ── */
.session-pill {
  position: fixed; top: 14px; right: 14px; z-index: 1000;
  display: flex; align-items: center; gap: 8px;
  background: rgba(42,31,20,0.9);
  color: var(--paper);
  padding: 7px 12px 7px 10px;
  border-radius: 999px;
  font-size: 11px;
  font-family: 'JetBrains Mono', monospace;
  letter-spacing: 0;
  box-shadow: 0 6px 18px -6px rgba(58,40,18,0.4);
  backdrop-filter: blur(8px);
}
.session-pill .si-dot { width: 6px; height: 6px; border-radius: 50%; background: #4ade80; flex-shrink: 0; }
.session-pill .si-email { font-weight: 600; }
.session-pill .si-role {
  background: var(--accent); color: #fff;
  padding: 1px 6px; border-radius: 4px;
  font-size: 9px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase;
}
.session-pill .si-role.role-pending { background: #6b7280; }
.session-pill .si-logout {
  color: var(--paper); opacity: 0.55; cursor: pointer;
  text-decoration: underline; margin-left: 2px; font-size: 10px;
}
.session-pill .si-logout:hover { opacity: 1; }
@media (max-width: 600px) {
  .session-pill { font-size: 10px; padding: 5px 10px 5px 8px; top: 8px; right: 8px; }
}
</style>
</head>
<body>
<!-- ═══════════════════════════════════════════════════════════
     접근 가드, 운영자/Dev는 mainboard로 이미 직진했어야 정상
     실수로 simulator로 들어와도 자동 리다이렉트
     ═══════════════════════════════════════════════════════════ -->
<script>
(function(){
  try {
    var u = JSON.parse(localStorage.getItem('__OD_USER') || 'null');
    if (u && (u.isOperator === true || u.isDevMode === true)) {
      // 운영자·Dev는 본 페이지에 머물 이유 없음 → mainboard 직행
      var search = u.isDevMode ? '?dev=1' : '';
      location.replace('mainboard.html' + search);
    } else if (u && u.unlocked === true) {
      // 이미 unlock 된 사용자도 바로 mainboard
      location.replace('mainboard.html');
    }
  } catch(e) {}
})();
</script>

<!-- 세션 인디케이터, 현재 로그인 계정 표시 -->
<script>
(function(){
  try {
    var u = JSON.parse(localStorage.getItem('__OD_USER') || 'null');
    if (!u || !u.email) return; // 로그인 안 된 상태에선 표시 안 함
    var role = 'pending', dot = '#fbbf24';
    if (u.isOperator)      { role = 'operator';  dot = '#4ade80'; }
    else if (u.isDevMode)  { role = 'dev';       dot = '#60a5fa'; }
    else if (u.unlocked)   { role = 'unlocked';  dot = '#4ade80'; }
    var pill = document.createElement('div');
    pill.className = 'session-pill';
    pill.innerHTML =
      '<span class="si-dot" style="background:' + dot + '"></span>' +
      '<span class="si-email">' + u.email + '</span>' +
      '<span class="si-role role-' + role + '">' + role + '</span>' +
      '<a class="si-logout" id="si-logout">로그아웃</a>';
    document.body.appendChild(pill);
    document.getElementById('si-logout').addEventListener('click', function(){
      if (!confirm('로그아웃 하시겠어요?')) return;
      localStorage.removeItem('__OD_USER');
      location.reload();
    });
  } catch(e){}
})();
</script>

<div class="card">
  <div class="stamp">PREPARING</div>
  <div class="eyebrow">YOUBUDDY KOREA · 출근 대기실</div>
  <h1>접수는 잘 받았어요.<br/><em>사옥은 아직 준비 중</em>이에요.</h1>
  <p class="lead">
    1일1비 정식 베타가 곧 열려요. 입사 처리는 끝났지만, 사옥 문은 베타 시작과 동시에 열릴 예정이라 잠깐만 더 기다려주세요. 정식 시작 시 입력하신 이메일로 안내드릴게요.
  </p>

  <div class="notice">
    🎟 <b>이미 베타 코드 받으셨어요?</b><br/>
    아래 칸에 코드 입력하시면 바로 사옥에 들어가실 수 있어요.
  </div>

  <div id="gate" class="gate">
    <div class="gate-toggle" id="gate-toggle">
      <span class="arrow">▶</span>
      <span>베타 코드로 입장하기</span>
    </div>
    <div class="gate-body">
      <label for="code-input">베타 코드</label>
      <input id="code-input" placeholder="코드 입력" autocomplete="off" />
      <div id="code-msg"></div>
      <div style="margin-top: 14px;">
        <button id="unlock-btn" class="btn">🔓 사옥 입장</button>
      </div>
    </div>
  </div>

  <div class="footer-links">
    <a href="onboarding.html">← 다른 계정으로 로그인</a>
    <span style="color: var(--ink-mute);">·</span>
    <a href="https://www.instagram.com/youbuddy_day/" target="_blank" rel="noopener">인스타에서 소식 받기</a>
  </div>
</div>

<script>
(function() {
  var gate = document.getElementById('gate');
  var toggle = document.getElementById('gate-toggle');
  var input = document.getElementById('code-input');
  var msg = document.getElementById('code-msg');
  var btn = document.getElementById('unlock-btn');

  // 토글 동작
  toggle.addEventListener('click', function() {
    gate.classList.toggle('open');
    if (gate.classList.contains('open')) input.focus();
  });

  // URL ?code=XXX 자동 채움
  try {
    var urlCode = new URLSearchParams(location.search).get('code');
    if (urlCode) {
      input.value = urlCode.toUpperCase();
      gate.classList.add('open');
    }
  } catch(e) {}

  // 입력 시 메시지 클리어
  input.addEventListener('input', function() {
    msg.innerHTML = '';
    input.value = input.value.toUpperCase();
  });

  function showOk(text) { msg.className = 'msg-ok'; msg.textContent = '✓ ' + text; }
  function showErr(text) { msg.className = 'msg-err'; msg.textContent = '⚠ ' + text; }

  async function tryUnlock() {
    var code = (input.value || '').trim().toUpperCase();
    if (!code) { showErr('코드를 입력해주세요.'); return; }

    btn.disabled = true;
    btn.textContent = '확인 중…';
    msg.innerHTML = '';

    try {
      // ── 서버 사이드 검증 (pilot_codes 화이트리스트 대조) ──
      if (!window.OD || !window.OD.enabled) {
        showErr('서버 연결이 필요해요. 잠시 후 다시 시도해주세요.');
        btn.disabled = false; btn.textContent = '🔓 사옥 입장';
        return;
      }

      var result = await window.OD.checkInviteCode(code);
      if (!result || !result.valid) {
        showErr('유효하지 않은 코드예요. 다시 확인해주세요.');
        btn.disabled = false; btn.textContent = '🔓 사옥 입장';
        return;
      }

      // ── 통과 → localStorage 프로필 unlock 마킹 ──
      var raw = localStorage.getItem('__OD_USER');
      var u = raw ? JSON.parse(raw) : {};
      u.unlocked = true;
      u.unlockCode = code;
      u.unlockedAt = new Date().toISOString();
      u.cohort = result.cohort || u.cohort || null;
      localStorage.setItem('__OD_USER', JSON.stringify(u));

      // ── Supabase에도 동기화 (선택, 실패해도 진행) ──
      try {
        if (u.email && window.OD.updateProgress) {
          await window.OD.updateProgress(u.email, {
            cohort: u.cohort,
            // unlocked 필드는 별도 컬럼이 필요하지만, 우선 cohort로 마킹만
          });
        }
      } catch(_) {}

      showOk('사옥 문 열림! 잠시만요…');
      setTimeout(function() { location.replace('mainboard.html'); }, 700);
    } catch (e) {
      showErr('처리 실패. 잠시 후 다시 시도해주세요.');
      btn.disabled = false; btn.textContent = '🔓 사옥 입장';
    }
  }

  btn.addEventListener('click', tryUnlock);
  input.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') tryUnlock();
  });
})();
</script>
</body>
</html>
