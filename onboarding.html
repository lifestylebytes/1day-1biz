<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&display=swap');

:root {
  --paper: #F4EFE3;
  --paper-warm: #ECE3CF;
  --ink: #2A1F14;
  --ink-soft: #5C4A36;
  --ink-mute: #8A7964;
  --line: #C9BBA0;
  --accent: #D85A2A;
  --accent-soft: rgba(216,90,42,0.12);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body, #root { height: 100%; }
body {
  font-family: 'Noto Sans KR', sans-serif;
  background: linear-gradient(180deg, #E8DFCB 0%, #DBCFB4 100%);
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}
body::before {
  content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
  background-image:
    radial-gradient(rgba(58,40,18,0.05) 1px, transparent 1px),
    radial-gradient(rgba(58,40,18,0.03) 1px, transparent 1px);
  background-size: 32px 32px, 8px 8px;
}

.stage {
  min-height: 100vh; display: flex; flex-direction: column;
  align-items: center; justify-content: center; padding: 32px 20px;
}
.card {
  background: var(--paper); border: 1px solid var(--line);
  border-radius: 12px; padding: 40px 36px; width: 100%; max-width: 540px;
  box-shadow: 0 30px 60px -20px rgba(58,40,18,0.25), 0 8px 24px rgba(58,40,18,0.08);
  animation: cardIn 0.5s cubic-bezier(0.2, 0.9, 0.3, 1.1);
  position: relative;
}
@keyframes cardIn { from { opacity: 0; transform: translateY(20px) scale(0.97); } to { opacity: 1; transform: translateY(0) scale(1); } }

.eyebrow { font-size: 11px; letter-spacing: 0.24em; font-weight: 800; color: var(--accent); text-transform: uppercase; margin-bottom: 12px; }
h1 { font-size: 30px; font-weight: 900; letter-spacing: -0.02em; line-height: 1.25; margin-bottom: 14px; }
h1 em { font-style: normal; font-weight: 900; color: var(--accent); }
.lead { font-size: 14px; color: var(--ink-soft); line-height: 1.7; margin-bottom: 28px; }

.form-row { margin-bottom: 18px; }
label { display: block; font-size: 12px; font-weight: 700; color: var(--ink-mute); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 6px; }
input, textarea, select {
  width: 100%; padding: 12px 14px; font-size: 14px; font-family: inherit;
  background: var(--paper-warm); border: 1px solid var(--line); border-radius: 6px; color: var(--ink);
  transition: border-color 0.15s ease;
}
input:focus, textarea:focus { outline: none; border-color: var(--accent); }
textarea { resize: vertical; min-height: 70px; }

.btn {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 13px 24px; font-size: 14px; font-weight: 700; font-family: inherit;
  background: var(--ink); color: var(--paper); border: none; border-radius: 8px;
  cursor: pointer; transition: transform 0.1s ease, background 0.15s ease;
}
.btn:hover:not(:disabled) { background: #1a120a; transform: translateY(-1px); }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }
.btn-row { display: flex; gap: 12px; align-items: center; margin-top: 24px; }
.btn-ghost { background: transparent; color: var(--ink-soft); padding-left: 0; padding-right: 0; }
.btn-ghost:hover:not(:disabled) { background: transparent; color: var(--ink); transform: none; }

.stamp {
  position: absolute; top: 22px; right: 22px;
  font-size: 10px; letter-spacing: 0.2em; font-weight: 800;
  color: var(--accent); border: 2px solid var(--accent);
  padding: 4px 10px; border-radius: 4px; transform: rotate(-6deg);
  opacity: 0.85;
}

/* 메일 스타일 */
.email-card {
  background: var(--paper); border: 1px solid var(--line);
  border-radius: 4px; max-width: 580px; width: 100%;
  box-shadow: 0 30px 60px -20px rgba(58,40,18,0.3);
  overflow: hidden;
  animation: cardIn 0.5s cubic-bezier(0.2, 0.9, 0.3, 1.1);
}
.email-head {
  background: var(--paper-warm); padding: 18px 24px;
  border-bottom: 1px solid var(--line);
  font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--ink-soft);
}
.email-head .from { color: var(--ink); font-weight: 600; margin-bottom: 4px; }
.email-head .subject { color: var(--ink); font-weight: 700; font-size: 14px; margin-top: 8px; font-family: 'Noto Sans KR'; }
.email-body { padding: 28px 30px; font-size: 14px; line-height: 1.85; color: var(--ink-soft); }
.email-body p { margin-bottom: 16px; }
.email-body strong { color: var(--ink); }
.email-body .signature { margin-top: 26px; padding-top: 18px; border-top: 1px dashed var(--line); }
.email-body .signature b { display: block; font-size: 15px; color: var(--ink); }
.email-body .signature small { color: var(--ink-mute); font-size: 12px; }

/* 배정 카드 (사번 등) */
.assign-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin: 22px 0; }
.assign-cell {
  background: var(--paper-warm); border: 1px dashed var(--line);
  border-radius: 6px; padding: 14px;
  text-align: center;
}
.assign-cell .lab { font-size: 10px; letter-spacing: 0.16em; color: var(--ink-mute); text-transform: uppercase; font-weight: 700; margin-bottom: 6px; }
.assign-cell .val { font-size: 15px; font-weight: 800; color: var(--ink); font-family: 'JetBrains Mono', monospace; }
.assign-cell.full { grid-column: 1 / -1; }

/* 로딩 */
.loading { display: flex; align-items: center; justify-content: center; gap: 12px; padding: 16px; }
.spinner {
  width: 24px; height: 24px; border: 3px solid var(--line); border-top-color: var(--accent);
  border-radius: 50%; animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.loading-text { font-size: 13px; color: var(--ink-soft); }

.steps { display: flex; gap: 6px; margin-bottom: 22px; }
.step-pip { flex: 1; height: 3px; background: var(--line); border-radius: 99px; transition: background 0.3s ease; }
.step-pip.done { background: var(--accent); }

.fine-print { font-size: 11px; color: var(--ink-mute); line-height: 1.6; margin-top: 16px; }

@media (max-width: 600px) {
  .card { padding: 30px 24px; }
  h1 { font-size: 24px; }
  .assign-grid { grid-template-columns: 1fr; }
}

/* ── 모바일 차단 팝업, "어허! 업무를 모바일로요?" ── */
.mobile-block { display: none; position: fixed; inset: 0; z-index: 99999;
  background: linear-gradient(180deg, #E8DFCB 0%, #DBCFB4 100%);
  align-items: center; justify-content: center; padding: 22px;

@media (max-width: 768px) {

.mobile-block.dismissed { display: none !important; }

.mb-card { background: var(--paper); border: 1px solid var(--line); border-radius: 12px;

@keyframes mbPop {
  from { opacity: 0; transform: translateY(20px) scale(0.94); }

}
.mb-stamp { display: inline-block; font-size: 30px; font-weight: 900; letter-spacing: 0.06em;
  color: var(--accent); border: 3px solid var(--accent); padding: 8px 22px; border-radius: 6px;
  transform: rotate(-6deg); margin-bottom: 22px; font-family: 'Noto Sans KR', sans-serif;
}
.mb-card h2 { font-size: 22px; font-weight: 900; letter-spacing: -0.02em; line-height: 1.3; margin-bottom: 14px; color: var(--ink); }
.mb-lead { font-size: 13.5px; color: var(--ink-soft); line-height: 1.7; margin-bottom: 18px; word-break: keep-all; }
.mb-lead b { color: var(--ink); }
.mb-tip { background: var(--paper-warm); padding: 14px 16px; border-radius: 8px; border: 1px dashed var(--line);
  font-size: 13px; color: var(--ink); line-height: 1.6; margin-bottom: 14px; font-weight: 600; text-align: left; }
.mb-tip small { display: block; color: var(--ink-mute); font-weight: 400; font-size: 11.5px; margin-top: 4px; }
.mb-postit { background: #FFE9A6; padding: 12px 14px; border-radius: 4px;
  font-size: 12.5px; color: var(--ink); line-height: 1.55; margin-bottom: 18px;
  transform: rotate(-1.5deg); box-shadow: 2px 3px 0 rgba(58,40,18,0.08);
  text-align: left; font-weight: 500; word-break: keep-all;
}
.mb-postit b { color: var(--ink); font-weight: 800; }
.mb-btn-ghost { background: transparent; border: none; color: var(--ink-mute); font-size: 12px;
  text-decoration: underline; cursor: pointer; padding: 6px 12px; font-family: inherit; }
.mb-btn-ghost:hover { color: var(--ink-soft); }
</style>

<!-- 모바일 차단 팝업, "어허! 업무를 모바일로요?" -->
<div id="mobile-block" class="mobile-block">
  <div class="mb-card">
    <div class="mb-stamp">어허-!</div>
    <h2>업무를 누가 모바일로 하나요?</h2>
    <p class="mb-lead">
      여긴 <b>외국계 회사 입사 시뮬레이터</b>예요.<br/>
      회의실 책상에서 메일 쓰고 미팅 들어가야 하는데… <b>그걸 폰으로요? 🤔</b>
    </p>
    <div class="mb-postit">
      💼 <b>PC / 노트북 브라우저</b>로 다시 접속 추천이요.<br/>
      <small>화면 좀 큰 데서 봐야 사무실 분위기 나요. 출근 도장도, 사수 포스트잇도, 슬랙 메시지도.</small>
    </div>
    <button id="mb-continue" class="mb-btn-ghost">그래도 모바일에서 볼래요 →</button>
  </div>
</div>

<script>
  // 모바일 폭이면 body lock + 팝업 노출 (CSS가 처리, 여기선 스크롤만 잠금)
  (function() {
    function syncLock() {
      const blockEl = document.getElementById('mobile-block');
      if (!blockEl) return;
      const isNarrow = window.matchMedia('(max-width: 768px)').matches;
      const dismissed = blockEl.classList.contains('dismissed');
      if (isNarrow && !dismissed) document.body.classList.add('mb-locked');
      else document.body.classList.remove('mb-locked');
    }
    window.addEventListener('resize', syncLock);
    syncLock();
    document.getElementById('mb-continue')?.addEventListener('click', () => {
      document.getElementById('mobile-block').classList.add('dismissed');
      syncLock();
    });
  })();
</script>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo } = React;

// ============================================================
// 데이터 풀: 부서, 사수 NPC, 입사 동기 NPC
// ============================================================
const DEPARTMENTS = [
  { id: "growth", name: "Growth & Marketing", short: "마케팅" },
  { id: "ops", name: "Business Operations", short: "운영" },
  { id: "biz", name: "Business Development", short: "BD" },
  { id: "product", name: "Product", short: "프로덕트" },
  { id: "people", name: "People & Culture", short: "P&C (인사)" },
];

const MENTORS = [
  { id: "kim", name: "김주연 대리", role: "Senior Associate", trait: "차분하고 꼼꼼함. 메일 문장을 빨갛게 봐줌." },
  { id: "park", name: "박지훈 과장", role: "Manager", trait: "츤데레. 무뚝뚝한데 신입 챙김 1등." },
  { id: "lee", name: "이서윤 대리", role: "Senior Associate", trait: "외국계 7년차. 영어 미팅 살아남는 법 알려줌." },
  { id: "jung", name: "정민호 과장", role: "Manager", trait: "커피 사주는 게 취미. 대신 회식 조율은 너 시킴." },
];

const COWORKERS = [
  { id: "co1", name: "한도윤", role: "동기 입사자 / Marketing", note: "너랑 같은 날 들어왔어." },
  { id: "co2", name: "임재희", role: "동기 입사자 / Product", note: "유학파. 영어 잘함. 부럽지." },
];

// Dev 모드 코드, 모듈 최상위에 둬야 ApplicationScreen에서도 접근 가능
// dev      : Day 점프 패널 (?dev=1) 표시 여부
// operator : 운영자 뷰 / 모든 사용자 데이터 권한 여부
const DEV_CODES = {
  "DEV-TEST":  { dev: true,  cohort: null,             operator: false, label: "기본 베타테스터" },
  "DEV-2026":  { dev: true,  cohort: "season-2026-1",  operator: false, label: "1기 시즌 베타" },
  "DEV-OPS":   { dev: true,  cohort: "team",           operator: true,  label: "운영팀 (Crew)" },
  "DEV-BUDDY": { dev: true,  cohort: null,             operator: true,  label: "운영자 (유버디)" },
};

// 내부 테스터 코드: 일반 유저처럼 보이되 Latpeed 결제 없이 입장.
// dev 패널 X, 베타 만료 X, 통계 분리(isTester), cohort='staff'라 Latpeed 동기화가 안 건드림.
const STAFF_CODES = {
  "VIP-001": { cohort: "staff", label: "내부 테스터" },
};

// ============================================================
// 유틸, 사번 / 입사일 / 추정값 생성
// ============================================================
function generateEmpNumber(date, seed) {
  const yyyymmdd = date.toISOString().slice(0,10).replace(/-/g, "");
  const last4 = String(1000 + (seed % 9000)).padStart(4, "0");
  return `${yyyymmdd}-${last4}`;
}
function pickRandom(arr, seed) { return arr[seed % arr.length]; }
function hashString(s) { let h = 0; for (let i = 0; i < s.length; i++) { h = ((h << 5) - h) + s.charCodeAt(i); h |= 0; } return Math.abs(h); }

// 새 계정 가입/로그인 시 이전 계정의 브라우저 단위 잔여 데이터 정리
// (오늘의 태스크 체크, 투어 완료, 공지 읽음, 주말 이벤트 등, 계정과 분리되어 누수되던 값들)
function clearStaleLocalData() {
  try {
    const PREFIXES = ["__OD_TASKS_", "__OD_TOUR_", "__OD_NOTICE_READS_", "__OD_WEEKEND_"];
    for (let i = localStorage.length - 1; i >= 0; i--) {
      const k = localStorage.key(i);
      if (!k) continue;
      if (k === "__OD_USER" || PREFIXES.some(p => k.startsWith(p))) {
        localStorage.removeItem(k);
      }
    }
  } catch (e) { console.warn("clearStaleLocalData 실패:", e); }
}

// ============================================================
// 메인 앱, 단계 머신
// ============================================================
function OnboardingApp() {
  const [stage, setStage] = useState("welcome"); // welcome → application → reviewing → offer → assignment → ceo → ready

  // URL ?code=PILOT-XXXX 자동 인식 + localStorage __OD_INVITES 매칭
  const urlCode = useMemo(() => {
    try { return new URLSearchParams(location.search).get('code') || ""; } catch(e) { return ""; }
  }, []);
  const [inviteCode, setInviteCode] = useState(urlCode.toUpperCase());

  // 입사 지원 가능 여부, 유효한 PILOT-XXXX 코드가 URL/state에 있어야만 진행 가능
  // 운영자(DEV-OPS/DEV-BUDDY)는 operator.html로 직접 접근하므로 이 흐름과 무관
  const hasValidInvite = useMemo(() => /^PILOT-[A-Z0-9]{4}$/.test(inviteCode || ""), [inviteCode]);

  // 같은 기기에 운영자가 발급한 코드 있으면 이름 자동 채움
  const matchedInvite = useMemo(() => {
    if (!inviteCode || !/^PILOT-[A-Z0-9]{4}$/.test(inviteCode)) return null;
    try {
      const list = JSON.parse(localStorage.getItem('__OD_INVITES') || '[]');
      return list.find(i => i.code === inviteCode) || null;
    } catch(e) { return null; }
  }, [inviteCode]);

  const [name, setName] = useState(matchedInvite ? matchedInvite.name : "");
  const [email, setEmail] = useState("");
  const [motivation, setMotivation] = useState("");
  const [signupPw, setSignupPw] = useState("");  // 가입 시 비밀번호 (선택)

  // 코드 검증, 지원서 제출 시 서버에서 pilot_codes 화이트리스트 대조
  const [submitting, setSubmitting] = useState(false);
  const [submitError, setSubmitError] = useState("");
  // 검증 통과한 코드 정보, finishOnboarding에서 cohort 저장 + used_count 증가에 사용
  const [verifiedCode, setVerifiedCode] = useState(null);
  const [verifiedCohort, setVerifiedCohort] = useState(null);

  const handleApplicationSubmit = async () => {
    if (submitting) return;
    setSubmitError("");
    setSubmitting(true);
    try {
      const code = (inviteCode || "").trim().toUpperCase();
      if (!code) {
        setSubmitError("초대 코드를 입력해주세요.");
        setSubmitting(false);
        return;
      }
      if (window.OD && window.OD.enabled) {
        // 1) 코드 검증 (내부 테스터 코드는 pilot_codes 서버 검증 생략)
        const _isStaffCode = !!STAFF_CODES[code];
        let _cohort = null;
        if (!_isStaffCode) {
          const result = await window.OD.checkInviteCode(code);
          if (!result || !result.valid) {
            // 만료/소진/잘못된 코드 구분해서 안내
            let msg = "유효하지 않은 초대 코드예요. 다시 확인해주세요.";
            if (result && result.reason === 'expired') {
              msg = "이 코드는 사용 기간이 끝났어요. 베타가 종료됐거나 코드가 만료된 거예요. 운영자에게 문의해주세요.";
            } else if (result && result.reason === 'exhausted') {
              msg = "이 코드는 사용 가능 횟수를 모두 채웠어요. 운영자에게 문의해주세요.";
            }
            setSubmitError(msg);
            setSubmitting(false);
            return;
          }
          _cohort = result.cohort || null;
        } else {
          _cohort = STAFF_CODES[code].cohort || 'staff';
        }
        // 2) ★ 중복 가입 가드, RLS 우회 emailExists RPC 사용 (anon 권한에서도 작동)
        const emailTrimmed = (email || "").trim().toLowerCase();
        const existing = await window.OD.emailExists(emailTrimmed);
        if (existing && existing.ok && existing.exists) {
          setSubmitError("이미 가입된 이메일이에요. 처음 화면에서 \"다시 출근하기\"로 진입해주세요.");
          setSubmitting(false);
          return;
        }
        // 검증 정보 저장, finishOnboarding에서 사용
        setVerifiedCode(code);
        setVerifiedCohort(_cohort);
        // 이메일 인증 코드 발송 → verify 단계로 (진짜 메일인지 확인 + 비번 저장)
        const sendRes = await window.OD.sendMagicLink(emailTrimmed);
        if (!sendRes || !sendRes.ok) {
          const msg = String(sendRes && sendRes.error || "");
          const m = msg.match(/after\s+(\d+)\s+seconds/i);
          setSubmitError(m
            ? ("잠시 후 다시 시도해주세요 (" + m[1] + "초). 이미 보낸 메일이 곧 도착해요.")
            : ("인증 코드 발송에 실패했어요: " + (sendRes && sendRes.error || "잠시 후 다시")));
          setSubmitting(false);
          return;
        }
        setSubmitting(false);
        setStage("verify");
        return;
      }
      // 서버 비활성(로컬 전용 dev) 폴백: 인증 없이 진행
      setStage("reviewing");
    } catch (e) {
      setSubmitError("코드 확인에 실패했어요. 잠시 후 다시 시도해주세요.");
      setSubmitting(false);
    }
  };

  // Dev 모드 (테스터 전용), DEV-XXXX 코드 입력하면 시뮬레이터 ?dev=1로 자동 진입
  const [devMode, setDevMode] = useState(false);
  const [devCode, setDevCode] = useState("");
  const matchedDevCode = devMode ? DEV_CODES[devCode.toUpperCase()] : null;
  const isDevValid = !!matchedDevCode;

  // matchedInvite 바뀌면 이름 자동 갱신
  useEffect(() => {
    if (matchedInvite && !name) setName(matchedInvite.name);
  }, [matchedInvite]);

  const seed = useMemo(() => hashString(email + name) || Date.now(), [email, name]);
  const today = useMemo(() => new Date(), []);
  const empNumber = useMemo(() => generateEmpNumber(today, seed), [seed, today]);
  const dept = useMemo(() => pickRandom(DEPARTMENTS, seed), [seed]);
  const mentor = useMemo(() => pickRandom(MENTORS, seed >> 3), [seed]);

  const stageOrder = ["welcome", "application", "verify", "reviewing", "offer", "assignment", "ceo", "ready"];
  const stageIdx = stageOrder.indexOf(stage);

  // reviewing → offer 자동 전환 (3초)
  useEffect(() => {
    if (stage === "reviewing") {
      const t = setTimeout(() => setStage("offer"), 2800);
      return () => clearTimeout(t);
    }
  }, [stage]);

  const finishOnboarding = async () => {
    const profile = {
      // identity
      email: email.trim().toLowerCase(),  // ★ 항상 소문자로 저장 (대소문자 가입 불일치 방지)
      name: name.trim(),
      signupDate: new Date().toISOString(),
      // 법적 동의 기록 (PIPA 의무) - 가입 시점에 약관·개인정보·만 14세 모두 체크됨
      agreedAt: new Date().toISOString(),
      // 가입 단계에서 코드 검증 통과한 사용자는 unlock 마킹 (mainboard 직행)
      unlocked: true,
      // fictional identity
      empNumber,
      department: dept,
      mentor,
      coworkers: COWORKERS,
      // progression
      level: { id: "probation", ko: "수습", en: "Probation" },
      dayInCompany: 1,
      // metrics scaffold (학습 과학 측정용)
      productionAttempts: { correct: 0, total: 0 },
      noveltyEvents: [],
      scenariosCompleted: [],
      wordsStudied: [],
      lastActive: new Date().toISOString(),
      totalSessions: 1,
      totalSessionMs: 0,
      // settings
      preferences: { notifications: true, timezone: "Asia/Seoul" },
      // 운영 메타
      onboardingMotivation: motivation.trim(),
      schemaVersion: 1,
      // 시범 입사자 마킹 (코드 있으면)
      inviteCode: inviteCode || null,
      referredBy: matchedInvite ? "유버디" : (inviteCode ? "유버디" : null),
      isPilotHire: !!inviteCode,
      // Dev 모드 마킹 + 코드별 권한 적용
      // 테스터(DEV-TEST/2026)는 dev:false라 isDevMode도 false → 일반 사용자 흐름
      isDevMode: !!(matchedDevCode && matchedDevCode.dev),
      devCode: isDevValid ? devCode.toUpperCase() : null,
      // cohort: DEV 코드 우선, 그 다음 PILOT 코드 검증 결과의 cohort
      cohort: (matchedDevCode && matchedDevCode.cohort) || verifiedCohort || null,
      isOperator: !!(matchedDevCode && matchedDevCode.operator),
      // 테스터 마킹 (운영자 뷰 통계에서 분리하기 위함)
      isTester: !!(matchedDevCode && !matchedDevCode.operator),
    };
    // 내부 테스터 코드: 일반 유저처럼(dev 패널 X) 입장하되, 베타 만료 X + Latpeed 미간섭.
    if (STAFF_CODES[(inviteCode || "").trim().toUpperCase()]) {
      profile.isPilotHire = false;   // 베타 만료(_isPilot) 대상에서 제외 → 안 튕김
      profile.isTester = true;        // 통계 분리 (UI엔 영향 없음, dev 패널과 무관)
      profile.isDevMode = false;      // dev 패널 안 뜸
      profile.isOperator = false;
      profile.cohort = 'staff';       // Latpeed 동기화는 'member'만 건드려서 안전
    }
    // ★ Supabase 동기화 먼저, 실패 시 가입 전체 차단 (silent fail 방지)
    if (window.OD && window.OD.enabled) {
      try {
        const result = await window.OD.signup(profile);
        if (result && result.duplicate) {
          alert("이미 가입된 이메일이에요. 처음 화면에서 \"다시 출근하기\"로 진입해주세요.");
          window.location.href = "onboarding.html";
          return;
        }
        if (!result || !result.ok) {
          // ★ 서버 저장 실패 → 가입 진행 금지 (localStorage 진입 차단)
          console.error("[Supabase] 가입 동기화 실패:", result?.error);
          alert("가입 저장에 실패했어요. 잠시 후 다시 시도해주세요.\n\n오류: " + (result?.error || "알 수 없음"));
          return;  // localStorage 도 안 건드림
        }
        console.log("[Supabase] 가입 동기화 완료");
        if (verifiedCode && window.OD.incrementCodeUsage) {
          try { await window.OD.incrementCodeUsage(verifiedCode); } catch (_) {}
        }
        // 비밀번호는 verify 단계(SignupVerifyScreen)에서 이미 저장됨 (이메일 인증 세션으로).
      } catch (err) {
        console.error("[Supabase] 가입 동기화 예외:", err);
        alert("가입 중 네트워크 오류가 발생했어요. 새로고침 후 다시 시도해주세요.");
        return;
      }
    }

    // 서버 저장 성공한 뒤에야 localStorage + 이동
    try {
      clearStaleLocalData();
      localStorage.setItem("__OD_USER", JSON.stringify(profile));
      if (matchedInvite) {
        const list = JSON.parse(localStorage.getItem('__OD_INVITES') || '[]');
        const updated = list.map(i => i.code === matchedInvite.code
          ? { ...i, usedAt: new Date().toISOString(), usedBy: email.trim().toLowerCase(), currentDay: 1, lastActive: new Date().toISOString() }
          : i);
        localStorage.setItem('__OD_INVITES', JSON.stringify(updated));
      }
    } catch (e) { console.warn("localStorage 저장 실패 (사파리 프라이빗 모드?)", e); }

    // 가입 후 이동, 코드 검증을 이미 ApplicationScreen에서 통과했으므로 바로 사옥으로
    // - DEV-BUDDY / DEV-OPS (운영자) → operator.html 직행
    // - DEV-TEST / DEV-2026 (테스터) → mainboard.html?dev=1
    // - 일반 사용자 (unlocked) → mainboard.html 직행
    if (matchedDevCode && matchedDevCode.operator) {
      window.location.href = "operator.html";
    } else if (matchedDevCode && matchedDevCode.dev) {
      window.location.href = "mainboard.html?dev=1";
    } else {
      window.location.href = "mainboard.html";
    }
  };

  return (
    <div className="stage">
      {stage === "welcome" && (
        <WelcomeScreen onNext={() => setStage("application")} />
      )}
      {stage === "application" && (
        <ApplicationScreen
          name={name} setName={setName}
          email={email} setEmail={setEmail}
          signupPw={signupPw} setSignupPw={setSignupPw}
          motivation={motivation} setMotivation={setMotivation}
          inviteCode={inviteCode} setInviteCode={setInviteCode}
          devMode={devMode} setDevMode={setDevMode}
          devCode={devCode} setDevCode={setDevCode}
          isDevValid={isDevValid}
          submitting={submitting} submitError={submitError}
          stageIdx={stageIdx} totalStages={stageOrder.length}
          onSubmit={handleApplicationSubmit}
          onBack={() => setStage("welcome")}
        />
      )}
      {stage === "verify" && (
        <SignupVerifyScreen
          email={email} password={signupPw}
          stageIdx={stageIdx} totalStages={stageOrder.length}
          onVerified={() => setStage("reviewing")}
          onBack={() => setStage("application")}
        />
      )}
      {stage === "reviewing" && <ReviewingScreen name={name} stageIdx={stageIdx} totalStages={stageOrder.length} />}
      {stage === "offer" && (
        <OfferScreen name={name} dept={dept} empNumber={empNumber} stageIdx={stageIdx} totalStages={stageOrder.length}
          onNext={() => setStage("assignment")} />
      )}
      {stage === "assignment" && (
        <AssignmentScreen empNumber={empNumber} dept={dept} mentor={mentor} stageIdx={stageIdx} totalStages={stageOrder.length}
          onNext={() => setStage("ceo")} />
      )}
      {stage === "ceo" && (
        <CEOScreen name={name} dept={dept} stageIdx={stageIdx} totalStages={stageOrder.length}
          onNext={() => setStage("ready")} />
      )}
      {stage === "ready" && (
        <ReadyScreen name={name} mentor={mentor} stageIdx={stageIdx} totalStages={stageOrder.length}
          onStart={finishOnboarding} />
      )}
    </div>
  );
}

function StepBar({ idx, total }) {
  return (
    <div className="steps">
      {Array.from({ length: total }).map((_, i) => (
        <div key={i} className={"step-pip " + (i <= idx ? "done" : "")} />
      ))}
    </div>
  );
}

        · <strong>유버디 컴퍼니 TIP</strong>: 회장님을 아직 뵌 사람이 없대요 (알려진 건, 임원으로 승진하면 볼 기회가 있다는 것 정도..?)
        <br/><br/>
        지원서 제출 시 사번이 즉시 부여되고, 오늘부터 출근 가능합니다.
      </p>

      <div className="btn-row" style={{ flexDirection: "column", alignItems: "stretch", gap: 10, marginTop: 18 }}>
        <button className="btn" onClick={onNext} style={{ justifyContent: "center" }}>
          지원서 작성하기
        </button>
        <a
          className="btn btn-ghost"
          href="waitlist.html"
          style={{ textDecoration: "none", textAlign: "center", justifyContent: "center" }}
        >
          ✉️ 대기 등록하기 →
        </a>
      </div>

      <div style={{ marginTop: 18, paddingTop: 14, borderTop: "1px dashed var(--line)", textAlign: "center" }}>
        <a
          onClick={() => setShowLogin(true)}
          style={{ fontSize: 13, color: "var(--ink-soft)", cursor: "pointer", textDecoration: "underline" }}
        >
          이미 입사하셨어요? <strong>다시 출근하기 →</strong>
        </a>
      </div>

      <div className="fine-print" style={{ marginTop: 12 }}>
        초대 안 받으셨으면 대기 등록 추천 · 정식 출시 시 우선 안내
      </div>
    </div>
    </>
  );
}

// ============================================================
// 0b. Login, 다른 기기에서 다시 출근
// ============================================================
function LoginScreen({ onBack }) {
  // step: 'email' (이메일/비번 입력) → 'code' (6자리 코드) → 'setpw' (비번 설정)
  // 비밀번호가 있으면 email 화면에서 바로 로그인. 비번 잊으면 코드 인증 후 setpw로 재설정.
  const [step, setStep] = useState("email");
  const [email, setEmail] = useState("");
  const [code, setCode] = useState("");
  const [pw, setPw] = useState("");            // 비밀번호 (로그인 또는 설정)
  const [pw2, setPw2] = useState("");          // 비밀번호 확인 (설정 시)
  const [pwIntent, setPwIntent] = useState(false);  // true면 코드 인증 후 비번 설정 화면으로
  const [error, setError] = useState("");
  const [loading, setLoading] = useState(false);

  // ★ rate limit cooldown (60초)
  const [cooldownUntil, setCooldownUntil] = useState(() => {
    try {
      const v = parseInt(localStorage.getItem("__OD_MAGIC_COOLDOWN") || "0", 10);
      return v > Date.now() ? v : 0;
    } catch (e) { return 0; }
  });
  const [now, setNow] = useState(Date.now());
  React.useEffect(() => {
    if (!cooldownUntil) return;
    const t = setInterval(() => setNow(Date.now()), 500);
    return () => clearInterval(t);
  }, [cooldownUntil]);
  const cooldownLeft = Math.max(0, Math.ceil((cooldownUntil - now) / 1000));

  // 코드 input ref (자동 포커스용)
  const codeInputRef = React.useRef(null);

  // === 인증 성공(코드/비번) 후 공통: DB 사용자 → __OD_USER 채우고 mainboard 이동 ===
  const finishLogin = async (emailLower) => {
    try {
      if (window.OD?.fetchByEmail) {
        const userRes = await window.OD.fetchByEmail(emailLower);
        if (userRes.ok && userRes.user) {
          const u = userRes.user;
          let existing = {};
          try { existing = JSON.parse(localStorage.getItem("__OD_USER") || "{}") || {}; } catch (e) {}
          const merged = {
            ...existing,
            email: u.email,
            name: u.name || existing.name,
            empNumber: u.emp_number || existing.empNumber,
            department: u.department || existing.department,
            mentor: u.mentor || existing.mentor,
            level: u.level || existing.level,
            signupDate: u.signup_date || existing.signupDate,
            signup_date: u.signup_date,
            agreedAt: u.agreed_at || existing.agreedAt,
            dayInCompany: u.day_in_company || existing.dayInCompany || 1,
            cohort: u.cohort,
            unlocked: !!u.unlocked,
            isOperator: !!u.is_operator,
            isDevMode: !!u.is_dev_mode,
            isPilotHire: !!u.is_pilot_hire,
            isTester: !!u.is_tester,
            membership_ends_at: u.membership_ends_at,
            membershipEndsAt: u.membership_ends_at,
            membership_cancel_reason: u.membership_cancel_reason,
            membershipCancelReason: u.membership_cancel_reason,
            lastActive: new Date().toISOString(),
            scenariosCompleted: existing.scenariosCompleted || [],
            savedNotes: existing.savedNotes || {},
            dailyJournals: existing.dailyJournals || {},
            wordsStudied: existing.wordsStudied || [],
          };
          localStorage.setItem("__OD_USER", JSON.stringify(merged));
        } else {
          return { ok: false, error: "가입 기록을 찾을 수 없어요. 운영자에게 문의해주세요." };
        }
      }
    } catch (e) {
      console.warn("[login] finishLogin populate 실패:", e);
    }
    window.location.href = "mainboard.html";
    return { ok: true };
  };

  // === 비밀번호로 로그인 ===
  const handlePasswordLogin = async () => {
    const emailLower = email.trim().toLowerCase();
    if (!emailLower || !/\S+@\S+\.\S+/.test(emailLower)) { setError("이메일을 정확히 입력해주세요."); return; }
    if (!pw) { setError("비밀번호를 입력해주세요."); return; }
    if (!window.OD?.signInWithPassword) { setError("서버 연결이 필요해요. 운영자에게 문의해주세요."); return; }
    setLoading(true); setError("");
    const res = await window.OD.signInWithPassword(emailLower, pw);
    if (!res.ok) { setLoading(false); setError(res.error || "로그인 실패"); return; }
    const fin = await finishLogin(emailLower);
    if (!fin.ok) { setLoading(false); setError(fin.error); }
  };

  // === 비밀번호 설정/변경/찾기 시작: 코드 발송 후 setpw 화면으로 유도 ===
  const startPasswordSetup = async () => {
    setPwIntent(true);
    setPw(""); setPw2("");
    await handleSendCode();  // 코드 발송 → step 'code'. 인증되면 pwIntent라서 setpw로.
  };

  // === 비밀번호 저장 (코드 인증으로 세션 만든 직후) ===
  const handleSetPassword = async () => {
    if (!pw || pw.length < 8) { setError("비밀번호는 8자 이상으로 정해주세요."); return; }
    if (pw !== pw2) { setError("두 비밀번호가 일치하지 않아요."); return; }
    if (!window.OD?.setPassword) { setError("서버 연결이 필요해요."); return; }
    setLoading(true); setError("");
    const res = await window.OD.setPassword(pw);
    if (!res.ok) { setLoading(false); setError(res.error || "비밀번호 설정 실패"); return; }
    const emailLower = email.trim().toLowerCase();
    const fin = await finishLogin(emailLower);
    if (!fin.ok) { setLoading(false); setError(fin.error); }
  };

  // === STEP 1: 이메일 입력 → 코드 발송 ===
  const handleSendCode = async () => {
    const trimmed = email.trim().toLowerCase();
    if (!trimmed || !/\S+@\S+\.\S+/.test(trimmed)) {
      setError("이메일을 정확히 입력해주세요.");
      return;
    }

    if (!window.OD || !window.OD.enabled) {
      setError("서버 연결이 필요한 기능입니다. 운영자에게 문의해주세요.");
      return;
    }

    if (cooldownLeft > 0) {
      setError(cooldownLeft + "초 후 다시 시도해주세요.");
      return;
    }

    setLoading(true);
    setError("");

    // 가입 기록 확인 (코드 발송 전)
    const check = await window.OD.emailExists(trimmed);
    if (!check.ok) {
      setLoading(false);
      setError("연결 실패. 잠시 후 다시 시도해주세요.");
      return;
    }
    if (!check.exists) {
      setLoading(false);
      setError("가입 기록이 없어요. 처음이신 분은 지원서 작성하기로 이동해주세요.");
      return;
    }

    // 코드 발송 (Supabase signInWithOtp가 매직링크 + 6자리 토큰 둘 다 보냄. 템플릿에서 토큰만 노출.)
    const result = await window.OD.sendMagicLink(trimmed);
    setLoading(false);

    if (!result.ok) {
      const msg = String(result.error || "");
      const m = msg.match(/after\s+(\d+)\s+seconds/i);
      if (m) {
        const secs = parseInt(m[1], 10);
        const until = Date.now() + secs * 1000;
        setCooldownUntil(until);
        try { localStorage.setItem("__OD_MAGIC_COOLDOWN", String(until)); } catch (e) {}
        setError("아직 " + secs + "초 더 기다려주세요. 이미 보낸 메일이 곧 도착할 거예요.");
      } else {
        setError("코드 발송 실패: " + (result.error || "잠시 후 다시"));
      }
      return;
    }

    // 발송 성공, 60초 cooldown + 코드 입력 화면으로 이동
    const until = Date.now() + 60 * 1000;
    setCooldownUntil(until);
    try { localStorage.setItem("__OD_MAGIC_COOLDOWN", String(until)); } catch (e) {}
    setStep("code");
    setCode("");
    // 코드 입력 칸에 자동 포커스
    setTimeout(() => { try { codeInputRef.current?.focus(); } catch (e) {} }, 100);
  };

  // === STEP 2: 코드 검증 → 세션 생성 → mainboard 이동 ===
  const handleVerifyCode = async (codeOverride) => {
    const codeToVerify = (codeOverride || code).replace(/\D/g, "").trim();
    if (codeToVerify.length !== 6) {
      setError("6자리 숫자 코드를 입력해주세요.");
      return;
    }

    if (!window.OD?.verifyOtpCode) {
      setError("서버 연결 필요. 운영자에게 문의해주세요.");
      return;
    }

    setLoading(true);
    setError("");

    const emailLower = email.trim().toLowerCase();
    const result = await window.OD.verifyOtpCode(emailLower, codeToVerify);

    if (!result.ok) {
      setLoading(false);
      setError(result.error || "코드 확인 실패. 다시 시도해주세요.");
      setCode("");
      setTimeout(() => { try { codeInputRef.current?.focus(); } catch (e) {} }, 50);
      return;
    }

    // 코드 인증 성공. 비밀번호 설정/찾기 흐름이면 비번 정하는 화면으로 (세션은 이미 생김).
    if (pwIntent) {
      setLoading(false);
      setStep("setpw");
      setCode("");
      setError("");
      return;
    }

    // 일반 로그인: DB 사용자 채우고 mainboard 이동 (finishLogin 안에서 redirect).
    const fin = await finishLogin(emailLower);
    if (!fin.ok) {
      setLoading(false);
      setError(fin.error);
      setCode("");
      return;
    }
  };

  // 코드 입력 변화 처리 (숫자만 + 6자리 자동 제출)
  const onCodeChange = (e) => {
    const v = e.target.value.replace(/\D/g, "").slice(0, 6);
    setCode(v);
    if (v.length === 6 && !loading) {
      handleVerifyCode(v);
    }
  };

  // === STEP 2 화면: 코드 입력 ===
  if (step === "code") {
    return (
      <div className="card">
        <div className="eyebrow">YOUBUDDY KOREA · 출근 코드 입력</div>
        <h1>✉️ 메일로 코드를<br/><em>보내드렸어요</em></h1>
        <p className="lead">
          <strong>{email}</strong> 메일함을 확인하고 6자리 숫자 코드를 입력해주세요.<br/>
          <strong>어느 기기에서든 OK!</strong> 모바일에서 코드 받고 PC에서 입력하셔도 됩니다.
        </p>

        <div className="form-row" style={{ marginTop: 18 }}>
          <label>출근 코드 (6자리 숫자)</label>
          <input
            ref={codeInputRef}
            type="text"
            inputMode="numeric"
            autoComplete="one-time-code"
            value={code}
            onChange={onCodeChange}
            placeholder="123456"
            maxLength={6}
            autoFocus
            onKeyDown={e => e.key === "Enter" && code.length === 6 && !loading && handleVerifyCode()}
            style={{
              fontSize: 28,
              letterSpacing: 10,
              textAlign: "center",
              fontFamily: "JetBrains Mono, monospace",
              fontWeight: 800,
              padding: "16px 12px",
            }}
          />
        </div>

        {error && (
          <div style={{ fontSize: 12, color: "#B8431A", marginTop: -4, marginBottom: 10, fontWeight: 600 }}>
            ⚠ {error}
          </div>
        )}

        <div className="btn-row" style={{ flexDirection: "column", alignItems: "stretch", gap: 10, marginTop: 8 }}>
          <button
            className="btn"
            onClick={() => handleVerifyCode()}
            disabled={loading || code.length !== 6}
            style={{ justifyContent: "center" }}
          >
            {loading ? "확인 중..." : pwIntent ? "✓ 코드 확인 후 비밀번호 설정" : "✓ 코드 확인 후 출근"}
          </button>

          <div style={{ background: "var(--paper-warm)", border: "1px dashed var(--line)", padding: "12px 14px", borderRadius: 6, fontSize: 12.5, color: "var(--ink-soft)", lineHeight: 1.7 }}>
            💡 메일이 안 보이시면:<br/>
            · <strong>스팸함</strong>도 확인해보세요<br/>
            · 코드는 1시간 동안 유효해요<br/>
            · 6자리 모두 입력하면 자동으로 확인됩니다
          </div>

          <div className="btn-row" style={{ gap: 8 }}>
            <button
              className="btn btn-ghost"
              onClick={() => { setStep("email"); setCode(""); setError(""); setPwIntent(false); }}
              style={{ flex: 1, justifyContent: "center", fontSize: 13 }}
            >
              ← 이메일 다시 입력
            </button>
            <button
              className="btn btn-ghost"
              onClick={handleSendCode}
              disabled={cooldownLeft > 0 || loading}
              style={{ flex: 1, justifyContent: "center", fontSize: 13 }}
            >
              {cooldownLeft > 0 ? `재발송 (${cooldownLeft}초)` : "코드 재발송"}
            </button>
          </div>

          <a onClick={onBack} style={{ fontSize: 13, color: "var(--ink-soft)", cursor: "pointer", textAlign: "center", padding: "8px 0" }}>
            ← 처음 화면으로
          </a>
        </div>
      </div>
    );
  }

  // === STEP 3 화면: 비밀번호 설정 (코드 인증 후) ===
  if (step === "setpw") {
    return (
      <div className="card">
        <div className="eyebrow">YOUBUDDY KOREA · 비밀번호 설정</div>
        <h1>🔑 비밀번호를<br/><em>정해주세요</em></h1>
        <p className="lead">
          <strong>{email}</strong> 인증 완료!<br/>
          이제 비밀번호를 정하면 다음부턴 코드 안 기다리고 바로 로그인할 수 있어요.
        </p>

        <div className="form-row" style={{ marginTop: 18 }}>
          <label>새 비밀번호 (8자 이상)</label>
          <input
            type="password"
            value={pw}
            onChange={e => setPw(e.target.value)}
            placeholder="비밀번호 입력"
            autoComplete="new-password"
            autoFocus
          />
        </div>
        <div className="form-row">
          <label>비밀번호 확인</label>
          <input
            type="password"
            value={pw2}
            onChange={e => setPw2(e.target.value)}
            placeholder="한 번 더 입력"
            autoComplete="new-password"
            onKeyDown={e => e.key === "Enter" && !loading && handleSetPassword()}
          />
        </div>

        {error && (
          <div style={{ fontSize: 12, color: "#B8431A", marginTop: -4, marginBottom: 10, fontWeight: 600 }}>
            ⚠ {error}
          </div>
        )}

        <div className="btn-row" style={{ flexDirection: "column", alignItems: "stretch", gap: 10, marginTop: 8 }}>
          <button
            className="btn"
            onClick={handleSetPassword}
            disabled={loading || !pw || !pw2}
            style={{ justifyContent: "center" }}
          >
            {loading ? "저장 중..." : "✓ 비밀번호 저장하고 출근"}
          </button>
          <div style={{ background: "var(--paper-warm)", border: "1px dashed var(--line)", padding: "12px 14px", borderRadius: 6, fontSize: 12.5, color: "var(--ink-soft)", lineHeight: 1.7 }}>
            💡 비밀번호를 잊어도 괜찮아요. 언제든 <strong>이메일 코드</strong>로 로그인해서 다시 정할 수 있어요.
          </div>
        </div>
      </div>
    );
  }

  // === STEP 1 화면: 이메일 + 비밀번호 입력 ===
  return (
    <div className="card">
      <div className="eyebrow">YOUBUDDY KOREA · 로그인</div>
      <h1>다시 만나서 반가워요.<br/><em>출근하시죠.</em></h1>
      <p className="lead">
        가입 이메일로 들어가시면 진도가 그대로 이어져요.<br/>
        <strong>비밀번호를 정해두면 다음부턴 바로 로그인</strong>할 수 있어요.
      </p>

      <div className="form-row" style={{ marginTop: 18 }}>
        <label>가입 이메일</label>
        <input
          type="email"
          value={email}
          onChange={e => setEmail(e.target.value)}
          placeholder="you@example.com"
          autoComplete="username"
          autoFocus
          onKeyDown={e => e.key === "Enter" && !loading && (pw ? handlePasswordLogin() : handleSendCode())}
        />
      </div>

      <div className="form-row">
        <label>비밀번호 <span style={{ fontSize: 11, fontWeight: 500, color: "var(--ink-mute)", letterSpacing: 0 }}>· 없으면 비워두세요 (이메일 인증 후 비밀번호 설정으로 넘어가요)</span></label>
        <input
          type="password"
          value={pw}
          onChange={e => setPw(e.target.value)}
          placeholder="비밀번호"
          autoComplete="current-password"
          onKeyDown={e => e.key === "Enter" && !loading && (pw ? handlePasswordLogin() : handleSendCode())}
        />
      </div>

      {error && (
        <div style={{ fontSize: 12, color: "#B8431A", marginTop: -4, marginBottom: 10, fontWeight: 600 }}>
          ⚠ {error}
        </div>
      )}

      <div className="btn-row" style={{ flexDirection: "column", alignItems: "stretch", gap: 10, marginTop: 8 }}>
        {pw ? (
          <button
            className="btn"
            onClick={handlePasswordLogin}
            disabled={loading || !email.trim()}
            style={{ justifyContent: "center" }}
          >
            {loading ? "로그인 중..." : "🔓 비밀번호로 로그인"}
          </button>
        ) : (
          <button
            className="btn"
            onClick={() => { setPwIntent(true); handleSendCode(); }}
            disabled={loading || !email.trim() || cooldownLeft > 0}
            style={{ justifyContent: "center" }}
          >
            {loading ? "코드 발송 중..."
              : cooldownLeft > 0 ? "잠시만요... " + cooldownLeft + "초"
              : "✉️ 이메일 코드 받기"}
          </button>
        )}
        {cooldownLeft > 0 && (
          <div style={{ fontSize: 12, color: "var(--ink-soft)", textAlign: "center", lineHeight: 1.5 }}>
            메일이 곧 도착해요. 받은편지함과 <strong>스팸함</strong>을 확인해주세요.<br/>
            연속 클릭하시면 차단 시간이 늘어나니 잠시만 기다려주세요.
          </div>
        )}
        <a
          onClick={onBack}
          style={{ fontSize: 13, color: "var(--ink-soft)", cursor: "pointer", textAlign: "center", padding: "8px 0" }}
        >

// ============================================================
// 가입 이메일 인증 (코드 6자리) + 비밀번호 저장
// 가입 폼 제출 직후 단계. 진짜 메일인지 확인 + 그 세션으로 비번 저장.
// ============================================================
function SignupVerifyScreen({ email, password, onVerified, onBack, stageIdx, totalStages }) {
  const [code, setCode] = useState("");
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState("");
  const [cooldownUntil, setCooldownUntil] = useState(Date.now() + 60000);
  const [now, setNow] = useState(Date.now());
  const codeRef = React.useRef(null);

  useEffect(() => {
    const t = setInterval(() => setNow(Date.now()), 500);
    setTimeout(() => { try { codeRef.current?.focus(); } catch (e) {} }, 100);
    return () => clearInterval(t);
  }, []);
  const cooldownLeft = Math.max(0, Math.ceil((cooldownUntil - now) / 1000));

  const verify = async (codeOverride) => {
    const c = (codeOverride || code).replace(/\D/g, "").trim();
    if (c.length !== 6) { setError("6자리 숫자 코드를 입력해주세요."); return; }
    if (!window.OD?.verifyOtpCode) { setError("서버 연결이 필요해요."); return; }
    setLoading(true); setError("");
    const emailLower = (email || "").trim().toLowerCase();
    const res = await window.OD.verifyOtpCode(emailLower, c);
    if (!res.ok) {
      setLoading(false);
      setError(res.error || "코드가 일치하지 않아요. 메일을 다시 확인해주세요.");
      setCode("");
      setTimeout(() => { try { codeRef.current?.focus(); } catch (e) {} }, 50);
      return;
    }
    // 인증 성공 → 이 세션으로 비밀번호 저장
    if (password && window.OD?.setPassword) {
      const pwRes = await window.OD.setPassword(password);
      if (!pwRes.ok) console.warn("[가입] 비밀번호 저장 실패:", pwRes.error);
    }
    // 세션 정리 (가입 진행은 localStorage 게이트로, 기존 동작 유지)
    try { if (window.OD?.signOut) await window.OD.signOut(); } catch (e) {}
    setLoading(false);
    onVerified();
  };

  const onCodeChange = (e) => {
    const v = e.target.value.replace(/\D/g, "").slice(0, 6);
    setCode(v);
    if (v.length === 6 && !loading) verify(v);
  };

  const resend = async () => {
    if (cooldownLeft > 0 || loading || !window.OD?.sendMagicLink) return;
    setLoading(true); setError("");
    const r = await window.OD.sendMagicLink((email || "").trim().toLowerCase());
    setLoading(false);
    if (!r || !r.ok) { setError("재발송 실패: " + (r && r.error || "잠시 후 다시")); return; }
    setCooldownUntil(Date.now() + 60000);
  };

  return (
    <div className="card">
      <StepBar idx={stageIdx} total={totalStages} />
      <div className="eyebrow">STEP 2 · 이메일 인증</div>
      <h1>메일로 <em>코드</em>를 보냈어요.</h1>
      <p className="lead">
        <strong>{email}</strong> 로 6자리 코드를 보냈어요.<br/>
        진짜 메일인지 확인하는 단계예요. 코드를 입력하면 비밀번호까지 저장돼요.
      </p>

      <div className="form-row" style={{ marginTop: 18 }}>
        <label>인증 코드 (6자리 숫자)</label>
        <input
          ref={codeRef}
          type="text" inputMode="numeric" autoComplete="one-time-code"
          value={code} onChange={onCodeChange} placeholder="123456" maxLength={6} autoFocus
          onKeyDown={e => e.key === "Enter" && code.length === 6 && !loading && verify()}
          style={{ fontSize: 28, letterSpacing: 10, textAlign: "center", fontFamily: "JetBrains Mono, monospace", fontWeight: 800, padding: "16px 12px" }}
        />
      </div>

      {error && (
        <div style={{ fontSize: 12, color: "#B8431A", marginTop: -4, marginBottom: 10, fontWeight: 600 }}>⚠ {error}</div>
      )}

      <div className="btn-row" style={{ flexDirection: "column", alignItems: "stretch", gap: 10, marginTop: 8 }}>
        <button className="btn" onClick={() => verify()} disabled={loading || code.length !== 6} style={{ justifyContent: "center" }}>
          {loading ? "확인 중..." : "✓ 인증하고 계속"}
        </button>
        <div style={{ background: "var(--paper-warm)", border: "1px dashed var(--line)", padding: "12px 14px", borderRadius: 6, fontSize: 12.5, color: "var(--ink-soft)", lineHeight: 1.7 }}>
          💡 메일이 안 보이면 <strong>스팸함</strong>도 확인해주세요. 6자리 모두 입력하면 자동으로 확인돼요.
        </div>
        <div className="btn-row" style={{ gap: 8 }}>
          <button className="btn btn-ghost" onClick={onBack} disabled={loading} style={{ flex: 1, justifyContent: "center", fontSize: 13 }}>
            ← 정보 다시 입력
          </button>
          <button className="btn btn-ghost" onClick={resend} disabled={cooldownLeft > 0 || loading} style={{ flex: 1, justifyContent: "center", fontSize: 13 }}>
            {cooldownLeft > 0 ? "재발송 (" + cooldownLeft + "초)" : "코드 재발송"}
          </button>
        </div>
      </div>
    </div>
  );
}

      <p className="lead">
        {mentor.name}님이 사옥 로비에서 기다리고 있어요. 첫날은 자기소개와 자리 안내, 그리고 아주 짧은 첫 미팅으로 끝납니다.
        <br/><br/>
        부담 갖지 말고, 진짜 회사처럼 천천히.
      </p>
      <div style={{
        background: "rgba(216,90,42,0.06)", border: "1px dashed rgba(216,90,42,0.4)",
        borderRadius: 10, padding: "16px 18px", margin: "8px 0 20px", textAlign: "left",
      }}>
        <div style={{ fontSize: 12, fontWeight: 800, letterSpacing: "0.06em", color: "#C2410C", marginBottom: 10 }}>
          🎁 승진하면 기능이 점차 열려요
        </div>
        <div style={{ display: "grid", gap: 8, fontSize: 13, lineHeight: 1.5, color: "#4A3C2E" }}>
          <div><b>👤 수습 (Day 1-30)</b> · 매일 시추에이션, 미니 미션, 점심 대화</div>
          <div><b>🎓 사원 전환 (Day 30)</b> · 30일 완주하면 정직원 발령</div>
          <div><b>📒 사원 보상</b> · 저장한 표현을 모아보는 <b>나만의 노트</b>, 회의 주도 표현(Day 31-60), 네이비 새 사원증</div>
        </div>
        <div style={{ fontSize: 11.5, color: "#8A7A66", marginTop: 10, lineHeight: 1.5 }}>
          꾸준히 출근할수록 직급이 오르고, 새로운 기능과 콘텐츠가 하나씩 해제됩니다.
        </div>
      </div>
      <div className="btn-row">
        <button className="btn" onClick={onStart} style={{ fontSize: 15, padding: "14px 28px" }}>
          🏢 사옥으로 출근하기
        </button>
      </div>
      <div className="fine-print">출근 후엔 매일 새로운 시나리오가 기다리고 있어요.</div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<OnboardingApp />);
</script>
</body>
</html>
