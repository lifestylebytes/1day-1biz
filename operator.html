<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>1일1비 · 운영자 뷰 (유버디)</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg" />
<script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="lib/supabase-config.js"></script>
<script src="lib/supabase-client.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap');
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Noto Sans KR', sans-serif; background: #F4EFE3; color: #2A1F14; min-height: 100vh; }
.topbar {
  background: #2A1F14; color: #F4EFE3; padding: 16px 28px;
  display: flex; align-items: center; gap: 12px;
  position: sticky; top: 0; z-index: 10;
  border-bottom: 1px solid #5C4A36;
  flex-wrap: wrap;
}
.topbar .brand { font-weight: 900; font-size: 16px; letter-spacing: -0.01em; }
.topbar .brand em { color: #F38A5C; font-style: normal; font-weight: 900; }
.topbar .pill { font-size: 11px; font-weight: 700; letter-spacing: 0.1em; padding: 4px 10px; border-radius: 99px; background: rgba(243,138,92,0.18); color: #F38A5C; }
.topbar .spacer { flex: 1; }
.toggle {
  display: inline-flex; align-items: center; gap: 8px; cursor: pointer;
  font-size: 12px; color: #DBCFB4; padding: 6px 12px; border: 1px solid #5C4A36;
  border-radius: 99px; transition: all 0.15s; text-decoration: none;
}
.toggle:hover { background: rgba(255,255,255,0.06); }
.wrap { max-width: 1100px; margin: 0 auto; padding: 32px 28px; }
.h1 { font-size: 24px; font-weight: 900; margin-bottom: 6px; letter-spacing: -0.02em; }
.h1 em { font-style: normal; font-weight: 900; color: #D85A2A; }
.lead { font-size: 13px; color: #5C4A36; line-height: 1.6; margin-bottom: 28px; }

.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 24px; }
.section { margin-bottom: 36px; }
.section-title { font-size: 11px; letter-spacing: 0.16em; font-weight: 800; color: #8A7964; text-transform: uppercase; margin-bottom: 12px; }

.card { background: white; border: 1px solid #C9BBA0; border-radius: 8px; padding: 20px; }
.card.warn { background: #FFF7E8; border-color: #E8C99B; }
.card .title { font-size: 13px; color: #8A7964; font-weight: 700; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.08em; }

.user-row { display: grid; grid-template-columns: 1.4fr 130px 80px 200px 100px; gap: 14px; padding: 14px 16px; border-bottom: 1px solid #E8DFCB; align-items: center; font-size: 13px; }
.user-row .col-progress { font-size: 12px; line-height: 1.5; }
.user-row .col-progress .progress-day { font-weight: 800; color: #2A1F14; font-size: 13px; }
.user-row .col-progress .progress-last { font-size: 11px; color: #8A7964; margin-top: 2px; }
.user-row .col-type { display: flex; gap: 4px; flex-wrap: wrap; }
.user-row .col-payment { font-size: 12px; line-height: 1.5; }
.user-row .col-payment .pay-status { font-weight: 800; font-size: 12px; }
.user-row .col-payment .pay-meta { font-size: 11px; color: #5C4A36; margin-top: 2px; }
.user-row.head { font-weight: 700; font-size: 11px; color: #8A7964; text-transform: uppercase; letter-spacing: 0.06em; background: #FAF6EB; }
.user-row .actions { display: flex; gap: 6px; }
.empty { padding: 28px; text-align: center; color: #8A7964; font-size: 13px; }

.code-pill {
  display: inline-flex; align-items: center; gap: 6px;
  font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 700;
  background: #2A1F14; color: #F4EFE3;
  padding: 4px 10px; border-radius: 4px;
  cursor: pointer;
}
.code-pill:hover { background: #1a120a; }
.code-pill.used { background: #E8DFCB; color: #8A7964; cursor: default; }
.status-pill {
  display: inline-block; font-size: 11px; font-weight: 700;
  padding: 3px 8px; border-radius: 99px;
  background: #FAF6EB; color: #8A7964;
}
.status-pill.active { background: #E8F4E0; color: #2D8A3E; }

textarea, input, select {
  width: 100%; padding: 10px 12px; font-size: 13px; font-family: inherit;
  background: #FAF6EB; border: 1px solid #C9BBA0; border-radius: 6px; color: #2A1F14;
}
textarea:focus, input:focus, select:focus { outline: none; border-color: #D85A2A; }
label { display: block; font-size: 11px; font-weight: 700; color: #8A7964; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 6px; }
.form-row { margin-bottom: 14px; }

.btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; font-size: 12px; font-weight: 700; background: #2A1F14; color: #F4EFE3; border: none; border-radius: 6px; cursor: pointer; font-family: inherit; }
.btn:hover:not(:disabled) { background: #1a120a; }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }
.btn.primary { background: #D85A2A; }
.btn.primary:hover { background: #B8431A; }
.btn-ghost { background: transparent; color: #5C4A36; border: 1px solid #C9BBA0; }
.btn-ghost:hover { background: #FAF6EB; color: #2A1F14; }
.btn-mini { padding: 4px 8px; font-size: 11px; font-weight: 600; }
.btn-danger { background: #B8431A; color: white; }
.btn-danger:hover { background: #963513; }

.notice-item { background: #FAF6EB; padding: 12px 14px; border-radius: 6px; border: 1px solid #E8DFCB; font-size: 13px; margin-bottom: 8px; }
.notice-item .meta { font-size: 11px; color: #8A7964; margin-bottom: 4px; }

.copy-toast {
  position: fixed; bottom: 24px; right: 24px;
  background: #2A1F14; color: #F4EFE3;
  padding: 12px 18px; border-radius: 8px;
  font-size: 13px; font-weight: 600;
  box-shadow: 0 12px 32px rgba(0,0,0,0.2);
  z-index: 100;
}

@media (max-width: 800px) {
  .grid-2 { grid-template-columns: 1fr; }
  .user-row { grid-template-columns: 1fr 130px; gap: 8px; padding: 10px 12px; }
  .user-row > .col-progress, .user-row > .col-type { display: none; }
}
</style>
</head>
<body>

<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState, useEffect } = React;

const KEY_INVITES = '__OD_INVITES';
const KEY_USER    = '__OD_USER';
const KEY_NOTICES = '__OD_NOTICES';

const load = (k, def) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : def; } catch(e) { return def; } };
const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch(e) {} };

function genCode() {
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let c = '';
  for (let i = 0; i < 4; i++) c += chars[Math.floor(Math.random() * chars.length)];
  return 'PILOT-' + c;
}

// ============================================================
// ★ 학습 데이터 조회 카드 (2026-05-19 추가, RLS 사고 대응)
// 이메일·Day 입력하면 RPC로 즉시 답안·노트·일지·history 조회.
// ============================================================
function LearningQueryCard() {
  const [email, setEmail] = React.useState('');
  const [day, setDay] = React.useState('');
  const [loading, setLoading] = React.useState(false);
  const [result, setResult] = React.useState(null);  // 전체 진도 (day 비웠을 때)
  const [dayResult, setDayResult] = React.useState(null);  // 특정 day
  const [health, setHealth] = React.useState(null);
  const [error, setError] = React.useState('');

  async function run() {
    if (!email.trim()) { setError('이메일을 입력해주세요.'); return; }
    setError(''); setLoading(true);
    setResult(null); setDayResult(null); setHealth(null);
    try {
      const healthR = await window.OD.fetchUserHealth(email.trim());
      if (healthR.ok) setHealth(healthR.health);

      if (day && Number(day) > 0) {
        const r = await window.OD.fetchUserDay(email.trim(), Number(day));
        if (!r.ok) throw new Error(r.error || 'fetch 실패');
        setDayResult(r.data);
      } else {
        const r = await window.OD.fetchUserProgress(email.trim());
        if (!r.ok) throw new Error(r.error || 'fetch 실패');
        setResult(r.rows);
      }
    } catch (e) {
      setError(e.message || '조회 실패');
    } finally {
      setLoading(false);
    }
  }

  return (
    <div className="section">
      <div className="section-title">📚 학습 데이터 조회</div>
      <div className="card" style={{ padding: 16 }}>
        <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap', alignItems: 'center' }}>
          <input
            value={email}
            onChange={e => setEmail(e.target.value)}
            placeholder="이메일 (예: rbxo4119@naver.com)"
            style={{ flex: '1 1 280px', padding: '8px 10px', border: '1px solid #D6C7B0', borderRadius: 6, fontSize: 13 }}
            onKeyDown={e => { if (e.key === 'Enter') run(); }}
          />
          <input
            value={day}
            onChange={e => setDay(e.target.value)}
            placeholder="Day (비우면 전체)"
            type="number" min="1" max="30"
            style={{ width: 140, padding: '8px 10px', border: '1px solid #D6C7B0', borderRadius: 6, fontSize: 13 }}
            onKeyDown={e => { if (e.key === 'Enter') run(); }}
          />
          <button className="btn" onClick={run} disabled={loading}>
            {loading ? '조회 중…' : '조회'}
          </button>
        </div>

        {error && <div style={{ marginTop: 10, color: '#B43A2A', fontSize: 12 }}>⚠ {error}</div>}

        {health && (
          <div style={{ marginTop: 12, fontSize: 12, color: '#5A4A38', background: '#FAF4E8', padding: 10, borderRadius: 6 }}>
            <b>{health.email}</b> · submissions {health.submission_count}건 · history {health.history_count}건 · notes {health.notes_count}건 · journals {health.journals_count}건
            {health.last_submission_at && <> · 마지막 영작 {new Date(health.last_submission_at).toLocaleString('ko-KR')}</>}
          </div>
        )}

        {result && (
          <div style={{ marginTop: 14 }}>
            <div style={{ fontSize: 12, fontWeight: 700, marginBottom: 6 }}>전체 진도</div>
            {result.length === 0 ? (
              <div style={{ fontSize: 12, color: '#8A7964' }}>이 사용자의 영작 기록 없음.</div>
            ) : (
              <div style={{ display: 'grid', gap: 4 }}>
                {result.map(r => (
                  <div key={r.day} style={{ display: 'flex', gap: 10, fontSize: 12, padding: '6px 10px', background: '#FAF4E8', borderRadius: 4 }}>
                    <b style={{ width: 60 }}>Day {r.day}</b>
                    <span style={{ width: 80, color: '#5A4A38' }}>{r.word || '-'}</span>
                    <span style={{ flex: 1 }}>{r.answer_preview || '(답안 없음)'}</span>
                    <span style={{ color: '#8A7964' }}>
                      {r.has_note ? '📒' : ''}{r.has_journal ? '📔' : ''}
                    </span>
                  </div>
                ))}
              </div>
            )}
          </div>
        )}

        {dayResult && (
          <div style={{ marginTop: 14, display: 'grid', gap: 12 }}>
            <div style={{ fontSize: 12, fontWeight: 700 }}>Day {day} 상세</div>

            <div className="card" style={{ padding: 12, background: '#FFF' }}>
              <div style={{ fontSize: 11, color: '#8A7964', marginBottom: 6 }}>📝 시나리오 영작</div>
              {dayResult.submission ? (
                <div>
                  <div style={{ fontSize: 13, lineHeight: 1.6 }}>{dayResult.submission.answer_text}</div>
                  <div style={{ fontSize: 11, color: '#8A7964', marginTop: 6 }}>
                    word: {dayResult.submission.word || '-'} · mc: {dayResult.submission.mc_choice || '-'} · {new Date(dayResult.submission.submitted_at).toLocaleString('ko-KR')}
                  </div>
                </div>
              ) : <div style={{ fontSize: 12, color: '#8A7964' }}>제출 없음</div>}
            </div>

            <div className="card" style={{ padding: 12, background: '#FFF' }}>
              <div style={{ fontSize: 11, color: '#8A7964', marginBottom: 6 }}>📒 단어 노트 ({dayResult.notes?.length || 0})</div>
              {dayResult.notes && dayResult.notes.length > 0 ? (
                <ul style={{ margin: 0, paddingLeft: 18, fontSize: 12, lineHeight: 1.7 }}>
                  {dayResult.notes.map(n => (
                    <li key={n.id}><b>[{n.label || n.kind || 'note'}]</b> {n.text}</li>
                  ))}
                </ul>
              ) : <div style={{ fontSize: 12, color: '#8A7964' }}>노트 없음</div>}
            </div>

            <div className="card" style={{ padding: 12, background: '#FFF' }}>
              <div style={{ fontSize: 11, color: '#8A7964', marginBottom: 6 }}>📔 내 시추에이션</div>
              {dayResult.journal ? (
                <div style={{ fontSize: 13, lineHeight: 1.6, whiteSpace: 'pre-wrap' }}>{dayResult.journal.text}</div>
              ) : <div style={{ fontSize: 12, color: '#8A7964' }}>일지 없음</div>}
            </div>

            {dayResult.history && dayResult.history.length > 1 && (
              <div className="card" style={{ padding: 12, background: '#FFF' }}>
                <div style={{ fontSize: 11, color: '#8A7964', marginBottom: 6 }}>🕒 제출 이력 ({dayResult.history.length}회)</div>
                <div style={{ display: 'grid', gap: 4, fontSize: 11 }}>
                  {dayResult.history.map(h => (
                    <div key={h.id} style={{ padding: '4px 0', borderBottom: '1px dashed #E6D9C0' }}>
                      <div style={{ color: '#8A7964' }}>{new Date(h.created_at).toLocaleString('ko-KR')}</div>
                      <div>{h.answer_text}</div>
                    </div>
                  ))}
                </div>
              </div>
            )}
          </div>
        )}
      </div>
    </div>
  );
}

// 피드백 카테고리 라벨/색깔 (FeedbackInbox + FeedbackReplyModal 공유)
const CAT_LABEL = {
  bug: '🐛 버그', content: '📚 콘텐츠', suggestion: '💡 제안', general: '💬 일반', graduation: '🎓 수습 회고', survey: '📋 주간 설문',
};
const CAT_COLOR = {
  bug: '#FAEBE6', content: '#FFE9A6', suggestion: '#DDEFD9', general: '#EFE7D6', graduation: '#E7EAFC', survey: '#FCE7F3',
};

// 💬 피드백 모아보기 카드 (사용자가 mainboard 우상단 버튼으로 보낸 피드백 표시)
function FeedbackInbox() {
  const [items, setItems] = React.useState([]);
  const [loading, setLoading] = React.useState(false);
  const [showResolved, setShowResolved] = React.useState(false);
  const [replyTo, setReplyTo] = React.useState(null);    // 답장 모달
  const [completeTo, setCompleteTo] = React.useState(null);  // 작업 완료 모달

  const load = async () => {
    if (!window.OD || !window.OD.enabled || !window.OD.fetchFeedback) return;
    setLoading(true);
    const r = await window.OD.fetchFeedback(200);
    if (r.ok) setItems(r.feedback || []);
    setLoading(false);
  };

  React.useEffect(() => {
    let cancelled = false;
    (async () => {
      let tries = 0;
      while ((!window.OD || !window.OD.enabled) && tries++ < 30) {
        await new Promise(r => setTimeout(r, 200));
      }
      if (!cancelled) load();
    })();
    return () => { cancelled = true; };
  }, []);

  const visible = items.filter(it => showResolved || !it.resolved);
  const unresolvedCount = items.filter(it => !it.resolved).length;
  const unrepliedCount  = items.filter(it => !it.resolved && !it.replied_at).length;

  const toggleResolved = async (id, cur) => {
    if (!window.OD?.setFeedbackResolved) return;
    const r = await window.OD.setFeedbackResolved(id, !cur);
    if (r.ok) load();
  };
  const remove = async (id) => {
    if (!window.confirm("이 피드백을 삭제할까요?")) return;
    if (!window.OD?.deleteFeedback) return;
    const r = await window.OD.deleteFeedback(id);
    if (r.ok) load();
  };
  const updateDeadline = async (id, newDate) => {
    if (!window.OD?.setFeedbackDeadline) return;
    const r = await window.OD.setFeedbackDeadline(id, newDate);
    if (r.ok) load();
  };
  // D-day 계산 (마감일 - 오늘)
  const computeDday = (deadline) => {
    if (!deadline) return null;
    const today = new Date(); today.setHours(0,0,0,0);
    const d = new Date(deadline + 'T00:00:00');
    const diff = Math.round((d - today) / 86400000);
    return diff;
  };

  return (
    <div className="section">
      <div className="section-title">
        💬 피드백 모아보기
        <span style={{ marginLeft: 10, fontSize: 11, fontWeight: 800 }}>
          {unrepliedCount > 0 && <span style={{ color: '#A8462F' }}>미답장 {unrepliedCount}건 </span>}
          {unresolvedCount > 0 ? (
            <span style={{ color: '#8A5A2B' }}>· 미해결 {unresolvedCount}건</span>
          ) : (
            <span style={{ color: '#2D6E3A' }}>· 전부 해결됨 ✓</span>
          )}
        </span>
        <button className="btn btn-ghost btn-mini" style={{ marginLeft: 12, padding: '2px 10px', fontSize: 11 }} onClick={load} disabled={loading}>
          {loading ? '로딩…' : '↻ 새로고침'}
        </button>
        <label style={{ marginLeft: 12, fontSize: 11, color: '#8A7964', cursor: 'pointer', fontWeight: 500, textTransform: 'none', letterSpacing: 'normal' }}>
          <input type="checkbox" checked={showResolved} onChange={e => setShowResolved(e.target.checked)} style={{ marginRight: 4 }} />
          처리된 것도 보기
        </label>
      </div>
      <div className="card" style={{ padding: 0 }}>
        {visible.length === 0 ? (
          <div className="empty" style={{ padding: 24 }}>{loading ? '로딩 중...' : '아직 들어온 피드백이 없어요.'}</div>
        ) : visible.map(it => (
          <div key={it.id} style={{
            padding: '14px 18px', borderBottom: '1px solid #E8DFCB',
            opacity: it.resolved ? 0.55 : 1,
          }}>
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 8, flexWrap: 'wrap', gap: 8 }}>
              <div style={{ display: 'flex', gap: 8, alignItems: 'center', flexWrap: 'wrap' }}>
                <span style={{ background: CAT_COLOR[it.category] || '#EFE7D6', padding: '3px 10px', borderRadius: 12, fontSize: 11, fontWeight: 700 }}>
                  {CAT_LABEL[it.category] || it.category}
                </span>
                <span style={{ fontSize: 12, fontWeight: 700 }}>{it.name || '익명'}</span>
                {it.email && <span style={{ fontSize: 11, color: '#8A7964', fontFamily: 'JetBrains Mono, monospace' }}>{it.email}</span>}
                {it.day && <span style={{ fontSize: 11, color: '#8A7964' }}>Day {it.day}</span>}
                <span style={{ fontSize: 11, color: '#8A7964' }}>{new Date(it.created_at).toLocaleString('ko-KR')}</span>
                {it.replied_at && !it.resolved && (
                  <span style={{ fontSize: 10, padding: '2px 8px', background: '#E7EAFC', color: '#3D4DA8', borderRadius: 10, fontWeight: 700 }}>
                    ✉️ 답장 완료 {new Date(it.replied_at).toLocaleDateString('ko-KR', { month: 'numeric', day: 'numeric' })}
                  </span>
                )}
                {it.deadline && !it.resolved && (() => {
                  const d = computeDday(it.deadline);
                  const isUrgent = d !== null && d <= 2;
                  const isPast   = d !== null && d < 0;
                  const bg = isPast ? '#FAEBE6' : (isUrgent ? '#FFE9A6' : '#DDEFD9');
                  const fg = isPast ? '#993C1D' : (isUrgent ? '#8C6510' : '#2D6E3A');
                  const label = isPast ? `⏰ D+${Math.abs(d)} 지남` : (d === 0 ? '⏰ 오늘 마감' : `⏰ D-${d}`);
                  return (
                    <span style={{ fontSize: 10, padding: '2px 8px', background: bg, color: fg, borderRadius: 10, fontWeight: 800 }}>
                      {label} ({it.deadline.slice(5).replace('-', '/')})
                    </span>
                  );
                })()}
                {it.resolved && it.completed_at && (
                  <span style={{ fontSize: 10, padding: '2px 8px', background: '#DDEFD9', color: '#2D6E3A', borderRadius: 10, fontWeight: 700 }}>
                    ✅ 완료 알림 발송 {new Date(it.completed_at).toLocaleDateString('ko-KR', { month: 'numeric', day: 'numeric' })}
                  </span>
                )}
              </div>
              <div style={{ display: 'flex', gap: 6, alignItems: 'center', flexWrap: 'wrap' }}>
                {it.email && !it.resolved && (
                  <button
                    onClick={() => setReplyTo(it)}
                    style={{ fontSize: 11, padding: '3px 10px', background: it.replied_at ? 'transparent' : '#D85A2A', color: it.replied_at ? '#5C4A36' : '#F4EFE3', border: it.replied_at ? '1px solid #C9BBA0' : 'none', borderRadius: 4, cursor: 'pointer', fontFamily: 'inherit', fontWeight: 700 }}
                  >{it.replied_at ? '💬 다시 답장' : '💬 답장하기'}</button>
                )}
                {it.email && !it.resolved && (
                  <button
                    onClick={() => setCompleteTo(it)}
                    title={it.replied_at ? '약속한 작업 완료, 사용자에게 알림' : '답장 없이 바로 해결, 사용자에게 알림'}
                    style={{ fontSize: 11, padding: '3px 10px', background: '#2D8A3E', color: '#F4EFE3', border: 'none', borderRadius: 4, cursor: 'pointer', fontFamily: 'inherit', fontWeight: 700 }}
                  >{it.replied_at ? '✅ 작업 완료' : '✅ 바로 해결'}</button>
                )}
                {!it.resolved && (
                  <input
                    type="date"
                    value={it.deadline || ''}
                    onChange={e => updateDeadline(it.id, e.target.value || null)}
                    title="마감일 수정"
                    style={{ fontSize: 11, padding: '2px 6px', border: '1px solid #C9BBA0', borderRadius: 4, background: 'transparent', color: '#5C4A36', fontFamily: 'inherit' }}
                  />
                )}
                <button
                  onClick={() => toggleResolved(it.id, it.resolved)}
                  style={{ fontSize: 11, padding: '3px 10px', background: it.resolved ? '#DDEFD9' : 'transparent', color: it.resolved ? '#2D6E3A' : '#5C4A36', border: '1px solid #C9BBA0', borderRadius: 4, cursor: 'pointer', fontFamily: 'inherit', fontWeight: 700 }}
                >{it.resolved ? '✓ 해결됨' : '수동 처리'}</button>
                <button
                  onClick={() => remove(it.id)}
                  style={{ fontSize: 11, padding: '3px 10px', background: 'transparent', color: '#A8462F', border: '1px solid #D9C9A8', borderRadius: 4, cursor: 'pointer', fontFamily: 'inherit', fontWeight: 700 }}
                >삭제</button>
              </div>
            </div>
            <div style={{ fontSize: 13, color: '#2A1F14', lineHeight: 1.65, whiteSpace: 'pre-wrap', wordBreak: 'keep-all', background: '#FAF6EB', padding: '10px 14px', borderLeft: '3px solid #D85A2A', borderRadius: 4 }}>
              {it.message}
            </div>
          </div>
        ))}
      </div>
      {replyTo && (
        <FeedbackReplyModal
          target={replyTo}
          allItems={items}
          onClose={() => setReplyTo(null)}
          onSent={() => { setReplyTo(null); load(); }}
        />
      )}
      {completeTo && (
        <FeedbackCompletionModal
          target={completeTo}
          allItems={items}
          onClose={() => setCompleteTo(null)}
          onSent={() => { setCompleteTo(null); load(); }}
        />
      )}
    </div>
  );
}

// 피드백 답장 모달: 해당 사용자의 모든 미해결 피드백을 함께 보여주고 한 번에 답장
function FeedbackReplyModal({ target, allItems, onClose, onSent }) {
  const email = (target.email || '').toLowerCase();
  const sameUserItems = allItems.filter(
    it => !it.resolved && (it.email || '').toLowerCase() === email
  );
  const allIds = sameUserItems.map(it => it.id);

  const defaultTitle = `${target.name || ''}님, 소중한 피드백 정말 감사드려요!`;
  const defaultBody = (() => {
    const name = target.name || '';
    const greet = `${name}님, 안녕하세요! 유버디예요 :)\n\n소중한 피드백 정말정말 감사드려요. ${name}님이 학습하시면서 직접 발견하신 부분을 이렇게 자세히 적어주셔서 정말 큰 도움이 됐어요. 1일1비가 진짜 도움 되는 서비스로 자라려면 ${name}님 같은 분의 피드백이 정말 중요하거든요. 한 분 한 분 보내주시는 내용 다 정성껏 챙겨보고 있어요.\n\n${name}님이 보내주신 의견 정리해봤어요:`;
    const list = sameUserItems
      .map(it => `\n• (Day ${it.day || '-'}, ${CAT_LABEL[it.category] || it.category}) "${it.message}"`)
      .join('');
    const promise = `\n\n주신 내용 다음주 금요일(6/6)까지 반영해서 업데이트해두겠습니다. 학습 흐름에 영향 가는 부분이라 우선순위로 챙길게요!\n\n학습하시다가 또 어색하거나 막히는 부분, "이런 게 있으면 좋겠다" 싶은 거 있으면 언제든 우상단 💬 피드백 버튼으로 편하게 보내주세요. 작은 거라도 다 환영이에요 :)\n\n오늘도 한 단어, 한 줄 챙겨가는 하루 되세요!\n\n유버디 드림 💛`;
    return greet + list + promise;
  })();

  const [title, setTitle] = React.useState(defaultTitle);
  const [body, setBody] = React.useState(defaultBody);
  // 기본 마감일: 가장 가까운 다음주 금요일 (또는 기존 deadline 있으면 그거)
  const _defaultDeadline = (() => {
    const existing = sameUserItems.find(it => it.deadline)?.deadline;
    if (existing) return existing;
    const d = new Date();
    const day = d.getDay();
    const daysUntilFriday = ((5 - day + 7) % 7) || 7;
    d.setDate(d.getDate() + daysUntilFriday);
    return d.toISOString().slice(0, 10);
  })();
  const [deadline, setDeadline] = React.useState(_defaultDeadline);
  const [sending, setSending] = React.useState(false);
  const [copied, setCopied] = React.useState(false);

  const send = async () => {
    if (!title.trim() || !body.trim() || sending) return;
    if (!window.OD?.replyToFeedback) {
      alert('OD.replyToFeedback 함수 없음 (배포 안 됨)');
      return;
    }
    setSending(true);
    const r = await window.OD.replyToFeedback({
      feedbackIds: allIds,
      recipientEmail: email,
      title: title.trim(),
      body: body.trim(),
      deadline: deadline || null,
    });
    setSending(false);
    if (!r.ok) {
      alert('답장 발송 실패: ' + (r.error || ''));
      return;
    }
    alert(`${target.name || email} 님께 사내 메모 발송 + 피드백 ${r.count}건에 답장 기록 + 마감일 ${deadline || '미설정'} ✓`);
    onSent();
  };

  const copyEmail = async () => {
    const text = `${title}\n\n${body}`;
    try {
      await navigator.clipboard.writeText(text);
      setCopied(true);
      setTimeout(() => setCopied(false), 2000);
    } catch (e) {
      // fallback
      const ta = document.createElement('textarea');
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      setCopied(true);
      setTimeout(() => setCopied(false), 2000);
    }
  };

  return (
    <div
      onClick={onClose}
      style={{ position: 'fixed', inset: 0, background: 'rgba(40,30,20,0.55)', display: 'flex', alignItems: 'center', justifyContent: 'center', zIndex: 1000, padding: 20 }}
    >
      <div
        onClick={e => e.stopPropagation()}
        style={{ background: '#F4EFE3', borderRadius: 12, maxWidth: 640, width: '100%', maxHeight: '90vh', overflow: 'auto', boxShadow: '0 20px 50px rgba(0,0,0,0.3)' }}
      >
        <div style={{ background: '#2A2118', color: '#F4EFE3', padding: '14px 20px', borderRadius: '12px 12px 0 0', display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
          <div>
            <div style={{ fontSize: 11, letterSpacing: '0.12em', opacity: 0.7 }}>피드백 답장 작성</div>
            <div style={{ fontSize: 14, fontWeight: 800, marginTop: 2 }}>
              {target.name || '익명'} ({email}) · 미해결 피드백 {sameUserItems.length}건 한번에 처리
            </div>
          </div>
          <button onClick={onClose} style={{ background: 'none', border: 'none', color: '#F4EFE3', fontSize: 18, cursor: 'pointer' }}>✕</button>
        </div>
        <div style={{ padding: '18px 22px' }}>
          <div style={{ fontSize: 11, fontWeight: 800, color: '#8A7964', letterSpacing: '0.1em', marginBottom: 6 }}>받은 피드백 ({sameUserItems.length}건)</div>
          <div style={{ background: '#FAF6EB', border: '1px solid #E8DFCB', borderRadius: 6, padding: '10px 14px', marginBottom: 14, maxHeight: 180, overflow: 'auto' }}>
            {sameUserItems.map(it => (
              <div key={it.id} style={{ fontSize: 12, color: '#2A1F14', lineHeight: 1.55, padding: '6px 0', borderBottom: '1px dashed #D9C9A8' }}>
                <b>Day {it.day || '-'}</b> · {CAT_LABEL[it.category] || it.category}<br/>
                {it.message}
              </div>
            ))}
          </div>

          <div style={{ fontSize: 11, fontWeight: 800, color: '#8A7964', letterSpacing: '0.1em', marginBottom: 6 }}>제목</div>
          <input
            value={title}
            onChange={e => setTitle(e.target.value)}
            style={{ width: '100%', padding: '10px 12px', border: '1px solid #D6C7B0', borderRadius: 6, fontSize: 13, fontFamily: 'inherit', background: '#FFFFFF', marginBottom: 12 }}
          />

          <div style={{ fontSize: 11, fontWeight: 800, color: '#8A7964', letterSpacing: '0.1em', marginBottom: 6 }}>본문 (사내 메모 + 이메일 동일 내용)</div>
          <textarea
            value={body}
            onChange={e => setBody(e.target.value)}
            rows={14}
            style={{ width: '100%', padding: '12px 14px', border: '1px solid #D6C7B0', borderRadius: 6, fontSize: 13, fontFamily: 'inherit', background: '#FFFFFF', lineHeight: 1.65, resize: 'vertical', marginBottom: 14 }}
          />

          <div style={{ fontSize: 11, fontWeight: 800, color: '#8A7964', letterSpacing: '0.1em', marginBottom: 6 }}>📅 마감일 (이번 작업을 언제까지 끝낼 건지)</div>
          <div style={{ display: 'flex', gap: 8, alignItems: 'center', marginBottom: 14 }}>
            <input
              type="date"
              value={deadline}
              onChange={e => setDeadline(e.target.value)}
              style={{ padding: '8px 10px', border: '1px solid #D6C7B0', borderRadius: 6, fontSize: 13, fontFamily: 'inherit', background: '#FFFFFF' }}
            />
            <button onClick={() => setDeadline('')} style={{ fontSize: 11, padding: '6px 10px', background: 'transparent', color: '#8A7964', border: '1px solid #D6C7B0', borderRadius: 4, cursor: 'pointer', fontFamily: 'inherit' }}>마감일 없음</button>
            <span style={{ fontSize: 11, color: '#8A7964' }}>이 피드백 {sameUserItems.length}건 전체에 같은 마감일 적용됩니다. 모닝 브리핑에서 D-day로 표시됨.</span>
          </div>

          <div style={{ background: '#FFF3D6', border: '1px solid #E7C9A3', borderRadius: 6, padding: '10px 14px', fontSize: 11, color: '#8A5A2B', lineHeight: 1.55, marginBottom: 14 }}>
            💡 [사내 메모 보내기]를 누르면 <b>{email}</b> 한 명에게만 mainboard 메모함 + 입장 시 팝업으로 전달됩니다. 이 사람의 피드백 {sameUserItems.length}건에 ✉️ <b>"답장 완료"</b> 마크가 박혀요.
            <br/>⚠️ <b>실제 버그 수정/기능 반영 후</b>엔 따로 각 피드백의 <b>[처리 완료로 표시]</b>를 눌러서 ✓ 해결됨으로 마킹해주세요. 답장과 해결은 다른 상태예요.
            <br/>이메일로도 같은 내용 보내려면 [이메일용 복사]를 누르고 본인 메일에서 그 사람한테 보내세요.
          </div>

          <div style={{ display: 'flex', gap: 8, justifyContent: 'flex-end' }}>
            <button
              className="btn btn-ghost"
              onClick={copyEmail}
              style={{ fontSize: 12 }}
            >{copied ? '✓ 복사됨' : '📋 이메일용 복사'}</button>
            <button
              className="btn primary"
              onClick={send}
              disabled={!title.trim() || !body.trim() || sending}
              style={{ fontSize: 12, opacity: (!title.trim() || !body.trim() || sending) ? 0.5 : 1 }}
            >{sending ? '발송 중...' : '📨 사내 메모 보내기'}</button>
          </div>
        </div>
      </div>
    </div>
  );
}

// ✅ 작업 완료 알림 모달: 약속한 작업이 끝났을 때 그분께 "반영됐어요!" 알림 발송 + resolved 마킹
function FeedbackCompletionModal({ target, allItems, onClose, onSent }) {
  const email = (target.email || '').toLowerCase();
  const sameUserItems = allItems.filter(
    it => !it.resolved && (it.email || '').toLowerCase() === email
  );
  const allIds = sameUserItems.map(it => it.id);

  // 사전 답장 여부에 따라 톤 살짝 다르게 (약속 지킨 톤 vs 바로 해결 톤)
  const _hasPriorReply = sameUserItems.some(it => it.replied_at);
  const defaultTitle = _hasPriorReply
    ? `${target.name || ''}님, 약속드린 부분 반영했어요! ✅`
    : `${target.name || ''}님, 피드백 주신 부분 바로 반영했어요! ✅`;
  const defaultBody = (() => {
    const name = target.name || '';
    const greet = _hasPriorReply
      ? `${name}님, 안녕하세요! 유버디예요 :)\n\n${name}님이 보내주신 피드백 반영해서 방금 업데이트 완료했어요. 약속 지킬 수 있어 다행이에요!\n\n반영된 내용:`
      : `${name}님, 안녕하세요! 유버디예요 :)\n\n${name}님이 보내주신 피드백 보고 바로 손봐서 방금 업데이트 완료했어요! 빠르게 알려주신 덕분에 빨리 고칠 수 있었습니다 🙏\n\n반영된 내용:`;
    const list = sameUserItems
      .map(it => `\n• (Day ${it.day || '-'}, ${CAT_LABEL[it.category] || it.category}) "${it.message}"`)
      .join('');
    const action = `\n\n위 부분들 다 손봤어요. 페이지에서 한 번 새로고침(Mac은 Cmd+Shift+R) 해주시면 새 내용으로 보입니다!\n\n또 학습하시다가 어색하거나 막히는 부분, 새로 발견하신 게 있으면 언제든 우상단 💬 피드백 버튼으로 편하게 보내주세요. ${name}님 의견이 진짜 큰 도움 됩니다 :)\n\n오늘도 한 단어, 한 줄 챙겨가는 하루 되세요!\n\n유버디 드림 💛`;
    return greet + list + action;
  })();

  const [title, setTitle] = React.useState(defaultTitle);
  const [body, setBody] = React.useState(defaultBody);
  const [sending, setSending] = React.useState(false);
  const [copied, setCopied] = React.useState(false);

  const send = async () => {
    if (!title.trim() || !body.trim() || sending) return;
    if (!window.OD?.completeFeedback) {
      alert('OD.completeFeedback 함수 없음 (배포 안 됨)');
      return;
    }
    setSending(true);
    const r = await window.OD.completeFeedback({
      feedbackIds: allIds,
      recipientEmail: email,
      title: title.trim(),
      body: body.trim(),
    });
    setSending(false);
    if (!r.ok) {
      alert('완료 알림 발송 실패: ' + (r.error || ''));
      return;
    }
    alert(`${target.name || email} 님께 완료 알림 발송 + 피드백 ${r.count}건 해결됨 마킹 ✅`);
    onSent();
  };

  const copyEmail = async () => {
    const text = `${title}\n\n${body}`;
    try {
      await navigator.clipboard.writeText(text);
      setCopied(true); setTimeout(() => setCopied(false), 2000);
    } catch (e) {
      const ta = document.createElement('textarea');
      ta.value = text; document.body.appendChild(ta); ta.select();
      document.execCommand('copy'); document.body.removeChild(ta);
      setCopied(true); setTimeout(() => setCopied(false), 2000);
    }
  };

  return (
    <div
      onClick={onClose}
      style={{ position: 'fixed', inset: 0, background: 'rgba(40,30,20,0.55)', display: 'flex', alignItems: 'center', justifyContent: 'center', zIndex: 1000, padding: 20 }}
    >
      <div
        onClick={e => e.stopPropagation()}
        style={{ background: '#F4EFE3', borderRadius: 12, maxWidth: 640, width: '100%', maxHeight: '90vh', overflow: 'auto', boxShadow: '0 20px 50px rgba(0,0,0,0.3)' }}
      >
        <div style={{ background: '#2D8A3E', color: '#F4EFE3', padding: '14px 20px', borderRadius: '12px 12px 0 0', display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
          <div>
            <div style={{ fontSize: 11, letterSpacing: '0.12em', opacity: 0.85 }}>작업 완료 알림</div>
            <div style={{ fontSize: 14, fontWeight: 800, marginTop: 2 }}>
              {target.name || '익명'} ({email}) · 피드백 {sameUserItems.length}건 해결됨으로 처리
            </div>
          </div>
          <button onClick={onClose} style={{ background: 'none', border: 'none', color: '#F4EFE3', fontSize: 18, cursor: 'pointer' }}>✕</button>
        </div>
        <div style={{ padding: '18px 22px' }}>
          <div style={{ fontSize: 11, fontWeight: 800, color: '#8A7964', letterSpacing: '0.1em', marginBottom: 6 }}>처리한 피드백 ({sameUserItems.length}건)</div>
          <div style={{ background: '#FAF6EB', border: '1px solid #E8DFCB', borderRadius: 6, padding: '10px 14px', marginBottom: 14, maxHeight: 180, overflow: 'auto' }}>
            {sameUserItems.map(it => (
              <div key={it.id} style={{ fontSize: 12, color: '#2A1F14', lineHeight: 1.55, padding: '6px 0', borderBottom: '1px dashed #D9C9A8' }}>
                <b>Day {it.day || '-'}</b> · {CAT_LABEL[it.category] || it.category}<br/>
                {it.message}
              </div>
            ))}
          </div>

          <div style={{ fontSize: 11, fontWeight: 800, color: '#8A7964', letterSpacing: '0.1em', marginBottom: 6 }}>제목</div>
          <input
            value={title}
            onChange={e => setTitle(e.target.value)}
            style={{ width: '100%', padding: '10px 12px', border: '1px solid #D6C7B0', borderRadius: 6, fontSize: 13, fontFamily: 'inherit', background: '#FFFFFF', marginBottom: 12 }}
          />

          <div style={{ fontSize: 11, fontWeight: 800, color: '#8A7964', letterSpacing: '0.1em', marginBottom: 6 }}>본문 (사내 메모 + 이메일 동일 내용)</div>
          <textarea
            value={body}
            onChange={e => setBody(e.target.value)}
            rows={12}
            style={{ width: '100%', padding: '12px 14px', border: '1px solid #D6C7B0', borderRadius: 6, fontSize: 13, fontFamily: 'inherit', background: '#FFFFFF', lineHeight: 1.65, resize: 'vertical', marginBottom: 14 }}
          />

          <div style={{ background: '#DDEFD9', border: '1px solid #B0D4B4', borderRadius: 6, padding: '10px 14px', fontSize: 11, color: '#2D6E3A', lineHeight: 1.55, marginBottom: 14 }}>
            ✅ [완료 알림 보내기] 누르면 <b>{email}</b>께 사내 메모 + 입장 시 팝업 발송 + 피드백 {sameUserItems.length}건이 <b>해결됨</b>으로 마킹됩니다. 이번주 처리 완료 큐에 자동으로 들어가요.
          </div>

          <div style={{ display: 'flex', gap: 8, justifyContent: 'flex-end' }}>
            <button className="btn btn-ghost" onClick={copyEmail} style={{ fontSize: 12 }}>
              {copied ? '✓ 복사됨' : '📋 이메일용 복사'}
            </button>
            <button
              onClick={send}
              disabled={!title.trim() || !body.trim() || sending}
              style={{ fontSize: 12, padding: '8px 16px', background: '#2D8A3E', color: '#F4EFE3', border: 'none', borderRadius: 4, cursor: 'pointer', fontWeight: 800, fontFamily: 'inherit', opacity: (!title.trim() || !body.trim() || sending) ? 0.5 : 1 }}
            >{sending ? '발송 중...' : '✅ 완료 알림 보내기'}</button>
          </div>
        </div>
      </div>
    </div>
  );
}

function App() {
  // ★ 운영자 가드, 운영자 아니면 즉시 차단 (localStorage 1차 검증)
  const _initUser = load(KEY_USER, null);
  if (!_initUser || !_initUser.isOperator) {
    // 비운영자 또는 비로그인 → 홈으로 튕김
    alert("운영자 전용 페이지입니다.");
    window.location.replace("onboarding.html");
    return null;
  }

  const [invites, setInvites] = useState(() => load(KEY_INVITES, []));
  const [currentUser, setCurrentUser] = useState(() => _initUser);
  const [notices, setNotices] = useState(() => load(KEY_NOTICES, []));

  // ★ 2차 검증, DB의 is_operator 도 확인 (localStorage 위조 방지)
  React.useEffect(() => {
    let cancelled = false;
    const verify = async () => {
      let tries = 0;
      while ((!window.OD || !window.OD.enabled) && tries++ < 30) {
        await new Promise(r => setTimeout(r, 200));
      }
      if (cancelled || !window.OD || !window.OD.enabled) return;
      const r = await window.OD.fetchByEmail(_initUser.email);
      if (!r.ok || !r.user || !r.user.is_operator) {
        alert("운영자 권한 검증 실패. 다시 로그인해주세요.");
        window.location.replace("onboarding.html");
      }
    };
    verify();
    return () => { cancelled = true; };
  }, []);

  const [newName, setNewName] = useState("");
  const [newNote, setNewNote] = useState("");

  const [draftTitle, setDraftTitle] = useState("");
  const [draftBody, setDraftBody] = useState("");
  const [draftType, setDraftType] = useState("notice");
  const [draftPopup, setDraftPopup] = useState(false);
  const [editingId, setEditingId] = useState(null);  // null이면 새 공지, 값 있으면 수정 중
  const [readCounts, setReadCounts] = useState({});   // { 'db-<id>': 확인자수 }
  const [previewNotice, setPreviewNotice] = useState(null);  // 사용자 팝업 미리보기

  const [toast, setToast] = useState(null);
  const showToast = (msg) => { setToast(msg); setTimeout(() => setToast(null), 1800); };

  // Supabase, 전체 사용자 + 통계
  const [supaEnabled, setSupaEnabled] = useState(false);
  const [supaUsers, setSupaUsers] = useState([]);
  const [supaStats, setSupaStats] = useState(null);
  const [supaLoading, setSupaLoading] = useState(true);

  const refreshSupabase = async () => {
    if (!window.OD || !window.OD.enabled) {
      setSupaEnabled(false);
      setSupaLoading(false);
      return;
    }
    setSupaEnabled(true);
    setSupaLoading(true);
    const [usersRes, statsRes] = await Promise.all([
      window.OD.fetchAllUsers(),
      window.OD.fetchStats(),

    if (usersRes.ok) setSupaUsers(usersRes.users);
    if (statsRes.ok) setSupaStats(statsRes.stats);
    setSupaLoading(false);

  // ★ 멤버십 퇴직 처리 (인수인계 30일 후 자동 만료)
  const cancelUserMembership = async (u) => {
    if (!u || !u.email) return;
    if (u.is_operator) { alert("운영자 계정은 퇴직 처리할 수 없어요."); return; }
    if (!confirm(`${u.name} (${u.email}) 님을 퇴직 처리할까요?\n\n· 인수인계 기간: 30일\n· 그동안은 평소처럼 사옥 출입 가능\n· 마지막 출근일이 지나면 자동으로 차단돼요`)) return;
    const res = await window.OD.cancelMembership(u.email, 30);
    if (res.ok) {
      const endDate = new Date(res.endsAt).toLocaleDateString('ko-KR', { year: 'numeric', month: 'short', day: 'numeric' });
      showToast(`${u.name} 퇴직 처리됨 · 마지막 출근일 ${endDate}`);
      refreshSupabase();
    } else {
      alert("퇴직 처리 실패: " + (res.error || "잠시 후 다시"));
    }
  };

  // ★ 복직 (인수인계 기간 중 마음 바뀐 경우)
  const restoreUserMembership = async (u) => {
    if (!u || !u.email) return;
    if (!confirm(`${u.name} 님의 퇴직을 취소하고 복직 처리할까요?`)) return;
    const res = await window.OD.restoreMembership(u.email);
    if (res.ok) {
      showToast(`${u.name} 복직 완료 · 만료일 해제`);
      refreshSupabase();
    } else {
      alert("복직 처리 실패: " + (res.error || "잠시 후 다시"));
    }
  };

  // 만료일까지 남은 일수 계산 (음수면 이미 만료)
  const daysUntilEnd = (isoStr) => {
    if (!isoStr) return null;
    const ms = new Date(isoStr).getTime() - Date.now();
    return Math.ceil(ms / 86400000);
  };

  useEffect(() => { refreshSupabase(); }, []);

  // 다른 탭 동기화
  useEffect(() => {
    const onStorage = (e) => {
      if (e.key === KEY_INVITES) setInvites(load(KEY_INVITES, []));
      if (e.key === KEY_USER) setCurrentUser(load(KEY_USER, null));
      if (e.key === KEY_NOTICES) setNotices(load(KEY_NOTICES, []));
    };
    window.addEventListener('storage', onStorage);
    return () => window.removeEventListener('storage', onStorage);
  }, []);

  const issueCode = () => {
    if (!newName.trim()) return;
    const code = genCode();
    const next = [{
      code, name: newName.trim(), note: newNote.trim(),
      issuedAt: new Date().toISOString(),
      usedAt: null, usedBy: null,
      currentDay: null, lastActive: null,
    }, ...invites];
    setInvites(next); save(KEY_INVITES, next);
    setNewName(""); setNewNote("");
    if (navigator.clipboard) {
      navigator.clipboard.writeText(code).then(() => showToast(`${code} 발급 완료 · 클립보드 복사됨`));
    } else {
      showToast(`${code} 발급 완료`);
    }
  };

  const revokeCode = (code) => {
    if (!confirm(`${code} 코드 삭제할까요?`)) return;
    const next = invites.filter(i => i.code !== code);
    setInvites(next); save(KEY_INVITES, next);
  };

  const copyCode = (code) => {
    if (navigator.clipboard) {
      navigator.clipboard.writeText(code).then(() => showToast(`${code} 복사됨`));
    }
  };

  const opsJumpDay = (delta) => {
    if (!currentUser) { alert("이 기기에 등록된 사용자가 없어요."); return; }
    // ★ dayInCompany 가 undefined/null/NaN 이면 1로 폴백. NaN + 7 = NaN → Math.max(1, NaN) = 1 버그 방지.
    const cur = Number.isFinite(currentUser.dayInCompany) ? currentUser.dayInCompany : 1;
    const newDay = Math.max(1, Math.min(365, cur + delta));
    const u = { ...currentUser, dayInCompany: newDay };
    setCurrentUser(u); save(KEY_USER, u);
    showToast(`Day ${newDay}로 이동`);
  };
  const opsSetDay = () => {
    if (!currentUser) { alert("이 기기에 등록된 사용자가 없어요."); return; }
    const cur = Number.isFinite(currentUser.dayInCompany) ? currentUser.dayInCompany : 1;
    const v = prompt("이동할 Day (1-365):", String(cur));
    if (!v) return;
    const n = Math.max(1, Math.min(365, parseInt(v, 10) || 1));
    const u = { ...currentUser, dayInCompany: n };
    setCurrentUser(u); save(KEY_USER, u);
    showToast(`Day ${n}로 이동`);
  };
  const opsResetUser = () => {
    if (!confirm("이 기기 사용자 데이터를 모두 지울까요?")) return;
    localStorage.removeItem(KEY_USER);
    setCurrentUser(null);
    showToast("사용자 리셋 완료");
  };

  // DB(notices 테이블)에서 공지 목록 로드. 모든 사용자가 보는 실제 소스.
  const loadNotices = async () => {
    if (!window.OD || !window.OD.enabled || !window.OD.fetchNotices) return;
    const r = await window.OD.fetchNotices(50);
    if (r.ok && r.notices) {
      const mapped = r.notices.map(n => ({
        id: n.id, type: n.type, title: n.title, body: n.body,
        from: n.from_name, at: n.sent_at, popup: !!n.popup,
        target_emails: n.target_emails || null,
      }));
      setNotices(mapped); save(KEY_NOTICES, mapped);
    }
    // 공지별 확인자 수 집계
    if (window.OD.fetchNoticeReadCounts) {
      const rc = await window.OD.fetchNoticeReadCounts();
      if (rc.ok) setReadCounts(rc.counts || {});
    }
  };

  // 마운트 시 window.OD 준비되면 DB 공지 로드
  React.useEffect(() => {
    let cancelled = false;
    (async () => {
      let tries = 0;
      while ((!window.OD || !window.OD.enabled || !window.OD.fetchNotices) && tries++ < 30) {
        await new Promise(r => setTimeout(r, 200));
      }
      if (!cancelled) loadNotices();
    })();
    return () => { cancelled = true; };
  }, []);

  // 작성 폼 초기화 (새 공지 모드)
  const resetDraft = () => {
    setEditingId(null); setDraftType("notice");
    setDraftTitle(""); setDraftBody(""); setDraftPopup(false);
  };

  // 발송 공지 클릭 → 폼에 로드해서 전체 확인 + 수정 모드 진입
  const startEditNotice = (n) => {
    setEditingId(n.id);
    setDraftType(n.type || "notice");
    setDraftTitle(n.title || "");
    setDraftBody(n.body || "");
    setDraftPopup(!!n.popup);
    showToast("수정 모드, 내용을 확인하고 고친 뒤 저장하세요");
    try { window.scrollTo({ top: 0, behavior: "smooth" }); } catch (e) {}
  };

  const addNotice = async () => {
    if (!draftTitle.trim() || !draftBody.trim()) return;
    if (!window.OD || !window.OD.enabled || !window.OD.sendNotice) {
      showToast("DB 연결 대기 중. 잠시 후 다시 시도해주세요.");
      return;
    }
    const payload = {
      type: draftType,
      title: draftTitle.trim(),
      body: draftBody.trim(),
      popup: draftPopup,
    };
    let r;
    if (editingId) {
      r = await window.OD.updateNotice(editingId, payload);
    } else {
      r = await window.OD.sendNotice({ ...payload, fromName: "유버디 (Buddy)" });
    }
    if (!r.ok) { showToast((editingId ? "수정" : "발송") + " 실패: " + (r.error || "알 수 없는 오류")); return; }
    showToast(editingId ? "공지 수정됨 ✓" : "모든 입사자에게 공지 발송됨 ✓");
    resetDraft();
    loadNotices();
  };

  const removeNotice = async (id) => {
    if (!window.confirm("이 공지를 삭제할까요? 모든 사용자 화면에서 사라집니다.")) return;
    if (!window.OD || !window.OD.enabled || !window.OD.deleteNotice) {
      showToast("DB 연결 대기 중. 잠시 후 다시 시도해주세요.");
      return;
    }
    const r = await window.OD.deleteNotice(id);
    if (!r.ok) { showToast("삭제 실패: " + (r.error || "알 수 없는 오류")); return; }
    showToast("공지 삭제됨");
    if (editingId === id) resetDraft();
    loadNotices();
  };

  const exportData = () => {
    const blob = new Blob([JSON.stringify({ user: currentUser, invites, notices }, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `1ilbi-data-${new Date().toISOString().slice(0,10)}.json`;
    a.click(); URL.revokeObjectURL(url);
  };

  const totalIssued = invites.length;
  const totalUsed = invites.filter(i => i.usedAt).length;
  const totalActive = invites.filter(i => i.lastActive && (Date.now() - new Date(i.lastActive).getTime()) < 24*60*60*1000).length;

  return (
    <>
      <div className="topbar">
        <div className="brand">유버디 컴퍼니 · <em>운영자 뷰</em></div>
        <div className="pill">BUDDY · OPERATOR</div>
        <div className="spacer" />
        <a className="toggle" href="mainboard.html?dev=1">▶ 플레이어 + Dev 패널</a>
        <a className="toggle" href="mainboard.html">▶ 플레이어 (일반)</a>
        <a className="toggle" href="dev.html">↩ 개발 런처</a>
        <a className="toggle" onClick={() => {
          if (!confirm("로그아웃 하시겠어요?")) return;
          const keysToRemove = [];
          for (let i = 0; i < localStorage.length; i++) {
            const k = localStorage.key(i);
            if (k === "__OD_USER" || k.startsWith("__OD_TASKS_") || k.startsWith("__OD_TOUR_")) {
              keysToRemove.push(k);
            }
          }
          keysToRemove.forEach(k => localStorage.removeItem(k));
          window.location.href = "onboarding.html";
        }} style={{ cursor: "pointer", borderColor: "rgba(216,90,42,0.4)", color: "#F38A5C" }}>
          🚪 로그아웃
        </a>
      </div>

      <div className="wrap">
        <div className="h1">안녕하세요 유버디. <em>회사 현황</em>입니다.</div>
        <div className="lead">
          {supaEnabled
            ? "🟢 Supabase 연결, 모든 사용자 실시간 추적 중."
            : "⚪ Supabase 미연결, lib/supabase-config.js 설정 필요. 지금은 이 기기 데이터만 보임."}
        </div>

        {/* ★ 학습 데이터 조회 (2026-05-19 추가): 사용자별 N일차 영작·노트·일지 즉시 보기 */}
        {supaEnabled && <LearningQueryCard />}

        <div className="section">
          <div className="section-title">📨 공지·이벤트 발송</div>
          <div className="grid-2">
            <div className="card">
              {editingId ? (
                <div style={{ background: '#FBEEDF', border: '1px solid #E7C9A3', borderRadius: 6, padding: '8px 12px', marginBottom: 12, fontSize: 12, color: '#8A5A2B', display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                  <span>✏️ 수정 모드, 기존 공지를 고치는 중</span>
                  <button onClick={resetDraft} style={{ background: 'none', border: 'none', color: '#A8462F', fontSize: 12, cursor: 'pointer', textDecoration: 'underline' }}>새 공지 작성</button>
                </div>
              ) : null}
              <div className="form-row">
                <label>유형</label>
                <select value={draftType} onChange={e => setDraftType(e.target.value)}>
                  <option value="notice">전사 공지</option>
                  <option value="event">이벤트 안내</option>
                  <option value="ceo">버디 톡 (유버디)</option>
                  <option value="event-novelty">돌발 이벤트 (P3)</option>
                </select>
              </div>
              <div className="form-row">
                <label>제목</label>
                <input value={draftTitle} onChange={e => setDraftTitle(e.target.value)} placeholder="예: [전사] 5월 워크샵" />
              </div>
              <div className="form-row">
                <label>본문</label>
                <textarea rows={5} value={draftBody} onChange={e => setDraftBody(e.target.value)} placeholder="이번 달 전사 워크샵은…" />
              </div>
              <label style={{ display: 'flex', alignItems: 'center', gap: 8, fontSize: 13, color: '#5C4A36', cursor: 'pointer', margin: '4px 0 12px' }}>
                <input type="checkbox" checked={draftPopup} onChange={e => setDraftPopup(e.target.checked)} style={{ width: 16, height: 16 }} />

              </label>
              <button className="btn primary" onClick={addNotice} disabled={!draftTitle.trim() || !draftBody.trim()}>
                {editingId ? "✏️ 수정 저장" : "📨 모든 입사자에게 발송"}
              </button>
            </div>
            <div className="card">
              <div className="title">발송한 공지 ({notices.length})</div>
              <div style={{ fontSize: 11, color: '#8A7964', marginBottom: 8 }}>공지를 클릭하면 전체 내용을 확인하고 수정할 수 있어요.</div>
              {notices.length === 0 ? (
                <div className="empty" style={{ padding: 16 }}>아직 공지 없음.</div>
              ) : (
                <div style={{ maxHeight: 360, overflowY: 'auto', paddingRight: 4 }}>
                {notices.map(n => {
                const reads = readCounts['db-' + n.id] || 0;
                return (
                <div
                  key={n.id}
                  className="notice-item"
                  onClick={() => setPreviewNotice(n)}
                  style={{ position: 'relative', cursor: 'pointer', outline: editingId === n.id ? '2px solid #D8923A' : 'none' }}
                >
                  <div className="meta">[{n.type}]{n.popup ? ' · 🔔팝업' : ''} · {n.at ? new Date(n.at).toLocaleString('ko-KR') : ''}</div>
                  <strong>{n.title}</strong>
                  <div style={{ color: '#5C4A36', marginTop: 4, fontSize: 12, lineHeight: 1.5 }}>{(n.body || '').slice(0, 100)}{(n.body || '').length > 100 ? "…" : ""}</div>
                  <div style={{ marginTop: 6, fontSize: 11, color: '#6E8A5C', fontWeight: 700 }}>👁 확인 {reads}명</div>
                  <button
                    onClick={(e) => { e.stopPropagation(); removeNotice(n.id); }}
                    style={{ position: 'absolute', top: 10, right: 10, background: 'none', border: '1px solid #D9C9A8', color: '#A8462F', borderRadius: 5, fontSize: 11, padding: '2px 8px', cursor: 'pointer' }}
                  >삭제</button>
                </div>
                );
              })}
                </div>
              )}
            </div>
          </div>
        </div>

        {/* 💬 피드백 모아보기 (사용자가 보낸 의견) */}
        {supaEnabled && <FeedbackInbox />}

        {/* Supabase 전체 사용자 */}
        {supaEnabled && (
          <div className="section">
            <div className="section-title">🌐 전체 사용자 (Supabase)
              <button className="btn btn-ghost btn-mini" style={{ marginLeft: 12, padding: '2px 10px', fontSize: 11 }} onClick={refreshSupabase} disabled={supaLoading}>
                {supaLoading ? "로딩…" : "↻ 새로고침"}
              </button>
            </div>
            {supaStats && (
              <div className="grid-2" style={{ marginBottom: 14 }}>
                <div className="card">
                  <div className="title">전체 가입자</div>
                  <div style={{ fontSize: 28, fontWeight: 900 }}>{supaStats.total_users || 0}</div>
                  <div style={{ fontSize: 11, color: '#8A7964', marginTop: 6 }}>
                    24h 활성 {supaStats.active_24h || 0} · 7d 활성 {supaStats.active_7d || 0}
                  </div>
                </div>
                <div className="card">
                  <div className="title">평균 진도 / 마일스톤</div>
                  <div style={{ fontSize: 28, fontWeight: 900 }}>Day {Math.round(supaStats.avg_day || 1)}</div>
                  <div style={{ fontSize: 11, color: '#8A7964', marginTop: 6 }}>
                    Day14 도달 {supaStats.reached_day14 || 0} · Day30 {supaStats.reached_day30 || 0} · Day180 {supaStats.reached_day180 || 0}
                  </div>
                </div>
              </div>
            )}
            {supaUsers.length > 0 && (() => {
              const now = new Date();
              const real = supaUsers.filter(u => !u.is_operator && !u.is_dev_mode && u.email !== 'youbuddy.co@gmail.com');
              const ends = u => u.membership_ends_at ? new Date(u.membership_ends_at) : null;
              const isMember = u => u.cohort === 'member';
              const activePaid = real.filter(u => isMember(u) && !u.membership_cancel_reason && (ends(u) ? ends(u) > now : true));
              const canceling  = real.filter(u => u.membership_cancel_reason && ends(u) && ends(u) > now);
              const expired    = real.filter(u => isMember(u) && ends(u) && ends(u) <= now);
              const beta       = real.filter(u => u.is_pilot_hire && !isMember(u) && (!ends(u) || ends(u) > now));
              const cell = (label, n, color) => (
                <div style={{ flex: '1 1 110px', background: '#fff', border: '1px solid #E8DFCB', borderRadius: 8, padding: '12px 14px' }}>
                  <div style={{ fontSize: 11, color: '#8A7964', fontWeight: 700, marginBottom: 4 }}>{label}</div>
                  <div style={{ fontSize: 24, fontWeight: 900, color }}>{n}<span style={{ fontSize: 12, color: '#A8997F', fontWeight: 700 }}>명</span></div>
                </div>
              );
              return (
                <div style={{ marginBottom: 16 }}>
                  <div style={{ fontSize: 12, fontWeight: 800, color: '#8A7964', marginBottom: 8 }}>📊 멤버십 현황 (운영자·테스트 제외 {real.length}명)</div>
                  <div style={{ display: 'flex', flexWrap: 'wrap', gap: 8 }}>
                    {cell('🟢 정상 활성', activePaid.length, '#2D6E3A')}
                    {cell('🟡 취소 예정', canceling.length, '#B8431A')}
                    {cell('🔴 만료·종료', expired.length, '#993C1D')}
                    {cell('🧪 베타', beta.length, '#3D4DA8')}
                  </div>
                </div>
              );
            })()}
            {supaUsers.length > 0 && (
              <details style={{ marginBottom: 16 }}>
                <summary style={{ cursor: 'pointer', fontWeight: 800, fontSize: 14, padding: '12px 16px', background: '#FFF3D6', color: '#8C6510', borderRadius: 8, userSelect: 'none' }}>
                  🏆 학습 순위 / 최근 활동 (펼쳐보기)
                </summary>
                <div className="card" style={{ padding: 0, marginTop: 8 }}>
                  {(() => {
                    const now = new Date();

                      if (!d) return '활동 없음';

                </div>
              </div>
              <div style={{ marginTop: 16, fontSize: 14, lineHeight: 1.75, color: '#2A2118', whiteSpace: 'pre-wrap', wordBreak: 'keep-all' }}>
                {previewNotice.body}
              </div>
              <div style={{ display: 'flex', gap: 8, marginTop: 22 }}>
                <button
                  className="btn primary"
                  onClick={() => { startEditNotice(previewNotice); setPreviewNotice(null); }}
                >✏️ 이 공지 수정하기</button>
                <button className="btn btn-ghost" onClick={() => setPreviewNotice(null)}>닫기</button>
              </div>
            </div>
          </div>
        </div>
      )}

      {toast && <div className="copy-toast">{toast}</div>}
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
