<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap');
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Noto Sans KR', sans-serif; background: #F4EFE3; color: #2A1F14; min-height: 100vh; }
.topbar {
  background: #2A1F14; color: #F4EFE3; padding: 16px 28px;
  display: flex; align-items: center; gap: 12px;
  position: sticky; top: 0; z-index: 10;
  border-bottom: 1px solid #5C4A36;
  flex-wrap: wrap;
}
.topbar .brand { font-weight: 900; font-size: 16px; letter-spacing: -0.01em; }
.topbar .brand em { color: #F38A5C; font-style: normal; font-weight: 900; }
.topbar .pill { font-size: 11px; font-weight: 700; letter-spacing: 0.1em; padding: 4px 10px; border-radius: 99px; background: rgba(243,138,92,0.18); color: #F38A5C; }
.topbar .spacer { flex: 1; }
.toggle {
  display: inline-flex; align-items: center; gap: 8px; cursor: pointer;
  font-size: 12px; color: #DBCFB4; padding: 6px 12px; border: 1px solid #5C4A36;
  border-radius: 99px; transition: all 0.15s; text-decoration: none;
}
.toggle:hover { background: rgba(255,255,255,0.06); }
.wrap { max-width: 1100px; margin: 0 auto; padding: 32px 28px; }
.h1 { font-size: 24px; font-weight: 900; margin-bottom: 6px; letter-spacing: -0.02em; }
.h1 em { font-style: normal; font-weight: 900; color: #D85A2A; }
.lead { font-size: 13px; color: #5C4A36; line-height: 1.6; margin-bottom: 28px; }

.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 24px; }
.section { margin-bottom: 36px; }
.section-title { font-size: 11px; letter-spacing: 0.16em; font-weight: 800; color: #8A7964; text-transform: uppercase; margin-bottom: 12px; }

.card { background: white; border: 1px solid #C9BBA0; border-radius: 8px; padding: 20px; }
.card.warn { background: #FFF7E8; border-color: #E8C99B; }
.card .title { font-size: 13px; color: #8A7964; font-weight: 700; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.08em; }

.user-row { display: grid; grid-template-columns: 1.4fr 130px 80px 200px 100px; gap: 14px; padding: 14px 16px; border-bottom: 1px solid #E8DFCB; align-items: center; font-size: 13px; }
.user-row .col-progress { font-size: 12px; line-height: 1.5; }
.user-row .col-progress .progress-day { font-weight: 800; color: #2A1F14; font-size: 13px; }
.user-row .col-progress .progress-last { font-size: 11px; color: #8A7964; margin-top: 2px; }
.user-row .col-type { display: flex; gap: 4px; flex-wrap: wrap; }
.user-row .col-payment { font-size: 12px; line-height: 1.5; }
.user-row .col-payment .pay-status { font-weight: 800; font-size: 12px; }
.user-row .col-payment .pay-meta { font-size: 11px; color: #5C4A36; margin-top: 2px; }
.user-row.head { font-weight: 700; font-size: 11px; color: #8A7964; text-transform: uppercase; letter-spacing: 0.06em; background: #FAF6EB; }
.user-row .actions { display: flex; gap: 6px; }
.empty { padding: 28px; text-align: center; color: #8A7964; font-size: 13px; }

.code-pill {
  display: inline-flex; align-items: center; gap: 6px;
  font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 700;
  background: #2A1F14; color: #F4EFE3;
  padding: 4px 10px; border-radius: 4px;
  cursor: pointer;
}
.code-pill:hover { background: #1a120a; }
.code-pill.used { background: #E8DFCB; color: #8A7964; cursor: default; }
.status-pill {
  display: inline-block; font-size: 11px; font-weight: 700;
  padding: 3px 8px; border-radius: 99px;
  background: #FAF6EB; color: #8A7964;
}
.status-pill.active { background: #E8F4E0; color: #2D8A3E; }

textarea, input, select {
  width: 100%; padding: 10px 12px; font-size: 13px; font-family: inherit;
  background: #FAF6EB; border: 1px solid #C9BBA0; border-radius: 6px; color: #2A1F14;
}
textarea:focus, input:focus, select:focus { outline: none; border-color: #D85A2A; }
label { display: block; font-size: 11px; font-weight: 700; color: #8A7964; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 6px; }
.form-row { margin-bottom: 14px; }

.btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; font-size: 12px; font-weight: 700; background: #2A1F14; color: #F4EFE3; border: none; border-radius: 6px; cursor: pointer; font-family: inherit; }
.btn:hover:not(:disabled) { background: #1a120a; }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }
.btn.primary { background: #D85A2A; }
.btn.primary:hover { background: #B8431A; }
.btn-ghost { background: transparent; color: #5C4A36; border: 1px solid #C9BBA0; }
.btn-ghost:hover { background: #FAF6EB; color: #2A1F14; }
.btn-mini { padding: 4px 8px; font-size: 11px; font-weight: 600; }
.btn-danger { background: #B8431A; color: white; }
.btn-danger:hover { background: #963513; }

.notice-item { background: #FAF6EB; padding: 12px 14px; border-radius: 6px; border: 1px solid #E8DFCB; font-size: 13px; margin-bottom: 8px; }
.notice-item .meta { font-size: 11px; color: #8A7964; margin-bottom: 4px; }

.copy-toast {
  position: fixed; bottom: 24px; right: 24px;
  background: #2A1F14; color: #F4EFE3;
  padding: 12px 18px; border-radius: 8px;
  font-size: 13px; font-weight: 600;
  box-shadow: 0 12px 32px rgba(0,0,0,0.2);
  z-index: 100;
}

@media (max-width: 800px) {
  .grid-2 { grid-template-columns: 1fr; }
  .user-row { grid-template-columns: 1fr 130px; gap: 8px; padding: 10px 12px; }
  .user-row > .col-progress, .user-row > .col-type { display: none; }
}

/* ── 시트 뷰 (전체 설문·피드백, 읽기 전용) ── */
.sheet-overlay { position: fixed; inset: 0; background: rgba(42,31,20,0.55); z-index: 900; display: flex; align-items: stretch; justify-content: center; padding: 18px; }
.sheet { background: #FFFDF8; border-radius: 10px; width: 100%; max-width: 1400px; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 14px 40px rgba(0,0,0,0.3); }
.sheet-top { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid #E6DCC8; background: #F7F1E3; }
.sheet-top h3 { margin: 0; font-size: 14px; font-weight: 800; color: #2A1F14; }
.sheet-top input { flex: 1; max-width: 320px; font-family: inherit; font-size: 12px; padding: 6px 10px; border: 1px solid #C9BBA0; border-radius: 6px; background: #fff; }
.sheet-top .cnt { font-size: 11px; color: #8A7964; font-variant-numeric: tabular-nums; }
.sheet-body { flex: 1; overflow: auto; background: #fff; }
.sheet-body table { border-collapse: collapse; min-width: 100%; font-size: 12px; }
.sheet-body th, .sheet-body td { border: 1px solid #E6DCC8; padding: 6px 9px; vertical-align: top; text-align: left; max-width: 420px; }
.sheet-body th { position: sticky; top: 0; background: #F0E8D5; color: #5C4A36; font-size: 11px; font-weight: 800; letter-spacing: 0.03em; white-space: nowrap; cursor: pointer; user-select: none; z-index: 1; }
.sheet-body th:hover { background: #E6DCC8; }
.sheet-body td { white-space: pre-wrap; word-break: break-word; line-height: 1.5; color: #2A1F14; }
.sheet-body td.num { font-variant-numeric: tabular-nums; white-space: nowrap; color: #5C4A36; }
.sheet-body td.rowno { color: #B8AA90; text-align: right; white-space: nowrap; background: #FCFAF4; font-size: 11px; }
.sheet-body tbody tr:nth-child(even) td { background: #FCFAF4; }
.sheet-body tbody tr:hover td { background: #FFF6E8; }
.sheet-tabs { display: flex; gap: 2px; padding: 6px 10px 0; background: #EFE7D6; border-top: 1px solid #E6DCC8; }
.sheet-tab { font-family: inherit; font-size: 12px; font-weight: 700; padding: 7px 14px; border: 1px solid #D9CDB3; border-bottom: none; border-radius: 6px 6px 0 0; background: #E6DCC8; color: #6B5A45; cursor: pointer; }
.sheet-tab.on { background: #FFFDF8; color: #2A1F14; }
.sheet-tab small { font-weight: 600; color: #8A7964; margin-left: 5px; }
.sheet-empty { padding: 40px; text-align: center; color: #8A7964; font-size: 13px; }
</style>

<body>

<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState, useEffect } = React;

const KEY_INVITES = '__OD_INVITES';
const KEY_USER    = '__OD_USER';
const KEY_NOTICES = '__OD_NOTICES';

const load = (k, def) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : def; } catch(e) { return def; } };
const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch(e) {} };

function genCode() {
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let c = '';
  for (let i = 0; i < 4; i++) c += chars[Math.floor(Math.random() * chars.length)];
  return 'PILOT-' + c;
}

// ============================================================
// ★ 📥 Latpeed CSV 동기화 (2026-08-06 추가)
// Latpeed가 자동갱신 결제엔 웹훅을 안 쏘므로, 월 1회 CSV 붙여넣기로 동기화.
// 구독 중 → 다음 결제일로 연장 + 해지마커 해제 / 구독 취소·종료 → 종료일 + 해지마커.
// 미리보기에서 체크 해제 가능 (재량 연장해준 분은 해제하고 반영).
// ============================================================
function CsvSyncPanel({ supaUsers, onDone }) {
  const [raw, setRaw] = useState("");
  const [plan, setPlan] = useState(null);
  const [busy, setBusy] = useState(false);
  const [result, setResult] = useState("");

  const kdate = (s) => {
    s = (s || "").trim();
    if (!s || s === "-") return null;
    const p = s.split(/\s+/)[0].split(".").map(x => x.trim()).filter(Boolean);   // "26.09.04 10:15" 처럼 시각이 붙어도 날짜만
    if (p.length < 3) return null;
    return (p[0].length === 4 ? p[0] : "20" + p[0]) + "-" + p[1].padStart(2, "0") + "-" + p[2].padStart(2, "0");
  };
  // 결제일 + 1개월 = 다음 결제일 (Latpeed 월 구독). 결제 내역 표를 붙여넣었을 때 만료일 계산용.
  const plusMonth = (ymd) => { const d = new Date(ymd + "T00:00:00+09:00"); d.setMonth(d.getMonth() + 1); return d.toLocaleDateString("en-CA", { timeZone: "Asia/Seoul" }); };

  const build = () => {
    setResult("");
    const lines = raw.split(/\r?\n/).filter(l => l.trim());
    if (lines.length < 2) { setResult("CSV 내용이 비어있어요. 헤더 포함 전체를 붙여넣어 주세요."); setPlan(null); return; }
    // 따옴표 감싼 CSV("김재희","...")와 일반 CSV, 그리고 화면 표를 복사해 붙인 탭 구분(TSV)까지 지원 (2026-09-05)
    const tabbed = lines[0].indexOf("\t") >= 0;
    const split = (l) => (tabbed ? l.split("\t") : l.split(",")).map(x => x.trim().replace(/^"+|"+$/g, "").trim());
    const hdr = split(lines[0]);
    const idx = (name) => hdr.findIndex(h => h.replace(/\s+/g, "") === name || h.replace(/\s+/g, "").includes(name));
    const iName = idx("이름"), iEmail = idx("이메일"), iState = idx("상태"),
          iNext = idx("다음결제일"), iCancel = idx("취소예정일"), iEnd = idx("종료일"),
          iPaidAt = idx("일시"), iAmount = idx("결제금액");
    if (iEmail < 0 || iState < 0 || hdr.length < 3) { setResult("헤더에서 이메일/상태 컬럼을 못 찾았어요. Latpeed CSV를 그대로 붙여넣었는지 확인해주세요."); setPlan(null); return; }
    // 결제 내역 표(상태 = 결제 완료, 일시)를 붙여넣은 경우: 이메일별 가장 최근 결제만 남기고, 결제일 + 1개월을 만료일로
    const isPaymentSheet = iPaidAt >= 0 && iNext < 0;
    let unknownStates = new Set(), matched = 0;
    const latestPaid = {};
    if (isPaymentSheet) {
      for (let li = 1; li < lines.length; li++) {
        const c = split(lines[li]); const email = (c[iEmail] || "").toLowerCase().trim(); const d = kdate(c[iPaidAt]);
        if (!email || !d) continue;
        if ((c[iState] || "").replace(/\s+/g, "") !== "결제완료") { unknownStates.add(c[iState] || "(빈 상태)"); continue; }
        if (!latestPaid[email] || latestPaid[email] < d) latestPaid[email] = d;
      }
    }
    const byEmail = {};
    (supaUsers || []).forEach(u => { if (u.email) byEmail[String(u.email).toLowerCase().trim()] = u; });
    const out = [];
    for (let li = 1; li < lines.length; li++) {
      const c = split(lines[li]);
      const email = (c[iEmail] || "").toLowerCase().trim();
      if (!email || email.indexOf("@") < 0) continue;
      if (email === "youbuddy.co@gmail.com") continue;
      const name = c[iName] || email;
      const st = c[iState] || "";
      const u = byEmail[email];
      if (!u) {
        if (st === "구독 중" || (isPaymentSheet && latestPaid[email])) out.push({ email, name, st, noAccount: true });
        continue;
      }
      matched++;
      if (u.is_operator || u.is_dev_mode) continue;
      const dbEnd = (u.membership_ends_at || "").slice(0, 10);
      const hasCancel = !!u.membership_cancel_at;
      if (isPaymentSheet) {
        const paid = latestPaid[email];
        if (!paid || kdate(c[iPaidAt]) !== paid) continue;   // 같은 이메일의 옛 결제 행은 건너뜀
        const want = plusMonth(paid);
        if (dbEnd < want || u.cohort !== "member" || u.unlocked === false || hasCancel) {
          out.push({ email, name, st: "결제 완료 " + (c[iAmount] || ""),
            detail: "결제 " + paid + " → 만료 " + (dbEnd || "없음") + " → " + want + (hasCancel ? " · 해지마커 해제" : ""),
            patch: { membership_ends_at: want + "T23:59:59+09:00", cohort: "member", unlocked: true, membership_cancel_at: null },
            checked: true });
        }
        continue;
      }
      if (st !== "구독 중" && st !== "구독 취소" && st !== "구독 종료") unknownStates.add(st || "(빈 상태)");
      if (st === "구독 중") {
        const want = kdate(c[iNext]);
        if (!want) continue;
        if (dbEnd !== want || u.cohort !== "member" || u.unlocked === false || hasCancel) {
          out.push({ email, name, st,
            detail: "만료 " + (dbEnd || "없음") + " → " + want + (hasCancel ? " · 해지마커 해제" : ""),
            patch: { membership_ends_at: want + "T23:59:59+09:00", cohort: "member", unlocked: true, membership_cancel_at: null },
            checked: true });
        }
      } else if (st === "구독 취소" || st === "구독 종료") {
        const want = kdate(c[iEnd]) || kdate(c[iCancel]);
        if (!want) continue;
        if (dbEnd !== want || !hasCancel) {
          const patch = { membership_ends_at: want + "T23:59:59+09:00", cohort: "member" };
          if (!hasCancel) patch.membership_cancel_at = new Date().toISOString();
          out.push({ email, name, st,
            detail: "종료일 " + want + (hasCancel ? "" : " · 해지마커 세팅") + (dbEnd && dbEnd !== want ? " (DB " + dbEnd + ")" : ""),
            patch, checked: true });
        }
      }
    }
    setPlan(out);
    if (out.filter(x => !x.noAccount).length === 0) {
      if (matched === 0) setResult("붙여넣은 표에서 DB 계정과 맞는 이메일이 없어요. 컬럼 구분(쉼표/탭)이나 이메일을 확인해주세요.");
      else if (unknownStates.size) setResult("상태 값(" + Array.from(unknownStates).slice(0, 3).join(", ") + ")을 못 알아봤어요. 멤버 CSV는 '구독 중/구독 취소/구독 종료', 결제 내역 표는 '결제 완료'만 처리해요.");
      else setResult("변경할 게 없어요. DB가 이미 Latpeed와 일치해요 ✓" + (isPaymentSheet ? " (결제 내역 표 기준, 결제일 + 1개월)" : ""));
    }
  };

  const toggle = (i) => setPlan(p => p.map((x, j) => j === i ? { ...x, checked: !x.checked } : x));

  const apply = async () => {
    const targets = (plan || []).filter(x => x.checked && x.patch);
    if (targets.length === 0) return;
    if (!confirm(targets.length + "명의 멤버십 상태를 반영할까요?\n(구독 중 → 연장 / 취소·종료 → 종료일 + 해지마커)")) return;
    setBusy(true);
    let ok = 0; const fails = [];
    for (const t of targets) {
      const r = await window.OD.syncMembership(t.email, t.patch);
      if (r && r.ok) ok++; else fails.push(t.name + "(" + (r && r.error || "?") + ")");
    }
    setBusy(false);
    setResult("✅ " + ok + "건 반영 완료" + (fails.length ? " · 실패 " + fails.length + "건: " + fails.join(", ") : ""));
    setPlan(null); setRaw("");
    if (onDone) onDone();
  };

  const noAcc = (plan || []).filter(x => x.noAccount);
  const changes = (plan || []).filter(x => !x.noAccount);

  return (
    <details style={{ marginBottom: 16 }}>
      <summary style={{ cursor: 'pointer', fontWeight: 800, fontSize: 14, padding: '12px 16px', background: '#E4EEF7', color: '#1E4B7A', borderRadius: 8, userSelect: 'none' }}>
        📥 Latpeed CSV 동기화 (월 1회, 갱신 웹훅 미지원 보완)
      </summary>
      <div className="card" style={{ marginTop: 8, padding: 16 }}>
        <div style={{ fontSize: 12, color: '#8A7964', lineHeight: 1.6, marginBottom: 8 }}>
          Latpeed 관리자에서 멤버 CSV를 내려받아 <b>전체 내용을 그대로 붙여넣고</b> [대조하기]를 누르세요. 결제 내역 표(이름·이메일·상태·결제금액·일시)를 복사해 붙여도 돼요. 이땐 결제일 + 1개월이 만료일이에요.<br/>
          재량으로 기간을 늘려준 분은 미리보기에서 <b>체크를 해제</b>한 뒤 반영하세요.
        </div>
        <textarea value={raw} onChange={e => setRaw(e.target.value)} rows={5}
          placeholder={"이름,이메일,전화번호,...,상태,결제일시,다음 결제일,취소 예정일,종료일\n김OO,ab@cd.com,...,구독 중,26.08.20 21:20,26.09.20,-,-"}
          style={{ width: '100%', boxSizing: 'border-box', fontSize: 11, fontFamily: 'JetBrains Mono, monospace', border: '1px solid #E8DFCB', borderRadius: 8, padding: 10, background: '#FFFDF7' }} />
        <div style={{ display: 'flex', gap: 8, marginTop: 8 }}>
          <button className="btn" onClick={build} disabled={busy}>🔍 대조하기</button>
          {changes.length > 0 && (
            <button className="btn btn-primary" onClick={apply} disabled={busy}>
              {busy ? "반영 중..." : "✅ 선택 " + changes.filter(x => x.checked).length + "명 반영"}
            </button>
          )}
        </div>
        {result && <div style={{ marginTop: 10, fontSize: 12.5, fontWeight: 700, color: '#2D6E3A' }}>{result}</div>}
        {changes.length > 0 && (
          <div style={{ marginTop: 12, display: 'grid', gap: 6 }}>
            {changes.map((x, i) => (

// 📋 의견 설문 집계 (category=survey 응답을 한눈에)
// 설문 메시지 1건 파싱: 별점 / 한마디 정의 / 그만둘 이유 / 계속 쓸 조건
function parseSurveyRow(it) {
  const msg = it.message || '';
  const grab = (label) => {
    const re = new RegExp(label + ':\\s*([\\s\\S]*?)(?=\\n[^\\n:]{2,20}:|$)');
    const m = re.exec(msg);
    const v = m ? m[1].trim() : '';
    return (!v || v === '(없음)' || v === '(미선택)') ? '' : v;
  };
  const r = /\((\d)\/5\)/.exec(msg);
  return {
    id: it.id,
    who: it.name || '익명',
    email: it.email || '',
    day: it.day || null,
    at: it.created_at,
    rating: r ? Number(r[1]) : null,
    oneLiner: grab('한마디로 정의'),
    quit: grab('그만둔다면 이유'),
    keep: grab('있으면 계속 쓸 것'),
  };
}

// 💬 피드백 모아보기 카드 (사용자가 mainboard 우상단 버튼으로 보낸 피드백 표시)
// ============================================================
// 시트 뷰: 설문 · 피드백 · Day1 설문을 엑셀처럼 (읽기 전용, 하단 탭)
// 데이터는 이미 운영자 화면이 받아오는 feedback 테이블 + Day1 설문 RPC. 화면에서 편집 불가.
// ============================================================
function _fmtAt(iso) {
  if (!iso) return '';
  try { const d = new Date(iso); return d.toLocaleString('ko-KR', { timeZone: 'Asia/Seoul', year: '2-digit', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' }); } catch (e) { return String(iso); }
}
function _csvDownload(filename, headers, rows) {
  const esc = (v) => { const t = v == null ? '' : String(v); return /[",\n]/.test(t) ? '"' + t.replace(/"/g, '""') + '"' : t; };
  const lines = [headers.map(esc).join(',')].concat(rows.map(r => r.map(esc).join(',')));
  const blob = new Blob(['﻿' + lines.join('\n')], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
const _CAT_KO = { bug: '오류', suggestion: '제안', content: '콘텐츠', general: '일반', survey: '설문' };

function SheetView({ items, onClose }) {
  const [tab, setTab] = React.useState('survey');
  const [q, setQ] = React.useState('');
  const [sort, setSort] = React.useState({ key: '_at', dir: -1 });
  const [day1, setDay1] = React.useState({ rows: [], loading: true, error: '' });

  React.useEffect(() => {
    let alive = true;
    (async () => {
      const me = (() => { try { return JSON.parse(localStorage.getItem('__OD_USER') || 'null')?.email || ''; } catch (e) { return ''; } })();
      if (!window.OD?.fetchSurveyResponses) { setDay1({ rows: [], loading: false, error: '연결 안 됨' }); return; }
      const r = await window.OD.fetchSurveyResponses(me, 2000);
      if (!alive) return;
      setDay1({ rows: r.rows || [], loading: false, error: r.ok ? '' : (r.error || '불러오기 실패') });
    })();
    return () => { alive = false; };
  }, []);

  // 탭별 컬럼/행 구성. 각 행은 {_at, ...} 객체, 컬럼은 {key, label, num?}
  const survey = React.useMemo(() => {
    const rows = (items || []).filter(it => it.category === 'survey').map(it => {
      const p = parseSurveyRow(it);
      return { _at: it.created_at, 날짜: _fmtAt(it.created_at), 이름: p.who, 이메일: p.email, Day: p.day || '', 만족도: p.rating || '', '한마디로 정의': p.oneLiner, '그만둔다면 이유': p.quit, '있으면 계속 쓸 것': p.keep, 원문: it.message || '' };
    });
    return { cols: ['날짜', '이름', '이메일', 'Day', '만족도', '한마디로 정의', '그만둔다면 이유', '있으면 계속 쓸 것', '원문'], num: new Set(['Day', '만족도']), rows };
  }, [items]);

  const fb = React.useMemo(() => {
    const rows = (items || []).filter(it => it.category !== 'survey').map(it => ({
      _at: it.created_at, 날짜: _fmtAt(it.created_at), 이름: it.name || '익명', 이메일: it.email || '', Day: it.day || '',
      분류: _CAT_KO[it.category] || it.category || '', 내용: it.message || '',
      상태: it.resolved ? '해결' : (it.replied_at ? '답장함' : '미답장'), 답장일: _fmtAt(it.replied_at), 완료일: _fmtAt(it.completed_at),
    }));
    return { cols: ['날짜', '이름', '이메일', 'Day', '분류', '내용', '상태', '답장일', '완료일'], num: new Set(['Day']), rows };
  }, [items]);

  const d1 = React.useMemo(() => {
    const keys = [];
    (day1.rows || []).forEach(r => Object.keys(r.responses || {}).forEach(k => { if (!keys.includes(k)) keys.push(k); }));
    const rows = (day1.rows || []).map(r => {
      const o = { _at: r.created_at, 날짜: _fmtAt(r.created_at), 이메일: r.email || '', 설문키: r.survey_key || '' };
      keys.forEach(k => { const v = (r.responses || {})[k]; o[k] = (v && typeof v === 'object') ? JSON.stringify(v) : (v == null ? '' : String(v)); });
      return o;
    });
    return { cols: ['날짜', '이메일', '설문키', ...keys], num: new Set(), rows };
  }, [day1.rows]);

  const cur = tab === 'survey' ? survey : (tab === 'fb' ? fb : d1);
  const needle = q.trim().toLowerCase();
  const filtered = needle ? cur.rows.filter(r => cur.cols.some(c => String(r[c] ?? '').toLowerCase().includes(needle))) : cur.rows;
  const sorted = [...filtered].sort((a, b) => {
    const k = sort.key; const va = a[k] ?? '', vb = b[k] ?? '';
    if (k === '_at') return (Date.parse(va || 0) - Date.parse(vb || 0)) * sort.dir;
    const na = Number(va), nb = Number(vb);
    if (va !== '' && vb !== '' && !isNaN(na) && !isNaN(nb)) return (na - nb) * sort.dir;
    return String(va).localeCompare(String(vb), 'ko') * sort.dir;
  });
  const clickSort = (c) => setSort(s => ({ key: c === '날짜' ? '_at' : c, dir: (s.key === (c === '날짜' ? '_at' : c)) ? -s.dir : -1 }));
  const sortMark = (c) => { const k = c === '날짜' ? '_at' : c; return sort.key === k ? (sort.dir < 0 ? ' ▼' : ' ▲') : ''; };

  const tabLabel = tab === 'survey' ? '설문' : (tab === 'fb' ? '피드백' : 'Day1설문');
  const exportCsv = () => _csvDownload(`1일1비_${tabLabel}_${new Date().toISOString().slice(0, 10)}.csv`, cur.cols, sorted.map(r => cur.cols.map(c => r[c])));

  React.useEffect(() => {
    const onKey = (e) => { if (e.key === 'Escape') onClose(); };
    window.addEventListener('keydown', onKey); return () => window.removeEventListener('keydown', onKey);
  }, [onClose]);

  return (
    <div className="sheet-overlay" onClick={(e) => { if (e.target === e.currentTarget) onClose(); }}>
      <div className="sheet">
        <div className="sheet-top">
          <h3>📊 전체 설문 · 피드백</h3>
          <input value={q} onChange={e => setQ(e.target.value)} placeholder="검색 (이름, 이메일, 내용…)" />
          <span className="cnt">{sorted.length}행{needle ? ` / 전체 ${cur.rows.length}` : ''}</span>
          <span style={{ flex: 1 }} />
          <button className="btn btn-ghost btn-mini" onClick={exportCsv} disabled={!sorted.length}>⬇ CSV 내보내기</button>
          <button className="btn btn-mini" onClick={onClose}>닫기 (Esc)</button>
        </div>
        <div className="sheet-body">
          {tab === 'day1' && day1.loading ? (
            <div className="sheet-empty">Day1 설문 불러오는 중…</div>
          ) : tab === 'day1' && day1.error ? (
            <div className="sheet-empty">Day1 설문을 못 불러왔어요: {day1.error}<br /><small>list_survey_responses RPC(20260904_survey_sheet.sql)가 DB에 있어야 해요.</small></div>
          ) : !sorted.length ? (
            <div className="sheet-empty">{needle ? '검색 결과가 없어요.' : '아직 데이터가 없어요.'}</div>
          ) : (
            <table>
              <thead>
                <tr>
                  <th style={{ width: 36 }}>#</th>
                  {cur.cols.map(c => <th key={c} onClick={() => clickSort(c)} title="클릭해서 정렬">{c}{sortMark(c)}</th>)}
                </tr>
              </thead>
              <tbody>
                {sorted.map((r, i) => (
                  <tr key={i}>
                    <td className="rowno">{i + 1}</td>
                    {cur.cols.map(c => <td key={c} className={cur.num.has(c) || c === '날짜' ? 'num' : ''}>{r[c] ?? ''}</td>)}
                  </tr>
                ))}
              </tbody>
            </table>
          )}
        </div>
        <div className="sheet-tabs">
          <button className={'sheet-tab' + (tab === 'survey' ? ' on' : '')} onClick={() => setTab('survey')}>설문<small>{survey.rows.length}</small></button>
          <button className={'sheet-tab' + (tab === 'fb' ? ' on' : '')} onClick={() => setTab('fb')}>피드백<small>{fb.rows.length}</small></button>
          <button className={'sheet-tab' + (tab === 'day1' ? ' on' : '')} onClick={() => setTab('day1')}>Day1 설문<small>{day1.loading ? '…' : d1.rows.length}</small></button>
        </div>
      </div>
    </div>
  );
}

function FeedbackInbox() {
  const [items, setItems] = React.useState([]);
  const [loading, setLoading] = React.useState(false);
  const [showResolved, setShowResolved] = React.useState(false);
  const [replyTo, setReplyTo] = React.useState(null);    // 답장 모달
  const [completeTo, setCompleteTo] = React.useState(null);  // 작업 완료 모달
  const [sheetOpen, setSheetOpen] = React.useState(false);   // 전체 시트 뷰

  const load = async () => {
    if (!window.OD || !window.OD.enabled || !window.OD.fetchFeedback) return;
    setLoading(true);
    const r = await window.OD.fetchFeedback(1000);  // 시트 뷰에서 전체를 보므로 넉넉히
    if (r.ok) setItems(r.feedback || []);
    setLoading(false);
  };

  React.useEffect(() => {
    let cancelled = false;
    (async () => {
      let tries = 0;
      while ((!window.OD || !window.OD.enabled) && tries++ < 30) {
        await new Promise(r => setTimeout(r, 200));
      }
      if (!cancelled) load();
    })();
    return () => { cancelled = true; };
  }, []);

  const visible = items.filter(it => showResolved || !it.resolved);
  const unresolvedCount = items.filter(it => !it.resolved).length;
  const unrepliedCount  = items.filter(it => !it.resolved && !it.replied_at).length;

  const toggleResolved = async (id, cur) => {
    if (!window.OD?.setFeedbackResolved) return;
    const r = await window.OD.setFeedbackResolved(id, !cur);
    if (r.ok) load();
  };
  const remove = async (id) => {
    if (!window.confirm("이 피드백을 삭제할까요?")) return;
    if (!window.OD?.deleteFeedback) return;
    const r = await window.OD.deleteFeedback(id);
    if (r.ok) load();
  };
  const updateDeadline = async (id, newDate) => {
    if (!window.OD?.setFeedbackDeadline) return;
    const r = await window.OD.setFeedbackDeadline(id, newDate);
    if (r.ok) load();
  };
  // D-day 계산 (마감일 - 오늘)
  const computeDday = (deadline) => {
    if (!deadline) return null;
    const today = new Date(); today.setHours(0,0,0,0);
    const d = new Date(deadline + 'T00:00:00');
    const diff = Math.round((d - today) / 86400000);
    return diff;
  };

  return (
    <div className="section">
      <div className="section-title">
        💬 피드백 모아보기
        <span style={{ marginLeft: 10, fontSize: 11, fontWeight: 800 }}>
          {unrepliedCount > 0 && <span style={{ color: '#A8462F' }}>미답장 {unrepliedCount}건 </span>}
          {unresolvedCount > 0 ? (
            <span style={{ color: '#8A5A2B' }}>· 미해결 {unresolvedCount}건</span>
          ) : (
            <span style={{ color: '#2D6E3A' }}>· 전부 해결됨 ✓</span>
          )}
        </span>
        <button className="btn btn-ghost btn-mini" style={{ marginLeft: 12, padding: '2px 10px', fontSize: 11 }} onClick={load} disabled={loading}>
          {loading ? '로딩…' : '↻ 새로고침'}
        </button>
        <button
          className="btn btn-ghost btn-mini"
          style={{
            marginLeft: 8, padding: '2px 10px', fontSize: 11,
            ...(showResolved ? { background: '#2A1F14', color: '#F4EFE3', borderColor: '#2A1F14' } : {}),
          }}
          onClick={() => setShowResolved(v => !v)}
          title={showResolved ? '처리된 항목 숨기기' : '처리된 항목도 함께 보기'}
        >
          {showResolved ? '✓ 처리된 것 포함' : '처리된 것도 보기'}
        </button>
        <button className="btn btn-ghost btn-mini" style={{ marginLeft: 8, padding: '2px 10px', fontSize: 11 }} onClick={() => setSheetOpen(true)} title="설문·피드백 전체를 표로 보기 (읽기 전용)">
          📊 전체 설문·피드백 시트
        </button>
      </div>
      <SurveySummary items={items} />
      {sheetOpen && <SheetView items={items} onClose={() => setSheetOpen(false)} />}
      <div className="card" style={{ padding: 0 }}>
        {visible.length === 0 ? (
          <div className="empty" style={{ padding: 24 }}>{loading ? '로딩 중...' : '아직 들어온 피드백이 없어요.'}</div>
        ) : visible.map(it => (
          <div key={it.id} style={{
            padding: '14px 18px', borderBottom: '1px solid #E8DFCB',
            opacity: it.resolved ? 0.55 : 1,
          }}>
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 8, flexWrap: 'wrap', gap: 8 }}>
              <div style={{ display: 'flex', gap: 8, alignItems: 'center', flexWrap: 'wrap' }}>
                <span style={{ background: CAT_COLOR[it.category] || '#EFE7D6', padding: '3px 10px', borderRadius: 12, fontSize: 11, fontWeight: 700 }}>
                  {CAT_LABEL[it.category] || it.category}
                </span>
                <span style={{ fontSize: 12, fontWeight: 700 }}>{it.name || '익명'}</span>
                {it.email && <span style={{ fontSize: 11, color: '#8A7964', fontFamily: 'JetBrains Mono, monospace' }}>{it.email}</span>}
                {it.day && <span style={{ fontSize: 11, color: '#8A7964' }}>Day {it.day}</span>}
                <span style={{ fontSize: 11, color: '#8A7964' }}>{new Date(it.created_at).toLocaleString('ko-KR')}</span>
                {it.replied_at && !it.resolved && (
                  <span style={{ fontSize: 10, padding: '2px 8px', background: '#E7EAFC', color: '#3D4DA8', borderRadius: 10, fontWeight: 700 }}>
                    ✉️ 답장 완료 {new Date(it.replied_at).toLocaleDateString('ko-KR', { month: 'numeric', day: 'numeric' })}
                  </span>
                )}
                {it.deadline && !it.resolved && (() => {
                  const d = computeDday(it.deadline);
                  const isUrgent = d !== null && d <= 2;
                  const isPast   = d !== null && d < 0;
                  const bg = isPast ? '#FAEBE6' : (isUrgent ? '#FFE9A6' : '#DDEFD9');
                  const fg = isPast ? '#993C1D' : (isUrgent ? '#8C6510' : '#2D6E3A');
                  const label = isPast ? `⏰ D+${Math.abs(d)} 지남` : (d === 0 ? '⏰ 오늘 마감' : `⏰ D-${d}`);
                  return (
                    <span style={{ fontSize: 10, padding: '2px 8px', background: bg, color: fg, borderRadius: 10, fontWeight: 800 }}>
                      {label} ({it.deadline.slice(5).replace('-', '/')})
                    </span>
                  );
                })()}
                {it.resolved && it.completed_at && (
                  <span style={{ fontSize: 10, padding: '2px 8px', background: '#DDEFD9', color: '#2D6E3A', borderRadius: 10, fontWeight: 700 }}>
                    ✅ 완료 알림 발송 {new Date(it.completed_at).toLocaleDateString('ko-KR', { month: 'numeric', day: 'numeric' })}
                  </span>
                )}
              </div>
              <div style={{ display: 'flex', gap: 6, alignItems: 'center', flexWrap: 'wrap' }}>
                {it.email && !it.resolved && (
                  <button
                    onClick={() => setReplyTo(it)}
                    style={{ fontSize: 11, padding: '3px 10px', background: it.replied_at ? 'transparent' : '#D85A2A', color: it.replied_at ? '#5C4A36' : '#F4EFE3', border: it.replied_at ? '1px solid #C9BBA0' : 'none', borderRadius: 4, cursor: 'pointer', fontFamily: 'inherit', fontWeight: 700 }}
                  >{it.replied_at ? '💬 다시 답장' : '💬 답장하기'}</button>
                )}
                {it.email && !it.resolved && (
                  <button
                    onClick={() => setCompleteTo(it)}
                    title={it.replied_at ? '약속한 작업 완료, 사용자에게 알림' : '답장 없이 바로 해결, 사용자에게 알림'}
                    style={{ fontSize: 11, padding: '3px 10px', background: '#2D8A3E', color: '#F4EFE3', border: 'none', borderRadius: 4, cursor: 'pointer', fontFamily: 'inherit', fontWeight: 700 }}
                  >{it.replied_at ? '✅ 작업 완료' : '✅ 바로 해결'}</button>
                )}
                {!it.resolved && (
                  <input
                    type="date"
                    value={it.deadline || ''}
                    onChange={e => updateDeadline(it.id, e.target.value || null)}
                    title="마감일 수정"
                    style={{ fontSize: 11, padding: '2px 6px', border: '1px solid #C9BBA0', borderRadius: 4, background: 'transparent', color: '#5C4A36', fontFamily: 'inherit' }}
                  />
                )}
                <button
                  onClick={() => toggleResolved(it.id, it.resolved)}
                  style={{ fontSize: 11, padding: '3px 10px', background: it.resolved ? '#DDEFD9' : 'transparent', color: it.resolved ? '#2D6E3A' : '#5C4A36', border: '1px solid #C9BBA0', borderRadius: 4, cursor: 'pointer', fontFamily: 'inherit', fontWeight: 700 }}
                >{it.resolved ? '✓ 해결됨' : '수동 처리'}</button>
                <button
                  onClick={() => remove(it.id)}
                  style={{ fontSize: 11, padding: '3px 10px', background: 'transparent', color: '#A8462F', border: '1px solid #D9C9A8', borderRadius: 4, cursor: 'pointer', fontFamily: 'inherit', fontWeight: 700 }}
                >삭제</button>
              </div>
            </div>
            <div style={{ fontSize: 13, color: '#2A1F14', lineHeight: 1.65, whiteSpace: 'pre-wrap', wordBreak: 'keep-all', background: '#FAF6EB', padding: '10px 14px', borderLeft: '3px solid #D85A2A', borderRadius: 4 }}>
              {it.message}
            </div>
          </div>
        ))}
      </div>
      {replyTo && (
        <FeedbackReplyModal
          target={replyTo}
          allItems={items}
          onClose={() => setReplyTo(null)}
          onSent={() => { setReplyTo(null); load(); }}
        />
      )}
      {completeTo && (
        <FeedbackCompletionModal
          target={completeTo}
          allItems={items}
          onClose={() => setCompleteTo(null)}
          onSent={() => { setCompleteTo(null); load(); }}
        />
      )}
    </div>
  );
}

// 피드백 답장 모달: 해당 사용자의 모든 미해결 피드백을 함께 보여주고 한 번에 답장
function FeedbackReplyModal({ target, allItems, onClose, onSent }) {
  const email = (target.email || '').toLowerCase();
  const sameUserItems = allItems.filter(
    it => !it.resolved && (it.email || '').toLowerCase() === email
  );
  const allIds = sameUserItems.map(it => it.id);

  const defaultTitle = `${target.name || ''}님, 소중한 피드백 정말 감사드려요!`;
  const defaultBody = (() => {
    const name = target.name || '';
    const greet = `${name}님, 안녕하세요! 유버디예요 :)\n\n소중한 피드백 정말정말 감사드려요. ${name}님이 학습하시면서 직접 발견하신 부분을 이렇게 자세히 적어주셔서 정말 큰 도움이 됐어요. 1일1비가 진짜 도움 되는 서비스로 자라려면 ${name}님 같은 분의 피드백이 정말 중요하거든요. 한 분 한 분 보내주시는 내용 다 정성껏 챙겨보고 있어요.\n\n${name}님이 보내주신 의견 정리해봤어요:`;
    const list = sameUserItems
      .map(it => `\n• (Day ${it.day || '-'}, ${CAT_LABEL[it.category] || it.category}) "${it.message}"`)
      .join('');
    const promise = `\n\n주신 내용 다음주 금요일(6/6)까지 반영해서 업데이트해두겠습니다. 학습 흐름에 영향 가는 부분이라 우선순위로 챙길게요!\n\n학습하시다가 또 어색하거나 막히는 부분, "이런 게 있으면 좋겠다" 싶은 거 있으면 언제든 우상단 💬 피드백 버튼으로 편하게 보내주세요. 작은 거라도 다 환영이에요 :)\n\n오늘도 한 단어, 한 줄 챙겨가는 하루 되세요!\n\n유버디 드림 💛`;
    return greet + list + promise;
  })();

  const [title, setTitle] = React.useState(defaultTitle);
  const [body, setBody] = React.useState(defaultBody);
  // 기본 마감일: 가장 가까운 다음주 금요일 (또는 기존 deadline 있으면 그거)
  const _defaultDeadline = (() => {
    const existing = sameUserItems.find(it => it.deadline)?.deadline;
    if (existing) return existing;
    const d = new Date();
    const day = d.getDay();
    const daysUntilFriday = ((5 - day + 7) % 7) || 7;
    d.setDate(d.getDate() + daysUntilFriday);
    return d.toISOString().slice(0, 10);
  })();
  const [deadline, setDeadline] = React.useState(_defaultDeadline);
  const [sending, setSending] = React.useState(false);
  const [copied, setCopied] = React.useState(false);

  const send = async () => {
    if (!title.trim() || !body.trim() || sending) return;
    if (!window.OD?.replyToFeedback) {
      alert('OD.replyToFeedback 함수 없음 (배포 안 됨)');
      return;
    }
    setSending(true);
    const r = await window.OD.replyToFeedback({
      feedbackIds: allIds,
      recipientEmail: email,
      title: title.trim(),
      body: body.trim(),
      deadline: deadline || null,
    });
    setSending(false);
    if (!r.ok) {
      alert('답장 발송 실패: ' + (r.error || ''));
      return;
    }
    alert(`${target.name || email} 님께 사내 메모 발송 + 피드백 ${r.count}건에 답장 기록 + 마감일 ${deadline || '미설정'} ✓`);
    onSent();
  };

  const copyEmail = async () => {
    const text = `${title}\n\n${body}`;
    try {
      await navigator.clipboard.writeText(text);
      setCopied(true);
      setTimeout(() => setCopied(false), 2000);
    } catch (e) {
      // fallback
      const ta = document.createElement('textarea');
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      setCopied(true);
      setTimeout(() => setCopied(false), 2000);
    }
  };

  return (
    <div
      onClick={onClose}
      style={{ position: 'fixed', inset: 0, background: 'rgba(40,30,20,0.55)', display: 'flex', alignItems: 'center', justifyContent: 'center', zIndex: 1000, padding: 20 }}
    >
      <div
        onClick={e => e.stopPropagation()}
        style={{ background: '#F4EFE3', borderRadius: 12, maxWidth: 640, width: '100%', maxHeight: '90vh', overflow: 'auto', boxShadow: '0 20px 50px rgba(0,0,0,0.3)' }}
      >
        <div style={{ background: '#2A2118', color: '#F4EFE3', padding: '14px 20px', borderRadius: '12px 12px 0 0', display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
          <div>
            <div style={{ fontSize: 11, letterSpacing: '0.12em', opacity: 0.7 }}>피드백 답장 작성</div>
            <div style={{ fontSize: 14, fontWeight: 800, marginTop: 2 }}>
              {target.name || '익명'} ({email}) · 미해결 피드백 {sameUserItems.length}건 한번에 처리
            </div>
          </div>
          <button onClick={onClose} style={{ background: 'none', border: 'none', color: '#F4EFE3', fontSize: 18, cursor: 'pointer' }}>✕</button>
        </div>
        <div style={{ padding: '18px 22px' }}>
          <div style={{ fontSize: 11, fontWeight: 800, color: '#8A7964', letterSpacing: '0.1em', marginBottom: 6 }}>받은 피드백 ({sameUserItems.length}건)</div>
          <div style={{ background: '#FAF6EB', border: '1px solid #E8DFCB', borderRadius: 6, padding: '10px 14px', marginBottom: 14, maxHeight: 180, overflow: 'auto' }}>
            {sameUserItems.map(it => (
              <div key={it.id} style={{ fontSize: 12, color: '#2A1F14', lineHeight: 1.55, padding: '6px 0', borderBottom: '1px dashed #D9C9A8' }}>
                <b>Day {it.day || '-'}</b> · {CAT_LABEL[it.category] || it.category}<br/>
                {it.message}
              </div>
            ))}
          </div>

          <div style={{ fontSize: 11, fontWeight: 800, color: '#8A7964', letterSpacing: '0.1em', marginBottom: 6 }}>제목</div>
          <input
            value={title}
            onChange={e => setTitle(e.target.value)}
            style={{ width: '100%', padding: '10px 12px', border: '1px solid #D6C7B0', borderRadius: 6, fontSize: 13, fontFamily: 'inherit', background: '#FFFFFF', marginBottom: 12 }}
          />

          <div style={{ fontSize: 11, fontWeight: 800, color: '#8A7964', letterSpacing: '0.1em', marginBottom: 6 }}>본문 (사내 메모 + 이메일 동일 내용)</div>
          <textarea
            value={body}
            onChange={e => setBody(e.target.value)}
            rows={14}
            style={{ width: '100%', padding: '12px 14px', border: '1px solid #D6C7B0', borderRadius: 6, fontSize: 13, fontFamily: 'inherit', background: '#FFFFFF', lineHeight: 1.65, resize: 'vertical', marginBottom: 14 }}
          />

          <div style={{ fontSize: 11, fontWeight: 800, color: '#8A7964', letterSpacing: '0.1em', marginBottom: 6 }}>📅 마감일 (이번 작업을 언제까지 끝낼 건지)</div>
          <div style={{ display: 'flex', gap: 8, alignItems: 'center', marginBottom: 14 }}>
            <input
              type="date"
              value={deadline}
              onChange={e => setDeadline(e.target.value)}
              style={{ padding: '8px 10px', border: '1px solid #D6C7B0', borderRadius: 6, fontSize: 13, fontFamily: 'inherit', background: '#FFFFFF' }}
            />
            <button onClick={() => setDeadline('')} style={{ fontSize: 11, padding: '6px 10px', background: 'transparent', color: '#8A7964', border: '1px solid #D6C7B0', borderRadius: 4, cursor: 'pointer', fontFamily: 'inherit' }}>마감일 없음</button>
            <span style={{ fontSize: 11, color: '#8A7964' }}>이 피드백 {sameUserItems.length}건 전체에 같은 마감일 적용됩니다. 모닝 브리핑에서 D-day로 표시됨.</span>
          </div>

          <div style={{ background: '#FFF3D6', border: '1px solid #E7C9A3', borderRadius: 6, padding: '10px 14px', fontSize: 11, color: '#8A5A2B', lineHeight: 1.55, marginBottom: 14 }}>
            💡 [사내 메모 보내기]를 누르면 <b>{email}</b> 한 명에게만 mainboard 메모함 + 입장 시 팝업으로 전달됩니다. 이 사람의 피드백 {sameUserItems.length}건에 ✉️ <b>"답장 완료"</b> 마크가 박혀요.
            <br/>⚠️ <b>실제 버그 수정/기능 반영 후</b>엔 따로 각 피드백의 <b>[처리 완료로 표시]</b>를 눌러서 ✓ 해결됨으로 마킹해주세요. 답장과 해결은 다른 상태예요.
            <br/>이메일로도 같은 내용 보내려면 [이메일용 복사]를 누르고 본인 메일에서 그 사람한테 보내세요.
          </div>

          <div style={{ display: 'flex', gap: 8, justifyContent: 'flex-end' }}>
            <button
              className="btn btn-ghost"
              onClick={copyEmail}
              style={{ fontSize: 12 }}
            >{copied ? '✓ 복사됨' : '📋 이메일용 복사'}</button>
            <button
              className="btn primary"
              onClick={send}
              disabled={!title.trim() || !body.trim() || sending}
              style={{ fontSize: 12, opacity: (!title.trim() || !body.trim() || sending) ? 0.5 : 1 }}
            >{sending ? '발송 중...' : '📨 사내 메모 보내기'}</button>
          </div>
        </div>
      </div>
    </div>
  );
}

// ✅ 작업 완료 알림 모달: 약속한 작업이 끝났을 때 그분께 "반영됐어요!" 알림 발송 + resolved 마킹
function FeedbackCompletionModal({ target, allItems, onClose, onSent }) {
  const email = (target.email || '').toLowerCase();
  const sameUserItems = allItems.filter(
    it => !it.resolved && (it.email || '').toLowerCase() === email
  );
  const allIds = sameUserItems.map(it => it.id);

  // 사전 답장 여부에 따라 톤 살짝 다르게 (약속 지킨 톤 vs 바로 해결 톤)
  const _hasPriorReply = sameUserItems.some(it => it.replied_at);
  const defaultTitle = _hasPriorReply
    ? `${target.name || ''}님, 약속드린 부분 반영했어요! ✅`
    : `${target.name || ''}님, 피드백 주신 부분 바로 반영했어요! ✅`;
  const defaultBody = (() => {
    const name = target.name || '';
    const greet = _hasPriorReply
      ? `${name}님, 안녕하세요! 유버디예요 :)\n\n${name}님이 보내주신 피드백 반영해서 방금 업데이트 완료했어요. 약속 지킬 수 있어 다행이에요!\n\n반영된 내용:`
      : `${name}님, 안녕하세요! 유버디예요 :)\n\n${name}님이 보내주신 피드백 보고 바로 손봐서 방금 업데이트 완료했어요! 빠르게 알려주신 덕분에 빨리 고칠 수 있었습니다 🙏\n\n반영된 내용:`;
    const list = sameUserItems
      .map(it => `\n• (Day ${it.day || '-'}, ${CAT_LABEL[it.category] || it.category}) "${it.message}"`)
      .join('');
    const action = `\n\n위 부분들 다 손봤어요. 페이지에서 한 번 새로고침(Mac은 Cmd+Shift+R) 해주시면 새 내용으로 보입니다!\n\n또 학습하시다가 어색하거나 막히는 부분, 새로 발견하신 게 있으면 언제든 우상단 💬 피드백 버튼으로 편하게 보내주세요. ${name}님 의견이 진짜 큰 도움 됩니다 :)\n\n오늘도 한 단어, 한 줄 챙겨가는 하루 되세요!\n\n유버디 드림 💛`;
    return greet + list + action;
  })();

  const [title, setTitle] = React.useState(defaultTitle);
  const [body, setBody] = React.useState(defaultBody);
  const [sending, setSending] = React.useState(false);
  const [copied, setCopied] = React.useState(false);

  const send = async () => {
    if (!title.trim() || !body.trim() || sending) return;
    if (!window.OD?.completeFeedback) {
      alert('OD.completeFeedback 함수 없음 (배포 안 됨)');
      return;
    }
    setSending(true);
    const r = await window.OD.completeFeedback({
      feedbackIds: allIds,
      recipientEmail: email,
      title: title.trim(),
      body: body.trim(),
    });
    setSending(false);
    if (!r.ok) {
      alert('완료 알림 발송 실패: ' + (r.error || ''));
      return;
    }
    alert(`${target.name || email} 님께 완료 알림 발송 + 피드백 ${r.count}건 해결됨 마킹 ✅`);
    onSent();
  };

  const copyEmail = async () => {
    const text = `${title}\n\n${body}`;
    try {
      await navigator.clipboard.writeText(text);
      setCopied(true); setTimeout(() => setCopied(false), 2000);
    } catch (e) {
      const ta = document.createElement('textarea');
      ta.value = text; document.body.appendChild(ta); ta.select();
      document.execCommand('copy'); document.body.removeChild(ta);
      setCopied(true); setTimeout(() => setCopied(false), 2000);
    }
  };

  return (
    <div
      onClick={onClose}
      style={{ position: 'fixed', inset: 0, background: 'rgba(40,30,20,0.55)', display: 'flex', alignItems: 'center', justifyContent: 'center', zIndex: 1000, padding: 20 }}
    >
      <div
        onClick={e => e.stopPropagation()}
        style={{ background: '#F4EFE3', borderRadius: 12, maxWidth: 640, width: '100%', maxHeight: '90vh', overflow: 'auto', boxShadow: '0 20px 50px rgba(0,0,0,0.3)' }}
      >
        <div style={{ background: '#2D8A3E', color: '#F4EFE3', padding: '14px 20px', borderRadius: '12px 12px 0 0', display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
          <div>
            <div style={{ fontSize: 11, letterSpacing: '0.12em', opacity: 0.85 }}>작업 완료 알림</div>
            <div style={{ fontSize: 14, fontWeight: 800, marginTop: 2 }}>
              {target.name || '익명'} ({email}) · 피드백 {sameUserItems.length}건 해결됨으로 처리
            </div>
          </div>
          <button onClick={onClose} style={{ background: 'none', border: 'none', color: '#F4EFE3', fontSize: 18, cursor: 'pointer' }}>✕</button>
        </div>
        <div style={{ padding: '18px 22px' }}>
          <div style={{ fontSize: 11, fontWeight: 800, color: '#8A7964', letterSpacing: '0.1em', marginBottom: 6 }}>처리한 피드백 ({sameUserItems.length}건)</div>
          <div style={{ background: '#FAF6EB', border: '1px solid #E8DFCB', borderRadius: 6, padding: '10px 14px', marginBottom: 14, maxHeight: 180, overflow: 'auto' }}>
            {sameUserItems.map(it => (
              <div key={it.id} style={{ fontSize: 12, color: '#2A1F14', lineHeight: 1.55, padding: '6px 0', borderBottom: '1px dashed #D9C9A8' }}>
                <b>Day {it.day || '-'}</b> · {CAT_LABEL[it.category] || it.category}<br/>
                {it.message}
              </div>
            ))}
          </div>

          <div style={{ fontSize: 11, fontWeight: 800, color: '#8A7964', letterSpacing: '0.1em', marginBottom: 6 }}>제목</div>
          <input
            value={title}
            onChange={e => setTitle(e.target.value)}
            style={{ width: '100%', padding: '10px 12px', border: '1px solid #D6C7B0', borderRadius: 6, fontSize: 13, fontFamily: 'inherit', background: '#FFFFFF', marginBottom: 12 }}
          />

          <div style={{ fontSize: 11, fontWeight: 800, color: '#8A7964', letterSpacing: '0.1em', marginBottom: 6 }}>본문 (사내 메모 + 이메일 동일 내용)</div>
          <textarea
            value={body}
            onChange={e => setBody(e.target.value)}
            rows={12}
            style={{ width: '100%', padding: '12px 14px', border: '1px solid #D6C7B0', borderRadius: 6, fontSize: 13, fontFamily: 'inherit', background: '#FFFFFF', lineHeight: 1.65, resize: 'vertical', marginBottom: 14 }}
          />

          <div style={{ background: '#DDEFD9', border: '1px solid #B0D4B4', borderRadius: 6, padding: '10px 14px', fontSize: 11, color: '#2D6E3A', lineHeight: 1.55, marginBottom: 14 }}>
            ✅ [완료 알림 보내기] 누르면 <b>{email}</b>께 사내 메모 + 입장 시 팝업 발송 + 피드백 {sameUserItems.length}건이 <b>해결됨</b>으로 마킹됩니다. 이번주 처리 완료 큐에 자동으로 들어가요.
          </div>

          <div style={{ display: 'flex', gap: 8, justifyContent: 'flex-end' }}>
            <button className="btn btn-ghost" onClick={copyEmail} style={{ fontSize: 12 }}>
              {copied ? '✓ 복사됨' : '📋 이메일용 복사'}
            </button>
            <button
              onClick={send}
              disabled={!title.trim() || !body.trim() || sending}
              style={{ fontSize: 12, padding: '8px 16px', background: '#2D8A3E', color: '#F4EFE3', border: 'none', borderRadius: 4, cursor: 'pointer', fontWeight: 800, fontFamily: 'inherit', opacity: (!title.trim() || !body.trim() || sending) ? 0.5 : 1 }}
            >{sending ? '발송 중...' : '✅ 완료 알림 보내기'}</button>
          </div>
        </div>
      </div>
    </div>
  );
}

// 본문 미리보기 헬퍼: dot-path로 필드 값 꺼내기 + 신고 문장 빨간 박스 하이라이트
function _odGetByPath(obj, path) {
  try { return String(path).split('.').reduce(function (o, k) { return o ? o[k] : undefined; }, obj); }
  catch (e) { return undefined; }
}
function _odHighlight(text, needle) {
  const t = String(text == null ? '' : text);
  if (!needle || t.indexOf(needle) < 0) return [<span key="t0">{t}</span>];
  const parts = t.split(needle);
  const out = [];
  parts.forEach(function (p, i) {
    if (i > 0) out.push(<mark key={'h' + i} style={{ background: '#FBD2C6', color: '#A8462F', border: '2px solid #D85A30', borderRadius: 3, padding: '0 3px', fontWeight: 800 }}>{needle}</mark>);
    out.push(<span key={'t' + i}>{p}</span>);
  });
  return out;
}

// 🤖 AI 콘텐츠 제안 검토: 피드백 triage가 만든 content_edits(pending)을 운영자가 승인/거부.
//   승인 → status=approved → 앱이 부팅 시 SCENARIOS에 덮어씀 (코드배포 없이 라이브 반영).
function ContentEditsReview() {
  const [items, setItems] = React.useState([]);
  const [loading, setLoading] = React.useState(false);
  const [scenarios, setScenarios] = React.useState(null);  // scenarios.json (본문 미리보기용)
  const [scnErr, setScnErr] = React.useState(false);
  const [openPrev, setOpenPrev] = React.useState({});      // edit.id -> 미리보기 펼침
  React.useEffect(() => {
    fetch('scenarios.json').then(function (r) { if (!r.ok) throw new Error('404'); return r.json(); })
      .then(setScenarios).catch(function () { setScnErr(true); });
  }, []);
  const opEmail = React.useMemo(() => {
    try { return (JSON.parse(localStorage.getItem('__OD_USER') || 'null') || {}).email || ''; } catch (e) { return ''; }
  }, []);

  const refresh = React.useCallback(async () => {
    if (!window.OD || !window.OD.getPendingContentEdits) return;
    setLoading(true);
    const r = await window.OD.getPendingContentEdits(opEmail);
    setItems((r && r.ok) ? (r.edits || []) : []);
    setLoading(false);
  }, [opEmail]);

  React.useEffect(() => { refresh(); }, [refresh]);

  const [sent, setSent] = React.useState({});  // feedback_id -> true (알림 보냄 표시)

  const decide = async (e, approve) => {
    if (!approve && !window.confirm('이 제안을 거부할까요?')) return;
    const r = await window.OD.decideContentEdit(e.id, opEmail, approve);
    if (!r || !r.ok) { alert('실패: ' + ((r && r.error) || '')); return; }
    setItems(prev => prev.filter(x => x.id !== e.id));
  };

  // 신고자에게 "반영했어요" 알림 보내기 (자동 아님, 운영자가 직접 눌러야 발송)
  const notifyReporter = async (e) => {
    if (!e.reporter_email || !e.feedback_id) { alert('신고자 정보가 없어요.'); return; }
    const msg = (e.reason ? e.reason + '\n\n' : '') + '소중한 피드백 덕분에 콘텐츠가 더 좋아졌어요. 감사합니다 :)';
    if (!window.confirm('[' + (e.reporter_name || e.reporter_email) + ']님에게 이 내용으로 보낼까요?\n\n' + msg)) return;
    const r = await window.OD.completeFeedback({
      feedbackIds: [e.feedback_id],
      recipientEmail: e.reporter_email,
      title: '주신 피드백, 반영했어요!',
      body: msg,
    });
    if (r && r.ok) setSent(prev => Object.assign({}, prev, { [e.feedback_id]: true }));
    else alert('발송 실패: ' + ((r && r.error) || ''));
  };

  return (
    <div className="section">
      <div className="section-title">
        🤖 AI 콘텐츠 제안 (검사 대기)
        <span style={{ marginLeft: 10, fontSize: 11, fontWeight: 800, color: items.length ? '#A8462F' : '#2D6E3A' }}>
          {items.length ? ('대기 ' + items.length + '건') : '대기 없음 ✓'}
        </span>
        <button className="btn btn-ghost btn-mini" style={{ marginLeft: 12, padding: '2px 10px', fontSize: 11 }} onClick={refresh} disabled={loading}>
          {loading ? '로딩…' : '↻ 새로고침'}
        </button>
      </div>
      <div className="card" style={{ padding: 0 }}>
        {items.length === 0 ? (
          <div className="empty" style={{ padding: 24 }}>{loading ? '로딩 중...' : '검사할 AI 제안이 없어요. (피드백이 들어오면 자동 분석돼 여기 쌓여요)'}</div>
        ) : items.map(e => (
          <div key={e.id} style={{ padding: '14px 18px', borderBottom: '1px solid #E8DFCB' }}>
            <div style={{ display: 'flex', gap: 8, alignItems: 'center', flexWrap: 'wrap', marginBottom: 8 }}>
              <span style={{ background: '#EFE7D6', padding: '3px 10px', borderRadius: 12, fontSize: 11, fontWeight: 700 }}>Day {e.day}</span>
              <span style={{ background: '#2A1F14', color: '#F4EFE3', padding: '3px 10px', borderRadius: 12, fontSize: 11, fontWeight: 700 }}>{e.field}</span>
              <span style={{ fontSize: 11, color: '#8A7964' }}>{e.type} · {e.source}</span>
            </div>
            {(e.reporter_name || e.original_message) && (
              <div style={{ fontSize: 12, color: '#5C4A36', background: '#FBF1DE', border: '1px solid #E8DFCB', borderRadius: 6, padding: '8px 10px', marginBottom: 8, lineHeight: 1.5 }}>
                🚩 <b>{e.reporter_name || '익명'}</b>님 신고{e.reporter_email ? ' (' + e.reporter_email + ')' : ''}: {e.original_message}
              </div>
            )}
            {e.reason && <div style={{ fontSize: 12.5, color: '#5C4A36', lineHeight: 1.5, marginBottom: 8 }}>💡 {e.reason}</div>}
            {e.old_value && (
              <div style={{ fontSize: 12.5, lineHeight: 1.5, marginBottom: 4 }}>
                <span style={{ color: '#A8462F', fontWeight: 700 }}>이전</span>{' '}
                <span style={{ textDecoration: 'line-through', color: '#8A7964' }}>{e.old_value}</span>
              </div>
            )}
            <div style={{ fontSize: 13.5, lineHeight: 1.5, marginBottom: 10, padding: '8px 10px', background: 'rgba(45,110,58,0.07)', borderLeft: '3px solid #2D6E3A', borderRadius: 4 }}>
              <span style={{ color: '#2D6E3A', fontWeight: 800, fontSize: 11 }}>제안 </span> <b>{e.new_value}</b>
            </div>
            <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap' }}>
              <button style={{ background: '#2D6E3A', color: '#fff', border: 'none', padding: '7px 16px', borderRadius: 6, fontSize: 12.5, fontWeight: 800, cursor: 'pointer', fontFamily: 'inherit' }} onClick={() => decide(e, true)}>✓ 승인 (라이브 반영)</button>
              <button className="btn btn-ghost" style={{ padding: '7px 14px', fontSize: 12.5 }} onClick={() => decide(e, false)}>✕ 거부</button>
              {e.reporter_email && e.feedback_id && (
                <button className="btn btn-ghost" style={{ padding: '7px 14px', fontSize: 12.5, color: sent[e.feedback_id] ? '#2D6E3A' : '#A8462F', borderColor: sent[e.feedback_id] ? '#2D6E3A' : '#A8462F' }} disabled={sent[e.feedback_id]} onClick={() => notifyReporter(e)}>
                  {sent[e.feedback_id] ? '✓ 신고자에게 알림 보냄' : '📨 신고자에게 반영 알림'}
                </button>
              )}
              <button className="btn btn-ghost" style={{ padding: '7px 14px', fontSize: 12.5 }} onClick={() => setOpenPrev(prev => Object.assign({}, prev, { [e.id]: !prev[e.id] }))}>
                {openPrev[e.id] ? '🔍 미리보기 닫기' : '🔍 본문 미리보기'}
              </button>
            </div>
            {openPrev[e.id] && (
              <div style={{ marginTop: 10, padding: '12px 14px', background: '#FFFDF6', border: '1px solid #E8DFCB', borderRadius: 8 }}>
                {!scenarios ? (
                  <div style={{ fontSize: 12, color: scnErr ? '#A8462F' : '#8A7964' }}>
                    {scnErr ? '본문 데이터를 못 불러왔어요. scenarios.json을 push했는지 + 라이브 주소(file:// 말고)에서 여는지 확인해주세요.' : '본문 데이터 로딩 중... (scenarios.json)'}
                  </div>
                ) : (() => {
                  const sc = scenarios.find(function (s) { return s.day === e.day; });
                  if (!sc) return <div style={{ fontSize: 12, color: '#A8462F' }}>Day {e.day} 본문을 못 찾았어요.</div>;
                  const val = _odGetByPath(sc, e.field);
                  return (
                    <div>
                      <div style={{ fontSize: 11, fontWeight: 800, color: '#8A5A2B', marginBottom: 6 }}>
                        Day {sc.day} · {sc.word}{sc.meaning ? ' (' + sc.meaning + ')' : ''} · [{e.field}]
                      </div>
                      <div style={{ fontSize: 13, lineHeight: 1.7, color: '#2A1F14', whiteSpace: 'pre-wrap' }}>
                        {val == null ? <span style={{ color: '#A8462F' }}>이 필드가 본문에 안 보여요 (필드명 확인 필요).</span> : _odHighlight(val, e.old_value)}
                      </div>
                    </div>
                  );
                })()}
              </div>
            )}
          </div>
        ))}
      </div>
    </div>
  );
}

function App() {

  const _initUser = load(KEY_USER, null);
  if (!_initUser || !_initUser.isOperator) {
    // 비운영자 또는 비로그인 → 홈으로 튕김
    alert("운영자 전용 페이지입니다.");
    window.location.replace("onboarding.html");
    return null;
  }

  const [invites, setInvites] = useState(() => load(KEY_INVITES, []));
  const [currentUser, setCurrentUser] = useState(() => _initUser);
  const [notices, setNotices] = useState(() => load(KEY_NOTICES, []));

  // ★ 2차 검증, DB의 is_operator 도 확인 (localStorage 위조 방지)
  React.useEffect(() => {
    let cancelled = false;
    const verify = async () => {
      let tries = 0;
      while ((!window.OD || !window.OD.enabled) && tries++ < 30) {
        await new Promise(r => setTimeout(r, 200));
      }
      if (cancelled || !window.OD || !window.OD.enabled) return;
      const r = await window.OD.fetchByEmail(_initUser.email);
      if (!r.ok || !r.user || !r.user.is_operator) {
        alert("운영자 권한 검증 실패. 다시 로그인해주세요.");
        window.location.replace("onboarding.html");
      }
    };
    verify();
    return () => { cancelled = true; };
  }, []);

  const [newName, setNewName] = useState("");
  const [newNote, setNewNote] = useState("");

  const [draftTitle, setDraftTitle] = useState("");
  const [draftBody, setDraftBody] = useState("");
  const [draftType, setDraftType] = useState("notice");
  const [draftPopup, setDraftPopup] = useState(false);
  const [editingId, setEditingId] = useState(null);  // null이면 새 공지, 값 있으면 수정 중
  const [readCounts, setReadCounts] = useState({});   // { 'db-<id>': 확인자수 }

      showToast(`${u.name} 퇴직 처리됨 · 마지막 출근일 ${endDate}`);

    const res = await window.OD.restoreMembership(u.email);

      showToast(`${u.name} 복직 완료 · 만료일 해제`);

  // 만료일까지 남은 일수 계산 (음수면 이미 만료)
  const daysUntilEnd = (isoStr) => {

    const ms = new Date(isoStr).getTime() - Date.now();
    return Math.ceil(ms / 86400000);

  useEffect(() => {

      if (e.key === KEY_INVITES) setInvites(load(KEY_INVITES, []));
      if (e.key === KEY_USER) setCurrentUser(load(KEY_USER, null));
      if (e.key === KEY_NOTICES) setNotices(load(KEY_NOTICES, []));
    };
    window.addEventListener('storage', onStorage);
    return () => window.removeEventListener('storage', onStorage);
  }, []);

  const issueCode = () => {
    if (!newName.trim()) return;
    const code = genCode();
    const next = [{
      code, name: newName.trim(), note: newNote.trim(),
      issuedAt: new Date().toISOString(),
      usedAt: null, usedBy: null,
      currentDay: null, lastActive: null,
    }, ...invites];
    setInvites(next); save(KEY_INVITES, next);
    setNewName(""); setNewNote("");
    if (navigator.clipboard) {
      navigator.clipboard.writeText(code).then(() => showToast(`${code} 발급 완료 · 클립보드 복사됨`));
    } else {
      showToast(`${code} 발급 완료`);
    }
  };

  const revokeCode = (code) => {
    if (!confirm(`${code} 코드 삭제할까요?`)) return;
    const next = invites.filter(i => i.code !== code);
    setInvites(next); save(KEY_INVITES, next);
  };

  const copyCode = (code) => {
    if (navigator.clipboard) {
      navigator.clipboard.writeText(code).then(() => showToast(`${code} 복사됨`));
    }
  };

  const opsJumpDay = (delta) => {
    if (!currentUser) { alert("이 기기에 등록된 사용자가 없어요."); return; }
    // ★ dayInCompany 가 undefined/null/NaN 이면 1로 폴백. NaN + 7 = NaN → Math.max(1, NaN) = 1 버그 방지.
    const cur = Number.isFinite(currentUser.dayInCompany) ? currentUser.dayInCompany : 1;
    const newDay = Math.max(1, Math.min(365, cur + delta));
    const u = { ...currentUser, dayInCompany: newDay };
    setCurrentUser(u); save(KEY_USER, u);
    showToast(`Day ${newDay}로 이동`);
  };
  const opsSetDay = () => {
    if (!currentUser) { alert("이 기기에 등록된 사용자가 없어요."); return; }
    const cur = Number.isFinite(currentUser.dayInCompany) ? currentUser.dayInCompany : 1;
    const v = prompt("이동할 Day (1-365):", String(cur));
    if (!v) return;
    const n = Math.max(1, Math.min(365, parseInt(v, 10) || 1));
    const u = { ...currentUser, dayInCompany: n };
    setCurrentUser(u); save(KEY_USER, u);
    showToast(`Day ${n}로 이동`);
  };
  const opsResetUser = () => {
    if (!confirm("이 기기 사용자 데이터를 모두 지울까요?")) return;

  };

  const loadNotices = async () => {
    if (!window.OD || !window.OD.enabled || !window.OD.fetchNotices) return;
    const r = await window.OD.fetchNotices(50);
    if (r.ok && r.notices) {
      const mapped = r.notices.map(n => ({
        id: n.id, type: n.type, title: n.title, body: n.body,
        from: n.from_name, at: n.sent_at, popup: !!n.popup,
        target_emails: n.target_emails || null,
      }));
      setNotices(mapped); save(KEY_NOTICES, mapped);
    }
    // 공지별 확인자 수 집계

      const rc = await window.OD.fetchNoticeReadCounts();
      if (rc.ok) setReadCounts(rc.counts || {});
    }
  };

  // 마운트 시 window.OD 준비되면 DB 공지 로드
  React.useEffect(() => {

    (async () => {
      let tries = 0;
      while ((!window.OD || !window.OD.enabled || !window.OD.fetchNotices) && tries++ < 30) {
        await new Promise(r => setTimeout(r, 200));
      }
      if (!cancelled) loadNotices();
    })();
    return () => { cancelled = true; };
  }, []);

    showToast("수정 모드, 내용을 확인하고 고친 뒤 저장하세요");

  };

    if (!draftTitle.trim() || !draftBody.trim()) return;
    if (!window.OD || !window.OD.enabled || !window.OD.sendNotice) {
      showToast("DB 연결 대기 중. 잠시 후 다시 시도해주세요.");
      return;
    }
    const payload = {
      type: draftType,
      title: draftTitle.trim(),
      body: draftBody.trim(),
      popup: draftPopup,
    };
    let r;
    if (editingId) {
      r = await window.OD.updateNotice(editingId, payload);
    } else {
      r = await window.OD.sendNotice({ ...payload, fromName: "유버디 (Buddy)" });

    if (!r.ok) { showToast((editingId ? "수정" : "발송") + " 실패: " + (r.error || "알 수 없는 오류")); return; }

    if (!window.OD || !window.OD.enabled || !window.OD.deleteNotice) {
      showToast("DB 연결 대기 중. 잠시 후 다시 시도해주세요.");

    const r = await window.OD.deleteNotice(id);
    if (!r.ok) { showToast("삭제 실패: " + (r.error || "알 수 없는 오류")); return; }
    showToast("공지 삭제됨");
    if (editingId === id) resetDraft();
    loadNotices();
  };

  const exportData = () => {
    const blob = new Blob([JSON.stringify({ user: currentUser, invites, notices }, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `1ilbi-data-${new Date().toISOString().slice(0,10)}.json`;
    a.click(); URL.revokeObjectURL(url);
  };

  const totalIssued = invites.length;
  const totalUsed = invites.filter(i => i.usedAt).length;
  const totalActive = invites.filter(i => i.lastActive && (Date.now() - new Date(i.lastActive).getTime()) < 24*60*60*1000).length;

  return (
    <>

        <div className="pill">BUDDY · OPERATOR</div>
        <div className="spacer" />
        <a className="toggle" href="mainboard.html?dev=1">▶ 플레이어 + Dev 패널</a>
        <a className="toggle" href="mainboard.html">▶ 플레이어 (일반)</a>
        <a className="toggle" href="dev.html">↩ 개발 런처</a>
        <a className="toggle" onClick={() => {
          if (!confirm("로그아웃 하시겠어요?")) return;
          const keysToRemove = [];
          for (let i = 0; i < localStorage.length; i++) {
            const k = localStorage.key(i);
            if (k === "__OD_USER" || k.startsWith("__OD_TASKS_") || k.startsWith("__OD_TOUR_")) {
              keysToRemove.push(k);
            }
          }
          keysToRemove.forEach(k => localStorage.removeItem(k));
          window.location.href = "onboarding.html";

          🚪 로그아웃
        </a>
      </div>

            ? "🟢 Supabase 연결, 모든 사용자 실시간 추적 중."
            : "⚪ Supabase 미연결, lib/supabase-config.js 설정 필요. 지금은 이 기기 데이터만 보임."}
        </div>

        {/* ★ 학습 데이터 조회 (2026-05-19 추가): 사용자별 N일차 영작·노트·일지 즉시 보기 */}
        {supaEnabled && <LearningQueryCard />}

                <div style={{ background: '#FBEEDF', border: '1px solid #E7C9A3', borderRadius: 6, padding: '8px 12px', marginBottom: 12, fontSize: 12, color: '#8A5A2B', display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                  <span>✏️ 수정 모드, 기존 공지를 고치는 중</span>
                  <button onClick={resetDraft} style={{ background: 'none', border: 'none', color: '#A8462F', fontSize: 12, cursor: 'pointer', textDecoration: 'underline' }}>새 공지 작성</button>
                </div>
              ) : null}
              <div className="form-row">
                <label>유형</label>
                <select value={draftType} onChange={e => setDraftType(e.target.value)}>

              </div>

                <div className="empty" style={{ padding: 16 }}>아직 공지 없음.</div>

                  style={{ position: 'relative', cursor: 'pointer', outline: editingId === n.id ? '2px solid #D8923A' : 'none' }}
                >

                  <div style={{ color: '#5C4A36', marginTop: 4, fontSize: 12, lineHeight: 1.5 }}>{(n.body || '').slice(0, 100)}{(n.body || '').length > 100 ? "…" : ""}</div>
                  <div style={{ marginTop: 6, fontSize: 11, color: '#6E8A5C', fontWeight: 700 }}>👁 확인 {reads}명</div>
                  <button
                    onClick={(e) => { e.stopPropagation(); removeNotice(n.id); }}

        {/* 💬 피드백 모아보기 (사용자가 보낸 의견) */}

              <button className="btn btn-ghost btn-mini" style={{ marginLeft: 12, padding: '2px 10px', fontSize: 11 }} onClick={refreshSupabase} disabled={supaLoading}>
                {supaLoading ? "로딩…" : "↻ 새로고침"}
              </button>
            </div>
            {supaStats && (
              <div className="grid-2" style={{ marginBottom: 14 }}>
                <div className="card">
                  <div className="title">전체 가입자</div>
                  <div style={{ fontSize: 28, fontWeight: 900 }}>{supaStats.total_users || 0}</div>
                  <div style={{ fontSize: 11, color: '#8A7964', marginTop: 6 }}>
                    24h 활성 {supaStats.active_24h || 0} · 7d 활성 {supaStats.active_7d || 0}
                  </div>
                </div>
                <div className="card">
                  <div className="title">평균 진도 / 마일스톤</div>
                  <div style={{ fontSize: 28, fontWeight: 900 }}>Day {Math.round(supaStats.avg_day || 1)}</div>
                  <div style={{ fontSize: 11, color: '#8A7964', marginTop: 6 }}>
                    Day14 도달 {supaStats.reached_day14 || 0} · Day30 {supaStats.reached_day30 || 0} · Day180 {supaStats.reached_day180 || 0}
                  </div>
                </div>
              </div>

            {supaUsers.length > 0 && (() => {
              const now = new Date();

              const ends = u => u.membership_ends_at ? new Date(u.membership_ends_at) : null;
              const isMember = u => u.cohort === 'member';
              const activePaid = real.filter(u => isMember(u) && !u.membership_cancel_reason && (ends(u) ? ends(u) > now : true));
              const canceling  = real.filter(u => u.membership_cancel_reason && ends(u) && ends(u) > now);
              const expired    = real.filter(u => isMember(u) && ends(u) && ends(u) <= now);
              const beta       = real.filter(u => u.is_pilot_hire && !isMember(u) && (!ends(u) || ends(u) > now));
              const cell = (label, n, color) => (
                <div style={{ flex: '1 1 110px', background: '#fff', border: '1px solid #E8DFCB', borderRadius: 8, padding: '12px 14px' }}>

                  <div style={{ display: 'flex', flexWrap: 'wrap', gap: 8 }}>
                    {cell('🟢 정상 활성', activePaid.length, '#2D6E3A')}

                    {cell('🧪 베타', beta.length, '#3D4DA8')}
                  </div>
                </div>

            })()}
            {supaUsers.length > 0 && <CsvSyncPanel supaUsers={supaUsers} onDone={refreshSupabase} />}
            {supaUsers.length > 0 && (
              <details style={{ marginBottom: 16 }}>

                </summary>
                <div className="card" style={{ padding: 0, marginTop: 8 }}>
                  {(() => {

                    const learners = supaUsers
                      .filter(u => !u.is_operator && !u.is_dev_mode)

                </div>
                <div style={{ fontSize: 11, color: '#8A7964', marginTop: 12, lineHeight: 1.6 }}>
                  ✏️ Day 변경 후 <a href="mainboard.html" style={{ color: '#D85A2A' }}>시뮬레이터</a> 새로고침으로 적용.
                  테스터와 동시 디버깅하려면 <a href="mainboard.html?dev=1" style={{ color: '#D85A2A' }}>?dev=1</a> 모드.
                </div>
              </>
            ) : (
              <div style={{ textAlign: 'center', padding: 20, color: '#8A7964' }}>
                이 기기엔 등록된 사용자가 없어요. <a href="onboarding.html" style={{ color: '#D85A2A' }}>온보딩</a>으로 직접 가입하거나, 위에서 코드 발급 후 그 코드로 가입.
              </div>
            )}
          </div>
        </div>

        <div className="section">
          <div className="section-title">📥 데이터 백업</div>
          <div className="card">
            <button className="btn btn-ghost" onClick={exportData}>JSON으로 export</button>
            <div style={{ fontSize: 11, color: '#8A7964', marginTop: 10, lineHeight: 1.6 }}>
              localStorage는 브라우저 캐시 지우면 날아가니 자주 백업.
            </div>
          </div>
        </div>
      </div>

      {previewNotice && (
        <div
          onClick={() => setPreviewNotice(null)}
          style={{ position: 'fixed', inset: 0, background: 'rgba(40,30,20,0.55)', display: 'flex', alignItems: 'center', justifyContent: 'center', zIndex: 1000, padding: 20 }}
        >
          <div
            onClick={e => e.stopPropagation()}
            style={{ background: '#F4EFE3', borderRadius: 12, maxWidth: 480, width: '100%', maxHeight: '85vh', overflow: 'auto', boxShadow: '0 20px 50px rgba(0,0,0,0.3)' }}
          >
            <div style={{ background: '#2A2118', color: '#F4EFE3', padding: '12px 18px', borderRadius: '12px 12px 0 0', display: 'flex', justifyContent: 'space-between', alignItems: 'center', fontSize: 12, letterSpacing: '0.14em', fontWeight: 800 }}>
              <span>사용자 팝업 미리보기</span>
              <button onClick={() => setPreviewNotice(null)} style={{ background: 'none', border: 'none', color: '#F4EFE3', fontSize: 16, cursor: 'pointer' }}>✕</button>
            </div>
            <div style={{ padding: '20px 22px' }}>
              <div style={{ fontSize: 11, color: '#8A7964', fontWeight: 700 }}>
                {Array.isArray(previewNotice.target_emails) && previewNotice.target_emails.length > 0
                  ? `1:1 답장 · ${previewNotice.target_emails.length}명에게만 전달`
                  : ({ notice: '공지', event: '이벤트', ceo: '버디 톡', 'event-novelty': '이벤트' }[previewNotice.type] || '공지')}
                {previewNotice.popup ? ' · 🔔 입장 시 팝업' : ''}
              </div>
              <div style={{ fontSize: 21, fontWeight: 900, lineHeight: 1.3, marginTop: 6, color: '#2A2118' }}>{previewNotice.title}</div>
              <div style={{ marginTop: 12, display: 'flex', gap: 10, alignItems: 'center', paddingBottom: 14, borderBottom: '1px dashed #D9C9A8' }}>
                <div style={{ width: 36, height: 36, borderRadius: '50%', background: '#E8915C', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 15 }}>🐥</div>
                <div style={{ fontSize: 12, color: '#5C4A36' }}>
                  <b>{previewNotice.from || '유버디 (Buddy)'}</b><br/>
                  <span style={{ color: '#8A7964' }}>
                    받는 사람: {Array.isArray(previewNotice.target_emails) && previewNotice.target_emails.length > 0
                      ? previewNotice.target_emails.join(', ')
                      : '전 직원'}
                  </span>
                </div>
              </div>
              <div style={{ marginTop: 16, fontSize: 14, lineHeight: 1.75, color: '#2A2118', whiteSpace: 'pre-wrap', wordBreak: 'keep-all' }}>
                {previewNotice.body}
              </div>
              <div style={{ display: 'flex', gap: 8, marginTop: 22 }}>
                <button
                  className="btn primary"
                  onClick={() => { startEditNotice(previewNotice); setPreviewNotice(null); }}
                >✏️ 이 공지 수정하기</button>
                <button className="btn btn-ghost" onClick={() => setPreviewNotice(null)}>닫기</button>
              </div>
            </div>
          </div>
        </div>
      )}

      {toast && <div className="copy-toast">{toast}</div>}
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
